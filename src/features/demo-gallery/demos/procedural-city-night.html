<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Procedural City</title>
<meta name="category" content="scenes" />
<meta name="order" content="1" />
<meta name="capture" content="3500" />
<meta name="tags" content="Three.js, instancing, shader windows, bloom, day/night" />
<meta name="description" content="A whole city generated at load: thousands of instanced towers with shader-drawn windows that switch on at dusk, streams of headlights and taillights on every street, blinking aviation lights, bloom and a day-to-night slider. Tests scale, instancing and mood." />
<meta name="prompt" content="Create a single-file Three.js procedural city at night: instanced buildings with downtown skyscrapers, windows drawn in the shader that light up randomly at dusk, car headlights and taillights flowing along the streets, red blinking roof lights, stars, bloom, and a slider from noon to midnight. Slow orbit camera you can drag." />
<style>
  :root { --ink: #eef3ff; --muted: #93a0bd; --panel: rgba(8, 12, 24, 0.6); --accent: #ffcf6e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #03050c; color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  canvas { display: block; }
  .title { position: fixed; left: 20px; top: 18px; pointer-events: none; }
  .title h1 { margin: 0; font-size: 20px; }
  .title p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  #panel { position: fixed; left: 16px; bottom: 16px; width: 280px; padding: 14px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); font-size: 12.5px; }
  #panel label { display: grid; grid-template-columns: 56px 1fr 48px; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  #panel output { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btns button { border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--ink); border-radius: 9px; padding: 6px 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btns button.on { background: var(--accent); color: #241703; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 11.5px; }
  #stats { position: fixed; right: 18px; top: 18px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 600px) { #panel { left: 10px; right: 10px; width: auto; } #stats { display: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="title"><h1>Procedural City</h1><p>generated at load · instanced towers · shader windows</p></div>
<div id="stats"></div>
<div id="panel">
  <label>Time <input id="time" type="range" min="0" max="1" step="0.001" value="0.86"><output id="time-o"></output></label>
  <label>Traffic <input id="traffic" type="range" min="0" max="1" step="0.01" value="0.75"><output id="traffic-o"></output></label>
  <div class="btns"><button id="cycle">Day cycle</button><button id="orbit" class="on">Orbit</button><button id="regen">New city</button></div>
  <div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 4000);
camera.position.set(420, 230, 470);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 20, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 60;
controls.maxDistance = 1100;

// City > seeded rng so "New city" is reproducible per seed
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const BLOCK = 46, ROAD = 14, N = 13, CELL = BLOCK + ROAD, HALF = (N * CELL) / 2;

// City > ground: asphalt + sidewalks + lane dashes drawn on a canvas texture
function groundTexture() {
  const c = document.createElement('canvas');
  const px = 2048; c.width = c.height = px;
  const g = c.getContext('2d');
  const k = px / (N * CELL);
  g.fillStyle = '#16181d'; g.fillRect(0, 0, px, px);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = (i * CELL + ROAD / 2) * k, y = (j * CELL + ROAD / 2) * k;
    g.fillStyle = '#2a2c31'; g.fillRect(x - 2.5 * k, y - 2.5 * k, (BLOCK + 5) * k, (BLOCK + 5) * k);
    g.fillStyle = '#1c1e22'; g.fillRect(x, y, BLOCK * k, BLOCK * k);
  }
  g.strokeStyle = 'rgba(230,200,120,0.55)'; g.lineWidth = 0.5 * k; g.setLineDash([3 * k, 4 * k]);
  for (let i = 0; i <= N; i++) {
    const p = i * CELL * k;
    g.beginPath(); g.moveTo(p, 0); g.lineTo(p, px); g.stroke();
    g.beginPath(); g.moveTo(0, p); g.lineTo(px, p); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// City > street glow: sodium lamp pools along every road, emissive at night
function glowTexture() {
  const c = document.createElement('canvas');
  const px = 1024; c.width = c.height = px;
  const g = c.getContext('2d');
  const k = px / (N * CELL);
  g.fillStyle = '#000'; g.fillRect(0, 0, px, px);
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N * 3; j++) {
    const p = i * CELL * k, q = (j * CELL / 3) * k;
    for (const [x, y] of [[p, q], [q, p]]) {
      const gr = g.createRadialGradient(x, y, 0, x, y, 9 * k);
      gr.addColorStop(0, 'rgba(255,160,70,0.9)'); gr.addColorStop(1, 'rgba(255,120,40,0)');
      g.fillStyle = gr; g.fillRect(x - 9 * k, y - 9 * k, 18 * k, 18 * k);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(N * CELL, N * CELL), new THREE.MeshStandardMaterial({ map: groundTexture(), emissiveMap: glowTexture(), emissive: 0xffffff, emissiveIntensity: 0, roughness: 0.85, metalness: 0.0 }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(-ROAD / 2 + 0.0, 0, 0);
ground.receiveShadow = true;
scene.add(ground);
const outer = new THREE.Mesh(new THREE.CircleGeometry(2400, 64), new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 1 }));
outer.rotation.x = -Math.PI / 2; outer.position.y = -0.2;
scene.add(outer);

// City > buildings: shared material, windows computed in fragment shader from world position
const night = { value: 0.86 };
const bMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.25 });
bMat.onBeforeCompile = (sh) => {
  sh.uniforms.uNight = night;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nattribute vec3 aInfo; varying vec3 vInfo; varying vec3 vWPos; varying vec3 vWNrm;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvInfo = aInfo; vec4 wp4 = modelMatrix * instanceMatrix * vec4(transformed, 1.0); vWPos = wp4.xyz; vWNrm = normalize(mat3(modelMatrix * instanceMatrix) * objectNormal);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
uniform float uNight; varying vec3 vInfo; varying vec3 vWPos; varying vec3 vWNrm;
float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }`)
    .replace('#include <color_fragment>', `#include <color_fragment>
vec3 an = abs(vWNrm);
float facade = step(an.y, 0.5);
float u = an.x > an.z ? vWPos.z : vWPos.x;
vec2 cell = vec2(u / vInfo.y, vWPos.y / 4.0);
vec2 f = fract(cell);
float win = facade * step(0.18, f.x) * step(f.x, 0.82) * step(0.28, f.y) * step(f.y, 0.85) * step(1.5, vWPos.y) * step(vWPos.y, vInfo.z - 2.5);
diffuseColor.rgb *= mix(1.0, 0.35, win);
float roof = step(0.5, an.y);
diffuseColor.rgb *= mix(1.0, 0.75, roof);`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
vec2 id = floor(cell) + vInfo.x * 37.0;
float r = h21(id);
float lit = step(1.0 - (0.08 + 0.32 * smoothstep(0.45, 0.85, uNight)), r) * win;
vec3 warm = mix(vec3(1.0, 0.72, 0.38), vec3(1.0, 0.9, 0.7), h21(id + 3.1));
vec3 cool = vec3(0.55, 0.75, 1.0);
vec3 wc = mix(warm, cool, step(0.82, h21(id + 7.7)));
totalEmissiveRadiance += wc * lit * (0.35 + 0.9 * h21(id + 1.3)) * smoothstep(0.35, 0.8, uNight);
// daytime glass glint
totalEmissiveRadiance += vec3(0.25, 0.35, 0.45) * win * (1.0 - smoothstep(0.3, 0.6, uNight)) * 0.25;`);
};

const tint = [0x8b8f99, 0x9aa0a8, 0x7a7f8a, 0xa69f94, 0x6f7480, 0xb0a99c, 0x5d6370];
let buildings, lights, lightPhase = [];
function buildCity() {
  if (buildings) { scene.remove(buildings); buildings.geometry.dispose(); scene.remove(lights); }
  const boxes = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x0 = -HALF + i * CELL + ROAD / 2, z0 = -HALF + j * CELL + ROAD / 2;
    const cx = x0 + BLOCK / 2 - ROAD / 2, cz = z0 + BLOCK / 2;
    const dc = Math.hypot(cx, cz) / HALF;
    // park blocks: a few empty
    if (rnd() < 0.05 && dc > 0.25) continue;
    const split = rnd() < 0.55 ? 2 : rnd() < 0.5 ? 1 : 3;
    const sub = BLOCK / split;
    for (let a = 0; a < split; a++) for (let b = 0; b < split; b++) {
      const w = sub * (0.72 + rnd() * 0.22), d = sub * (0.72 + rnd() * 0.22);
      const core = Math.max(0, 1 - dc * 1.15);
      let h = 8 + rnd() * 18 + core * core * (40 + rnd() * 90);
      if (core > 0.55 && rnd() < 0.18) h += 40 + rnd() * 60;
      boxes.push({ x: x0 + sub * (a + 0.5) - ROAD / 2, z: z0 + sub * (b + 0.5), w, d, h, col: tint[(rnd() * tint.length) | 0], win: 3.4 + rnd() * 1.4 });
      // setback tower on tall ones
      if (h > 80 && rnd() < 0.6) boxes.push({ x: x0 + sub * (a + 0.5) - ROAD / 2, z: z0 + sub * (b + 0.5), w: w * 0.62, d: d * 0.62, h: h + 15 + rnd() * 35, col: tint[(rnd() * tint.length) | 0], win: 2.6 + rnd() * 1.2 });
    }
  }
  const geo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  const info = new Float32Array(boxes.length * 3);
  boxes.forEach((b, k) => info.set([rnd() * 1000, b.win, b.h], k * 3));
  geo.setAttribute('aInfo', new THREE.InstancedBufferAttribute(info, 3));
  buildings = new THREE.InstancedMesh(geo, bMat, boxes.length);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  boxes.forEach((b, k) => {
    m.compose(new THREE.Vector3(b.x, 0, b.z), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, b.d));
    buildings.setMatrixAt(k, m);
    buildings.setColorAt(k, c.set(b.col));
  });
  buildings.castShadow = buildings.receiveShadow = true;
  scene.add(buildings);
  // City > aviation lights: red blinkers on roofs above 110
  const tall = boxes.filter((b) => b.h > 110);
  lights = new THREE.InstancedMesh(new THREE.SphereGeometry(1.1, 8, 6), new THREE.MeshBasicMaterial({ color: 0xff2a1a, toneMapped: false }), tall.length);
  lightPhase = tall.map(() => rnd() * Math.PI * 2);
  tall.forEach((b, k) => lights.setMatrixAt(k, m.makeTranslation(b.x, b.h + 1.5, b.z)));
  scene.add(lights);
  $('stats').dataset.n = boxes.length;
}
buildCity();

// City > traffic: instanced emissive head (white) + tail (red) light pairs on lane centers
const CARS = 1400;
const carGeo = new THREE.BoxGeometry(1.4, 0.7, 3.2);
const head = new THREE.InstancedMesh(carGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.5, 1.25), toneMapped: false }), CARS);
const tail = new THREE.InstancedMesh(carGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(2.2, 0.15, 0.08), toneMapped: false }), CARS);
scene.add(head, tail);
const cars = Array.from({ length: CARS }, () => {
  const axis = rnd() < 0.5 ? 'x' : 'z';
  const lane = ((rnd() * (N + 1)) | 0) * CELL - HALF - ROAD / 2 + (axis === 'x' ? 0 : 0);
  const dir = rnd() < 0.5 ? 1 : -1;
  return { axis, lane, dir, s: rnd() * N * CELL - HALF, v: 22 + rnd() * 26 };
});
const dummy = new THREE.Object3D();
function updateCars(dt, density) {
  const shown = Math.floor(CARS * density);
  head.count = tail.count = shown;
  for (let k = 0; k < shown; k++) {
    const c = cars[k];
    c.s += c.v * c.dir * dt;
    if (c.s > HALF) c.s -= N * CELL; else if (c.s < -HALF) c.s += N * CELL;
    // head/tail lanes split by direction so streams read as two-way traffic
    const off = c.dir * 3.2;
    const x = c.axis === 'x' ? c.s : c.lane + off, z = c.axis === 'x' ? c.lane + off - ROAD / 2 + ROAD / 2 : c.s;
    dummy.rotation.set(0, c.axis === 'x' ? Math.PI / 2 : 0, 0);
    // headlights face travel direction: head instance leads, tail trails
    const fx = c.axis === 'x' ? c.dir : 0, fz = c.axis === 'z' ? c.dir : 0;
    dummy.position.set(x + fx * 1.8, 0.9, z + fz * 1.8); dummy.updateMatrix(); head.setMatrixAt(k, dummy.matrix);
    dummy.position.set(x - fx * 1.8, 0.9, z - fz * 1.8); dummy.updateMatrix(); tail.setMatrixAt(k, dummy.matrix);
  }
  head.instanceMatrix.needsUpdate = tail.instanceMatrix.needsUpdate = true;
}

// Sky > gradient dome, stars, moon; colors lerp by night factor
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uNight: night, uSun: { value: new THREE.Vector3() } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform float uNight; uniform vec3 uSun; varying vec3 vDir;
  void main(){
    float y = clamp(vDir.y, 0.0, 1.0);
    vec3 dayTop = vec3(0.25, 0.5, 0.9), dayHor = vec3(0.75, 0.85, 0.95);
    vec3 duskTop = vec3(0.12, 0.12, 0.35), duskHor = vec3(1.0, 0.45, 0.25);
    vec3 nightTop = vec3(0.004, 0.008, 0.03), nightHor = vec3(0.04, 0.05, 0.12);
    float n = uNight;
    vec3 top = n < 0.5 ? mix(dayTop, duskTop, smoothstep(0.25, 0.5, n)) : mix(duskTop, nightTop, smoothstep(0.5, 0.8, n));
    vec3 hor = n < 0.5 ? mix(dayHor, duskHor, smoothstep(0.25, 0.5, n)) : mix(duskHor, nightHor, smoothstep(0.5, 0.8, n));
    vec3 c = mix(hor, top, pow(y, 0.5));
    float s = max(dot(normalize(vDir), normalize(uSun)), 0.0);
    c += vec3(1.0, 0.7, 0.4) * pow(s, 60.0) * (1.0 - smoothstep(0.5, 0.75, n)) * 2.0;
    // city glow on horizon at night
    c += vec3(0.35, 0.22, 0.12) * exp(-y * 9.0) * smoothstep(0.5, 0.9, n) * 0.25;
    gl_FragColor = vec4(c, 1.0);
  }`,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2500, 32, 16), skyMat));
const starGeo = new THREE.BufferGeometry();
const sp = new Float32Array(2500 * 3);
for (let i = 0; i < 2500; i++) {
  const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, y = Math.abs(u) * 0.95 + 0.05;
  const r = Math.sqrt(1 - y * y);
  sp.set([Math.cos(th) * r * 2300, y * 2300, Math.sin(th) * r * 2300], i * 3);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, depthWrite: false, fog: false }));
scene.add(stars);
const moon = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.4, 1.35, 1.2), toneMapped: false, fog: false }));
moon.position.set(-900, 700, -1500);
scene.add(moon);

const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2622, 1);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -450, right: 450, top: 450, bottom: -450, near: 10, far: 1600 });
sun.shadow.bias = -0.0005;
scene.add(hemi, sun, sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.4, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// HUD > controls
let cycle = false;
const opts = { time: 0.86, traffic: 0.75 };
const fmtTime = (t) => { const h = (12 + t * 12) % 24; return `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`; };
for (const k of Object.keys(opts)) {
  const el = $(k);
  const show = () => { opts[k] = Number(el.value); $(`${k}-o`).textContent = k === 'time' ? fmtTime(opts[k]) : `${Math.round(opts[k] * 100)}%`; };
  el.addEventListener('input', () => { show(); if (k === 'time') { cycle = false; $('cycle').classList.remove('on'); } });
  show();
}
$('cycle').onclick = () => { cycle = !cycle; $('cycle').classList.toggle('on', cycle); };
$('orbit').onclick = () => { controls.autoRotate = !controls.autoRotate; $('orbit').classList.toggle('on', controls.autoRotate); };
$('regen').onclick = () => { seed = (Math.random() * 1e6) | 0 || 1; buildCity(); };

// Sky > horizon color, same curve as sky shader (kept in sync for fog)
const DAY_H = new THREE.Color(0.75, 0.85, 0.95), DUSK_H = new THREE.Color(1.0, 0.45, 0.25), NIGHT_H = new THREE.Color(0.04, 0.05, 0.12), GLOW = new THREE.Color(0.35, 0.22, 0.12);
function horizonColor(n) {
  const c = n < 0.5 ? DAY_H.clone().lerp(DUSK_H, THREE.MathUtils.smoothstep(n, 0.25, 0.5)) : DUSK_H.clone().lerp(NIGHT_H, THREE.MathUtils.smoothstep(n, 0.5, 0.8));
  return c.add(GLOW.clone().multiplyScalar(THREE.MathUtils.smoothstep(n, 0.5, 0.9) * 0.25));
}

// Sky > lighting rig per time of day
function applyTime(n) {
  night.value = n;
  const elev = Math.cos(n * Math.PI) * 0.9 + 0.08;
  const sunDir = new THREE.Vector3(0.6, Math.max(0.02, elev), 0.35).normalize();
  skyMat.uniforms.uSun.value.copy(sunDir);
  sun.position.copy(sunDir).multiplyScalar(800);
  const dayK = 1 - THREE.MathUtils.smoothstep(n, 0.35, 0.72);
  sun.intensity = 2.6 * dayK + 0.12;
  sun.color.setHSL(0.09, 0.6 * (1 - dayK) + 0.1, 0.6 + 0.3 * dayK);
  hemi.intensity = 0.06 + 1.1 * dayK;
  hemi.color.setHSL(0.6, 0.5, 0.35 + 0.4 * dayK);
  stars.material.opacity = THREE.MathUtils.smoothstep(n, 0.62, 0.85);
  ground.material.emissiveIntensity = 0.55 * THREE.MathUtils.smoothstep(n, 0.45, 0.75);
  moon.visible = n > 0.6;
  scene.fog = scene.fog || new THREE.FogExp2(0x000000, 0.0011);
  // fog = sky horizon color so the ground disk edge melts into the sky
  scene.fog.color.copy(horizonColor(n));
  renderer.toneMappingExposure = 0.85 + 0.1 * (1 - dayK);
  bloom.strength = 0.15 + 0.55 * (1 - dayK);
  head.visible = tail.visible = true;
  head.material.color.setRGB(1.6, 1.5, 1.25).multiplyScalar(0.4 + 0.6 * (1 - dayK));
  tail.material.color.setRGB(2.2, 0.15, 0.08).multiplyScalar(0.4 + 0.6 * (1 - dayK));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
let fpsN = 0, fpsT = 0, fps = 60;
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (cycle) {
    opts.time = (opts.time + dt * 0.02) % 1;
    $('time').value = opts.time; $('time-o').textContent = fmtTime(opts.time);
  }
  applyTime(opts.time);
  updateCars(dt, opts.traffic);
  const m = new THREE.Matrix4(), pos = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  for (let k = 0; k < lights.count; k++) {
    lights.getMatrixAt(k, m); m.decompose(pos, q, s);
    const on = Math.sin(t * 2.4 + lightPhase[k]) > 0.55 ? 1 : 0.05;
    m.compose(pos, q, s.setScalar(on));
    lights.setMatrixAt(k, m);
  }
  lights.instanceMatrix.needsUpdate = true;
  controls.update();
  composer.render();
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  $('stats').innerHTML = `${$('stats').dataset.n} buildings<br>${Math.floor(CARS * opts.traffic)} cars<br>${fps} fps`;
});
</script>
</body>
</html>
