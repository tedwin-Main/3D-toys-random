<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rooftop Runner</title>
<meta name="category" content="aero" />
<meta name="style" content="glasscity" />
<meta name="order" content="60" />
<meta name="capture" content="6400" />
<meta name="tags" content="three.js, first-person parkour, procedural rooftops, runner vision, instanced glass towers, UnrealBloom, autopilot" />
<meta name="description" content="A first-person free-run across an endless sun-bleached white city: clean rooftops, glass towers reflecting a hard blue sky, and every useful thing (take-off edges, vault rails, slide ducts) glowing red so your eye finds the line. Momentum builds as you run, gaps need a jump, ducts need a slide, and a clean chain of moves builds flow. Leave it alone and an autopilot runs the line for you. Hard because the rooftops stream in procedurally with jumpable gaps, the towers are one instanced mesh with a world-space window shader, and the run is a tiny 1D physics sim with coyote time and obstacle sweeps." />
<meta name="prompt" content="Build a first-person rooftop free-running game in three.js, one HTML file, in a clean white-city look: white roofs with parapets, vents and skylights, instanced glass towers with a world-space mullion-and-glass shader and sun glints, a hard blue sky dome with haze. Highlight every interactive object in red (take-off edges, vault rails, overhead ducts) as runner vision. Rooftops stream in procedurally with gaps that are always jumpable at full speed. Space/tap jumps, S/swipe-down slides, momentum meter, distance, flow combo, respawn fade after a fall, head bob and speed FOV, soft footstep and wind audio, and an autopilot attract mode." />
<style>

html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f5; font-family: "Helvetica Neue", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas { display: block; }
#hud { position: fixed; left: 28px; top: 24px; color: #fff; text-shadow: 0 1px 8px rgba(0, 40, 80, 0.45); pointer-events: none; }
#dist { font-size: 44px; font-weight: 200; letter-spacing: -1px; line-height: 1; }

#meter { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%); width: min(360px, 70vw); pointer-events: none; }
#meter i { display: block; height: 4px; background: rgba(255, 255, 255, 0.55); }

#reticle { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.12); pointer-events: none; }

@media (max-width: 600px) { #hud { left: 16px; top: 16px; } #dist { font-size: 32px; } #flow { right: 16px; top: 18px; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hud"><div id="dist">0<small>M</small></div><div id="best">BEST 0 M</div></div>
<div id="flow">FLOW ×1</div>
<div id="meter"><i><b id="mom"></b></i><span>MOMENTUM</span></div>
<div id="reticle"></div>
<div id="fade"></div>
<div id="hint">space / tap jump · S / swipe down slide</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const RED = 0xe8202a;
const SUN = new THREE.Vector3(0.45, 0.42, -0.79).normalize();
const HAZE = new THREE.Color(0xcfe6f5);
const FOG_NEAR = 40, FOG_FAR = 300;
const MAX_SPEED = 15, ACCEL = 5, GRAVITY = 22, JUMP_VY = 8.2, SLIDE_SECS = 0.75;
const STAND_EYE = 1.7, SLIDE_EYE = 0.75;

// Seeded random: same city each load, poster stays stable
let seed = 20081112;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HAZE, FOG_NEAR, FOG_FAR);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 700);

// Sky > hard blue dome with haze band and sun
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { sun: { value: SUN } },
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 sun; varying vec3 vD;
void main(){
  vec3 d = normalize(vD); float h = max(d.y, 0.0);
  vec3 col = mix(vec3(0.6, 0.78, 0.9), vec3(0.04, 0.2, 0.58), pow(h, 0.5));
  float s = max(dot(d, sun), 0.0);
  col += vec3(1.0, 0.95, 0.85) * (pow(s, 900.0) * 6.0 + pow(s, 14.0) * 0.3);
  col = mix(col, vec3(0.6, 0.78, 0.9), smoothstep(0.06, -0.04, d.y));
  gl_FragColor = vec4(col, 1.0);
}`,
}));
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xe4f2ff, 0x7d8a97, 0.9));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// Materials > white city, red runner vision
const MAT = {
  roof: new THREE.MeshStandardMaterial({ color: 0xe9edf0, roughness: 0.9 }),
  roofTop: worldTiledMaterial(),
  trim: new THREE.MeshStandardMaterial({ color: 0xc9d1d9, roughness: 0.7 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.35, metalness: 0.6 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x7fb4dc, roughness: 0.05, metalness: 0.9 }),
  red: new THREE.MeshStandardMaterial({ color: RED, emissive: RED, emissiveIntensity: 0.4, roughness: 0.45 }),
  accent: [0xff8a1f, 0x3ec46d, 0x2f8de4].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 })),
};
// Materials > roof tiles mapped by world xz so every roof length tiles evenly
function worldTiledMaterial() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#e4e8ec'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(120,130,140,${Math.random() * 0.06})`; x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2); }
  x.strokeStyle = '#c7ced5'; x.lineWidth = 2;
  for (let i = 0; i <= 256; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 256); x.moveTo(0, i); x.lineTo(256, i); x.stroke(); }
  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping; map.colorSpace = THREE.SRGBColorSpace; map.anisotropy = 8;
  const mat = new THREE.MeshStandardMaterial({ map, roughness: 0.92 });
  mat.onBeforeCompile = (sh) => { sh.vertexShader = sh.vertexShader.replace('#include <uv_vertex>', '#include <uv_vertex>\n  vMapUv = (modelMatrix * vec4(position, 1.0)).xz * 0.25;'); };
  return mat;
}
const PLANE = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const BOX = new THREE.BoxGeometry(1, 1, 1), TANK = new THREE.CylinderGeometry(1.1, 1.1, 2.4, 20);
function box(mat, w, h, d, x, y, z, parent) {
  const m = new THREE.Mesh(BOX, mat);
  m.scale.set(w, h, d); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}

// Rooftops > streamed segments along -z; s = run distance
const segments = [];
let genEnd = 0, genY = 0, genCount = 0;
function addSegment() {
  const first = genCount === 0;
  const gap = first ? 0 : 3.5 + rnd() * Math.min(4.5, 1 + genCount * 0.35);
  const len = first ? 64 : 24 + rnd() * 26;
  const y = first ? 0 : Math.min(genY + 0.4, Math.max(-6, genY + (rnd() - 0.62) * 2.6));
  const s0 = genEnd + gap, s1 = s0 + len, width = 9 + rnd() * 6;
  const g = new THREE.Group(); g.position.set(0, y, -(s0 + len / 2));
  box(MAT.roof, width, 60, len, 0, -30.01, 0, g);
  const top = new THREE.Mesh(PLANE, MAT.roofTop); top.scale.set(width, 1, len); top.receiveShadow = true; g.add(top);
  [-1, 1].forEach((side) => box(MAT.trim, 0.35, 0.55, len, side * (width / 2 - 0.18), 0.27, 0, g));
  if (rnd() < 0.35) box(MAT.accent[genCount % 3], width + 0.02, 3, len * 0.6, 0, -2.2, 0, g);
  box(MAT.red, width - 0.7, 0.06, 1.2, 0, 0.03, -len / 2 + 0.6, g);
  const seg = { s0, s1, y, group: g, obstacles: decorateRoof(g, len, width, first) };
  scene.add(g); segments.push(seg);
  genEnd = s1; genY = y; genCount++;
}

// Rooftops > obstacles (bar = vault, duct = slide) and side clutter; local z runs +len/2 (start) to -len/2 (end)
function decorateRoof(g, len, width, first) {
  const obstacles = [];
  for (let at = first ? 26 : 9; at < len - 15; at += 8 + rnd() * 9) {
    if (rnd() < 0.3) continue;
    const z = len / 2 - at, type = rnd() < 0.55 ? 'bar' : 'duct';
    if (type === 'bar') {
      box(MAT.red, width - 1.6, 0.18, 0.18, 0, 0.95, z, g);
      [-1, 1].forEach((side) => box(MAT.steel, 0.1, 0.95, 0.1, side * (width / 2 - 1), 0.47, z, g));
    } else {
      box(MAT.steel, width - 0.8, 1.4, 1.3, 0, 1.15 + 0.7, z, g);
      box(MAT.red, width - 0.78, 0.16, 1.34, 0, 1.2, z, g);
      [-1, 1].forEach((side) => box(MAT.trim, 0.3, 1.2, 0.3, side * (width / 2 - 0.6), 0.6, z, g));
    }
    obstacles.push({ at, type });
  }
  for (let i = 0; i < len / 7; i++) {
    const side = rnd() < 0.5 ? -1 : 1, x = side * (2.6 + rnd() * (width / 2 - 3.4)), z = (rnd() - 0.5) * (len - 4), k = rnd();
    if (k < 0.4) box(MAT.trim, 1.6, 1 + rnd(), 1.6, x, 0.6, z, g);
    else if (k < 0.65) box(MAT.glass, 2.2, 0.25, 3, x, 0.13, z, g);
    else if (k < 0.8) { const t = new THREE.Mesh(TANK, MAT.steel); t.position.set(x, 1.2, z); t.castShadow = true; g.add(t); }
    else box(MAT.steel, 0.12, 4 + rnd() * 5, 0.12, x, 3, z, g);
  }
  return obstacles;
}
function dropOldSegments(runS) {
  while (segments.length && segments[0].s1 < runS - 40) scene.remove(segments.shift().group);
  while (genEnd < runS + 420) addSegment();
}
const segmentAt = (s) => segments.find((g) => s >= g.s0 - 0.3 && s <= g.s1 + 0.3) ?? null;

// Towers > one instanced mesh, world-space mullion grid shader, recycled ahead of runner
const TOWERS = 150, TOWER_SPAN = 520;
const towerMat = new THREE.ShaderMaterial({
  uniforms: { sunDir: { value: SUN }, haze: { value: HAZE }, fogNear: { value: FOG_NEAR }, fogFar: { value: FOG_FAR } },
  vertexShader: `varying vec3 vW; varying vec3 vN;
void main(){ vec4 wp = modelMatrix * instanceMatrix * vec4(position, 1.0); vW = wp.xyz; vN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `uniform vec3 sunDir; uniform vec3 haze; uniform float fogNear; uniform float fogFar; varying vec3 vW; varying vec3 vN;
float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
void main(){
  vec3 n = normalize(vN), v = normalize(cameraPosition - vW);
  float u = abs(n.x) > 0.5 ? vW.z : vW.x;
  vec2 cell = vec2(u / 2.4, vW.y / 3.4), f = fract(cell);
  float frame = clamp(step(f.x, 0.07) + step(f.y, 0.12), 0.0, 1.0);
  float fres = pow(1.0 - max(dot(n, v), 0.0), 3.0);
  vec3 glass = mix(vec3(0.06, 0.22, 0.48), vec3(0.42, 0.62, 0.82), clamp(vW.y / 140.0 + fres * 0.7, 0.0, 1.0));
  glass *= 0.82 + 0.3 * h21(floor(cell));
  vec3 col = mix(glass, vec3(0.92), frame);
  if (n.y > 0.5) col = vec3(0.9);
  col *= 0.6 + 0.55 * max(dot(n, sunDir), 0.0);
  col += vec3(1.0, 0.94, 0.82) * pow(max(dot(reflect(-v, n), sunDir), 0.0), 90.0) * (1.0 - frame) * 2.0;
  float fog = clamp((length(vW - cameraPosition) - fogNear) / (fogFar - fogNear), 0.0, 1.0);
  gl_FragColor = vec4(mix(col, haze, fog), 1.0);
}`,
});
const towers = new THREE.InstancedMesh(BOX, towerMat, TOWERS);
towers.frustumCulled = false; scene.add(towers);
const towerS = new Float32Array(TOWERS), dummy = new THREE.Object3D();
function placeTower(i, s) {
  const side = i % 2 ? 1 : -1, w = 8 + rnd() * 14, h = 30 + rnd() * rnd() * 140;
  towerS[i] = s;
  dummy.position.set(side * (16 + rnd() * 90), h / 2 - 40, -s); dummy.scale.set(w, h, 8 + rnd() * 14); dummy.updateMatrix();
  towers.setMatrixAt(i, dummy.matrix);
}
for (let i = 0; i < TOWERS; i++) placeTower(i, -40 + (i / TOWERS) * TOWER_SPAN);
function recycleTowers(runS) {
  let moved = false;
  for (let i = 0; i < TOWERS; i++) if (towerS[i] < runS - 40) { placeTower(i, towerS[i] + TOWER_SPAN); moved = true; }
  if (moved) towers.instanceMatrix.needsUpdate = true;
}

// Audio > wind bed + footstep taps, armed by first gesture
let ac = null, wind = null;
function unlockAudio() {
  if (ac) return;
  try { ac = new AudioContext(); } catch { return; }
  const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  wind = ac.createGain(); wind.gain.value = 0;
  src.connect(lp).connect(wind).connect(ac.destination); src.start();
  ac.noise = buf;
}
function tap(freq, vol, secs) {
  if (!ac) return;
  const t = ac.currentTime, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = ac.noise; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.4;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + secs);
  src.connect(bp).connect(g).connect(ac.destination); src.start(t, Math.random()); src.stop(t + secs + 0.02);
}

// Runner > 1D sim along s with height, coyote time, slide timer, stumble
const runner = { s: 6, y: 0, vy: 0, speed: 0, grounded: true, coyote: 0, slide: 0, stumble: 0, eye: STAND_EYE, bob: 0, flow: 0, best: 0, fallStart: 0 };
const ui = { dist: document.getElementById('dist'), best: document.getElementById('best'), mom: document.getElementById('mom'), flow: document.getElementById('flow'), fade: document.getElementById('fade') };
function jump() {
  if (!(runner.grounded || runner.coyote > 0) || runner.stumble > 0.25) return;
  runner.vy = JUMP_VY; runner.grounded = false; runner.coyote = 0; runner.slide = 0; tap(900, 0.25, 0.08);
}
function slide() { if (runner.grounded && runner.slide <= 0) { runner.slide = SLIDE_SECS; tap(400, 0.3, 0.35); } }
function stumble() { runner.speed *= 0.35; runner.stumble = 0.55; runner.flow = 0; tap(160, 0.6, 0.25); }
function cleared() { runner.flow++; if (runner.flow > 1) { ui.flow.textContent = `FLOW ×${runner.flow}`; ui.flow.style.opacity = 1; } }
function respawn() {
  const next = segments.find((g) => g.s0 > runner.s) ?? segments.at(-1);
  Object.assign(runner, { s: next.s0 + 2, y: next.y, vy: 0, speed: 4, grounded: true, slide: 0, stumble: 0, flow: 0 });
  ui.fade.style.transition = 'none'; ui.fade.style.opacity = 1;
  requestAnimationFrame(() => { ui.fade.style.transition = 'opacity 0.8s'; ui.fade.style.opacity = 0; });
}
function landOn(seg) {
  if (runner.vy < -6) tap(220, 0.45, 0.15);
  runner.y = seg.y; runner.vy = 0; runner.grounded = true;
  if (seg !== runner.takeoff) cleared();
}
function sweepObstacles(seg, fromS, toS) {
  for (const o of seg.obstacles) {
    const s = seg.s0 + o.at;
    if (s <= fromS || s > toS) continue;
    const above = runner.y - seg.y;
    const ok = o.type === 'bar' ? above > 0.75 : runner.slide > 0 && above < 0.2;
    if (ok) cleared(); else stumble();
  }
}
function stepRunner(dt) {
  runner.stumble = Math.max(0, runner.stumble - dt); runner.slide = Math.max(0, runner.slide - dt);
  if (runner.stumble <= 0) runner.speed = Math.min(MAX_SPEED, runner.speed + ACCEL * dt * (runner.slide > 0 ? 0.3 : 1));
  const fromS = runner.s; runner.s += runner.speed * dt;
  const seg = segmentAt(runner.s);
  if (runner.grounded) {
    if (seg) runner.y = seg.y; else { runner.grounded = false; runner.coyote = 0.12; runner.takeoff = segmentAt(fromS); }
  } else {
    runner.vy -= GRAVITY * dt; runner.y += runner.vy * dt; runner.coyote -= dt;
    if (seg && runner.vy <= 0 && runner.y <= seg.y && runner.y > seg.y - 0.7) landOn(seg);
    else if (seg && runner.y <= seg.y - 0.7) { runner.s = seg.s0 - 0.4; runner.speed = 0; }
  }
  if (runner.grounded) runner.takeoff = seg;
  const here = segmentAt(runner.s);
  if (here) sweepObstacles(here, fromS, runner.s);
  if (runner.y < (here?.y ?? genY) - 16 || runner.y < -24) respawn();
}

// Autopilot > reads the red line: jump at edges and rails, slide under ducts
function autopilot() {
  const seg = segmentAt(runner.s);
  if (!runner.grounded || !seg) return;
  if (seg.s1 - runner.s < 0.9) return jump();
  for (const o of seg.obstacles) {
    const ahead = seg.s0 + o.at - runner.s;
    if (ahead <= 0) continue;
    if (o.type === 'bar' && ahead < runner.speed * 0.3) return jump();
    if (o.type === 'duct' && ahead < runner.speed * 0.35) return slide();
  }
}

// Input > keys, tap, swipe; idle 5 s hands back to autopilot
let lastInput = -1e9, touchY = null;
const human = () => { lastInput = performance.now(); };
addEventListener('pointerdown', unlockAudio); addEventListener('keydown', unlockAudio);
addEventListener('keydown', (e) => {
  if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) { human(); jump(); e.preventDefault(); }
  if (['s', 'S', 'ArrowDown', 'Shift'].includes(e.key)) { human(); slide(); e.preventDefault(); }
});
addEventListener('pointerdown', (e) => { human(); touchY = e.clientY; });
addEventListener('pointerup', (e) => { if (touchY === null) return; if (e.clientY - touchY > 40) slide(); else jump(); touchY = null; });

// Camera > eye height, bob, speed FOV, air pitch, stumble shake
let fovBase = 72;
function placeCamera(dt, t) {
  runner.eye += ((runner.slide > 0 ? SLIDE_EYE : STAND_EYE) - runner.eye) * Math.min(1, dt * 14);
  if (runner.grounded && runner.slide <= 0) {
    const before = Math.sin(runner.bob * 2);
    runner.bob += runner.speed * dt * 0.62;
    if (before < 0 && Math.sin(runner.bob * 2) >= 0) tap(300 + Math.random() * 120, 0.12 * (runner.speed / MAX_SPEED), 0.06);
  }
  const k = runner.speed / MAX_SPEED, bobY = runner.grounded && runner.slide <= 0 ? Math.sin(runner.bob * 2) * 0.06 * k : 0;
  const shake = runner.stumble * 0.25;
  camera.position.set(Math.sin(runner.bob) * 0.05 * k + (Math.random() - 0.5) * shake, runner.y + runner.eye + bobY, -runner.s);
  const pitch = -0.05 + (runner.grounded ? 0 : THREE.MathUtils.clamp(runner.vy * 0.012, -0.12, 0.08)) - runner.stumble * 0.2;
  camera.rotation.set(pitch, Math.sin(t * 0.3) * 0.02, runner.slide > 0 ? 0.05 : Math.sin(runner.bob) * 0.006, 'YXZ');
  camera.fov += (fovBase + k * 12 - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  sun.position.set(camera.position.x + SUN.x * 60, camera.position.y + SUN.y * 60, camera.position.z + SUN.z * 60);
  sun.target.position.set(0, runner.y, -runner.s - 14);
  if (wind) wind.gain.value = 0.02 + k * k * 0.12 + (runner.grounded ? 0 : 0.05);
}

function paintHud() {
  const m = Math.floor(runner.s);
  runner.best = Math.max(runner.best, m);
  ui.dist.innerHTML = `${m < 1000 ? m : (m / 1000).toFixed(2)}<small>${m < 1000 ? 'M' : 'KM'}</small>`;
  ui.best.textContent = `BEST ${runner.best} M`;
  ui.mom.style.width = `${(runner.speed / MAX_SPEED) * 100}%`;
  if (runner.flow < 2) ui.flow.style.opacity = 0;
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.4, 0.92));
composer.addPass(new OutputPass());
function fit() { camera.aspect = innerWidth / innerHeight; fovBase = camera.aspect < 0.8 ? 88 : 72; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); }
fit(); addEventListener('resize', fit);

dropOldSegments(runner.s);
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.033, clock.getDelta()), t = clock.elapsedTime;
  if (performance.now() - lastInput > 5000) autopilot();
  stepRunner(dt);
  dropOldSegments(runner.s); recycleTowers(runner.s);
  placeCamera(dt, t); paintHud();
  composer.render();
});
window.__runner = { jump, slide, state: () => ({ ...runner }) };
</script>
</body>
</html>
