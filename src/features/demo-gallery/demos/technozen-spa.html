<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (s) => document.querySelector(s);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0xe3f1ec, 12, 34);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const narrow = () => innerWidth / innerHeight < 0.8;
camera.position.set(0, 3.4, narrow() ? 15 : 10);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1.1, 0); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 6; controls.maxDistance = 20; controls.maxPolarAngle = 1.45; controls.autoRotate = true; controls.autoRotateSpeed = 0.25;

// Sky > soft mint-to-white dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(80, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vP; void main(){ float h = clamp(vP.y,0.0,1.0); vec3 c = mix(vec3(0.89,0.95,0.93), vec3(0.62,0.82,0.86), pow(h,0.7)); c += vec3(1.0,0.97,0.88)*pow(max(dot(normalize(vP), normalize(vec3(-0.5,0.35,-0.8))),0.0), 24.0)*0.5; gl_FragColor = vec4(c,1.0); }' }));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xf4fffb, 0x9fc2b5, 1.1));
const sun = new THREE.DirectionalLight(0xfff6e6, 1.6); sun.position.set(-5, 8, -6); scene.add(sun);
const fill = new THREE.DirectionalLight(0xcff3ff, 0.5); fill.position.set(6, 3, 8); scene.add(fill);

// Water > ripple rings summed with analytic normals
const MAXR = 12, rip = Array.from({ length: MAXR }, () => new THREE.Vector4(0, 0, -100, 0));
const water = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  uniforms: { uT: { value: 0 }, uR: { value: rip }, uSun: { value: new THREE.Vector3(-0.5, 0.6, -0.6).normalize() } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: `uniform float uT; uniform vec4 uR[${MAXR}]; uniform vec3 uSun; varying vec3 vW;
    vec3 skyAt(vec3 d){ float h = clamp(d.y,0.0,1.0); vec3 c = mix(vec3(0.89,0.95,0.93), vec3(0.62,0.82,0.86), pow(h,0.7)); return c + vec3(1.0,0.97,0.88)*pow(max(dot(d, normalize(vec3(-0.5,0.35,-0.8))),0.0), 24.0)*0.5; }
    void main(){
      vec2 p = vW.xz; vec2 g = vec2(0.0);
      g += 0.012*vec2(cos(p.x*1.3+uT*0.7), cos(p.y*1.1-uT*0.5));
      for (int i=0;i<${MAXR};i++){ vec4 r = uR[i]; float a = uT - r.z; if (a < 0.0 || a > 6.0) continue;
        vec2 d = p - r.xy; float dist = length(d) + 1e-4; float front = a*1.6; float x = dist - front;
        float env = exp(-x*x*2.2) * exp(-a*0.75) * r.w; float dh = cos(x*9.0)*9.0*env*0.05 - x*4.4*sin(x*9.0)*env*0.05;
        g += dh * d/dist; }
      vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
      vec3 v = normalize(cameraPosition - vW); vec3 rf = reflect(-v, n);
      float h = clamp(rf.y, 0.0, 1.0); vec3 skyc = mix(vec3(0.89,0.95,0.93), vec3(0.62,0.82,0.86), pow(h,0.7));
      float fr = 0.04 + 0.96*pow(1.0 - max(dot(n, v), 0.0), 5.0);
      vec3 deep = vec3(0.16,0.42,0.40); vec3 col = mix(deep, skyc, clamp(fr*1.25+0.15,0.0,1.0));
      col += vec3(1.0,0.97,0.9)*pow(max(dot(rf, uSun),0.0), 220.0)*2.2;
      float f = smoothstep(12.0, 34.0, length(vW - cameraPosition)); gl_FragColor = vec4(mix(col, skyAt(normalize(vW - cameraPosition)*vec3(1.0,0.0,1.0)), f), 1.0);
    }` }));
scene.add(water);
let rI = 0;
function ripple(x, z, amp = 1) { rip[rI].set(x, z, clockT, amp); rI = (rI + 1) % MAXR; }

// Stones > noise-displaced wet ellipsoids stacked on a flat rock
function pebble(r, sy, seed, col) {
  const g = new THREE.SphereGeometry(r, 48, 24), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const n = 1 + 0.05 * Math.sin(v.x * 3.1 + seed) * Math.cos(v.z * 2.7 + seed * 2) + 0.03 * Math.sin(v.y * 5 + seed); v.multiplyScalar(n); v.y *= sy; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshPhysicalMaterial({ color: col, roughness: 0.55, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.3, sheenColor: 0xffffff }));
}
const cairn = new THREE.Group(); scene.add(cairn);
const base = pebble(1.9, 0.28, 3, 0x7d8a86); base.position.y = 0.12; cairn.add(base);
const SZ = [[0.95, 0.42, 0x8e9894], [0.78, 0.44, 0x5f6b69], [0.62, 0.46, 0xa3aca6], [0.48, 0.5, 0x6e7976], [0.36, 0.55, 0xb6bdb7]];
let y = 0.12 + 1.9 * 0.28 * 0.9; const stones = [];
SZ.forEach(([r, sy, c], i) => { const s = pebble(r, sy, i * 1.7 + 1, c); y += r * sy * 0.92; s.position.set(Math.sin(i * 2.1) * 0.06, y, Math.cos(i * 1.3) * 0.05); s.rotation.set(Math.sin(i) * 0.08, i * 0.9, Math.cos(i * 1.7) * 0.07); y += r * sy * 0.88; cairn.add(s); stones.push(s); });

// Bamboo > segmented stalks with nodes and lanceolate leaves
const bambooMat = new THREE.MeshStandardMaterial({ color: 0x7fb24a, roughness: 0.45 }), nodeMat = new THREE.MeshStandardMaterial({ color: 0x5b8a33, roughness: 0.5 });
const leafShape = new THREE.Shape(); leafShape.moveTo(0, 0); leafShape.quadraticCurveTo(0.12, 0.35, 0, 0.9); leafShape.quadraticCurveTo(-0.12, 0.35, 0, 0);
const leafGeo = new THREE.ShapeGeometry(leafShape, 6), leafMat = new THREE.MeshStandardMaterial({ color: 0x6fae3e, side: THREE.DoubleSide, roughness: 0.6 });
const stalks = [];
function stalk(x, z, h, r) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  for (let k = 0; k < h; k++) { const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.96, r, 1.05, 16), bambooMat); seg.position.y = k * 1.08 + 0.5; g.add(seg); const nd = new THREE.Mesh(new THREE.TorusGeometry(r, r * 0.12, 6, 18), nodeMat); nd.rotation.x = Math.PI / 2; nd.position.y = k * 1.08 + 1.04; g.add(nd); }
  for (let k = 0; k < 14; k++) { const l = new THREE.Mesh(leafGeo, leafMat); l.position.set(0, h * 1.08 - 2.2 + Math.random() * 2.4, 0); l.rotation.set(-0.6 - Math.random() * 0.7, Math.random() * Math.PI * 2, 0, 'YXZ'); l.scale.setScalar(0.8 + Math.random() * 0.5); g.add(l); }
  g.userData.ph = Math.random() * 6; scene.add(g); stalks.push(g); return g;
}
[[-4.6, -2.2, 5, 0.13], [-5.3, -1.2, 6, 0.15], [-4.1, -3.4, 4, 0.12], [-5.8, -3.0, 6, 0.16], [-3.6, -4.6, 5, 0.12], [4.9, -4.2, 6, 0.14], [5.7, -3.2, 5, 0.13]].forEach((a) => stalk(...a));

// Spout > angled bamboo pipe dripping into the pool
const spout = new THREE.Group(); spout.position.set(3.4, 0, -0.6); scene.add(spout);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 2.4, 16), bambooMat); post.position.y = 1.2; spout.add(post);
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 1.8, 16), bambooMat); pipe.rotation.z = Math.PI / 2 - 0.25; pipe.position.set(-0.75, 2.1, 0); spout.add(pipe);
const tip = new THREE.Vector3(3.4 - 1.6, 1.86, -0.6);
const dropMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, transmission: 0.9, thickness: 0.2, ior: 1.33 });
const drops = [];

// Lily pads > notched discs bobbing
const padMat = new THREE.MeshStandardMaterial({ color: 0x5c9f45, roughness: 0.5, side: THREE.DoubleSide });
const pads = [[-1.9, 2.0, 0.5], [2.2, 1.7, 0.42], [-3.0, 0.4, 0.36], [1.1, 3.1, 0.3]].map(([x, z, r], i) => { const p = new THREE.Mesh(new THREE.CircleGeometry(r, 28, 0.25, Math.PI * 2 - 0.5), padMat); p.rotation.x = -Math.PI / 2; p.rotation.z = i * 1.3; p.position.set(x, 0.02, z); scene.add(p); return p; });
const lotus = new THREE.Group(); lotus.position.set(-1.9, 0.05, 2.0); scene.add(lotus);
for (let k = 0; k < 8; k++) { const pt = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), new THREE.MeshStandardMaterial({ color: 0xffe3ee, roughness: 0.4 })); pt.scale.set(0.6, 1.4, 0.35); pt.position.set(Math.cos(k * 0.785) * 0.1, 0.14, Math.sin(k * 0.785) * 0.1); pt.rotation.set(Math.sin(k * 0.785) * 0.5, 0, -Math.cos(k * 0.785) * 0.5); lotus.add(pt); }

// Mist > soft sprites drifting low over the pool
const mc = document.createElement('canvas'); mc.width = mc.height = 128; { const g = mc.getContext('2d'), rg = g.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, 'rgba(255,255,255,0.9)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128); }
const mistTex = new THREE.CanvasTexture(mc), mists = [];
for (let i = 0; i < 9; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: mistTex, transparent: true, opacity: 0.22, depthWrite: false })); s.scale.set(9, 2.4, 1); s.position.set(-12 + i * 3.2, 0.6 + Math.random() * 0.8, -6 + Math.random() * 10); scene.add(s); mists.push(s); }

// Leaves > occasional drift down onto the water
const falling = [];
function dropLeaf() { const l = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({ color: 0x9cc457, side: THREE.DoubleSide })); l.position.set(-4 + Math.random() * 3, 6, -2 + Math.random() * 3); l.userData = { vx: 0.3 + Math.random() * 0.3, ph: Math.random() * 6, landed: -1 }; scene.add(l); falling.push(l); }

// Breath > inhale 4, hold 4, exhale 6; drives overlay + light
const PH = [['inhale', 4], ['hold', 4], ['exhale', 6]], CYC = 14, prog = $('#ring .prog'), orb = $('#ring .orb');
let breathing = false, sessT = 0, sessLen = 180, lastPh = -1;
function breathState(t) { const c = t % CYC; let a = 0; for (let i = 0; i < 3; i++) { if (c < a + PH[i][1]) return { i, k: (c - a) / PH[i][1], left: Math.ceil(a + PH[i][1] - c) }; a += PH[i][1]; } return { i: 0, k: 0, left: 4 }; }
function breathe(on = !breathing) {
  breathing = on; $('#go').textContent = on ? 'pause' : 'begin';
  if (on) { audio(); if (sessT >= sessLen) sessT = 0; pad(true); } else pad(false);
}
$('#go').onclick = () => { input(); breathe(); };
document.querySelectorAll('.chip').forEach((c) => (c.onclick = () => { input(); document.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c)); sessLen = +c.dataset.m * 60; sessT = 0; }));

// Audio > bells, drops, ambient pad
let ac = null, padNodes = null;
const audio = () => (ac ??= new AudioContext());
addEventListener('pointerdown', audio, { capture: true });
function bell(f, v = 0.08) { if (!ac) return; const t = ac.currentTime; [1, 2.76, 5.4].forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * m; g.gain.setValueAtTime(v / (i + 1), t); g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5 / (i + 1)); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 3.6); }); }
function plip(v = 0.06) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), f0 = 900 + Math.random() * 500; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 2.2, t + 0.05); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.13); }
function pad(on) {
  if (!ac) return;
  if (on && !padNodes) { const g = ac.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.05, ac.currentTime + 3); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; g.connect(lp).connect(ac.destination); padNodes = { g, os: [130.8, 196, 329.6, 392].map((f, i) => { const o = ac.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4; o.connect(g); o.start(); return o; }) }; }
  if (!on && padNodes) { const n = padNodes; padNodes = null; n.g.gain.linearRampToValueAtTime(0, ac.currentTime + 1.5); setTimeout(() => n.os.forEach((o) => o.stop()), 1600); }
}

// Input > tap water to ripple
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { input(); down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; down = null;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(water)[0]; if (hit) { ripple(hit.point.x, hit.point.z, 1.2); plip(0.08); }
});
let lastInput = -1e9; function input() { lastInput = performance.now(); controls.autoRotate = false; }

// Loop
let clockT = 0, last = performance.now(), nextDrip = 0.5, nextLeaf = 5, lt = 0;
ripple(-0.6, 2.2, 1); ripple(1.8, 0.4, 0.8); rip[0].z = -1.2; rip[1].z = -2.4;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; clockT += dt;
  water.material.uniforms.uT.value = clockT;
  if (now - lastInput > 10000) controls.autoRotate = true;
  // drips from spout
  if (clockT > nextDrip) { nextDrip = clockT + 1.8 + Math.random() * 1.6; const d = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), dropMat); d.position.copy(tip); d.userData.v = 0; scene.add(d); drops.push(d); }
  for (let i = drops.length - 1; i >= 0; i--) { const d = drops[i]; d.userData.v -= 9.8 * dt; d.position.y += d.userData.v * dt; d.scale.set(1, 1 + Math.min(1, -d.userData.v * 0.15), 1); if (d.position.y <= 0) { ripple(d.position.x, d.position.z, 1); plip(); scene.remove(d); d.geometry.dispose(); drops.splice(i, 1); } }
  // leaves
  if (clockT > nextLeaf) { nextLeaf = clockT + 7 + Math.random() * 6; dropLeaf(); }
  for (let i = falling.length - 1; i >= 0; i--) { const l = falling[i], u = l.userData;
    if (u.landed < 0) { l.position.y -= 0.7 * dt; l.position.x += Math.sin(clockT * 1.5 + u.ph) * 0.8 * dt + u.vx * dt; l.rotation.set(Math.sin(clockT * 2 + u.ph) * 0.9, clockT + u.ph, Math.cos(clockT * 1.7) * 0.6); if (l.position.y <= 0.02) { l.position.y = 0.02; l.rotation.set(-Math.PI / 2, 0, u.ph); u.landed = clockT; ripple(l.position.x, l.position.z, 0.6); } }
    else { l.position.x += 0.05 * dt; if (clockT - u.landed > 14) { scene.remove(l); l.material.dispose(); falling.splice(i, 1); } } }
  // sway + bob + mist
  stalks.forEach((s) => (s.rotation.z = Math.sin(clockT * 0.6 + s.userData.ph) * 0.018));
  pads.forEach((p, i) => (p.position.y = 0.02 + Math.sin(clockT * 0.9 + i) * 0.008)); lotus.position.y = pads[0].position.y + 0.03;
  mists.forEach((m, i) => { m.position.x += (0.12 + i * 0.01) * dt; if (m.position.x > 14) m.position.x = -14; });
  stones[stones.length - 1].rotation.z = Math.cos(1.7 * 4) * 0.07 + Math.sin(clockT * 0.8) * 0.01;
  // breath ring
  if (breathing) { sessT += dt; if (sessT >= sessLen) { breathe(false); bell(523, 0.1); setTimeout(() => bell(784, 0.08), 500); } }

  if (b.i !== lastPh) { lastPh = b.i; if (breathing) bell(b.i === 0 ? 392 : b.i === 1 ? 494 : 330, 0.05); }
  $('#left').textContent = breathing ? `${String(Math.floor((sessLen - sessT) / 60)).padStart(2, '0')}:${String(Math.floor((sessLen - sessT) % 60)).padStart(2, '0')} left` : 'tap the water to make a ripple';
  sun.intensity = 1.35 + ease * 0.5; renderer.toneMappingExposure = 1.0 + ease * 0.08;
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

window.__zen = { drop: (x = 0, z = 2) => ripple(x, z, 1.2), breathe, phase: () => ({ ...breathState(breathing ? sessT : lt), breathing, sessT }), ripples: () => rip.filter((r) => clockT - r.z < 6).length };
