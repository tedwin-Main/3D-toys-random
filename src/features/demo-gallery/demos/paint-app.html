<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paint App</title>
<meta name="category" content="apps" />
<meta name="order" content="2" />
<meta name="capture" content="5500" />
<meta name="tags" content="canvas paint, flood fill, undo stack, shape tools, PNG export" />
<meta name="description" content="A complete paint program in one file: pressure-smoothed brush, pencil, eraser, spray, line, rectangle and ellipse with live previews, a scanline flood fill with tolerance, an eyedropper, a palette plus custom colour, adjustable size, 40-step undo and redo, and PNG export. When idle it paints a little landscape by itself using the same tools. Tests canvas pixel work and app-grade tool state." />
<meta name="prompt" content="Build a full paint app in a single HTML file with the canvas API. Include brush, pencil, eraser, spray can, line, rectangle and ellipse tools with live preview while dragging, a flood-fill bucket with tolerance, an eyedropper, a colour palette with a custom picker, brush size, undo and redo with keyboard shortcuts, clear and export as PNG. Make the toolbar look clean and modern and support touch drawing." />
<style>
  :root { --ink: #1b1f2a; --muted: #6b7385; --panel: #ffffff; --line: #e3e6ee; --accent: #3b6cff; --bg: #eef1f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; touch-action: none; user-select: none; }
  header { position: fixed; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
  header h1 { margin: 0; font-size: 16px; }
  header .sp { flex: 1; }
  header button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font: 600 12.5px inherit; cursor: pointer; color: var(--ink); }
  header button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  header button:disabled { opacity: 0.4; cursor: default; }
  #tools { position: fixed; left: 12px; top: 64px; width: 56px; padding: 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(20, 30, 60, 0.08); display: grid; gap: 4px; z-index: 2; }
  #tools button { width: 44px; height: 40px; border: 0; border-radius: 10px; background: transparent; font-size: 18px; cursor: pointer; }
  #tools button:hover { background: #f1f3f8; }
  #tools button.on { background: #e5ebff; box-shadow: inset 0 0 0 1.5px var(--accent); }
  #props { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(20, 30, 60, 0.08); z-index: 2; max-width: calc(100vw - 20px); flex-wrap: wrap; justify-content: center; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15); cursor: pointer; }
  .sw.on { box-shadow: 0 0 0 2.5px var(--accent); }
  #custom { width: 28px; height: 28px; border: 0; padding: 0; background: none; cursor: pointer; }
  #props label { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  #props input[type=range] { width: 90px; accent-color: var(--accent); }
  #sizeDot { width: 28px; height: 28px; display: grid; place-items: center; }
  #sizeDot i { display: block; border-radius: 50%; background: var(--ink); }
  #stage { position: fixed; left: 80px; right: 12px; top: 64px; bottom: 70px; display: grid; place-items: center; }
  #wrap { position: relative; box-shadow: 0 10px 40px rgba(20, 30, 60, 0.14); border-radius: 6px; overflow: hidden; background: #fff; }
  #wrap canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
  #wrap canvas#preview { pointer-events: none; }
  #status { position: fixed; right: 16px; bottom: 22px; font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); z-index: 1; }
  @media (max-width: 700px) { #stage { left: 70px; right: 6px; bottom: 120px; } #status { display: none; } header h1 span { display: none; } #tools { width: 50px; left: 8px; } #tools button { width: 38px; height: 36px; font-size: 16px; } }
</style>
</head>
<body>
<header>
  <h1>🎨 Paint <span style="font-weight:400;color:var(--muted)">· untitled.png</span></h1>
  <div class="sp"></div>
  <button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <button id="clear">Clear</button><button id="export" class="primary">Export PNG</button>
</header>
<div id="tools"></div>
<div id="stage"><div id="wrap"><canvas id="art"></canvas><canvas id="preview"></canvas></div></div>
<div id="props">
  <div id="palette" style="display:flex;gap:6px"></div>
  <input id="custom" type="color" value="#ff7a59" title="Custom colour">
  <label><span id="sizeDot"><i></i></span><input id="size" type="range" min="1" max="60" value="10"></label>
  <label>Tol <input id="tol" type="range" min="0" max="120" value="32" style="width:60px"></label>
</div>
<div id="status"></div>
<script>
/**
 * FILE: render-studio/frontend/demos/paint-app.html
 * PURPOSE: Paint program: brush/pencil/eraser/spray/line/rect/ellipse/fill/eyedropper, undo-redo stack, PNG export, idle self-painting demo
 * UI: Render Studio > Apps & UI > Paint App
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__paint (test hook: fill, pixel, exportURL, undo, stroke)
 */
const $ = (id) => document.getElementById(id);
const art = $('art'), pre = $('preview'), g = art.getContext('2d', { willReadFrequently: true }), pg = pre.getContext('2d');
const TOOLS = [['brush', '🖌️'], ['pencil', '✏️'], ['eraser', '🧽'], ['spray', '💨'], ['line', '╱'], ['rect', '▭'], ['ellipse', '◯'], ['fill', '🪣'], ['picker', '💧']];
const PALETTE = ['#1b1f2a', '#ffffff', '#e5484d', '#f76b15', '#ffc53d', '#46a758', '#12a594', '#3b6cff', '#8e4ec6', '#d6409f', '#8d6e63', '#a0a8b8'];
let tool = 'brush', color = PALETTE[0], W = 0, H = 0;

// Paint > canvas size: fixed document fitted into the stage, 4:3 landscape or 3:4 portrait
function layout() {
  const st = $('stage').getBoundingClientRect();
  const portrait = st.height > st.width;
  const ar = portrait ? 3 / 4 : 4 / 3;
  let w = st.width - 8, h = w / ar;
  if (h > st.height - 8) { h = st.height - 8; w = h * ar; }
  $('wrap').style.width = w + 'px'; $('wrap').style.height = h + 'px';
  const newW = portrait ? 600 : 800, newH = portrait ? 800 : 600;
  if (newW !== W || newH !== H) {
    const old = W ? g.getImageData(0, 0, W, H) : null;
    W = art.width = pre.width = newW; H = art.height = pre.height = newH;
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    if (old) g.putImageData(old, 0, 0);
  }
}
addEventListener('resize', layout);
layout();

// Paint > toolbar + palette
TOOLS.forEach(([id, icon]) => {
  const b = document.createElement('button'); b.textContent = icon; b.title = id; b.dataset.tool = id;
  b.onclick = () => setTool(id);
  $('tools').appendChild(b);
});
function setTool(id) { tool = id; document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('on', b.dataset.tool === id)); status(); }
PALETTE.forEach((c) => { const s = document.createElement('div'); s.className = 'sw'; s.style.background = c; s.dataset.c = c; s.onclick = () => setColor(c); $('palette').appendChild(s); });
function setColor(c) { color = c; document.querySelectorAll('.sw').forEach((s) => s.classList.toggle('on', s.dataset.c === c)); $('custom').value = /^#[0-9a-f]{6}$/i.test(c) ? c : '#000000'; status(); }
$('custom').oninput = (e) => setColor(e.target.value);
const size = $('size');
const showSize = () => { const d = Math.max(3, Math.min(26, Number(size.value) * 0.6)); Object.assign($('sizeDot').firstChild.style, { width: d + 'px', height: d + 'px' }); status(); };
size.oninput = showSize;
setTool('brush'); setColor(PALETTE[0]); showSize();

// Paint > undo / redo: snapshot ImageData before each operation, 40 deep
const undoStack = [], redoStack = [];
function snapshot() { undoStack.push(g.getImageData(0, 0, W, H)); if (undoStack.length > 40) undoStack.shift(); redoStack.length = 0; syncHist(); }
function undo() { if (!undoStack.length) return; redoStack.push(g.getImageData(0, 0, W, H)); g.putImageData(undoStack.pop(), 0, 0); syncHist(); }
function redo() { if (!redoStack.length) return; undoStack.push(g.getImageData(0, 0, W, H)); g.putImageData(redoStack.pop(), 0, 0); syncHist(); }
function syncHist() { $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length; }
$('undo').onclick = () => { userAct(); undo(); }; $('redo').onclick = () => { userAct(); redo(); };
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); userAct(); e.shiftKey ? redo() : undo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); userAct(); redo(); }
});
$('clear').onclick = () => { userAct(); snapshot(); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); };
syncHist();

// Paint > export: download PNG of the document
function exportURL() { return art.toDataURL('image/png'); }
$('export').onclick = () => { userAct(); const a = document.createElement('a'); a.href = exportURL(); a.download = 'painting.png'; a.click(); };

// Paint > flood fill: scanline fill with RGBA tolerance
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function floodFill(x, y, hex, tol = Number($('tol').value)) {
  x |= 0; y |= 0;
  if (x < 0 || y < 0 || x >= W || y >= H) return 0;
  const img = g.getImageData(0, 0, W, H), d = img.data, i0 = (y * W + x) * 4;
  const t = [d[i0], d[i0 + 1], d[i0 + 2], d[i0 + 3]], [fr, fg, fb] = hexRGB(hex);
  if (Math.abs(t[0] - fr) + Math.abs(t[1] - fg) + Math.abs(t[2] - fb) === 0 && t[3] === 255) return 0;
  const match = (i) => Math.abs(d[i] - t[0]) + Math.abs(d[i + 1] - t[1]) + Math.abs(d[i + 2] - t[2]) + Math.abs(d[i + 3] - t[3]) <= tol * 3;
  const seen = new Uint8Array(W * H), stack = [[x, y]];
  let painted = 0;
  while (stack.length) {
    let [cx, cy] = stack.pop();
    while (cx >= 0 && !seen[cy * W + cx] && match((cy * W + cx) * 4)) cx--;
    cx++;
    let up = false, down = false;
    while (cx < W && !seen[cy * W + cx] && match((cy * W + cx) * 4)) {
      const p = cy * W + cx, i = p * 4;
      seen[p] = 1; d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255; painted++;
      if (cy > 0) { const q = p - W; if (!seen[q] && match(q * 4)) { if (!up) { stack.push([cx, cy - 1]); up = true; } } else up = false; }
      if (cy < H - 1) { const q = p + W; if (!seen[q] && match(q * 4)) { if (!down) { stack.push([cx, cy + 1]); down = true; } } else down = false; }
      cx++;
    }
  }
  g.putImageData(img, 0, 0);
  return painted;
}

// Paint > drawing: pointer to document coords, per-tool behaviour, shape preview on overlay
let drawing = null;
const toDoc = (e) => { const r = art.getBoundingClientRect(); return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)]; };
function dab(ctx, a, b, sz) {
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = sz;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function spray(p, sz) {
  g.fillStyle = color;
  for (let i = 0; i < sz * 1.5; i++) { const a = Math.random() * Math.PI * 2, r = Math.random() * sz * 1.4; g.fillRect(p[0] + Math.cos(a) * r, p[1] + Math.sin(a) * r, 1.4, 1.4); }
}
function shape(ctx, kind, a, b, sz) {
  ctx.strokeStyle = color; ctx.lineWidth = sz; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  if (kind === 'line') { ctx.moveTo(...a); ctx.lineTo(...b); }
  else if (kind === 'rect') ctx.rect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
  else ctx.ellipse((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.abs(b[0] - a[0]) / 2, Math.abs(b[1] - a[1]) / 2, 0, 0, Math.PI * 2);
  ctx.stroke();
}
function begin(p, tl = tool) {
  const sz = Number(size.value);
  if (tl === 'picker') { const d = g.getImageData(p[0] | 0, p[1] | 0, 1, 1).data; setColor('#' + [d[0], d[1], d[2]].map((v) => v.toString(16).padStart(2, '0')).join('')); setTool('brush'); return; }
  snapshot();
  if (tl === 'fill') { floodFill(p[0], p[1], color); return; }
  drawing = { tl, start: p, last: p, sz, smooth: p };
  move(p);
}
function move(p) {
  if (!drawing) return;
  const { tl, sz } = drawing;
  if (tl === 'brush' || tl === 'eraser' || tl === 'pencil') {
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = tl === 'eraser' ? '#ffffff' : color;
    // brush eases toward the pointer for smoother curves
    const target = tl === 'brush' ? [drawing.smooth[0] + (p[0] - drawing.smooth[0]) * 0.55, drawing.smooth[1] + (p[1] - drawing.smooth[1]) * 0.55] : p;
    dab(g, drawing.last, target, tl === 'pencil' ? Math.max(1, sz * 0.25) : sz);
    drawing.last = target; drawing.smooth = target;
  } else if (tl === 'spray') spray(p, sz);
  else { pg.clearRect(0, 0, W, H); shape(pg, tl, drawing.start, p, sz); drawing.last = p; }
}
function end() {
  if (!drawing) return;
  if (['line', 'rect', 'ellipse'].includes(drawing.tl)) { pg.clearRect(0, 0, W, H); shape(g, drawing.tl, drawing.start, drawing.last, drawing.sz); }
  drawing = null;
}
let sprayTimer = null;
art.addEventListener('pointerdown', (e) => {
  userAct(); art.setPointerCapture(e.pointerId);
  const p = toDoc(e); begin(p);
  if (tool === 'spray') sprayTimer = setInterval(() => drawing && spray(drawing.last, Number(size.value)), 30);
});
art.addEventListener('pointermove', (e) => { const p = toDoc(e); if (drawing && drawing.tl === 'spray') drawing.last = p; move(p); status(p); });
const stop = () => { clearInterval(sprayTimer); end(); };
art.addEventListener('pointerup', stop);
art.addEventListener('pointercancel', stop);
function status(p) { $('status').textContent = `${tool} · ${color} · ${size.value}px${p ? ` · ${p[0] | 0},${p[1] | 0}` : ''} · ${W}×${H}`; }

// Paint > idle demo: paints a sunset landscape with the real tools, then clears and repeats
let lastInput = -1e9, demoId = 0;
function userAct() { lastInput = performance.now(); demoId++; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function strokeTo(tl, pts, col, sz, delay = 8, id) {
  setTool(tl); setColor(col); size.value = sz; showSize();
  begin(pts[0], tl);
  for (const p of pts.slice(1)) { if (id !== demoId) { end(); return false; } move(p); if (delay) await wait(delay); }
  end();
  return id === demoId;
}
async function demo() {
  const id = ++demoId;
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); undoStack.length = redoStack.length = 0; syncHist();
  const sx = W / 800, sy = H / 600, P = (x, y) => [x * sx, y * sy];
  // sun radius uses the smaller scale so portrait docs keep it round
  const sr = 60 * Math.min(sx, sy);
  const steps = [
    async () => { setTool('fill'); setColor('#ffc53d'); floodFill(5, 5, '#ffd8a8', 10); return true; },
    async () => strokeTo('ellipse', [[580 * sx - sr, 180 * sy - sr], [580 * sx + sr, 180 * sy + sr]], '#f76b15', 8, 0, id),
    async () => { floodFill(580 * sx, 180 * sy, '#ff8b3d', 40); return true; },
    async () => { const pts = []; for (let i = 0; i <= 60; i++) pts.push(P(i * 14, 380 - Math.sin(i * 0.22) * 60 - Math.sin(i * 0.07) * 40)); return strokeTo('brush', pts, '#46a758', 10, 10, id); },
    async () => { floodFill(400 * sx, 560 * sy, '#46a758', 60); return true; },
    async () => strokeTo('rect', [P(150, 330), P(290, 440)], '#8d6e63', 6, 0, id),
    // hill line crosses the house, so fill both pieces of the wall
    async () => { floodFill(220 * sx, 400 * sy, '#f2e6d8', 40); floodFill(280 * sx, 432 * sy, '#f2e6d8', 40); floodFill(160 * sx, 432 * sy, '#f2e6d8', 40); return true; },
    async () => strokeTo('line', [P(140, 335), P(220, 270)], '#e5484d', 8, 0, id),
    async () => strokeTo('line', [P(220, 270), P(300, 335)], '#e5484d', 8, 0, id),
    async () => strokeTo('rect', [P(200, 380), P(240, 440)], '#3b6cff', 5, 0, id),
    async () => { const pts = []; for (let i = 0; i <= 30; i++) pts.push(P(60 + i * 3, 120 + Math.sin(i * 0.5) * 6)); return strokeTo('pencil', pts, '#1b1f2a', 12, 12, id); },
    async () => { const pts = []; for (let i = 0; i <= 26; i++) pts.push(P(340 + i * 2.5, 90 + Math.sin(i * 0.6) * 5)); return strokeTo('pencil', pts, '#1b1f2a', 12, 12, id); },
    async () => { for (let k = 0; k < 18; k++) { if (id !== demoId) return false; spray(P(600 + Math.sin(k) * 40, 470 + k * 3), 22); setTool('spray'); setColor('#12a594'); await wait(20); } return true; },
  ];
  for (const s of steps) { if (!(await s())) return; await wait(140); if (id !== demoId) return; }
  setTool('brush'); setColor(PALETTE[0]); size.value = 10; showSize();
}
setInterval(() => { if (performance.now() - lastInput > 20000) { lastInput = performance.now(); demo(); } }, 1000);
demo();
window.__paint = { fill: floodFill, pixel: (x, y) => [...g.getImageData(x, y, 1, 1).data], exportURL, undo, stopDemo: userAct, setTool, setColor, begin, move, end, get undoDepth() { return undoStack.length; }, W: () => W, H: () => H };
</script>
</body>
</html>
