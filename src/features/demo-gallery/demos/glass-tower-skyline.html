<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glass Tower Skyline</title>
<meta name="category" content="aero" />
<meta name="style" content="glasscity" />
<meta name="order" content="63" />
<meta name="capture" content="3800" />
<meta name="tags" content="raw WebGL, SDF raymarching, domain repetition, glass reflections, soft shadows, time of day" />
<meta name="description" content="A slow drone glide down an avenue of white-framed glass towers, entirely raymarched in one fragment shader: every tower is a signed-distance box picked by hashing its city cell, the glass reflects the sky and the towers across the street, the sun casts soft shadows, and a red construction crane rises out of an unfinished block. Click to roll the light from dawn to noon to dusk. Hard because an infinite city comes from domain repetition with a ray-exit step limit so no tower is skipped, plus a second reflection march and a soft-shadow march per pixel at interactive frame rates." />
<meta name="prompt" content="Write a raw WebGL fragment-shader skyline, one HTML file, no libraries: raymarch an infinite grid of glass skyscrapers (SDF boxes sized by a cell hash, empty avenue along the camera path), clamp each step to the ray's exit from the current cell so neighbours are never skipped, shade white mullion frames and dark blue glass with Fresnel reflections from a second march, soft sun shadows, distance haze, a red construction crane, and a sun glare. Fly the camera slowly down the avenue, blend dawn, noon and dusk palettes on click, scale render resolution to hold frame rate, and add a small clean HUD." />
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #bcd6ea; font-family: "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; }
#hud { position: fixed; left: 24px; top: 22px; color: #fff; text-shadow: 0 1px 10px rgba(0, 30, 60, 0.45); pointer-events: none; }
#hud .k { font-size: 11px; letter-spacing: 5px; font-weight: 700; }
#hud .k::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #e8202a; margin-right: 10px; vertical-align: -1px; }
#clock { font-size: 40px; font-weight: 200; margin-top: 4px; }
#modes { position: fixed; right: 24px; top: 24px; display: flex; gap: 0; }
#modes button { font-family: inherit; font-weight: 700; font-size: 11px; line-height: 1; letter-spacing: 3px; padding: 10px 14px; border: 0; cursor: pointer; background: rgba(255, 255, 255, 0.82); color: #26323d; }
#modes button.on { background: #e8202a; color: #fff; }
@media (max-width: 600px) { #hud { left: 14px; top: 14px; } #clock { font-size: 28px; } #modes { right: 12px; top: 14px; } #modes button { padding: 8px 9px; letter-spacing: 1px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="k">SKYLINE · CENTRAL</div><div id="clock">12:00</div></div>
<div id="modes"></div>
<script>
const PRESETS = [
  { name: 'DAWN', clock: '06:40', sun: [0.8, 0.14, 0.45], top: [0.22, 0.34, 0.62], hor: [1.0, 0.76, 0.56], sunCol: [1.0, 0.72, 0.48] },
  { name: 'NOON', clock: '12:00', sun: [0.35, 0.82, 0.45], top: [0.1, 0.38, 0.8], hor: [0.76, 0.88, 0.97], sunCol: [1.0, 0.97, 0.92] },
  { name: 'DUSK', clock: '19:10', sun: [-0.75, 0.1, 0.55], top: [0.24, 0.2, 0.46], hor: [1.0, 0.58, 0.6], sunCol: [1.0, 0.5, 0.4] },
];

const FRAG = `
precision highp float;
uniform vec2 res; uniform float time;
uniform vec3 sunDir, skyTop, skyHor, sunCol;
#define CELL 36.0
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }

// Towers > half extents from cell hash; row 0 is the open avenue
vec4 towerIn(vec2 id){
  float h = 16.0 + pow(h21(id + 7.3), 2.5) * 120.0;
  vec3 he = vec3(7.0 + h21(id + 3.1) * 7.5, h * 0.5, 7.0 + h21(id + 5.7) * 7.5);
  return vec4(he, step(0.1, h21(id)) * step(0.5, abs(id.y)));
}
float towerDist(vec3 p, vec2 id){
  vec4 t = towerIn(id);
  if (t.w < 0.5) return 1e5;
  vec2 c = id * CELL;
  return sdBox(p - vec3(c.x, t.y, c.y), t.xyz);
}
// Crane > repeats every 600 m beside the avenue
float craneDist(vec3 p){
  vec3 q = vec3(mod(p.x + 300.0, 600.0) - 300.0, p.y, p.z + 19.0);
  float mast = sdBox(q - vec3(0.0, 62.0, 0.0), vec3(1.2, 62.0, 1.2));
  float jib = sdBox(q - vec3(14.0, 122.0, 0.0), vec3(30.0, 1.0, 1.0));
  float cab = sdBox(q - vec3(-10.0, 120.0, 0.0), vec3(5.0, 2.5, 1.8));
  float cable = sdBox(q - vec3(36.0, 98.0, 0.0), vec3(0.15, 24.0, 0.15));
  return min(min(mast, jib), min(cab, cable));
}
float sceneDist(vec3 p, out float mat){
  float dt = towerDist(p, floor(p.xz / CELL + 0.5)), dc = craneDist(p);
  float d = p.y; mat = 0.0;
  if (dt < d) { d = dt; mat = 1.0; }
  if (dc < d) { d = dc; mat = 2.0; }
  return d;
}
// March > step never passes the current cell's exit, so neighbour towers can't be skipped
float cellExit(vec3 p, vec2 r){
  vec2 local = p.xz - floor(p.xz / CELL + 0.5) * CELL;
  vec2 exitT = (sign(r) * CELL * 0.5 - local) / r;
  return min(exitT.x, exitT.y) + 0.05;
}
vec2 safeXZ(vec3 rd){ return rd.xz + vec2(lessThan(abs(rd.xz), vec2(1e-5))) * 1e-5; }
float march(vec3 ro, vec3 rd, float maxT, int steps, out float mat){
  vec2 r = safeXZ(rd);
  float t = 0.0;
  for (int i = 0; i < 170; i++) {
    if (i >= steps) break;
    vec3 p = ro + rd * t;
    float d = sceneDist(p, mat);
    if (d < 0.01 + t * 0.0015) return t;
    t += min(d, cellExit(p, r));
    if (t > maxT) break;
  }
  mat = -1.0; return maxT;
}
float softShadow(vec3 ro, vec3 rd){
  vec2 r = safeXZ(rd);
  float res = 1.0, t = 0.3, m;
  for (int i = 0; i < 56; i++) {
    vec3 p = ro + rd * t;
    float d = sceneDist(p, m);
    res = min(res, 8.0 * d / t);
    if (res < 0.02 || t > 400.0) break;
    t += max(0.2, min(d, cellExit(p, r)));
  }
  return clamp(res, 0.0, 1.0);
}
vec3 normalAt(vec3 p){
  float m; vec2 e = vec2(0.02, 0.0);
  return normalize(vec3(sceneDist(p + e.xyy, m) - sceneDist(p - e.xyy, m), sceneDist(p + e.yxy, m) - sceneDist(p - e.yxy, m), sceneDist(p + e.yyx, m) - sceneDist(p - e.yyx, m)));
}
vec3 sky(vec3 rd){
  vec3 c = mix(skyHor, skyTop, pow(max(rd.y, 0.0), 0.45));
  float s = max(dot(rd, sunDir), 0.0);
  c += sunCol * (pow(s, 700.0) * 10.0 + pow(s, 10.0) * 0.25);
  return mix(c, skyHor * 0.85, smoothstep(0.0, -0.12, rd.y));
}
// Surface > albedo times light; glassAmt = how much of the pixel is glass pane
vec3 surface(vec3 p, vec3 n, float mat, out float glassAmt){
  glassAmt = 0.0;
  vec3 albedo = vec3(0.72, 0.75, 0.78);
  if (mat > 1.5) albedo = vec3(0.8, 0.07, 0.06);
  else if (mat > 0.5 && n.y < 0.5) {
    float u = abs(n.x) > 0.5 ? p.z : p.x;
    vec2 f = fract(vec2(u / 2.6, p.y / 3.6));
    float frame = clamp(step(f.x, 0.08) + step(f.y, 0.1), 0.0, 1.0);
    albedo = mix(vec3(0.02, 0.07, 0.14), vec3(0.95), frame);
    glassAmt = 1.0 - frame;
  } else if (mat > 0.5) albedo = vec3(0.9);
  vec3 amb = mix(skyHor, skyTop, 0.5) * 0.4;
  float selfLit = mat > 1.5 ? 0.35 : 0.0;
  return albedo * (amb + selfLit + sunCol * max(dot(n, sunDir), 0.0) * 1.15);
}
vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * res) / res.y;
  vec3 ro = vec3(470.0 + time * 6.0, 96.0 + sin(time * 0.15) * 10.0, sin(time * 0.07) * 6.0);
  vec3 ww = normalize(vec3(1.0, -0.2 + 0.05 * sin(time * 0.11), -0.12 + 0.25 * sin(time * 0.05)));
  vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0))), vv = cross(uu, ww);
  vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.3 * ww);
  float mat, t = march(ro, rd, 900.0, 170, mat);
  vec3 col = sky(rd);
  if (mat > -0.5) {
    vec3 p = ro + rd * t, n = normalAt(p);
    float glassAmt;
    col = surface(p, n, mat, glassAmt) * mix(0.5, 1.0, softShadow(p + n * 0.05, sunDir));
    if (glassAmt > 0.0) {
      vec3 r = reflect(rd, n), ro2 = p + n * 0.1;
      float rm, t2 = march(ro2, r, 500.0, 64, rm), g2;
      vec3 rc = sky(r);
      if (rm > -0.5) { vec3 p2 = ro2 + r * t2; rc = mix(surface(p2, normalAt(p2), rm, g2), skyHor, 1.0 - exp(-t2 * 0.004)); }
      float fres = 0.3 + 0.7 * pow(1.0 - max(dot(-rd, n), 0.0), 3.0);
      col = mix(col, rc, glassAmt * fres);
    }
    col = mix(col, skyHor, 1.0 - exp(-t * 0.0013));
  }
  col += sunCol * pow(max(dot(rd, sunDir), 0.0), 5.0) * 0.12;
  col = pow(aces(col), vec3(1.0 / 2.2));
  col *= 1.0 - 0.18 * dot(uv * 0.8, uv * 0.8);
  gl_FragColor = vec4(col, 1.0);
}`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }'));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = Object.fromEntries(['res', 'time', 'sunDir', 'skyTop', 'skyHor', 'sunCol'].map((n) => [n, gl.getUniformLocation(prog, n)]));

// Time of day > blend presets; colours go linear before upload
const toLinear = (c) => c.map((v) => v ** 2.2);
const normalize = (v) => { const l = Math.hypot(...v); return v.map((x) => x / l); };
let from = PRESETS[1], to = PRESETS[1], blend = 1, mode = 1;
const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
function setMode(i) {
  if (i === mode && blend >= 1) return;
  from = currentPalette(); to = PRESETS[i]; blend = 0; mode = i;
  document.querySelectorAll('#modes button').forEach((b, k) => b.classList.toggle('on', k === i));
  document.getElementById('clock').textContent = to.clock;
}
function currentPalette() {
  const k = blend * blend * (3 - 2 * blend);
  return { sun: normalize(mix(from.sun, to.sun, k)), top: mix(from.top, to.top, k), hor: mix(from.hor, to.hor, k), sunCol: mix(from.sunCol, to.sunCol, k) };
}
document.getElementById('modes').append(...PRESETS.map((p, i) => {
  const b = document.createElement('button'); b.textContent = p.name; b.className = i === mode ? 'on' : '';
  b.addEventListener('click', (e) => { e.stopPropagation(); lastInput = performance.now(); setMode(i); });
  return b;
}));
canvas.addEventListener('click', () => { lastInput = performance.now(); setMode((mode + 1) % PRESETS.length); });

// Resolution > shrink render scale when frames run slow
let scale = 0.62, slowFrames = 0;
function fit() { canvas.width = Math.round(innerWidth * scale); canvas.height = Math.round(innerHeight * scale); gl.viewport(0, 0, canvas.width, canvas.height); }
fit(); addEventListener('resize', fit);
function adaptScale(dt) {
  slowFrames = dt > 0.026 ? slowFrames + 1 : Math.max(0, slowFrames - 1);
  if (slowFrames > 20 && scale > 0.36) { scale -= 0.08; slowFrames = 0; fit(); }
}

let lastInput = -1e9, last = performance.now(), nextAttract = 12;
const t0 = performance.now();
function frame(now) {
  const dt = (now - last) / 1000, t = (now - t0) / 1000; last = now;
  adaptScale(dt);
  blend = Math.min(1, blend + dt / 2.5);
  if (now - lastInput > 10000 && t > nextAttract) { nextAttract = t + 12; setMode((mode + 1) % PRESETS.length); }
  const p = currentPalette();
  gl.uniform2f(U.res, canvas.width, canvas.height); gl.uniform1f(U.time, t);
  gl.uniform3fv(U.sunDir, p.sun); gl.uniform3fv(U.skyTop, toLinear(p.top)); gl.uniform3fv(U.skyHor, toLinear(p.hor)); gl.uniform3fv(U.sunCol, toLinear(p.sunCol));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__skyline = { setMode, scale: () => scale };
</script>
</body>
</html>
