<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Temple at Sunset</title>
<meta name="category" content="shaders" />
<meta name="order" content="3" />
<meta name="capture" content="3000" />
<meta name="tags" content="SDF scene, domain repetition, soft shadows, god rays" />
<meta name="description" content="An endless marble colonnade built from signed distance functions and domain repetition, lit by a low sun: soft shadows, fog, volumetric god rays and a slow camera dolly. The Inigo Quilez school of 'whole world in one shader'." />
<meta name="prompt" content="Write a single-file WebGL2 fragment shader scene: an infinite Greek colonnade made with SDFs and domain repetition, fluted columns, a terrace and distant mountains at sunset. Soft shadows, AO, fog and volumetric god rays through the columns, slow camera dolly, drag to look around, slider for sun height." />
<style>
  :root { --ink: #fff4e6; --muted: #c9b39b; --panel: rgba(30, 16, 10, 0.55); --accent: #ffb070; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140906; color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  .title { position: fixed; left: 20px; top: 18px; pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,0.4); }
  .title h1 { margin: 0; font-size: 20px; }
  .title p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  #panel { position: fixed; left: 16px; bottom: 16px; width: 270px; padding: 14px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 12.5px; }
  #panel label { display: grid; grid-template-columns: 60px 1fr 40px; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  #panel output { text-align: right; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .btns button { border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.06); color: var(--ink); border-radius: 9px; padding: 6px 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btns button.on { background: var(--accent); color: #2a1206; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 11.5px; }
  #stats { position: fixed; right: 18px; top: 18px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 600px) { #panel { left: 10px; right: 10px; width: auto; } #stats { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Temple at Sunset</h1><p>SDF colonnade · soft shadows · volumetric light</p></div>
<div id="stats"></div>
<div id="panel">
  <label>Sun <input id="sun" type="range" min="0.03" max="0.6" step="0.005" value="0.11"><output id="sun-o"></output></label>
  <label>Speed <input id="speed" type="range" min="0" max="2" step="0.05" value="0.6"><output id="speed-o"></output></label>
  <div class="btns"><button id="rays" class="on">God rays</button><button id="cycle">Day cycle</button></div>
  <div class="hint">Drag to look around. Double-click to reset view.</div>
</div>
<script>
/**
 * FILE: render-studio/frontend/demos/sdf-temple-sunset.html
 * PURPOSE: WebGL2 SDF scene: repeated fluted columns, terrace, mountains, sunset sky, soft shadows, god rays, dolly cam
 * UI: Render Studio > Shaders > Temple at Sunset
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: none (standalone page)
 */
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
const $ = (id) => document.getElementById(id);

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uSun, uRays, uDolly; uniform vec2 uLook;
out vec4 outColor;
float hash(float n){ return fract(sin(n)*43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash2(i), hash2(i+vec2(1,0)), f.x), mix(hash2(i+vec2(0,1)), hash2(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for(int i = 0; i < 5; i++){ s += a*noise(p); p *= 2.03; a *= 0.5; } return s; }
float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
const float PER = 2.4;
// returns distance, material id in .y (1 floor/terrace, 2 marble)
vec2 map(vec3 p){
  vec2 res = vec2(p.y, 1.0);
  float terr = sdBox(p - vec3(0.0, 0.3, 0.0), vec3(1e4, 0.3, 3.4));
  float step1 = sdBox(p - vec3(0.0, 0.1, 0.0), vec3(1e4, 0.1, 3.8));
  float t = min(terr, step1);
  if(t < res.x) res = vec2(t, 1.0);
  vec3 q = p;
  q.x = mod(q.x + PER*0.5, PER) - PER*0.5;
  q.z = abs(q.z) - 2.6;
  float h = 4.4;
  float y = q.y - 0.6;
  float r = 0.36 - 0.035*clamp(y/h, 0.0, 1.0);
  float ang = atan(q.z, q.x);
  float cyl = length(q.xz) - r + 0.009*cos(ang*20.0);
  cyl = max(cyl, abs(y - h*0.5) - h*0.5);
  float base = sdBox(q - vec3(0, 0.72, 0), vec3(0.5, 0.12, 0.5)) - 0.02;
  float cap = sdBox(q - vec3(0, 0.6 + h + 0.12, 0), vec3(0.52, 0.12, 0.52)) - 0.02;
  float echinus = length(vec2(length(q.xz) - 0.36, q.y - (0.6 + h - 0.05))) - 0.1;
  float col = min(min(cyl, base), min(cap, echinus));
  float beam = sdBox(vec3(p.x, p.y - (0.6 + h + 0.55), abs(p.z) - 2.6), vec3(1e4, 0.3, 0.58)) - 0.02;
  float cornice = sdBox(vec3(p.x, p.y - (0.6 + h + 0.95), abs(p.z) - 2.6), vec3(1e4, 0.1, 0.7));
  float m = min(col, min(beam, cornice));
  if(m < res.x) res = vec2(m, 2.0);
  return res;
}
vec2 march(vec3 ro, vec3 rd){
  float t = 0.05; vec2 h = vec2(1.0, 0.0);
  for(int i = 0; i < 160; i++){
    h = map(ro + rd*t);
    if(h.x < 0.0006*t) return vec2(t, h.y);
    t += h.x * 0.85;
    if(t > 90.0) return vec2(t, 0.0);
  }
  // grazing rays that run out of steps right at a silhouette count as hits (no sky sparkle)
  return vec2(t, h.x < 0.05 ? h.y : 0.0);
}
vec3 nrm(vec3 p){ vec2 e = vec2(0.001, 0); return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x, map(p+e.yxy).x-map(p-e.yxy).x, map(p+e.yyx).x-map(p-e.yyx).x)); }
float shadow(vec3 ro, vec3 rd, float k){
  float res = 1.0, t = 0.02;
  for(int i = 0; i < 48; i++){
    float h = map(ro + rd*t).x;
    res = min(res, k*h/t);
    t += clamp(h, 0.03, 0.6);
    if(res < 0.003 || t > 30.0) break;
  }
  return clamp(res, 0.0, 1.0);
}
float vis(vec3 ro, vec3 rd){
  float t = 0.05;
  for(int i = 0; i < 18; i++){ float h = map(ro + rd*t).x; if(h < 0.01) return 0.0; t += max(h, 0.15); if(t > 20.0) break; }
  return 1.0;
}
float ao(vec3 p, vec3 n){
  float o = 0.0, s = 1.0;
  for(int i = 1; i <= 5; i++){ float h = 0.03 + 0.12*float(i); o += (h - map(p + n*h).x)*s; s *= 0.75; }
  return clamp(1.0 - 1.6*o, 0.0, 1.0);
}
vec3 sunDir(){ float e = uSun; return normalize(vec3(0.55, e, 0.85)); }
vec3 sky(vec3 rd){
  vec3 L = sunDir();
  float e = clamp(uSun / 0.6, 0.0, 1.0);
  vec3 zen = mix(vec3(0.16, 0.10, 0.32), vec3(0.18, 0.38, 0.75), e);
  vec3 hor = mix(vec3(1.0, 0.38, 0.12), vec3(0.85, 0.82, 0.78), e);
  vec3 c = mix(hor, zen, pow(clamp(rd.y, 0.0, 1.0), 0.45));
  float s = max(dot(rd, L), 0.0);
  c += vec3(1.0, 0.55, 0.25) * pow(s, 8.0) * 0.6 * (1.0 - e*0.6);
  c += vec3(1.0, 0.8, 0.55) * pow(s, 900.0) * 30.0;
  // streaky clouds
  if(rd.y > 0.0){
    vec2 cp = rd.xz / (rd.y + 0.08) * 0.8 + vec2(uTime*0.01, 0.0);
    float cl = smoothstep(0.5, 0.85, fbm(cp*vec2(0.6, 2.4)));
    vec3 cc = mix(vec3(1.0, 0.55, 0.35), vec3(1.0), e) * (0.5 + 0.9*pow(s, 3.0));
    c = mix(c, cc, cl * 0.75 * smoothstep(0.0, 0.15, rd.y));
  }
  // distant mountain silhouettes
  float az = atan(rd.x, rd.z);
  float mh = 0.02 + 0.06*fbm(vec2(az*3.0, 1.0)) + 0.03*fbm(vec2(az*9.0, 3.0));
  if(rd.y < mh && rd.y > -0.02){
    vec3 mc = mix(hor*0.55, zen*0.6, 0.35);
    c = mix(c, mc, smoothstep(mh, mh - 0.004, rd.y) * 0.85);
  }
  return c;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); }
void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes) / uRes.y;
  vec3 ro = vec3(uDolly, 1.75, -0.6);
  float yaw = 0.85 + uLook.x, pitch = 0.1 + uLook.y;
  vec3 f = normalize(vec3(sin(yaw)*cos(pitch), sin(pitch), cos(yaw)*cos(pitch)));
  vec3 r = normalize(cross(f, vec3(0,1,0))), u = cross(r, f);
  vec3 rd = normalize(uv.x*r + uv.y*u + 1.6*f);
  vec3 L = sunDir();
  float e = clamp(uSun / 0.6, 0.0, 1.0);
  vec3 sunC = mix(vec3(1.9, 1.05, 0.55), vec3(1.7, 1.6, 1.45), e) * 2.0;
  vec3 skyC = mix(vec3(0.35, 0.3, 0.45), vec3(0.4, 0.55, 0.8), e);
  vec2 hit = march(ro, rd);
  float t = hit.x;
  vec3 col;
  if(hit.y > 0.5){
    vec3 p = ro + rd*t, n = nrm(p);
    vec3 alb;
    if(hit.y < 1.5){
      // terrace stone tiles, worn
      vec2 tile = floor(p.xz*0.8);
      float grout = smoothstep(0.0, 0.03, min(fract(p.x*0.8), fract(p.z*0.8)));
      alb = vec3(0.62, 0.5, 0.38) * (0.8 + 0.25*hash2(tile)) * (0.75 + 0.25*grout) * (0.85 + 0.3*fbm(p.xz*2.0));
      if(p.y < 0.01) alb = vec3(0.55, 0.42, 0.3) * (0.7 + 0.4*fbm(p.xz*0.5));
    } else {
      alb = vec3(0.82, 0.76, 0.68) * (0.85 + 0.2*fbm(p.xy*3.0 + p.z));
    }
    float occ = ao(p, n);
    float dif = clamp(dot(n, L), 0.0, 1.0);
    float sha = dif > 0.0 ? shadow(p + n*0.01, L, 14.0) : 0.0;
    float amb = 0.5 + 0.5*n.y;
    float bnc = clamp(dot(n, normalize(vec3(-L.x, 0.0, -L.z))), 0.0, 1.0) * clamp(1.0 - p.y, 0.0, 1.0);
    vec3 lin = dif*sha*sunC + amb*occ*skyC*0.55 + bnc*occ*vec3(0.5, 0.3, 0.18)*0.5;
    col = alb * lin;
    float spe = pow(clamp(dot(reflect(rd, n), L), 0.0, 1.0), 24.0) * sha * 0.25;
    col += spe * sunC;
    // aerial perspective
    vec3 haze = mix(vec3(0.95, 0.45, 0.22), vec3(0.75, 0.8, 0.9), e);
    col = mix(col, haze * 0.8, 1.0 - exp(-0.0006*t*t));
  } else {
    col = sky(rd);
  }
  // god rays: sample sun visibility along view ray
  if(uRays > 0.5){
    float tm = min(t, 30.0), acc = 0.0;
    float j = hash2(gl_FragCoord.xy + fract(uTime)*91.0);
    for(int i = 0; i < 24; i++){
      float ts = tm * (float(i) + j) / 24.0;
      acc += vis(ro + rd*ts, L);
    }
    acc /= 24.0;
    float ph = 0.06 + 1.8*pow(max(dot(rd, L), 0.0), 5.0);
    col += sunC * acc * ph * (1.0 - exp(-tm*0.045)) * 0.12;
  }
  col = aces(col * 0.7);
  col = pow(col, vec3(0.4545));
  col = mix(col, col*col*(3.0-2.0*col), 0.45);
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(vec3(lum), col, 1.18);
  vec2 q = gl_FragCoord.xy / uRes;
  col *= 0.5 + 0.5*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.15);
  outColor = vec4(col, 1.0);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const ploc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(ploc);
gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);
const U = Object.fromEntries(['uRes', 'uTime', 'uSun', 'uRays', 'uDolly', 'uLook'].map((n) => [n, gl.getUniformLocation(prog, n)]));

// HUD > controls
const opts = { sun: 0.11, speed: 0.6 };
for (const k of Object.keys(opts)) {
  const el = $(k);
  const show = () => { opts[k] = Number(el.value); $(`${k}-o`).textContent = opts[k].toFixed(2); };
  el.addEventListener('input', () => { show(); if (k === 'sun') { cycle = false; $('cycle').classList.remove('on'); } });
  show();
}
let rays = true, cycle = false;
$('rays').onclick = () => { rays = !rays; $('rays').classList.toggle('on', rays); };
$('cycle').onclick = () => { cycle = !cycle; $('cycle').classList.toggle('on', cycle); };

// Shader > look: drag offsets yaw/pitch, eases back toward rest when released
const look = { x: 0, y: 0 }, drag = { on: false, x: 0, y: 0 };
cv.addEventListener('pointerdown', (e) => { drag.on = true; drag.x = e.clientX; drag.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => {
  if (!drag.on) return;
  look.x -= (e.clientX - drag.x) * 0.004; look.y = Math.max(-0.6, Math.min(0.7, look.y - (e.clientY - drag.y) * 0.004));
  drag.x = e.clientX; drag.y = e.clientY;
});
addEventListener('pointerup', () => (drag.on = false));
cv.addEventListener('dblclick', () => { look.x = 0; look.y = 0; });

let scale = Math.min(devicePixelRatio || 1, 1.0), ftAvg = 16, frames = 0, stable = 0;
function resize() { cv.width = Math.round(innerWidth * scale); cv.height = Math.round(innerHeight * scale); gl.viewport(0, 0, cv.width, cv.height); }
addEventListener('resize', resize); resize();

let last = performance.now(), t0 = last, dolly = 0, fps = 60, fpsN = 0, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  ftAvg = ftAvg * 0.92 + dt * 1000 * 0.08;
  if (++frames % 30 === 0) {
    // drop fast when slow; creep back up only after ~5 s steady at vsync
    stable = ftAvg < 17.5 ? stable + 1 : 0;
    const next = ftAvg > 20 ? scale * 0.85 : stable > 10 ? scale * 1.05 : scale;
    if (stable > 10) stable = 0;
    const c = Math.min(Math.min(devicePixelRatio || 1, 1.0), Math.max(0.3, next));
    if (Math.abs(c - scale) > 0.01) { scale = c; resize(); }
  }
  dolly += opts.speed * dt;
  if (cycle) {
    const s = 0.03 + 0.57 * (0.5 - 0.5 * Math.cos((now - t0) / 1000 * 0.12));
    opts.sun = s; $('sun').value = s; $('sun-o').textContent = s.toFixed(2);
  }
  if (!drag.on) { look.x *= 1 - 0.6 * dt; look.y *= 1 - 0.6 * dt; }
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, (now - t0) / 1000);
  gl.uniform1f(U.uSun, opts.sun);
  gl.uniform1f(U.uRays, rays ? 1 : 0);
  gl.uniform1f(U.uDolly, dolly);
  gl.uniform2f(U.uLook, look.x, look.y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  $('stats').innerHTML = `${fps} fps<br>${cv.width}×${cv.height}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
