<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liquid Chrome</title>
<meta name="category" content="shaders" />
<meta name="order" content="2" />
<meta name="capture" content="2600" />
<meta name="tags" content="metaballs, smooth union, reflections, studio lighting" />
<meta name="description" content="Molten chrome metaballs merge and split in a raymarched studio: smooth-min blending, two-bounce reflections, a glossy floor and procedural softbox lighting. Tests whether a model can fake a product-shot look with zero textures." />
<meta name="prompt" content="Make a single-file WebGL2 shader of liquid chrome metaballs floating above a glossy studio floor. Blobs merge with smooth-min, reflect each other and procedural softbox lights, one blob follows the mouse. Add chrome, gold and iridescent material modes. Full-screen, 60 fps." />
<style>
  :root { --ink: #f2f2f7; --muted: #9a9aab; --panel: rgba(10, 10, 14, 0.62); --accent: #e7e7f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050507; color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .title { position: fixed; left: 20px; top: 18px; pointer-events: none; }
  .title h1 { margin: 0; font-size: 20px; }
  .title p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  #panel { position: fixed; left: 16px; bottom: 16px; width: 270px; padding: 14px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); font-size: 12.5px; }
  #panel label { display: grid; grid-template-columns: 60px 1fr 34px; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); }
  #panel output { text-align: right; color: var(--ink); }
  input[type=range] { width: 100%; accent-color: #c9c9d6; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btns button { border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--ink); border-radius: 9px; padding: 6px 4px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btns button.on { background: var(--accent); color: #111; }
  .hint { margin-top: 10px; color: var(--muted); font-size: 11.5px; }
  #stats { position: fixed; right: 18px; top: 18px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 600px) { #panel { left: 10px; right: 10px; width: auto; } #stats { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Liquid Chrome</h1><p>raymarched metaballs · reflections · no textures</p></div>
<div id="stats"></div>
<div id="panel">
  <label>Blobs <input id="count" type="range" min="3" max="9" step="1" value="7"><output id="count-o"></output></label>
  <label>Merge <input id="merge" type="range" min="0.1" max="0.9" step="0.01" value="0.45"><output id="merge-o"></output></label>
  <div class="btns"><button data-m="0" class="on">Chrome</button><button data-m="1">Gold</button><button data-m="2">Iridescent</button></div>
  <div class="hint">Move the pointer: the lead blob follows it. Click to splash.</div>
</div>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
const $ = (id) => document.getElementById(id);
const MAXB = 9;

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime, uK; uniform vec4 uB[${MAXB}]; uniform int uN, uMat; uniform float uSplash;
out vec4 outColor;
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h*h*k*0.25; }
float blobs(vec3 p){
  float d = 1e9;
  for(int i = 0; i < ${MAXB}; i++){
    if(i >= uN) break;
    vec4 b = uB[i];
    // surface ripple from splash
    float rip = uSplash * 0.03 * sin(18.0*length(p - b.xyz) - uTime*14.0);
    d = smin(d, length(p - b.xyz) - b.w + rip, uK);
  }
  return d;
}
const float FLOOR = -1.25;
vec3 env(vec3 rd){
  // studio: dark falloff, big overhead softbox, two strip lights, colored rims
  vec3 c = mix(vec3(0.03,0.03,0.036), vec3(0.008,0.008,0.012), smoothstep(0.0, 0.7, rd.y));
  c = mix(c, vec3(0.02,0.02,0.024), smoothstep(0.0, -0.3, rd.y));
  float top = smoothstep(0.86, 0.9, rd.y) * smoothstep(0.55, 0.3, abs(rd.x)) ;
  c += vec3(3.2) * top;
  vec3 a = normalize(vec3(-0.9, 0.25, 0.4)), b = normalize(vec3(0.95, 0.2, 0.25));
  float s1 = smoothstep(0.985, 0.995, dot(rd, a)) + smoothstep(0.93, 0.99, 1.0 - abs(rd.y - 0.25)) * smoothstep(0.96, 0.995, dot(normalize(rd.xz), normalize(a.xz))) * 0.0;
  float strip1 = smoothstep(0.03, 0.0, abs(atan(rd.x, rd.z) - atan(a.x, a.z))) * smoothstep(-0.2, 0.1, rd.y) * smoothstep(0.75, 0.5, rd.y);
  float strip2 = smoothstep(0.03, 0.0, abs(atan(rd.x, rd.z) - atan(b.x, b.z))) * smoothstep(-0.2, 0.1, rd.y) * smoothstep(0.75, 0.5, rd.y);
  c += vec3(2.4) * (strip1 + strip2) + s1;
  c += vec3(1.0, 0.25, 0.55) * pow(max(dot(rd, normalize(vec3(-1.0, 0.05, -0.6))), 0.0), 18.0) * 1.6;
  c += vec3(0.2, 0.6, 1.0) * pow(max(dot(rd, normalize(vec3(1.0, -0.05, -0.7))), 0.0), 18.0) * 1.6;
  return c;
}
float march(vec3 ro, vec3 rd, float tmax){
  float t = 0.0;
  for(int i = 0; i < 96; i++){
    float d = blobs(ro + rd*t);
    if(d < 0.0008*t + 0.0005) return t;
    t += d;
    if(t > tmax) break;
  }
  return -1.0;
}
vec3 nrm(vec3 p){ vec2 e = vec2(0.0015, 0); return normalize(vec3(blobs(p+e.xyy)-blobs(p-e.xyy), blobs(p+e.yxy)-blobs(p-e.yxy), blobs(p+e.yyx)-blobs(p-e.yyx))); }
const vec3 HORIZON = vec3(0.03,0.03,0.036);
// floor: dark gloss + soft light pool under overhead softbox, fades into cyc wall color
vec3 floorCol(vec3 pf){
  float r2 = dot(pf.xz, pf.xz);
  vec3 c = vec3(0.012,0.012,0.015) + vec3(0.09,0.09,0.1) * exp(-r2*0.12);
  return mix(c, HORIZON, 1.0 - exp(-0.012*r2));
}
vec3 tint(vec3 n, vec3 rd){
  float f = 1.0 - max(dot(n, -rd), 0.0);
  if(uMat == 1) return mix(vec3(1.0, 0.72, 0.32), vec3(1.0, 0.9, 0.7), f);
  if(uMat == 2) return 0.62 + 0.38*cos(6.28318*(vec3(0.0, 0.33, 0.67) + f*1.6 + 0.15));
  return mix(vec3(0.92, 0.93, 0.97), vec3(1.0), f);
}
// shade blob surface with up to 1 inter-reflection bounce
vec3 shadeBlob(vec3 p, vec3 rd){
  vec3 n = nrm(p);
  vec3 r = reflect(rd, n);
  vec3 tc = tint(n, rd);
  float t2 = march(p + n*0.01, r, 6.0);
  vec3 refl;
  if(t2 > 0.0){
    vec3 p2 = p + n*0.01 + r*t2; vec3 n2 = nrm(p2);
    refl = env(reflect(r, n2)) * tint(n2, r) * 0.85;
  } else if(r.y < 0.0){
    // reflected ray hits floor: dark glossy floor
    float tf = (FLOOR - p.y) / r.y; vec3 pf = p + r*tf;
    refl = floorCol(pf);
  } else refl = env(r);
  float fre = 0.8 + 0.2*pow(1.0 - max(dot(n, -rd), 0.0), 5.0);
  return refl * tc * fre;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0., 1.); }
void main(){
  vec2 uv = (2.0*gl_FragCoord.xy - uRes) / uRes.y;
  vec3 ro = vec3(0.0, 0.35, 5.2);
  vec3 ta = vec3(0.0, -0.15, 0.0);
  vec3 f = normalize(ta - ro), r = normalize(cross(f, vec3(0,1,0))), u = cross(r, f);
  vec3 rd = normalize(uv.x*r + uv.y*u + 2.2*f);
  vec3 col;
  float t = march(ro, rd, 12.0);
  float tf = rd.y < 0.0 ? (FLOOR - ro.y) / rd.y : 1e9;
  if(t > 0.0 && t < tf){
    col = shadeBlob(ro + rd*t, rd);
  } else if(tf < 1e8){
    vec3 pf = ro + rd*tf;
    // floor: blurred-ish reflection of blobs + contact occlusion
    vec3 rr = reflect(rd, vec3(0,1,0));
    float tr = march(pf + vec3(0,0.001,0), rr, 6.0);
    vec3 refl = tr > 0.0 ? shadeBlob(pf + rr*tr, rr) : env(rr) * 0.4;
    float ao = 1.0;
    for(int i = 1; i < 5; i++){ float h = float(i)*0.18; ao -= (h - blobs(pf + vec3(0,h,0))) * 0.35 / float(i); }
    ao = clamp(ao, 0.0, 1.0);
    float fres = 0.04 + 0.5*pow(1.0 - max(rd.y*-1.0, 0.0), 5.0);
    vec3 fc = floorCol(pf);
    col = fc * ao + refl * (0.12 + fres) * ao * exp(-0.03*dot(pf.xz, pf.xz));
  } else col = env(rd) * 0.35 + HORIZON * 0.65 * smoothstep(0.35, 0.0, rd.y);
  col = aces(col);
  col = pow(col, vec3(0.4545));
  vec2 q = gl_FragCoord.xy / uRes;
  col *= 0.4 + 0.6*pow(16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.2);
  col += (fract(sin(dot(gl_FragCoord.xy + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  outColor = vec4(col, 1.0);
}`;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.bindAttribLocation(prog, 0, 'p');
gl.vertexAttribPointer(gl.getAttribLocation(prog, 'p'), 2, gl.FLOAT, false, 0, 0);
const U = Object.fromEntries(['uRes', 'uTime', 'uK', 'uB', 'uN', 'uMat', 'uSplash'].map((n) => [n, gl.getUniformLocation(prog, n)]));

// HUD > controls
let mat = 0, splash = 0;
const opts = { count: 7, merge: 0.45 };
for (const k of Object.keys(opts)) {
  const el = $(k);
  const show = () => { opts[k] = Number(el.value); $(`${k}-o`).textContent = k === 'count' ? opts[k] : opts[k].toFixed(2); };
  el.addEventListener('input', show); show();
}
document.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => { mat = Number(b.dataset.m); document.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); }));

// Shader > pointer: lead blob eases toward pointer projected on z=0 plane
const target = { x: 0, y: 0.1 }, lead = { x: 0, y: 0.1, vx: 0, vy: 0 };
let lastMove = -1e9;
addEventListener('pointermove', (e) => {
  const aspect = innerWidth / innerHeight;
  target.x = ((e.clientX / innerWidth) * 2 - 1) * aspect * 1.25;
  target.y = (1 - (e.clientY / innerHeight) * 2) * 1.25 - 0.1;
  lastMove = performance.now();
});
cv.addEventListener('pointerdown', () => { splash = 1; lead.vy += 3; });

let scale = Math.min(devicePixelRatio || 1, 1.25), ftAvg = 16, frames = 0, stable = 0;
function resize() { cv.width = Math.round(innerWidth * scale); cv.height = Math.round(innerHeight * scale); gl.viewport(0, 0, cv.width, cv.height); }
addEventListener('resize', resize); resize();

const seeds = Array.from({ length: MAXB }, (_, i) => [1.3 + i * 0.37, 0.9 + i * 0.23, 0.7 + i * 0.29, i * 1.7]);
let last = performance.now(), t0 = last, fps = 60, fpsN = 0, fpsT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = (now - t0) / 1000;
  ftAvg = ftAvg * 0.92 + dt * 1000 * 0.08;
  if (++frames % 30 === 0) {
    // drop fast when slow; creep back up only after ~5 s steady at vsync
    stable = ftAvg < 17.5 ? stable + 1 : 0;
    const next = ftAvg > 20 ? scale * 0.85 : stable > 10 ? scale * 1.05 : scale;
    if (stable > 10) stable = 0;
    const c = Math.min(Math.min(devicePixelRatio || 1, 1.25), Math.max(0.35, next));
    if (Math.abs(c - scale) > 0.01) { scale = c; resize(); }
  }
  // idle: lead blob wanders on a figure-eight
  const idle = now - lastMove > 2500;
  const tx = idle ? Math.sin(t * 0.6) * 1.3 : target.x, ty = idle ? Math.sin(t * 1.2) * 0.45 + 0.1 : target.y;
  lead.vx += (tx - lead.x) * 9 * dt; lead.vy += (ty - lead.y) * 9 * dt;
  lead.vx *= 1 - 3.5 * dt; lead.vy *= 1 - 3.5 * dt;
  lead.x += lead.vx * dt; lead.y += lead.vy * dt;
  splash *= 1 - 1.6 * dt;
  const B = new Float32Array(MAXB * 4);
  B.set([lead.x, lead.y, 0.3, 0.66], 0);
  for (let i = 1; i < MAXB; i++) {
    const [a, b, c, ph] = seeds[i];
    B.set([Math.sin(t * a * 0.35 + ph) * 1.25, Math.sin(t * b * 0.4 + ph * 2) * 0.5 + 0.05, Math.cos(t * c * 0.3 + ph) * 0.6, 0.32 + 0.18 * ((i * 7) % 5) / 4], i * 4);
  }
  gl.uniform2f(U.uRes, cv.width, cv.height);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uK, opts.merge);
  gl.uniform4fv(U.uB, B);
  gl.uniform1i(U.uN, opts.count);
  gl.uniform1i(U.uMat, mat);
  gl.uniform1f(U.uSplash, splash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  $('stats').innerHTML = `${fps} fps<br>${cv.width}×${cv.height}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
