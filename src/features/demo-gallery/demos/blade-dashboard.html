<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blade Dashboard</title>
<meta name="category" content="aero" />
<meta name="style" content="console" />
<meta name="order" content="12" />
<meta name="capture" content="3400" />
<meta name="tags" content="2005 console dashboard, CSS 3D, blades, ring of light, WebAudio" />
<meta name="description" content="A 2005-era console dashboard, with no logos. Five coloured 'blades' (Store, Online, Games, Media, Settings) stack like pages in CSS 3D, and switching tabs flips the stack open to the next blade with a synthesized whoosh. Each blade has glossy list rows, a profile card or a big feature tile, an 'award unlocked' toast pops in, and a four-quadrant ring of light pulses at the bottom. Hard because the blades are real 3D-transformed panels whose rotation and depth are recomputed per state, so the pages fold and stay readable at phone width." />
<meta name="prompt" content="Recreate a 2005-era console 'blades' dashboard in one HTML file with no logos: five full-height coloured panels (Store, Online, Games, Media, Settings) stacked in CSS 3D, with labelled tabs on their edges; left/right or click flips between them with a synthesized whoosh. Fill each blade with glossy rows, a profile card or a feature tile, add an 'award unlocked' toast and a glowing four-quadrant ring of light, a soft green-white backdrop and an attract mode." />
<style>
:root { --font: "Segoe UI", "Convection", "Helvetica Neue", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none; }
body { background: radial-gradient(ellipse at 50% 120%, #ffffff, transparent 60%), radial-gradient(ellipse at 20% 0%, #d9f7b0, transparent 50%), linear-gradient(#b9e98f, #e8f8dc 55%, #fdfffb); }
body::before { content: ''; position: fixed; inset: 0; background: repeating-radial-gradient(circle at 50% 120%, rgba(255, 255, 255, 0) 0 40px, rgba(255, 255, 255, 0.25) 40px 42px); pointer-events: none; }
#scene { position: fixed; inset: 6% 4% 16% 13%; perspective: 1600px; perspective-origin: 30% 50%; }
.blade { position: absolute; inset: 0; border-radius: 10px 4px 4px 10px; transform-origin: 0 50%; transition: transform 0.6s cubic-bezier(.3, .8, .25, 1), opacity 0.4s, filter 0.4s; box-shadow: 0 20px 50px rgba(0, 40, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.35); display: flex; overflow: visible; }
.blade::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 30%), repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0 2px, transparent 2px 8px); pointer-events: none; }
.blade .tabl { position: absolute; left: -38px; top: 0; bottom: 0; width: 38px; border-radius: 10px 0 0 10px; cursor: pointer; display: flex; align-items: flex-start; justify-content: center; padding-top: 18px; }
.blade .tabl span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 15px; font-weight: 600; letter-spacing: 1px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
.blade .inner { flex: 1; padding: 26px 30px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; min-width: 0; align-content: start; }
.blade h2 { margin: 0 0 14px; font-size: 30px; font-weight: 300; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25); grid-column: 1 / -1; }
.rows { display: flex; flex-direction: column; gap: 7px; }
.row { height: 38px; border-radius: 6px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 15px; background: linear-gradient(rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); transition: background 0.15s, transform 0.15s; cursor: pointer; }
.row i { width: 22px; height: 22px; border-radius: 50%; flex: none; background: radial-gradient(circle at 50% 30%, #fff, rgba(255, 255, 255, 0.3)); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2); }
.row.hot, .row:hover { background: linear-gradient(#fff, #e8ffe0); color: #1d5d12; transform: translateX(6px); box-shadow: 0 0 14px rgba(255, 255, 255, 0.8); }
.feature { border-radius: 10px; position: relative; overflow: hidden; min-height: 200px; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5), 0 6px 14px rgba(0, 0, 0, 0.25); }
.feature canvas { width: 100%; height: 100%; display: block; }
.feature b { position: absolute; left: 12px; bottom: 10px; font-size: 18px; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
.card { border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-content: start; background: linear-gradient(rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.32)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3); }
.card .pic { width: 74px; height: 74px; border-radius: 8px; background: radial-gradient(circle at 50% 40%, #ffe3c8 0 22%, transparent 23%), radial-gradient(ellipse at 50% 100%, #4dabf7 0 40%, transparent 41%), linear-gradient(#d9f7b0, #fff); box-shadow: inset 0 0 0 2px #fff; }
.card .gt { font-size: 18px; font-weight: 600; }
.card .sc { font-size: 26px; font-weight: 300; }
.card .rep { color: #ffe066; letter-spacing: 2px; }
.card .zone { grid-column: 1 / -1; font-size: 13px; opacity: 0.9; }
/* colours per blade */
.b0 { background: linear-gradient(135deg, #ff9a1a, #e85d00); } .b0 .tabl { background: #f27d0c; }
.b1 { background: linear-gradient(135deg, #7ad14a, #2e8f1e); } .b1 .tabl { background: #4fae2e; }
.b2 { background: linear-gradient(135deg, #39c0c0, #0b7f8f); } .b2 .tabl { background: #1fa0a8; }
.b3 { background: linear-gradient(135deg, #a46be0, #5b2aa8); } .b3 .tabl { background: #7d47c6; }
.b4 { background: linear-gradient(135deg, #a9b4bf, #5d6874); } .b4 .tabl { background: #808b96; }

/* Ring > four quadrants, active one bright */
#ring { position: fixed; left: 50%; bottom: 3%; transform: translateX(-50%); width: 76px; height: 76px; border-radius: 50%; background: radial-gradient(circle, #f6f7f8 0 46%, #c8cdd2 47% 52%, transparent 53%), conic-gradient(var(--q0) 0 25%, var(--q1) 0 50%, var(--q2) 0 75%, var(--q3) 0); box-shadow: 0 4px 12px rgba(0, 40, 0, 0.3), inset 0 0 0 2px rgba(255, 255, 255, 0.8); --q0: #2c3a2c; --q1: #2c3a2c; --q2: #2c3a2c; --q3: #2c3a2c; cursor: pointer; }
#ring::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff, #dfe4e8); box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.15); }
#ring.on { filter: drop-shadow(0 0 8px #8dff5a); }

/* Toast > award unlocked */
#toast { position: fixed; left: 50%; bottom: 14%; transform: translate(-50%, 40px); opacity: 0; display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; border-radius: 30px; background: linear-gradient(#3a3f45, #16191c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 8px 20px rgba(0, 0, 0, 0.4); transition: opacity 0.35s, transform 0.35s; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#toast .ic { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #c9ff9a, #4fae2e 60%, #1d5d12); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.6); display: grid; place-items: center; font-weight: 700; }
#toast small { display: block; opacity: 0.75; font-size: 12px; }

@media (max-width: 700px) {
  #scene { inset: 4% 3% 18% 12%; }
  .blade .inner { grid-template-columns: 1fr; padding: 16px; gap: 12px; overflow: hidden; }
  .blade h2 { font-size: 22px; margin: 0; }
  .feature { min-height: 120px; }
  .blade .tabl { width: 30px; left: -30px; }
  .blade .tabl span { font-size: 12px; }
  .row { height: 32px; font-size: 13px; }
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="ring" title="Guide"></div>
<div id="toast"><div class="ic">★</div><div>Award unlocked<small>20 pts · Flipped every blade</small></div></div>
<script>
const $ = (s) => document.querySelector(s);
const scene = $('#scene');

// Blades > content per tab
const BLADES = [
  { name: 'Store', rows: ['New Arrivals', 'Game Demos', 'Trailers', 'Themes & Pictures', 'Redeem Code'], feat: 'Spring Sale · 50% off', hue: 30 },
  { name: 'Online', rows: ['Friends (6 online)', 'Messages (2)', 'Party Chat', 'Recent Players', 'Edit Profile'], card: true },
  { name: 'Games', rows: ['Play Disc', 'Game Library', 'Awards', 'Arcade', 'Demos'], feat: 'Now Playing · Bubble Racer', hue: 180 },
  { name: 'Media', rows: ['Music', 'Pictures', 'Videos', 'Media Center', 'Visualizer'], feat: 'Aqua Drift · Synth Demo', hue: 270 },
  { name: 'Settings', rows: ['System', 'Profile', 'Family', 'Network', 'Turn Off'], feat: 'Theme: Classic Glass', hue: 210 },
];
const blades = [];
BLADES.forEach((b, i) => {
  const el = document.createElement('div'); el.className = `blade b${i}`;
  const right = b.card
    ? `<div class="card"><div class="pic"></div><div><div class="gt">Visitor</div><div class="sc">13,370 pts</div><div class="rep">★★★★★</div></div><div class="zone">Zone: Recreation · Motto: "glossy forever"</div></div>`
    : `<div class="feature"><canvas width="400" height="260"></canvas><b>${b.feat}</b></div>`;
  el.innerHTML = `<div class="tabl"><span>${b.name}</span></div><div class="inner"><h2>${b.name}</h2><div class="rows">${b.rows.map((r) => `<div class="row"><i></i>${r}</div>`).join('')}</div>${right}</div>`;
  el.addEventListener('click', () => { if (i !== cur) go(i); });
  el.querySelectorAll('.row').forEach((r) => (r.onclick = () => { blip(); r.classList.add('hot'); setTimeout(() => r.classList.remove('hot'), 300); }));
  scene.append(el); blades.push({ el, b, canvas: el.querySelector('canvas') });
});

// Layout > current blade flat; earlier ones folded left, later ones stacked behind
let cur = 1;
function layout() {
  const tab = innerWidth < 700 ? 30 : 38;
  blades.forEach(({ el }, i) => {
    const d = i - cur;
    if (d < 0) el.style.transform = `translateX(${d * (innerWidth < 700 ? 10 : tab)}px)`;
    else el.style.transform = `translateX(${d * tab}px) translateZ(${-d * 50}px)`;
    el.style.zIndex = 100 - Math.abs(d) * 2 - (d < 0 ? 1 : 0);
    el.style.filter = d > 0 ? `brightness(${1 - d * 0.08})` : '';
  });
}
function go(i) { i = Math.max(0, Math.min(blades.length - 1, i)); if (i === cur) return; cur = i; layout(); whoosh(); ring(); }
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
let sx0 = null;
scene.addEventListener('pointerdown', (e) => (sx0 = e.clientX));
scene.addEventListener('pointerup', (e) => { if (sx0 != null && Math.abs(e.clientX - sx0) > 40) go(cur + (e.clientX < sx0 ? 1 : -1)); sx0 = null; });

// Feature tiles > animated canvases
function paintFeat(c, hue, t, k) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, `hsl(${hue},80%,55%)`); g.addColorStop(1, `hsl(${hue + 40},80%,25%)`); x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++) { const a = t * 0.6 + i * 0.52 + k, r = 40 + i * 9; x.strokeStyle = `hsla(${hue + i * 8},90%,70%,0.25)`; x.lineWidth = 6; x.beginPath(); x.arc(w * 0.6 + Math.cos(a) * 30, h * 0.45 + Math.sin(a) * 20, r, a, a + 2); x.stroke(); }
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = 'rgba(255,255,255,0.18)'; x.fillRect(0, 0, w, h * 0.35);
}

// Ring of light > lights the quadrant for the blade index
function ring() { const r = $('#ring'); for (let q = 0; q < 4; q++) r.style.setProperty(`--q${q}`, q === cur % 4 ? '#8dff5a' : '#2c3a2c'); r.classList.add('on'); setTimeout(() => r.classList.remove('on'), 500); }
$('#ring').onclick = () => { ring(); toast(); };

// Toast + audio
let ac = null, flipped = new Set();
addEventListener('pointerdown', () => { if (!ac) try { ac = new AudioContext(); } catch {} });
addEventListener('keydown', () => { if (!ac) try { ac = new AudioContext(); } catch {} });
function whoosh() {
  flipped.add(cur); if (flipped.size === blades.length) { flipped.clear(); toast(); }
  if (!ac) return;
  const t = ac.currentTime, n = ac.sampleRate * 0.35, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / n) * Math.PI);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'bandpass'; f.Q.value = 2;
  f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(3000, t + 0.3); g.gain.value = 0.3; s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
const blip = () => { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1760, t + 0.05); g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.13); };
function toast() {
  const el = $('#toast'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 3200);
  if (ac) { const t = ac.currentTime; [523.3, 784, 1046.5].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0.05, t + i * 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.5); o.connect(g).connect(ac.destination); o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.55); }); }
}

// Attract > flip through blades, hover rows
let lastInput = -1e9, aT = 0, dir = 1;
['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true }));
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; const t = now / 1000;
  blades.forEach(({ canvas, b }, i) => { if (canvas && Math.abs(i - cur) <= 1) paintFeat(canvas, b.hue, t, i); });
  if (now - lastInput > 8000) {
    aT += dt;
    if (aT > 2.6) { aT = 0; if (cur + dir < 0 || cur + dir >= blades.length) dir = -dir; go(cur + dir); }
    const rows = blades[cur].el.querySelectorAll('.row'); rows.forEach((r, k) => r.classList.toggle('hot', k === Math.floor(aT * 2) % rows.length));
  }
  requestAnimationFrame(frame);
}
layout(); ring();
addEventListener('resize', layout);
setTimeout(toast, 1800);
requestAnimationFrame(frame);
window.__blades = { go, toast, cur: () => cur };
</script>
</body>
</html>
