<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aurora Login Screen</title>
<meta name="category" content="aero" />
<meta name="style" content="space" />
<meta name="order" content="11" />
<meta name="capture" content="3600" />
<meta name="tags" content="2007 welcome screen, canvas aurora, glossy user tiles, WebAudio startup chord" />
<meta name="description" content="A 2007-era welcome screen, with no logos. Aurora ribbons and light streaks drift across a deep teal sky behind glossy user tiles. Pick a user, type a password, hit the round blue arrow, and a ring of dots spins over 'Welcome' while a synthesized startup chord swells. Then the desktop fades in, and Log off brings you back. Hard because the aurora is many stroked bezier ribbons drawn in additive light every frame, and the tile, password and welcome states have to morph smoothly into one another." />
<meta name="prompt" content="Recreate a 2007-era login / welcome screen in one HTML file with no logos: animated canvas aurora ribbons and light streaks on deep teal, glossy rounded user tiles with procedural pictures, a password box with a round glossy arrow button, an incorrect-password message, then a spinning dot ring and 'Welcome' with a synthesized startup chord swell before fading to a desktop. Add ease-of-access and power buttons and an attract mode that logs itself in." />
<style>
/**
 * FILE: render-studio/frontend/demos/aurora-login-screen.html
 * PURPOSE: 2007 welcome screen: canvas aurora, user tiles, password + arrow, welcome spinner, synth startup chord, desktop fade
 * UI: Render Studio > Frutiger Aero > Aurora Login Screen
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__login (pick, submit, logoff)
 */
:root { --font: "Segoe UI", "Frutiger", "Helvetica Neue", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none; background: #03314f; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity 0.6s; }
.users { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; transition: opacity 0.4s, transform 0.4s; }
.user { width: 150px; text-align: center; cursor: pointer; transition: transform 0.4s, opacity 0.4s; }
.user .tile { width: 128px; height: 128px; margin: 0 auto 10px; border-radius: 10px; padding: 7px; position: relative; background: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.18)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7), 0 6px 20px rgba(0, 0, 0, 0.35); transition: box-shadow 0.2s; }
.user .tile canvas { width: 100%; height: 100%; display: block; border-radius: 5px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35); }
.user .tile::after { content: ''; position: absolute; left: 7px; right: 7px; top: 7px; height: 45%; border-radius: 5px 5px 60% 60% / 5px 5px 20% 20%; background: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)); pointer-events: none; }
.user:hover .tile, .user.hot .tile { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 24px rgba(120, 220, 255, 0.8), 0 6px 20px rgba(0, 0, 0, 0.35); }
.user .nm { font-size: 20px; font-weight: 300; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
/* chosen state: other tiles fade, picked one centres with password row */
.users.pick .user:not(.sel) { opacity: 0; transform: scale(0.8); pointer-events: none; width: 0; margin: 0 -20px; overflow: hidden; }
.pw { margin-top: 14px; display: none; align-items: center; gap: 8px; justify-content: center; }
.users.pick .user.sel .pw { display: flex; }
.pw input { width: 210px; height: 28px; border-radius: 3px; border: 1px solid rgba(0, 30, 60, 0.6); padding: 0 8px; font: 14px var(--font); background: linear-gradient(#f4f8fb, #fff 40%); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.35); outline: none; color: #111; }
.pw input:focus { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25), 0 0 0 2px rgba(120, 210, 255, 0.8); }
.go { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; position: relative; background: radial-gradient(circle at 50% 80%, #8fe0ff, #1f8fe0 50%, #0b4a92); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5), 0 0 0 1px rgba(0, 20, 50, 0.7), 0 2px 6px rgba(0, 0, 0, 0.4); }
.go::before { content: ''; position: absolute; left: 5px; right: 5px; top: 2px; height: 13px; border-radius: 50%; background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.1)); }
.go svg { width: 16px; height: 16px; position: relative; }
.go:hover { filter: brightness(1.2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6), 0 0 14px rgba(120, 210, 255, 0.9); }
.hint { margin-top: 8px; font-size: 12px; opacity: 0.8; display: none; }
.users.pick .user.sel .hint { display: block; }
.err { display: none; margin-top: 18px; text-align: center; font-size: 15px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
.err .ok { display: inline-block; margin-top: 12px; padding: 4px 26px; border-radius: 3px; background: linear-gradient(#fff, #e3e9ef 50%, #d3dde6 51%, #eef3f7); color: #222; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35); cursor: pointer; }
#switch { position: fixed; left: 50%; top: calc(50% + 150px); transform: translateX(-50%); display: none; padding: 7px 22px; border-radius: 4px; font-size: 14px; cursor: pointer; background: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0) 51%, rgba(255, 255, 255, 0.12)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45); }
body.picked #switch { display: block; }

/* Welcome > spinning dot ring */
#welcome { position: fixed; inset: 0; display: none; place-items: center; text-align: center; }
body.welcome #welcome { display: grid; }
body.welcome #stage, body.welcome #switch { opacity: 0; pointer-events: none; }
#welcome .ring { width: 54px; height: 54px; margin: 0 auto 18px; position: relative; }
#welcome .ring i { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: #dff6ff; box-shadow: 0 0 6px #9fe3ff; }
#welcome h1 { margin: 0; font-weight: 300; font-size: 44px; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }

/* Desktop > fades in after welcome */
#desk { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 1s; background: radial-gradient(ellipse at 30% 40%, rgba(120, 255, 190, 0.35), transparent 50%), linear-gradient(160deg, #0b4f86, #0e8aa8 60%, #3cc28a); }
body.desk #desk { opacity: 1; pointer-events: auto; }
#desk .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(rgba(70, 90, 110, 0.55), rgba(10, 20, 30, 0.8) 50%, rgba(0, 5, 10, 0.85) 51%, rgba(20, 35, 50, 0.75)); border-top: 1px solid rgba(255, 255, 255, 0.35); display: flex; align-items: center; padding-left: 60px; gap: 10px; font-size: 13px; }
#desk .orb { position: absolute; left: 6px; bottom: 1px; width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 50% 75%, rgba(120, 255, 170, 0.9), rgba(30, 150, 210, 0.95) 45%, #0b2f5c 75%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.45), 0 0 18px rgba(80, 200, 255, 0.4); }
#logoff { position: absolute; right: 16px; top: 16px; padding: 7px 18px; border-radius: 16px; cursor: pointer; background: rgba(255, 255, 255, 0.18); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5); }
#desk h2 { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); margin: 0; font-weight: 300; font-size: 26px; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); white-space: nowrap; }

/* Corners > ease of access, wordmark, power */
.corner { position: fixed; bottom: 22px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
#ease { left: 26px; background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.5), rgba(80, 160, 220, 0.4)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
#power { right: 26px; background: radial-gradient(circle at 50% 80%, #ffb3a0, #e0402a 50%, #8f1508); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4); }
#power::before, #ease::before { content: ''; position: absolute; left: 6px; right: 6px; top: 2px; height: 16px; border-radius: 50%; background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.05)); }
.corner svg { width: 20px; height: 20px; position: relative; }
#mark { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); font-size: 20px; font-weight: 300; letter-spacing: 1px; opacity: 0.85; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); white-space: nowrap; }
#mark b { font-weight: 600; }
body.desk .corner, body.desk #mark { display: none; }

@media (max-width: 700px) {
  .users { gap: 10px; }
  .user { width: 110px; }
  .user .tile { width: 96px; height: 96px; }
  .user .nm { font-size: 15px; }
  .pw input { width: 170px; }
  #mark { font-size: 15px; bottom: 30px; }
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="stage"><div><div class="users" id="users"></div><div class="err" id="err">The user name or password is incorrect.<br><span class="ok" id="ok">OK</span></div></div></div>
<div id="switch">Switch User</div>
<div id="welcome"><div><div class="ring" id="ring"></div><h1>Welcome</h1></div></div>
<div id="desk"><h2 id="dtitle"></h2><div id="logoff">Log off</div><div class="orb"></div><div class="bar">Desktop</div></div>
<div class="corner" id="ease" title="Ease of access"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.4" fill="#fff"/><path d="M7 10.5h10M12 10.5v4l-2.5 4M12 14.5l2.5 4"/></svg></div>
<div id="mark">Glass <b>Edition</b></div>
<div class="corner" id="power" title="Shut down"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></div>
<script>
const $ = (s) => document.querySelector(s);

// Sky > aurora ribbons (additive bezier strokes) + light streaks, half-res
const sky = $('#sky'), sx = sky.getContext('2d');
let W, H;
const size = () => { W = sky.width = Math.ceil(innerWidth / 2); H = sky.height = Math.ceil(innerHeight / 2); };
size(); addEventListener('resize', size);
const RIBBONS = [[150, 0.38, 0], [190, 0.5, 1.7], [120, 0.62, 3.2], [205, 0.3, 4.4], [170, 0.72, 5.6]];
function drawSky(t) {
  const g = sx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#021b33'); g.addColorStop(0.5, '#05486e'); g.addColorStop(1, '#0a6f7c');
  sx.fillStyle = g; sx.fillRect(0, 0, W, H);
  sx.globalCompositeOperation = 'lighter';
  for (const [hue, yb, ph] of RIBBONS) {
    for (let k = 0; k < 4; k++) {
      sx.beginPath();
      const a = t * 0.00016 + ph, y0 = H * yb;
      sx.moveTo(-50, y0 + Math.sin(a) * H * 0.1);
      sx.bezierCurveTo(W * 0.3, y0 + Math.sin(a * 1.3 + 1) * H * 0.25, W * 0.6, y0 + Math.cos(a * 0.9 + 2) * H * 0.25, W + 50, y0 + Math.sin(a * 1.1 + 3) * H * 0.12);
      sx.lineWidth = 60 - k * 14; sx.strokeStyle = `hsla(${hue + Math.sin(t * 0.0002 + ph) * 20},90%,60%,${0.03 + k * 0.025})`;
      sx.shadowBlur = 30; sx.shadowColor = `hsla(${hue},90%,60%,0.5)`;
      sx.stroke();
    }
  }
  sx.shadowBlur = 0;
  // streaks: thin bright arcs sweeping from the left
  for (let i = 0; i < 5; i++) {
    sx.beginPath(); const yy = H * (0.2 + i * 0.15);
    sx.moveTo(-20, yy); sx.quadraticCurveTo(W * 0.5, yy - H * 0.3 + Math.sin(t * 0.0003 + i) * 20, W + 20, yy - H * 0.05);
    sx.lineWidth = 1.2; sx.strokeStyle = `rgba(200,255,250,${0.12 + 0.08 * Math.sin(t * 0.001 + i)})`; sx.stroke();
  }
  sx.globalCompositeOperation = 'source-over';
}

// Users > procedural pictures on canvas
const USERS = [['Visitor', 'flower'], ['Guest', 'ball'], ['Family', 'fish']];
function paintPic(c, kind) {
  const x = c.getContext('2d'), w = c.width = 160, h = c.height = 160;
  if (kind === 'flower') {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#8fd7ff'); g.addColorStop(1, '#3fae4f'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) { x.fillStyle = '#fff3fb'; x.beginPath(); x.ellipse(80 + Math.cos(i * 0.785) * 30, 72 + Math.sin(i * 0.785) * 30, 26, 14, i * 0.785, 0, 7); x.fill(); }
    x.fillStyle = '#ffcc33'; x.beginPath(); x.arc(80, 72, 18, 0, 7); x.fill();
  } else if (kind === 'ball') {
    const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#ff8a3d'); g.addColorStop(1, '#ffd25a'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    const r = x.createRadialGradient(64, 60, 6, 80, 80, 54); r.addColorStop(0, '#fff'); r.addColorStop(0.3, '#4fb3ff'); r.addColorStop(1, '#0b4a92'); x.fillStyle = r; x.beginPath(); x.arc(80, 80, 52, 0, 7); x.fill();
  } else {
    const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#2ec5e8'); g.addColorStop(1, '#0a4f8a'); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = '#ff9a1a'; x.beginPath(); x.ellipse(78, 80, 40, 24, 0, 0, 7); x.fill(); x.beginPath(); x.moveTo(112, 80); x.lineTo(140, 58); x.lineTo(140, 102); x.fill();
    x.fillStyle = '#fff'; x.fillRect(66, 58, 8, 44); x.fillStyle = '#111'; x.beginPath(); x.arc(52, 74, 4, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.6)'; [[30, 40, 5], [40, 25, 3], [125, 30, 6]].forEach(([a, b, r]) => { x.beginPath(); x.arc(a, b, r, 0, 7); x.fill(); });
  }
}
const users = $('#users');
USERS.forEach(([n, k], i) => {
  const d = document.createElement('div'); d.className = 'user';
  d.innerHTML = `<div class="tile"><canvas></canvas></div><div class="nm">${n}</div><div class="pw"><input type="password" placeholder="Password" /><div class="go"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></div></div><div class="hint">Hint: anything works</div>`;
  paintPic(d.querySelector('canvas'), k);
  d.onclick = (e) => { if (!users.classList.contains('pick')) pick(i); };
  d.querySelector('.go').onclick = (e) => { e.stopPropagation(); submit(); };
  d.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  users.append(d);
});

// Flow > pick / submit / welcome / desktop / log off
let sel = -1;
function pick(i) {
  sel = i; [...users.children].forEach((u, k) => u.classList.toggle('sel', k === i));
  users.classList.add('pick'); document.body.classList.add('picked');
  setTimeout(() => users.children[i].querySelector('input').focus(), 300); blip();
}
function unpick() { users.classList.remove('pick'); document.body.classList.remove('picked'); $('#err').style.display = 'none'; users.style.display = ''; sel = -1; [...users.children].forEach((u) => { u.classList.remove('sel'); u.querySelector('input').value = ''; }); }
function submit() {
  const inp = users.children[sel].querySelector('input');
  if (!inp.value) { users.style.display = 'none'; $('#err').style.display = 'block'; document.body.classList.remove('picked'); errSound(); return; }
  document.body.classList.add('welcome'); chord();
  setTimeout(() => { $('#dtitle').textContent = `Hello, ${USERS[sel][0]}`; document.body.classList.add('desk'); }, 3200);
}
function logoff() { document.body.classList.remove('desk', 'welcome'); unpick(); }
$('#ok').onclick = () => { $('#err').style.display = 'none'; users.style.display = ''; document.body.classList.add('picked'); users.children[sel].querySelector('input').focus(); };
$('#switch').onclick = unpick;
$('#logoff').onclick = logoff;
$('#power').onclick = () => { blip(); $('#mark').innerHTML = 'This is a demo, nothing to shut down'; setTimeout(() => ($('#mark').innerHTML = 'Glass <b>Edition</b>'), 1800); };

// Welcome ring > 8 dots orbit with trailing fade
const ring = $('#ring');
for (let i = 0; i < 8; i++) ring.append(document.createElement('i'));
function spinRing(t) {
  [...ring.children].forEach((d, i) => { const a = t * 0.006 - i * 0.32; d.style.transform = `translate(${Math.cos(a) * 22}px, ${Math.sin(a) * 22}px)`; d.style.opacity = 1 - i / 9; });
}

// Audio > startup chord swell (detuned pads + shimmer), UI blips
let ac = null;
addEventListener('pointerdown', () => { if (!ac) try { ac = new AudioContext(); } catch {} });
addEventListener('keydown', () => { if (!ac) try { ac = new AudioContext(); } catch {} });
function chord() {
  if (!ac) return;
  const t = ac.currentTime, out = ac.createGain(), lp = ac.createBiquadFilter(); lp.frequency.setValueAtTime(600, t); lp.frequency.exponentialRampToValueAtTime(5000, t + 2.5);
  out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.18, t + 1.2); out.gain.exponentialRampToValueAtTime(0.0001, t + 5.5);
  lp.connect(out).connect(ac.destination);
  [48, 55, 60, 64, 67, 71, 76].forEach((m, i) => [-6, 6].forEach((det) => {
    const o = ac.createOscillator(); o.type = i < 2 ? 'triangle' : 'sawtooth'; o.frequency.value = 440 * 2 ** ((m - 69) / 12); o.detune.value = det;
    const g = ac.createGain(); g.gain.value = i < 2 ? 0.18 : 0.05; o.connect(g).connect(lp); o.start(t + i * 0.12); o.stop(t + 6);
  }));
}
const tone = (f, d, v = 0.06) => { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); };
const blip = () => tone(1200, 0.08, 0.04);
const errSound = () => { tone(440, 0.25); setTimeout(() => tone(330, 0.35), 120); };

// Attract > hover tiles, pick, type dots, submit, log off, repeat
let lastInput = -1e9, aT = 0;
['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true }));
const TOUR = [[0.6, () => users.children[1].classList.add('hot')], [1.4, () => { users.children[1].classList.remove('hot'); users.children[0].classList.add('hot'); }], [2.4, () => { users.children[0].classList.remove('hot'); pick(0); }], [3.0, 'type'], [4.4, () => submit()], [11, () => logoff()]];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  drawSky(now);
  if (document.body.classList.contains('welcome')) spinRing(now);
  if (now - lastInput > 9000) {
    const prev = aT; aT = (aT + dt) % 13;
    for (const [at, fn] of TOUR) if (prev < at && aT >= at && fn !== 'type') fn();
    if (aT > 3 && aT < 4.4 && sel >= 0) users.children[sel].querySelector('input').value = '•'.repeat(Math.floor((aT - 3) * 6));
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__login = { pick, submit, logoff };
</script>
</body>
</html>
