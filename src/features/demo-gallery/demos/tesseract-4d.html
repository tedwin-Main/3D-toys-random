<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tesseract 4D</title>
<meta name="category" content="generative" />
<meta name="order" content="6" />
<meta name="capture" content="2500" />
<meta name="tags" content="4D geometry, rotation planes, double perspective, polytopes, canvas" />
<meta name="description" content="A hypercube turning through the fourth dimension: 4D vertices rotated in any of the six rotation planes, projected 4D to 3D to 2D with two perspective divides, and drawn as glowing edges coloured by their w coordinate. Swap to the 5-cell, 16-cell and 24-cell. The inside-out folding is what a 3D shadow of 4D rotation actually looks like. Tests linear algebra beyond three dimensions." />
<meta name="prompt" content="Build a 4D tesseract visualizer in a single HTML file with canvas. Generate the hypercube's 16 vertices and 32 edges, rotate them in 4D using the six rotation planes (XY, XZ, XW, YZ, YW, ZW), project to 3D with a perspective divide on w and then to 2D, and draw glowing edges whose colour and thickness follow depth and w. Let me toggle each rotation plane, drag to turn it, switch to the 5-cell, 16-cell and 24-cell, and show motion trails." />
<style>
  :root { --ink: #eef2ff; --muted: #9aa3bf; --panel: rgba(8, 10, 20, 0.66); --accent: #8f7bff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04030a; color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; background: #04030a; }
  canvas:active { cursor: grabbing; }
  .title { position: fixed; left: 20px; top: 18px; pointer-events: none; }
  .title h1 { margin: 0; font-size: 20px; }
  .title p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }
  #panel { position: fixed; left: 16px; bottom: 16px; width: 290px; padding: 12px; border-radius: 16px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.07); font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 6px; }
  .row.four { grid-template-columns: repeat(4, 1fr); }
  #panel button { border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: var(--ink); border-radius: 8px; padding: 6px 2px; font: 600 11.5px ui-monospace, Menlo, monospace; cursor: pointer; }
  #panel button.on { background: var(--accent); color: #0b0620; border-color: var(--accent); }
  .hint { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
  #stats { position: fixed; right: 18px; top: 18px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 600px) { #panel { left: 10px; right: 10px; width: auto; } #stats { top: 70px; right: auto; left: 20px; text-align: left; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Tesseract</h1><p>4D rotation · double perspective projection</p></div>
<div id="stats"></div>
<div id="panel">
  <div class="row" id="planes"></div>
  <div class="row four"><button data-poly="5">5-cell</button><button data-poly="8" class="on">8-cell</button><button data-poly="16">16-cell</button><button data-poly="24">24-cell</button></div>
  <div class="row four"><button id="trails" class="on">Trails</button><button id="verts" class="on">Vertices</button><button id="slow">Slow</button><button id="reset">Reset</button></div>
  <div class="hint">Drag rotates XW / YW · toggle planes above</div>
</div>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const $ = (id) => document.getElementById(id);
let W = 0, H = 0, dpr = 1;
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
addEventListener('resize', resize);
resize();

// Tesseract > polytopes: vertex sets, edges = all pairs at the minimum distance
function perms(base) {
  const out = new Set();
  const rec = (arr, rest) => { if (!rest.length) { out.add(arr.join(',')); return; } rest.forEach((v, i) => rec([...arr, v], rest.filter((_, j) => j !== i))); };
  rec([], base);
  return [...out].map((s) => s.split(',').map(Number));
}
function signs(v) {
  let out = [v];
  for (let i = 0; i < 4; i++) if (v[i] !== 0) out = out.flatMap((p) => [p, p.map((x, j) => (j === i ? -x : x))]);
  return out;
}
function build(kind) {
  let V;
  if (kind === 8) V = signs([1, 1, 1, 1]);
  else if (kind === 16) V = perms([1, 0, 0, 0]).flatMap(signs).map((v) => v.map((x) => x * 1.5));
  else if (kind === 24) V = perms([1, 1, 0, 0]).flatMap(signs).map((v) => v.map((x) => x * 1.1));
  else { const r = 1 / Math.sqrt(5); V = [[1, 1, 1, -r], [1, -1, -1, -r], [-1, 1, -1, -r], [-1, -1, 1, -r], [0, 0, 0, 4 * r]].map((v) => v.map((x) => x * 0.95)); }
  V = [...new Map(V.map((v) => [v.join(','), v])).values()];
  let min = Infinity;
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2], a[3] - b[3]);
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) min = Math.min(min, d(V[i], V[j]));
  const E = [];
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) if (d(V[i], V[j]) < min * 1.01) E.push([i, j]);
  return { V, E };
}
let poly = build(8), polyKind = 8;

// Tesseract > rotation planes: index pairs into (x,y,z,w), each with its own angle + speed
const PLANES = [['XY', 0, 1], ['XZ', 0, 2], ['XW', 0, 3], ['YZ', 1, 2], ['YW', 1, 3], ['ZW', 2, 3]];
const DEFAULT_ON = { XW: 0.55, YZ: 0.22, ZW: 0.33 };
const plane = PLANES.map(([n, a, b]) => ({ n, a, b, ang: 0, on: n in DEFAULT_ON, spd: DEFAULT_ON[n] || 0.4 }));
plane.forEach((p) => {
  const btn = document.createElement('button');
  btn.textContent = p.n; btn.classList.toggle('on', p.on);
  btn.onclick = () => { p.on = !p.on; btn.classList.toggle('on', p.on); };
  $('planes').appendChild(btn);
});
const flags = { trails: true, verts: true, slow: false };
for (const k of Object.keys(flags)) $(k).onclick = () => { flags[k] = !flags[k]; $(k).classList.toggle('on', flags[k]); };
$('reset').onclick = () => plane.forEach((p) => (p.ang = 0));
document.querySelectorAll('[data-poly]').forEach((b) => (b.onclick = () => setPoly(Number(b.dataset.poly))));
function setPoly(k) { polyKind = k; poly = build(k); document.querySelectorAll('[data-poly]').forEach((x) => x.classList.toggle('on', Number(x.dataset.poly) === k)); }

// Tesseract > drag: horizontal turns XW, vertical turns YW (the "into the 4th dimension" planes)
let drag = null, lastInput = -1e9;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); drag = [e.clientX, e.clientY]; lastInput = performance.now(); });
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  plane[2].ang += (e.clientX - drag[0]) * 0.008; plane[4].ang += (e.clientY - drag[1]) * 0.008;
  drag = [e.clientX, e.clientY]; lastInput = performance.now();
});
cv.addEventListener('pointerup', () => (drag = null));
cv.addEventListener('pointercancel', () => (drag = null));

function rotate(v) {
  const p = v.slice();
  for (const pl of plane) {
    if (pl.ang === 0) continue;
    const c = Math.cos(pl.ang), s = Math.sin(pl.ang), x = p[pl.a], y = p[pl.b];
    p[pl.a] = x * c - y * s; p[pl.b] = x * s + y * c;
  }
  return p;
}

// Tesseract > render: 4D to 3D (divide by w distance), fixed 3D tilt, 3D to 2D
const D4 = 3.2, D3 = 5.2, TILT = 0.42;
let last = performance.now(), fps = 60, fpsN = 0, fpsT = 0, polyT = 0;
const CYCLE = [8, 24, 16, 5];
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sp = flags.slow ? 0.25 : 1;
  if (!drag) for (const p of plane) if (p.on) p.ang += p.spd * dt * sp;
  polyT = now - lastInput > 8000 ? polyT + dt : 0;
  if (polyT > 12) { polyT = 0; setPoly(CYCLE[(CYCLE.indexOf(polyKind) + 1) % CYCLE.length]); }

  // fade alpha (not paint over) so trails never leave grey residue on the page background
  if (flags.trails) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(0, 0, W, H); } else g.clearRect(0, 0, W, H);
  const S = Math.min(W, H) * 0.19, cx = W / 2, cy = H / 2 - (W < 600 ? 40 : 0);
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  const P = poly.V.map((v) => {
    const r = rotate(v);
    const k = 1 / (D4 - r[3]);
    let x = r[0] * k * 2.2, y = r[1] * k * 2.2, z = r[2] * k * 2.2;
    const y2 = y * ct - z * st, z2 = y * st + z * ct;
    const k3 = D3 / (D3 + z2);
    return { x: cx + x * k3 * S, y: cy - y2 * k3 * S, z: z2, w: r[3], k3 };
  });
  // far edges first so near ones draw on top
  const edges = poly.E.map(([a, b]) => ({ a: P[a], b: P[b], z: (P[a].z + P[b].z) / 2 })).sort((m, n) => n.z - m.z);
  g.globalCompositeOperation = 'lighter';
  g.lineCap = 'round';
  for (const e of edges) {
    const depth = Math.max(0.25, Math.min(1, 0.75 - e.z * 0.35));
    const grad = g.createLinearGradient(e.a.x, e.a.y, e.b.x, e.b.y);
    grad.addColorStop(0, `hsla(${190 + Math.max(0, Math.min(1, (e.a.w + 1.4) / 2.8)) * 120},90%,62%,${depth})`);
    grad.addColorStop(1, `hsla(${190 + Math.max(0, Math.min(1, (e.b.w + 1.4) / 2.8)) * 120},90%,62%,${depth})`);
    g.strokeStyle = grad;
    g.lineWidth = 7 * depth; g.globalAlpha = 0.18;
    g.beginPath(); g.moveTo(e.a.x, e.a.y); g.lineTo(e.b.x, e.b.y); g.stroke();
    g.lineWidth = 1.2 + 1.8 * depth; g.globalAlpha = 1;
    g.stroke();
  }
  if (flags.verts) for (const p of P) {
    const r = 2 + 3.5 * p.k3 * (0.6 + 0.4 * ((p.w + 1.4) / 2.8));
    g.fillStyle = `hsla(${190 + Math.max(0, Math.min(1, (p.w + 1.4) / 2.8)) * 120},100%,80%,0.9)`;
    g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { fps = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; }
  const names = { 5: '5-cell (simplex)', 8: '8-cell (tesseract)', 16: '16-cell', 24: '24-cell' };
  $('stats').innerHTML = `${names[polyKind]}<br>${poly.V.length} vertices · ${poly.E.length} edges<br>${fps} fps`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
