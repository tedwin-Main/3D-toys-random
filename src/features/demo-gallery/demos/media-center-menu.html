<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media Center Menu</title>
<meta name="category" content="aero" />
<meta name="style" content="console" />
<meta name="order" content="13" />
<meta name="capture" content="3200" />
<meta name="tags" content="2005 TV media centre, 10-foot UI, rolling menu, canvas thumbnails, WebAudio" />
<meta name="description" content="A 2005-era 10-foot TV media-centre menu, with no logos: deep blue gradient waves, a generic green orb, and a vertical menu that rolls like a drum (items scale and fade with distance from the focus row). The focused row opens a horizontal strip of glowing thumbnail tiles, each drawn live on canvas. Arrow keys, wheel, swipe or click move focus with synthesized tick and select sounds. Hard because the drum is a continuous spring offset (not discrete jumps), so rows ease through scale, opacity and blur while the strip cross-fades per category." />
<meta name="prompt" content="Build a 2005-style TV media-centre menu in one HTML file with no logos: deep blue animated gradient with soft light waves, a glossy green orb top-left, and a vertical rolling menu (TV, Music, Pictures, Videos, Radio, Tasks) where rows scale and fade by distance from focus on a spring. The focused row shows a horizontal strip of glowing canvas thumbnails. Arrows, wheel, swipe and click navigate with synthesized ticks; add a clock and an attract mode." />
<style>
:root { --font: "Segoe UI", "Segoe Media Center", "Helvetica Neue", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font-family: var(--font); color: #fff; user-select: none; -webkit-user-select: none; background: #031a4a; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; }
#orb { position: fixed; left: 34px; top: 26px; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.95) 0 14%, transparent 40%), radial-gradient(circle at 50% 60%, #8dff5a, #2fa21b 55%, #0d4f08); box-shadow: 0 0 20px rgba(120, 255, 90, 0.6), inset 0 -4px 10px rgba(0, 0, 0, 0.35); cursor: pointer; }
#orb::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.85); border-top-color: transparent; transform: rotate(-45deg); }
#title { position: fixed; left: 108px; top: 38px; font-size: 26px; font-weight: 300; letter-spacing: 0.5px; opacity: 0.92; }
#clock { position: fixed; right: 40px; top: 36px; font-size: 26px; font-weight: 300; opacity: 0.9; }
#menu { position: fixed; left: 12%; top: 50%; width: 60%; height: 0; }
.item { position: absolute; left: 0; top: 0; font-size: 44px; font-weight: 300; white-space: nowrap; transform-origin: 0 50%; cursor: pointer; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4); will-change: transform, opacity; }
.item small { font-size: 18px; opacity: 0.6; margin-left: 10px; }
#focus { position: fixed; left: calc(12% - 30px); top: 50%; width: min(78%, 980px); height: 70px; transform: translateY(-50%); border-radius: 8px; background: linear-gradient(rgba(255, 255, 255, 0.22), rgba(120, 180, 255, 0.08)); box-shadow: 0 0 0 2px rgba(180, 220, 255, 0.55), 0 0 30px rgba(100, 180, 255, 0.55); pointer-events: none; }
#focus::before { content: ''; position: absolute; inset: 0 0 50% 0; border-radius: 8px 8px 0 0; background: linear-gradient(rgba(255, 255, 255, 0.25), transparent); }
#strip { position: fixed; left: 12%; top: calc(50% + 52px); display: flex; gap: 18px; transition: opacity 0.25s, transform 0.25s; }
#strip.swap { opacity: 0; transform: translateX(-20px); }
.tile { width: 168px; height: 104px; border-radius: 6px; position: relative; overflow: hidden; cursor: pointer; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2), 0 6px 16px rgba(0, 0, 0, 0.45); transition: transform 0.2s, box-shadow 0.2s; flex: none; }
.tile canvas { width: 100%; height: 100%; display: block; }
.tile span { position: absolute; left: 8px; bottom: 6px; font-size: 14px; text-shadow: 0 1px 4px #000; }
.tile.on { transform: scale(1.1); box-shadow: 0 0 0 3px #bfe3ff, 0 0 26px rgba(130, 200, 255, 0.9); z-index: 2; }
#hint { position: fixed; right: 40px; bottom: 30px; font-size: 14px; opacity: 0.55; }
#flash { position: fixed; inset: 0; background: radial-gradient(circle at 30% 55%, rgba(170, 220, 255, 0.45), transparent 60%); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
#flash.on { opacity: 1; transition: none; }
@media (max-width: 700px) {
  #orb { left: 16px; top: 18px; width: 42px; height: 42px; } #orb::after { inset: 10px; border-width: 2px; }
  #title { left: 68px; top: 26px; font-size: 18px; }
  #clock { right: 16px; top: 26px; font-size: 18px; }
  #menu, #strip { left: 8%; } #focus { left: calc(8% - 14px); width: 88%; height: 52px; }
  .item { font-size: 30px; } .item small { display: none; }
  #strip { top: calc(50% + 40px); gap: 10px; }
  .tile { width: 110px; height: 72px; }
  #hint { display: none; }
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="orb" title="Start"></div>
<div id="title">Media Center</div>
<div id="clock"></div>
<div id="focus"></div>
<div id="menu"></div>
<div id="strip"></div>
<div id="flash"></div>
<div id="hint">↑ ↓ to roll · ← → to browse · Enter to open</div>
<script>
const $ = (s) => document.querySelector(s);

// Menu > categories, sub tiles, thumbnail hues
const MENU = [
  { name: 'TV + Movies', sub: 'recorded TV', tiles: ['Recorded TV', 'Live TV', 'Guide', 'Movies'], hue: 205 },
  { name: 'Music', sub: 'library', tiles: ['Albums', 'Artists', 'Songs', 'Playlists'], hue: 285 },
  { name: 'Pictures', sub: '+ videos', tiles: ['Slide Show', 'Holiday 2005', 'Beach', 'Garden'], hue: 120 },
  { name: 'Online Media', sub: 'spotlight', tiles: ['Explore', 'Shows', 'Radio', 'Games'], hue: 30 },
  { name: 'Radio', sub: 'FM + internet', tiles: ['88.5 Lounge', '101.1 Chill', 'Presets', 'Tune'], hue: 330 },
  { name: 'Tasks', sub: 'settings', tiles: ['Settings', 'Sync', 'Burn CD', 'Shutdown'], hue: 190 },
];
const menu = $('#menu');
const items = MENU.map((m, i) => {
  const el = document.createElement('div'); el.className = 'item'; el.innerHTML = `${m.name}<small>${m.sub}</small>`;
  el.onclick = () => { if (Math.round(pos) === i) pick(); else move(i - target); };
  menu.append(el); return el;
});

// Spring drum > target index, smooth pos
let target = 0, pos = 0, vel = 0, tileIdx = 0;
const rowH = () => (innerWidth < 700 ? 52 : 70);
function layoutMenu() {
  const n = MENU.length, h = rowH(), gap = innerWidth < 700 ? 96 : 128;
  items.forEach((el, i) => {
    let d = i - pos; d = ((d % n) + n * 1.5) % n - n / 2;
    const a = Math.abs(d), s = Math.max(0.45, 1 - a * 0.18);
    el.style.transform = `translateY(${d * h * (1 - a * 0.06) - h * 0.36 + Math.max(0, Math.min(1, d)) * gap}px) scale(${s})`;
    el.style.opacity = Math.max(0, 1 - a * 0.32);
    el.style.filter = a > 0.5 ? `blur(${Math.min(3, (a - 0.5) * 1.4)}px)` : '';
    el.style.zIndex = 10 - Math.round(a);
  });
}

// Strip > rebuilt per category with live canvases
const strip = $('#strip');
let tiles = [], stripCat = -1;
function buildStrip(cat) {
  stripCat = cat; tileIdx = 0;
  strip.classList.add('swap');
  setTimeout(() => {
    strip.innerHTML = '';
    tiles = MENU[cat].tiles.map((t, k) => {
      const el = document.createElement('div'); el.className = 'tile';
      el.innerHTML = `<canvas width="168" height="104"></canvas><span>${t}</span>`;
      el.onclick = () => { tileIdx = k; markTile(); pick(); };
      strip.append(el); return { el, c: el.querySelector('canvas'), k };
    });
    markTile(); strip.classList.remove('swap');
  }, 160);
}
const markTile = () => tiles.forEach((t, k) => t.el.classList.toggle('on', k === tileIdx));
function paintTile(c, hue, k, t) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, `hsl(${hue + k * 18},70%,${55 - k * 4}%)`); g.addColorStop(1, `hsl(${hue + k * 18 + 30},80%,18%)`);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const cx = w * (0.2 + 0.15 * i) + Math.sin(t * 0.8 + i + k) * 12, cy = h * 0.5 + Math.cos(t * 0.6 + i * 1.3 + k) * 18;
    const rg = x.createRadialGradient(cx, cy, 0, cx, cy, 34); rg.addColorStop(0, `hsla(${hue + i * 25},100%,75%,0.6)`); rg.addColorStop(1, 'transparent');
    x.fillStyle = rg; x.fillRect(0, 0, w, h);
  }
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = 'rgba(255,255,255,0.16)'; x.fillRect(0, 0, w, h * 0.42);
}

// Backdrop > blue gradient with light waves
const bg = $('#bg'), bx = bg.getContext('2d');
function sizeBg() { const d = Math.min(2, devicePixelRatio || 1); bg.width = innerWidth * d; bg.height = innerHeight * d; bx.setTransform(d, 0, 0, d, 0, 0); }
function paintBg(t) {
  const w = innerWidth, h = innerHeight;
  const g = bx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0a3a8c'); g.addColorStop(0.55, '#04205a'); g.addColorStop(1, '#010b26'); bx.fillStyle = g; bx.fillRect(0, 0, w, h);
  bx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 4; k++) {
    bx.beginPath();
    for (let x = 0; x <= w; x += 16) { const y = h * (0.62 + k * 0.06) + Math.sin(x * 0.004 + t * (0.3 + k * 0.1) + k) * 40 + Math.sin(x * 0.011 - t * 0.5) * 12; x ? bx.lineTo(x, y) : bx.moveTo(x, y); }
    bx.lineTo(w, h); bx.lineTo(0, h); bx.closePath();
    bx.fillStyle = `rgba(${60 + k * 20},${130 + k * 20},255,0.06)`; bx.fill();
    bx.strokeStyle = `rgba(170,215,255,${0.18 - k * 0.03})`; bx.lineWidth = 1.5; bx.stroke();
  }
  const sx = w * (0.75 + Math.sin(t * 0.1) * 0.05), rg = bx.createRadialGradient(sx, h * 0.2, 0, sx, h * 0.2, w * 0.5); rg.addColorStop(0, 'rgba(90,160,255,0.22)'); rg.addColorStop(1, 'transparent');
  bx.fillStyle = rg; bx.fillRect(0, 0, w, h);
  bx.globalCompositeOperation = 'source-over';
}

// Audio > tick on move, chord on pick
let ac = null;
const wake = () => { if (!ac) try { ac = new AudioContext(); } catch {} };
addEventListener('pointerdown', wake); addEventListener('keydown', wake);
function tone(f, d, v = 0.05, type = 'sine', at = 0) {
  if (!ac) return; const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
}
const tick = () => { tone(1320, 0.05, 0.04, 'triangle'); tone(660, 0.08, 0.02); };

// Input > move rows, browse tiles, pick
function move(d) { target += d; tick(); }
function browse(d) { if (!tiles.length) return; tileIdx = (tileIdx + d + tiles.length) % tiles.length; markTile(); tone(990, 0.06, 0.035, 'triangle'); }
function pick() {
  const f = $('#flash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  [392, 523.3, 659.3, 784].forEach((fr, i) => tone(fr, 0.6, 0.04, 'sine', i * 0.04));
  const t = tiles[tileIdx]; if (t) { t.el.animate([{ transform: 'scale(1.1)' }, { transform: 'scale(1.22)' }, { transform: 'scale(1.1)' }], { duration: 300 }); }
}
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') move(1); else if (e.key === 'ArrowUp') move(-1);
  else if (e.key === 'ArrowRight') browse(1); else if (e.key === 'ArrowLeft') browse(-1);
  else if (e.key === 'Enter') pick(); else return;
  e.preventDefault();
});
let wheelAcc = 0;
addEventListener('wheel', (e) => { wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60) { move(Math.sign(wheelAcc)); wheelAcc = 0; } }, { passive: true });
let ty0 = null, tx0 = null;
addEventListener('pointerdown', (e) => { ty0 = e.clientY; tx0 = e.clientX; });
addEventListener('pointerup', (e) => {
  if (ty0 == null) return; const dy = e.clientY - ty0, dx = e.clientX - tx0; ty0 = null;
  if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) move(dy < 0 ? 1 : -1); else if (Math.abs(dx) > 40) browse(dx < 0 ? 1 : -1);
});
$('#orb').onclick = () => { target = Math.round(pos / MENU.length) * MENU.length; tick(); };

// Clock
function clock() { const d = new Date(); $('#clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

// Attract > roll down, browse tiles
let lastInput = -1e9, aT = 0, aStep = 0;
['pointerdown', 'keydown', 'wheel'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true, passive: true }));
let last = performance.now(), lastMin = -1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = now / 1000;
  vel += (target - pos) * 90 * dt; vel *= Math.pow(0.0009, dt); pos += vel * dt;
  if (Math.abs(target - pos) < 0.001 && Math.abs(vel) < 0.001) pos = target;
  layoutMenu();
  const cat = ((Math.round(pos) % MENU.length) + MENU.length) % MENU.length;
  if (cat !== stripCat) buildStrip(cat);
  tiles.forEach((tl) => paintTile(tl.c, MENU[cat].hue, tl.k, t));
  paintBg(t);
  const m = new Date().getMinutes(); if (m !== lastMin) { lastMin = m; clock(); }
  if (now - lastInput > 7000) {
    aT += dt;
    if (aT > 1.1) { aT = 0; aStep++; if (aStep % 4 === 0) move(1); else browse(1); }
  }
  requestAnimationFrame(frame);
}
sizeBg(); addEventListener('resize', sizeBg);
requestAnimationFrame(frame);
window.__mediacenter = { move, pick, browse, strip: () => stripCat };
</script>
</body>
</html>
