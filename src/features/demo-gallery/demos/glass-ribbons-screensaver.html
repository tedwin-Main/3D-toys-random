<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glass Ribbons Screensaver</title>
<meta name="category" content="aero" />
<meta name="style" content="dark" />
<meta name="order" content="25" />
<meta name="capture" content="3800" />
<meta name="tags" content="three.js, dynamic BufferGeometry, ribbon strips, noise flight paths, additive shader" />
<meta name="description" content="The late-2000s 'ribbons' screensaver: translucent glassy ribbons fly in long looping paths through dark blue space, each a strip rebuilt every frame from its own trail, twisting as it turns, glowing brighter at its edges and fading out at the tail. Click to change the colour set, drag to tilt the view, and the ribbons swerve toward the pointer. Hard because each ribbon is a dynamic triangle strip whose side vector is parallel-transported along the trail, so it twists smoothly and never flips, with every vertex rewritten on every frame." />
<meta name="prompt" content="Recreate the late-2000s ribbons screensaver in three.js, one HTML file: 8 translucent ribbons following smooth 3D noise flight paths, each a dynamic triangle strip rebuilt every frame from a 220-point trail with a parallel-transported side vector so it twists without flipping, tapering, fading at the tail and glowing brighter at its edges with additive blending over a dark blue gradient. Click to cycle colour sets, drag to tilt the view, steer ribbons toward the pointer, and auto-drift in attract mode." />
<style>
/**
 * FILE: render-studio/frontend/demos/glass-ribbons-screensaver.html
 * PURPOSE: ribbons screensaver: dynamic strip geometry from noise-driven trails, parallel-transport twist, additive edge glow
 * UI: Render Studio > Frutiger Aero > Glass Ribbons Screensaver
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__ribbons (palette, count)
 */
html, body { margin: 0; height: 100%; overflow: hidden; background: #01030c; }
canvas { display: block; }
#hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); color: rgba(190, 220, 255, 0.45); font: 13px "Segoe UI", system-ui, sans-serif; white-space: nowrap; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hint">click for new colours · drag to tilt</div>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256; const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#000208'); g.addColorStop(0.6, '#03123a'); g.addColorStop(1, '#0a2a6a'); x.fillStyle = g; x.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
const rig = new THREE.Group(); scene.add(rig);
function fit() { camera.aspect = innerWidth / innerHeight; camera.position.set(0, 0, camera.aspect < 0.8 ? 30 : 22); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
fit(); addEventListener('resize', fit);

// Palettes > hue sets for ribbons
const SETS = [[0.55, 0.6, 0.5, 0.65, 0.45], [0.33, 0.5, 0.42, 0.28, 0.58], [0.8, 0.9, 0.6, 0.95, 0.7], [0.08, 0.13, 0.98, 0.55, 0.05], [0.5, 0.15, 0.85, 0.35, 0.65]];
let setI = 0;

// Ribbon > trail of points rebuilt into a strip each frame
const NR = 8, NP = 220;
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: 'attribute float aT; attribute float aS; attribute vec3 aC; varying float vT; varying float vS; varying vec3 vC; void main(){ vT = aT; vS = aS; vC = aC; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'varying float vT; varying float vS; varying vec3 vC; void main(){ float edge = pow(abs(vS), 3.0); float core = 0.18 + edge * 0.9; float fade = vT * vT * (1.0 - smoothstep(0.96, 1.0, vT)); gl_FragColor = vec4(vC * core * fade * 1.3 + vec3(edge * fade * 0.25), 1.0); }',
});
const ribbons = [];
const tmp = new THREE.Vector3(), tan = new THREE.Vector3(), side = new THREE.Vector3(), prevTan = new THREE.Vector3(), axis = new THREE.Vector3(), q = new THREE.Quaternion();
for (let r = 0; r < NR; r++) {
  const geo = new THREE.BufferGeometry(), pos = new Float32Array(NP * 2 * 3), aT = new Float32Array(NP * 2), aS = new Float32Array(NP * 2), aC = new Float32Array(NP * 2 * 3), idx = [];
  for (let i = 0; i < NP; i++) { aT[i * 2] = aT[i * 2 + 1] = i / (NP - 1); aS[i * 2] = -1; aS[i * 2 + 1] = 1; if (i < NP - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); } }
  geo.setIndex(idx); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('aT', new THREE.BufferAttribute(aT, 1)); geo.setAttribute('aS', new THREE.BufferAttribute(aS, 1)); geo.setAttribute('aC', new THREE.BufferAttribute(aC, 3));
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; rig.add(mesh);
  const head = new THREE.Vector3((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 6);
  const trail = Array.from({ length: NP }, () => head.clone());
  ribbons.push({ geo, pos, aC, trail, head, vel: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(), seed: Math.random() * 100, w: 0.35 + Math.random() * 0.45, col: new THREE.Color(), colT: new THREE.Color() });
}
function recolor() { ribbons.forEach((rb, i) => rb.colT.setHSL(SETS[setI][i % 5], 0.85, 0.55)); }
recolor(); ribbons.forEach((rb) => rb.col.copy(rb.colT));

// Flight > smooth pseudo-noise steering, soft bounds, pointer pull
const pointer = new THREE.Vector3(), pNdc = new THREE.Vector2(); let pointerOn = false;
function steer(rb, t, dt) {
  const s = rb.seed, h = rb.head;
  tmp.set(Math.sin(t * 0.37 + s) + Math.sin(t * 0.71 + s * 1.7) * 0.5, Math.cos(t * 0.43 + s * 2.1) + Math.sin(t * 0.63 + s) * 0.5, Math.sin(t * 0.31 + s * 0.6) + Math.cos(t * 0.59 + s * 1.3) * 0.5);
  rb.vel.addScaledVector(tmp, dt * 1.6);
  rb.vel.addScaledVector(h, -dt * 0.06 * Math.max(0, h.length() - 7));
  if (pointerOn) { tmp.subVectors(pointer, h); rb.vel.addScaledVector(tmp.normalize(), dt * 1.2); }
  rb.vel.normalize(); h.addScaledVector(rb.vel, dt * 7.5);
}
function rebuild(rb) {
  const T = rb.trail, P = rb.pos, C = rb.aC;
  tan.subVectors(T[1], T[0]).normalize(); side.set(0, 1, 0).cross(tan); if (side.lengthSq() < 1e-4) side.set(1, 0, 0); side.normalize(); prevTan.copy(tan);
  for (let i = 0; i < NP; i++) {
    const a = T[Math.max(0, i - 1)], b = T[Math.min(NP - 1, i + 1)]; tan.subVectors(b, a); if (tan.lengthSq() < 1e-8) tan.copy(prevTan); tan.normalize();
    axis.crossVectors(prevTan, tan); const sl = axis.length(); if (sl > 1e-6) { q.setFromAxisAngle(axis.divideScalar(sl), Math.asin(Math.min(1, sl))); side.applyQuaternion(q); }
    prevTan.copy(tan);
    const u = i / (NP - 1), w = rb.w * Math.sin(Math.PI * Math.min(1, u * 1.05)) * (0.4 + 0.6 * u), p = T[i];
    P[i * 6] = p.x - side.x * w; P[i * 6 + 1] = p.y - side.y * w; P[i * 6 + 2] = p.z - side.z * w;
    P[i * 6 + 3] = p.x + side.x * w; P[i * 6 + 4] = p.y + side.y * w; P[i * 6 + 5] = p.z + side.z * w;
    for (let k = 0; k < 2; k++) { C[(i * 2 + k) * 3] = rb.col.r; C[(i * 2 + k) * 3 + 1] = rb.col.g; C[(i * 2 + k) * 3 + 2] = rb.col.b; }
  }
  rb.geo.attributes.position.needsUpdate = true; rb.geo.attributes.aC.needsUpdate = true;
}

// Input > click palette, drag tilt, pointer pull
let drag = null, tilt = { x: 0, y: 0 }, tiltT = { x: 0, y: 0 };
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, tx: tiltT.x, ty: tiltT.y, moved: 0 }; });
addEventListener('pointermove', (e) => {
  pNdc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); pointer.set(pNdc.x, pNdc.y, 0.5).unproject(camera).sub(camera.position).normalize().multiplyScalar(camera.position.z).add(camera.position); pointerOn = true;
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.moved = Math.max(drag.moved, Math.hypot(dx, dy)); tiltT.y = drag.ty + dx * 0.005; tiltT.x = drag.tx + dy * 0.005; }
});
addEventListener('pointerup', () => { if (drag && drag.moved < 6) palette(); drag = null; });
renderer.domElement.addEventListener('pointerleave', () => (pointerOn = false));
function palette(i) { setI = i ?? (setI + 1) % SETS.length; recolor(); }

// Loop
let lastInput = -1e9, aT = 0;
['pointerdown', 'pointermove'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true }));
const clock = new THREE.Clock();
// Warm up > prefill trails so first frame already has length
for (let k = 0; k < NP; k++) ribbons.forEach((rb) => { steer(rb, k / 60, 1 / 60); rb.trail.pop(); rb.trail.unshift(rb.head.clone()); });
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.033, clock.getDelta()), t = clock.elapsedTime + NP / 60;
  const idle = performance.now() - lastInput > 5000; if (idle) pointerOn = false;
  ribbons.forEach((rb) => { steer(rb, t, dt); const old = rb.trail.pop(); old.copy(rb.head); rb.trail.unshift(old); rb.col.lerp(rb.colT, Math.min(1, dt * 2)); rebuild(rb); });
  if (idle) { aT += dt; tiltT.y = Math.sin(t * 0.08) * 0.5; tiltT.x = Math.sin(t * 0.06) * 0.25; if (aT > 9) { aT = 0; palette(); } }
  tilt.x += (tiltT.x - tilt.x) * Math.min(1, dt * 4); tilt.y += (tiltT.y - tilt.y) * Math.min(1, dt * 4);
  rig.rotation.set(tilt.x, tilt.y, 0);
  renderer.render(scene, camera);
});
window.__ribbons = { palette, count: () => ribbons.length };
</script>
</body>
</html>
