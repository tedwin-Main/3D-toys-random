<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balloon Sky Drift</title>
<meta name="category" content="aero" />
<meta name="style" content="sky" />
<meta name="order" content="67" />
<meta name="capture" content="3500" />
<meta name="tags" content="three.js, LatheGeometry, canvas textures, lens flare, raycasting" />
<meta name="description" content="The blue-sky optimism of late-2000s stock imagery as a 3D scene: striped hot-air balloons drift over glossy green hills under puffy clouds, with a bright sun throwing lens-flare rings across the view. Click a balloon to fire its burner and watch it glow and climb before settling back, and drag to look around. Hard because the pieces are all made in code: the balloon shape is a lathed curve wrapped in a generated stripe texture, clouds are clumps of soft spheres, and the flare is a row of sprites pinned to the camera and placed along the line from the sun through the screen centre every frame."/>
<meta name="prompt" content="Build a late-2000s blue-sky scene in three.js, one HTML file: glossy rolling green hills, puffy clouds made of clustered spheres, and seven striped hot-air balloons with lathed envelopes, baskets and ropes drifting on the wind and wrapping around. Clicking a balloon fires its burner: flame glow, point light, and a climb that eases back to cruising height. Add a gradient sky, a sun sprite, and a lens flare made of camera-attached sprites positioned along the sun-to-centre axis. Orbit controls with slow auto-rotate; balloons also burn on their own now and then." />
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #7cc8ff; }
canvas { display: block; touch-action: none; }
#hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.7); background: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.2)); backdrop-filter: blur(10px); color: #0b3a66; font: 600 13px/1 'Segoe UI', 'Trebuchet MS', sans-serif; white-space: nowrap; pointer-events: none; box-shadow: inset 0 1px 0 #fff, 0 6px 18px rgba(0, 60, 120, 0.25); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="hint">click a balloon to fire its burner · drag to look around</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BALLOON_COLOURS = [['#ff4d4d', '#ffffff'], ['#ffb300', '#1e88e5'], ['#7ed321', '#ffffff'], ['#ff6ec7', '#ffe14d'], ['#00bcd4', '#ffffff'], ['#ff7a1a', '#7b3fe4'], ['#2ecc71', '#ffe14d']];
const WIND_LIMIT = 80;
const SUN_POSITION = new THREE.Vector3(-150, 130, -260);
const FLARE_GHOSTS = [{ along: 0.55, size: 0.5, opacity: 0.22 }, { along: 0.2, size: 0.28, opacity: 0.3 }, { along: -0.25, size: 0.7, opacity: 0.16 }, { along: -0.6, size: 0.4, opacity: 0.24 }, { along: -0.95, size: 1.1, opacity: 0.12 }];
const FLARE_DEPTH = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfeeff, 90, 330);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 900);
camera.position.set(8, 17, 50);
scene.add(camera);
const controls = new OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enablePan: false, enableDamping: true, autoRotate: true, autoRotateSpeed: 0.3, minDistance: 25, maxDistance: 80, minPolarAngle: 0.9, maxPolarAngle: 1.62 });
controls.target.set(0, 15, 0);

function paintCanvas(width, height, paint) {
  const canvas = Object.assign(document.createElement('canvas'), { width, height });
  paint(canvas.getContext('2d'), width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function radialGlowTexture(inner, outer) {
  return paintCanvas(256, 256, (ctx) => {
    const glow = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    glow.addColorStop(0, inner);
    glow.addColorStop(1, outer);
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 256, 256);
  });
}

scene.background = paintCanvas(4, 512, (ctx, width, height) => {
  const sky = ctx.createLinearGradient(0, 0, 0, height);
  sky.addColorStop(0, '#1479e0');
  sky.addColorStop(0.55, '#6cc4ff');
  sky.addColorStop(1, '#e4f7ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);
});
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x4f9a2e, 1.5));
const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.5);
sunLight.position.copy(SUN_POSITION);
scene.add(sunLight);

function buildHills() {
  const geometry = new THREE.PlaneGeometry(700, 700, 120, 120);
  geometry.rotateX(-Math.PI / 2);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const z = position.getZ(i);
    position.setY(i, Math.sin(x * 0.045) * 4 + Math.cos(z * 0.038 + x * 0.012) * 5 + Math.sin((x + z) * 0.11) * 1.2);
  }
  geometry.computeVertexNormals();
  return new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x58cf2f, roughness: 0.62 }));
}
scene.add(buildHills());

const cloudMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0xd4e6f4, emissiveIntensity: 0.7 });
const puffGeometry = new THREE.SphereGeometry(1, 20, 14);
function buildCloud() {
  const cloud = new THREE.Group();
  const puffs = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < puffs; i++) {
    const puff = new THREE.Mesh(puffGeometry, cloudMaterial);
    const size = 2.4 + Math.random() * 2.8;
    puff.scale.set(size * 1.3, size * 0.8, size);
    puff.position.set((i - puffs / 2) * 2.7 + Math.random(), Math.random() * 1.3, Math.random() * 2.4 - 1.2);
    cloud.add(puff);
  }
  cloud.position.set((Math.random() - 0.5) * 2 * WIND_LIMIT * 1.6, 30 + Math.random() * 22, -90 + Math.random() * 130);
  cloud.userData.speed = 0.5 + Math.random() * 0.8;
  return cloud;
}
const clouds = Array.from({ length: 16 }, buildCloud);
scene.add(...clouds);

// Envelope: lathed bulb, narrow neck flaring up to round crown; stripe texture wraps around as gores
const CROWN_START = 0.6;
function envelopeProfile() {
  const points = [];
  for (let step = 0; step <= 28; step++) {
    const t = step / 28;
    const lowerFlare = 0.3 + 1.2 * Math.sin((t / CROWN_START) * Math.PI * 0.5) ** 1.3;
    const crownDome = 1.5 * Math.sqrt(Math.max(0, 1 - ((t - CROWN_START) / (1 - CROWN_START)) ** 2));
    points.push(new THREE.Vector2(t < CROWN_START ? lowerFlare : crownDome, t * 3.5));
  }
  return points;
}
const envelopeGeometry = new THREE.LatheGeometry(envelopeProfile(), 36);
const basketGeometry = new THREE.BoxGeometry(0.5, 0.42, 0.5);
const basketMaterial = new THREE.MeshStandardMaterial({ color: 0x9a6a3a, roughness: 0.9 });
const ropeMaterial = new THREE.LineBasicMaterial({ color: 0x5a4028 });
const ropeGeometry = new THREE.BufferGeometry().setFromPoints([[-1, -1], [1, -1], [1, 1], [-1, 1]].flatMap(([x, z]) => [new THREE.Vector3(x * 0.22, -0.75, z * 0.22), new THREE.Vector3(x * 0.2, 0.05, z * 0.2)]));
const flameTexture = radialGlowTexture('rgba(255, 240, 170, 1)', 'rgba(255, 120, 0, 0)');

function stripeTexture([main, accent]) {
  const texture = paintCanvas(512, 256, (ctx, width, height) => {
    for (let gore = 0; gore < 12; gore++) {
      ctx.fillStyle = gore % 2 ? accent : main;
      ctx.fillRect((gore * width) / 12, 0, width / 12 + 1, height);
    }
    ctx.fillStyle = accent;
    ctx.fillRect(0, height * 0.42, width, height * 0.07);
    ctx.fillStyle = main;
    ctx.fillRect(0, height * 0.52, width, height * 0.04);
  });
  texture.wrapS = THREE.RepeatWrapping;
  return texture;
}

function buildBalloon(colours, index) {
  const balloon = new THREE.Group();
  const envelope = new THREE.Mesh(envelopeGeometry, new THREE.MeshStandardMaterial({ map: stripeTexture(colours), roughness: 0.25, emissive: 0xff8a2a, emissiveIntensity: 0 }));
  const basket = new THREE.Mesh(basketGeometry, basketMaterial);
  basket.position.y = -0.9;
  const flame = new THREE.Sprite(new THREE.SpriteMaterial({ map: flameTexture, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0 }));
  flame.position.y = -0.2;
  flame.scale.setScalar(1.6);
  balloon.add(envelope, basket, new THREE.LineSegments(ropeGeometry, ropeMaterial), flame);
  const size = 1.5 + Math.random() * 1.3;
  balloon.scale.setScalar(size);
  const cruiseHeight = 9 + Math.random() * 16;
  balloon.position.set(-WIND_LIMIT + (index / BALLOON_COLOURS.length) * WIND_LIMIT * 2, cruiseHeight, -30 + Math.random() * 44);
  balloon.userData = { envelope, flame, cruiseHeight, climb: 0, burn: 0, wind: 1.2 + Math.random() * 1.4, phase: Math.random() * Math.PI * 2 };
  envelope.userData.balloon = balloon;
  return balloon;
}
const balloons = BALLOON_COLOURS.map(buildBalloon);
scene.add(...balloons);

const fireBurner = (balloon) => { balloon.userData.burn = 1.6; };

// Balloon flight: burner pushes up, spring pulls back to cruise height
function flyBalloon(balloon, dt, seconds) {
  const flight = balloon.userData;
  flight.burn = Math.max(0, flight.burn - dt);
  const lift = flight.burn > 0 ? 5 : 0;
  flight.climb += (lift - (balloon.position.y - flight.cruiseHeight) * 0.3 - flight.climb * 0.7) * dt;
  balloon.position.y += flight.climb * dt + Math.sin(seconds * 0.8 + flight.phase) * 0.004;
  balloon.position.x += flight.wind * dt;
  if (balloon.position.x > WIND_LIMIT) balloon.position.x = -WIND_LIMIT;
  balloon.rotation.y += dt * 0.12;
  const glow = Math.min(1, flight.burn * 2) * (0.75 + 0.25 * Math.sin(seconds * 40));
  flight.flame.material.opacity = glow;
  flight.envelope.material.emissiveIntensity = glow * 0.35;
}

function driftCloud(cloud, dt) {
  cloud.position.x += cloud.userData.speed * dt;
  if (cloud.position.x > WIND_LIMIT * 1.6) cloud.position.x = -WIND_LIMIT * 1.6;
}

// Sun + flare: ghosts ride on camera, spaced along sun-to-centre axis
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialGlowTexture('rgba(255, 255, 240, 1)', 'rgba(255, 240, 180, 0)'), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
sun.position.copy(SUN_POSITION);
sun.scale.setScalar(110);
scene.add(sun);
const ghostTexture = radialGlowTexture('rgba(190, 235, 255, 0.2)', 'rgba(120, 200, 255, 0)');
const ghosts = FLARE_GHOSTS.map((ghost) => {
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: ghostTexture, blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, fog: false }));
  sprite.scale.setScalar(ghost.size);
  sprite.userData = ghost;
  camera.add(sprite);
  return sprite;
});

const sunOnScreen = new THREE.Vector3();
function placeFlare() {
  sunOnScreen.copy(SUN_POSITION).project(camera);
  const inView = sunOnScreen.z < 1 ? Math.max(0, 1 - Math.max(Math.abs(sunOnScreen.x), Math.abs(sunOnScreen.y)) / 1.4) : 0;
  const halfHeight = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * FLARE_DEPTH;
  for (const sprite of ghosts) {
    const { along, opacity } = sprite.userData;
    sprite.position.set(sunOnScreen.x * along * halfHeight * camera.aspect, sunOnScreen.y * along * halfHeight, -FLARE_DEPTH);
    sprite.material.opacity = opacity * inView * 4;
  }
}

// Click vs drag: only short, still presses fire burner
const raycaster = new THREE.Raycaster();
const press = { x: 0, y: 0 };
renderer.domElement.addEventListener('pointerdown', (event) => { press.x = event.clientX; press.y = event.clientY; });
renderer.domElement.addEventListener('pointerup', (event) => {
  if (Math.hypot(event.clientX - press.x, event.clientY - press.y) > 6) return;
  raycaster.setFromCamera(new THREE.Vector2((event.clientX / innerWidth) * 2 - 1, -(event.clientY / innerHeight) * 2 + 1), camera);
  const hit = raycaster.intersectObjects(balloons.map((balloon) => balloon.userData.envelope))[0];
  if (hit) fireBurner(hit.object.userData.balloon);
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
let nextAutoBurn = 1;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  const seconds = now / 1000;
  last = now;
  if (seconds > nextAutoBurn) {
    fireBurner(balloons[Math.floor(Math.random() * balloons.length)]);
    nextAutoBurn = seconds + 1.5 + Math.random() * 2.5;
  }
  for (const balloon of balloons) flyBalloon(balloon, dt, seconds);
  for (const cloud of clouds) driftCloud(cloud, dt);
  controls.update();
  placeFlare();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
