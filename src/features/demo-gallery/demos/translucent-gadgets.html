<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Translucent Gadgets</title>
<meta name="category" content="aero" />
<meta name="style" content="y2k" />
<meta name="order" content="9" />
<meta name="capture" content="5200" />
<meta name="tags" content="three.js, MeshPhysicalMaterial, transmission, late-90s candy plastic, product turntable" />
<meta name="description" content="Late-90s candy-coloured see-through plastic as a 3D product shot. A generic all-in-one CRT computer, a puck mouse with a coiled cable and a pocket handheld all turn on a white studio turntable. The shells are physical transmission materials, so you see the tube, the circuit board and the chips glowing through tinted plastic, and the computer and handheld screens run live canvas animations. Pick from five fruity colours and the tint fades across every shell. Hard because transmission renders the scene twice, and it still has to stay smooth on a phone." />
<meta name="prompt" content="Make a late-1990s translucent candy-plastic product showcase in three.js in one HTML file, with no logos. Model a generic all-in-one CRT computer, a round puck mouse with a cable and a handheld game device out of MeshPhysicalMaterial transmission shells, so the internals (CRT neck, circuit boards, chips) show through. Put them on a white studio turntable with soft shadows and a room environment map, give the screens live canvas textures, and add five fruit-colour swatches that tween the tint." />
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f6f8; font-family: "Lucida Grande", "Helvetica Neue", system-ui, sans-serif; }
canvas { display: block; }
#sw { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 14px; padding: 10px 16px; border-radius: 30px; background: rgba(255, 255, 255, 0.7); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#sw button { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15), 0 2px 5px rgba(0, 0, 0, 0.2); transition: transform 0.15s; }
#sw button::after { content: ''; position: absolute; left: 7px; right: 7px; top: 3px; height: 14px; border-radius: 50%; background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.1)); }
#sw button.on { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(0, 0, 0, 0.15); }
#label { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); font-size: 13px; letter-spacing: 3px; color: #8a96a3; text-transform: uppercase; }
#label b { color: #2f3b47; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="label">Colour <b id="cname">Berry</b></div>
<div id="sw"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const mobile = innerWidth < 700;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(mobile ? 1.5 : 2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f4f6f8');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(mobile ? 52 : 36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(mobile ? 0 : 1.2, 3.2, mobile ? 13 : 10.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0); controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = 18; controls.maxPolarAngle = Math.PI * 0.52;

// Studio > seamless white sweep + key light with soft shadow
const sweep = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.9 }));
sweep.rotation.x = -Math.PI / 2; sweep.receiveShadow = true; scene.add(sweep);
const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(4, 9, 6); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = key.shadow.camera.bottom = -6; key.shadow.camera.right = key.shadow.camera.top = 6; key.shadow.radius = 6; key.shadow.bias = -0.0005;
scene.add(key, new THREE.AmbientLight('#ffffff', 0.3));

// Turntable > glossy white disc, everything parented so it spins together
const table = new THREE.Group(); scene.add(table);
// start turned away so the front faces camera around poster time (~5 s at 0.25 rad/s)
table.rotation.y = -1.2;
const disc = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.3, 0.18, 96), new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.15, clearcoat: 1 }));
disc.position.y = 0.09; disc.receiveShadow = true; table.add(disc);

// Plastic > one tint shared by every coloured shell; frost for the white parts
const COLORS = [['Berry', '#1f7fd8'], ['Cherry', '#e0284f'], ['Orange', '#ff8a14'], ['Grape', '#7b3fd6'], ['Lime', '#5fd12a']];
const tint = new THREE.Color(COLORS[0][1]), target = tint.clone();
const candy = new THREE.MeshPhysicalMaterial({ color: tint, transmission: 1, thickness: 0.6, roughness: 0.12, ior: 1.45, attenuationColor: tint, attenuationDistance: 1.8, clearcoat: 1, clearcoatRoughness: 0.05, side: THREE.DoubleSide });
const ice = new THREE.MeshPhysicalMaterial({ color: '#ffffff', transmission: 1, thickness: 0.4, roughness: 0.35, ior: 1.4, clearcoat: 1, side: THREE.DoubleSide });
const dark = new THREE.MeshStandardMaterial({ color: '#2b2f36', roughness: 0.5, metalness: 0.2 });
const pcb = new THREE.MeshStandardMaterial({ color: '#1f6b3a', roughness: 0.6 });
const chip = new THREE.MeshStandardMaterial({ color: '#111', roughness: 0.4 });
const gold = new THREE.MeshStandardMaterial({ color: '#d9b45a', metalness: 1, roughness: 0.3 });
const shadowAll = (o) => o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });

// Screens > canvas textures repainted per frame
function screen(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; return { c, x: c.getContext('2d'), tex }; }
const crt = screen(320, 240), lcd = screen(160, 144);
function paintCrt(t) {
  const { x } = crt, w = 320, h = 240;
  const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, '#2a7ad8'); g.addColorStop(1, '#79c3ff'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  // wavy aqua wallpaper + menu bar + bouncing window, scanlines on top
  for (let k = 0; k < 4; k++) { x.fillStyle = `rgba(255,255,255,${0.08 + k * 0.03})`; x.beginPath(); x.moveTo(0, h); for (let i = 0; i <= w; i += 8) x.lineTo(i, h * (0.45 + k * 0.12) + Math.sin(i * 0.03 + t + k) * 12); x.lineTo(w, h); x.fill(); }
  x.fillStyle = 'rgba(255,255,255,0.9)'; x.fillRect(0, 0, w, 14);
  x.fillStyle = '#333'; x.font = '10px sans-serif'; x.fillText('File  Edit  View  Special', 22, 11);
  const bx = 40 + (Math.sin(t * 0.7) * 0.5 + 0.5) * 140, by = 40 + (Math.cos(t * 0.5) * 0.5 + 0.5) * 80;
  x.fillStyle = '#eee'; x.fillRect(bx, by, 120, 80); x.fillStyle = '#ccc'; x.fillRect(bx, by, 120, 14);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.arc(bx + 9 + i * 12, by + 7, 4, 0, 7); x.fill(); });
  x.fillStyle = `hsl(${(t * 40) % 360},80%,60%)`; x.beginPath(); x.arc(bx + 60, by + 48, 16 + Math.sin(t * 3) * 4, 0, 7); x.fill();
  x.fillStyle = 'rgba(0,0,0,0.12)'; for (let i = 0; i < h; i += 3) x.fillRect(0, i, w, 1);
  crt.tex.needsUpdate = true;
}
function paintLcd(t) {
  const { x } = lcd, w = 160, h = 144;
  x.fillStyle = '#9bbc0f'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#306230'; for (let i = 0; i < 8; i++) x.fillRect(((i * 40 - t * 50) % 200 + 200) % 200 - 20, 110, 18, 34);
  const jy = 92 - Math.abs(Math.sin(t * 3)) * 40; x.fillStyle = '#0f380f'; x.fillRect(40, jy, 14, 18);
  x.fillStyle = '#8bac0f'; x.fillRect(44, jy + 4, 3, 3);
  x.fillStyle = '#0f380f'; x.font = 'bold 12px monospace'; x.fillText(`SCORE ${String(Math.floor(t * 7) % 10000).padStart(4, '0')}`, 6, 14);
  lcd.tex.needsUpdate = true;
}

// Computer > ice front bezel, candy back bulge, CRT neck, handle, foot
const pc = new THREE.Group(); table.add(pc); pc.position.set(-0.4, 0.18, -0.6);
const bezel = new THREE.Mesh(new RoundedBoxGeometry(3.2, 3.0, 0.6, 6, 0.45), ice); bezel.position.y = 1.85; pc.add(bezel);
const back = new THREE.Mesh(new THREE.SphereGeometry(1.6, 48, 32, 0, Math.PI * 2, 0, Math.PI / 2), candy);
back.rotation.x = -Math.PI / 2; back.scale.set(1, 0.9, 1.05); back.position.set(0, 1.85, -0.25); pc.add(back);
const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 1.15, 1.4, 32), dark); tube.rotation.x = Math.PI / 2; tube.position.set(0, 1.9, -0.75); pc.add(tube);
const board = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 1.1), pcb); board.position.set(0, 0.95, -0.85); pc.add(board);
for (let i = 0; i < 6; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.22), i % 3 ? chip : gold); c.position.set(-0.85 + i * 0.34, 1.0, -0.85 + (i % 2) * 0.3); pc.add(c); }
const glass = new THREE.Mesh(new RoundedBoxGeometry(2.3, 1.8, 0.1, 4, 0.12), new THREE.MeshStandardMaterial({ map: crt.tex, emissive: '#ffffff', emissiveMap: crt.tex, emissiveIntensity: 0.9, roughness: 0.1 }));
glass.position.set(0, 2.0, 0.33); pc.add(glass);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.09, 16, 40, Math.PI), candy); handle.position.set(0, 3.25, -0.3); handle.rotation.x = -0.3; pc.add(handle);
const foot = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.5, 1.4, 4, 0.2), ice); foot.position.set(0, 0.25, -0.3); pc.add(foot);
const grille = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, 24), dark); grille.rotation.x = Math.PI / 2; [-1.1, 1.1].forEach((sx) => { const g = grille.clone(); g.position.set(sx, 0.62, 0.3); pc.add(g); });
shadowAll(pc);

// Mouse > lathe puck + coiled cable back to the computer
const mouse = new THREE.Group(); table.add(mouse); mouse.position.set(2.4, 0.18, 1.3); mouse.rotation.y = -0.4;
const prof = []; for (let i = 0; i <= 12; i++) { const a = (i / 12) * Math.PI / 2; prof.push(new THREE.Vector2(0.62 * Math.cos(a) + 0.0001, 0.28 * Math.sin(a))); }
prof.unshift(new THREE.Vector2(0, 0)); prof.splice(1, 0, new THREE.Vector2(0.62, 0));
const puck = new THREE.Mesh(new THREE.LatheGeometry(prof.reverse(), 48), candy); mouse.add(puck);
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), dark); ball.position.y = 0.12; mouse.add(ball);
const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.02, 32, 1, false, -0.6, 1.2), ice); btn.position.y = 0.27; mouse.add(btn);
const cablePts = [new THREE.Vector3(0, 0.1, -0.6)];
for (let i = 1; i <= 24; i++) { const k = i / 24; cablePts.push(new THREE.Vector3(Math.sin(k * 14) * 0.18 * (1 - k) - k * 2.4, 0.08 + Math.sin(k * Math.PI) * 0.05, -0.6 - k * 1.2 + Math.cos(k * 14) * 0.18 * (1 - k))); }
const cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cablePts), 160, 0.035, 8), candy); mouse.add(cable);
shadowAll(mouse);

// Handheld > candy shell, visible PCB + chips, LCD, d-pad, A/B
const hand = new THREE.Group(); table.add(hand); hand.position.set(-3.0, 0.18, 0.9); hand.rotation.set(-0.3, 0.6, 0);
const shell = new THREE.Mesh(new RoundedBoxGeometry(1.2, 2.0, 0.34, 5, 0.14), candy); shell.position.y = 1.0; hand.add(shell);
const hb = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.7, 0.03), pcb); hb.position.set(0, 1.0, -0.05); hand.add(hb);
for (let i = 0; i < 4; i++) { const c = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.05), chip); c.position.set(-0.25 + (i % 2) * 0.5, 0.55 + Math.floor(i / 2) * 0.35, -0.02); hand.add(c); }
const lcdM = new THREE.Mesh(new THREE.PlaneGeometry(0.72, 0.65), new THREE.MeshStandardMaterial({ map: lcd.tex, emissive: '#ffffff', emissiveMap: lcd.tex, emissiveIntensity: 0.6 }));
lcdM.position.set(0, 1.48, 0.175); hand.add(lcdM);
const bezel2 = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.85), new THREE.MeshStandardMaterial({ color: '#3a3f4a', roughness: 0.4 })); bezel2.position.set(0, 1.48, 0.172); hand.add(bezel2);
const dpH = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.11, 0.06), dark), dpV = dpH.clone(); dpV.rotation.z = Math.PI / 2;
[dpH, dpV].forEach((d) => { d.position.set(-0.27, 0.62, 0.19); hand.add(d); });
[[0.3, 0.68], [0.12, 0.56]].forEach(([x, y]) => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.06, 24), new THREE.MeshStandardMaterial({ color: '#a8164a', roughness: 0.3 })); b.rotation.x = Math.PI / 2; b.position.set(x, y, 0.19); hand.add(b); });
shadowAll(hand);

// Swatches > tween the shared tint
const sw = document.getElementById('sw');
let ci = 0;
COLORS.forEach(([n, c], i) => { const b = document.createElement('button'); b.style.background = c; b.title = n; b.onclick = () => setColor(i); sw.append(b); });
function setColor(i) { ci = i; target.set(COLORS[i][1]); [...sw.children].forEach((b, k) => b.classList.toggle('on', k === i)); document.getElementById('cname').textContent = COLORS[i][0]; }
setColor(0);

// Run engine > turntable spin, tint tween, screens, attract colour cycle
let spin = true, lastInput = -1e9, cycleT = 0;
renderer.domElement.addEventListener('pointerdown', () => { lastInput = performance.now(); });
sw.addEventListener('pointerdown', () => { lastInput = performance.now(); });
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (spin) table.rotation.y += dt * 0.25;
  tint.lerp(target, Math.min(1, dt * 3)); candy.color.copy(tint); candy.attenuationColor.copy(tint);
  paintCrt(t); paintLcd(t);
  if (performance.now() - lastInput > 8000) { cycleT += dt; if (cycleT > 3.5) { cycleT = 0; setColor((ci + 1) % COLORS.length); } }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(frame);
window.__gadgets = { color: (n) => setColor(Math.max(0, COLORS.findIndex(([k]) => k.toLowerCase() === String(n).toLowerCase()))), spin: (on) => { spin = on; } };
</script>
</body>
</html>
