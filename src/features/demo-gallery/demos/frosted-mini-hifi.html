<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frosted Mini Hi-Fi</title>
<meta name="category" content="aero" />
<meta name="style" content="softclub" />
<meta name="order" content="81" />
<meta name="capture" content="3800" />
<meta name="tags" content="late-90s mini hi-fi system, 3-disc carousel, canvas perspective platter, VFD spectrum analyzer, peak hold" />
<meta name="description" content="A late-1990s mini hi-fi system in frosted silver, with no brand. Through a smoky window a three-disc carousel turns in perspective to bring the next disc forward, and the playing disc spins. Below, a navy VFD runs a 16-band spectrum analyzer with falling peak-hold dots, the disc, track and time readouts, and CD, RANDOM and BASS lamps, while the volume knob's blue LED ring breathes. Every six seconds it flashes DISC CHANGE and rotates the platter. Tap a DISC button to pick one. Hard because the carousel is drawn as squashed ellipses sorted back to front each frame so the discs overlap correctly as it turns." />
<meta name="prompt" content="Make a silent late-1990s mini hi-fi system in one HTML file, no brand: frosted silver body, a smoky window showing a canvas three-disc carousel in perspective that rotates to the next disc every six seconds while the front disc spins, a navy VFD with a 16-band spectrum analyzer and peak-hold dots, disc/track/time readouts and CD, RANDOM and BASS lamps, DISC 1-3 buttons and a volume knob with a breathing blue LED ring." />
<style>
:root { --ice: #d7e6f2; --silver: #e8eaef; --lilac: #b8bdd3; --cyan: #8fd0e6; --accent: #ff8a3d; --ink: #2b3645; --vfd: #7ff0ff; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(110% 70% at 50% 30%, #f2f5f9, #cdd6e4 60%, #aeb8cd); font-family: "Helvetica Neue", Arial, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; padding-bottom: 13vh; }
.unit { --w: min(82vw, 47vh, 440px); width: var(--w); padding: calc(var(--w) * 0.06); border-radius: calc(var(--w) * 0.07) calc(var(--w) * 0.07) calc(var(--w) * 0.04) calc(var(--w) * 0.04); background: linear-gradient(170deg, rgba(250, 252, 254, 0.95), rgba(205, 214, 226, 0.92) 50%, rgba(226, 231, 238, 0.95)); box-shadow: 0 36px 60px rgba(40, 55, 85, 0.38), inset 0 2px 0 #fff, inset 0 -3px 8px rgba(60, 75, 100, 0.25); display: grid; gap: calc(var(--w) * 0.05); }
.head { display: flex; justify-content: space-between; font-size: calc(var(--w) * 0.025); letter-spacing: 0.45em; opacity: 0.8; }
.head b { letter-spacing: 0.2em; }
.window { aspect-ratio: 1.45; border-radius: calc(var(--w) * 0.06); background: radial-gradient(120% 90% at 40% 15%, rgba(120, 140, 170, 0.55), rgba(40, 55, 80, 0.75)); box-shadow: inset 0 8px 24px rgba(10, 20, 40, 0.5), 0 1px 0 #fff, 0 0 0 3px rgba(255, 255, 255, 0.6); position: relative; overflow: hidden; }
.window::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255, 255, 255, 0.3) 0 15%, transparent 35% 70%, rgba(255, 255, 255, 0.12)); }
canvas { display: block; width: 100%; height: 100%; }
.vfd { border-radius: calc(var(--w) * 0.025); background: linear-gradient(#0b1826, #142a40); box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.6), 0 1px 0 #fff; padding: calc(var(--w) * 0.035) calc(var(--w) * 0.045); color: var(--vfd); font-family: Menlo, monospace; text-shadow: 0 0 6px rgba(127, 240, 255, 0.8); }
.vfd .r { display: flex; justify-content: space-between; align-items: baseline; font-size: calc(var(--w) * 0.045); letter-spacing: 0.06em; }
.vfd .r small { font-size: 0.6em; letter-spacing: 0.25em; }
#spec { height: calc(var(--w) * 0.2); margin: calc(var(--w) * 0.025) 0; }
.lamps { display: flex; gap: calc(var(--w) * 0.04); font-size: calc(var(--w) * 0.026); letter-spacing: 0.25em; }
.lamps span { opacity: 0.15; }
.lamps span.on { opacity: 1; }
.ctl { display: flex; align-items: center; gap: calc(var(--w) * 0.03); }
.ctl button { flex: 1; border: 0; border-radius: 30px; padding: calc(var(--w) * 0.022) 0; font-size: calc(var(--w) * 0.026); letter-spacing: 0.2em; color: var(--ink); background: linear-gradient(#fbfcfd, #cdd5df); box-shadow: 0 2px 4px rgba(40, 55, 85, 0.3), inset 0 1px 0 #fff; cursor: pointer; }
.ctl button.on { background: linear-gradient(#e2f6fc, #9fd6ea); box-shadow: 0 0 10px rgba(143, 208, 230, 0.9), inset 0 1px 0 #fff; }
.vol { width: calc(var(--w) * 0.22); aspect-ratio: 1; border-radius: 50%; position: relative; }
.vol::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 210deg, rgba(90, 220, 255, var(--glow)) 0 var(--v), rgba(43, 54, 69, 0.15) var(--v) 300deg, transparent 300deg); -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%); mask: radial-gradient(circle, transparent 66%, #000 67%); }
.vol div { position: absolute; inset: 15%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #c3ccd8 70%); box-shadow: 0 4px 10px rgba(40, 55, 85, 0.35); }
.vol div i { position: absolute; left: 50%; top: 10%; width: 6%; height: 22%; background: var(--accent); border-radius: 2px; transform: translateX(-50%); }
</style>
</head>
<body>
<div id="stage">
  <div class="unit">
    <div class="head"><b>MX-300</b><span>3 DISC MINI SYSTEM</span></div>
    <div class="window"><canvas id="plat"></canvas></div>
    <div class="vfd">
      <div class="r"><span id="dt">DISC 1 · TR 01</span><small id="tm">00:00</small></div>
      <canvas id="spec"></canvas>
      <div class="lamps"><span class="on">CD</span><span id="lr">RANDOM</span><span id="lb" class="on">BASS</span><span id="lc">DISC CHANGE</span></div>
    </div>
    <div class="ctl"><button id="d0">DISC 1</button><button id="d1">DISC 2</button><button id="d2">DISC 3</button><div class="vol" id="vol"><div><i></i></div></div></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const DISCS = [['#eef7ff', '#c9b8ff', '#a6e6ff'], ['#f3fff9', '#a6e6d0', '#c0d6ff'], ['#fff5ee', '#ffd3b0', '#f2c8ff']];
let disc = 0, from = 0, changeAt = -10, lastAuto = 0, track = 1, trackAt = 0, spin = 0;
function pick(i) { if (i === disc) return; from = curAngle(); disc = i; changeAt = performance.now() / 1000; lastAuto = changeAt; track = 1; trackAt = changeAt + 1.4; }
[0, 1, 2].forEach((i) => { $(`d${i}`).onclick = () => pick(i); });
const ease = (x) => { x = Math.min(1, Math.max(0, x)); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
let angle = 0;
function curAngle() { return angle; }

function fit(c) { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1; if (c.width !== Math.round(r.width * d)) { c.width = r.width * d; c.height = r.height * d; } return [c.getContext('2d'), c.width, c.height]; }

// Platter > three discs on an ellipse, painted back to front
function platter(t, dt) {
  const [g, w, h] = fit($('plat'));
  g.clearRect(0, 0, w, h);
  const target = -disc * (Math.PI * 2 / 3);
  let dA = target - from; while (dA > Math.PI) dA -= Math.PI * 2; while (dA < -Math.PI) dA += Math.PI * 2;
  angle = from + dA * ease((t - changeAt) / 1.3);
  const cx = w / 2, cy = h * 0.42, R = w * 0.24, sq = 0.42, dr = w * 0.2;
  g.fillStyle = 'rgba(200,210,225,0.25)'; g.beginPath(); g.ellipse(cx, cy + h * 0.06, R + dr * 1.1, (R + dr * 1.1) * sq, 0, 0, Math.PI * 2); g.fill();
  const changing = t - changeAt < 1.4;
  spin += dt * (changing ? 1 : 14);
  const items = [0, 1, 2].map((i) => { const a = angle + i * (Math.PI * 2 / 3) + Math.PI / 2; return { i, x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R * sq, depth: Math.sin(a) }; }).sort((a, b) => a.depth - b.depth);
  items.forEach(({ i, x, y, depth }) => {
    const front = i === disc, s = 0.82 + depth * 0.18;
    g.save(); g.translate(x, y + h * 0.06); g.scale(1, sq);
    g.globalAlpha = 0.55 + (depth + 1) * 0.225;
    const cg = g.createConicGradient(front ? spin : i, 0, 0);
    const [a, b, c] = DISCS[i];
    [a, b, c, a, b, c, a].forEach((col, k) => cg.addColorStop(k / 6, col));
    g.fillStyle = cg; g.beginPath(); g.arc(0, 0, dr * s, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = w * 0.004; g.stroke();
    g.fillStyle = 'rgba(30,40,60,0.6)'; g.beginPath(); g.arc(0, 0, dr * s * 0.14, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.arc(0, 0, dr * s * 0.07, 0, Math.PI * 2); g.fill();
    g.restore();
    g.fillStyle = `rgba(230,240,250,${0.4 + (depth + 1) * 0.3})`; g.font = `${w * 0.035}px "Helvetica Neue", Arial`; g.textAlign = 'center';
    g.fillText(String(i + 1), x, y + h * 0.06 + dr * sq * s + w * 0.045);
  });
}

const BANDS = 16, peaks = new Array(BANDS).fill(0), lv = new Array(BANDS).fill(0);
function spectrum(t) {
  const [g, w, h] = fit($('spec'));
  g.clearRect(0, 0, w, h);
  const playing = t - changeAt > 1.4, beat = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 0.9)), 5);
  const bw = w / BANDS;
  for (let i = 0; i < BANDS; i++) {
    const shape = Math.exp(-Math.pow((i - 2.5) / 4.5, 2)) * 0.75 + 0.25 - i * 0.012;
    const target = playing ? Math.min(1, shape * (0.55 + 0.45 * Math.abs(Math.sin(t * (2.1 + i * 0.37) + i))) + (i < 5 ? beat * 0.35 : beat * 0.12)) : 0.02;
    lv[i] += (target - lv[i]) * 0.3;
    peaks[i] = Math.max(lv[i], peaks[i] - 0.012);
    const segs = 12, on = Math.round(lv[i] * segs);
    for (let s = 0; s < segs; s++) { g.fillStyle = s < on ? '#7ff0ff' : 'rgba(127,240,255,0.08)'; g.shadowColor = s < on ? 'rgba(127,240,255,0.8)' : 'transparent'; g.shadowBlur = s < on ? 6 : 0; g.fillRect(i * bw + bw * 0.15, h - (s + 1) * (h / segs) + 1, bw * 0.7, h / segs - 2); }
    g.fillStyle = '#ffffff'; g.shadowBlur = 0; g.fillRect(i * bw + bw * 0.15, h - peaks[i] * h - 2, bw * 0.7, 2);
  }
}

const pad = (n) => String(n).padStart(2, '0');
let last = performance.now() / 1000;
function frame() {
  const t = performance.now() / 1000, dt = Math.min(0.05, t - last); last = t;
  if (t - lastAuto > 6) pick((disc + 1) % 3);
  if (t > trackAt + 3.5 && t - changeAt > 1.4) { track++; trackAt = t; }
  platter(t, dt); spectrum(t);
  const changing = t - changeAt < 1.4;
  $('lc').classList.toggle('on', changing && Math.floor(t * 6) % 2 === 0);
  $('lr').classList.toggle('on', Math.floor(t / 5) % 2 === 1);
  const el = Math.max(0, t - trackAt);
  $('dt').textContent = changing ? `DISC ${disc + 1} · - - -` : `DISC ${disc + 1} · TR ${pad(track)}`;
  $('tm').textContent = changing ? '--:--' : `${pad(Math.floor(el / 60))}:${pad(Math.floor(el % 60))}`;
  [0, 1, 2].forEach((i) => $(`d${i}`).classList.toggle('on', i === disc));
  const vol = $('vol'); vol.style.setProperty('--v', `${180 + Math.sin(t * 0.4) * 20}deg`); vol.style.setProperty('--glow', String(0.55 + Math.sin(t * 2) * 0.35));
  vol.firstElementChild.style.transform = `rotate(${-150 + 180 + Math.sin(t * 0.4) * 20}deg)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
