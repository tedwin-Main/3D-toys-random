<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spreadsheet</title>
<meta name="category" content="apps" />
<meta name="order" content="3" />
<meta name="capture" content="5000" />
<meta name="tags" content="formula parser, dependency recalculation, cycle detection, CSV, keyboard nav" />
<meta name="description" content="A working spreadsheet in one file: a hand-written formula parser with operator precedence, cell and range references, absolute $ refs, SUM, AVERAGE, MIN, MAX, COUNT, IF, ROUND, ABS and string concatenation; recalculation that follows dependencies and catches cycles; error values; keyboard navigation and a formula bar; copy and paste that shifts relative references; and CSV import and export. The idle demo edits a budget and you can watch totals ripple. Tests parsing and app logic, not just layout." />
<meta name="prompt" content="Build a spreadsheet app in a single HTML file with vanilla JavaScript. It needs a grid with column letters and row numbers, a formula bar, and formulas starting with = that support + - * / ^, parentheses, cell references like A1 and $A$1, ranges like A1:B5, and functions SUM, AVERAGE, MIN, MAX, COUNT, IF, ROUND and ABS. Recalculate dependent cells when inputs change, show errors like #DIV/0!, #REF! and #CYCLE!, support arrow key navigation, Enter and Tab, copy and paste that adjusts relative references, and import and export CSV. Start it with a sample budget." />
<style>
  :root { --ink: #1b1f2a; --muted: #6b7385; --line: #e2e5ec; --head: #f5f6f9; --sel: #3b6cff; --selbg: rgba(59, 108, 255, 0.09); --bg: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3f5f9; color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  header { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: #fff; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  header h1 i { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #34c77b, #1e9e5a); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; }
  header .sp { flex: 1; }
  header button, header label.btn { height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: 600 12px inherit; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; }
  #fbar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #fff; border-bottom: 1px solid var(--line); }
  #addr { width: 64px; height: 26px; border: 1px solid var(--line); border-radius: 6px; display: grid; place-items: center; font: 600 12px ui-monospace, Menlo, monospace; }
  #fx { color: var(--muted); font: italic 600 13px Georgia, serif; }
  #formula { flex: 1; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font: 13px ui-monospace, Menlo, monospace; outline: none; }
  #formula:focus { border-color: var(--sel); }
  #scroller { position: absolute; top: 88px; left: 0; right: 0; bottom: 30px; overflow: auto; background: var(--bg); }
  table { border-collapse: separate; border-spacing: 0; font-size: 13px; table-layout: fixed; }
  th, td { height: 26px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  th { position: sticky; background: var(--head); color: var(--muted); font-weight: 600; font-size: 11.5px; z-index: 2; }
  thead th { top: 0; text-align: center; }
  tbody th { left: 0; width: 44px; text-align: center; z-index: 1; }
  thead th.corner { left: 0; z-index: 3; }
  th.hl { background: #e6ecff; color: var(--sel); }
  td { width: 104px; cursor: cell; font-variant-numeric: tabular-nums; }
  td.num { text-align: right; }
  td.err { color: #d33; font-weight: 600; }
  td.bold { font-weight: 700; }
  td.inrange { background: var(--selbg); }
  td.cur { outline: 2px solid var(--sel); outline-offset: -2px; position: relative; }
  td.flash { animation: flash 0.9s; }
  @keyframes flash { from { background: #fff4b8; } to { background: transparent; } }
  td input { width: 100%; height: 100%; border: 0; outline: none; font: 13px ui-monospace, Menlo, monospace; padding: 0; background: #fff; }
  footer { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: #fff; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  footer b { color: var(--ink); font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) { header h1 span { display: none; } td { width: 84px; } footer .hide-m { display: none; } }
</style>
</head>
<body>
<header>
  <h1><i>▦</i>Sheet<span style="font-weight:400;color:var(--muted)">· budget.csv</span></h1>
  <div class="sp"></div>
  <label class="btn">Import CSV<input id="import" type="file" accept=".csv,text/csv" hidden></label>
  <button id="export">Export CSV</button>
</header>
<div id="fbar"><div id="addr">A1</div><span id="fx">fx</span><input id="formula" spellcheck="false"></div>
<div id="scroller"><table id="grid"></table></div>
<footer><span>Sum <b id="s-sum">0</b></span><span>Avg <b id="s-avg">–</b></span><span>Count <b id="s-cnt">0</b></span><span class="hide-m">Arrows · Enter · Tab · type to edit · Ctrl+C / Ctrl+V</span></footer>
<script>
const COLS = 12, ROWS = 40;
const $ = (id) => document.getElementById(id);
const colName = (c) => String.fromCharCode(65 + c);
const addr = (r, c) => colName(c) + (r + 1);
function parseAddr(a) { const m = /^\$?([A-Z])\$?(\d+)$/.exec(a.toUpperCase()); if (!m) return null; const c = m[1].charCodeAt(0) - 65, r = Number(m[2]) - 1; return r >= 0 && r < ROWS && c < COLS ? [r, c] : null; }

// Sheet > storage: raw input per cell; computed cache rebuilt on every edit
const raw = {};
let cache = {};

// Formula > tokenizer
class FErr { constructor(code) { this.code = code; } }
function tokenize(src) {
  const t = [], re = /\s*(?:(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+)|("(?:[^"]|"")*")|(\$?[A-Za-z]\$?\d+(?::\$?[A-Za-z]\$?\d+)?)|([A-Za-z_]+)|(<=|>=|<>|[-+*/^&=<>(),%]))/y;
  let m;
  while (re.lastIndex < src.length) {
    const at = re.lastIndex;
    if (/^\s*$/.test(src.slice(at))) break;
    if (!(m = re.exec(src))) throw new FErr('#ERROR!');
    if (m[1]) t.push({ k: 'num', v: parseFloat(m[1]) });
    else if (m[2]) t.push({ k: 'str', v: m[2].slice(1, -1).replace(/""/g, '"') });
    else if (m[3]) t.push({ k: m[3].includes(':') ? 'range' : 'ref', v: m[3].toUpperCase() });
    else if (m[4]) t.push({ k: 'id', v: m[4].toUpperCase() });
    else t.push({ k: 'op', v: m[5] });
  }
  return t;
}
// Formula > parser: comparison < concat < additive < multiplicative < power < unary < postfix % < primary
function parse(tokens) {
  let i = 0;
  const peek = () => tokens[i], take = () => tokens[i++];
  const isOp = (...ops) => peek() && peek().k === 'op' && ops.includes(peek().v);
  const bin = (next, ops) => () => { let l = next(); while (isOp(...ops)) { const op = take().v; l = { k: 'bin', op, l, r: next() }; } return l; };
  const primary = () => {
    const tk = take();
    if (!tk) throw new FErr('#ERROR!');
    if (tk.k === 'num' || tk.k === 'str') return { k: 'lit', v: tk.v };
    if (tk.k === 'ref') return { k: 'ref', v: tk.v };
    if (tk.k === 'range') return { k: 'range', v: tk.v };
    if (tk.k === 'id') {
      if (tk.v === 'TRUE' || tk.v === 'FALSE') return { k: 'lit', v: tk.v === 'TRUE' };
      if (!isOp('(')) throw new FErr('#NAME?');
      take();
      const args = [];
      if (!isOp(')')) { do { args.push(cmp()); } while (isOp(',') && take()); }
      if (!isOp(')')) throw new FErr('#ERROR!');
      take();
      return { k: 'call', f: tk.v, args };
    }
    if (tk.k === 'op' && tk.v === '(') { const e = cmp(); if (!isOp(')')) throw new FErr('#ERROR!'); take(); return e; }
    throw new FErr('#ERROR!');
  };
  const postfix = () => { let e = primary(); while (isOp('%')) { take(); e = { k: 'bin', op: '/', l: e, r: { k: 'lit', v: 100 } }; } return e; };
  const unary = () => (isOp('-', '+') ? { k: 'neg', s: take().v === '-' ? -1 : 1, e: unary() } : postfix());
  const power = () => { const b = unary(); return isOp('^') ? (take(), { k: 'bin', op: '^', l: b, r: power() }) : b; };
  const mul = bin(power, ['*', '/']);
  const add = bin(mul, ['+', '-']);
  const cat = bin(add, ['&']);
  const cmp = bin(cat, ['=', '<>', '<', '>', '<=', '>=']);
  const ast = cmp();
  if (i < tokens.length) throw new FErr('#ERROR!');
  return ast;
}
// Formula > evaluation: refs pull computed values, visiting set catches cycles
const visiting = new Set();
function valueOf(a) {
  if (a in cache) return cache[a];
  if (visiting.has(a)) throw new FErr('#CYCLE!');
  visiting.add(a);
  let v;
  try { v = compute(raw[a]); } catch (e) { v = e instanceof FErr ? e : new FErr('#ERROR!'); }
  visiting.delete(a);
  // a cycle poisons every cell on it, not only the one that noticed
  cache[a] = v;
  return v;
}
function compute(src) {
  if (src === undefined || src === '') return '';
  if (src[0] !== '=') { const n = Number(src.replace(/,/g, '')); return src.trim() !== '' && Number.isFinite(n) ? n : src; }
  return evalNode(parse(tokenize(src.slice(1))));
}
function rangeCells(v) {
  const [a, b] = v.split(':').map(parseAddr);
  if (!a || !b) throw new FErr('#REF!');
  const out = [];
  for (let r = Math.min(a[0], b[0]); r <= Math.max(a[0], b[0]); r++) for (let c = Math.min(a[1], b[1]); c <= Math.max(a[1], b[1]); c++) out.push(addr(r, c));
  return out;
}
const num = (v) => { if (v instanceof FErr) throw v; if (v === '' || v === false) return 0; if (v === true) return 1; const n = Number(v); if (!Number.isFinite(n)) throw new FErr('#VALUE!'); return n; };
function flat(args) {
  const out = [];
  for (const a of args) {
    if (a.k === 'range') for (const c of rangeCells(a.v)) { const v = valueOf(c.replace(/\$/g, '')); if (v instanceof FErr) throw v; if (typeof v === 'number') out.push(v); }
    else out.push(num(evalNode(a)));
  }
  return out;
}
const FUNCS = {
  SUM: (a) => flat(a).reduce((s, x) => s + x, 0),
  AVERAGE: (a) => { const f = flat(a); if (!f.length) throw new FErr('#DIV/0!'); return f.reduce((s, x) => s + x, 0) / f.length; },
  MIN: (a) => { const f = flat(a); return f.length ? Math.min(...f) : 0; },
  MAX: (a) => { const f = flat(a); return f.length ? Math.max(...f) : 0; },
  COUNT: (a) => flat(a).length,
  ROUND: (a) => { const n = num(evalNode(a[0])), d = a[1] ? num(evalNode(a[1])) : 0; const k = 10 ** d; return Math.round(n * k) / k; },
  ABS: (a) => Math.abs(num(evalNode(a[0]))),
  IF: (a) => { const c = evalNode(a[0]); if (c instanceof FErr) throw c; return c && c !== 0 ? evalNode(a[1]) : a[2] ? evalNode(a[2]) : false; },
};
function evalNode(n) {
  switch (n.k) {
    case 'lit': return n.v;
    case 'ref': { const p = parseAddr(n.v); if (!p) throw new FErr('#REF!'); const v = valueOf(addr(...p)); if (v instanceof FErr) throw v; return v; }
    case 'range': throw new FErr('#VALUE!');
    case 'neg': return n.s * num(evalNode(n.e));
    case 'call': { const f = FUNCS[n.f]; if (!f) throw new FErr('#NAME?'); return f(n.args); }
    case 'bin': {
      const l = evalNode(n.l), r = evalNode(n.r);
      if (l instanceof FErr) throw l; if (r instanceof FErr) throw r;
      switch (n.op) {
        case '+': return num(l) + num(r);
        case '-': return num(l) - num(r);
        case '*': return num(l) * num(r);
        case '/': { const d = num(r); if (d === 0) throw new FErr('#DIV/0!'); return num(l) / d; }
        case '^': return num(l) ** num(r);
        case '&': return String(l) + String(r);
        case '=': return l === r; case '<>': return l !== r;
        case '<': return l < r; case '>': return l > r; case '<=': return l <= r; case '>=': return l >= r;
      }
    }
  }
  throw new FErr('#ERROR!');
}
function fmt(v) {
  if (v instanceof FErr) return v.code;
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return Math.abs(v) >= 1e12 || (Math.abs(v) < 1e-6 && v !== 0) ? v.toExponential(4) : v.toLocaleString(undefined, { maximumFractionDigits: 6 });
  return v;
}

// Sheet > grid DOM
const grid = $('grid'), tds = [];
(function build() {
  let h = '<thead><tr><th class="corner"></th>' + Array.from({ length: COLS }, (_, c) => `<th data-c="${c}">${colName(c)}</th>`).join('') + '</tr></thead><tbody>';
  for (let r = 0; r < ROWS; r++) h += `<tr><th data-r="${r}">${r + 1}</th>` + Array.from({ length: COLS }, (_, c) => `<td data-r="${r}" data-c="${c}"></td>`).join('') + '</tr>';
  grid.innerHTML = h + '</tbody>';
  grid.querySelectorAll('td').forEach((td) => { tds[td.dataset.r * COLS + Number(td.dataset.c)] = td; });
})();
const bold = new Set();
let prevShown = {};
function render(flash = true) {
  cache = {};
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const a = addr(r, c), v = raw[a] !== undefined ? valueOf(a) : '', td = tds[r * COLS + c], s = fmt(v);
    td.textContent = s;
    td.className = (typeof v === 'number' ? 'num' : '') + (v instanceof FErr ? ' err' : '') + (bold.has(a) ? ' bold' : '');
    if (flash && prevShown[a] !== undefined && prevShown[a] !== s) { td.classList.add('flash'); }
    prevShown[a] = s;
  }
  paintSel();
}

// Sheet > selection: cursor cell + anchor for ranges
let cur = [0, 0], anchor = [0, 0], editing = null;
function paintSel() {
  const [r0, r1] = [Math.min(cur[0], anchor[0]), Math.max(cur[0], anchor[0])], [c0, c1] = [Math.min(cur[1], anchor[1]), Math.max(cur[1], anchor[1])];
  let sum = 0, cnt = 0;
  tds.forEach((td, i) => {
    const r = (i / COLS) | 0, c = i % COLS, inR = r >= r0 && r <= r1 && c >= c0 && c <= c1;
    td.classList.toggle('inrange', inR && (r0 !== r1 || c0 !== c1));
    td.classList.toggle('cur', r === cur[0] && c === cur[1]);
    if (inR) { const v = cache[addr(r, c)]; if (typeof v === 'number') { sum += v; cnt++; } }
  });
  grid.querySelectorAll('thead th[data-c]').forEach((th) => th.classList.toggle('hl', Number(th.dataset.c) >= c0 && Number(th.dataset.c) <= c1));
  grid.querySelectorAll('tbody th').forEach((th) => th.classList.toggle('hl', Number(th.dataset.r) >= r0 && Number(th.dataset.r) <= r1));
  $('addr').textContent = addr(...cur);
  if (document.activeElement !== $('formula')) $('formula').value = raw[addr(...cur)] ?? '';
  $('s-sum').textContent = fmt(sum); $('s-avg').textContent = cnt ? fmt(sum / cnt) : '–'; $('s-cnt').textContent = cnt;
}
function move(dr, dc, extend = false) {
  cur = [Math.max(0, Math.min(ROWS - 1, cur[0] + dr)), Math.max(0, Math.min(COLS - 1, cur[1] + dc))];
  if (!extend) anchor = [...cur];
  paintSel();
  tds[cur[0] * COLS + cur[1]].scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function setCell(a, v) { if (v === '') delete raw[a]; else raw[a] = v; render(); }

// Sheet > editing: in-cell input, Enter commits down, Tab commits right, Esc cancels
function startEdit(initial) {
  const td = tds[cur[0] * COLS + cur[1]], a = addr(...cur);
  const inp = document.createElement('input');
  inp.value = initial ?? raw[a] ?? '';
  td.textContent = ''; td.appendChild(inp); inp.focus();
  editing = { inp, a };
  inp.addEventListener('input', () => ($('formula').value = inp.value));
  inp.addEventListener('blur', () => editing && commit(0, 0));
}
function commit(dr, dc) {
  if (!editing) return;
  const { inp, a } = editing; editing = null;
  setCell(a, inp.value.trim());
  move(dr, dc);
}
grid.addEventListener('pointerdown', (e) => {
  const td = e.target.closest('td'); if (!td || e.target.tagName === 'INPUT') return;
  userAct();
  if (editing) commit(0, 0);
  const p = [Number(td.dataset.r), Number(td.dataset.c)];
  if (e.shiftKey) cur = p; else { cur = p; anchor = [...p]; }
  paintSel();
  const drag = (m) => { const t = document.elementFromPoint(m.clientX, m.clientY)?.closest('td'); if (t) { cur = [Number(t.dataset.r), Number(t.dataset.c)]; paintSel(); } };
  const up = () => { removeEventListener('pointermove', drag); removeEventListener('pointerup', up); };
  addEventListener('pointermove', drag); addEventListener('pointerup', up);
});
grid.addEventListener('dblclick', (e) => { if (e.target.closest('td')) startEdit(); });
addEventListener('keydown', (e) => {
  if (document.activeElement === $('formula')) return;
  userAct();
  if (editing) {
    if (e.key === 'Enter') { e.preventDefault(); commit(e.shiftKey ? -1 : 1, 0); }
    else if (e.key === 'Tab') { e.preventDefault(); commit(0, e.shiftKey ? -1 : 1); }
    // clear editing before remove so the blur handler does not commit
    else if (e.key === 'Escape') { const ed = editing; editing = null; ed.inp.remove(); render(false); }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'c') { copySel(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === 'v') { pasteAt(); e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === 'b') { const a = addr(...cur); bold.has(a) ? bold.delete(a) : bold.add(a); render(false); e.preventDefault(); return; }
  const arrows = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (arrows[e.key]) { e.preventDefault(); move(...arrows[e.key], e.shiftKey); }
  else if (e.key === 'Enter') { e.preventDefault(); startEdit(); }
  else if (e.key === 'Tab') { e.preventDefault(); move(0, e.shiftKey ? -1 : 1); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); eachSel((a) => delete raw[a]); render(); }
  else if (e.key.length === 1 && !mod) { e.preventDefault(); startEdit(e.key); }
});
$('formula').addEventListener('keydown', (e) => { if (e.key === 'Enter') { setCell(addr(...cur), $('formula').value.trim()); $('formula').blur(); move(1, 0); } if (e.key === 'Escape') $('formula').blur(); });
function eachSel(fn) { for (let r = Math.min(cur[0], anchor[0]); r <= Math.max(cur[0], anchor[0]); r++) for (let c = Math.min(cur[1], anchor[1]); c <= Math.max(cur[1], anchor[1]); c++) fn(addr(r, c), r, c); }

// Sheet > clipboard: relative refs shift by the paste offset, $-anchored parts stay
let clip = null;
function shiftFormula(f, dr, dc) {
  if (!f || f[0] !== '=') return f;
  return f.replace(/("(?:[^"]|"")*")|(\$?)([A-Z])(\$?)(\d+)/gi, (m, str, dc$, col, dr$, row) => {
    if (str) return str;
    const c = dc$ ? col.toUpperCase().charCodeAt(0) - 65 : col.toUpperCase().charCodeAt(0) - 65 + dc, r = dr$ ? Number(row) : Number(row) + dr;
    if (c < 0 || c >= COLS || r < 1) return '#REF!';
    return `${dc$}${String.fromCharCode(65 + c)}${dr$}${r}`;
  });
}
function copySel() {
  const r0 = Math.min(cur[0], anchor[0]), c0 = Math.min(cur[1], anchor[1]), cells = [];
  eachSel((a, r, c) => cells.push({ dr: r - r0, dc: c - c0, v: raw[a] ?? '' }));
  clip = { r0, c0, cells };
  const rows = {}; for (const x of cells) (rows[x.dr] ||= [])[x.dc] = fmt(cache[addr(r0 + x.dr, c0 + x.dc)] ?? '');
  navigator.clipboard?.writeText(Object.values(rows).map((r) => r.join('\t')).join('\n')).catch(() => {});
}
function pasteAt() {
  if (!clip) return;
  const r0 = Math.min(cur[0], anchor[0]), c0 = Math.min(cur[1], anchor[1]);
  for (const x of clip.cells) { const r = r0 + x.dr, c = c0 + x.dc; if (r < ROWS && c < COLS) { const v = shiftFormula(x.v, r0 - clip.r0, c0 - clip.c0); if (v === '') delete raw[addr(r, c)]; else raw[addr(r, c)] = v; } }
  render();
}

// Sheet > CSV import / export (quoted fields, embedded commas and quotes)
function toCSV() {
  let maxR = 0, maxC = 0;
  for (const a of Object.keys(raw)) { const [r, c] = parseAddr(a); maxR = Math.max(maxR, r); maxC = Math.max(maxC, c); }
  const q = (s) => (/[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s);
  const lines = [];
  for (let r = 0; r <= maxR; r++) { const row = []; for (let c = 0; c <= maxC; c++) row.push(q(raw[addr(r, c)] ?? '')); lines.push(row.join(',')); }
  return lines.join('\n');
}
function fromCSV(text) {
  for (const k of Object.keys(raw)) delete raw[k];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (ch === '"') q = false; else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  rows.slice(0, ROWS).forEach((r, ri) => r.slice(0, COLS).forEach((v, ci) => { if (v !== '') raw[addr(ri, ci)] = v; }));
  render(false);
}
$('export').onclick = () => { userAct(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCSV()], { type: 'text/csv' })); a.download = 'sheet.csv'; a.click(); };
$('import').onchange = async (e) => { userAct(); const f = e.target.files[0]; if (f) fromCSV(await f.text()); };

// Sheet > sample budget
function loadSample() {
  for (const k of Object.keys(raw)) delete raw[k];
  bold.clear();
  const rows = [
    ['Category', 'Jan', 'Feb', 'Mar', 'Q1 total', 'Avg / mo', 'Share'],
    ['Rent', '1450', '1450', '1450'], ['Groceries', '420', '388', '455'], ['Transport', '96', '120', '88'], ['Utilities', '140', '162', '131'],
    ['Fun', '210', '95', '260'], ['Savings', '500', '650', '500'],
  ];
  rows.forEach((r, i) => r.forEach((v, c) => (raw[addr(i, c)] = v)));
  for (let i = 1; i < rows.length; i++) { raw[addr(i, 4)] = `=SUM(B${i + 1}:D${i + 1})`; raw[addr(i, 5)] = `=ROUND(AVERAGE(B${i + 1}:D${i + 1}),1)`; raw[addr(i, 6)] = `=ROUND(E${i + 1}/$E$9*100,1)&"%"`; }
  raw.A9 = 'Total'; ['B', 'C', 'D', 'E'].forEach((c) => (raw[c + '9'] = `=SUM(${c}2:${c}7)`));
  raw.F9 = '=ROUND(E9/3,1)';
  raw.A11 = 'Income'; raw.B11 = '3600'; raw.C11 = '3600'; raw.D11 = '3800';
  raw.A12 = 'Left over'; ['B', 'C', 'D'].forEach((c) => (raw[c + '12'] = `=${c}11-${c}9`));
  raw.E12 = '=SUM(B12:D12)';
  raw.A13 = 'Status'; raw.B13 = '=IF(E12>0,"on track","over budget")';
  raw.A15 = 'Biggest'; raw.B15 = '=MAX(E2:E7)'; raw.A16 = 'Smallest'; raw.B16 = '=MIN(E2:E7)';
  ['A1', 'B1', 'C1', 'D1', 'E1', 'F1', 'G1', 'A9', 'B9', 'C9', 'D9', 'E9', 'F9', 'A12', 'E12'].forEach((a) => bold.add(a));
  prevShown = {};
  render(false);
}
loadSample();

// Sheet > idle demo: edits inputs so totals visibly ripple, then restores the sample
let lastInput = -1e9, demoId = 0;
function userAct() { lastInput = performance.now(); demoId++; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function demo() {
  const id = ++demoId;
  loadSample();
  const steps = [['C3', '512'], ['D6', '40'], ['B11', '3900'], ['A18', 'Check'], ['B18', '=E9+E12=SUM(B11:D11)'], ['A19', 'Div test'], ['B19', '=B2/0'], ['A20', 'Cycle'], ['B20', '=B21+1'], ['B21', '=B20*2']];
  for (const [a, v] of steps) {
    const p = parseAddr(a); cur = [...p]; anchor = [...p]; paintSel();
    await wait(300); if (id !== demoId) return;
    for (let i = 1; i <= v.length; i++) { $('formula').value = v.slice(0, i); await wait(22); if (id !== demoId) return; }
    setCell(a, v);
    await wait(450); if (id !== demoId) return;
  }
  cur = [1, 4]; anchor = [6, 1]; paintSel();
}
setInterval(() => { if (performance.now() - lastInput > 22000) { lastInput = performance.now(); demo(); } }, 1000);
demo();
window.__sheet = { set: (a, v) => { userAct(); setCell(a, v); }, get: (a) => fmt(valueOf(a)), display: (a) => { const p = parseAddr(a); return tds[p[0] * COLS + p[1]].textContent; }, shiftFormula, toCSV, fromCSV, stopDemo: userAct, reset: loadSample };
</script>
