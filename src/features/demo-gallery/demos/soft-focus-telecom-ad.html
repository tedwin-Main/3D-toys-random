<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soft Focus Mobile Ad</title>
<meta name="category" content="aero" />
<meta name="style" content="softclub" />
<meta name="order" content="76" />
<meta name="capture" content="5000" />
<meta name="tags" content="late-90s mobile network ad, soft-focus blur sprites, lens flare ghosts, candybar phone, tracked taglines" />
<meta name="description" content="A late-1990s mobile network TV spot, with no brand. Out-of-focus figures drift across a pastel sky, bokeh floats past and a lens flare throws hexagon ghosts from the sun. Thin wide-tracked taglines (stay close, talk anywhere, the future is soft) type on above a hairline rule, and a silver candybar phone floats up with its little backlit screen receiving texts from a friend on the way to the lounge. Click to jump to the next line. Hard because each blurred figure is painted once into an offscreen sprite so the soft-focus look stays smooth while everything moves." />
<meta name="prompt" content="Make a silent late-1990s mobile phone network ad in one HTML canvas file with no brand: pastel sky that slowly shifts hue, soft-focus blurred human figures drifting at different depths (pre-blurred sprites), floating bokeh, a lens flare with hexagon ghosts, light wide-tracked taglines that type on over a hairline rule every four seconds, and a floating silver candybar phone whose backlit screen receives text messages." />
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe7f2; cursor: pointer; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, M = 0, figs = [];
const LINES = [['stay close.', 'DIGITAL MOBILE · 1999'], ['talk anywhere.', 'NATIONWIDE COVERAGE'], ['the future is soft.', 'NEW · PREPAID · TEXT'], ['always on.', 'CONNECT SOFTLY']];
const MSGS = ['u at the lounge?', 'on my way :)', 'bring the cds', 'dj starts at 2', 'see u by the pier', 'sunrise set!!'];
const PEOPLE = [{ x: 0.2, d: 0.5, s: 0.012, c: '#7d8fb2' }, { x: 0.7, d: 0.8, s: -0.008, c: '#6f7fa6' }, { x: 0.45, d: 1.15, s: 0.006, c: '#8c96bf' }, { x: 0.9, d: 0.65, s: -0.014, c: '#9aa3c8' }];
const BOKEH = Array.from({ length: 22 }, () => ({ x: Math.random(), y: Math.random(), r: 0.02 + Math.random() * 0.06, v: 0.01 + Math.random() * 0.02, a: 0.15 + Math.random() * 0.25 }));

// Figures > blurred silhouettes painted once per size
function figure(scale, col) {
  const w = M * 0.5 * scale, h = M * 1.2 * scale, c = document.createElement('canvas'); c.width = w; c.height = h;
  const p = c.getContext('2d'); p.filter = `blur(${M * 0.03 * scale}px)`; p.fillStyle = col;
  p.beginPath(); p.arc(w / 2, h * 0.2, w * 0.13, 0, Math.PI * 2); p.fill();
  p.beginPath(); p.ellipse(w / 2, h * 0.58, w * 0.24, h * 0.34, 0, 0, Math.PI * 2); p.fill();
  return c;
}
function size() { dpr = devicePixelRatio || 1; W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; M = Math.min(W, H); figs = PEOPLE.map((p) => figure(p.d, p.c)); }
size(); addEventListener('resize', size);

let li = 0, born = performance.now() / 1000, msgBase = 0;
const PERIOD = 4;
cv.onclick = () => { li = (li + 1) % LINES.length; born = performance.now() / 1000; };
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

function tracked(text, x, y, px, track, weight, alpha, k = 1) {
  g.font = `${weight} ${px}px "Helvetica Neue", Helvetica, Arial, sans-serif`; g.textAlign = 'left';
  const cs = [...text], ws = cs.map((c) => g.measureText(c).width + px * track), total = ws.reduce((a, b) => a + b, 0) - px * track;
  let xx = x - total / 2;
  cs.forEach((c, i) => { const on = ease(k * cs.length * 1.2 - i); if (on > 0) { g.fillStyle = `rgba(43,54,69,${alpha * on})`; g.fillText(c, xx, y); } xx += ws[i]; });
  return total;
}

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function phone(t) {
  const pw = M * 0.3, ph = pw * 2.3, k = ease((t - 1) / 1.5);
  const x = W / 2 - pw / 2 + Math.sin(t * 0.6) * M * 0.01, y = H * 0.43 + (1 - k) * H * 0.4 + Math.sin(t * 0.9) * M * 0.012;
  g.save(); g.translate(x + pw / 2, y + ph / 2); g.rotate(-0.06 + Math.sin(t * 0.5) * 0.03); g.translate(-pw / 2, -ph / 2);
  g.shadowColor = 'rgba(40,50,90,0.35)'; g.shadowBlur = M * 0.06; g.shadowOffsetY = M * 0.02;
  g.fillStyle = '#c9cfda'; rr(pw * 0.7, -ph * 0.08, pw * 0.12, ph * 0.12, pw * 0.05); g.fill();
  const body = g.createLinearGradient(0, 0, pw, 0); body.addColorStop(0, '#f4f6f9'); body.addColorStop(0.5, '#d5dbe4'); body.addColorStop(1, '#eef1f5');
  g.fillStyle = body; rr(0, 0, pw, ph, pw * 0.22); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = 'rgba(43,54,69,0.35)'; rr(pw * 0.38, ph * 0.05, pw * 0.24, ph * 0.012, 3); g.fill();
  const sx = pw * 0.12, sy = ph * 0.1, sw = pw * 0.76, sh = ph * 0.32;
  const scr = g.createLinearGradient(0, sy, 0, sy + sh); scr.addColorStop(0, '#d6f2fb'); scr.addColorStop(1, '#a8daec');
  g.fillStyle = scr; rr(sx, sy, sw, sh, pw * 0.04); g.fill();
  g.fillStyle = '#17324d'; g.font = `700 ${pw * 0.075}px Menlo, monospace`; g.textAlign = 'left';
  g.fillText('▮▮▮▯', sx + sw * 0.06, sy + sh * 0.13); g.textAlign = 'right'; g.fillText(`${String(10 + Math.floor(t / 60) % 2).padStart(2, '0')}:${String(Math.floor(t) % 60).padStart(2, '0')}`, sx + sw * 0.94, sy + sh * 0.13);
  const n = Math.floor(Math.max(0, t - 2) / 2.2), shown = [n - 2, n - 1, n].filter((i) => i >= 0);
  g.textAlign = 'left'; g.font = `${pw * 0.068}px Menlo, monospace`;
  shown.forEach((i, row) => { const isNew = i === n, a = isNew ? ease(((Math.max(0, t - 2)) % 2.2) / 0.3) : 1; g.globalAlpha = a; g.fillText(`${i % 2 ? '>' : '<'} ${MSGS[i % MSGS.length]}`, sx + sw * 0.06, sy + sh * (0.36 + row * 0.22)); });
  g.globalAlpha = 1;
  if ((Math.max(0, t - 2) % 2.2) < 0.5 && t > 2) { g.fillStyle = 'rgba(255,138,61,0.9)'; g.beginPath(); g.arc(sx + sw * 0.9, sy + sh * 0.88, pw * 0.03, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#c3cad6';
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { rr(pw * (0.17 + c * 0.24), ph * (0.56 + r * 0.095), pw * 0.18, ph * 0.06, pw * 0.05); g.fill(); }
  g.fillStyle = 'rgba(143,208,230,0.9)'; rr(pw * 0.3, ph * 0.47, pw * 0.4, ph * 0.05, pw * 0.05); g.fill();
  g.restore();
}

function frame() {
  const t = performance.now() / 1000;
  let age = t - born; if (age > PERIOD) { li = (li + 1) % LINES.length; born = t; age = 0; }
  const hue = Math.sin(t * 0.1) * 12;
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `hsl(${228 + hue}, 45%, 84%)`); sky.addColorStop(0.55, `hsl(${205 + hue}, 55%, 91%)`); sky.addColorStop(1, '#ffffff');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  const sunX = W * (0.78 + Math.sin(t * 0.15) * 0.05), sunY = H * 0.16;
  const sun = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, M * 0.55);
  sun.addColorStop(0, 'rgba(255,255,255,1)'); sun.addColorStop(0.12, 'rgba(255,250,240,0.85)'); sun.addColorStop(0.4, 'rgba(255,235,220,0.25)'); sun.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, H);
  PEOPLE.forEach((p, i) => { p.x += p.s * 0.016; if (p.x > 1.3) p.x = -0.3; if (p.x < -0.3) p.x = 1.3; const f = figs[i]; g.globalAlpha = 0.35 + p.d * 0.3; g.drawImage(f, p.x * W - f.width / 2, H * 0.98 - f.height + Math.sin(t * 2 + i) * M * 0.005); });
  g.globalAlpha = 1;
  BOKEH.forEach((b) => { b.y -= b.v * 0.016; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); } const x = b.x * W, y = b.y * H, r = b.r * M; const bg = g.createRadialGradient(x, y, 0, x, y, r); bg.addColorStop(0, `rgba(255,255,255,${b.a})`); bg.addColorStop(0.8, `rgba(255,255,255,${b.a * 0.5})`); bg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = bg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
  // flare ghosts along sun > centre axis
  const cx = W / 2, cy = H / 2;
  [[0.4, 0.05, '200,230,255'], [0.7, 0.03, '255,220,200'], [1.2, 0.08, '210,200,255'], [1.6, 0.04, '200,255,240']].forEach(([k, r, col]) => {
    const x = sunX + (cx - sunX) * k, y = sunY + (cy - sunY) * k; g.fillStyle = `rgba(${col},0.22)`; g.beginPath();
    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + 0.3; g.lineTo(x + Math.cos(a) * r * M, y + Math.sin(a) * r * M); } g.closePath(); g.fill();
  });
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, sunY - dpr, W, dpr * 2);
  // tagline
  const [line, sub] = LINES[li], out = 1 - ease((age - (PERIOD - 0.5)) / 0.5);
  const ty = H * 0.3;
  const tw = tracked(line, W / 2, ty, M * 0.075, 0.08, 300, 0.9 * out, (age - 0.2) / 1.2);
  g.fillStyle = `rgba(43,54,69,${0.6 * out})`; const rk = ease((age - 0.6) / 1); g.fillRect(W / 2 - (tw / 2) * rk, ty + M * 0.035, tw * rk, Math.max(1, dpr * 0.8));
  tracked(sub, W / 2, ty + M * 0.085, M * 0.024, 0.5, 400, 0.7 * out, (age - 1) / 1);
  phone(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
