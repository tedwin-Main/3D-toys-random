<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SVG Drawing Tests</title>
<meta name="category" content="generative" />
<meta name="order" content="11" />
<meta name="capture" content="4600" />
<meta name="tags" content="hand-written SVG, path data, inverse kinematics, draw-on animation" />
<meta name="description" content="The classic 'draw it in raw SVG' tests, written by hand as path data with no tools: a pelican riding a bicycle, a game controller, a unicorn and Voltwhisk, an original electric-mouse mascot with a coiled cable tail. Each one sketches itself stroke by stroke, then fills in and comes alive: the pelican really pedals, its legs solved with two-bone inverse kinematics, the wheels spin, the sticks and buttons move and the sparks flicker. Toggle wireframe to see how each shape is built and read the exact source alongside. Tests spatial reasoning in pure coordinates." />
<meta name="prompt" content="Write an SVG drawing showcase in a single HTML file with every illustration hand-written as SVG markup: a pelican riding a bicycle, a game controller, a unicorn and an original cute electric mouse mascot. Animate each drawing so it sketches itself stroke by stroke and then fills in, make the pelican's legs actually follow the pedals and the wheels spin, add a wireframe toggle and show the SVG source next to the drawing with tabs to switch between them." />
<style>

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  header { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 8px 0 0; font-size: 18px; }
  header .sp { flex: 1; }
  .tabs { display: flex; gap: 6px; }
  .tabs button, header > button { height: 32px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: #151925; color: var(--ink); font: 600 12.5px inherit; cursor: pointer; }
  .tabs button.on, header > button.on { background: var(--accent); color: #0b1020; border-color: transparent; }
  main { position: absolute; top: 58px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 380px; }
  #stage { position: relative; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #1a2034, var(--bg) 70%); background-color: var(--bg); overflow: hidden; }
  #stage::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px); background-size: 24px 24px; }
  #art { position: relative; width: min(84%, 74vh); aspect-ratio: 1; }
  #art svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45)); }
  #caption { position: absolute; left: 20px; bottom: 16px; font-size: 13px; color: var(--muted); }
  #caption b { color: var(--ink); }
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside .meta { padding: 12px 16px; font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  pre { margin: 0; padding: 14px 16px; overflow: auto; flex: 1; font: 11px/1.55 ui-monospace, Menlo, monospace; color: #b8c2dc; white-space: pre-wrap; word-break: break-all; }
  pre .t { color: #ff8fb1; } pre .a { color: #8fd3ff; } pre .v { color: #ffd38f; }
  /* sketch phase: every shape becomes a thin outline that draws on */
  svg.sketch * { fill: transparent !important; stroke: var(--accent) !important; stroke-width: 1.4px !important; }
  svg.sketch stop { stop-color: transparent; }
  svg.reveal * { transition: fill 0.7s, stroke 0.7s, stroke-width 0.7s; }
  @media (max-width: 760px) { header { padding: 0 10px; gap: 6px; overflow-x: auto; } header h1 { display: none; } .tabs button, header > button { padding: 0 9px; font-size: 12px; white-space: nowrap; } main { grid-template-columns: 1fr; grid-template-rows: 1fr 150px; } aside { border-left: 0; border-top: 1px solid var(--line); } #art { width: 92%; } }
</style>
</head>

  $('art').innerHTML = ARTS[i].svg; root = $('art').querySelector('svg');
  $('caption').innerHTML = ARTS[i].note;
  document.querySelectorAll('#tabs button').forEach((b, k) => b.classList.toggle('on', k === i));
  const src = ARTS[i].svg;
  $('src').innerHTML = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/(&lt;\/?)([a-zA-Z]+)/g, '$1<span class="t">$2</span>').replace(/([a-z-]+)=("[^"]*")/g, '<span class="a">$1</span>=<span class="v">$2</span>');
  $('lines').textContent = `${src.split('\n').length} lines · hand-written`;
  $('bytes').textContent = `${(new Blob([src]).size / 1024).toFixed(1)} KB`;
  tick(performance.now());
  root.classList.add('sketch');
  const shapes = [...root.querySelectorAll('path, circle, ellipse, rect, line')];
  shapes.forEach((el, k) => {
    let L = 300; try { L = Math.ceil(el.getTotalLength()) || 300; } catch { /* zero-size shape */ }
    el.style.strokeDasharray = `${L} ${L}`; el.style.strokeDashoffset = L;
    el.style.transition = `stroke-dashoffset 0.9s ease ${k * 0.028}s`;
  });
  root.getBoundingClientRect();
  shapes.forEach((el) => (el.style.strokeDashoffset = 0));
  const total = 900 + shapes.length * 28;
  setTimeout(() => {
    if (!root || !root.isConnected || wire) return;
    // restore authored dasharrays (road, stick rings) after the draw-on
    shapes.forEach((el) => { el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; el.style.transition = ''; });
    root.classList.add('reveal'); root.classList.remove('sketch');
  }, total);
}

// Tick: per-drawing animation driven from one rAF
const IK_THIGH = 50, IK_SHIN = 52;
function leg(hip, foot) {
  // two-bone IK: knee from circle-circle intersection, bend forward
  const dx = foot[0] - hip[0], dy = foot[1] - hip[1], d = Math.min(IK_THIGH + IK_SHIN - 0.5, Math.hypot(dx, dy));
  const a = (IK_THIGH ** 2 - IK_SHIN ** 2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, IK_THIGH ** 2 - a * a));
  const ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
  const mx = hip[0] + ux * a, my = hip[1] + uy * a, knee = [mx - uy * h, my + ux * h];
  if (knee[0] < mx) { knee[0] = mx + uy * h; knee[1] = my - ux * h; }
  return `M${hip[0]} ${hip[1]} L${knee[0].toFixed(1)} ${knee[1].toFixed(1)} L${foot[0].toFixed(1)} ${foot[1].toFixed(1)} l8 2 M${foot[0].toFixed(1)} ${foot[1].toFixed(1)} l6 -4`;
}
function tick(now) {
  if (root) {
    const t = (now - shownAt) / 1000, q = (s) => root.querySelector(s);
    if (cur === 0) {
      const a = t * 4.2, bb = [200, 296], r = 24;
      const p1 = [bb[0] + Math.cos(a) * r, bb[1] + Math.sin(a) * r], p2 = [bb[0] - Math.cos(a) * r, bb[1] - Math.sin(a) * r];
      q('#crankArm')?.setAttribute('x2', p1[0]); q('#crankArm')?.setAttribute('y2', p1[1]);
      q('#pedal')?.setAttribute('x', p1[0] - 10); q('#pedal')?.setAttribute('y', p1[1] - 3);
      q('#legF')?.setAttribute('d', leg([196, 196], p1));
      q('#legB')?.setAttribute('d', leg([188, 194], p2));
      const wa = (t * 4.2 * 180 / Math.PI * 0.55) % 360;
      q('#rspokes')?.setAttribute('transform', `rotate(${wa} 118 290)`); q('#fspokes')?.setAttribute('transform', `rotate(${wa} 302 290)`);
      q('#road line')?.setAttribute('stroke-dashoffset', (t * 120) % 40);
    } else if (cur === 1) {
      q('#lstick')?.setAttribute('transform', `translate(${Math.cos(t * 1.7) * 5} ${Math.sin(t * 2.3) * 5})`);
      q('#rstick')?.setAttribute('transform', `translate(${Math.sin(t * 1.3) * 5} ${Math.cos(t * 1.9) * 4})`);
      const b = Math.floor(t * 2.5) % 4;
      root.querySelectorAll('#face circle').forEach((c, k) => { c.setAttribute('transform', k === b ? `translate(0 1.5)` : ''); c.style.filter = k === b ? 'brightness(1.35)' : ''; });
      q('#home')?.setAttribute('opacity', 0.75 + 0.25 * Math.sin(t * 3));
    } else if (cur === 2) {
      root.querySelectorAll('#sparkles path').forEach((p, k) => p.setAttribute('opacity', 0.35 + 0.65 * Math.abs(Math.sin(t * 2 + k * 1.7))));
    } else {
      const flick = Math.random() < 0.18;
      q('#sparks')?.setAttribute('opacity', flick ? 0.2 : 0.6 + 0.4 * Math.sin(t * 9));
    }
  }
  requestAnimationFrame(tick);
}

// Controls + idle rotation
let lastInput = -1e9;
$('tabs').innerHTML = ARTS.map((a) => `<button>${a.short}</button>`).join('');
$('tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; lastInput = performance.now(); wire = false; $('wire').classList.remove('on'); show([...$('tabs').children].indexOf(b)); };
$('redraw').onclick = () => { lastInput = performance.now(); show(cur); };
$('wire').onclick = () => { lastInput = performance.now(); wire = !wire; $('wire').classList.toggle('on', wire); if (wire) { root.classList.remove('reveal'); root.classList.add('sketch'); root.querySelectorAll('*').forEach((el) => { el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; }); } else { root.classList.add('reveal'); root.classList.remove('sketch'); } };
setInterval(() => { if (performance.now() - lastInput > 12000 && !wire) show((cur + 1) % ARTS.length); }, 8000);
show(0);
requestAnimationFrame(tick);
window.__svg = { show, names: ARTS.map((a) => a.name) };
</script>
</body>
