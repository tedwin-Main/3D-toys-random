<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rope Bridge</title>
<meta name="category" content="physics" />
<meta name="order" content="13" />
<meta name="capture" content="5000" />
<meta name="tags" content="Rapier joints, suspension bridge, cut joints, ragdolls, Three.js" />
<meta name="description" content="A suspension bridge over a canyon made only of Rapier rigid bodies and spherical joints: 18 planks hung from two chains, sagging handrail ropes of jointed capsules, crates, boulders and floppy ragdolls dropped on top. Cut the middle and the two halves swing into the cliffs. Tests jointed chains that stay stable under load instead of exploding." />
<meta name="prompt" content="Build a 3D rope bridge over a canyon in a single HTML file with Three.js and Rapier physics. The deck is a chain of wooden planks linked by joints at both edges and anchored to posts on each cliff, with sagging handrail ropes made of jointed segments. Let me drop crates, boulders and ragdolls onto it by clicking, cut the bridge in the middle and rebuild it, with shadows, slow motion and an automatic demo sequence." />
<style>
  :root { --ink: #f6f1e7; --muted: #c3b8a4; --panel: rgba(28, 22, 16, 0.62); --accent: #f0a640; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a9c8e0; color: var(--ink); font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif; }
  canvas { display: block; }
  .title { position: fixed; left: 20px; top: 18px; pointer-events: none; text-shadow: 0 1px 6px #0007; }
  .title h1 { margin: 0; font-size: 20px; } .title p { margin: 4px 0 0; font-size: 12.5px; color: #fff; opacity: 0.85; }
  #panel { position: fixed; left: 16px; bottom: 16px; padding: 10px; border-radius: 14px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); display: grid; grid-template-columns: repeat(3, auto); gap: 6px; }
  #panel button { border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.07); color: var(--ink); border-radius: 9px; padding: 7px 11px; font: 700 12px ui-rounded, system-ui; cursor: pointer; }
  #panel button.on { background: var(--accent); color: #2a1a02; border-color: var(--accent); }
  #stats { position: fixed; right: 16px; top: 16px; font: 12px ui-monospace, Menlo, monospace; color: #fff; text-shadow: 0 1px 4px #0008; text-align: right; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: #fff; pointer-events: none; }
  @media (max-width: 600px) { #stats { top: 66px; left: 20px; right: auto; text-align: left; } #panel { left: 10px; right: 10px; grid-template-columns: repeat(3, 1fr); } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="title"><h1>Rope Bridge</h1><p>Rapier joints · click the bridge to drop a crate</p></div>
<div id="stats"></div>
<div id="loading">loading physics…</div>
<div id="panel">
  <button id="crate">Crate</button><button id="boulder">Boulder</button><button id="dummy">Ragdoll</button>
  <button id="cut">Cut middle</button><button id="rebuild">Rebuild</button><button id="slow">Slow-mo</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import RAPIER from 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js';
await RAPIER.init();
document.getElementById('loading').remove();

// Scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#a9c8e0'); scene.fog = new THREE.Fog('#a9c8e0', 30, 90);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 300);
camera.position.set(-4, 2.2, 15);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -3.2, 0); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.62;
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
if (innerWidth < innerHeight) camera.position.set(-6, 3, 27);
scene.add(new THREE.HemisphereLight('#dfefff', '#5a4632', 1.1));
const sun = new THREE.DirectionalLight('#fff1d6', 2.4); sun.position.set(-8, 16, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 12, bottom: -12, near: 1, far: 50 }); sun.shadow.bias = -0.0004;
scene.add(sun);

// Materials > canvas textures for wood and rock
function canvasTex(w, h, draw, repeat = [1, 1]) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.colorSpace = THREE.SRGBColorSpace; return t; }
const woodTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#9a6a3c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { g.strokeStyle = `rgba(${60 + Math.random() * 40},${36 + Math.random() * 20},16,${0.25 + Math.random() * 0.3})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); const y = Math.random() * h; g.moveTo(0, y); for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 3); g.stroke(); } });
const rockTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#7d6f62'; g.fillRect(0, 0, w, h); for (let i = 0; i < 900; i++) { const v = 80 + Math.random() * 90, r = 2 + Math.random() * 9; g.fillStyle = `rgba(${v},${v * 0.9},${v * 0.8},0.3)`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, r, 0, 7); g.fill(); } for (let i = 0; i < 14; i++) { g.strokeStyle = 'rgba(40,32,26,0.4)'; g.lineWidth = 1.5; g.beginPath(); let x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) g.lineTo(x += (Math.random() - 0.5) * 40, y += Math.random() * 30); g.stroke(); } }, [3, 5]);
const wood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 });
const rock = new THREE.MeshStandardMaterial({ map: rockTex, roughness: 0.95 });
const ropeMat = new THREE.MeshStandardMaterial({ color: '#cdb48a', roughness: 1 });

// Physics world
const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
try { world.integrationParameters.numSolverIterations = 12; } catch { /* older API */ }
function sync(o) { const p = o.body.translation(), q = o.body.rotation(); o.mesh.position.set(p.x, p.y, p.z); o.mesh.quaternion.set(q.x, q.y, q.z, q.w); }

// Canyon > two cliffs, river below
const GAP = 14, CLIFF_W = 14;
for (const s of [-1, 1]) {
  const geo = new THREE.BoxGeometry(CLIFF_W, 40, 24, 20, 40, 10), pos = geo.attributes.position;
  // jagged inner face so the cliffs read as rock, not boxes
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i); if (Math.abs(x - (-s * CLIFF_W / 2)) < 0.01 && y < 19.9) pos.setX(i, x + (-s) * (Math.sin(y * 0.7 + z * 0.5) * 0.6 + Math.sin(y * 2.3 + z * 1.7) * 0.25)); }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, rock); m.position.set(s * (GAP / 2 + CLIFF_W / 2), -20, 0); m.receiveShadow = true; m.castShadow = true; scene.add(m);
  const b = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(s * (GAP / 2 + CLIFF_W / 2), -20, 0));
  world.createCollider(RAPIER.ColliderDesc.cuboid(CLIFF_W / 2, 20, 12).setFriction(0.9), b);
  const grass = new THREE.Mesh(new THREE.BoxGeometry(CLIFF_W, 0.3, 24), new THREE.MeshStandardMaterial({ color: '#6f9a4a', roughness: 1 })); grass.position.set(s * (GAP / 2 + CLIFF_W / 2), 0.1, 0); grass.receiveShadow = true; scene.add(grass);
  // posts
  for (const z of [-0.95, 0.95]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 2.2, 10), wood); post.position.set(s * (GAP / 2 + 0.35), 0.9, z); post.castShadow = true; scene.add(post); }
}
const river = new THREE.Mesh(new THREE.PlaneGeometry(200, 40, 60, 20), new THREE.MeshStandardMaterial({ color: '#3a7fa8', roughness: 0.25, metalness: 0.1 }));
river.rotation.x = -Math.PI / 2; river.position.y = -26; scene.add(river);
const riverFloor = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(0, -27, 0)); world.createCollider(RAPIER.ColliderDesc.cuboid(50, 1, 20), riverFloor);

// Bridge > planks hung on two chains (joint at each edge so the deck can twist)
const N = 18, SLACK = 1.05, SP = GAP * SLACK / N, PL = SP * 0.88, PW = 1.7, SAG = 1.6;
let planks = [], deckJoints = [], ropes = [], ropeJoints = [], anchors = [];
const deckY = (x) => -SAG * (1 - (2 * x / GAP) ** 2);
function buildBridge() {
  for (const o of [...planks, ...ropes.flat()]) { world.removeRigidBody(o.body); scene.remove(o.mesh); }
  for (const a of anchors) world.removeRigidBody(a);
  planks = []; deckJoints = []; ropes = []; ropeJoints = []; anchors = [];
  const anchorL = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(-GAP / 2, 0, 0));
  const anchorR = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(GAP / 2, 0, 0));
  anchors.push(anchorL, anchorR);
  const plankGeo = new THREE.BoxGeometry(PL, 0.09, PW);
  for (let i = 0; i < N; i++) {
    const x = -GAP / 2 + (i + 0.5) * (GAP / N), y = deckY(x), slope = Math.atan(-SAG * -8 * x / (GAP * GAP));
    const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), slope);
    const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, 0).setRotation(q).setLinearDamping(0.15).setAngularDamping(0.4));
    world.createCollider(RAPIER.ColliderDesc.cuboid(PL / 2, 0.045, PW / 2).setDensity(600).setFriction(0.9), body);
    const mesh = new THREE.Mesh(plankGeo, wood); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
    planks.push({ body, mesh });
  }
  const link = (b1, a1, b2, a2) => world.createImpulseJoint(RAPIER.JointData.spherical(a1, a2), b1, b2, true);
  for (const z of [-PW / 2 + 0.08, PW / 2 - 0.08]) {
    deckJoints.push([link(anchorL, { x: 0, y: 0, z }, planks[0].body, { x: -SP / 2, y: 0, z })]);
    for (let i = 0; i < N - 1; i++) deckJoints.push([link(planks[i].body, { x: SP / 2, y: 0, z }, planks[i + 1].body, { x: -SP / 2, y: 0, z }), i]);
    deckJoints.push([link(planks[N - 1].body, { x: SP / 2, y: 0, z }, anchorR, { x: 0, y: 0, z })]);
  }
  // Handrails > jointed capsule ropes between post tops, collide with nothing so they never snag
  const SEG = 24, segL = (GAP + 0.7) * 1.04 / SEG, ropeGeo = new THREE.CylinderGeometry(0.035, 0.035, segL, 6);
  for (const z of [-0.95, 0.95]) {
    const top = 1.9, postL = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(-(GAP / 2 + 0.35), top, z)), postR = world.createRigidBody(RAPIER.RigidBodyDesc.fixed().setTranslation(GAP / 2 + 0.35, top, z));
    anchors.push(postL, postR);
    const rope = [], span = GAP + 0.7;
    for (let i = 0; i < SEG; i++) {
      const x = -span / 2 + (i + 0.5) * (span / SEG), y = top + deckY(x * GAP / span) * 0.95;
      const body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, y, z).setRotation(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2)).setLinearDamping(0.3).setAngularDamping(1));
      world.createCollider(RAPIER.ColliderDesc.capsule(segL / 2, 0.035).setDensity(400).setCollisionGroups(0x00020000), body);
      const mesh = new THREE.Mesh(ropeGeo, ropeMat); mesh.castShadow = true; scene.add(mesh); rope.push({ body, mesh });
    }
    // capsule axis is local Y (rotated onto X), so anchors sit at ±half length on Y
    link(postL, { x: 0, y: 0, z: 0 }, rope[0].body, { x: 0, y: segL / 2, z: 0 });
    const rj = []; for (let i = 0; i < SEG - 1; i++) rj.push(link(rope[i].body, { x: 0, y: -segL / 2, z: 0 }, rope[i + 1].body, { x: 0, y: segL / 2, z: 0 }));
    ropeJoints.push(rj);
    link(rope[SEG - 1].body, { x: 0, y: -segL / 2, z: 0 }, postR, { x: 0, y: 0, z: 0 });
    ropes.push(rope);
  }
}
buildBridge();

// Hangers > visual lines from each plank edge up to the nearest rail segment
const hangerGeo = new THREE.BufferGeometry(); hangerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 2 * 2 * 3), 3));
const hangers = new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({ color: '#d8c39a' })); scene.add(hangers);
function updateHangers() {
  const a = hangerGeo.attributes.position.array; let k = 0;
  const v = new THREE.Vector3();
  for (let r = 0; r < ropes.length; r++) {
    const z = r ? PW / 2 - 0.05 : -PW / 2 + 0.05;
    for (const p of planks) {
      v.set(0, 0.05, z).applyQuaternion(p.mesh.quaternion).add(p.mesh.position);
      let best = null, bd = 1e9; for (const s of ropes[r]) { const d = Math.abs(s.mesh.position.x - v.x); if (d < bd) { bd = d; best = s; } }
      const far = best.mesh.position.distanceTo(v) > 2.6; // cut halves: hide stretched hangers
      a[k++] = v.x; a[k++] = v.y; a[k++] = v.z; a[k++] = far ? v.x : best.mesh.position.x; a[k++] = far ? v.y : best.mesh.position.y; a[k++] = far ? v.z : best.mesh.position.z;
    }
  }
  hangerGeo.attributes.position.needsUpdate = true;
}

// Props > crates, boulders, ragdolls
const crateTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#b8833f'; g.fillRect(0, 0, w, h); g.strokeStyle = '#6e4a1f'; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10); g.beginPath(); g.moveTo(8, 8); g.lineTo(w - 8, h - 8); g.stroke(); for (let i = 0; i < 6; i++) { g.strokeStyle = 'rgba(80,50,20,0.3)'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, i * 22 + 8); g.lineTo(w, i * 22 + 10); g.stroke(); } });
const props = [];
function addProp(body, mesh) { mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh); const o = { body, mesh }; props.push(o); return o; }
function dropCrate(x = (Math.random() - 0.5) * 8, z = (Math.random() - 0.5) * 0.6) {
  const s = 0.5 + Math.random() * 0.3, b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, 6, z).setRotation(new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random(), Math.random(), Math.random()))));
  world.createCollider(RAPIER.ColliderDesc.cuboid(s / 2, s / 2, s / 2).setDensity(500).setFriction(0.7), b);
  addProp(b, new THREE.Mesh(new THREE.BoxGeometry(s, s, s), new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.8 })));
}
function dropBoulder(x = (Math.random() - 0.5) * 6) {
  const r = 0.6, b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x, 8, 0));
  world.createCollider(RAPIER.ColliderDesc.ball(r).setDensity(600).setFriction(0.8).setRestitution(0.1), b);
  const g = new THREE.IcosahedronGeometry(r, 2), p = g.attributes.position; for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i); v.multiplyScalar(1 + (Math.sin(v.x * 7) * Math.cos(v.y * 5) * 0.08)); p.setXYZ(i, v.x, v.y, v.z); } g.computeVertexNormals();
  addProp(b, new THREE.Mesh(g, rock));
}
function dropRagdoll(x = (Math.random() - 0.5) * 6) {
  const col = new THREE.Color().setHSL(Math.random(), 0.7, 0.55), mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.6 });
  const part = (hx, hy, hz, px, py) => { const b = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(x + px, 5 + py, 0).setAngularDamping(0.6)); world.createCollider(RAPIER.ColliderDesc.cuboid(hx, hy, hz).setDensity(600).setFriction(0.8), b); addProp(b, new THREE.Mesh(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), mat)); return b; };
  const torso = part(0.22, 0.32, 0.13, 0, 0), head = part(0.14, 0.14, 0.14, 0, 0.52);
  const la = part(0.07, 0.26, 0.07, -0.32, 0.02), ra = part(0.07, 0.26, 0.07, 0.32, 0.02), ll = part(0.09, 0.32, 0.09, -0.12, -0.66), rl = part(0.09, 0.32, 0.09, 0.12, -0.66);
  const j = (a, aa, b, ba) => world.createImpulseJoint(RAPIER.JointData.spherical(aa, ba), a, b, true);
  j(torso, { x: 0, y: 0.34, z: 0 }, head, { x: 0, y: -0.16, z: 0 });
  j(torso, { x: -0.24, y: 0.26, z: 0 }, la, { x: 0, y: 0.24, z: 0 }); j(torso, { x: 0.24, y: 0.26, z: 0 }, ra, { x: 0, y: 0.24, z: 0 });
  j(torso, { x: -0.12, y: -0.32, z: 0 }, ll, { x: 0, y: 0.32, z: 0 }); j(torso, { x: 0.12, y: -0.32, z: 0 }, rl, { x: 0, y: 0.32, z: 0 });
}
function cutMiddle() {
  // remove the joints joining the two middle planks on both chains
  const mid = (N >> 1) - 1;
  for (const [jt, i] of deckJoints) if (i === mid && world.getImpulseJoint(jt.handle)) world.removeImpulseJoint(jt, true);
  const p = planks[mid].mesh.position; for (let k = 0; k < 20; k++) sparks.push({ p: p.clone().add(new THREE.Vector3(SP / 2, 0, (Math.random() - 0.5) * PW)), v: new THREE.Vector3((Math.random() - 0.5) * 4, Math.random() * 4, (Math.random() - 0.5) * 4), t: 0.8 });
  for (const rj of ropeJoints) { const jt = rj[rj.length >> 1]; if (world.getImpulseJoint(jt.handle)) world.removeImpulseJoint(jt, true); }
}
const sparks = [], sparkMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.05, 0.05), new THREE.MeshBasicMaterial({ color: '#e8cf9a' }), 60); scene.add(sparkMesh);

// Input
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null, idle = 0, slow = false;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  idle = 0; demo = false;
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(planks.map((p) => p.mesh))[0];
  if (hit) dropCrate(hit.point.x, Math.max(-0.6, Math.min(0.6, hit.point.z)));
});
const btn = (id, fn) => (document.getElementById(id).onclick = () => { idle = 0; demo = false; fn(); });
btn('crate', () => dropCrate()); btn('boulder', () => dropBoulder()); btn('dummy', () => dropRagdoll()); btn('cut', cutMiddle);
function rebuild() { for (const o of props) { world.removeRigidBody(o.body); scene.remove(o.mesh); } props.length = 0; buildBridge(); }
btn('rebuild', rebuild);
btn('slow', () => { slow = !slow; document.getElementById('slow').classList.toggle('on', slow); });

// Demo > timeline loop: drops, a boulder, cut, rebuild
let demo = true, demoT = 0;
const TIMELINE = [[0.6, () => dropCrate(-2)], [1.6, () => dropRagdoll(1)], [3, () => dropCrate(3)], [4.2, () => dropCrate(-4)], [6, () => dropBoulder(0)], [8.5, () => dropRagdoll(-2)], [10, () => dropCrate(2)], [13, cutMiddle], [22, rebuild]];
let tlIdx = 0;

const clock = new THREE.Clock(); let acc = 0;
world.timestep = 1 / 120;
function frame() {
  const dt = Math.min(0.05, clock.getDelta()); idle += dt;
  if (!demo && idle > 30) { demo = true; demoT = 0; tlIdx = 0; }
  if (demo) {
    demoT += dt;
    while (tlIdx < TIMELINE.length && demoT > TIMELINE[tlIdx][0]) TIMELINE[tlIdx++][1]();
    if (tlIdx === TIMELINE.length && demoT > 23) { demoT = 0; tlIdx = 0; }
  }
  // 120 Hz substeps keep long joint chains stiff
  acc += dt * (slow ? 0.25 : 1);
  let n = 0; while (acc >= 1 / 120 && n++ < 8) { world.step(); acc -= 1 / 120; }
  for (const o of [...planks, ...ropes.flat(), ...props]) sync(o);
  // forget props that fell into the river
  for (let i = props.length - 1; i >= 0; i--) if (props[i].body.translation().y < -24) { world.removeRigidBody(props[i].body); scene.remove(props[i].mesh); props.splice(i, 1); }
  updateHangers();
  const m4 = new THREE.Matrix4(); let si = 0;
  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.t -= dt; s.v.y -= 9.8 * dt; s.p.addScaledVector(s.v, dt); if (s.t <= 0) sparks.splice(i, 1); }
  for (const s of sparks) if (si < 60) sparkMesh.setMatrixAt(si++, m4.makeTranslation(s.p.x, s.p.y, s.p.z));
  sparkMesh.count = si; sparkMesh.instanceMatrix.needsUpdate = true;
  river.position.x = Math.sin(clock.elapsedTime * 0.2) * 0.3;
  controls.update();
  renderer.render(scene, camera);
  document.getElementById('stats').textContent = `${world.bodies.len()} bodies · ${world.impulseJoints.len()} joints${slow ? ' · slow-mo' : ''}${demo ? ' · demo' : ''}`;
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
