<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bubble Meadow</title>
<meta name="category" content="aero" />
<meta name="style" content="eco" />
<meta name="order" content="3" />
<meta name="capture" content="4500" />
<meta name="tags" content="Frutiger Aero, three.js, thin-film shader, GLSL, instanced grass" />
<meta name="description" content="The classic late-2000s stock wallpaper as a live 3D scene: rolling green hills under a deep blue sky, a mirror lake, 40,000 wind-swept grass blades and iridescent soap bubbles drifting past a lens-flared sun. Bubbles use a thin-film interference plus Fresnel shader, so their colour bands swirl as the film thins. Click a bubble to pop it, or click anywhere else to blow a new cluster. Hard because every surface is a custom shader (sky, water, grass sway, bubble film) and it still has to hit 60 fps on a phone." />
<meta name="prompt" content="Build the classic Frutiger Aero wallpaper as a three.js scene in one HTML file: rolling grass hills, a deep-blue-to-white sky with soft clouds, a reflective lake, wind-swept instanced grass and floating iridescent soap bubbles with a thin-film interference + Fresnel shader. Add a lens flare from the sun, a few butterflies, a slow drifting camera, click-to-pop bubbles with a synthesized pop, and click-to-blow new bubbles." />
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; touch-action: none; }
canvas { display: block; }
#flare { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen; }
.fl { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
#hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); color: #fff; font: 13px "Segoe UI", "Helvetica Neue", system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 40, 80, 0.7); padding: 6px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.45); white-space: nowrap; }
@media (max-width: 700px) { #hint { font-size: 11px; white-space: normal; width: 88vw; text-align: center; } }
</style>
</head>
<body>
<div id="flare"></div>
<div id="hint">click a bubble to pop it · click the meadow to blow more · drag to look</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';

const mobile = innerWidth < 700;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
// no tone mapping: shader colours are authored as final screen colours, ACES greyed the sky
renderer.toneMapping = THREE.NoToneMapping;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const HORIZON = new THREE.Color('#d4f0ff');
scene.fog = new THREE.Fog(HORIZON, 110, 420);
const camera = new THREE.PerspectiveCamera(mobile ? 62 : 50, innerWidth / innerHeight, 0.1, 800);
const SUN = new THREE.Vector3(0.45, 0.32, -0.83).normalize();
const U = { time: { value: 0 }, sun: { value: SUN }, horizon: { value: HORIZON }, camPos: { value: camera.position } };

// Sky > gradient dome + sun glow + soft fbm clouds
const SKY_FN = `
  vec3 skyCol(vec3 d, vec3 sun, float t) {
    float h = clamp(d.y, -0.1, 1.0);
    vec3 col = mix(vec3(0.83, 0.94, 1.0), vec3(0.0, 0.3, 0.86), pow(max(h, 0.0), 0.55));
    float s = max(dot(d, sun), 0.0);
    col += vec3(1.0, 0.95, 0.8) * (pow(s, 600.0) * 6.0 + pow(s, 12.0) * 0.35);
    return col;
  }`;
const NOISE = `
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
  float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; } return v; }`;
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: U,
  vertexShader: `varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 sun; uniform float time; varying vec3 vD; ${SKY_FN} ${NOISE}
    void main() { vec3 d = normalize(vD); vec3 col = skyCol(d, sun, time);
      if (d.y > 0.0) { vec2 uv = d.xz / (d.y + 0.15) * 1.6 + vec2(time * 0.012, 0.0);
        float c = smoothstep(0.52, 0.8, fbm(uv)) * smoothstep(0.0, 0.25, d.y);
        col = mix(col, vec3(1.0), c * 0.9); }
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
     
    }`,
}));
scene.add(sky);

// Terrain > rolling hills, lake basin carved in front of the camera
const LAKE = new THREE.Vector2(-4, -34), LAKE_R = 30;
function height(x, z) {
  let h = 3.2 * Math.sin(x * 0.021 + 0.4) * Math.cos(z * 0.027) + 2.2 * Math.sin(x * 0.047 + 1.3) * Math.sin(z * 0.041 + 0.7) + 0.7 * Math.sin(x * 0.13) * Math.cos(z * 0.11);
  h += 2.5 + Math.max(0, -z - 60) * 0.12;
  const d = Math.hypot(x - LAKE.x, (z - LAKE.y) * 1.4) / LAKE_R;
  if (d < 1.6) h -= 7 * Math.pow(Math.max(0, 1 - d / 1.6), 1.4);
  return h;
}
const tg = new THREE.PlaneGeometry(420, 420, 180, 180);
tg.rotateX(-Math.PI / 2);
const tp = tg.attributes.position, tcol = [];
const cLow = new THREE.Color('#3f9e2c'), cHigh = new THREE.Color('#9be35a'), cSand = new THREE.Color('#d9d2a0'), tmpC = new THREE.Color();
for (let i = 0; i < tp.count; i++) {
  const x = tp.getX(i), z = tp.getZ(i), y = height(x, z);
  tp.setY(i, y);
  tmpC.copy(cLow).lerp(cHigh, THREE.MathUtils.clamp((y - 1) / 9, 0, 1));
  if (y < 0.9) tmpC.lerp(cSand, THREE.MathUtils.clamp((0.9 - y) / 1.2, 0, 1));
  tcol.push(tmpC.r, tmpC.g, tmpC.b);
}
tg.setAttribute('color', new THREE.Float32BufferAttribute(tcol, 3));
tg.computeVertexNormals();
scene.add(new THREE.Mesh(tg, new THREE.MeshLambertMaterial({ vertexColors: true })));
scene.add(new THREE.HemisphereLight('#cfeeff', '#4c8a2a', 1.4));
const sunL = new THREE.DirectionalLight('#fff6e0', 2.2); sunL.position.copy(SUN).multiplyScalar(100); scene.add(sunL);

// Water > fresnel mirror of the sky, wave normals, sun glints
const water = new THREE.Mesh(new THREE.PlaneGeometry(160, 120).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  transparent: true, uniforms: U,
  vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 sun; uniform float time; uniform vec3 camPos; uniform vec3 horizon; varying vec3 vW; ${SKY_FN} ${NOISE}
    void main() {
      vec2 p = vW.xz; float t = time;
      vec3 n = normalize(vec3(fbm(p * 0.25 + vec2(t * 0.06, 0.0)) - 0.5 + 0.03 * sin(p.x * 2.3 + p.y * 1.7 + t * 2.0), 3.0, fbm(p * 0.25 + vec2(5.2, 1.3) - vec2(0.0, t * 0.05)) - 0.5 + 0.03 * cos(p.y * 2.9 - p.x * 1.1 + t * 1.7)));
      vec3 v = normalize(vW - camPos); vec3 r = reflect(v, n); r.y = abs(r.y);
      float fr = 0.08 + 0.92 * pow(1.0 - max(dot(-v, n), 0.0), 4.0);
      vec3 deep = vec3(0.02, 0.32, 0.45);
      vec3 col = mix(deep, skyCol(r, sun, t), fr);
      col += vec3(1.0, 0.95, 0.85) * pow(max(dot(r, sun), 0.0), 900.0) * 8.0;
      float dist = length(vW - camPos); col = mix(col, horizon, smoothstep(110.0, 420.0, dist));
      gl_FragColor = vec4(col, 0.94);
      #include <tonemapping_fragment>
     
    }`,
}));
water.position.set(LAKE.x, 0.15, LAKE.y);
scene.add(water);

// Grass > one merged geometry of blades; sway in the vertex shader
const BLADES = mobile ? 18000 : 40000;
const gPos = new Float32Array(BLADES * 9), gTip = new Float32Array(BLADES * 3), gPh = new Float32Array(BLADES * 3), gShade = new Float32Array(BLADES * 3);
let placed = 0;
for (let tries = 0; placed < BLADES && tries < BLADES * 4; tries++) {
  // denser near the camera: square the random depth
  const z = 30 - Math.pow(Math.random(), 1.7) * 150, x = (Math.random() - 0.5) * (70 + (30 - z) * 1.3);
  const y = height(x, z);
  if (y < 0.7) continue;
  const a = Math.random() * Math.PI, w = 0.06 + Math.random() * 0.06, hgt = 0.5 + Math.random() * 0.7, lean = (Math.random() - 0.5) * 0.3;
  const cx = Math.cos(a) * w, cz = Math.sin(a) * w, o = placed * 9, ph = Math.random() * 6.28, sh = Math.random();
  gPos.set([x - cx, y, z - cz, x + cx, y, z + cz, x + lean, y + hgt, z + lean], o);
  gTip.set([0, 0, 1], placed * 3);
  gPh.fill(ph, placed * 3, placed * 3 + 3); gShade.fill(sh, placed * 3, placed * 3 + 3);
  placed++;
}
const gg = new THREE.BufferGeometry();
gg.setAttribute('position', new THREE.BufferAttribute(gPos.subarray(0, placed * 9), 3));
gg.setAttribute('tip', new THREE.BufferAttribute(gTip.subarray(0, placed * 3), 1));
gg.setAttribute('phase', new THREE.BufferAttribute(gPh.subarray(0, placed * 3), 1));
gg.setAttribute('shade', new THREE.BufferAttribute(gShade.subarray(0, placed * 3), 1));
scene.add(new THREE.Mesh(gg, new THREE.ShaderMaterial({
  side: THREE.DoubleSide, uniforms: U,
  vertexShader: `attribute float tip; attribute float phase; attribute float shade; uniform float time; varying float vTip; varying float vShade; varying float vDist;
    void main() { vec3 p = position; float gust = 0.6 + 0.4 * sin(time * 0.6 + p.x * 0.05 + p.z * 0.03);
      p.x += sin(time * 1.8 + phase + p.x * 0.2) * 0.22 * tip * gust; p.z += cos(time * 1.3 + phase) * 0.12 * tip * gust;
      vTip = tip; vShade = shade; vec4 mv = modelViewMatrix * vec4(p, 1.0); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform vec3 horizon; varying float vTip; varying float vShade; varying float vDist;
    void main() { vec3 base = mix(vec3(0.16, 0.45, 0.1), vec3(0.25, 0.55, 0.12), vShade);
      vec3 tipC = mix(vec3(0.42, 0.82, 0.2), vec3(0.62, 0.92, 0.3), vShade);
      vec3 col = mix(base, tipC, vTip); col = mix(col, horizon, smoothstep(110.0, 420.0, vDist));
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      }`,
})));

// Flowers > tiny white + yellow points sprinkled through the grass
const FL = mobile ? 600 : 1500, fPos = [], fCol = [];
for (let i = 0; i < FL; i++) { const z = 28 - Math.random() * 110, x = (Math.random() - 0.5) * 120, y = height(x, z); if (y < 0.8) continue; fPos.push(x, y + 0.35, z); const c = Math.random() < 0.6 ? [1, 1, 1] : [1, 0.86, 0.2]; fCol.push(...c); }
const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3)); fg.setAttribute('color', new THREE.Float32BufferAttribute(fCol, 3));
scene.add(new THREE.Points(fg, new THREE.PointsMaterial({ size: 0.22, vertexColors: true })));

// Bubbles > thin-film interference: film thickness drifts, hue follows optical path length
const bubbleMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, uniforms: U,
  vertexShader: `varying vec3 vN; varying vec3 vW; varying vec3 vL; void main() { vN = normalize(mat3(modelMatrix) * normal); vL = position; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 sun; uniform float time; uniform vec3 camPos; varying vec3 vN; varying vec3 vW; varying vec3 vL; ${SKY_FN} ${NOISE}
    void main() {
      vec3 n = normalize(vN), v = normalize(camPos - vW); if (dot(n, v) < 0.0) n = -n;
      float c = max(dot(n, v), 0.0), fr = pow(1.0 - c, 2.5);
      // film: thinner on top (gravity drain), swirling noise
      float th = 0.35 + 0.45 * fbm(vL.xy * 1.8 + vec2(time * 0.15, -time * 0.1) + vL.z) + 0.25 * (vL.y * -0.5 + 0.5);
      float path = th * (2.0 + 1.5 * c);
      vec3 film = 0.5 + 0.5 * cos(6.2832 * (path * 1.6 + vec3(0.0, 0.33, 0.67)));
      vec3 r = reflect(-v, n);
      vec3 env = skyCol(r, sun, time);
      if (r.y < 0.0) env = mix(vec3(0.35, 0.6, 0.25), vec3(0.8, 0.9, 1.0), exp(r.y * 3.0));
      vec3 col = env * film * 1.25;
      float spec = pow(max(dot(r, sun), 0.0), 220.0) * 3.0 + pow(max(dot(r, normalize(vec3(-0.6, 0.7, 0.4))), 0.0), 60.0) * 0.6;
      col += spec;
      float a = clamp(0.06 + fr * 0.85 + spec, 0.0, 1.0);
      gl_FragColor = vec4(col, a);
      #include <tonemapping_fragment>
     
    }`,
});
const bubbleGeo = new THREE.IcosahedronGeometry(1, 5);
const bubbles = [];
function spawn(at, n = 1) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(bubbleGeo, bubbleMat);
    const r = 0.35 + Math.random() * (mobile ? 0.9 : 1.2);
    m.scale.setScalar(r);
    if (at) m.position.copy(at).add(new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 1.5, (Math.random() - 0.5) * 2));
    else m.position.set((Math.random() - 0.5) * 36, 0.5 + Math.random() * 12, -16 + Math.random() * 38);
    m.userData = { r, v: new THREE.Vector3((Math.random() - 0.3) * 0.6, 0.25 + Math.random() * 0.35, (Math.random() - 0.5) * 0.4), ph: Math.random() * 6.28, life: 14 + Math.random() * 16, age: at ? 0 : Math.random() * 10, grow: at ? 0 : 1 };
    scene.add(m); bubbles.push(m);
  }
}
spawn(null, mobile ? 22 : 34);

// Bubbles > pop: spray of droplets + synth pop
const drops = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ size: 0.12, color: '#ffffff', transparent: true, opacity: 0.9, depthWrite: false }));
scene.add(drops);
let dropList = [];
function pop(m) {
  scene.remove(m); bubbles.splice(bubbles.indexOf(m), 1);
  for (let i = 0; i < 24; i++) { const d = new THREE.Vector3().randomDirection(); dropList.push({ p: m.position.clone().addScaledVector(d, m.userData.r), v: d.multiplyScalar(3 + Math.random() * 3), life: 0.5 + Math.random() * 0.4 }); }
  popSound(m.userData.r);
}
let ac = null;
addEventListener('pointerdown', () => { if (!ac) try { ac = new AudioContext(); } catch {} }, { once: true });
function popSound(r) {
  if (!ac) return;
  const t = ac.currentTime, len = Math.floor(ac.sampleRate * 0.06), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(); src.buffer = buf; hp.type = 'bandpass'; hp.frequency.value = 2400 / r; hp.Q.value = 1.2; g.gain.value = 0.5;
  src.connect(hp).connect(g).connect(ac.destination); src.start(t);
  const o = ac.createOscillator(), og = ac.createGain(); o.frequency.setValueAtTime(900 / r, t); o.frequency.exponentialRampToValueAtTime(200 / r, t + 0.08);
  og.gain.setValueAtTime(0.12, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.1); o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 0.12);
}

// Butterflies > two flapping wing quads on a lissajous path
const flies = [];
const wingGeo = new THREE.PlaneGeometry(0.5, 0.36).translate(0.25, 0, 0);
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color: ['#ffb703', '#ff70a6', '#70d6ff', '#ffffff', '#ff9f1c', '#c77dff'][i], side: THREE.DoubleSide });
  const L = new THREE.Mesh(wingGeo, mat), R = new THREE.Mesh(wingGeo, mat); R.scale.x = -1;
  g.add(L, R); g.userData = { L, R, a: 2 + Math.random() * 6, b: 1 + Math.random() * 2, c: (Math.random() - 0.5) * 20, d: -Math.random() * 20, ph: Math.random() * 6.28 };
  scene.add(g); flies.push(g);
}

// Lens flare > DOM ghosts along the sun-to-centre line
const FLARES = [[0, 260, 'radial-gradient(circle, rgba(255,250,220,0.55), rgba(255,240,200,0) 60%)'], [0.35, 60, 'radial-gradient(circle, rgba(140,255,200,0.25), rgba(140,255,200,0) 70%)'], [0.6, 26, 'rgba(255,220,140,0.22)'], [0.85, 90, 'radial-gradient(circle, rgba(120,200,255,0) 55%, rgba(120,200,255,0.25) 62%, rgba(120,200,255,0) 70%)'], [1.25, 40, 'rgba(200,160,255,0.18)'], [1.6, 140, 'radial-gradient(circle, rgba(255,180,120,0.18), rgba(255,180,120,0) 70%)']];
const flareEls = FLARES.map(([, s, bg]) => { const e = document.createElement('div'); e.className = 'fl'; e.style.width = e.style.height = s + 'px'; e.style.background = bg; document.getElementById('flare').append(e); return e; });
const sunScreen = new THREE.Vector3();
function updateFlare() {
  sunScreen.copy(camera.position).addScaledVector(SUN, 500).project(camera);
  const vis = sunScreen.z < 1 && Math.abs(sunScreen.x) < 1.3 && Math.abs(sunScreen.y) < 1.3 ? 1 - Math.max(Math.abs(sunScreen.x), Math.abs(sunScreen.y)) / 1.3 : 0;
  const sx = (sunScreen.x * 0.5 + 0.5) * innerWidth, sy = (-sunScreen.y * 0.5 + 0.5) * innerHeight, cx = innerWidth / 2, cy = innerHeight / 2;
  FLARES.forEach(([k], i) => { const e = flareEls[i]; e.style.left = sx + (cx - sx) * k + 'px'; e.style.top = sy + (cy - sy) * k + 'px'; e.style.opacity = vis; });
}

// Camera > slow drift + drag to look + pointer parallax
let yaw = 0, pitch = 0, dragging = false, px = 0, py = 0, lastInput = -1e9, downAt = null;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { dragging = true; px = e.clientX; py = e.clientY; downAt = [e.clientX, e.clientY]; lastInput = performance.now(); });
addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - px) * 0.004; pitch = THREE.MathUtils.clamp(pitch - (e.clientY - py) * 0.003, -0.35, 0.4);
  px = e.clientX; py = e.clientY; lastInput = performance.now();
});
addEventListener('pointerup', (e) => {
  dragging = false;
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(bubbles, false)[0];
  if (hit) pop(hit.object);
  else spawn(ray.ray.at(10 + Math.random() * 6, new THREE.Vector3()), 6);
});

// Run engine > physics for bubbles, flies, drops, camera
const clock = new THREE.Clock();
let autoPop = 0, autoBlow = 0;
const look = new THREE.Vector3();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  U.time.value = t;
  const idle = performance.now() - lastInput > 6000;
  if (idle) { yaw += (Math.sin(t * 0.07) * 0.25 - yaw) * dt * 0.5; pitch += (0.02 - pitch) * dt * 0.5; }
  const r = 30;
  const cx = Math.sin(t * 0.05) * 6, cz = r + Math.cos(t * 0.05) * 2;
  // ride above the hill under the camera, else grass fills the lens
  camera.position.set(cx, height(cx, cz) + 4.2 + Math.sin(t * 0.13) * 0.5, cz);
  look.set(camera.position.x + Math.sin(yaw) * -40, camera.position.y + Math.tan(pitch) * 40 - 5, camera.position.z - Math.cos(yaw) * 40);
  camera.lookAt(look);
  sky.position.copy(camera.position);

  for (const m of [...bubbles]) {
    const u = m.userData; u.age += dt;
    u.grow = Math.min(1, u.grow + dt * 1.5);
    m.position.addScaledVector(u.v, dt);
    m.position.x += Math.sin(t * 0.7 + u.ph) * dt * 0.4; m.position.z += Math.cos(t * 0.5 + u.ph) * dt * 0.3;
    // wobble: film surface tension, squash along a slow axis
    const w = 1 + Math.sin(t * 3 + u.ph) * 0.03;
    m.scale.set(u.r * u.grow * w, u.r * u.grow / w, u.r * u.grow * w);
    m.rotation.y += dt * 0.2;
    if (u.age > u.life || m.position.y > 26) pop(m);
  }
  const want = mobile ? 22 : 34;
  if (bubbles.length < want && Math.random() < dt * 2) spawn(null, 1);
  // attract: occasional pop and wand puff so the poster moves
  if (idle) {
    autoPop += dt; autoBlow += dt;
    if (autoPop > 2.2 && bubbles.length) { autoPop = 0; pop(bubbles[Math.floor(Math.random() * bubbles.length)]); }
    if (autoBlow > 7) { autoBlow = 0; spawn(new THREE.Vector3(-8 + Math.random() * 16, 2, 8), 7); }
  }

  dropList = dropList.filter((d) => (d.life -= dt) > 0);
  const dp = new Float32Array(dropList.length * 3);
  dropList.forEach((d, i) => { d.v.y -= 9 * dt; d.p.addScaledVector(d.v, dt); dp.set([d.p.x, d.p.y, d.p.z], i * 3); });
  drops.geometry.setAttribute('position', new THREE.BufferAttribute(dp, 3));

  for (const f of flies) {
    const u = f.userData, k = t * 0.3 + u.ph;
    f.position.set(u.c + Math.sin(k * 1.3) * u.a, 2 + Math.sin(k * 2.1) * u.b + 1.5, u.d + 8 + Math.cos(k) * u.a);
    f.rotation.y = Math.atan2(Math.cos(k * 1.3) * 1.3, -Math.sin(k));
    const flap = Math.sin(t * 18 + u.ph) * 1.1; u.L.rotation.y = flap; u.R.rotation.y = -flap;
  }

  renderer.render(scene, camera);
  updateFlare();
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(frame);
window.__meadow = { spawn: (n = 6) => spawn(new THREE.Vector3(0, 3, 10), n), popAll: () => [...bubbles].forEach(pop), bubbles };
</script>
</body>
