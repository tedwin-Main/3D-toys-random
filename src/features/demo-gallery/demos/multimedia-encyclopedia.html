<meta name="description" content="A 1995 CD-ROM encyclopedia called Compendia: a spinning globe in the header, chunky toolbar buttons, an A to Z index with a find box, and cream article pages full of blue hyperlinks. Articles carry low-res video clips you can play, pause and scrub (planets on their orbits, a volcano throwing lava bombs, aurora curtains, a comet whose tail always points away from the Sun), still pictures and synthesized sound clips: a humpback whale song, a piano scale, an old telephone bell, Apollo radio beeps, a volcanic rumble. There is a media gallery, a timeline from the Great Pyramid to Halley's Comet, a quiz that links back to the article with the answer, full-text search with highlighted snippets, back and forward history, and a disc that spins while the page loads. Hard because every clip, picture and sound is generated live and the whole encyclopedia is one linked, searchable data set."/>
<meta name="prompt" content="Build a mid-90s CD-ROM multimedia encyclopedia in one HTML file with an original name and look: header with a spinning canvas globe, toolbar (Contents, Index, Gallery, Timeline, Quiz, Back, Forward), A-Z index sidebar with a find box, articles with hyperlinks between them, low-res canvas video clips with play, pause and seek (planet orbits, volcano eruption, aurora, comet), still pictures drawn on canvas and synthesized audio clips (whale song, piano scale, telephone bell, radio beeps, rumble), a media gallery, a clickable timeline, a multiple-choice quiz that links to the article with the answer, full-text search with highlighted snippets, history, and a spinning-disc loading overlay. Attract mode browses on its own; works at phone width with the index as a drawer." />
<style>

#app { position: absolute; left: 50%; top: 50%; width: min(1120px, calc(100vw - 32px)); height: min(720px, calc(100vh - 32px)); transform: translate(-50%, -50%); display: grid; grid-template-rows: auto auto 1fr auto; border: 2px solid; border-color: #9ab4dc #2a3a5a #2a3a5a #9ab4dc; background: #12224a; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }

#load i { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle, #fbf8ef 0 8px, #aab 9px 12px, transparent 13px), conic-gradient(#e6f0ff, #b0c4ff, #ffd0f0, #c0ffe8, #fff2b0, #e6f0ff); box-shadow: 0 0 0 2px #889, 0 4px 10px rgba(0, 0, 0, 0.25); animation: rot 0.4s linear infinite; }

}

<script>
const $ = (s) => document.querySelector(s);
const capture = new URLSearchParams(location.search).has('capture');
const wait = (s) => new Promise((r) => setTimeout(r, s * 1000));
const rnd = ((a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(1995);
const STARS = Array.from({ length: 70 }, () => [rnd() * 200, rnd() * 130, rnd()]);

// Articles > the whole disc
const A = [
  { id: 'solar', t: 'Solar System', cat: 'Astronomy', vid: 'orbit', cap: 'Video: the planets on their orbits. Inner planets race around the Sun; the outer ones crawl.', body: ['The Solar System is the Sun and everything bound to it by gravity: eight planets, their moons, dwarf planets such as Pluto, and countless asteroids and [[comet|comets]]. It formed about 4.6 billion years ago from a collapsing cloud of gas and dust.', 'The four inner planets, Mercury, Venus, Earth and Mars, are small and rocky. The four outer planets are giants: [[jupiter|Jupiter]] and Saturn are made mostly of hydrogen and helium, while Uranus and Neptune hold more ice. Mercury\'s year lasts just 88 days, while Neptune takes 165 Earth years to go around once.', 'Charged particles streaming from the Sun reach Earth and light up the polar sky as the [[aurora]].'], see: ['jupiter', 'comet', 'moon'] },
  { id: 'jupiter', t: 'Jupiter', cat: 'Astronomy', pic: 'jupiter', ev: [1610, 'Galileo spots four moons of Jupiter'], cap: 'Picture: Jupiter\'s cloud bands and the Great Red Spot.', body: ['Jupiter is the fifth planet from the Sun and the largest in the [[solar|Solar System]], more than twice as massive as all the other planets put together. It is a gas giant wrapped in bands of cloud.', 'The Great Red Spot is a storm wider than Earth that has been raging for at least 300 years. Jupiter has dozens of moons; the four largest, Io, Europa, Ganymede and Callisto, were discovered by Galileo Galilei in 1610. Io is the most volcanic body known, with eruptions far larger than any [[volcano]] on Earth.'], see: ['solar', 'volcano'] },
  { id: 'comet', t: 'Comet', cat: 'Astronomy', vid: 'comet', ev: [1986, 'Halley\'s Comet returns'], cap: 'Video: a comet on its stretched orbit. The tail grows near the Sun and always points away from it.', body: ['A comet is a small icy body, often described as a dirty snowball, that travels around the Sun on a long, stretched orbit. Far from the Sun it is frozen and dark.', 'As it swings closer, sunlight warms the ice, which turns straight into gas and carries dust with it. This forms a glowing head called the coma and tails that can stretch for millions of kilometres. The tails always point away from the Sun, pushed by sunlight and the solar wind.', 'Halley\'s Comet returns about every 76 years. It was last seen from Earth in 1986 and will be back in 2061.'], see: ['solar', 'jupiter'] },
  { id: 'moon', t: 'Moon Landing', cat: 'History', snd: ['beep', 'Apollo radio beeps', 7], ev: [1969, 'Apollo 11 lands on the Moon'], body: ['On 20 July 1969 the Apollo 11 lunar module landed on the Moon. Neil Armstrong and Buzz Aldrin became the first people to walk on its surface, while Michael Collins orbited above in the command module.', 'Radio messages between the astronauts and Mission Control were marked by short beeps that told each side when the other had finished talking. Six Apollo missions landed between 1969 and 1972, bringing back 382 kilograms of Moon rock.'], see: ['solar', 'telephone'] },
  { id: 'aurora', t: 'Aurora', cat: 'Earth Science', vid: 'aurora', cap: 'Video: aurora curtains rippling over a northern forest.', body: ['An aurora is a natural display of light in the sky near the poles: the aurora borealis in the north and the aurora australis in the south.', 'It happens when charged particles from the Sun, carried by the solar wind, are steered by Earth\'s magnetic field toward the poles. They strike oxygen and nitrogen high in the atmosphere, which then glow. Oxygen gives the common green and the rarer red; nitrogen gives blue and purple.', 'Auroras are brightest when the Sun is most active, so they follow the roughly 11-year cycle of sunspots. See also the [[solar|Solar System]].'], see: ['solar', 'comet'] },
  { id: 'volcano', t: 'Volcano', cat: 'Earth Science', vid: 'volcano', snd: ['rumble', 'Volcanic rumble', 5], ev: [1980, 'Mount St. Helens erupts'], cap: 'Video: an eruption throwing out lava bombs and ash.', body: ['A volcano is an opening in Earth\'s crust where molten rock, gas and ash escape from below. Molten rock is called magma while it is underground and lava once it reaches the surface.', 'Most volcanoes sit along the edges of [[tectonics|tectonic plates]], especially around the Pacific Ocean in a belt called the Ring of Fire. In 1980 Mount St. Helens in the United States erupted with a sideways blast that flattened forests for miles around.'], see: ['tectonics', 'jupiter'] },
  { id: 'tectonics', t: 'Plate Tectonics', cat: 'Earth Science', body: ['Earth\'s outer shell is broken into huge slabs called plates. They ride on hotter, softer rock beneath and move a few centimetres a year, about as fast as fingernails grow.', 'Where plates pull apart, new crust forms. Where they collide, mountains rise and one plate may sink beneath the other, feeding [[volcano|volcanoes]]. Earthquakes happen when plates lock together and then suddenly slip.', 'Many [[reef|coral reef]] atolls are rings of coral growing on top of old volcanic islands that have slowly sunk back into the sea.'], see: ['volcano', 'reef'] },
  { id: 'whale', t: 'Humpback Whale', cat: 'Nature', snd: ['whale', 'Humpback whale song', 7], body: ['The humpback whale is a large baleen whale found in oceans all over the world. Adults grow to about 15 metres long and are famous for leaping out of the water, which is called breaching.', 'Male humpbacks sing long, complex songs that can last twenty minutes and be repeated for hours. All the males in a region sing the same song, which slowly changes from year to year.', 'Many humpbacks migrate thousands of kilometres each year between cold feeding waters and warm breeding grounds, some of them near [[reef|coral reefs]].'], see: ['reef'] },
  { id: 'reef', t: 'Coral Reef', cat: 'Nature', pic: 'reef', cap: 'Picture: a shallow reef in clear, sunlit water.', body: ['Coral reefs are underwater structures built by colonies of tiny animals called coral polyps, which make hard skeletons of calcium carbonate. Reefs cover less than one percent of the ocean floor but are home to about a quarter of all ocean species.', 'The Great Barrier Reef off Australia is the largest, stretching for more than 2,300 kilometres. Corals get much of their food from algae living inside them, which is why reefs grow in clear, sunlit, shallow water. Visitors include the [[whale|humpback whale]].'], see: ['whale', 'tectonics'] },
  { id: 'piano', t: 'Piano', cat: 'Inventions', snd: ['scale', 'C major scale', 4], ev: [1700, 'Cristofori builds the first piano'], body: ['The piano was invented in Italy around 1700 by Bartolomeo Cristofori. Its original name, gravicembalo col piano e forte, means a harpsichord that can play both soft and loud.', 'A harpsichord plucks its strings, but a piano strikes them with felt-covered hammers, so the harder you press a key the louder the note. A modern piano has 88 keys and more than 200 strings.'], see: ['telephone', 'press'] },
  { id: 'telephone', t: 'Telephone', cat: 'Inventions', snd: ['ring', 'Telephone bell, 1900s', 5], ev: [1876, 'Bell patents the telephone'], body: ['Alexander Graham Bell was granted a patent for the telephone in 1876. A telephone turns the sound of a voice into an electrical signal, sends it along a wire and turns it back into sound at the other end.', 'Early telephones had no dials. Callers lifted the earpiece and asked an operator at a switchboard to connect them by hand. Bells rang to announce a call, driven by a hand-cranked generator. Radio later carried voices without wires, all the way to the [[moon|Moon]].'], see: ['moon', 'piano'] },
  { id: 'press', t: 'Printing Press', cat: 'Inventions', ev: [1440, 'Gutenberg\'s printing press'], body: ['Around 1440 Johannes Gutenberg, a goldsmith in Mainz, Germany, developed a printing press that used movable metal type. Single letters could be set into pages, inked, pressed onto paper and then reused.', 'His most famous work, the Gutenberg Bible, was printed around 1455. Printing spread quickly across Europe, making books cheaper and helping ideas travel faster than ever before, a little like this encyclopedia on a disc.'], see: ['pyramid', 'piano'] },
  { id: 'pyramid', t: 'Great Pyramid', cat: 'History', pic: 'pyramid', ev: [-2560, 'Great Pyramid of Giza built'], cap: 'Picture: the Great Pyramid at sunset.', body: ['The Great Pyramid of Giza in Egypt was built around 2560 BC as a tomb for the pharaoh Khufu. It was originally about 146 metres tall and stayed the tallest human-made structure for nearly 4,000 years.', 'It is made of roughly 2.3 million stone blocks. It is the oldest of the Seven Wonders of the Ancient World and the only one still standing.'], see: ['press', 'moon'] },
];
const BY = Object.fromEntries(A.map((a) => [a.id, a]));
const QUIZ = [

  } else if (s.v === 'contents' || s.v === 'index') {
    const cats = [...new Set(A.map((a) => a.cat))], q = QUIZ[Math.floor(Math.random() * QUIZ.length)];
    V.innerHTML = `<div class="page"><div class="kicker">Welcome</div><h1>Contents</h1><p>Compendia holds ${A.length} articles with ${A.filter((a) => a.vid).length} video clips, ${A.filter((a) => a.pic).length} pictures and ${A.filter((a) => a.snd).length} sound clips. Choose a subject, browse the <span class="lnk" data-v="gallery">Media Gallery</span> or travel through the <span class="lnk" data-v="timeline">Timeline</span>.</p><div class="cats">${cats.map((c) => `<div class="cat"><h3>${c}</h3><div>${A.filter((a) => a.cat === c).map((a) => `<a data-go="${a.id}">${a.t}</a>`).join('<br />')}</div></div>`).join('')}</div><div class="dyk">Did you know? ${q[0].replace('?', '')}: ${q[1][q[2]]}. <a data-go="${q[3]}" style="color:#ffe890">Read more</a></div></div>`;
    $('#stat').textContent = `${A.length} articles`;
  } else if (s.v === 'gallery') {
    const items = A.filter((a) => a.vid || a.pic || a.snd);
    V.innerHTML = `<div class="page"><div class="kicker">Media</div><h1>Media Gallery</h1><div class="gal">${items.map((a) => `<div data-go="${a.id}"><canvas width="200" height="130" data-k="${a.id}"></canvas>${a.vid ? '&#9654; Video' : a.pic ? '&#9635; Picture' : '&#9835; Sound'}: ${a.t}<small>${a.vid ? a.cap.split('. ')[0].replace('Video: ', '') : a.pic ? a.cap.replace('Picture: ', '') : a.snd[1]}</small></div>`).join('')}</div></div>`;
    V.querySelectorAll('canvas[data-k]').forEach((c) => { const a = BY[c.dataset.k], x = c.getContext('2d'); if (a.vid) VID[a.vid](x, 4); else if (a.pic) PIC[a.pic](x); else wave(x, a.snd[0]); });
    $('#stat').textContent = `${items.length} media items`;
  } else if (s.v === 'timeline') {
    const evs = A.filter((a) => a.ev).sort((p, q) => p.ev[0] - q.ev[0]);
    V.innerHTML = `<div class="page"><div class="kicker">History</div><h1>Timeline</h1><p>From the pyramids to the space age. Click an event to read about it.</p></div><div id="tl"><div class="track" style="width:${evs.length * 160 + 60}px">${evs.map((a, i) => `<div class="ev ${i % 2 ? 'dn' : 'up'}" data-go="${a.id}" style="left:${30 + i * 160}px"><b>${a.ev[0] < 0 ? `${-a.ev[0]} BC` : a.ev[0]}</b><span>${a.ev[1]}</span></div>`).join('')}</div></div>`;
    $('#stat').textContent = `${evs.length} events`;
  } else if (s.v === 'quiz') {
    if (s.fresh || !quiz) { quiz = { qs: [...QUIZ].sort(() => Math.random() - 0.5).slice(0, 5), i: 0, score: 0, picked: null }; s.fresh = false; }
    if (quiz.i >= quiz.qs.length) { V.innerHTML = `<div class="page q"><div class="kicker">Quiz</div><h1>Final score: ${quiz.score} / ${quiz.qs.length}</h1><p>${quiz.score >= 4 ? 'Outstanding! You really know your Compendia.' : quiz.score >= 2 ? 'Good effort. Read a few more articles and try again.' : 'Keep exploring the disc and have another go.'}</p><span class="btn" id="again">Play again</span></div>`; $('#again').onclick = () => view('quiz'); return; }
    const [q, o, k, id] = quiz.qs[quiz.i], p = quiz.picked;
    V.innerHTML = `<div class="page q"><div class="kicker">Quiz</div><div class="score">QUESTION ${quiz.i + 1} OF ${quiz.qs.length} &#183; SCORE ${quiz.score}</div><h1>${q}</h1><div class="opts">${o.map((t, i) => `<button data-a="${i}" class="${p === null ? '' : i === k ? 'right' : i === p ? 'wrong' : ''}">${'ABCD'[i]}. ${t}</button>`).join('')}</div>${p === null ? '' : `<p class="verdict" style="color:${p === k ? '#2a7a2a' : '#b03020'}">${p === k ? 'Correct!' : `Not quite. The answer is ${o[k]}.`}</p><p>Read more in <a data-go="${id}">${BY[id].t}</a>.</p><span class="btn" id="next">${quiz.i < quiz.qs.length - 1 ? 'Next question' : 'See my score'}</span>`}</div>`;
    V.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => answer(+b.dataset.a))); $('#next')?.addEventListener('click', next);
    $('#stat').textContent = `Quiz · ${quiz.score} correct`;
  } else if (s.v === 'search') {
    const r = searchAll(s.q), re = new RegExp(`(${s.q.replace(/[^\w ]/g, '').trim().split(/\s+/).join('|')})`, 'gi');
    V.innerHTML = `<div class="page"><div class="kicker">Search</div><h1>${r.length} result${r.length === 1 ? '' : 's'} for "${s.q.replace(/[<&"]/g, '')}"</h1>${r.map(([a, snip]) => `<div class="res"><span class="lnk" data-go="${a.id}">${a.t}</span> <small>${a.cat}</small><p>${snip.replace(re, '<mark>$1</mark>')}</p></div>`).join('') || '<p>No articles matched. Try another word, like planet or music.</p>'}</div>`;
    $('#stat').textContent = `Search: ${s.q}`;
  }
}
function answer(i) { if (cur().v !== 'quiz' || !quiz || quiz.picked !== null) return; quiz.picked = i; const ok = i === quiz.qs[quiz.i][2]; if (ok) quiz.score++; chime(ok); render(); }
function next() { quiz.i++; quiz.picked = null; render(); }
function searchAll(q) {
  const ws = q.toLowerCase().replace(/[^\w ]/g, '').split(/\s+/).filter((w) => w.length > 1); if (!ws.length) return [];
  return A.map((a) => { const text = plain(a.body.join(' ')), low = text.toLowerCase(); let s = 0, at = -1; for (const w of ws) { if (a.t.toLowerCase().includes(w)) s += 5; let i = low.indexOf(w); if (i >= 0 && at < 0) at = i; while (i >= 0) { s++; i = low.indexOf(w, i + 1); } } const st = Math.max(0, at - 60); return [a, s, `${st ? '...' : ''}${text.slice(st, st + 170)}...`]; }).filter((r) => r[1] > 0).sort((p, q2) => q2[1] - p[1]).map(([a, , snip]) => [a, snip]);
}
function wave(x, k) { x.fillStyle = '#0a1430'; x.fillRect(0, 0, 200, 130); x.strokeStyle = '#f0c040'; x.lineWidth = 1.5; x.beginPath(); for (let i = 0; i < 200; i++) { const env = Math.sin((i / 200) * Math.PI), f = { whale: 0.08, scale: 0.4, ring: 0.9, beep: 0.6, rumble: 0.15 }[k]; x.lineTo(i, 65 + Math.sin(i * f) * Math.sin(i * f * 0.13) * 40 * env); } x.stroke(); x.fillStyle = '#ffe890'; x.font = 'bold 26px Georgia'; x.fillText('♫', 8, 30); }

// Index > A-Z strip, find box, list
let letter = null;
function buildIndex() {
  const q = $('#find').value.trim().toLowerCase(), items = A.filter((a) => (!letter || a.t[0] === letter) && (!q || a.t.toLowerCase().includes(q))).sort((p, r) => p.t.localeCompare(r.t));
  $('#list').innerHTML = items.map((a) => `<li data-go="${a.id}">${a.t}<i>${a.vid ? '&#9654;' : ''}${a.pic ? '&#9635;' : ''}${a.snd ? '&#9835;' : ''}</i></li>`).join('');
  $('#az').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((l) => `<b class="${A.some((a) => a.t[0] === l) ? '' : 'off'}${l === letter ? ' on' : ''}" data-l="${l}">${l}</b>`).join('');
  document.querySelectorAll('#list li').forEach((li) => li.classList.toggle('on', cur().v === 'article' && li.dataset.go === cur().id));
}
$('#az').onclick = (e) => { const l = e.target.closest('[data-l]')?.dataset.l; if (!l) return; letter = letter === l ? null : l; buildIndex(); };
$('#find').oninput = () => { letter = null; buildIndex(); };
$('#find').onkeydown = (e) => { if (e.key === 'Enter' && $('#find').value.trim()) go({ v: 'search', q: $('#find').value.trim() }); };
document.addEventListener('click', (e) => { const g = e.target.closest('[data-go]'); if (g && !loading) return open(g.dataset.go); const v = e.target.closest('[data-v]'); if (v && !loading) { if (v.dataset.v === 'index' && innerWidth <= 700) return $('#side').classList.toggle('open'); view(v.dataset.v); } });
$('#back').onclick = () => { if (hist.length > 1 && !loading) { fwd.push(hist.pop()); go(cur(), false); } };
$('#fwd').onclick = () => { if (fwd.length && !loading) { hist.push(fwd.pop()); go(cur(), false); } };

// Loop > globe, video playback
const gx = $('#globe').getContext('2d'); let last = 0;
function globe(t) {
  gx.clearRect(0, 0, 84, 84); const g = gx.createRadialGradient(32, 30, 4, 42, 42, 40); g.addColorStop(0, '#9fe0ff'); g.addColorStop(0.6, '#1a6ad0'); g.addColorStop(1, '#0a2a6a'); gx.fillStyle = g; gx.beginPath(); gx.arc(42, 42, 38, 0, 7); gx.fill();
  gx.save(); gx.beginPath(); gx.arc(42, 42, 38, 0, 7); gx.clip(); gx.strokeStyle = 'rgba(255,240,180,0.7)'; gx.lineWidth = 1.2;
  for (let i = 0; i < 6; i++) { const a = ((t * 0.6 + (i * Math.PI) / 6) % Math.PI); gx.beginPath(); gx.ellipse(42, 42, Math.abs(Math.cos(a)) * 38, 38, 0, 0, 7); gx.stroke(); }
  for (const y of [-24, -12, 0, 12, 24]) { const w = Math.sqrt(38 * 38 - y * y); gx.beginPath(); gx.ellipse(42, 42 + y, w, w * 0.12, 0, 0, 7); gx.stroke(); } gx.restore();
  gx.strokeStyle = '#ffe080'; gx.lineWidth = 2; gx.beginPath(); gx.arc(42, 42, 39, 0, 7); gx.stroke();
}
function frame(ms) { requestAnimationFrame(frame); const t = ms / 1000, dt = Math.min(0.05, t - last); last = t; globe(t); if (player?.playing) { player.t = (player.t + dt) % player.dur; drawPlayer(); } }
requestAnimationFrame(frame);

// Attract > browse, play, quiz, search
let touched = false;
addEventListener('pointerdown', (e) => { audio(); if (e.isTrusted) touched = true; }, { capture: true });
addEventListener('keydown', (e) => { audio(); if (e.isTrusted) touched = true; }, { capture: true });
async function step(s, fn) { await wait(s); if (touched) throw 0; return fn(); }
const click = (sel) => document.querySelector(sel)?.click();
async function attract() {
  try {
    for (;;) {
      await step(1.4, () => open('solar')); await wait(4.5);
      await step(0, () => click('#view p a[data-go="jupiter"]')); await wait(3.5);
      await step(0, () => view('gallery')); await wait(2.4);
      await step(0, () => click('.gal [data-go="volcano"]')); await wait(3.5); await step(0, () => click('.snd')); await wait(3);
      await step(0, () => view('timeline')); await wait(1); for (let i = 0; i < 30; i++) await step(0.04, () => ($('#tl').scrollLeft += 18)); await step(0.8, () => click('.ev[data-go="moon"]')); await wait(3.5);
      await step(0, () => view('quiz')); await step(2.2, () => answer(quiz.qs[0][2])); await step(2.6, next); await step(2, () => answer((quiz.qs[1][2] + 1) % 4)); await wait(2.6);
      for (const ch of 'whale') await step(0.12, () => { $('#find').value += ch; buildIndex(); }); await step(0.5, () => go({ v: 'search', q: $('#find').value }));
      await step(2.2, () => click('.res [data-go="whale"]')); await step(1.2, () => click('.snd')); await wait(4); await step(0, () => { $('#find').value = ''; buildIndex(); });
      await step(0.5, () => click('.see [data-go="reef"]')); await wait(3); await step(0, () => view('contents')); await wait(3);
    }
  } catch { /* user took over */ }
}
buildIndex();
if (capture) { hist.push({ v: 'article', id: 'solar' }); render(); player.t = 7.3; drawPlayer(); } else { go({ v: 'contents' }); attract(); }

window.__encyclo = { open, view, search: (q) => go({ v: 'search', q }), answer, next, back: () => $('#back').click(), state: () => ({ view: cur().v, id: cur().id, hist: hist.length, fwd: fwd.length, loading, quiz: quiz && { i: quiz.i, score: quiz.score, picked: quiz.picked }, playing: player ? { kind: player.kind, t: +player.t.toFixed(2), on: player.playing } : null, clip: !!clip, list: [...document.querySelectorAll('#list li')].map((l) => l.dataset.go) }) };
</script>
</body>
</html>
