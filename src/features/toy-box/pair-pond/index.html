<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pair Pond</title>
<style>
  :root { --ink: #fff; --card: rgba(8, 34, 30, 0.72); --pond: #8ff0c4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcd0; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; user-select: none; }
  #info { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #info .h { font-size: 20px; font-weight: 900; }
  #info .m { font-size: 13px; margin-top: 3px; opacity: 0.9; max-width: 250px; }
  #board { top: 62px; right: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 180px; }
  #board .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #board .row b { width: 16px; opacity: 0.6; }
  #board .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .row span { flex: 1; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row em { font-style: normal; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  #board .row.me span { color: var(--pond); font-weight: 800; }
  #board .row.turn { background: rgba(255, 255, 255, 0.12); border-radius: 6px; }
  #turn { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 16px; font-weight: 800; display: none; white-space: nowrap; }
  #big { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(28px, 6.5vw, 62px); font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.32em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.9; max-width: 300px; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: var(--pond); }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  @media (pointer: coarse), (max-width: 900px) { #hint { display: none; } }
  @media (max-width: 700px) { #turn { top: 96px; font-size: 14px; } }
</style>
<link rel="stylesheet" href="../common/mobile-hud.css" />
</head>
<body>
<div id="info" class="card"><div class="h" id="roundName"></div><div class="m" id="roundMeta"></div></div>
<div id="board" class="card"></div>
<div id="turn" class="card"></div>
<div id="big"></div>
<div id="hint" class="card">On <b>your turn</b> tap two lily pads (or arrow keys + Enter). Same critter underneath: keep the pair and <b>go again</b>. Different: they flip back and the next frog hops up. Most pairs when the pond is clear wins.</div>
<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createLobby } from '../common/room-lobby.ts';
import { exposeGameDebug } from '../common/debug-probe.ts';
import { startTicker } from '../common/room-client.ts';
import { createTurnSync } from '../common/turn-sync.ts';
import { createServerMatchClient } from '../common/server-run/server-match-client.ts';
import { esc, nameTag, emojiTexture, boardHtml, createBanner } from '../common/turn-page-kit.ts';
import { createPondGame, pairsLeft } from './pond-rules.ts';
import { createGameAudio } from '../common/game-audio.ts';

const CRITTERS = ['🐸', '🐢', '🦆', '🐟', '🦋', '🐌', '🐞', '🦢', '🦩', '🐊', '🦦', '🐝', '🐛', '🐙', '🦀', '🐠', '🪷', '🍄', '🐇', '🦔'];
const GAP = 1.55;

// Scene > Renderer, sunny pond: water disc, reeds, mossy bank
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fdcd0);
scene.fog = new THREE.Fog(0x9fdcd0, 30, 70);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 160);
scene.add(new THREE.HemisphereLight(0xeafff6, 0x2f5a3a, 1.0));
const sun = new THREE.DirectionalLight(0xfff2d6, 1.7);
sun.position.set(-6, 16, 8);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const bank = new THREE.Mesh(new THREE.CircleGeometry(60, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x6cbf5a, roughness: 0.95 }));
bank.position.y = -0.05;
bank.receiveShadow = true;
scene.add(bank);
const waterMat = new THREE.MeshStandardMaterial({ color: 0x2e9bb0, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.92 });
const water = new THREE.Mesh(new THREE.CircleGeometry(1, 72).rotateX(-Math.PI / 2), waterMat);
water.receiveShadow = true;
scene.add(water);
const reeds = new THREE.Group();
scene.add(reeds);
function plantReeds(radius) {
  reeds.clear();
  const stem = new THREE.MeshStandardMaterial({ color: 0x3f7f3a }), top = new THREE.MeshStandardMaterial({ color: 0x7a4a2a });
  for (let k = 0; k < 46; k++) {
    const a = (k / 46) * Math.PI * 2 + Math.sin(k * 7.1) * 0.05, r = radius + 0.4 + (k % 3) * 0.25, h = 1.2 + ((k * 37) % 10) / 10;
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, h, 5), stem); s.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r * 0.82);
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.3, 4, 6), top); c.position.set(s.position.x, h + 0.1, s.position.z);
    if (k % 4 === 0) reeds.add(s, c);
  }
}

// Pads > one lily pad per face: green top, critter underneath; flipping turns the whole pad over
const pads3d = new THREE.Group();
scene.add(pads3d);
let pads = [], pondKey = '', cols = 1;
const padTopGeo = new THREE.CircleGeometry(0.66, 28, 0.35, Math.PI * 2 - 0.5).rotateX(-Math.PI / 2);
const padBotGeo = new THREE.CircleGeometry(0.66, 28).rotateX(Math.PI / 2);
const ringGeo = new THREE.RingGeometry(0.68, 0.8, 28).rotateX(-Math.PI / 2);
const hiddenTex = emojiTexture('?', { bg: '#cfe9c0', fg: '#4f8a3f' });
function buildPond(N) {
  pads3d.clear();
  cols = Math.ceil(Math.sqrt(N * 1.35));
  const rows = Math.ceil(N / cols);
  pads = [];
  for (let i = 0; i < N; i++) {
    const c = i % cols, r = Math.floor(i / cols), rowLen = r === rows - 1 ? N - r * cols : cols;
    const x = (c - (rowLen - 1) / 2) * GAP + Math.sin(i * 12.9) * 0.08, z = (r - (rows - 1) / 2) * GAP + Math.cos(i * 7.3) * 0.08;
    const g = new THREE.Group();
    const topMat = new THREE.MeshStandardMaterial({ color: 0x58b44a, roughness: 0.6, emissive: 0x000000 });
    const top = new THREE.Mesh(padTopGeo, topMat); top.position.y = 0.02; top.castShadow = true; top.userData.i = i;
    const botMat = new THREE.MeshStandardMaterial({ map: hiddenTex, roughness: 0.5 });
    const bot = new THREE.Mesh(padBotGeo, botMat); bot.position.y = -0.02;
    g.add(top, bot);
    g.position.set(x, 0.06, z);
    g.rotation.y = Math.sin(i * 3.7) * 0.6;
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
    ring.position.set(x, 0.04, z);
    pads3d.add(g, ring);
    pads.push({ i, x, z, g, top, bot, ring, flip: 0, face: -1, owner: null, spin: g.rotation.y });
  }
  const radius = Math.max((cols * GAP) / 2, (rows * GAP) / 2 / 0.82) + 1.1;
  water.scale.set(radius, 1, radius * 0.82);
  plantReeds(radius);
  pondRadius = radius;
}
let pondRadius = 6;
function showFace(pad, f) {
  if (pad.face === f) return;
  pad.face = f;
  pad.bot.material.map = f >= 0 ? emojiTexture(CRITTERS[f] ?? '❔', { bg: '#fff6dc' }) : hiddenTex;
  pad.bot.material.needsUpdate = true;
}

// Splash > ripple rings where a pad lands or a pair is claimed
const ripples = [];
const rippleGeo = new THREE.RingGeometry(0.5, 0.58, 32).rotateX(-Math.PI / 2);
function ripple(x, z, color = 0xffffff) {
  const m = new THREE.Mesh(rippleGeo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, depthWrite: false }));
  m.position.set(x, 0.03, z);
  scene.add(m);
  ripples.push({ m, t: 0 });
}

// Players > frogs on stones around the bank; the frog whose turn it is hops
const pawns3d = new Map();
function makeFrog(p) {
  const g = new THREE.Group(), body = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.45 });
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.3, 10), new THREE.MeshStandardMaterial({ color: 0x8c8f88, roughness: 0.9 }));
  stone.position.y = 0.15; stone.receiveShadow = true;
  const torso = new THREE.Mesh(new THREE.SphereGeometry(0.38, 18, 12), mat); torso.scale.set(1.1, 0.75, 1); torso.position.y = 0.55; torso.castShadow = true;
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff }), pupil = new THREE.MeshBasicMaterial({ color: 0x111111 });
  for (const sx of [-0.17, 0.17]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), eyeMat); e.position.set(sx, 0.84, 0.16);
    const q = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), pupil); q.position.set(sx, 0.86, 0.26);
    body.add(e, q);
  }
  body.add(torso);
  const tag = nameTag(p.nick, p.color, 'rgba(8,34,30,0.8)'); tag.position.y = 1.55;
  g.add(stone, body, tag);
  g.userData = { body };
  scene.add(g);
  return g;
}

// Audio > flip plip, pair chime, miss boop, turn ping, clock tick
const gameAudio = createGameAudio();
const { tone, noise } = gameAudio;
const sfx = {
  flip() { tone(520, 880, 0.08, 0.06, 'sine'); noise(0.05, 0.03, 1800, 600); },
  pair(me) { [784, 1047, 1319].forEach((f, i) => tone(f, f, 0.14, me ? 0.08 : 0.04, 'triangle', i * 0.07)); },
  miss() { tone(330, 220, 0.25, 0.05, 'triangle'); },
  turn() { tone(660, 660, 0.1, 0.07, 'triangle'); tone(990, 990, 0.14, 0.07, 'triangle', 0.11); },
  tick() { tone(1500, 1500, 0.02, 0.03, 'square'); },
};

// Game > rules live in pond-rules.ts: this page runs them for attract mode only, a match is run by the relay server (a face reaches a browser only once its pad is up)
// S: { mode, ph, tt, clock, pond, N, claim: [null | { f, by }], up: [{ i, f }], turn, last: { hit, by, mv }, mv, P: [{ id, nick, color, bot, score, skill }] }
const attract = createPondGame();
let S = attract.state;
const player = (id) => S.P.find((p) => p.id === id);
const sig = () => JSON.stringify(S, (k, v) => (k === 'tt' || k === 'think' ? undefined : v));
let prevS = null;
function startAttract() { attract.startAttract(); S = attract.state; prevS = null; }
// Run engine > attract tick: page hooks fire on anything but the clock
function attractTick(dt) {
  const changed = attract.tick(dt);
  if (S !== attract.state) prevS = null;
  S = attract.state;
  if (!changed && prevS) return;
  onChange(prevS, S);
  prevS = JSON.parse(sig());
}

// Multiplayer > lobby + state sync (server publishes S, every tab sends its flips)
const sync = createTurnSync({
  onState(s) { if (lobbyStarted) applyState(s); },
  onDone() { serverMatch.finish(); },
});
let lobbyStarted = false;
const lobby = createLobby({
  game: 'pair-pond', title: 'Pair Pond', emoji: '🐸', accent: '#8ff0c4',
  blurb: 'Take turns flipping two lily pads. Same critter underneath: keep the pair and go again. Different: they flip back for everyone to remember. Most pairs when the pond is clear wins.',
  maxBots: 13, defaultBots: 3, minPlayers: 2,
  note: 'Up to 14 frogs (humans + bots). The pond grows with the room: 6 pairs plus one per player.',
  settings: [{ key: 'clock', label: 'Turn clock', options: [[10, '10 s'], [15, '15 s'], [20, '20 s']], value: 10 }],
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    sync.attach(room);
    room.on('host', syncTop);
  },
  onStart({ bots, seed, settings }) {
    lobbyStarted = true;
    showHud(true);
    syncTop();
    serverMatch.start({ bots, seed, settings });
    if (sync.state) applyState(sync.state);
  },
  onLobby() { serverMatch.stop(); lobbyStarted = false; showHud(false); banner.clear(); startAttract(); },
});
const serverMatch = createServerMatchClient(lobby);
// Debug > ?debug exposes window.__GAME_DEBUG__ for Playwright x-ray checks
exposeGameDebug({ lobby, read: () => ({ phase: S.ph, players: S.P }), confirmMs: () => serverMatch.stats.confirmMs });
function showHud(on) {
  ['info', 'board', 'turn'].forEach((id) => (document.getElementById(id).style.display = on ? 'block' : 'none'));
  document.getElementById('top').style.display = on ? 'flex' : 'none';
}
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
function applyState(s) {
  const prev = S?.mode === 'match' ? JSON.parse(sig()) : null;
  S = { ...s, P: s.P.map((p) => ({ ...p })), mode: 'match' };
  onChange(prev, S);
}
function onChange(prev, cur) {
  const me = lobby.room?.me, match = cur.mode === 'match';
  if (`${cur.pond}|${cur.N}` !== pondKey) { pondKey = `${cur.pond}|${cur.N}`; buildPond(cur.N); }
  if (cur.mv !== prev?.mv && cur.up.length) { const u = cur.up.at(-1), pad = pads[u.i]; sfx.flip(); if (pad) ripple(pad.x, pad.z); }
  if (cur.last && cur.last.mv !== prev?.last?.mv) {
    const who = cur.P.find((p) => p.id === cur.last.by);
    if (cur.last.hit) { sfx.pair(cur.last.by === me); if (match) banner.flash(`<small>${esc(who?.nick ?? '')} goes again</small>${CRITTERS[cur.up[0]?.f] ?? '✨'} pair!`, 1.2); }
    else sfx.miss();
  }
  for (const pad of pads) if (cur.claim[pad.i] && !prev?.claim?.[pad.i]) ripple(pad.x, pad.z, 0x8ff0c4);
  if (match && cur.ph === 'play' && (prev?.turn !== cur.turn || prev?.ph !== 'play') && cur.P[cur.turn]?.id === me && !cur.up.length) sfx.turn();
}

// Input > tap a pad on my turn, or arrow keys move a cursor and Enter / Space flips
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hoverI = -1, cursorI = -1;
const isFree = (i) => !S.claim[i] && !S.up.some((u) => u.i === i);
function pickPad(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pads.filter((p) => isFree(p.i)).map((p) => p.top), false)[0];
  return hit ? hit.object.userData.i : -1;
}
const myTurn = () => S.mode === 'match' && S.ph === 'play' && S.P[S.turn]?.id === lobby.room?.me;
function flipPad(i) { if (myTurn() && i >= 0 && isFree(i)) sync.act({ t: 'flip', i }); }
addEventListener('pointermove', (e) => { hoverI = myTurn() ? pickPad(e) : -1; });
addEventListener('pointerdown', (e) => { if (e.target === renderer.domElement) flipPad(pickPad(e)); });
addEventListener('keydown', (e) => {
  if (!myTurn() || !pads.length) return;
  const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
  if (step) {
    e.preventDefault();
    if (cursorI < 0) cursorI = pads.findIndex((p) => isFree(p.i));
    else for (let i = cursorI + step, n = 0; i >= 0 && i < pads.length && n < pads.length; i += step, n++) if (isFree(i)) { cursorI = i; break; }
  } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipPad(cursorI); }
});

// HUD > turn banner, scoreboard, big banner
const banner = createBanner(document.getElementById('big')), turnEl = document.getElementById('turn');
let lastClock = 0, hudT = 0;
function hud(dt) {
  if (S.mode !== 'match') return;
  const flashing = banner.tick(dt);
  const me = player(lobby.room?.me), up = S.P[S.turn], clock = Math.ceil(Math.max(0, S.tt));
  if (S.ph === 'intro') banner.set(`<small>${S.N / 2} pairs under the pads</small>Pair Pond`);
  else if (S.ph === 'final') { const w = [...S.P].sort((a, c) => c.score - a.score)[0]; banner.set(`<small>sharpest memory with ${w?.score ?? 0} pairs</small>🏆 ${esc(w?.nick ?? '')}`); }
  else if (!flashing) banner.set('');
  turnEl.innerHTML = S.ph === 'final' ? '🏁 pond cleared' : S.ph === 'intro' ? '🐸 get ready' : up?.id === me?.id ? `<b>Your flip</b> · ${S.up.length ? 'one more' : 'pick two'} · ${clock}s` : `${esc(up?.nick ?? '')} is flipping${up?.bot ? '' : ` · ${clock}s`}`;
  if (myTurn() && clock !== lastClock && clock <= 3) sfx.tick();
  lastClock = clock;
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.15;
  document.getElementById('roundName').textContent = `🪷 ${pairsLeft(S)} of ${S.N / 2} pairs left`;
  document.getElementById('roundMeta').innerHTML = me ? `Pairs <b style="color:var(--pond)">${me.score}</b>` : 'Watching';
  const rows = [...S.P].sort((a, c) => c.score - a.score);
  document.getElementById('board').innerHTML = boardHtml(rows, { me: lobby.room?.me, turnId: S.ph === 'play' || S.ph === 'show' ? up?.id : null, right: (p) => p.score, mark: (p) => (p === up && S.ph !== 'final' ? '🐸 ' : '') });
}

// Run engine > attract rules tick; in a match only the clock between server states runs here
startTicker(20, (dt) => {
  if (S.mode === 'attract') attractTick(dt);
  else S.tt -= dt;
});

// Run engine > render loop: pads flip over, claimed pads drift low with their finder's color ring, frogs hop on their turn
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 14, 12), camLook = new THREE.Vector3(0, 0, 0.6), _v = new THREE.Vector3();
const hoverColor = new THREE.Color(0x2a4a10), noGlow = new THREE.Color(0x000000);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const upMap = new Map(S.up.map((u) => [u.i, u.f]));
  for (const pad of pads) {
    const claim = S.claim?.[pad.i] ?? null, face = upMap.has(pad.i) ? upMap.get(pad.i) : claim ? claim.f : -1;
    if (face >= 0) showFace(pad, face);
    pad.flip += ((face >= 0 ? 1 : 0) - pad.flip) * Math.min(1, dt * 9);
    if (pad.flip < 0.02 && face < 0) showFace(pad, -1);
    pad.g.rotation.x = pad.flip * Math.PI;
    pad.g.rotation.y = face >= 0 ? pad.spin * (1 - pad.flip) : pad.spin;
    pad.g.position.y = 0.06 + Math.sin(pad.flip * Math.PI) * 0.7 + (claim ? -0.03 : Math.sin(time * 1.3 + pad.i) * 0.015);
    const owner = claim ? S.P.find((p) => p.id === claim.by) : null;
    pad.ring.material.opacity = claim ? 0.9 : 0;
    if (owner) pad.ring.material.color.set(owner.color);
    const glow = !claim && face < 0 && (pad.i === hoverI || (pad.i === cursorI && myTurn()));
    pad.top.material.emissive.copy(glow ? hoverColor : noGlow);
    pad.g.scale.setScalar(claim ? 0.88 : 1);
  }
  for (let k = ripples.length - 1; k >= 0; k--) {
    const r = ripples[k]; r.t += dt;
    r.m.scale.setScalar(1 + r.t * 2.2);
    r.m.material.opacity = Math.max(0, 0.8 - r.t * 0.9);
    if (r.t > 0.9) { scene.remove(r.m); ripples.splice(k, 1); }
  }
  waterMat.color.setHSL(0.53, 0.58, 0.43 + Math.sin(time * 0.6) * 0.015);
  const ids = new Set(S.P.map((p) => p.id));
  for (const [id, g] of pawns3d) if (!ids.has(id)) { scene.remove(g); pawns3d.delete(id); }
  const nP = S.P.length, rx = pondRadius + 1.3, rz = pondRadius * 0.82 + 1.3;
  S.P.forEach((p, i) => {
    let g = pawns3d.get(p.id);
    if (!g) { g = makeFrog(p); pawns3d.set(p.id, g); }
    // arc around the far and side banks, open toward the camera
    const a = Math.PI * (1.08 + (nP > 1 ? i / (nP - 1) : 0.5) * 0.84);
    const active = S.ph !== 'final' && S.ph !== 'intro' && S.P[S.turn] === p;
    g.position.set(Math.cos(a) * rx, 0, Math.sin(a) * rz);
    g.lookAt(0, 0, 0);
    g.userData.body.position.y = active ? Math.abs(Math.sin(time * 6)) * 0.35 : 0;
  });
  hud(dt);
  // camera distance fits the pond plus the frog ring across the screen width; portrait looks more top-down
  const span = 2 * pondRadius + 4.5, dist = Math.max(16 * (pondRadius / 6), span / (0.77 * camera.aspect));
  const tall = camera.aspect < 1, up = tall ? 0.93 : 0.78, back = tall ? 0.37 : 0.63;
  camPos.lerp(_v.set(0, dist * up, dist * back), 1 - Math.exp(-dt * 3));
  scene.fog.near = dist * 1.4; scene.fog.far = dist * 3;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
