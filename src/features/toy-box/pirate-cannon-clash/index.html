<style>

// Scene > Renderer, sky, rolling sea (CPU waves), sandy islands with palms, rock stacks

// arena limit: a ring of buoys

const buoys = [];
for (let k = 0; k < 40; k++) {

const ISLANDS = [[0, 0, 7], [-30, -22, 5], [28, -26, 4.5], [-26, 28, 4.5], [31, 24, 5.5], [0, -44, 3.5], [0, 44, 3.5], [-46, 2, 3.5], [46, -2, 3.5]];

  const g = new THREE.Group();
  const sand = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.85, r * 1.1, 1.6, 28), sandMat); sand.position.y = 0.2; sand.receiveShadow = true;
  const top = new THREE.Mesh(new THREE.SphereGeometry(r * 0.6, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), grassMat); top.position.y = 0.95; top.scale.y = 0.45; top.receiveShadow = true;
  g.add(sand, top);
  for (let k = 0; k < Math.round(r / 2); k++) {
    const palm = new THREE.Group(), a = Math.random() * Math.PI * 2, d = Math.random() * r * 0.45, h = 3 + Math.random() * 2;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.22, h, 7), trunkMat); trunk.position.y = h / 2; trunk.rotation.z = 0.15; trunk.castShadow = true;
    palm.add(trunk);
    for (let j = 0; j < 6; j++) { const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 2.6), leafMat); leaf.position.set(0.25, h, 0); leaf.rotation.set(-1.1, (j / 6) * Math.PI * 2, 0); leaf.translateY(1.1); leaf.castShadow = true; palm.add(leaf); }

  for (let k = 0; k < 3; k++) { const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6 + Math.random() * 0.8, 0), rockMat); const a = Math.random() * Math.PI * 2; rk.position.set(Math.cos(a) * r, 0.2, Math.sin(a) * r); rk.castShadow = true; g.add(rk); }
  g.position.set(x, 0, z);

}

// Ships > hull, deck, mast, sail in player color, flag, side cannons, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(10,22,34,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(4, 1, 1); s.position.y = 7.2; s.renderOrder = 5;

}
const hullShape = new THREE.Shape();
hullShape.moveTo(-1.1, -2.4); hullShape.lineTo(1.1, -2.4); hullShape.lineTo(1.25, 0.8); hullShape.quadraticCurveTo(1.0, 2.2, 0, 3.1); hullShape.quadraticCurveTo(-1.0, 2.2, -1.25, 0.8); hullShape.closePath();
const hullGeo = new THREE.ExtrudeGeometry(hullShape, { depth: 1.3, bevelEnabled: true, bevelSize: 0.12, bevelThickness: 0.12, bevelSegments: 2 }).rotateX(Math.PI / 2).translate(0, 1.0, 0);

const woodMat = new THREE.MeshStandardMaterial({ color: 0x7a4a2a, roughness: 0.8 }), deckMat = new THREE.MeshStandardMaterial({ color: 0xc89a62, roughness: 0.85 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x22252b, metalness: 0.6, roughness: 0.4 });
const ships3d = new Map();
function makeShip(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const hull = new THREE.Mesh(hullGeo, woodMat); hull.castShadow = true;
  const deck = new THREE.Mesh(deckGeo, deckMat); deck.receiveShadow = true;
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.62, 0.18, 4.2), new THREE.MeshStandardMaterial({ color: p.color })); stripe.position.set(0, 0.62, -0.1);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 5.6, 8), woodMat); mast.position.set(0, 3.8, 0.2); mast.castShadow = true;

  const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.2, 6).rotateZ(Math.PI / 2), woodMat); yard.position.set(0, 5.4, 0.3);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), new THREE.MeshStandardMaterial({ color: 0x111111, side: THREE.DoubleSide })); flag.position.set(0.45, 6.4, 0.2);
  const skull = new THREE.Mesh(new THREE.CircleGeometry(0.13, 12), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })); skull.position.set(0.45, 6.42, 0.21);
  body.add(hull, deck, stripe, mast, sail, yard, flag, skull);
  for (const s of [-1, 1]) for (const z of [-1.1, 0, 1.1]) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.7, 8).rotateZ(Math.PI / 2), ironMat); c.position.set(s * 1.35, 1.25, z); body.add(c); }
  const smoke = new THREE.Group(); body.add(smoke);
  const tag = nameTag(p.nick, p.color);
  g.add(body, tag);
  g.userData = { body, sail, flag, tag };

}

// FX > cannonballs, splashes, muzzle smoke, wood splinters (one shared particle pool)
const ballGeo = new THREE.SphereGeometry(0.28, 12, 8);
const balls3d = [];
const P_N = 1500;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_N * 3), pCol = new Float32Array(P_N * 3), pVel = new Float32Array(P_N * 3), pLife = new Float32Array(P_N), pGrav = new Float32Array(P_N);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const parts = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, opacity: 0.9 }));
parts.frustumCulled = false;
scene.add(parts);
for (let i = 0; i < P_N; i++) pPos[i * 3 + 1] = -99;
let pNext = 0;
const C_WATER = new THREE.Color(0xe8f8ff), C_SMOKE = new THREE.Color(0xbfbfbf), C_WOOD = new THREE.Color(0x8a5a32), C_FIRE = new THREE.Color(0xffa030);
function spray(x, y, z, n, col, spd, up, grav = 14, life = 0.9) {
  for (let k = 0; k < n; k++) {
    const i = pNext++ % P_N, a = Math.random() * Math.PI * 2, s = spd * Math.random();
    pPos.set([x, y, z], i * 3); pVel.set([Math.cos(a) * s, up * (0.5 + Math.random()), Math.sin(a) * s], i * 3);
    pCol.set([col.r, col.g, col.b], i * 3); pLife[i] = life * (0.6 + Math.random() * 0.6); pGrav[i] = grav;
  }
}

// Audio > cannon boom, splash, crunch, sink groan, countdown, fanfare
const gameAudio = createGameAudio({ noiseSeconds: 2 });
const { tone } = gameAudio;
const noise = (len, vol, f0, f1, delay = 0) => gameAudio.noise(len, vol, f0, f1, 'lowpass', delay);
const near = (x, z) => { const m = ships.get(lobby.room?.me); return m ? Math.max(0.12, 1 - Math.hypot(m.x - x, m.z - z) / 60) : 0.5; };
const sfx = {
  boom(x, z) { const v = near(x, z); for (let k = 0; k < 3; k++) noise(0.7, 0.32 * v, 1600, 60, k * 0.07); tone(90, 40, 0.5, 0.2 * v, 'sine'); },
  splash(x, z) { noise(0.35, 0.12 * near(x, z), 3500, 400); },
  crunch(x, z) { const v = near(x, z); noise(0.3, 0.35 * v, 2200, 200); tone(180, 60, 0.25, 0.15 * v, 'square'); },
  sink() { tone(220, 50, 1.6, 0.12, 'sawtooth'); noise(1.6, 0.15, 1200, 100); },
  repair() { [660, 880].forEach((f, i) => tone(f, f, 0.12, 0.08, 'triangle', i * 0.09)); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 0.11, 'square'); },
  win() { [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.24, 0.1, 'square', i * 0.12)); },
};

// Game > World: ships, cannonballs, barrels
const BOT_NAMES = ['Redbeard', 'Saltjaw', 'Bilge Rat', 'Peg Leg', 'Calico', 'Barnacle', 'Squall', 'One-Eye', 'Mad Molly', 'Sea Dog', 'Cutlass', 'Plank', 'Flint', 'Kraken'];
const BOT_COLORS = ['#9b5de5', '#00bbf9', '#00f5d4', '#f15bb5', '#fee440', '#8ac926', '#ff924c', '#6a4c93', '#e76f51', '#2a9d8f', '#b5179e', '#577590', '#ef476f', '#06d6a0'];
const MATCH_T = 180, WIN_SINKS = 8, MAX_HP = 5, MAXS = 9.5, RELOAD = 2.6, SHIP_R = 2.2, G = 12;
const world = { mode: 'attract', phase: 'count', t: 3, left: MATCH_T, winner: null };
const ships = new Map();
let balls = [], barrels = [], events = [];
const rng = Math.random;
function addShip(id, nick, color, bot) {
  const p = { id, nick, color, bot, x: 0, z: 0, h: 0, speed: 0, hp: MAX_HP, sunk: 0, thr: 0, turn: 0, cdL: 0, cdR: 0, seqL: 0, seqR: 0, lastL: 0, lastR: 0, kills: 0, deaths: 0, lastHit: null, inv: 0, skill: 0.55 + rng() * 0.4, think: 0, target: null };
  ships.set(id, p);
  return p;
}
function removeShip(id) { ships.delete(id); const g = ships3d.get(id); if (g) { scene.remove(g); ships3d.delete(id); } }
function clearShips() { for (const id of [...ships.keys()]) removeShip(id); }
function blocked(x, z, pad) { return ISLANDS.some(([ix, iz, r]) => Math.hypot(x - ix, z - iz) < r + pad); }
function spawn(p, a) {

  do { const r = R_SEA - 8 - rng() * 6; x = Math.cos(a) * r; z = Math.sin(a) * r; a += 0.4; tries++; } while ((blocked(x, z, 4) || [...ships.values()].some((q) => q !== p && !q.sunk && Math.hypot(q.x - x, q.z - z) < 7)) && tries < 20);

}
function startMatch() {
  const ps = [...ships.values()];
  ps.forEach((p, k) => { spawn(p, (k / ps.length) * Math.PI * 2); p.kills = 0; p.deaths = 0; });
  balls = [];
  barrels = [];
  for (let k = 0; k < 5; k++) barrels.push(newBarrel());
  Object.assign(world, { phase: 'count', t: world.mode === 'attract' ? 1 : 3.5, left: world.mode === 'attract' ? 90 : MATCH_T, winner: null });
}
function newBarrel() {
  let x, z;
  do { const a = rng() * Math.PI * 2, r = 8 + rng() * (R_SEA - 14); x = Math.cos(a) * r; z = Math.sin(a) * r; } while (blocked(x, z, 2.5));
  return { x: +x.toFixed(1), z: +z.toFixed(1), t: 0 };

// Run engine > sailing: throttle eases speed, helm turns faster under way, islands + ships + buoy ring push back
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function stepShip(p, dt) {

  const live = world.phase === 'play';
  const thr = live ? clamp(p.thr, -1, 1) : 0, turn = live ? clamp(p.turn, -1, 1) : 0;
  const want = thr >= 0 ? thr * MAXS : thr * MAXS * 0.35;
  p.speed += clamp(want - p.speed, -6 * dt, 3.2 * dt);
  // positive helm = starboard (right) = heading decreases
  p.h = wrap(p.h - turn * (0.35 + 0.75 * Math.min(Math.abs(p.speed) / MAXS, 1)) * dt * Math.sign(p.speed || 1));
  p.x += Math.sin(p.h) * p.speed * dt; p.z += Math.cos(p.h) * p.speed * dt;
  for (const [ix, iz, r] of ISLANDS) {
    const dx = p.x - ix, dz = p.z - iz, d = Math.hypot(dx, dz), rr = r + SHIP_R * 0.8;
    if (d < rr && d > 1e-3) { p.x = ix + (dx / d) * rr; p.z = iz + (dz / d) * rr; p.speed *= 0.6; }
  }
  const d = Math.hypot(p.x, p.z), lim = R_SEA - SHIP_R;
  if (d > lim) { p.x *= lim / d; p.z *= lim / d; p.speed *= 0.7; }
  if (!live) return;
  const fire = (side) => {
    // side: -1 port (left), +1 starboard (right)
    const fx = Math.sin(p.h), fz = Math.cos(p.h), rx = -fz, rz = fx;
    const sx = rx * side, sz = rz * side;
    for (let k = -1; k <= 1; k++) {
      const v = 15 + rng() * 2;
      balls.push({ owner: p.id, x: p.x + sx * 1.5 + fx * k * 1.1, y: 1.3, z: p.z + sz * 1.5 + fz * k * 1.1, vx: sx * v + fx * p.speed + (rng() - 0.5), vy: 6.5 + rng(), vz: sz * v + fz * p.speed + (rng() - 0.5), t: 0 });
    }

}
function shipCollide(ps) {

    if (!p.sunk && p.hp <= 2 && Math.random() < dt * 8) spray(g.position.x, 2.2, g.position.z, 1, C_SMOKE, 0.4, 2.5, -1, 1.6);
  }
  // cannonballs
  while (balls3d.length < balls.length) { const m = new THREE.Mesh(ballGeo, ironMat); m.castShadow = true; scene.add(m); balls3d.push(m); }
  balls3d.forEach((m, i) => { const b = balls[i]; m.visible = !!b; if (b) m.position.set(b.x, b.y, b.z); });
  while (barrels3d.length < barrels.length) { const m = new THREE.Mesh(barrelGeo, barrelMat); m.castShadow = true; scene.add(m); barrels3d.push(m); }
  barrels3d.forEach((m, i) => { const b = barrels[i]; m.visible = !!b && b.t <= 0; if (b) { m.position.set(b.x, wave(b.x, b.z, time) + 0.1, b.z); m.rotation.set(Math.PI / 2, time * 0.4 + i, Math.sin(time * 2 + i) * 0.2); } });
  for (let i = 0; i < P_N; i++) {
    if (pLife[i] <= 0) continue;
    pLife[i] -= dt; pVel[i * 3 + 1] -= pGrav[i] * dt;
    for (let k = 0; k < 3; k++) pPos[i * 3 + k] += pVel[i * 3 + k] * dt;
    if (pLife[i] <= 0 || pPos[i * 3 + 1] < -1) { pLife[i] = 0; pPos[i * 3 + 1] = -99; }
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  hud(dt);
  // camera: chase own ship from behind (C toggles high view); spectators and attract orbit the cove
  const me = ships.get(lobby.room?.me), mgp = me && ships3d.get(me.id);
  if (mgp && world.mode === 'match') {
    const fx = Math.sin(mgp.rotation.y), fz = Math.cos(mgp.rotation.y), far = camMode ? 34 : 15, up = camMode ? 34 : 9;
    camPos.lerp(_v.set(mgp.position.x - fx * far, up, mgp.position.z - fz * far), 1 - Math.exp(-dt * 3));
    camLook.lerp(_v.set(mgp.position.x + fx * 8, 0, mgp.position.z + fz * 8), 1 - Math.exp(-dt * 4));
  } else {
    const a = time * 0.05, fit = Math.max(1, 1.3 / camera.aspect);
    camPos.lerp(_v.set(Math.sin(a) * 70 * fit, 58 * fit, Math.cos(a) * 70 * fit), 1 - Math.exp(-dt * 2));
    camLook.lerp(_v.set(0, 0, 0), 1 - Math.exp(-dt * 2));
  }
  sun.position.copy(camLook).add(_v.set(30, 60, 20)); sun.target.position.copy(camLook);
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
