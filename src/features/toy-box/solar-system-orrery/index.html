<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pocket Orrery</title>
<style>
  :root { --ink: #e9ecf5; --dim: #8f97ad; --card: rgba(14, 17, 28, 0.72); --line: rgba(255, 255, 255, 0.1); --accent: #ffc35a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; user-select: none; }
  #title { top: 16px; left: 16px; padding: 12px 16px; }
  #title h1 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
  #title .date { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #title p { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
  #bar { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  #bar button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,0.08); }
  #bar button.on { border-color: rgba(255, 195, 90, 0.6); color: var(--accent); }
  #bar input[type=range] { width: 140px; accent-color: var(--accent); }
  #speed { font-size: 12px; color: var(--dim); min-width: 84px; font-variant-numeric: tabular-nums; }
  #chips { top: 16px; left: 50%; transform: translateX(-50%); padding: 5px; display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 360px); }
  #chips button { font: inherit; font-size: 12.5px; color: var(--dim); background: transparent; border: 0; padding: 6px 9px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #chips button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #chips button:hover, #chips button.on { color: var(--ink); background: rgba(255,255,255,0.08); }
  #info { top: 16px; right: 16px; padding: 14px 16px; width: 250px; opacity: 0; transform: translateY(-6px); transition: opacity 0.3s, transform 0.3s; pointer-events: none; }
  #info.show { opacity: 1; transform: none; }
  #info h2 { margin: 0 0 8px; font-size: 22px; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 10px; font-size: 12.5px; }
  #info dt { color: var(--dim); }
  #info dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  #info p { margin: 0; font-size: 12.5px; line-height: 1.5; color: #c9cfdf; }
  .label { position: fixed; left: 0; top: 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(233, 236, 245, 0.75); pointer-events: none; white-space: nowrap; transform: translate(-50%, -150%); text-shadow: 0 1px 4px #000; }
  body.nolabels .label { display: none; }
  @media (max-width: 760px) { #chips { top: auto; bottom: 120px; max-width: calc(100% - 32px); } #info { top: auto; bottom: 180px; right: 16px; } }
</style>
</head>
<body>
<div id="title" class="card"><h1>Pocket Orrery</h1><div class="date" id="date">2026-10-20</div><p>Planets start where they really are today · click one to fly there</p></div>
<div id="chips" class="card"></div>
<div id="info" class="card"><h2 id="iname"></h2><dl id="istats"></dl><p id="ifact"></p></div>
<div id="bar" class="card">
  <button id="overview" title="Esc">⤢ Overview</button>
  <button id="pause" title="Space">⏸ Pause</button>
  <button id="reverse">◀ Reverse</button>
  <input id="rate" type="range" min="0" max="100" value="50" />
  <span id="speed"></span>
  <button id="today">Today</button>
  <button id="labels" class="on">Labels</button>
  <button id="orbits" class="on">Orbits</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Scene > Renderer: deep space, bloom only catches the sun
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 5000);
const HOME_CAM = new THREE.Vector3(0, 95, 165);
camera.position.copy(HOME_CAM);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 600;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.45, 0.9));
composer.addPass(new OutputPass());
scene.add(new THREE.AmbientLight(0x8090b0, 0.12));
scene.add(new THREE.PointLight(0xfff4e6, 3.2, 0, 0));

// Textures > Noise: seeded 3D value noise + fbm, sampled on the sphere so maps wrap seamlessly
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const l = (a, b, t) => a + (b - a) * t;
  return l(
    l(l(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), l(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v),
    l(l(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), l(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v),
    w,
  );
}
function fbm(x, y, z, oct = 5) {
  let a = 0.5, f = 1, s = 0;
  for (let i = 0; i < oct; i++) { s += a * noise3(x * f, y * f, z * f); f *= 2.03; a *= 0.5; }
  return s / (1 - 0.5 ** oct);
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const sstep = (e0, e1, x) => { const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1); return t * t * (3 - 2 * t); };

// Textures > Painter: equirect canvas, fn(x,y,z,lat,lon) returns rgb or rgba per pixel
function paint(fn, W = 512, H = 256) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H), d = img.data;
  for (let j = 0; j < H; j++) {
    const lat = Math.PI / 2 - (j / (H - 1)) * Math.PI, cl = Math.cos(lat), y = Math.sin(lat);
    for (let i = 0; i < W; i++) {
      const lon = (i / W) * Math.PI * 2;
      const col = fn(cl * Math.cos(lon), y, cl * Math.sin(lon), lat, lon);
      const k = (j * W + i) * 4;
      d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = col[3] ?? 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
function banded(palette, freq, turb, seed) {
  return (x, y, z) => {
    const v = y + turb * (fbm(x * 3 + seed, y * 9, z * 3, 4) - 0.5);
    const b = 0.5 + 0.5 * Math.sin(v * freq) * Math.sin(v * freq * 0.37 + 1.3);
    const n = fbm(x * 8, y * 30, z * 8, 3);
    return mix(mix(palette[0], palette[1], b), palette[2], sstep(0.55, 0.8, n) * 0.5);
  };
}

// Textures > Planets: one recipe per world
const craters = Array.from({ length: 70 }, () => { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u); return [s * Math.cos(a), u, s * Math.sin(a), 0.03 + Math.random() ** 3 * 0.18]; });
const RECIPES = {
  mercury: (x, y, z) => {
    let v = 0.45 + 0.35 * fbm(x * 5, y * 5, z * 5);
    for (const [cx, cy, cz, r] of craters) {
      const d = Math.hypot(x - cx, y - cy, z - cz) / r;
      if (d < 1.15) v *= d < 0.85 ? 0.82 : 1.18;
    }
    return [v * 205, v * 196, v * 186];
  },
  venus: (x, y, z) => {
    const n = fbm(x * 2 + y * 3, y * 6, z * 2 - y * 3);
    return mix([215, 170, 95], [245, 225, 175], n);
  },
  earth: (x, y, z) => {
    const n = fbm(x * 2.2 + 7, y * 2.2, z * 2.2);
    if (Math.abs(y) > 0.9 - n * 0.12) return [235, 242, 250];
    if (n < 0.505) return mix([8, 30, 78], [26, 88, 150], sstep(0.3, 0.505, n));
    const dry = sstep(0.5, 0.85, 1 - Math.abs(y) * 2.2 + (fbm(x * 6, y * 6, z * 6) - 0.5));
    return mix(mix([46, 104, 44], [115, 120, 62], sstep(0.53, 0.65, n)), [196, 168, 110], dry * 0.8);
  },
  earthClouds: (x, y, z) => {
    const n = fbm(x * 3 + y * 1.5, y * 5, z * 3, 6);
    return [255, 255, 255, 235 * sstep(0.56, 0.76, n)];
  },
  mars: (x, y, z) => {
    if (Math.abs(y) > 0.93) return [240, 232, 225];
    const n = fbm(x * 3, y * 3, z * 3);
    return mix([196, 92, 48], [104, 50, 32], sstep(0.45, 0.7, n));
  },
  jupiter: (x, y, z, lat, lon) => {
    const base = banded([[225, 205, 172], [178, 128, 92], [240, 230, 210]], 21, 0.13, 3)(x, y, z);
    const dl = (lat + 0.38) / 0.07, dn = (((lon - 1.2 + Math.PI) % (Math.PI * 2)) - Math.PI) / 0.2;
    const spot = Math.exp(-(dl * dl + dn * dn));
    return mix(base, [196, 92, 60], spot * 0.9);
  },
  saturn: banded([[226, 205, 160], [196, 168, 120], [240, 228, 196]], 26, 0.05, 9),
  uranus: (x, y, z) => mix([150, 212, 222], [188, 232, 238], 0.5 + 0.5 * Math.sin(y * 9) * 0.3 + (fbm(x * 4, y * 4, z * 4) - 0.5) * 0.3),
  neptune: (x, y, z, lat, lon) => {
    const b = banded([[52, 88, 210], [82, 124, 232], [150, 190, 250]], 14, 0.1, 5)(x, y, z);
    const dl = (lat + 0.35) / 0.08, dn = (((lon - 3.5 + Math.PI) % (Math.PI * 2)) - Math.PI) / 0.18;
    return mix(b, [24, 36, 110], Math.exp(-(dl * dl + dn * dn)) * 0.85);
  },
};

// Scene > Starfield: colored points on a far shell
{
  const N = 7000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), c = new THREE.Color();
  for (let i = 0; i < N; i++) {
    const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u), r = 1500 + Math.random() * 400;
    // squash toward a band so it reads like a faint milky way
    const band = Math.random() < 0.45 ? 0.18 : 1;
    pos.set([s * Math.cos(a) * r, u * r * band, s * Math.sin(a) * r], i * 3);
    c.setHSL(0.55 + Math.random() * 0.2 - (Math.random() < 0.25 ? 0.5 : 0), 0.5, 0.55 + Math.random() * 0.4);
    col.set([c.r, c.g, c.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.2, sizeAttenuation: false, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }));
  stars.rotation.z = 0.5;
  scene.add(stars);
}

// Scene > Sun: animated simplex-noise plasma + additive corona sprite
const SUN_R = 6;
const sunMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
    void main(){ vP = position; vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position,1.); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uTime; varying vec3 vP; varying vec3 vN; varying vec3 vV;
    vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
    vec4 perm(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 tis(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){ const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
      vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx); vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g;
      vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy); vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i); vec4 p=perm(perm(perm(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
      float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx; vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y); vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.)); vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 nm=tis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3))); p0*=nm.x; p1*=nm.y; p2*=nm.z; p3*=nm.w;
      vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
      return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3))); }
    void main(){
      vec3 p = normalize(vP);
      float n = snoise(p*3. + uTime*0.08)*0.5 + snoise(p*9. - uTime*0.15)*0.3 + snoise(p*22. + uTime*0.3)*0.2;
      float cells = smoothstep(-0.4, 0.8, n);
      vec3 col = mix(vec3(1.0,0.32,0.04), vec3(1.0,0.82,0.38), cells);
      float limb = pow(max(dot(vN, vV), 0.), 0.45);
      gl_FragColor = vec4(col * (0.8 + 1.6*limb), 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 48), sunMat);
sun.userData = { key: 'sun' };
scene.add(sun);
function glowTexture(stops) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  for (const [o, col] of stops) gr.addColorStop(o, col);
  g.fillStyle = gr;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}
const corona = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture([[0, 'rgba(255,220,150,0.8)'], [0.2, 'rgba(255,170,60,0.32)'], [0.45, 'rgba(255,120,30,0.07)'], [1, 'rgba(255,90,0,0)']]), blending: THREE.AdditiveBlending, depthWrite: false }));
corona.scale.setScalar(SUN_R * 5);
scene.add(corona);

// Planets > Data: real mean longitude at J2000 + period, stylised radius/distance
const PLANETS = [
  { key: 'mercury', name: 'Mercury', color: '#b5aca3', r: 0.45, dist: 12, L0: 252.25, period: 87.969, rot: 58.6, tilt: 0.03, stats: { 'From Sun': '0.39 AU', Year: '88 days', Day: '58.6 days', Moons: '0' }, fact: 'A single solar day here lasts longer than half its year.' },
  { key: 'venus', name: 'Venus', color: '#e8c98a', r: 0.95, dist: 17, L0: 181.98, period: 224.701, rot: -243, tilt: 177.4, stats: { 'From Sun': '0.72 AU', Year: '225 days', Day: '243 days (backwards)', Moons: '0' }, fact: 'Hottest planet at about 465 °C, wrapped in sulfuric-acid clouds.' },
  { key: 'earth', name: 'Earth', color: '#4f8fe0', r: 1.0, dist: 23, L0: 100.46, period: 365.256, rot: 0.9973, tilt: 23.44, stats: { 'From Sun': '1.00 AU', Year: '365.25 days', Day: '23.9 hours', Moons: '1' }, fact: 'The only world known to have liquid water oceans on its surface.' },
  { key: 'mars', name: 'Mars', color: '#d0683a', r: 0.6, dist: 30, L0: 355.45, period: 686.98, rot: 1.026, tilt: 25.19, stats: { 'From Sun': '1.52 AU', Year: '687 days', Day: '24.6 hours', Moons: '2' }, fact: 'Olympus Mons is about two and a half times taller than Everest.' },
  { key: 'jupiter', name: 'Jupiter', color: '#d8b48c', r: 3.3, dist: 52, L0: 34.4, period: 4332.59, rot: 0.4135, tilt: 3.13, stats: { 'From Sun': '5.20 AU', Year: '11.9 years', Day: '9.9 hours', Moons: '95+' }, fact: 'The Great Red Spot is a storm wider than the whole Earth.' },
  { key: 'saturn', name: 'Saturn', color: '#e6d3a3', r: 2.8, dist: 70, L0: 49.94, period: 10759.22, rot: 0.444, tilt: 26.73, stats: { 'From Sun': '9.58 AU', Year: '29.5 years', Day: '10.7 hours', Moons: '274' }, fact: 'Less dense than water: in a big enough bathtub it would float.' },
  { key: 'uranus', name: 'Uranus', color: '#9fdbe6', r: 1.9, dist: 86, L0: 313.23, period: 30685.4, rot: -0.718, tilt: 97.77, stats: { 'From Sun': '19.2 AU', Year: '84 years', Day: '17.2 hours', Moons: '29' }, fact: 'Tipped 98° on its side, so it rolls around the Sun like a ball.' },
  { key: 'neptune', name: 'Neptune', color: '#4f74e8', r: 1.85, dist: 100, L0: 304.88, period: 60189, rot: 0.671, tilt: 28.32, stats: { 'From Sun': '30.1 AU', Year: '165 years', Day: '16.1 hours', Moons: '16' }, fact: 'Winds here hit 2,100 km/h, the fastest in the solar system.' },
];
const SUN_INFO = { key: 'sun', name: 'Sun', color: '#ffc35a', r: SUN_R, stats: { Type: 'G2V star', Age: '4.6 billion yrs', Surface: '5,500 °C', Mass: '99.86% of system' }, fact: 'Light leaving its surface right now reaches Earth in about 8 minutes 20 seconds.' };

// Planets > Build: orbit group, tilt group, spinning sphere, labels, orbit lines
const pickables = [sun];
const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });
for (const p of PLANETS) {
  p.group = new THREE.Group();
  scene.add(p.group);
  p.tiltGroup = new THREE.Group();
  p.tiltGroup.rotation.z = THREE.MathUtils.degToRad(p.tilt);
  p.group.add(p.tiltGroup);
  p.mesh = new THREE.Mesh(new THREE.SphereGeometry(p.r, 64, 32), new THREE.MeshStandardMaterial({ map: paint(RECIPES[p.key]), roughness: 0.92, metalness: 0 }));
  p.mesh.userData = { key: p.key };
  p.tiltGroup.add(p.mesh);
  pickables.push(p.mesh);
  const pts = [];
  for (let i = 0; i < 256; i++) { const a = (i / 256) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * p.dist, 0, -Math.sin(a) * p.dist)); }
  p.orbit = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), orbitMat.clone());
  scene.add(p.orbit);
}
const byKey = Object.fromEntries(PLANETS.map((p) => [p.key, p]));
byKey.sun = Object.assign(SUN_INFO, { group: sun, mesh: sun });

// Planets > Earth extras: cloud shell + moon
const earth = byKey.earth;
const clouds = new THREE.Mesh(new THREE.SphereGeometry(earth.r * 1.025, 64, 32), new THREE.MeshStandardMaterial({ map: paint(RECIPES.earthClouds), transparent: true, depthWrite: false, roughness: 1 }));
earth.tiltGroup.add(clouds);
const atmo = new THREE.Mesh(new THREE.SphereGeometry(earth.r * 1.05, 48, 24), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vN = normalize(normalMatrix*normal); vec4 mv = modelViewMatrix*vec4(position,1.); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
  fragmentShader: 'varying vec3 vN; varying vec3 vV; void main(){ float r = pow(1. - max(dot(vN, vV), 0.), 2.5); gl_FragColor = vec4(0.35, 0.6, 1.0, r * 0.75); }',
}));
earth.group.add(atmo);
const moonPivot = new THREE.Group();
earth.group.add(moonPivot);
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.27, 32, 16), new THREE.MeshStandardMaterial({ map: paint(RECIPES.mercury, 256, 128), roughness: 1 }));
moon.position.x = 2.4;
moonPivot.add(moon);

// Planets > Saturn rings: radial-banded alpha texture on a ring with radial UVs
{
  const sat = byKey.saturn, inner = sat.r * 1.25, outer = sat.r * 2.3;
  const geo = new THREE.RingGeometry(inner, outer, 160, 1);
  const uv = geo.attributes.uv, pos = geo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < uv.count; i++) { v.fromBufferAttribute(pos, i); uv.setXY(i, (v.length() - inner) / (outer - inner), 0.5); }
  const c = document.createElement('canvas');
  c.width = 512; c.height = 4;
  const g = c.getContext('2d');
  for (let x = 0; x < 512; x++) {
    const t = x / 512;
    const gap = t > 0.62 && t < 0.67 ? 0.05 : 1;
    const a = (0.35 + 0.55 * fbm(t * 40, 0.5, 0.5, 3)) * gap * sstep(0, 0.06, t) * (1 - sstep(0.9, 1, t));
    const tone = 180 + 60 * noise3(t * 90, 1, 1);
    g.fillStyle = `rgba(${tone + 20},${tone},${tone - 30},${a})`;
    g.fillRect(x, 0, 1, 4);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const rings = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false, roughness: 1 }));
  rings.rotation.x = -Math.PI / 2;
  sat.tiltGroup.add(rings);
}

// Scene > Asteroid belt: instanced lumpy rocks, whole belt turns at ~4.6 yr period
const belt = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.09, 0), new THREE.MeshStandardMaterial({ color: 0x8c8378, roughness: 1, flatShading: true }), 2600);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < belt.count; i++) {
    const a = Math.random() * Math.PI * 2, r = 36 + (Math.random() + Math.random() + Math.random()) * 2.4;
    p.set(Math.cos(a) * r, (Math.random() - 0.5) * 1.4, Math.sin(a) * r);
    q.setFromEuler(e.set(Math.random() * 6, Math.random() * 6, Math.random() * 6));
    s.set(0.5 + Math.random() * 1.6, 0.5 + Math.random(), 0.5 + Math.random() * 1.3).multiplyScalar(Math.random() < 0.04 ? 2.2 : 1);
    belt.setMatrixAt(i, m.compose(p, q, s));
  }
}
scene.add(belt);

// Scene > Comet: eccentric inclined orbit, ion tail streams away from the sun
const comet = { a: 62, e: 0.86, period: 2600, incl: 0.32, node: 1.1, peri: 0.6 };
const cometHead = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture([[0, 'rgba(230,250,255,1)'], [0.2, 'rgba(150,210,255,0.6)'], [1, 'rgba(80,160,255,0)']]), blending: THREE.AdditiveBlending, depthWrite: false }));
cometHead.scale.setScalar(2.2);
scene.add(cometHead);
const TAIL = 900;
const tailPos = new Float32Array(TAIL * 3), tailCol = new Float32Array(TAIL * 3), tailVel = new Float32Array(TAIL * 3), tailAge = new Float32Array(TAIL).fill(99);
const tailGeo = new THREE.BufferGeometry();
tailGeo.setAttribute('position', new THREE.BufferAttribute(tailPos, 3));
tailGeo.setAttribute('color', new THREE.BufferAttribute(tailCol, 3));
const tail = new THREE.Points(tailGeo, new THREE.PointsMaterial({ size: 0.45, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
tail.frustumCulled = false;
scene.add(tail);
let tailNext = 0;
const _cp = new THREE.Vector3();
function cometPosition(days, out) {
  const M = ((days / comet.period) * Math.PI * 2) % (Math.PI * 2);
  let E = M;
  for (let i = 0; i < 6; i++) E -= (E - comet.e * Math.sin(E) - M) / (1 - comet.e * Math.cos(E));
  const x = comet.a * (Math.cos(E) - comet.e), y = comet.a * Math.sqrt(1 - comet.e ** 2) * Math.sin(E);
  out.set(x, 0, -y).applyAxisAngle(new THREE.Vector3(0, 1, 0), comet.peri).applyAxisAngle(new THREE.Vector3(1, 0, 0), comet.incl).applyAxisAngle(new THREE.Vector3(0, 1, 0), comet.node);
  return out;
}

// HUD > Labels: html tags projected each frame
const labels = [byKey.sun, ...PLANETS].map((p) => {
  const el = document.createElement('div');
  el.className = 'label';
  el.textContent = p.name;
  document.body.appendChild(el);
  return { p, el };
});

// HUD > Chips: one per body, also keys 0-8
const chips = document.getElementById('chips');
[byKey.sun, ...PLANETS].forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<i style="background:${p.color}"></i>${p.name}`;
  b.title = `Key ${i}`;
  b.onclick = () => focusOn(p.key);
  p.chip = b;
  chips.appendChild(b);
});

// Camera > Focus: ease to a body, then ride along with it while orbit stays free
let focus = null, tween = null;
const _wp = new THREE.Vector3(), _prev = new THREE.Vector3(), _dir = new THREE.Vector3();
function bodyPos(p, out) { return p.key === 'sun' ? out.set(0, 0, 0) : p.group.getWorldPosition(out); }
function focusOn(key) {
  const p = key && byKey[key];
  for (const q of [byKey.sun, ...PLANETS]) q.chip.classList.toggle('on', q === p);
  for (const q of PLANETS) q.orbit.material.opacity = q === p ? 0.35 : 0.1;
  const info = document.getElementById('info');
  if (!p) {
    focus = null;
    info.classList.remove('show');
    tween = { t: 0, fromCam: camera.position.clone(), fromTgt: controls.target.clone(), toCam: () => HOME_CAM, toTgt: () => new THREE.Vector3() };
    return;
  }
  focus = p;
  document.getElementById('iname').textContent = p.name;
  document.getElementById('istats').innerHTML = Object.entries(p.stats).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('ifact').textContent = p.fact;
  info.classList.add('show');
  bodyPos(p, _wp);
  // approach from a three-quarter sunward angle so the day/night terminator shows
  _dir.copy(_wp).normalize().negate().applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.95);
  if (p.key === 'sun') _dir.set(0, 0.35, 1);
  _dir.y = 0.35;
  _dir.normalize();
  const dist = p.r * (p.key === 'saturn' ? 7 : p.key === 'sun' ? 6 : 5.5);
  tween = { t: 0, fromCam: camera.position.clone(), fromTgt: controls.target.clone(), toCam: () => bodyPos(p, new THREE.Vector3()).addScaledVector(_dir, dist), toTgt: () => bodyPos(p, new THREE.Vector3()) };
}

// Interaction > Pointer: click body to focus, hover cursor
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downXY = null;
function pick(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  return h ? h.object.userData.key : null;
}
renderer.domElement.addEventListener('pointerdown', (e) => (downXY = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downXY || Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]) > 5) return;
  const k = pick(e);
  if (k) focusOn(k);
});
renderer.domElement.addEventListener('pointermove', (e) => { renderer.domElement.style.cursor = pick(e) ? 'pointer' : 'grab'; });

// HUD > Time controls: log-scale speed, pause, reverse, jump to today
const J2000 = Date.UTC(2000, 0, 1, 12);
const nowDays = () => (Date.now() - J2000) / 86400000;
let days = nowDays(), paused = false, reverse = false;
const rateEl = document.getElementById('rate'), speedEl = document.getElementById('speed');
const daysPerSec = () => 10 ** (-2 + rateEl.value * 0.05);
function showSpeed() {
  const d = daysPerSec();
  speedEl.textContent = d < 1 ? `${(d * 24).toFixed(1)} h/s` : d < 365 ? `${d.toFixed(d < 10 ? 1 : 0)} days/s` : `${(d / 365.25).toFixed(1)} yrs/s`;
}
rateEl.oninput = showSpeed;
showSpeed();
const pauseBtn = document.getElementById('pause');
function togglePause() { paused = !paused; pauseBtn.textContent = paused ? '▶ Play' : '⏸ Pause'; pauseBtn.classList.toggle('on', paused); }
pauseBtn.onclick = togglePause;
document.getElementById('reverse').onclick = (e) => { reverse = !reverse; e.currentTarget.classList.toggle('on', reverse); };
document.getElementById('today').onclick = () => (days = nowDays());
document.getElementById('overview').onclick = () => focusOn(null);
document.getElementById('labels').onclick = (e) => { document.body.classList.toggle('nolabels'); e.currentTarget.classList.toggle('on'); };
document.getElementById('orbits').onclick = (e) => { const on = e.currentTarget.classList.toggle('on'); for (const p of PLANETS) p.orbit.visible = on; };
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.key === 'Escape') focusOn(null);
  const n = Number(e.key);
  if (e.key.length === 1 && n >= 0 && n <= 8) focusOn(n === 0 ? 'sun' : PLANETS[n - 1].key);
});
const dateEl = document.getElementById('date');

// Run engine: advance sim days, place bodies, comet tail, camera tween/follow, labels
const clock = new THREE.Clock();
const _lp = new THREE.Vector3(), _away = new THREE.Vector3();
function place(dd) {
  for (const p of PLANETS) {
    const L = THREE.MathUtils.degToRad(p.L0) + ((dd - 0) / p.period) * Math.PI * 2;
    p.group.position.set(Math.cos(L) * p.dist, 0, -Math.sin(L) * p.dist);
  }
  belt.rotation.y = (dd / 1680) * Math.PI * 2;
  moonPivot.rotation.y = (dd / 27.32) * Math.PI * 2;
}
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const step = paused ? 0 : daysPerSec() * dt * (reverse ? -1 : 1);
  days += step;
  if (focus) bodyPos(focus, _prev);
  place(days);
  dateEl.textContent = new Date(J2000 + days * 86400000).toISOString().slice(0, 10);
  for (const p of PLANETS) {
    // cap spin per frame so fast time does not strobe
    const spin = THREE.MathUtils.clamp((step / p.rot) * Math.PI * 2, -0.25, 0.25);
    p.mesh.rotation.y += spin + (paused ? 0 : 0.0015 * Math.sign(p.rot));
  }
  clouds.rotation.y += THREE.MathUtils.clamp(step * 5, -0.3, 0.3) + 0.0004;
  sunMat.uniforms.uTime.value = t;
  sun.rotation.y += 0.0008;
  corona.material.rotation = t * 0.02;

  // comet: head + particles pushed anti-sunward, faster and denser near perihelion
  cometPosition(days, _cp);
  cometHead.position.copy(_cp);
  const rSun = _cp.length(), heat = THREE.MathUtils.clamp(28 / rSun, 0.15, 3);
  cometHead.scale.setScalar(1.2 + heat * 0.9);
  _away.copy(_cp).normalize();
  const emit = Math.floor(heat * 6);
  for (let k = 0; k < emit; k++) {
    const i = tailNext;
    tailNext = (tailNext + 1) % TAIL;
    tailAge[i] = 0;
    tailPos.set([_cp.x + (Math.random() - 0.5) * 0.4, _cp.y + (Math.random() - 0.5) * 0.4, _cp.z + (Math.random() - 0.5) * 0.4], i * 3);
    const sp = (4 + Math.random() * 6) * heat;
    tailVel.set([_away.x * sp + (Math.random() - 0.5), _away.y * sp + (Math.random() - 0.5), _away.z * sp + (Math.random() - 0.5)], i * 3);
  }
  for (let i = 0; i < TAIL; i++) {
    tailAge[i] += dt;
    const life = Math.max(0, 1 - tailAge[i] / 2.2);
    tailPos[i * 3] += tailVel[i * 3] * dt; tailPos[i * 3 + 1] += tailVel[i * 3 + 1] * dt; tailPos[i * 3 + 2] += tailVel[i * 3 + 2] * dt;
    tailCol[i * 3] = 0.55 * life; tailCol[i * 3 + 1] = 0.8 * life; tailCol[i * 3 + 2] = 1.0 * life;
  }
  tailGeo.attributes.position.needsUpdate = tailGeo.attributes.color.needsUpdate = true;

  // camera: tween in, then carry the camera along with the focused body
  if (tween) {
    tween.t = Math.min(tween.t + dt / 1.6, 1);
    const e = tween.t < 0.5 ? 4 * tween.t ** 3 : 1 - (-2 * tween.t + 2) ** 3 / 2;
    camera.position.lerpVectors(tween.fromCam, tween.toCam(), e);
    controls.target.lerpVectors(tween.fromTgt, tween.toTgt(), e);
    controls.enabled = false;
    if (tween.t >= 1) { tween = null; controls.enabled = true; }
  } else if (focus) {
    bodyPos(focus, _wp);
    camera.position.add(_lp.subVectors(_wp, _prev));
    controls.target.copy(_wp);
  }
  controls.minDistance = focus ? focus.r * 1.6 : 10;
  controls.update();

  for (const { p, el } of labels) {
    bodyPos(p, _wp);
    _wp.y += p.r;
    _wp.project(camera);
    if (_wp.z > 1) { el.style.display = 'none'; continue; }
    el.style.display = '';
    el.style.transform = `translate(${(_wp.x * 0.5 + 0.5) * innerWidth}px, ${(-_wp.y * 0.5 + 0.5) * innerHeight}px) translate(-50%, -140%)`;
    el.style.opacity = focus === p ? 0 : 1;
  }
  composer.render();
  requestAnimationFrame(loop);
}
place(days);
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
