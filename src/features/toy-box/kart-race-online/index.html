<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Kart Party GP</title>
<style>
  :root { --ink: #fff; --card: rgba(14, 18, 30, 0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; user-select: none; }
  #race { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #race .pos { font-size: 46px; font-weight: 900; line-height: 1; color: #ffd23f; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.3); }
  #race .pos small { font-size: 18px; color: #fff; opacity: 0.7; }
  #race .meta { font-size: 13px; margin-top: 4px; opacity: 0.9; font-variant-numeric: tabular-nums; }
  #list { top: 110px; left: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 150px; }
  #list .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #list .row b { width: 18px; opacity: 0.6; }
  #list .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #list .row span { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .row.me span { color: #ffd23f; font-weight: 800; }
  #item { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 16px; display: none; place-items: center; font-size: 40px; background: var(--card); border: 3px solid rgba(255, 255, 255, 0.5); margin-top: 52px; }
  #big { position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(36px, 8vw, 86px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.3em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.85; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  #map { position: fixed; right: 14px; bottom: 14px; border-radius: 12px; background: var(--card); }
  #results { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 18px 22px; min-width: 300px; display: none; }
  #results h2 { margin: 0 0 10px; }
  #results .row { display: flex; gap: 10px; padding: 3px 0; font-size: 15px; }
  #results .row b { width: 28px; }
  #results .row span { flex: 1; }
  @media (pointer: coarse) { #hint { display: none; } #map { bottom: auto; top: 70px; } }
</style>
</head>
<body>
<div id="race" class="card"><div class="pos" id="pos">1<small>/1</small></div><div class="meta" id="meta"></div></div>
<div id="list" class="card"></div>
<div id="item"></div>
<div id="big"></div>
<div id="hint" class="card"><b>W/S</b> gas/brake · <b>A/D</b> steer · <b>Space</b> drift (hold, release = boost) · <b>E / Shift</b> use item · <b>C</b> camera · <b>R</b> back on track</div>
<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>
<canvas id="map" width="190" height="150"></canvas>
<div id="results" class="card"></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createLobby } from '../common/room-lobby.js';
import { startTicker } from '../common/room-client.js';
import { createNameSync } from '../common/snapshot-names.js';
import { createKartSim, STEP, LAPS, ITEM_ICON } from './kart-sim.js';
import { W, NS } from './kart-track.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { createSnapPacing } from '../common/snap-pacing.js';
import { createPrediction, blendAngle } from '../common/own-prediction.js';
import { createTouchPad } from '../common/touch-joystick.js';
import { createGameAudio } from '../common/game-audio.js';
import { keyId, trackKeys } from '../common/key-state.js';

// Scene > Renderer, camera, sky, sun that follows the camera focus
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec5ff);
scene.fog = new THREE.Fog(0x8ec5ff, 140, 420);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 900);
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x4f7a3a, 1.4));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 160 });
scene.add(sun, sun.target);

// Textures > canvas helpers: asphalt, curbs, grass, checker, item box
function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const asphaltTex = canvasTex(256, 512, (g, w, h) => {
  g.fillStyle = '#4a4c52'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const v = 60 + Math.random() * 40; g.fillStyle = `rgba(${v},${v},${v + 4},0.5)`; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
  g.fillStyle = '#f2f2f2'; g.fillRect(w / 2 - 3, 40, 6, 180); g.fillRect(w / 2 - 3, 296, 6, 180); g.fillRect(6, 0, 5, h); g.fillRect(w - 11, 0, 5, h);
});
const curbTex = canvasTex(64, 128, (g, w, h) => { g.fillStyle = '#e8312f'; g.fillRect(0, 0, w, h / 2); g.fillStyle = '#f6f6f6'; g.fillRect(0, h / 2, w, h / 2); });
const grassTex = canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#6aa84a'; g.fillRect(0, 0, w, h); for (let i = 0; i < 4000; i++) { g.fillStyle = `hsla(${90 + Math.random() * 25},45%,${30 + Math.random() * 18}%,0.5)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); } }, [120, 120]);
const checkerTex = canvasTex(256, 64, (g, w, h) => { const s = 16; for (let x = 0; x < w / s; x++) for (let y = 0; y < h / s; y++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * s, y * s, s, s); } });
const boxTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, h); ['#ff5a5f', '#ffd23f', '#5ee07a', '#3fa7ff', '#c77dff'].forEach((c, i) => gr.addColorStop(i / 4, c)); g.fillStyle = gr; g.fillRect(0, 0, w, h); g.fillStyle = 'rgba(255,255,255,0.9)'; g.font = '900 86px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', w / 2, h / 2 + 4); });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// Track > meshes for the sim's circuit data (kart-track.js): road + curbs + gantry + crowd + trees + pads + item boxes
const trackGroup = new THREE.Group();
scene.add(trackGroup);
let track = null, trackCrowd = null;
function ribbon(off0, off1, mat, y, vScale) {
  const pos = [], uv = [], idx = [];
  let acc = 0;
  for (let i = 0; i <= NS; i++) {
    const k = i % NS, P = track.P[k], S = track.Sd[k];
    if (i > 0) acc += track.P[k].distanceTo(track.P[(i - 1) % NS]);
    pos.push(P.x + S.x * off0, y, P.z + S.z * off0, P.x + S.x * off1, y, P.z + S.z * off1);
    uv.push(0, acc / vScale, 1, acc / vScale);
    if (i < NS) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true;
  return m;
}
let builtSeed = null;
const boxMeshes = [];
// rebuilt only when the sim moved to a new seed
function showTrack() {
  if (builtSeed === sim.world.seed) return;
  builtSeed = sim.world.seed;
  track = sim.track;
  for (const c of [...trackGroup.children]) trackGroup.remove(c);
  trackGroup.add(ribbon(-W / 2, W / 2, new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92 }), 0.02, 22));
  const curbMat = new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.7 });
  trackGroup.add(ribbon(W / 2, W / 2 + 1.4, curbMat, 0.04, 3), ribbon(-W / 2 - 1.4, -W / 2, curbMat, 0.04, 3));
  const P0 = track.P[0], ang = Math.atan2(track.Tn[0].x, track.Tn[0].z);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(W, 2).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: checkerTex }));
  line.position.set(P0.x, 0.05, P0.z); line.rotation.y = ang;
  trackGroup.add(line);
  const gantry = new THREE.Group(), gm = new THREE.MeshStandardMaterial({ color: 0x2a2d3a });
  for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.7, 8, 0.7), gm); p.position.set(s * (W / 2 + 2), 4, 0); p.castShadow = true; gantry.add(p); }
  const banner = new THREE.Mesh(new THREE.BoxGeometry(W + 4.8, 1.8, 0.4), [gm, gm, gm, gm, new THREE.MeshStandardMaterial({ map: canvasTex(512, 64, (g, w, h) => { g.fillStyle = '#1a6cff'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; g.font = '900 42px system-ui'; g.textAlign = 'center'; g.fillText('KART PARTY GP', w / 2, 47); }) }), gm]);
  banner.position.y = 8; gantry.add(banner);
  gantry.position.set(P0.x, 0, P0.z); gantry.rotation.y = ang;
  trackGroup.add(gantry);
  const stand = new THREE.Group(), standMat = new THREE.MeshStandardMaterial({ color: 0xc8ccd6 });
  for (let r = 0; r < 5; r++) { const step = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8 + r * 0.8, 50), standMat); step.position.set(r * 1.2, (0.8 + r * 0.8) / 2, 0); step.castShadow = step.receiveShadow = true; stand.add(step); }
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(0.45, 0.8, 0.45), new THREE.MeshStandardMaterial(), 5 * 50);
  const m = new THREE.Matrix4(), col = new THREE.Color();
  let ci = 0;
  for (let r = 0; r < 5; r++) for (let z = 0; z < 50; z++) { m.makeTranslation(r * 1.2, 0.8 + r * 0.8 + 0.4, -24.5 + z); crowd.setMatrixAt(ci, m); crowd.setColorAt(ci++, col.setHSL(rng(), 0.7, 0.55)); }
  stand.add(crowd);
  stand.position.copy(P0).addScaledVector(track.Sd[0], W / 2 + 5);
  stand.rotation.y = ang;
  trackGroup.add(stand);
  trackCrowd = crowd;
  const nT = 500, trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.4, 2.5, 6).translate(0, 1.25, 0), new THREE.MeshStandardMaterial({ color: 0x6b4a30 }), nT);
  const tops = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.2, 0).translate(0, 4, 0), new THREE.MeshStandardMaterial({ flatShading: true }), nT);
  let placed = 0;
  for (let tries = 0; placed < nT && tries < 8000; tries++) {
    const x = (rng() - 0.5) * 520, z = (rng() - 0.5) * 420;
    let nearD = Infinity;
    for (let i = 0; i < NS; i += 8) nearD = Math.min(nearD, (track.P[i].x - x) ** 2 + (track.P[i].z - z) ** 2);
    if (nearD < (W / 2 + 8) ** 2) continue;
    const s = 0.8 + rng() * 0.9;
    m.makeScale(s, s, s).setPosition(x, 0, z);
    trunks.setMatrixAt(placed, m); tops.setMatrixAt(placed, m);
    tops.setColorAt(placed, col.setHSL(0.26 + rng() * 0.1, 0.5, 0.3 + rng() * 0.12));
    placed++;
  }
  trunks.count = tops.count = placed;
  trunks.castShadow = tops.castShadow = true;
  trackGroup.add(trunks, tops);
  const padMat = new THREE.MeshBasicMaterial({ map: canvasTex(64, 128, (g, w, h) => { g.fillStyle = '#1aa6ff'; g.fillRect(0, 0, w, h); g.fillStyle = '#bff0ff'; for (let y = 0; y < 3; y++) { g.beginPath(); g.moveTo(8, 40 + y * 34); g.lineTo(w / 2, 14 + y * 34); g.lineTo(w - 8, 40 + y * 34); g.lineTo(w - 8, 52 + y * 34); g.lineTo(w / 2, 26 + y * 34); g.lineTo(8, 52 + y * 34); g.fill(); } }), transparent: true });
  for (const p of track.pads) {
    const pad = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 5.5).rotateX(-Math.PI / 2), padMat);
    pad.position.set(p.x, 0.06, p.z); pad.rotation.y = Math.atan2(track.Tn[p.i].x, track.Tn[p.i].z) + Math.PI; // texture chevrons face local -Z
    trackGroup.add(pad);
  }
  boxMeshes.forEach((b) => scene.remove(b));
  boxMeshes.length = 0;
  for (const b of track.boxes) {
    const mesh = new THREE.Mesh(new RoundedBoxGeometry(1.5, 1.5, 1.5, 2, 0.2), new THREE.MeshStandardMaterial({ map: boxTex, transparent: true, opacity: 0.92, emissive: 0xffffff, emissiveIntensity: 0.15 }));
    mesh.position.set(b.x, 1.4, b.z); mesh.castShadow = true;
    scene.add(mesh); boxMeshes.push(mesh);
  }
  drawMapBase();
}

// Karts > Model: chunky body, driver helmet in player color, four wheels, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(14,18,30,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(2.6, 0.65, 1); s.position.y = 2.6; s.renderOrder = 5;
  return s;
}
const wGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.45, 16).rotateZ(Math.PI / 2);
const dark = new THREE.MeshStandardMaterial({ color: 0x1d1f26, roughness: 0.6 });
function makeKart(p) {
  const car = new THREE.Group(), body3 = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.35, metalness: 0.2 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.9, 0.6, 3.4, 3, 0.2), paint); body.position.y = 0.6;
  const nose = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.35, 1.1, 2, 0.15), paint); nose.position.set(0, 0.55, 1.9);
  const seat = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.7, 0.9, 2, 0.15), dark); seat.position.set(0, 1.05, -0.5);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12), paint); head.position.set(0, 1.58, -0.2);
  const visor = new THREE.Mesh(new THREE.SphereGeometry(0.31, 16, 8, -1, 2, 1.2, 0.7), new THREE.MeshStandardMaterial({ color: 0x15233a, metalness: 0.6, roughness: 0.1 })); visor.position.copy(head.position);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.12, 0.6), paint); wing.position.set(0, 1.25, -1.75);
  body3.add(body, nose, seat, head, visor, wing);
  const wheels = [];
  for (const [x, z, front] of [[-1.05, 1.15, 1], [1.05, 1.15, 1], [-1.05, -1.2, 0], [1.05, -1.2, 0]]) {
    const piv = new THREE.Group(); piv.position.set(x, 0.42, z);
    const w = new THREE.Mesh(wGeo, dark); piv.add(w); body3.add(piv); wheels.push({ piv, w, front });
  }
  body3.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  car.add(body3, nameTag(p.nick, p.color));
  car.userData = { body3, wheels, tag: car.children[1] };
  scene.add(car);
  return car;
}
// Items > meshes: bananas, shells
const bananaGeo = new THREE.TorusGeometry(0.5, 0.16, 8, 14, Math.PI * 1.1), bananaMat = new THREE.MeshStandardMaterial({ color: 0xffd93b, roughness: 0.5 });
const shellGeo = new THREE.SphereGeometry(0.55, 14, 10), shellMat = new THREE.MeshStandardMaterial({ color: 0x29c45a, roughness: 0.3 });
const pools = { banana: [], shell: [] };
function poolMesh(kind, i) {
  const arr = pools[kind];
  while (arr.length <= i) { const m = new THREE.Mesh(kind === 'banana' ? bananaGeo : shellGeo, kind === 'banana' ? bananaMat : shellMat); m.castShadow = true; scene.add(m); arr.push(m); }
  return arr[i];
}

// FX > skid marks ring buffer + smoke points
const MAXSKID = 6000;
const skid = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.42, 0.55).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }), MAXSKID);
skid.count = 0; skid.frustumCulled = false; scene.add(skid);
let skidCount = 0;
const _sm = new THREE.Matrix4(), _q = new THREE.Quaternion(), _up = new THREE.Vector3(0, 1, 0), _one = new THREE.Vector3(1, 1, 1), _v = new THREE.Vector3();
function addSkid(x, z, h) { _q.setFromAxisAngle(_up, h); _sm.compose(_v.set(x, 0.05, z), _q, _one); skid.setMatrixAt(skidCount % MAXSKID, _sm); skidCount++; skid.count = Math.min(skidCount, MAXSKID); skid.instanceMatrix.needsUpdate = true; }
const SMOKE = 400;
const smokeGeo = new THREE.BufferGeometry();
const smokePos = new Float32Array(SMOKE * 3), smokeLife = new Float32Array(SMOKE), smokeVel = new Float32Array(SMOKE * 3);
smokeGeo.setAttribute('position', new THREE.BufferAttribute(smokePos, 3));
smokeGeo.setAttribute('life', new THREE.BufferAttribute(smokeLife, 1));
const smoke = new THREE.Points(smokeGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `attribute float life; varying float vL; void main(){ vL = life; vec4 mv = modelViewMatrix * vec4(position,1.); gl_PointSize = (1.0 - life) * 260. / -mv.z + 20. / -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `varying float vL; void main(){ if (vL <= 0.) discard; float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(vec3(0.92), smoothstep(0.5, 0.0, d) * vL * 0.35); }`,
}));
smoke.frustumCulled = false; scene.add(smoke);
let smokeNext = 0;
function puff(x, z, vx, vz, y = 0.4) { const i = smokeNext++ % SMOKE; smokePos.set([x, y, z], i * 3); smokeVel.set([vx * 0.2 + (Math.random() - 0.5), 0.8 + Math.random(), vz * 0.2 + (Math.random() - 0.5)], i * 3); smokeLife[i] = 1; }

// Audio > own engine drone + one-shots
let eng1, eng2, engGain;
// kart engine, pitch + gain driven by speed
const gameAudio = createGameAudio({
  onUnlock: (ctx) => {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    engGain = ctx.createGain(); engGain.gain.value = 0;
    eng1 = ctx.createOscillator(); eng1.type = 'sawtooth'; eng2 = ctx.createOscillator(); eng2.type = 'square';
    eng1.connect(lp); eng2.connect(lp); lp.connect(engGain).connect(ctx.destination); eng1.start(); eng2.start();
  },
});
const { tone, noise } = gameAudio;
const sfx = {
  box() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, 0.08, 0.08, 'square'), i * 45)); },
  boost() { tone(200, 900, 0.45, 0.14); },
  hit() { noise(0.5, 0.4, 1800, 200); tone(400, 120, 0.4, 0.15, 'triangle'); },
  throw() { tone(600, 300, 0.15, 0.1, 'triangle'); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.18, 0.12, 'square'); },
  lap() { tone(660, 990, 0.2, 0.12, 'square'); },
};

// Game > World: race rules live in kart-sim.js (the relay server runs the same code in matches)
const sim = createKartSim();
const world = sim.world;
const karts3d = new Map();
const rng = Math.random;
function startAttract() { sim.startAttract(); showTrack(); }

// Multiplayer > Lobby: track seed in start packet
const lobby = createLobby({
  game: 'kart-party', title: 'Kart Party GP', emoji: '🏎️', accent: '#ffd23f',
  blurb: 'Up to 14 karts, 3 laps, a fresh circuit every race. Drift with Space, grab ? boxes for boosts, bananas and homing shells.',
  maxBots: 13, defaultBots: 5, minPlayers: 2,
  note: 'Up to 14 karts per room (humans + bots). Phones get touch pedals.',
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the race; every page (lobby host too) drives its own kart as a guest
  onStart({ seed, bots }) {
    sim.clearKarts();
    Object.assign(world, { mode: 'match', phase: 'count', t: 3.5 });
    sim.loadTrack(seed); showTrack();
    skidCount = 0; skid.count = 0;
    ['race', 'list', 'top'].forEach((id) => (document.getElementById(id).style.display = id === 'top' ? 'flex' : 'block'));
    document.getElementById('results').style.display = 'none';
    syncTop();
    serverMatch.start({ bots, seed });
  },
  onLobby() {
    serverMatch.stop();
    ['race', 'list', 'top', 'item', 'results'].forEach((id) => (document.getElementById(id).style.display = 'none'));
    big('');
    startAttract();
  },
});
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
const serverMatch = createServerMatchClient(lobby);

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepKart(p, dt); sim.events = keep; },
  live: (p) => !p.finished,
  seed: (p) => { p.ghost = true; p.lastReset = p.resetSeq = 0; },
  merge: (p, host) => { Object.assign(p, { lap: host.lap, half: host.half, boost: host.boost, spin: host.spin }); p.h = blendAngle(p.h, host.h, 0.2); },
  angle: 'h',
});
// fast rows arrive in every snapshot; slow rows, circuit, boxes and bananas only when changed (missing = unchanged)
function applySnap(s) {
  serverMatch.onSnapshot(s);
  names.read(s);
  if (s.seed != null && sim.loadTrack(s.seed)) showTrack();
  Object.assign(world, { phase: s.ph, t: s.t, raceT: s.rt, order: s.ord ?? world.order });
  const seen = new Set();
  for (const [id, x, z, h, vx, vz, steer, idx, boost, spin] of s.K) {
    seen.add(id);
    if (!world.karts.has(id) && !names.name(id)) continue;
    const p = world.karts.get(id) ?? sim.addKart(id, ...names.name(id), id < 0);
    const fx = Math.sin(h), fz = Math.cos(h);
    Object.assign(p, { x, z, h, vx, vz, steer, idx, boost, spin, vf: vx * fx + vz * fz, vl: vx * fz - vz * fx });
  }
  for (const [id, lap, fl, item, place, finishT] of s.S ?? []) {
    const p = world.karts.get(id);
    // prog only ranks the HUD list here: the server's place decides it
    if (p) Object.assign(p, { lap, bot: !!(fl & 1), finished: !!(fl & 2), half: !!(fl & 4), item, place, finishT, prog: -place });
  }
  const me = world.karts.get(lobby.room.me);
  if (me) pred.correct(me);
  for (const id of [...world.karts.keys()]) if (!seen.has(id)) sim.removeKart(id);
  s.Bx?.forEach((t, i) => { if (track.boxes[i]) track.boxes[i].t = t ? 1 : 0; });
  if (s.Ba) world.bananas = s.Ba.map(([x, z]) => ({ x, z }));
  world.shells = (s.Sh ?? []).map(([x, z, h]) => ({ x, z, h }));
  playEvents(s.ev ?? []);
  snapAt = pacing.arrived();
}
function playEvents(evs) {
  const me = lobby.room?.me;
  for (const e of evs) {
    if (e[0] === 'b' && e[1] === me) sfx.box();
    else if (e[0] === 'o' && e[1] === me) sfx.boost();
    else if (e[0] === 'h') { const p = world.karts.get(e[1]); if (p) { if (Math.hypot(p.x - camLook.x, p.z - camLook.z) < 40) sfx.hit(); for (let i = 0; i < 8; i++) puff(p.x, p.z, (rng() - 0.5) * 20, (rng() - 0.5) * 20, 1); } if (e[1] === me) shake = 0.4; }
    else if (e[0] === 't' && e[1] === me) sfx.throw();
    else if (e[0] === 'x') sfx.hit();
    else if (e[0] === 'L' && e[1] === me) { sfx.lap(); flash(e[2] === LAPS - 1 ? 'FINAL LAP' : `LAP ${e[2] + 1}`); }
    else if (e[0] === 'F' && e[1] === me) { sfx.lap(); flash(`${ord((world.order.indexOf(me) + 1) || world.order.length)} place!`); }
    else if (e[0] === 'c') sfx.beep(e[1] === 0);
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ord = (n) => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');
const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(2).padStart(5, '0')}`;

// Input > keys + touch buttons
const keys = trackKeys(), touch = {};
const local = { itemSeq: 0, resetSeq: 0 };
let camMode = 0;
addEventListener('keydown', (e) => {
  if ((keyId(e) === 'KeyE' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) local.itemSeq++;
  if (keyId(e) === 'KeyR' && !e.repeat) local.resetSeq++;
  if (keyId(e) === 'KeyC' && !e.repeat) camMode = (camMode + 1) % 2;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
// Kart Party > phone controls: joystick steers + gas / brake, ITEM + DRIFT buttons
const pad = createTouchPad({
  buttons: [{ id: 'item', label: 'ITEM', color: 'rgba(255, 210, 63, 0.55)' }, { id: 'drift', label: 'DRIFT', color: 'rgba(255, 140, 60, 0.55)' }],
  onMove: (x, y) => Object.assign(touch, { left: x < -0.35, right: x > 0.35, gas: y > 0.35, brake: y < -0.35 }),
});
pad.onPress('item', () => local.itemSeq++);
Object.defineProperty(touch, 'drift', { get: () => pad.held.drift });
function readInput() {
  local.gas = (keys.KeyW || keys.ArrowUp || touch.gas ? 1 : 0) - (keys.KeyS || keys.ArrowDown || touch.brake ? 1 : 0);
  local.steer = (keys.KeyA || keys.ArrowLeft || touch.left ? 1 : 0) - (keys.KeyD || keys.ArrowRight || touch.right ? 1 : 0);
  local.drift = keys.Space || touch.drift ? 1 : 0;
}

// HUD > position, laps, standings, item, banner, results, minimap
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t) { big(t); flashT = 1.4; }
let hudT = 0;
function hud(dt) {
  if (world.mode !== 'match') return;
  flashT -= dt;
  hudT -= dt;
  const me = world.karts.get(lobby.room?.me);
  if (world.phase === 'count') big(`${Math.max(1, Math.ceil(world.t - 0.5))}`);
  else if (world.phase === 'race' && world.raceT < 0.9) big('GO!');
  else if (flashT <= 0 && world.phase === 'race') big(me?.finished ? '<small>finished · waiting for others</small>' : '');
  const itemEl = document.getElementById('item');
  itemEl.style.display = me && world.phase === 'race' && !me.finished ? 'grid' : 'none';
  if (me) itemEl.textContent = me.item ? ITEM_ICON[me.item] : '';
  if (hudT > 0) return;
  hudT = 0.2;
  const r = sim.ranked();
  if (me) {
    const place = r.indexOf(me) + 1;
    document.getElementById('pos').innerHTML = `${ord(place)}<small>/${r.length}</small>`;
    document.getElementById('meta').textContent = `Lap ${Math.min(me.lap + 1, LAPS)}/${LAPS} · ${fmt(world.raceT)} · ${Math.round(Math.hypot(me.vx, me.vz) * 3.6)} km/h`;
  }
  document.getElementById('list').innerHTML = r.map((p, i) => `<div class="row ${p.id === lobby.room?.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:${p.color}"></i><span>${esc(p.nick)}${p.finished ? ' 🏁' : ''}</span></div>`).join('');
  const res = document.getElementById('results');
  if (world.phase === 'end') {
    res.style.display = 'block';
    res.innerHTML = `<h2>🏁 Results</h2>` + r.map((p, i) => `<div class="row"><b>${i + 1}.</b><span style="color:${p.color}">${esc(p.nick)}</span><span style="text-align:right">${p.finished ? fmt(p.finishT) : 'DNF'}</span></div>`).join('') + `<div style="opacity:.6;font-size:12px;margin-top:8px">back to lobby in ${Math.ceil(world.t)}s</div>`;
    big('');
  } else res.style.display = 'none';
}
const mapC = document.getElementById('map'), mg = mapC.getContext('2d');
let mapBase = null, mapXf = null;
function drawMapBase() {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of track.P) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
  const sc = Math.min((mapC.width - 20) / (maxX - minX), (mapC.height - 20) / (maxZ - minZ));
  const ox = (mapC.width - (maxX - minX) * sc) / 2, oz = (mapC.height - (maxZ - minZ) * sc) / 2;
  mapXf = (x, z) => [ox + (x - minX) * sc, oz + (z - minZ) * sc];
  const c = document.createElement('canvas'); c.width = mapC.width; c.height = mapC.height;
  const g = c.getContext('2d');
  g.lineJoin = 'round';
  for (const [w, col] of [[9, 'rgba(255,255,255,0.3)'], [5, '#3a3d46']]) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); track.P.forEach((p, i) => { const [x, y] = mapXf(p.x, p.z); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); g.stroke(); }
  const [sx, sy] = mapXf(track.P[0].x, track.P[0].z); g.fillStyle = '#fff'; g.fillRect(sx - 4, sy - 2, 8, 4);
  mapBase = c;
}
function drawMap() {
  if (!mapBase) return;
  mg.clearRect(0, 0, mapC.width, mapC.height);
  mg.drawImage(mapBase, 0, 0);
  for (const p of world.karts.values()) {
    const [x, y] = mapXf(p.x, p.z), me = p.id === lobby.room?.me;
    mg.fillStyle = p.color; mg.beginPath(); mg.arc(x, y, me ? 5 : 3.5, 0, 7); mg.fill();
    if (me) { mg.strokeStyle = '#fff'; mg.lineWidth = 1.5; mg.stroke(); }
  }
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my kart and streams input to the server
let acc = 0;
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    for (acc += dt; acc >= STEP; acc -= STEP) sim.step();
    playEvents(sim.events); sim.events = [];
    return;
  }
  const me = lobby.room && world.karts.get(lobby.room.me);
  pred.tick(me, { inGas: local.gas, inSteer: local.steer, inDrift: local.drift }, dt, STEP);
  serverMatch.tickInput(() => ({ g2: local.gas, s: local.steer, d: local.drift, it: local.itemSeq, r: local.resetSeq }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 30, 60), camLook = new THREE.Vector3();
let shake = 0, attractCam = 0, followId = null;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  for (const [id, k] of karts3d) if (!world.karts.has(id)) { scene.remove(k); karts3d.delete(id); }
  for (const p of world.karts.values()) {
    let k = karts3d.get(p.id);
    if (!k) { k = makeKart(p); karts3d.set(p.id, k); k.position.set(p.x, 0, p.z); k.rotation.y = p.h; }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + v.vx * va, tz = v.z + v.vz * va, a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(18));
    if (Math.hypot(tx - k.position.x, tz - k.position.z) > 10) k.position.set(tx, 0, tz);
    k.position.x += (tx - k.position.x) * a; k.position.z += (tz - k.position.z) * a;
    let dh = v.h - k.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    k.rotation.y += dh * (hostSim ? 1 : Math.min(1, dt * 16));
    const u = k.userData;
    // followed kart's own tag would sit in the middle of the chase view
    u.tag.visible = p.id !== followId;
    u.body3.rotation.z = THREE.MathUtils.clamp(-(p.vl ?? 0) * 0.012, -0.08, 0.08);
    for (const w of u.wheels) { w.w.rotation.x += (p.vf ?? 0) * dt / 0.42; if (w.front) w.piv.rotation.y = p.steer * 0.45; }
    if (Math.abs(p.vl ?? 0) > 2.4 && Math.hypot(p.vx, p.vz) > 6) for (const s of [-1, 1]) {
      const rx = k.position.x - Math.sin(k.rotation.y) * 1.2 + Math.cos(k.rotation.y) * 1.05 * s, rz = k.position.z - Math.cos(k.rotation.y) * 1.2 - Math.sin(k.rotation.y) * 1.05 * s;
      addSkid(rx, rz, k.rotation.y);
      if (rng() < 0.4) puff(rx, rz, p.vx, p.vz);
    }
    if (p.boost > 0.3 && rng() < 0.5) puff(k.position.x - Math.sin(k.rotation.y) * 2, k.position.z - Math.cos(k.rotation.y) * 2, -p.vx, -p.vz, 0.7);
  }
  for (let i = 0; i < SMOKE; i++) { if (smokeLife[i] <= 0) continue; smokeLife[i] -= dt * 0.9; for (let k = 0; k < 3; k++) smokePos[i * 3 + k] += smokeVel[i * 3 + k] * dt; }
  smokeGeo.attributes.position.needsUpdate = true; smokeGeo.attributes.life.needsUpdate = true;
  track.boxes.forEach((b, i) => { const m = boxMeshes[i]; if (!m) return; m.visible = b.t <= 0; m.rotation.set(time * 0.7, time * 1.3, 0); m.position.y = 1.4 + Math.sin(time * 2 + i) * 0.2; });
  world.bananas.forEach((b, i) => { const m = poolMesh('banana', i); m.visible = true; m.position.set(b.x, 0.35, b.z); m.rotation.set(Math.PI / 2, 0, i); });
  for (let i = world.bananas.length; i < pools.banana.length; i++) pools.banana[i].visible = false;
  world.shells.forEach((s, i) => { const m = poolMesh('shell', i); m.visible = true; m.position.set(s.x + Math.sin(s.h) * 46 * age, 0.6, s.z + Math.cos(s.h) * 46 * age); m.rotation.y = time * 12; });
  for (let i = world.shells.length; i < pools.shell.length; i++) pools.shell[i].visible = false;
  if (trackCrowd) trackCrowd.position.y = Math.abs(Math.sin(time * 8)) * 0.12;
  hud(dt);
  drawMap();
  // camera: chase own kart (or overhead), attract mode rides along with a bot
  const me = world.karts.get(lobby.room?.me);
  let follow = me && world.mode === 'match' ? me : null;
  if (!follow) { const list = [...world.karts.values()]; attractCam += dt; follow = list[Math.floor(attractCam / 8) % Math.max(list.length, 1)]; }
  followId = follow?.id ?? null;
  if (follow) {
    const k = karts3d.get(follow.id);
    const px = k?.position.x ?? follow.x, pz = k?.position.z ?? follow.z, hh = k?.rotation.y ?? follow.h;
    const fx = Math.sin(hh), fz = Math.cos(hh), speed = Math.hypot(follow.vx, follow.vz);
    if (camMode === 0) {
      camPos.lerp(_v.set(px - fx * 9, 4.2, pz - fz * 9), 1 - Math.exp(-dt * 6));
      camLook.lerp(new THREE.Vector3(px + fx * 4, 1.2, pz + fz * 4), 1 - Math.exp(-dt * 10));
    } else {
      camPos.lerp(_v.set(px, 55, pz + 0.01), 1 - Math.exp(-dt * 4));
      camLook.set(px, 0, pz);
    }
    camera.fov += (62 + Math.min(speed, 40) * 0.35 + follow.boost * 8 - camera.fov) * (1 - Math.exp(-dt * 4));
    camera.updateProjectionMatrix();
    sun.position.set(px + 30, 60, pz + 20); sun.target.position.set(px, 0, pz);
    if (gameAudio.ctx && follow === me) {
      const rpm = 0.25 + (speed % 11) / 11 * 0.75 + Math.floor(speed / 11) * 0.08;
      eng1.frequency.value = 55 + rpm * 120; eng2.frequency.value = 55.5 + rpm * 121;
      engGain.gain.value = 0.03 + Math.min(speed / 40, 1) * 0.035;
    } else if (gameAudio.ctx) engGain.gain.value = 0;
  }
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
