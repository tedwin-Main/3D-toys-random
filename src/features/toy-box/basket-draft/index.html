<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Basket Draft</title>
<style>
  :root { --ink: #fff; --card: rgba(40, 22, 10, 0.74); --pic: #ffd36b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; user-select: none; }
  #info { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #info .h { font-size: 20px; font-weight: 900; }
  #info .m { font-size: 13px; margin-top: 3px; opacity: 0.92; max-width: 260px; }
  #board { top: 62px; right: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 190px; }
  #board .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #board .row b { width: 16px; opacity: 0.6; }
  #board .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .row span { flex: 1; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row em { font-style: normal; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  #board .row.me span { color: var(--pic); font-weight: 800; }
  #turn { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 16px; font-weight: 800; display: none; white-space: nowrap; }
  #big { position: fixed; top: 34%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(26px, 6vw, 58px); font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.4); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.32em; font-weight: 700; }
  #hand { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 10px; display: none; width: min(640px, calc(100% - 16px)); text-align: center; }
  #cards { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  #cards button { font: inherit; width: 70px; height: 92px; border: 0; border-radius: 12px; cursor: pointer; background: #fff8e8; color: #3a2410; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 3px 0 #c9a774; }
  #cards button .e { font-size: 34px; line-height: 1; }
  #cards button .n { font-size: 11px; font-weight: 800; }
  #cards button .v { font-size: 10px; opacity: 0.7; }
  #cards button.blanket .e { width: 36px; height: 30px; border-radius: 4px; background: repeating-conic-gradient(#e94b3c 0 25%, #fff 0 50%) 0 0 / 12px 12px; }
  #cards button.on { outline: 3px solid var(--pic); outline-offset: 2px; transform: translateY(-6px); }
  #cards button:disabled { opacity: 0.5; cursor: default; }
  #hand .s { font-size: 12.5px; opacity: 0.88; margin-top: 8px; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.9; max-width: 280px; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: var(--pic); }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  @media (pointer: coarse), (max-width: 1150px) { #hint { display: none; } }
  @media (max-width: 700px) { #turn { top: 96px; font-size: 14px; } #board { top: 150px; font-size: 11.5px; min-width: 150px; } #cards button { width: 56px; height: 78px; } #cards button .e { font-size: 28px; } #cards button .v { display: none; } }
</style>
<link rel="stylesheet" href="../common/mobile-hud.css" />
</head>
<body>
<div id="info" class="card"><div class="h" id="roundName"></div><div class="m" id="roundMeta"></div></div>
<div id="board" class="card"></div>
<div id="turn" class="card"></div>
<div id="big"></div>
<div id="hand" class="card"><div id="cards"></div><div class="s" id="handS"></div></div>
<div id="hint" class="card">Everyone keeps <b>one card</b> from their hand in secret, then passes the rest. 🍎 1 · 🥧 pair = 5 · 🥪 three = 10 · 🐜 −2 unless a <b>blanket</b> covers it · 🧀 most at the end +6, second +3. Keys 1–8 pick.</div>
<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createLobby } from '../common/room-lobby.ts';
import { exposeGameDebug } from '../common/debug-probe.ts';
import { startTicker } from '../common/room-client.ts';
import { createTurnSync } from '../common/turn-sync.ts';
import { createServerMatchClient } from '../common/server-run/server-match-client.ts';
import { esc, nameTag, emojiTexture, boardHtml, createBanner } from '../common/turn-page-kit.ts';
import { createBasketGame } from './basket-rules.ts';
import { cardValue } from './basket-cards.ts';
import { createGameAudio } from '../common/game-audio.ts';

const CARD = {
  apple: { e: '🍎', n: 'Apple', v: '1 each', bg: '#ffe3e0' },
  pie: { e: '🥧', n: 'Pie', v: 'pair = 5', bg: '#ffeccc' },
  sandwich: { e: '🥪', n: 'Sandwich', v: '3 = 10', bg: '#fff3c9' },
  cheese: { e: '🧀', n: 'Cheese', v: 'most +6', bg: '#fff6b8' },
  ant: { e: '🐜', n: 'Ant', v: '−2', bg: '#e9e4f0' },
  blanket: { e: '', n: 'Blanket', v: 'stops an ant', bg: '#ffffff' },
};

// Scene > Renderer, sunny park: lawn, checkered cloth, a few trees
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6ff);
scene.fog = new THREE.Fog(0xbfe6ff, 25, 60);
const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 140);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4f7a3a, 1.0));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.8);
sun.position.set(-7, 14, 9);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);
const lawn = new THREE.Mesh(new THREE.CircleGeometry(60, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x79c35a, roughness: 1 }));
lawn.receiveShadow = true;
scene.add(lawn);
function checkerTexture(a = '#e94b3c', b = '#ffffff', cells = 8) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), s = 256 / cells;
  for (let y = 0; y < cells; y++) for (let x = 0; x < cells; x++) { g.fillStyle = (x + y) % 2 ? a : b; g.fillRect(x * s, y * s, s, s); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const clothTex = checkerTexture('#e94b3c', '#fff5ec', 10);
clothTex.wrapS = clothTex.wrapT = THREE.RepeatWrapping;
const cloth = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: clothTex, roughness: 0.95 }));
cloth.position.y = 0.01;
cloth.receiveShadow = true;
scene.add(cloth);
for (let k = 0; k < 6; k++) {
  const a = (k / 6) * Math.PI * 2 + 0.4, r = 16 + (k % 2) * 4;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2, 8), new THREE.MeshStandardMaterial({ color: 0x7a4f2a }));
  const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 1), new THREE.MeshStandardMaterial({ color: 0x4e9a3a, flatShading: true }));
  trunk.position.set(Math.cos(a) * r, 1, Math.sin(a) * r); crown.position.set(trunk.position.x, 2.9, trunk.position.z);
  trunk.castShadow = crown.castShadow = true;
  scene.add(trunk, crown);
}

// Cards > flat picnic tiles; the blanket card is a little checkered square
const cardGeo = new THREE.BoxGeometry(0.5, 0.03, 0.62);
const blanketTex = checkerTexture('#e94b3c', '#ffffff', 4);
const cardMats = {};
const sideMat = new THREE.MeshStandardMaterial({ color: 0xf2e2c4 });
function cardMat(kind) {
  if (cardMats[kind]) return cardMats[kind];
  const map = kind === 'blanket' ? blanketTex : emojiTexture(CARD[kind].e, { bg: CARD[kind].bg });
  const top = new THREE.MeshStandardMaterial({ map, roughness: 0.6 });
  return (cardMats[kind] = [sideMat, sideMat, top, sideMat, sideMat, sideMat]);
}

// Seats > picnickers around the cloth with their kept cards laid out in front; my seat nearest the camera
const seats3d = new Map();
let ringR = 3.4;
function makeSeat(p) {
  const g = new THREE.Group(), body = new THREE.Group(), mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5 });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.4, 6, 12), mat); torso.position.y = 0.48; torso.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 10), new THREE.MeshStandardMaterial({ color: 0xffdcb8 })); head.position.y = 1.05;
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.04, 18), new THREE.MeshStandardMaterial({ color: 0xf2d27a })); hat.position.y = 1.22;
  const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.2, 0.26, 12), new THREE.MeshStandardMaterial({ color: 0xb07a3a, roughness: 0.9 })); basket.position.set(0.55, 0.13, 0); basket.castShadow = true;
  body.add(torso, head, hat, basket);
  const tag = nameTag(p.nick, p.color, 'rgba(40,22,10,0.8)'); tag.position.y = 1.75; body.add(tag);
  const tab = new THREE.Group();
  g.add(body, tab);
  scene.add(g);
  return { g, body, tag, tab, tabKey: '', pops: [] };
}
function layTableau(seat, kinds) {
  const key = kinds.join(',');
  if (key === seat.tabKey) return;
  const grew = kinds.length > seat.tabKey.split(',').filter(Boolean).length;
  seat.tabKey = key;
  seat.tab.clear();
  // same kinds side by side so pairs and sets read at a glance
  const sorted = [...kinds].sort();
  sorted.forEach((k, i) => {
    const m = new THREE.Mesh(cardGeo, cardMat(k));
    const col = i % 5, row = Math.floor(i / 5);
    m.position.set((col - 2) * 0.54, 0.03, -0.75 - row * 0.68);
    m.rotation.y = Math.sin(i * 2.3) * 0.06;
    m.castShadow = true;
    seat.tab.add(m);
  });
  if (grew) seat.pops = seat.tab.children.map((m) => ({ m, t: 0 }));
}

// Audio > card swish, reveal pop, score chime, ant crunch
const gameAudio = createGameAudio();
const { tone, noise } = gameAudio;
const sfx = {
  pick() { noise(0.06, 0.04, 3000, 1200); },
  reveal() { tone(520, 780, 0.12, 0.06, 'triangle'); },
  score(me) { [659, 784, 988].forEach((f, i) => tone(f, f, 0.14, me ? 0.07 : 0.04, 'triangle', i * 0.08)); },
  tick() { tone(1500, 1500, 0.02, 0.03, 'square'); },
};

// Game > rules live in basket-rules.ts: this page runs them for attract mode only; in a match the relay server keeps every hand and sends this tab its own alone
// S: { mode, ph, tt, clock, rd, rounds, hs, pk, dir, total, deck, res, bonus, P: [{ id, nick, color, bot, score, lock, in, hand, tab, pick, cheese, skill }] }
const attract = createBasketGame();
let S = attract.state, mine = null, selI = -1;
const player = (id) => S.P.find((p) => p.id === id);
const sig = () => JSON.stringify(S, (k, v) => (k === 'tt' || k === 'at' ? undefined : v));
let prevS = null;
function startAttract() { attract.startAttract(); S = attract.state; prevS = null; mine = null; }
// Run engine > attract tick: page hooks fire on anything but the clock
function attractTick(dt) {
  const changed = attract.tick(dt);
  if (S !== attract.state) prevS = null;
  S = attract.state;
  if (!changed && prevS) return;
  onChange(prevS, S);
  prevS = JSON.parse(sig());
}

// Multiplayer > lobby + state sync (server publishes S without hands, and this seat's own hand privately)
const sync = createTurnSync({
  onState(s) { if (lobbyStarted) applyState(s); },
  onPrivate(view) { const fresh = view?.pk !== mine?.pk || view?.rd !== mine?.rd; mine = view; if (fresh) selI = view?.pick ?? -1; renderHand(); },
  onDone() { serverMatch.finish(); },
});
let lobbyStarted = false;
const lobby = createLobby({
  game: 'basket-draft', title: 'Basket Draft', emoji: '🧺', accent: '#ffd36b',
  blurb: 'Everyone holds a hand of picnic cards. Keep one in secret, pass the rest, and reveal together. Apples, pie pairs and sandwich trios score each round; ants bite unless a blanket covers them; the cheesiest basket wins a bonus at the end.',
  maxBots: 13, defaultBots: 4, minPlayers: 2,
  note: 'Up to 14 picnickers (humans + bots). Everyone picks at once, so a big table is no slower. Hands: 8 cards up to 4 players, 7 up to 8, 6 beyond. 3 rounds.',
  settings: [{ key: 'clock', label: 'Pick clock', options: [[10, '10 s'], [15, '15 s'], [25, '25 s']], value: 15 }],
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    sync.attach(room);
    room.on('host', syncTop);
  },
  onStart({ bots, seed, settings }) {
    lobbyStarted = true;
    showHud(true);
    syncTop();
    serverMatch.start({ bots, seed, settings });
    if (sync.state) applyState(sync.state);
    mine = sync.mine;
  },
  onLobby() { serverMatch.stop(); lobbyStarted = false; showHud(false); banner.clear(); startAttract(); },
});
const serverMatch = createServerMatchClient(lobby);
// Debug > ?debug exposes window.__GAME_DEBUG__ for Playwright x-ray checks
exposeGameDebug({ lobby, read: () => ({ phase: S.ph, players: S.P }), confirmMs: () => serverMatch.stats.confirmMs });
function showHud(on) {
  ['info', 'board', 'turn'].forEach((id) => (document.getElementById(id).style.display = on ? 'block' : 'none'));
  document.getElementById('top').style.display = on ? 'flex' : 'none';
  if (!on) handEl.style.display = 'none';
}
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
function applyState(s) {
  const prev = S?.mode === 'match' ? JSON.parse(sig()) : null;
  S = { ...s, P: s.P.map((p) => ({ ...p, tab: [...p.tab] })), mode: 'match' };
  onChange(prev, S);
}
function onChange(prev, cur) {
  const me = lobby.room?.me, match = cur.mode === 'match';
  if (cur.ph === 'reveal' && prev?.ph !== 'reveal') sfx.reveal();
  if (match && cur.ph === 'score' && prev?.ph !== 'score' && cur.res?.[me]) {
    const r = cur.res[me], parts = [['🍎', r.apple], ['🥧', r.pie], ['🥪', r.sandwich], ['🐜', r.ant], ['🟥', r.blanket]].filter(([, v]) => v);
    sfx.score(true);
    banner.flash(`<small>round ${cur.rd} · ${parts.map(([e, v]) => `${e} ${v > 0 ? '+' : ''}${v}`).join('  ') || 'nothing scored'}</small>+${r.total} for you`, 4.5);
  }
  if (match && cur.ph === 'final' && prev?.ph !== 'final' && cur.bonus?.[me]) sfx.score(true);
}

// Input > tap a card or press 1-8; tapping another before the reveal swaps the pick
const handEl = document.getElementById('hand'), cardsEl = document.getElementById('cards');
let handKey = '';
const canPick = () => S.mode === 'match' && S.ph === 'pick' && player(lobby.room?.me)?.in;
function renderHand() {
  const hand = mine?.hand ?? [], me = player(lobby.room?.me), left = hand.length;
  const key = `${hand.join(',')}|${selI}|${canPick()}`;
  if (key === handKey) return;
  handKey = key;
  cardsEl.innerHTML = hand.map((k, i) => {
    const c = CARD[k], worth = me ? cardValue(k, me.tab, left) : 0;
    return `<button class="${k} ${i === selI ? 'on' : ''}" data-i="${i}" ${canPick() ? '' : 'disabled'} title="${c.n}: ${c.v}"><span class="e">${c.e}</span><span class="n">${c.n}</span><span class="v">${c.v}${Math.abs(worth) >= 1 ? ` · ${worth > 0 ? '+' : ''}${Math.round(worth)}` : ''}</span></button>`;
  }).join('');
  cardsEl.querySelectorAll('button').forEach((b) => (b.onclick = () => pick(+b.dataset.i)));
}
function pick(i) {
  if (!canPick() || !(i >= 0 && i < (mine?.hand.length ?? 0))) return;
  selI = i;
  sfx.pick();
  sync.act({ t: 'pick', i });
  renderHand();
}
addEventListener('keydown', (e) => {
  if (/^[1-9]$/.test(e.key)) pick(+e.key - 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') pick(Math.max(0, Math.min((mine?.hand.length ?? 1) - 1, (selI < 0 ? 0 : selI) + (e.key === 'ArrowLeft' ? -1 : 1))));
});

// HUD > pick line, scoreboard, hand panel, banners
const banner = createBanner(document.getElementById('big')), turnEl = document.getElementById('turn');
let lastClock = 0, hudT = 0;
function hud(dt) {
  if (S.mode !== 'match') return;
  const flashing = banner.tick(dt);
  const me = player(lobby.room?.me), clock = Math.ceil(Math.max(0, S.tt)), waiting = S.P.filter((p) => p.in && !p.lock).length;
  if (S.ph === 'intro') banner.set(`<small>3 rounds · ${S.hs} cards a hand</small>Basket Draft`);
  else if (S.ph === 'final') { const w = [...S.P].sort((a, c) => c.score - a.score)[0]; banner.set(`<small>best basket with ${w?.score ?? 0}</small>🏆 ${esc(w?.nick ?? '')}`); }
  else if (!flashing) banner.set('');
  turnEl.innerHTML = S.ph === 'pick' ? (me?.in ? (me.lock ? `✅ kept · ${waiting ? `${waiting} still choosing` : 'all in'} · ${clock}s` : `<b>Keep one card</b> · ${clock}s`) : `${waiting} choosing · ${clock}s`) : S.ph === 'reveal' ? `🧺 reveal · passing ${S.dir > 0 ? 'left ⟲' : 'right ⟳'}` : S.ph === 'score' ? `🍽️ round ${S.rd} scored` : S.ph === 'final' ? '🏁 picnic over' : '🧺 dealing';
  const show = !!me && (S.ph === 'pick' || S.ph === 'reveal') && (mine?.hand.length ?? 0) > 0;
  handEl.style.display = show ? 'block' : 'none';
  if (show) {
    renderHand();
    document.getElementById('handS').textContent = me.in ? `Round ${S.rd} · pick ${S.pk} of ${S.hs} · passing ${S.dir > 0 ? 'left' : 'right'}${me.lock && S.ph === 'pick' ? ' · tap another to change' : ''}` : 'You join at the next deal';
  }
  if (canPick() && !me.lock && clock !== lastClock && clock <= 3) sfx.tick();
  lastClock = clock;
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.15;
  document.getElementById('roundName').textContent = S.ph === 'final' ? 'Final scores' : `Round ${S.rd || 1} of ${S.rounds}`;
  document.getElementById('roundMeta').innerHTML = me ? `Score <b style="color:var(--pic)">${me.score}</b> · 🧀 ${me.cheese + me.tab.filter((c) => c === 'cheese').length}` : 'Watching';
  const rows = [...S.P].sort((a, c) => c.score - a.score);
  document.getElementById('board').innerHTML = boardHtml(rows, { me: lobby.room?.me, right: (p) => `${S.ph === 'pick' && p.in ? (p.lock ? '✅ ' : '🤔 ') : ''}${S.ph === 'final' && S.bonus?.[p.id] ? `🧀+${S.bonus[p.id]} ` : ''}${p.score}` });
}

// Run engine > attract rules tick; in a match only the clock between server states runs here
startTicker(20, (dt) => {
  if (S.mode === 'attract') attractTick(dt);
  else S.tt -= dt;
});

// Run engine > render loop: picnickers ring the cloth, kept cards pop onto the cloth at each reveal
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 9, 10), camLook = new THREE.Vector3(0, 0, 0.5), _v = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const ids = new Set(S.P.map((p) => p.id));
  for (const [id, seat] of seats3d) if (!ids.has(id)) { scene.remove(seat.g); seats3d.delete(id); }
  const n = S.P.length, meAt = Math.max(0, S.P.findIndex((p) => p.id === lobby.room?.me));
  ringR = Math.max(3.4, n * 0.62);
  cloth.scale.set(ringR * 2 - 0.4, 1, ringR * 2 - 0.4);
  clothTex.repeat.set(ringR / 1.5, ringR / 1.5);
  S.P.forEach((p, i) => {
    let seat = seats3d.get(p.id);
    if (!seat) { seat = makeSeat(p); seats3d.set(p.id, seat); }
    const a = Math.PI / 2 + ((i - meAt) / n) * Math.PI * 2;
    seat.g.position.set(Math.cos(a) * ringR, 0, Math.sin(a) * ringR);
    seat.g.rotation.y = Math.PI / 2 - a;
    seat.body.position.z = 0.35;
    seat.tag.visible = p.id !== lobby.room?.me;
    layTableau(seat, p.tab);
    for (const pop of seat.pops) { pop.t += dt; const u = Math.min(1, pop.t * 4); pop.m.scale.setScalar(0.4 + 0.6 * u + Math.sin(u * Math.PI) * 0.25); }
    const thinking = S.ph === 'pick' && p.in && !p.lock;
    seat.body.position.y = thinking ? Math.sin(time * 3 + i) * 0.04 : S.ph === 'reveal' ? Math.abs(Math.sin(time * 8 + i)) * 0.12 : 0;
    seat.body.rotation.y = thinking ? Math.sin(time * 1.4 + i) * 0.25 : 0;
  });
  hud(dt);
  const tall = camera.aspect < 1, span = ringR * 2 + 3;
  const dist = Math.max(9, span / (0.8 * camera.aspect) * (tall ? 0.9 : 0.92));
  camPos.lerp(_v.set(0, dist * (tall ? 0.88 : 0.72), dist * (tall ? 0.5 : 0.7)), 1 - Math.exp(-dt * 3));
  camLook.set(0, 0, ringR * 0.3);
  scene.fog.near = dist * 1.5; scene.fog.far = dist * 3.5;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
