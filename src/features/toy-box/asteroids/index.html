<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Asteroids</title>
<meta name="category" content="games" />
<meta name="order" content="7" />
<meta name="capture" content="3600" />
<meta name="tags" content="vector glow, screen wrap, inertia, splitting rocks, AI pilot" />
<meta name="description" content="Vector-display Asteroids: phosphor-glow lines with persistence trails, inertia and screen wrap (objects draw on both edges while crossing), rocks that split into jagged children with conserved momentum, a hunting saucer, hyperspace, particle debris and the two-note heartbeat. An AI pilot leads its shots to play the attract mode." />
<meta name="prompt" content="Recreate Atari Asteroids in one HTML file with canvas. Glowing vector lines with phosphor persistence, ship inertia, thrust flame, screen wrap that draws objects on both edges, asteroids that split into smaller jagged rocks, a UFO that shoots at you, hyperspace, particle explosions and the heartbeat sound speeding up. Include touch controls and an AI that plays when idle." />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; user-select: none; font-family: ui-monospace, Menlo, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #pad { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 16px; pointer-events: none; }
  #pad div { display: flex; gap: 12px; pointer-events: auto; }
  #pad button { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(160,220,255,0.5); background: rgba(160,220,255,0.08); color: #bfe8ff; font: 700 20px ui-monospace, Menlo, monospace; touch-action: none; }
  @media (pointer: coarse) { #pad { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><div><button data-k="ArrowUp">▲</button><button data-k="Space">●</button></div></div>
<script>
/**
 * FILE: 3d-toys/asteroids/index.html
 * PURPOSE: Vector Asteroids: phosphor glow, inertia, wrap-aware drawing, splitting rocks, saucer, hyperspace, heartbeat, AI pilot
 * UI: Render Studio > Games > Asteroids
 * USED BY: 3d-toys/index.html (iframe viewer)
 * KEY EXPORTS: none (standalone page)
 */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }
addEventListener('resize', resize); resize();
// scale gameplay to the screen so phones get the same density
const S = () => Math.max(0.6, Math.min(W, H) / 700);

const TAU = Math.PI * 2, rand = (a, b) => a + Math.random() * (b - a);
const wrap = (o) => { if (o.x < 0) o.x += W; if (o.x > W) o.x -= W; if (o.y < 0) o.y += H; if (o.y > H) o.y -= H; };
// shortest wrapped delta so AI and collisions see across edges
const wd = (a, b, L) => { let d = b - a; if (d > L / 2) d -= L; if (d < -L / 2) d += L; return d; };

let ship, rocks, bullets, ebullets, parts, saucer, score, hi, lives, level, state, stateT, attract = true, idle = 0, beatT = 0, beatI = 0, saucerT = 12;
try { hi = +localStorage.getItem('asteroids-hi') || 0; } catch { hi = 0; }
function makeRock(x, y, size, vx = 0, vy = 0) {
  const n = 10 + (Math.random() * 4 | 0), r = [22, 42, 74][size] * S();
  const pts = Array.from({ length: n }, (_, i) => { const a = i / n * TAU, rr = r * rand(0.72, 1.08); return [Math.cos(a) * rr, Math.sin(a) * rr]; });
  const sp = [95, 60, 38][size] * S() * (1 + level * 0.06), a = rand(0, TAU);
  return { x, y, vx: vx + Math.cos(a) * sp * rand(0.5, 1), vy: vy + Math.sin(a) * sp * rand(0.5, 1), r, size, pts, rot: rand(-1, 1), ang: 0 };
}
function newShip() { ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, thrust: false, cool: 0, inv: 2.5, dead: 0, hyper: 0 }; }
function newLevel() {
  rocks = []; const n = Math.min(4 + level, 11);
  for (let i = 0; i < n; i++) { let x, y; do { x = rand(0, W); y = rand(0, H); } while (Math.hypot(x - W / 2, y - H / 2) < 180 * S()); rocks.push(makeRock(x, y, 2)); }
}
function newGame() { score = 0; lives = 3; level = 1; bullets = []; ebullets = []; parts = []; saucer = null; saucerT = 12; newShip(); newLevel(); state = 'play'; stateT = 0; }

// Audio > heartbeat + sfx
let ac = null;
function tone(f, d, type = 'square', vol = 0.06, f2 = f) {
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
function noise(d, vol = 0.12) {
  if (!ac) return; const b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length) ** 2;
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = vol; s.buffer = b; s.connect(f).connect(g).connect(ac.destination); s.start();
}

// Input > keyboard + on-screen pad
const keys = new Set();
function wake() { idle = 0; if (!ac) { try { ac = new AudioContext(); } catch { /* none */ } } if (attract) { attract = false; newGame(); } else if (state === 'over' && stateT > 1) newGame(); }
addEventListener('keydown', (e) => { keys.add(e.code); if (/Arrow|Space|Key[WADS]|ShiftLeft/.test(e.code)) { e.preventDefault(); wake(); } });
addEventListener('keyup', (e) => keys.delete(e.code));
cv.addEventListener('pointerdown', wake);
for (const b of document.querySelectorAll('#pad button')) {
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); wake(); keys.add(b.dataset.k); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => keys.delete(b.dataset.k));
}

function explode(x, y, n, col, sp = 160) { for (let i = 0; i < n; i++) { const a = rand(0, TAU), v = rand(20, sp) * S(); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: rand(0.5, 1.2), col, line: Math.random() < 0.3 }); } }
function splitRock(r, i) {
  rocks.splice(i, 1);
  score += [100, 50, 20][r.size];
  explode(r.x, r.y, 14 + r.size * 8, '#cfe8ff');
  noise(0.25 + r.size * 0.15, 0.08 + r.size * 0.04);
  // children inherit the parent's momentum plus a kick
  if (r.size > 0) for (let k = 0; k < 2; k++) rocks.push(makeRock(r.x, r.y, r.size - 1, r.vx * 0.6, r.vy * 0.6));
}
function killShip() { explode(ship.x, ship.y, 40, '#7fd7ff', 220); noise(0.9, 0.18); ship.dead = 2; lives--; }

// AI > attract pilot: aim with lead at the most threatening rock, thrust away from close ones
function ai() {
  let best = null, bs = 1e9;
  for (const r of rocks.concat(saucer ? [saucer] : [])) {
    const dx = wd(ship.x, r.x, W), dy = wd(ship.y, r.y, H), d = Math.hypot(dx, dy);
    // closing speed raises threat
    const closing = -(dx * (r.vx - ship.vx) + dy * (r.vy - ship.vy)) / (d || 1);
    const sc = d - closing * 0.8 - (r === saucer ? 150 : 0);
    if (sc < bs) { bs = sc; best = { r, dx, dy, d }; }
  }
  const out = { left: false, right: false, thrust: false, fire: false };
  if (!best) return out;
  const bv = 520 * S(), t = best.d / bv;
  const tx = best.dx + (best.r.vx - ship.vx) * t, ty = best.dy + (best.r.vy - ship.vy) * t;
  let da = Math.atan2(ty, tx) - ship.a; da = Math.atan2(Math.sin(da), Math.cos(da));
  out.left = da < -0.05; out.right = da > 0.05;
  out.fire = Math.abs(da) < 0.12 && best.d < 520 * S();
  const sp = Math.hypot(ship.vx, ship.vy);
  // keep a little drift so the ship feels alive, flee when a rock is on top of us
  if (best.d < (best.r.r || 20) + 70 * S() && Math.abs(da) > 2.2) out.thrust = true;
  else if (sp < 30 * S() && Math.random() < 0.02) out.thrust = true;
  return out;
}

function update(dt) {
  stateT += dt;
  if (!attract) { idle += dt; if (idle > 40) { attract = true; newGame(); } }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }
  parts = parts.filter((p) => p.t > 0);
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.ang += r.rot * dt; wrap(r); }
  if (state === 'over') { if (attract && stateT > 3) newGame(); return; }
  // ship
  if (ship.dead > 0) {
    ship.dead -= dt;
    if (ship.dead <= 0) {
      if (lives <= 0) { state = 'over'; stateT = 0; if (score > hi) { hi = score; try { localStorage.setItem('asteroids-hi', hi); } catch { /* blocked */ } } }
      else newShip();
    }
  } else if (ship.hyper > 0) {
    ship.hyper -= dt;
  } else {
    const c = attract ? ai() : { left: keys.has('ArrowLeft') || keys.has('KeyA'), right: keys.has('ArrowRight') || keys.has('KeyD'), thrust: keys.has('ArrowUp') || keys.has('KeyW'), fire: keys.has('Space'), hyper: keys.has('ShiftLeft') || keys.has('KeyS') };
    if (c.left) ship.a -= 4.6 * dt;
    if (c.right) ship.a += 4.6 * dt;
    ship.thrust = c.thrust;
    if (c.thrust) { ship.vx += Math.cos(ship.a) * 330 * S() * dt; ship.vy += Math.sin(ship.a) * 330 * S() * dt; if (Math.random() < 0.6) parts.push({ x: ship.x - Math.cos(ship.a) * 14 * S(), y: ship.y - Math.sin(ship.a) * 14 * S(), vx: ship.vx - Math.cos(ship.a + rand(-0.3, 0.3)) * 160, vy: ship.vy - Math.sin(ship.a + rand(-0.3, 0.3)) * 160, t: 0.3, col: '#ffb45a' }); }
    // space drag keeps it playable without killing inertia
    const drag = Math.pow(0.55, dt); ship.vx *= drag; ship.vy *= drag;
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
    ship.cool -= dt; ship.inv -= dt;
    if (c.fire && ship.cool <= 0 && bullets.length < 5) { const bv = 520 * S(); bullets.push({ x: ship.x + Math.cos(ship.a) * 16 * S(), y: ship.y + Math.sin(ship.a) * 16 * S(), vx: ship.vx + Math.cos(ship.a) * bv, vy: ship.vy + Math.sin(ship.a) * bv, t: 0.95 }); ship.cool = 0.17; tone(880, 0.09, 'square', 0.035, 220); }
    if (c.hyper && ship.cool <= 0) { ship.hyper = 0.6; ship.cool = 0.8; explode(ship.x, ship.y, 12, '#7fd7ff', 60); ship.x = rand(40, W - 40); ship.y = rand(40, H - 40); ship.vx = ship.vy = 0; tone(200, 0.4, 'sine', 0.06, 1200); }
  }
  for (const b of bullets.concat(ebullets)) { b.x += b.vx * dt; b.y += b.vy * dt; b.t -= dt; wrap(b); }
  // bullets vs rocks
  for (const b of bullets) for (let i = rocks.length - 1; i >= 0; i--) { const r = rocks[i]; if (Math.hypot(wd(b.x, r.x, W), wd(b.y, r.y, H)) < r.r * 0.9) { b.t = 0; splitRock(r, i); break; } }
  // saucer: appears on a timer, small one aims better at high score
  saucerT -= dt;
  if (!saucer && saucerT <= 0 && state === 'play') { const small = score > 4000 || Math.random() < 0.3, d = Math.random() < 0.5 ? 1 : -1; saucer = { x: d > 0 ? -20 : W + 20, y: rand(H * 0.15, H * 0.85), vx: d * (small ? 120 : 80) * S(), vy: 0, small, r: (small ? 10 : 18) * S(), cool: 1, turn: 1.5 }; }
  if (saucer) {
    saucer.x += saucer.vx * dt; saucer.y += saucer.vy * dt; if (saucer.y < 0) saucer.y += H; if (saucer.y > H) saucer.y -= H;
    saucer.turn -= dt; if (saucer.turn <= 0) { saucer.vy = [-1, 0, 1][(Math.random() * 3) | 0] * Math.abs(saucer.vx) * 0.7; saucer.turn = rand(0.8, 2); }
    if (Math.random() < dt * 8) tone(saucer.small ? 1100 : 700, 0.05, 'sawtooth', 0.015);
    saucer.cool -= dt;
    if (saucer.cool <= 0 && ship.dead <= 0) { const err = saucer.small ? 0.15 : 0.9, a = Math.atan2(wd(saucer.y, ship.y, H), wd(saucer.x, ship.x, W)) + rand(-err, err); ebullets.push({ x: saucer.x, y: saucer.y, vx: Math.cos(a) * 300 * S(), vy: Math.sin(a) * 300 * S(), t: 1.4 }); saucer.cool = saucer.small ? 0.8 : 1.3; }
    for (const b of bullets) if (Math.hypot(b.x - saucer.x, b.y - saucer.y) < saucer.r) { b.t = 0; score += saucer.small ? 1000 : 200; explode(saucer.x, saucer.y, 30, '#ff7ad9'); noise(0.6, 0.15); saucer = null; saucerT = rand(10, 18); break; }
    if (saucer && (saucer.x < -40 || saucer.x > W + 40)) { saucer = null; saucerT = rand(10, 18); }
  }
  // ship collisions
  if (ship.dead <= 0 && ship.hyper <= 0 && ship.inv <= 0) {
    const sr = 11 * S();
    for (let i = rocks.length - 1; i >= 0; i--) { const r = rocks[i]; if (Math.hypot(wd(ship.x, r.x, W), wd(ship.y, r.y, H)) < r.r * 0.85 + sr) { splitRock(r, i); killShip(); break; } }
    if (ship.dead <= 0) for (const b of ebullets) if (Math.hypot(wd(ship.x, b.x, W), wd(ship.y, b.y, H)) < sr) { b.t = 0; killShip(); break; }
    if (ship.dead <= 0 && saucer && Math.hypot(ship.x - saucer.x, ship.y - saucer.y) < sr + saucer.r) { explode(saucer.x, saucer.y, 30, '#ff7ad9'); saucer = null; saucerT = 12; killShip(); }
  }
  bullets = bullets.filter((b) => b.t > 0); ebullets = ebullets.filter((b) => b.t > 0);
  if (!rocks.length && state === 'play') { level++; newLevel(); ship.inv = 2; }
  // heartbeat speeds up as rocks thin out
  beatT -= dt;
  if (beatT <= 0) { tone(beatI++ % 2 ? 62 : 55, 0.12, 'triangle', 0.12); beatT = Math.max(0.28, 1.1 - (1 - Math.min(1, rocks.length / 12)) * 0.8); }
}

// Render > phosphor persistence: fade previous frame instead of clearing, draw glow with shadowBlur
function strokeWrapped(x, y, r, fn) {
  // draw again on the opposite edges while crossing so the wrap is seamless
  for (const ox of [0, x < r ? W : x > W - r ? -W : null]) for (const oy of [0, y < r ? H : y > H - r ? -H : null]) { if (ox === null || oy === null) continue; ctx.save(); ctx.translate(x + ox, y + oy); fn(); ctx.restore(); }
}
function draw() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.fillRect(0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowBlur = 12; ctx.lineWidth = 1.6;
  ctx.strokeStyle = ctx.shadowColor = '#d9ecff';
  for (const r of rocks) strokeWrapped(r.x, r.y, r.r, () => { ctx.rotate(r.ang); ctx.beginPath(); r.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.stroke(); });
  if (ship.dead <= 0 && ship.hyper <= 0 && (ship.inv <= 0 || (stateT * 10 | 0) % 2)) {
    const s = S();
    ctx.strokeStyle = ctx.shadowColor = '#7fd7ff';
    strokeWrapped(ship.x, ship.y, 20 * s, () => {
      ctx.rotate(ship.a); ctx.beginPath(); ctx.moveTo(16 * s, 0); ctx.lineTo(-11 * s, -10 * s); ctx.lineTo(-6 * s, 0); ctx.lineTo(-11 * s, 10 * s); ctx.closePath(); ctx.stroke();
      if (ship.thrust && Math.random() < 0.8) { ctx.strokeStyle = ctx.shadowColor = '#ffb45a'; ctx.beginPath(); ctx.moveTo(-8 * s, -5 * s); ctx.lineTo(-(16 + Math.random() * 10) * s, 0); ctx.lineTo(-8 * s, 5 * s); ctx.stroke(); }
    });
  }
  if (saucer) {
    const s = saucer.r / 18; ctx.strokeStyle = ctx.shadowColor = '#ff7ad9';
    ctx.save(); ctx.translate(saucer.x, saucer.y); ctx.scale(s, s); ctx.beginPath();
    ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(12, 7); ctx.lineTo(-12, 7); ctx.closePath(); ctx.moveTo(-20, 0); ctx.lineTo(-10, -6); ctx.lineTo(10, -6); ctx.lineTo(20, 0); ctx.moveTo(-6, -6); ctx.lineTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(6, -6); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = ctx.shadowColor = '#fff';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2, 0, TAU); ctx.fill(); }
  ctx.fillStyle = ctx.shadowColor = '#ff7ad9';
  for (const b of ebullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.2, 0, TAU); ctx.fill(); }
  ctx.shadowBlur = 6;
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.t * 1.5); ctx.strokeStyle = ctx.fillStyle = ctx.shadowColor = p.col; if (p.line) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke(); } else ctx.fillRect(p.x - 1, p.y - 1, 2, 2); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 8;
  // HUD
  ctx.fillStyle = ctx.shadowColor = '#d9ecff'; ctx.textBaseline = 'top';
  ctx.font = '700 22px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left'; ctx.fillText(String(score).padStart(2, '0'), 18, 14);
  ctx.font = '13px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillText(`HI ${hi}`, W / 2, 18);
  ctx.strokeStyle = '#7fd7ff';
  for (let i = 0; i < lives; i++) { ctx.save(); ctx.translate(26 + i * 18, 52); ctx.rotate(-Math.PI / 2); ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-6, -6); ctx.lineTo(-3, 0); ctx.lineTo(-6, 6); ctx.closePath(); ctx.stroke(); ctx.restore(); }
  ctx.textAlign = 'right'; ctx.fillStyle = '#8aa0b8'; ctx.fillText(`LEVEL ${level}`, W - 18, 18);
  if (W > 600) ctx.fillText('←→ rotate · ↑ thrust · space fire · shift hyperspace', W - 18, H - 26);
  ctx.textAlign = 'center';
  if (attract) { ctx.fillStyle = ctx.shadowColor = `rgba(255,224,106,${0.5 + Math.sin(performance.now() / 260) * 0.5})`; ctx.font = '700 16px ui-monospace, Menlo, monospace'; ctx.fillText(W < 600 ? 'AI DEMO · TAP TO PLAY' : 'AI DEMO · PRESS ANY KEY OR TAP', W / 2, W < 600 ? H * 0.16 : H * 0.12); }
  if (state === 'over') { ctx.fillStyle = ctx.shadowColor = '#fff'; ctx.font = '700 40px ui-monospace, Menlo, monospace'; ctx.fillText('GAME OVER', W / 2, H / 2 - 20); }
  ctx.shadowBlur = 0;
}

newGame();
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__ast = { get score() { return score; }, get rocks() { return rocks.length; }, get lives() { return lives; }, get level() { return level; } };
</script>
</body>
</html>
