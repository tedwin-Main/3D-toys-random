PILLARS.slice(1).forEach(([x, z, r], k) => {

// Scene > carousel: spinning roof + horses on poles over the center pillar (visual only)
const carousel = new THREE.Group();
{
  const base = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.6, 32), new THREE.MeshStandardMaterial({ color: 0xfff3e6 })); base.position.y = 0.3; base.receiveShadow = true;

// Players > lance scooters: round tub in player color, rider, silver lance, balloon bundle on strings behind, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(16,24,40,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(2.4, 0.6, 1); s.position.y = 3.6; s.renderOrder = 5;
  return s;
}
const balloonGeo = new THREE.SphereGeometry(0.42, 18, 14);
balloonGeo.scale(1, 1.18, 1);
const MAX_BAL = 5, LANCE = 1.35, TAIL = 1.25, HIT_R = 1.25, SR = 0.8;
const players3d = new Map();

  const tubMat = mat({ color: p.color, roughness: 0.4 }), skin = mat({ color: 0xffd9b3, roughness: 0.7 }), silver = mat({ color: 0xdfe6ee, metalness: 0.9, roughness: 0.2 }), dark = mat({ color: 0x2b2d42 });
  const tub = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.7, 0.55, 24), tubMat); tub.position.y = 0.42; tub.castShadow = true;
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.09, 8, 28), dark); rim.rotation.x = Math.PI / 2; rim.position.y = 0.7;
  const skirt = new THREE.Mesh(new THREE.TorusGeometry(0.74, 0.12, 8, 28), dark); skirt.rotation.x = Math.PI / 2; skirt.position.y = 0.16;
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.35, 4, 10), tubMat); torso.position.y = 1.15; torso.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), skin); head.position.y = 1.72; head.castShadow = true;
  const helm = new THREE.Mesh(new THREE.SphereGeometry(0.29, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), silver); helm.position.y = 1.76;
  for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), dark); eye.position.set(s * 0.1, 1.74, 0.24); body.add(eye); }
  const lance = new THREE.Mesh(new THREE.ConeGeometry(0.1, 1.5, 10), silver); lance.rotation.x = Math.PI / 2; lance.position.set(0.3, 1.0, 0.95); lance.castShadow = true;
  const guard = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 12, 1, true), silver); guard.rotation.x = -Math.PI / 2; guard.position.set(0.3, 1.0, 0.3);
  body.add(tub, rim, skirt, torso, head, helm, lance, guard);
  const balloons = [], strings = [];
  const bMat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.25, metalness: 0.1, emissive: p.color, emissiveIntensity: 0.15 });
  const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_BAL * 6), 3));

// Pickups > floating balloon bundles (+1 spare)
const PICK_N = 4;
const pick3d = Array.from({ length: PICK_N }, (_, k) => {

  for (let j = 0; j < 3; j++) { const b = new THREE.Mesh(balloonGeo, new THREE.MeshStandardMaterial({ color: BUNT[(k + j) % 5], roughness: 0.25 })); b.position.set((j - 1) * 0.35, 1.4 + (j % 2) * 0.3, 0); b.scale.setScalar(0.8); b.castShadow = true; g.add(b); }
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));

// FX > confetti on pops, dust on dashes + bumps
const PUFF = 700;
const puffGeo = new THREE.BufferGeometry();
const puffPos = new Float32Array(PUFF * 3), puffVel = new Float32Array(PUFF * 3), puffLife = new Float32Array(PUFF), puffCol = new Float32Array(PUFF * 3);

let puffNext = 0;
const _c = new THREE.Color();
function burst(x, y, z, n, spd, colors) {
  for (let k = 0; k < n; k++) {
    const i = puffNext++ % PUFF, a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random());
    puffPos.set([x, y, z], i * 3); puffVel.set([Math.cos(a) * s, 2 + Math.random() * 4, Math.sin(a) * s], i * 3); puffLife[i] = 0.7 + Math.random() * 0.5;

// Audio > pop, dash zip, bump, pickup, out, countdown, fanfare
const gameAudio = createGameAudio({ noiseFilter: 'highpass' });
const { tone, noise } = gameAudio;

// Game > World
const BOT_NAMES = ['Poppy', 'Bingo', 'Squeak', 'Twirl', 'Pinky', 'Zippo', 'Bubbles', 'Dizzy', 'Fizz', 'Noodle', 'Sprocket', 'Jinx', 'Tango', 'Sparky'];
const BOT_COLORS = ['#9b5de5', '#00bbf9', '#00f5d4', '#f15bb5', '#fee440', '#8ac926', '#ff924c', '#6a4c93', '#e76f51', '#2a9d8f', '#b5179e', '#577590', '#ef476f', '#06d6a0'];
const MATCH_T = 150, WIN_POPS = 20, SPEED = 9, TURN = 3.4, DASH_V = 19, OUT_T = 4, START_BAL = 3;
const world = { mode: 'attract', phase: 'count', t: 3, left: MATCH_T, players: new Map(), picks: [], winner: null };
let events = [];
const rng = Math.random;
function addPlayer(id, nick, color, bot) {
  const p = { id, nick, color, bot, x: 0, z: 0, vx: 0, vz: 0, h: 0, mx: 0, mz: 0, dashSeq: 0, lastDash: 0, dashT: 0, dashCD: 0, bal: START_BAL, pops: 0, outs: 0, out: 0, inv: 0, lastHit: 0, skill: 0.5 + rng() * 0.45, tgt: null, tgtT: 0, wiggle: rng() * 6 };

function removePlayer(id) { world.players.delete(id); const g = players3d.get(id); if (g) { scene.remove(g); players3d.delete(id); } }
function clearPlayers() { for (const id of [...world.players.keys()]) removePlayer(id); }
function rimSpawn(p, a) { Object.assign(p, { x: Math.sin(a) * (R_ARENA - 3), z: Math.cos(a) * (R_ARENA - 3), vx: 0, vz: 0, h: a + Math.PI, dashT: 0, bal: START_BAL, out: 0, inv: 2 }); }

  for (let tries = 0; tries < 20; tries++) {
    const a = rng() * Math.PI * 2, r = 5 + rng() * (R_ARENA - 8), x = Math.sin(a) * r, z = Math.cos(a) * r;
    if (PILLARS.every(([px, pz, pr]) => Math.hypot(x - px, z - pz) > pr + 1.5)) { world.picks[k] = { x, z, t: 0 }; return; }

// Run engine > scooter steering (stick sets heading + throttle, limited turn rate), dash, rim + pillar bounces, ghosts
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function stepPlayer(p, dt) {
  p.inv -= dt; p.dashT -= dt; p.dashCD -= dt;
  if (p.out > 0) {
    p.out -= dt;
    if (p.out <= 0) { rimSpawn(p, rng() * Math.PI * 2); events.push(['r', p.id]); }
  }
  const frozen = world.phase !== 'play';
  let mx = frozen ? 0 : p.mx, mz = frozen ? 0 : p.mz;
  const ml = Math.min(1, Math.hypot(mx, mz));
  // turn rate cap is the whole game: you can't spin instantly to guard your balloons
  if (ml > 0.15) { let dh = Math.atan2(mx, mz) - p.h; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); p.h += clamp(dh, -TURN * dt, TURN * dt); }
  const fx = Math.sin(p.h), fz = Math.cos(p.h);
  if (p.dashSeq !== p.lastDash) {
    p.lastDash = p.dashSeq;
    if (p.dashCD <= 0 && !frozen && !p.out) { p.vx = fx * DASH_V; p.vz = fz * DASH_V; p.dashT = 0.35; p.dashCD = 2.2; events.push(['d', p.id]); }
  }
  if (p.dashT <= 0) {
    const k = Math.min(1, dt * 3.2), sp = SPEED * (ml > 0.15 ? ml : 0) * (p.out ? 1.1 : 1);
    p.vx += (fx * sp - p.vx) * k; p.vz += (fz * sp - p.vz) * k;
  }
  p.x += p.vx * dt; p.z += p.vz * dt;
  const r = Math.hypot(p.x, p.z);
  if (r > R_ARENA - SR) {
    const nx = p.x / r, nz = p.z / r, vn = p.vx * nx + p.vz * nz;
    p.x = nx * (R_ARENA - SR); p.z = nz * (R_ARENA - SR);
    if (vn > 0) { p.vx -= 1.6 * vn * nx; p.vz -= 1.6 * vn * nz; }
  }
  if (p.out) return;
  for (const [px, pz, pr] of PILLARS) {
    const dx = p.x - px, dz = p.z - pz, d = Math.hypot(dx, dz);
    if (d < pr + SR && d > 1e-4) {

  const fit = Math.max(1, 1.25 / camera.aspect);
  camPos.lerp(_v.set(fx, 33 * fit, fz + 23 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 1.5), 1 - Math.exp(-dt * 3));
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
