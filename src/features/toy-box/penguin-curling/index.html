<style>

// Scene > Renderer, sky, ice sheet, snow banks, lake past the back edge, mountains, trees, igloo

const iceTex = canvasTex(512, 1536, (g, w, h) => {

  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});

}

for (let k = 0; k < 18; k++) {

  scene.add(bank);
  for (let z = FRONT; z > BACK; z -= 2.2) { const lump = new THREE.Mesh(new THREE.SphereGeometry(0.7 + Math.random() * 0.3, 10, 8), snowMat); lump.position.set(s * (XW + 1 + (Math.random() - 0.5) * 0.6), 0.7, z); lump.scale.y = 0.6; scene.add(lump); }
}
const pineMat = new THREE.MeshStandardMaterial({ color: 0x2f6b4f, flatShading: true }), trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a30 });
for (let k = 0; k < 46; k++) {

  t.add(trunk, cone, cap); t.position.set(x, 0, z);

}
for (let k = 0; k < 9; k++) {
  const h = 30 + Math.random() * 30, m = new THREE.Mesh(new THREE.ConeGeometry(h * 0.8, h, 7), new THREE.MeshStandardMaterial({ color: 0xa9bfd1, flatShading: true }));
  m.position.set(-110 + k * 27 + Math.random() * 10, h / 2 - 2, BACK - 110 - Math.random() * 30);
  const top = new THREE.Mesh(new THREE.ConeGeometry(h * 0.32, h * 0.4, 7), snowMat); top.position.y = h * 0.3; m.add(top);
  scene.add(m);
}
const igloo = new THREE.Mesh(new THREE.SphereGeometry(3, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), snowMat);
igloo.position.set(-15, 0, 8); igloo.castShadow = true;
scene.add(igloo);

// Target > house rings (blue, white, red, white) with a fish on the button
const RINGS = [[1.0, 5], [2.2, 3], [3.5, 2], [5.0, 1]];
const house = new THREE.Group();
[[5.0, 0x3a86ff], [3.5, 0xffffff], [2.2, 0xe63946], [1.0, 0xffffff]].forEach(([r, c], k) => {
  const d = new THREE.Mesh(new THREE.CircleGeometry(r, 56).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: c, roughness: 0.2, transparent: true, opacity: 0.85, polygonOffset: true, polygonOffsetFactor: -1 - k, polygonOffsetUnits: -1 - k }));
  d.position.y = 0.004 + k * 0.002; d.receiveShadow = true;
  house.add(d);
});
const fish = new THREE.Group();
{
  const fm = new THREE.MeshStandardMaterial({ color: 0xff8c42, roughness: 0.4, metalness: 0.2 });
  const fb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 10), fm); fb.scale.set(1.4, 0.5, 0.7);
  const ft = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.3, 4), fm); ft.rotation.z = Math.PI / 2; ft.position.x = -0.5;
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), new THREE.MeshBasicMaterial({ color: 0x111111 })); eye.position.set(0.28, 0.06, 0.15);
  fish.add(fb, ft, eye); fish.position.y = 0.12;
}
house.add(fish);
scene.add(house);

// Players > penguins: black body, white belly + face, beak, flippers, feet, scarf in player color, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(16,24,40,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(2.4, 0.6, 1); s.position.y = 1.9; s.renderOrder = 5;
  return s;
}
const ballGeo = new THREE.SphereGeometry(1, 24, 18);
const blackMat = new THREE.MeshStandardMaterial({ color: 0x1d2433, roughness: 0.55 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fbff, roughness: 0.6 });
const orangeMat = new THREE.MeshStandardMaterial({ color: 0xffa62b, roughness: 0.5 });
const players3d = new Map();
function part(mat, [sx, sy, sz], [x, y, z], shadow = true) { const m = new THREE.Mesh(ballGeo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = shadow; return m; }
function makePenguin(p) {
  const g = new THREE.Group(), pose = new THREE.Group();
  const scarfMat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.7 });
  pose.add(part(blackMat, [0.5, 0.62, 0.46], [0, 0, 0]), part(whiteMat, [0.38, 0.5, 0.3], [0, -0.04, 0.2], false));
  pose.add(part(blackMat, [0.32, 0.32, 0.32], [0, 0.66, 0]), part(whiteMat, [0.22, 0.2, 0.14], [0, 0.66, 0.2], false));
  for (const s of [-1, 1]) pose.add(part(blackMat, [0.05, 0.05, 0.05], [s * 0.1, 0.72, 0.31], false));
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.24, 8), orangeMat); beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.62, 0.42);
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.08, 8, 20), scarfMat); scarf.rotation.x = Math.PI / 2; scarf.position.y = 0.4;
  const tail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.06, 0.4), scarfMat); tail.position.set(0.18, 0.3, -0.36); tail.rotation.x = 0.6;
  const flips = [-1, 1].map((s) => { const f = part(blackMat, [0.07, 0.36, 0.18], [s * 0.5, 0.02, 0], true); f.rotation.z = s * 0.25; return f; });
  pose.add(beak, scarf, tail, ...flips);
  for (const s of [-1, 1]) pose.add(part(orangeMat, [0.13, 0.05, 0.2], [s * 0.17, -0.6, 0.12]));
  pose.position.y = 0.62;
  const tag = nameTag(p.nick, p.color);
  g.add(pose, tag);
  g.userData = { pose, flips, tag, sink: 0 };
  scene.add(g);
  return g;
}

// Players > own aim arrow: flat arrow on the ice, length = charge
const arrow = new THREE.Group();
{
  const sh = new THREE.Shape();
  sh.moveTo(-0.12, 0); sh.lineTo(0.12, 0); sh.lineTo(0.12, 1); sh.lineTo(0.35, 1); sh.lineTo(0, 1.5); sh.lineTo(-0.35, 1); sh.lineTo(-0.12, 1); sh.closePath();
  const m = new THREE.Mesh(new THREE.ShapeGeometry(sh).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x3a86ff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false }));
  m.position.z = 0.6; m.position.y = 0.02;
  arrow.add(m); arrow.visible = false;
}
scene.add(arrow);

// FX > ice spray on knocks + sweeps, lake splashes, snowfall
const PUFF = 500;
const puffGeo = new THREE.BufferGeometry();
const puffPos = new Float32Array(PUFF * 3), puffVel = new Float32Array(PUFF * 3), puffLife = new Float32Array(PUFF);
puffGeo.setAttribute('position', new THREE.BufferAttribute(puffPos, 3));
const puffs = new THREE.Points(puffGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.22, transparent: true, opacity: 0.9 }));
puffs.frustumCulled = false;
scene.add(puffs);
for (let i = 0; i < PUFF; i++) puffPos[i * 3 + 1] = -99;
let puffNext = 0;
function burst(x, y, z, n, spd, up = 2) {
  for (let k = 0; k < n; k++) {
    const i = puffNext++ % PUFF, a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random());
    puffPos.set([x, y, z], i * 3); puffVel.set([Math.cos(a) * s, up * (0.5 + Math.random()), Math.sin(a) * s], i * 3); puffLife[i] = 0.5 + Math.random() * 0.4;
  }
}
const SNOW = 700, snowPos = new Float32Array(SNOW * 3);
for (let i = 0; i < SNOW; i++) snowPos.set([(Math.random() - 0.5) * 80, Math.random() * 30, 20 - Math.random() * 90], i * 3);
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, transparent: true, opacity: 0.8 }));
snow.frustumCulled = false;
scene.add(snow);

// Audio > launch whoosh, knock clack, splash, sweep brush, points, countdown, fanfare
const gameAudio = createGameAudio();
const { tone, noise } = gameAudio;
const sfx = {
  launch(me) { noise(0.5, me ? 0.16 : 0.04, 2600, 500); },
  knock(s, me) { const v = Math.min(1, s / 10) * (me ? 0.3 : 0.12); tone(300, 130, 0.14, v, 'triangle'); noise(0.08, v, 1800, 300); },
  splash() { noise(0.7, 0.2, 1600, 150); tone(520, 140, 0.35, 0.05); },
  sweep() { noise(0.07, 0.035, 5200, 2600); },
  point(n) { [880, 1108, 1318].slice(0, Math.min(3, Math.ceil(n / 2))).forEach((f, i) => tone(f, f, 0.12, 0.07, 'triangle', i * 0.08)); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 0.11, 'square'); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.22, 0.1, 'square', i * 0.11)); },
};

// Game > World
const BOT_NAMES = ['Pingu', 'Waddles', 'Flipper', 'Tux', 'Mumble', 'Pebble', 'Iceberg', 'Snowy', 'Kowalski', 'Rico', 'Chilly', 'Frosty', 'Sardine', 'Puddles'];
const BOT_COLORS = ['#9b5de5', '#00bbf9', '#00f5d4', '#f15bb5', '#fee440', '#8ac926', '#ff924c', '#6a4c93', '#e76f51', '#2a9d8f', '#b5179e', '#577590', '#ef476f', '#06d6a0'];
const ROUNDS = 8, AIM_T = 7, PR = 0.5, FR = 4.5, FR_SWEEP = 2.9, VMIN = 5, VMAX = 22, LEAN = 1.8;
const world = { mode: 'attract', phase: 'count', t: 3, round: 0, rounds: ROUNDS, hx: 0, hz: -37, best: 0, players: new Map(), winner: null };
let events = [];
const rng = Math.random;
function addPlayer(id, nick, color, bot) {
  const p = { id, nick, color, bot, x: 0, z: 0, vx: 0, vz: 0, aim: 0, pow: 0, chT: 0, ax: 0, held: false, armed: false, charging: false, launched: false, out: false, sweep: false, score: 0, last: 0, plan: null, skill: 0.35 + rng() * 0.55 };
  world.players.set(id, p);
  return p;
}
function removePlayer(id) { world.players.delete(id); const g = players3d.get(id); if (g) { scene.remove(g); players3d.delete(id); } }
function clearPlayers() { for (const id of [...world.players.keys()]) removePlayer(id); }
function lineUp() {
  const ps = [...world.players.values()], n = ps.length, gap = Math.min(1.6, 14 / Math.max(1, n - 1));
  // rotate slots each round so nobody is stuck on the awkward outside angle
  ps.forEach((p, k) => {
    const slot = (k + world.round) % n;
    Object.assign(p, { x: (slot - (n - 1) / 2) * gap, z: 0, vx: 0, vz: 0, aim: 0, pow: 0, chT: 0, held: false, armed: false, charging: false, launched: false, out: false, sweep: false, plan: null });
  });
}
function startRound() {
  world.round++;
  world.hx = (rng() - 0.5) * 8; world.hz = -33 - rng() * 7; world.best = 0;
  lineUp();
  world.phase = 'count'; world.t = world.round === 1 ? (world.mode === 'attract' ? 1.5 : 3.5) : 1.6;
}
function startMatch() {
  for (const p of world.players.values()) { p.score = 0; p.last = 0; }
  Object.assign(world, { round: 0, rounds: world.mode === 'attract' ? 3 : ROUNDS, winner: null });
  startRound();
}

// Run engine > aim + charge meter, launch, belly-slide friction, sweep, lean, banks, lake
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tri = (u) => 1 - Math.abs(1 - (u % 2));
function launch(p, pow = p.pow) {
  const v = VMIN + pow * (VMAX - VMIN);
  Object.assign(p, { launched: true, charging: false, pow, vx: Math.sin(p.aim) * v, vz: -Math.cos(p.aim) * v });
  events.push(['l', p.id]);
}
function stepPlayer(p, dt) {
  if (p.out) return;
  if (!p.launched) {
    if (world.phase !== 'aim') return;
    p.aim = clamp(p.aim + p.ax * 0.7 * dt, -0.4, 0.4);
    // must let go once per round so a key held from last round can't fire instantly
    if (!p.held) p.armed = true;
    if (p.held && p.armed && !p.charging) { p.charging = true; p.chT = 0; }
    if (p.charging) { p.chT += dt; p.pow = tri(p.chT * 0.85); if (!p.held) launch(p); }
    return;
  }
  const sp = Math.hypot(p.vx, p.vz);
  p.sweep = p.held && sp > 0.3;
  if (sp < 1e-3) { p.vx = p.vz = 0; return; }
  const ns = Math.max(0, sp - (p.sweep ? FR_SWEEP : FR) * dt);
  if (sp > 1) { const px = -p.vz / sp, pz = p.vx / sp; p.vx += px * p.ax * LEAN * dt; p.vz += pz * p.ax * LEAN * dt; }

  const fit = Math.max(1, 1.2 / camera.aspect), ph = world.phase, mySp = me ? Math.hypot(me.vx, me.vz) : 0;
  let cp, cl;
  if (mg && me.launched && !me.out && mySp > 1.2) { cp = _v.set(mg.position.x * 0.7 + world.hx * 0.3, 6 * fit, mg.position.z + 9 * fit); cl = [mg.position.x * 0.5 + world.hx * 0.5, 0, mg.position.z - 9]; }
  else if (ph === 'count' || (ph === 'aim' && !me?.launched)) { const mx = mg ? mg.position.x : 0; cp = _v.set(mx * 0.3, 10.5 * fit, 13.5 * fit); cl = [mx * 0.2, 0, -15]; }
  else { cp = _v.set(world.hx * 0.5, 14 * fit, world.hz + 15 * fit); cl = [world.hx * 0.8, 0, world.hz + 1]; }
  camPos.lerp(cp, 1 - Math.exp(-dt * 2.2));
  camLook.lerp(_v.set(...cl), 1 - Math.exp(-dt * 2.2));
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
