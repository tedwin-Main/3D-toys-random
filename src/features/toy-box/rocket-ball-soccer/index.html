<!doctype html>
<html lang="en">

<title>Turbo Ball</title>
<style>

  #teams .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #teams .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  #big small { display: block; font-size: 0.3em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.85; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }

  @media (pointer: coarse) { #stick { display: block; } #hint { display: none; } }
</style>

<div id="score" class="card"><span class="b" id="sb">0</span><span class="t" id="clock">3:00</span><span class="o" id="so">0</span></div>

<div id="boost" class="card">0</div>
<div id="big"></div>

<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>
<div id="stick"><div></div></div>

<script type="module">
import * as THREE from 'three';

import { createTurboSim, STEP, L, WD, GOAL_W, GOAL_D, GOAL_H, CR, BR, TEAM } from './turbo-sim.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { createSnapPacing } from '../common/snap-pacing.js';
import { createPrediction, blendAngle } from '../common/own-prediction.js';

import { keyId, trackKeys } from '../common/key-state.js';

// Scene > Renderer, night stadium, floodlights
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xdde8ff, 0x1a2a1a, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(10, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 30, bottom: -30, near: 1, far: 120 });
scene.add(sun);

// Field > pitch with stripes + lines, glass walls, rounded corners, glowing goals
const [BLUE, ORANGE] = TEAM;
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const pitchTex = canvasTex(1200, 720, (g, w, h) => {
  for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? '#2f9e4f' : '#35aa56'; g.fillRect((i * w) / 12, 0, w / 12 + 1, h); }
  const sx = w / (2 * L + 2 * GOAL_D), sz = h / (2 * WD), X = (x) => (x + L + GOAL_D) * sx, Z = (z) => (z + WD) * sz;
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 5;
  g.strokeRect(X(-L), Z(-WD) + 3, X(L) - X(-L), Z(WD) - Z(-WD) - 6);
  g.beginPath(); g.moveTo(X(0), Z(-WD)); g.lineTo(X(0), Z(WD)); g.stroke();
  g.beginPath(); g.arc(X(0), Z(0), 6 * sx, 0, Math.PI * 2); g.stroke();
  for (const s of [-1, 1]) { g.strokeRect(s < 0 ? X(-L) : X(L - 7), Z(-9), 7 * sx, 18 * sz); }
  for (const [s, c] of [[-1, BLUE], [1, ORANGE]]) { g.fillStyle = c; g.globalAlpha = 0.5; g.fillRect(s < 0 ? X(-L - GOAL_D) : X(L), Z(-GOAL_W), GOAL_D * sx, 2 * GOAL_W * sz); g.globalAlpha = 1; }
});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(2 * L + 2 * GOAL_D, 2 * WD).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: pitchTex, roughness: 0.9 }));
pitch.receiveShadow = true;
scene.add(pitch);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(260, 200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x141a2c, roughness: 1 }));
outer.position.y = -0.02;
scene.add(outer);
const glass = new THREE.MeshStandardMaterial({ color: 0x9fd8ff, transparent: true, opacity: 0.12, roughness: 0.1, metalness: 0.2, side: THREE.DoubleSide, depthWrite: false });
const edgeMat = new THREE.MeshBasicMaterial({ color: 0xe8f4ff });
function wallSeg(x0, z0, x1, z1, h = 3.2) {
  const len = Math.hypot(x1 - x0, z1 - z0), a = Math.atan2(x1 - x0, z1 - z0);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, h), glass);
  m.position.set((x0 + x1) / 2, h / 2, (z0 + z1) / 2); m.rotation.y = a - Math.PI / 2;
  const top = new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.12), edgeMat);
  top.position.set((x0 + x1) / 2, h, (z0 + z1) / 2); top.rotation.y = a - Math.PI / 2;
  scene.add(m, top);
}
// outline: long sides, goal-end sides around the mouth, rounded corners
const pts = [];
for (const [cx, cz, a0] of [[L - CR, WD - CR, 0], [-(L - CR), WD - CR, Math.PI / 2], [-(L - CR), -(WD - CR), Math.PI], [L - CR, -(WD - CR), Math.PI * 1.5]]) {
  for (let k = 0; k <= 6; k++) { const a = a0 + (k / 6) * (Math.PI / 2); pts.push([cx + Math.cos(a) * CR, cz + Math.sin(a) * CR]); }
}
for (let i = 0; i < pts.length; i++) {
  const [x0, z0] = pts[i], [x1, z1] = pts[(i + 1) % pts.length];
  if (Math.abs(x0) === L && Math.abs(x1) === L) {
    // end wall split around the goal mouth
    const s = Math.sign(x0), zs = [z0, z1].sort((a, b) => a - b);
    wallSeg(s * L, zs[0], s * L, -GOAL_W); wallSeg(s * L, GOAL_W, s * L, zs[1]);
    wallSeg(s * L, -GOAL_W, s * L, GOAL_W, GOAL_H + 0.01);
    continue;
  }
  wallSeg(x0, z0, x1, z1);
}
const goals3d = [];
for (const [s, c] of [[-1, BLUE], [1, ORANGE]]) {
  const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color: c });
  const netMat = new THREE.MeshStandardMaterial({ color: c, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false });
  for (const z of [-GOAL_W, GOAL_W]) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, GOAL_H, 10), mat); post.position.set(0, GOAL_H / 2, z); g.add(post); }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, GOAL_W * 2, 10).rotateX(Math.PI / 2), mat); bar.position.y = GOAL_H; g.add(bar);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W * 2, GOAL_H), netMat); back.position.set(s * GOAL_D, GOAL_H / 2, 0); back.rotation.y = Math.PI / 2; g.add(back);
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_W * 2).rotateX(-Math.PI / 2), netMat); roof.position.set(s * GOAL_D / 2, GOAL_H, 0); g.add(roof);
  for (const z of [-GOAL_W, GOAL_W]) { const side = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_H), netMat); side.position.set(s * GOAL_D / 2, GOAL_H / 2, z); g.add(side); }
  const light = new THREE.PointLight(c, 30, 18); light.position.set(s * 2, 3, 0); g.add(light);
  g.position.x = s * L;
  scene.add(g);
  goals3d.push({ g, light, mat });
}
// floodlight towers + crowd ring for atmosphere
for (const [x, z] of [[-L - 10, -WD - 8], [L + 10, -WD - 8], [-L - 10, WD + 8], [L + 10, WD + 8]]) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 22, 8), new THREE.MeshStandardMaterial({ color: 0x3a4256 }));
  pole.position.set(x, 11, z);
  const lamp = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.5), new THREE.MeshBasicMaterial({ color: 0xfff6dc }));
  lamp.position.set(x, 22, z); lamp.lookAt(0, 0, 0);
  scene.add(pole, lamp);
}
const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(0.6, 1, 0.6), new THREE.MeshStandardMaterial({ roughness: 1 }), 900);
{
  const m = new THREE.Matrix4(), c = new THREE.Color();
  let i = 0;
  for (let row = 0; row < 5; row++) for (let k = 0; k < 180 && i < 900; k++) {
    const a = (k / 180) * Math.PI * 2, rx = L + 12 + row * 1.4, rz = WD + 10 + row * 1.4;
    m.makeTranslation(Math.cos(a) * rx, 0.5 + row * 0.9, Math.sin(a) * rz);
    crowd.setMatrixAt(i, m); crowd.setColorAt(i, c.set(Math.cos(a) < 0 ? BLUE : ORANGE).offsetHSL(0, -0.2 + Math.random() * 0.2, -0.15 + Math.random() * 0.3)); i++;
  }
}
scene.add(crowd);

// Ball > soccer ball texture, shadow blob, trail
const ballTex = canvasTex(512, 256, (g, w, h) => {
  g.fillStyle = '#f5f7fa'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#20232b';
  for (let i = 0; i < 14; i++) { const x = ((i * 73) % 8) * (w / 8) + (i % 2) * 30, y = ((i * 37) % 4) * (h / 4) + 30; g.beginPath(); for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2; g.lineTo(x + Math.cos(a) * 22, y + Math.sin(a) * 22); } g.fill(); }
});
const ball3d = new THREE.Mesh(new THREE.SphereGeometry(BR, 32, 24), new THREE.MeshStandardMaterial({ map: ballTex, roughness: 0.35, emissive: 0x223355, emissiveIntensity: 0.15 }));
ball3d.castShadow = true;
scene.add(ball3d);
const ballRing = new THREE.Mesh(new THREE.RingGeometry(1.6, 1.9, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 }));
ballRing.position.y = 0.03;
scene.add(ballRing);

// Cars > rounded body in team color, player-color stripe, wheels, boost flame, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(10,16,30,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(3, 0.75, 1); s.position.y = 2.6; s.renderOrder = 5;
  return s;
}
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.36, 14).rotateZ(Math.PI / 2), wheelMat = new THREE.MeshStandardMaterial({ color: 0x15171d, roughness: 0.7 });
const flameGeo = new THREE.ConeGeometry(0.32, 1.4, 10).rotateX(-Math.PI / 2).translate(0, 0, -0.7);
const cars3d = new Map();
function makeCar(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: TEAM[p.team], roughness: 0.3, metalness: 0.35 });
  const chassis = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.6, 2.8, 3, 0.22), paint); chassis.position.y = 0.62;
  const cabin = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.55, 1.3, 3, 0.2), new THREE.MeshStandardMaterial({ color: 0x1b2333, metalness: 0.6, roughness: 0.15 })); cabin.position.set(0, 1.1, -0.25);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.62, 2.84), new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.4 })); stripe.position.y = 0.63;
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.1, 0.4), paint); spoiler.position.set(0, 1.2, -1.3);
  body.add(chassis, cabin, stripe, spoiler);
  for (const [x, z] of [[-0.9, 0.9], [0.9, 0.9], [-0.9, -0.95], [0.9, -0.95]]) { const w = new THREE.Mesh(wheelGeo, wheelMat); w.position.set(x, 0.42, z); body.add(w); }
  const flame = new THREE.Mesh(flameGeo, new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.9 })); flame.position.set(0, 0.62, -1.4); flame.visible = false;
  body.add(flame);
  body.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  const tag = nameTag(p.nick, p.color);
  g.add(body, tag);
  g.userData = { body, flame, tag, paint };
  scene.add(g);
  return g;
}

// FX > goal confetti burst in scoring team color
const CONF = 600;
const confGeo = new THREE.BufferGeometry();
const cPos = new Float32Array(CONF * 3), cCol = new Float32Array(CONF * 3), cVel = new Float32Array(CONF * 3), cLife = new Float32Array(CONF);
confGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
confGeo.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
const confetti = new THREE.Points(confGeo, new THREE.PointsMaterial({ size: 0.35, vertexColors: true }));
confetti.frustumCulled = false;
scene.add(confetti);
for (let i = 0; i < CONF; i++) cPos[i * 3 + 1] = -99;
let cNext = 0;
function burst(x, z, hex) {
  const c = new THREE.Color(hex), w = new THREE.Color(0xffffff);
  for (let k = 0; k < 220; k++) {
    const i = cNext++ % CONF, a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 12;
    cPos.set([x, 2, z], i * 3);
    cVel.set([Math.cos(a) * s, 6 + Math.random() * 14, Math.sin(a) * s], i * 3);
    const cc = Math.random() < 0.3 ? w : c;
    cCol.set([cc.r, cc.g, cc.b], i * 3);
    cLife[i] = 2.4;
  }
}

// Audio > engine for own car, ball thump, goal horn, whistle
let eng = null, engGain = null;
// car engine, pitch + gain driven by speed
const gameAudio = createGameAudio({
  onUnlock: (ctx) => {
    eng = ctx.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 60;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    engGain = ctx.createGain(); engGain.gain.value = 0;
    eng.connect(lp).connect(engGain).connect(ctx.destination); eng.start();
  },
});
const { tone, noise } = gameAudio;
const sfx = {
  kick(v) { tone(180, 70, 0.12, 0.2 * v, 'sine'); noise(0.08, 0.15 * v, 2500, 400); },
  bump() { tone(140, 90, 0.1, 0.08, 'square'); },
  goal() { tone(220, 220, 1.2, 0.12, 'sawtooth'); tone(277, 277, 1.2, 0.1, 'sawtooth'); tone(330, 330, 1.2, 0.1, 'sawtooth'); noise(2, 0.15, 1200, 400); },
  whistle() { tone(2800, 2600, 0.3, 0.08, 'sine'); tone(2800, 2900, 0.5, 0.08, 'sine', 0.35); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 0.11, 'square'); },
};

// Game > World: match rules live in turbo-sim.js (the relay server runs the same code in matches)
const sim = createTurboSim();
const world = sim.world;
const rng = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function startAttract() { sim.startAttract(); }

// Multiplayer > Lobby: humans alternate teams, bots fill the smaller side
const lobby = createLobby({
  game: 'turbo-ball', title: 'Turbo Ball', emoji: '⚽', accent: '#3fa7ff',
  blurb: 'Car soccer, Blue vs Orange, up to 7 a side. Boost into a giant ball and bang it into the other goal. Three minutes, sudden death if tied.',
  maxBots: 13, defaultBots: 6, minPlayers: 2,
  note: 'Up to 14 cars per room (7v7, humans + bots). Teams balance automatically.',
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the match; every page (lobby host too) drives its own car as a guest
  onStart({ bots, seed }) {
    sim.clearPlayers();
    Object.assign(world, { mode: 'match', phase: 'count', t: 3, score: [0, 0], over: false });
    ['teams'].forEach((id) => (document.getElementById(id).style.display = 'block'));
    ['score', 'top'].forEach((id) => (document.getElementById(id).style.display = 'flex'));
    document.getElementById('boost').style.display = 'grid';
    syncTop();
    serverMatch.start({ bots, seed });
  },
  onLobby() {
    serverMatch.stop();
    ['teams', 'score', 'top', 'boost'].forEach((id) => (document.getElementById(id).style.display = 'none'));
    big('');
    startAttract();
  },
});
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
const serverMatch = createServerMatchClient(lobby);

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepCar(p, dt); sim.events = keep; },
  live: () => true,
  seed: () => {},
  merge: (p, host) => { p.boost = host.boost; p.h = blendAngle(p.h, host.h, 0.2); },
  angle: 'h',
});
function applySnap(s) {
  names.read(s);
  Object.assign(world, { phase: s.ph, t: s.t, clock: s.ck, score: s.sc, over: !!s.ov });
  const [x, y, z, vx, vy, vz] = s.B;
  Object.assign(world.ball, { x, y, z, vx, vy, vz });
  const seen = new Set();
  for (const [id, px, pz, h, pvx, pvz, steer, fl, team, boost, goals] of s.P) {
    seen.add(id);
    if (!world.players.has(id) && !names.name(id)) continue;
    const p = world.players.get(id) ?? sim.addPlayer(id, ...names.name(id), !!(fl & 1), team);
    if (p.team !== team) { p.team = team; const g = cars3d.get(id); if (g) g.userData.paint.color.set(TEAM[team]); }
    Object.assign(p, { x: px, z: pz, h, vx: pvx, vz: pvz, steer, boosting: !!(fl & 2), boost, goals });
    if (id === lobby.room.me) pred.correct(p);
  }
  for (const id of [...world.players.keys()]) if (!seen.has(id)) sim.removePlayer(id);
  playEvents(s.ev);
  snapAt = pacing.arrived();
}
let shake = 0;
function playEvents(evs) {
  const me = lobby.room?.me, match = world.mode === 'match';
  for (const e of evs) {
    if (e[0] === 'k') { if (match || Math.random() < 0.3) sfx.kick(e[1]); }
    else if (e[0] === 'u') { if (match) sfx.bump(); }
    else if (e[0] === 'g') {
      const by = world.players.get(e[2]), team = e[1];
      burst(e[4], e[5], TEAM[team]);
      shake = 0.5;
      goals3d[team === 0 ? 1 : 0].light.intensity = 160;
      if (match) {
        sfx.goal();
        const who = by ? esc(by.nick) : '';
        flash(`<small>${e[3] ? `own goal${who ? ` by ${who}` : ''}` : who ? `scored by ${who}${e[2] === me ? ' (you!)' : ''}` : ''}</small><span style="color:${TEAM[team]}">GOAL ${team === 0 ? 'BLUE' : 'ORANGE'}!</span>`, 2.8);
      }
    } else if (e[0] === 'c' && match) { sfx.beep(e[1] === 0); if (e[1] === 0) flash('GO!', 0.7); }
    else if (e[0] === 'f' && match) sfx.whistle();
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Input > keys + touch stick (up = gas, sideways = steer)
const keys = trackKeys();
let ballCam = true;
addEventListener('keydown', (e) => {
  if (keyId(e) === 'KeyC' && !e.repeat) ballCam = !ballCam;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
let stickId = null, sx = 0, sz = 0;
stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
stick.addEventListener('pointerup', () => { stickId = null; sx = sz = 0; knob.style.transform = ''; });
function moveStick(e) {
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dz = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  const l = Math.hypot(dx, dz); if (l > 1) { dx /= l; dz /= l; }
  sx = dx; sz = dz; knob.style.transform = `translate(${dx * 40}px, ${dz * 40}px)`;
}
let touchBoost = false;
const boostEl = document.getElementById('boost');
boostEl.addEventListener('pointerdown', (e) => { e.preventDefault(); touchBoost = true; });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) boostEl.addEventListener(ev, () => (touchBoost = false));
const local = { gas: 0, steer: 0, boost: 0 };
function readInput() {
  local.gas = clamp((keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - sz * 1.4, -1, 1);
  local.steer = clamp((keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0) - sx * 1.3, -1, 1);
  local.boost = keys.ShiftLeft || keys.ShiftRight || keys.Space || touchBoost ? 1 : 0;
}

// HUD > score, clock, boost gauge, teams, banner
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t, len = 1.8) { big(t); flashT = len; }
let hudT = 0;
function hud(dt) {
  flashT -= dt;
  if (world.mode !== 'match') { if (flashT <= 0) big(''); return; }
  const me = world.players.get(lobby.room?.me);
  if (world.phase === 'count') big(`<small>kickoff</small>${Math.max(1, Math.ceil(world.t))}`);
  else if (world.phase === 'final') {
    const [b, o] = world.score, w = b > o ? 0 : o > b ? 1 : -1;
    big(`<small>full time · back to lobby in ${Math.max(0, Math.ceil(world.t))}s</small>${w < 0 ? 'Draw' : `<span style="color:${TEAM[w]}">${w === 0 ? 'BLUE' : 'ORANGE'} WINS</span>`}`);
  } else if (flashT <= 0) big(world.over && world.phase === 'play' ? '<small>next goal wins</small>SUDDEN DEATH' : '');
  boostEl.textContent = Math.round((me?.boost ?? 0) * 100);
  boostEl.style.background = `conic-gradient(#ffb347 ${(me?.boost ?? 0) * 360}deg, rgba(10,16,30,0.66) 0)`;
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  document.getElementById('sb').textContent = world.score[0];
  document.getElementById('so').textContent = world.score[1];
  const c = Math.max(0, world.clock);
  document.getElementById('clock').textContent = world.over ? 'OT' : `${Math.floor(c / 60)}:${String(Math.floor(c % 60)).padStart(2, '0')}`;
  document.getElementById('teams').innerHTML = [0, 1].map((t) => `<h4 style="color:${TEAM[t]}">${t === 0 ? 'BLUE' : 'ORANGE'}</h4>` + [...world.players.values()].filter((p) => p.team === t).sort((a, b) => b.goals - a.goals).map((p) => `<div class="row ${p.id === lobby.room?.me ? 'me' : ''}"><i style="background:${p.color}"></i><span>${esc(p.nick)}</span><em>${p.goals ? '⚽'.repeat(Math.min(p.goals, 4)) : ''}</em></div>`).join('')).join('');
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my car and streams input to the server
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    sim.step(dt);
    playEvents(sim.events); sim.events = [];
    return;
  }
  const me = lobby.room && world.players.get(lobby.room.me);
  pred.tick(me, { inGas: local.gas, inSteer: local.steer, inBoost: local.boost }, dt, STEP);
  serverMatch.tickInput(() => ({ g2: +local.gas.toFixed(2), s: +local.steer.toFixed(2), b: local.boost }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 40, 50), camLook = new THREE.Vector3(), _v = new THREE.Vector3(), _w = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  for (const [id, g] of cars3d) if (!world.players.has(id)) { scene.remove(g); cars3d.delete(id); }
  for (const p of world.players.values()) {
    let g = cars3d.get(p.id);
    if (!g) { g = makeCar(p); cars3d.set(p.id, g); g.position.set(p.x, 0, p.z); g.rotation.y = p.h; }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + v.vx * va, tz = v.z + v.vz * va, a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(16));
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 8) g.position.set(tx, 0, tz);
    g.position.x += (tx - g.position.x) * a; g.position.z += (tz - g.position.z) * a;
    let dh = v.h - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * (hostSim ? 1 : Math.min(1, dt * 16));
    const u = g.userData;
    u.flame.visible = p.boosting;
    if (p.boosting) u.flame.scale.set(1, 1, 0.7 + Math.random() * 0.6);
    u.body.rotation.z = -p.steer * Math.min(Math.hypot(p.vx, p.vz) / 20, 1) * 0.06;
    u.tag.visible = p.id !== lobby.room?.me;
  }
  const b = world.ball;
  const bx = b.x + b.vx * age, bz = b.z + b.vz * age, by = Math.max(BR, b.y + b.vy * age - 12 * age * age);
  const ba = hostSim ? 1 : 1 - Math.exp(-dt * pacing.rate(18));
  const prev = _w.copy(ball3d.position);
  ball3d.position.x += (bx - ball3d.position.x) * ba; ball3d.position.y += (by - ball3d.position.y) * ba; ball3d.position.z += (bz - ball3d.position.z) * ba;
  const mv = _v.copy(ball3d.position).sub(prev); mv.y = 0;
  const ml = mv.length();
  if (ml > 1e-4) ball3d.rotateOnWorldAxis(_v.set(mv.z / ml, 0, -mv.x / ml), ml / BR);
  ballRing.position.set(ball3d.position.x, 0.03, ball3d.position.z);
  ballRing.material.opacity = 0.35 * Math.max(0, 1 - (ball3d.position.y - BR) / 10);
  for (const gl of goals3d) gl.light.intensity += (30 - gl.light.intensity) * Math.min(1, dt * 1.5);
  for (let i = 0; i < CONF; i++) {
    if (cLife[i] <= 0) continue;
    cLife[i] -= dt; cVel[i * 3 + 1] -= 16 * dt; cVel[i * 3] *= 0.99; cVel[i * 3 + 2] *= 0.99;
    for (let k = 0; k < 3; k++) cPos[i * 3 + k] += cVel[i * 3 + k] * dt;
    if (cPos[i * 3 + 1] < 0.05) { cPos[i * 3 + 1] = 0.05; cVel[i * 3 + 1] = 0; cVel[i * 3] *= 0.8; cVel[i * 3 + 2] *= 0.8; }
    if (cLife[i] <= 0) cPos[i * 3 + 1] = -99;
  }
  confGeo.attributes.position.needsUpdate = true; confGeo.attributes.color.needsUpdate = true;
  crowd.position.y = Math.abs(Math.sin(time * (world.phase === 'goal' ? 14 : 5))) * (world.phase === 'goal' ? 0.5 : 0.08);
  hud(dt);
  // camera: ball cam behind own car facing the ball, or plain chase; attract = broadcast view
  const me = world.players.get(lobby.room?.me), mg = me && cars3d.get(me.id);
  if (mg && world.mode === 'match') {
    let dx, dz;
    if (ballCam) { dx = ball3d.position.x - mg.position.x; dz = ball3d.position.z - mg.position.z; }
    else { dx = Math.sin(mg.rotation.y); dz = Math.cos(mg.rotation.y); }
    const dl = Math.hypot(dx, dz) || 1;
    camPos.lerp(_v.set(mg.position.x - (dx / dl) * 11, 5.5, mg.position.z - (dz / dl) * 11), 1 - Math.exp(-dt * 5));
    const lookAt = ballCam ? _w.set(ball3d.position.x, ball3d.position.y * 0.5 + 0.8, ball3d.position.z) : _w.set(mg.position.x + (dx / dl) * 8, 1, mg.position.z + (dz / dl) * 8);
    camLook.lerp(lookAt, 1 - Math.exp(-dt * 8));
    if (gameAudio.ctx) { const sp = Math.hypot(me.vx, me.vz); eng.frequency.value = 55 + sp * 4 + (me.boosting ? 30 : 0); engGain.gain.value = 0.025 + Math.min(sp / 30, 1) * 0.035; }
  } else {
    camPos.lerp(_v.set(ball3d.position.x * 0.5, 34, ball3d.position.z * 0.3 + 40), 1 - Math.exp(-dt * 2));
    camLook.lerp(_w.set(ball3d.position.x * 0.6, 0, ball3d.position.z * 0.5), 1 - Math.exp(-dt * 3));
    if (gameAudio.ctx) engGain.gain.value = 0;
  }
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
