// Field > pitch with stripes + lines, glass walls, rounded corners, glowing goals

const BLUE = '#3fa7ff', ORANGE = '#ff9f43', TEAM = [BLUE, ORANGE];

const pitchTex = canvasTex(1200, 720, (g, w, h) => {

function wallSeg(x0, z0, x1, z1, h = 3.2) {
  const len = Math.hypot(x1 - x0, z1 - z0), a = Math.atan2(x1 - x0, z1 - z0);

const pts = [];

  for (let k = 0; k <= 6; k++) { const a = a0 + (k / 6) * (Math.PI / 2); pts.push([cx + Math.cos(a) * CR, cz + Math.sin(a) * CR]); }
}

}
const goals3d = [];

  const back = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W * 2, GOAL_H), netMat); back.position.set(s * GOAL_D, GOAL_H / 2, 0); back.rotation.y = Math.PI / 2; g.add(back);
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_W * 2).rotateX(-Math.PI / 2), netMat); roof.position.set(s * GOAL_D / 2, GOAL_H, 0); g.add(roof);
  for (const z of [-GOAL_W, GOAL_W]) { const side = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_D, GOAL_H), netMat); side.position.set(s * GOAL_D / 2, GOAL_H / 2, z); g.add(side); }
  const light = new THREE.PointLight(c, 30, 18); light.position.set(s * 2, 3, 0); g.add(light);
  g.position.x = s * L;
  scene.add(g);

}
// floodlight towers + crowd ring for atmosphere

{
  const m = new THREE.Matrix4(), c = new THREE.Color();

// Cars > rounded body in team color, player-color stripe, wheels, boost flame, name tag

  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);

const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.36, 14).rotateZ(Math.PI / 2), wheelMat = new THREE.MeshStandardMaterial({ color: 0x15171d, roughness: 0.7 });
const flameGeo = new THREE.ConeGeometry(0.32, 1.4, 10).rotateX(-Math.PI / 2).translate(0, 0, -0.7);
const cars3d = new Map();
function makeCar(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: TEAM[p.team], roughness: 0.3, metalness: 0.35 });
  const chassis = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.6, 2.8, 3, 0.22), paint); chassis.position.y = 0.62;
  const cabin = new THREE.Mesh(new RoundedBoxGeometry(1.4, 0.55, 1.3, 3, 0.2), new THREE.MeshStandardMaterial({ color: 0x1b2333, metalness: 0.6, roughness: 0.15 })); cabin.position.set(0, 1.1, -0.25);

// FX > goal confetti burst in scoring team color
const CONF = 600;

// Run engine > car physics: forward/lateral split, boost, walls + rounded corners + goal mouths
