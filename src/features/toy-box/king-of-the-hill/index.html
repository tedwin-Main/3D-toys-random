<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Crown Keep</title>
<style>
  :root { --ink: #fff; --card: rgba(16, 24, 40, 0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 14px; user-select: none; }
  #info { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #info .a { font-size: 30px; font-weight: 900; line-height: 1; color: #ffd23f; font-variant-numeric: tabular-nums; }
  #info .a small { font-size: 15px; color: #fff; opacity: 0.75; }
  #info .m { font-size: 13px; margin-top: 4px; opacity: 0.9; }
  #zone { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 18px; font-weight: 900; display: none; white-space: nowrap; }
  #zone.hot { animation: pulse 0.35s infinite alternate; }
  @keyframes pulse { to { transform: translateX(-50%) scale(1.08); } }
  #board { top: 62px; right: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 180px; }
  #board .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #board .row b { width: 16px; opacity: 0.6; }
  #board .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .row span { flex: 1; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row em { font-style: normal; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; opacity: 0.85; }
  #board .row u { display: block; height: 3px; border-radius: 2px; margin-top: 1px; text-decoration: none; }
  #board .row.me span { color: #ffd23f; font-weight: 800; }
  #big { position: fixed; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(32px, 8vw, 80px); font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.3em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.85; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  @media (pointer: coarse) { #hint { display: none; } }
</style>
</head>
<body>
<div id="info" class="card"><div class="a" id="clock"></div><div class="m" id="mine"></div></div>
<div id="zone" class="card"></div>
<div id="board" class="card"></div>
<div id="big"></div>
<div id="hint" class="card"><b>WASD / arrows</b> run · <b>Space</b> shove dash · stand in the glowing ring to score (alone = full points) · knock rivals off the island</div>
<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createLobby } from '../common/room-lobby.js';
import { startTicker } from '../common/room-client.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { createCrownSim, STEP, R_ISLE, ZONE_R, ZONES, WIN_PTS, SPEED } from './crown-sim.js';
import { createNameSync } from '../common/snapshot-names.js';
import { createSnapPacing } from '../common/snap-pacing.js';
import { createPrediction } from '../common/own-prediction.js';
import { createTouchPad } from '../common/touch-joystick.js';
import { createGameAudio } from '../common/game-audio.js';
import { trackKeys } from '../common/key-state.js';

// Scene > Renderer, sky, floating grass island, cliffs, sea, hill mounds under each ring spot
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ff);
scene.fog = new THREE.Fog(0x8fd3ff, 70, 170);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xf2f8ff, 0x4f6b3a, 1.5));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.3);
sun.position.set(-16, 42, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 110 });
scene.add(sun);
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const grassTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#7cc45a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `hsl(${95 + Math.random() * 20},${45 + Math.random() * 15}%,${36 + Math.random() * 16}%)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 6); }
  // mowed stripes read as a sports field from the high camera
  g.fillStyle = 'rgba(255,255,255,0.05)';
  for (let x = 0; x < w; x += 128) g.fillRect(x, 0, 64, h);
});
const isle = new THREE.Mesh(new THREE.CylinderGeometry(R_ISLE, R_ISLE - 3, 3, 72), [new THREE.MeshStandardMaterial({ color: 0x8a6440, roughness: 1 }), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.95 }), new THREE.MeshStandardMaterial({ color: 0x6a4a30 })]);
isle.position.y = -1.5; isle.receiveShadow = true;
scene.add(isle);
const under = new THREE.Mesh(new THREE.ConeGeometry(R_ISLE - 3, 16, 24, 3), new THREE.MeshStandardMaterial({ color: 0x7a5a3a, flatShading: true, roughness: 1 }));
under.rotation.x = Math.PI; under.position.y = -11;
scene.add(under);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3fa9d9, roughness: 0.3, metalness: 0.1 }));
sea.position.y = -22;
scene.add(sea);
for (const [x, z] of ZONES) {
  const mound = new THREE.Mesh(new THREE.CylinderGeometry(ZONE_R + 0.2, ZONE_R + 1.4, 0.3, 40), new THREE.MeshStandardMaterial({ color: 0x8fd16a, roughness: 0.9 }));
  // visual only: 0.15 high bump, physics floor stays flat
  mound.position.set(x, 0, z); mound.receiveShadow = true;
  scene.add(mound);
}
for (let k = 0; k < 22; k++) {
  const a = (k / 22) * Math.PI * 2 + Math.random() * 0.2;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.6 + Math.random() * 0.7, 0), new THREE.MeshStandardMaterial({ color: 0x9aa0a6, flatShading: true }));
  rock.position.set(Math.cos(a) * (R_ISLE - 0.6), 0.1, Math.sin(a) * (R_ISLE - 0.6)); rock.castShadow = true;
  scene.add(rock);
}
for (let k = 0; k < 14; k++) {
  const cl = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
  for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.SphereGeometry(2 + Math.random() * 2, 10, 8), m); s.position.set(j * 2.4, Math.random(), Math.random() * 1.5); cl.add(s); }
  const a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 60;
  cl.position.set(Math.cos(a) * r, -10 + Math.random() * 30, Math.sin(a) * r);
  scene.add(cl);
}

// Zone > glowing ring, light beam, floating crown; next-spot ghost ring
const zoneGroup = new THREE.Group();
const ringMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.9, side: THREE.DoubleSide });
const zoneRing = new THREE.Mesh(new THREE.RingGeometry(ZONE_R - 0.35, ZONE_R, 64).rotateX(-Math.PI / 2), ringMat);
zoneRing.position.y = 0.2;
const fillMat = new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.16, side: THREE.DoubleSide });
const zoneFill = new THREE.Mesh(new THREE.CircleGeometry(ZONE_R - 0.35, 48).rotateX(-Math.PI / 2), fillMat);
zoneFill.position.y = 0.18;
const beamMat = new THREE.MeshBasicMaterial({ color: 0xffe9a0, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false });
const beam = new THREE.Mesh(new THREE.CylinderGeometry(ZONE_R, ZONE_R, 14, 48, 1, true), beamMat);
beam.position.y = 7;
const crown = new THREE.Group();
{
  const gold = new THREE.MeshStandardMaterial({ color: 0xffd23f, metalness: 0.85, roughness: 0.25, emissive: 0x6a4a00, emissiveIntensity: 0.5 });
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.45, 24, 1, true), gold);
  crown.add(band);
  for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2, c = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.55, 8), gold); c.position.set(Math.cos(a) * 0.8, 0.45, Math.sin(a) * 0.8); crown.add(c); }
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.18), new THREE.MeshStandardMaterial({ color: 0xff3b6b, emissive: 0xff3b6b, emissiveIntensity: 0.6 }));
  gem.position.set(0, 0.05, 0.82); crown.add(gem);
}
crown.position.y = 5;
zoneGroup.add(zoneRing, zoneFill, beam, crown);
scene.add(zoneGroup);
const ghost = new THREE.Mesh(new THREE.RingGeometry(ZONE_R - 0.25, ZONE_R, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
ghost.position.y = 0.21; ghost.visible = false;
scene.add(ghost);

// Players > knight blobs: round body, visor, plume in player color, mini crown on the holder, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(16,24,40,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(2.4, 0.6, 1); s.position.y = 2.3; s.renderOrder = 5;
  return s;
}
const bodyGeo = new THREE.SphereGeometry(0.62, 24, 18), footGeo = new THREE.SphereGeometry(0.2, 10, 8);
const steel = new THREE.MeshStandardMaterial({ color: 0xc9d1dc, metalness: 0.75, roughness: 0.3 });
const visorMat = new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: 0.4 });
const players3d = new Map();
function makeKnight(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5 });
  const m = new THREE.Mesh(bodyGeo, mat); m.position.y = 0.72; m.scale.set(1, 0.92, 1); m.castShadow = true;
  const helm = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), steel); helm.position.y = 1.02; helm.castShadow = true;
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.12, 0.2), visorMat); visor.position.set(0, 1.1, 0.42);
  const plume = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.6, 8), mat); plume.position.set(0, 1.6, -0.1); plume.rotation.x = -0.4;
  body.add(m, helm, visor, plume);
  for (const s of [-1, 1]) { const f = new THREE.Mesh(footGeo, steel); f.position.set(s * 0.3, 0.15, 0.1); f.scale.set(1, 0.6, 1.4); f.castShadow = true; body.add(f); }
  const mini = crown.clone(); mini.scale.setScalar(0.45); mini.position.y = 1.85; mini.visible = false;
  const tag = nameTag(p.nick, p.color);
  g.add(body, mini, tag);
  g.userData = { body, mini, tag, mat };
  g.scale.setScalar(1.2);
  scene.add(g);
  return g;
}

// FX > dust puffs on shoves, splash-free fall streaks
const PUFF = 400;
const puffGeo = new THREE.BufferGeometry();
const puffPos = new Float32Array(PUFF * 3), puffVel = new Float32Array(PUFF * 3), puffLife = new Float32Array(PUFF);
puffGeo.setAttribute('position', new THREE.BufferAttribute(puffPos, 3));
const puffs = new THREE.Points(puffGeo, new THREE.PointsMaterial({ color: 0xfff6dc, size: 0.35, transparent: true, opacity: 0.85 }));
puffs.frustumCulled = false;
scene.add(puffs);
for (let i = 0; i < PUFF; i++) puffPos[i * 3 + 1] = -99;
let puffNext = 0;
function burst(x, y, z, n, spd) {
  for (let k = 0; k < n; k++) {
    const i = puffNext++ % PUFF, a = Math.random() * Math.PI * 2, s = spd * (0.4 + Math.random());
    puffPos.set([x, y, z], i * 3); puffVel.set([Math.cos(a) * s, 2 + Math.random() * 3, Math.sin(a) * s], i * 3); puffLife[i] = 0.6 + Math.random() * 0.3;
  }
}

// Audio > score ding, shove thump, fall whistle, ring move, countdown, fanfare
const gameAudio = createGameAudio();
const { tone, noise } = gameAudio;
const sfx = {
  point() { tone(1320, 1320, 0.08, 0.05, 'triangle'); },
  shove(me) { noise(0.18, me ? 0.3 : 0.12, 900, 120); tone(160, 70, 0.18, me ? 0.2 : 0.08); },
  fall() { tone(900, 160, 0.9, 0.08, 'sine'); },
  move() { tone(300, 900, 0.5, 0.08, 'triangle'); tone(450, 1350, 0.5, 0.05, 'triangle', 0.05); },
  dash() { noise(0.12, 0.1, 3000, 900); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 0.11, 'square'); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.22, 0.1, 'square', i * 0.11)); },
};

// Game > World: rules live in crown-sim.js; attract runs it here, a match mirrors the relay server's snapshots
const sim = createCrownSim();
const world = sim.world;
const rng = Math.random;

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'crown-keep', title: 'Crown Keep', emoji: '👑', accent: '#ffd23f',
  blurb: 'A glowing crown ring hops between hilltops. Stand in it to score: alone you earn full points, a crowd splits them. Shove-dash rivals off the floating island.',
  maxBots: 13, defaultBots: 5, minPlayers: 2,
  note: `Up to 14 knights per room (humans + bots). First to ${WIN_PTS} points or most after 2½ minutes.`,
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the match; every page (lobby host too) plays as a guest
  onStart({ bots }) {
    sim.clearPlayers();
    Object.assign(world, { mode: 'match', phase: 'count', t: 3.5 });
    ['info', 'board', 'zone'].forEach((id) => (document.getElementById(id).style.display = 'block'));
    document.getElementById('top').style.display = 'flex';
    syncTop();
    serverMatch.start({ bots });
  },
  onLobby() {
    serverMatch.stop();
    ['info', 'board', 'top', 'zone'].forEach((id) => (document.getElementById(id).style.display = 'none'));
    big('');
    sim.startAttract();
  },
});
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
const serverMatch = createServerMatchClient(lobby);

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepPlayer(p, dt); sim.events = keep; },
  live: (p) => !(p.fall > 0),
  seed: (p) => { p.lastDash = local.dashSeq; },
  angle: 'face',
});
function applySnap(s) {
  serverMatch.onSnapshot(s);
  names.read(s);
  Object.assign(world, { phase: s.ph, t: s.t, left: s.lf, zone: s.z, next: s.nz, hopT: s.ht, hold: s.h, crowd: s.n, winner: s.win });
  const seen = new Set();
  for (const [id, x, y, z, vx, vz, face, fl, pts, falls] of s.P) {
    seen.add(id);
    if (!world.players.has(id) && !names.name(id)) continue;
    const p = world.players.get(id) ?? sim.addPlayer(id, ...names.name(id), !!(fl & 1));
    Object.assign(p, { x, y, z, vx, vz, face, fall: fl & 2 ? 1 : 0, dashT: fl & 4 ? 0.1 : 0, stun: fl & 8 ? 0.1 : 0, pts, falls });
    if (id === lobby.room.me) pred.correct(p);
  }
  for (const id of [...world.players.keys()]) if (!seen.has(id)) sim.removePlayer(id);
  playEvents(s.ev ?? []);
  snapAt = pacing.arrived();
}
let shake = 0;
function playEvents(evs) {
  const me = lobby.room?.me, match = world.mode === 'match';
  for (const e of evs) {
    const p = world.players.get(e[1]);
    if (e[0] === 's') { burst(e[3], 0.8, e[4], 14, 4); if (match) sfx.shove(e[1] === me || e[2] === me); if (e[2] === me && match) shake = 0.4; }
    else if (e[0] === 'f' && p) { if (match && (e[1] === me || rng() < 0.4)) sfx.fall(); if (e[1] === me && match) flash('<small>overboard!</small>🪂 back in a sec', 1.4); }
    else if (e[0] === 'd' && e[1] === me) sfx.dash();
    else if (e[0] === 'p' && e[1] === me && match) sfx.point();
    else if (e[0] === 'm' && match) { sfx.move(); flash('<small>the crown moved</small>👑 GO!', 1.1); }
    else if (e[0] === 'c' && match) sfx.beep(e[1] === 0);
    else if (e[0] === 'w' && p) { if (match) sfx.win(); flash(`<small>${e[1] === me ? 'you rule the hill!' : 'long live the king'}</small>👑 ${esc(p.nick)}`, 4); }
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Input > keyboard + phone joystick + SHOVE button
const keys = trackKeys(), local = { x: 0, z: 0, dashSeq: 0 };
addEventListener('keydown', (e) => {
  if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) local.dashSeq++;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
const pad = createTouchPad({ buttons: [{ id: 'shove', label: 'SHOVE', color: 'rgba(255, 210, 63, 0.7)' }], onStart: gameAudio.unlock });
pad.onPress('shove', () => local.dashSeq++);
function readInput() {
  local.x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + pad.x;
  local.z = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) - pad.y;
}

// HUD > match clock, zone status, standings with score bars, banner
const bigEl = document.getElementById('big'), zoneEl = document.getElementById('zone');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t, len = 1.8) { big(t); flashT = len; }
let hudT = 0;
const mmss = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;
function hud(dt) {
  flashT -= dt;
  if (world.mode !== 'match') { if (flashT <= 0) big(''); return; }
  const me = world.players.get(lobby.room?.me);
  if (world.phase === 'count') big(`<small>stand alone in the ring</small>${Math.max(1, Math.ceil(world.t))}`);
  else if (world.phase === 'final') { const top = world.players.get(world.winner); big(`<small>final · back to lobby in ${Math.max(0, Math.ceil(world.t))}s</small>${top ? `👑 ${esc(top.nick)}` : 'Draw!'}`); }
  else if (flashT <= 0) big(me?.fall ? '<small>climbing back up…</small>' : '');
  const holder = world.players.get(world.hold);
  zoneEl.innerHTML = world.phase !== 'play' ? '👑 get ready' : world.crowd > 1 ? `⚔️ ${world.crowd} knights share the ring · points split` : holder ? `👑 <span style="color:${holder.color}">${esc(holder.nick)}</span>${holder.id === lobby.room?.me ? ' (you!)' : ''} holds the crown` : '👑 crown is free';
  zoneEl.classList.toggle('hot', world.phase === 'play' && world.hopT < 3);
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  document.getElementById('clock').innerHTML = `${mmss(world.left)}<small> left</small>`;
  document.getElementById('mine').textContent = `${me ? `you: ${Math.floor(me.pts)} pts · ` : ''}ring hops in ${Math.max(0, Math.ceil(world.hopT))}s · first to ${WIN_PTS}`;
  const r = [...world.players.values()].sort((a, b) => b.pts - a.pts);
  document.getElementById('board').innerHTML = r.map((p, i) => `<div class="row ${p.id === lobby.room?.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:${p.color}"></i><span>${p.id === world.hold ? '👑 ' : ''}${esc(p.nick)}</span><em>${Math.floor(p.pts)}</em></div>`).join('');
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my knight and streams input to the server
let acc = 0;
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    for (acc += dt; acc >= STEP; acc -= STEP) sim.step();
    playEvents(sim.events); sim.events = [];
    return;
  }
  const room = lobby.room;
  if (!room) return;
  pred.tick(world.players.get(room.me), { mx: local.x, mz: local.z, dashSeq: local.dashSeq }, dt, STEP);
  if (world.phase === 'play') { world.left -= dt; world.hopT -= dt; }
  serverMatch.tickInput(() => ({ x: +local.x.toFixed(2), z: +local.z.toFixed(2), d: local.dashSeq }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 40, 32), camLook = new THREE.Vector3(), _v = new THREE.Vector3();
const zonePos = new THREE.Vector3(), holdCol = new THREE.Color(), gold = new THREE.Color(0xffd23f), red = new THREE.Color(0xff4d4d);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  for (const [id, g] of players3d) if (!world.players.has(id)) { scene.remove(g); players3d.delete(id); }
  for (const p of world.players.values()) {
    let g = players3d.get(p.id);
    if (!g) { g = makeKnight(p); players3d.set(p.id, g); g.position.set(p.x, p.y, p.z); }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + v.vx * va, tz = v.z + v.vz * va, a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(16));
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 6) g.position.set(tx, p.y, tz);
    g.position.x += (tx - g.position.x) * a; g.position.z += (tz - g.position.z) * a;
    g.position.y += (p.y - g.position.y) * (hostSim ? 1 : a);
    let dh = v.face - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 14);
    const u = g.userData, sp = Math.hypot(p.vx, p.vz);
    u.body.position.y = p.fall ? 0 : Math.abs(Math.sin(time * 14 + p.id)) * Math.min(sp / SPEED, 1) * 0.18;
    u.body.rotation.x = p.dashT > 0 ? 0.55 : p.stun > 0 ? -0.5 : Math.min(sp / SPEED, 1) * 0.12;
    u.body.rotation.z = p.stun > 0 ? Math.sin(time * 30) * 0.25 : p.fall ? time * 6 : 0;
    u.mini.visible = p.id === world.hold && !p.fall;
    if (u.mini.visible) u.mini.rotation.y = time * 2;
    g.visible = p.y > -20;
  }
  // zone: slide to the current spot, color by holder, ghost ring warns of the next hop
  const [zx, zz] = ZONES[world.zone];
  zonePos.set(zx, 0, zz);
  if (zoneGroup.position.distanceTo(zonePos) > 30) zoneGroup.position.copy(zonePos);
  zoneGroup.position.lerp(zonePos, 1 - Math.exp(-dt * 6));
  const holder = world.players.get(world.hold);
  holdCol.copy(world.crowd > 1 ? red : holder ? new THREE.Color(holder.color) : gold);
  ringMat.color.lerp(holdCol, 1 - Math.exp(-dt * 8)); fillMat.color.copy(ringMat.color); beamMat.color.copy(ringMat.color);
  fillMat.opacity = 0.14 + Math.sin(time * 4) * 0.05;
  zoneRing.scale.setScalar(1 + Math.sin(time * 3) * 0.02);
  crown.rotation.y = time * 1.2; crown.position.y = 5 + Math.sin(time * 2) * 0.35;
  const warn = world.phase === 'play' && world.hopT < 4;
  ghost.visible = warn;
  if (warn) { const [gx, gz] = ZONES[world.next]; ghost.position.set(gx, 0.21, gz); ghost.material.opacity = 0.3 + Math.abs(Math.sin(time * 8)) * 0.5; }
  for (let i = 0; i < PUFF; i++) {
    if (puffLife[i] <= 0) continue;
    puffLife[i] -= dt; puffVel[i * 3 + 1] -= 9 * dt;
    for (let k = 0; k < 3; k++) puffPos[i * 3 + k] += puffVel[i * 3 + k] * dt;
    if (puffLife[i] <= 0) puffPos[i * 3 + 1] = -99;
  }
  puffGeo.attributes.position.needsUpdate = true;
  hud(dt);
  // camera: whole island in view, nudged toward own knight and the crown ring
  const me = world.players.get(lobby.room?.me), mg = me && !me.fall && players3d.get(me.id);
  const fx = (mg ? mg.position.x * 0.25 : 0) + zoneGroup.position.x * 0.2, fz = (mg ? mg.position.z * 0.25 : 0) + zoneGroup.position.z * 0.2;
  const fit = Math.max(1, 1.25 / camera.aspect);
  camPos.lerp(_v.set(fx, 31 * fit, fz + 23 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 1), 1 - Math.exp(-dt * 3));
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
sim.startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
