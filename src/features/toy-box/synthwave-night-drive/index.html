<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Neon Drive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;800&display=swap');
  :root { --ink: #ffe6ff; --pink: #ff3fd2; --cyan: #33f0ff; --card: rgba(20, 4, 36, 0.55); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0218; font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(6px); border: 1px solid rgba(255, 63, 210, 0.35); border-radius: 12px; user-select: none; box-shadow: 0 0 24px rgba(255, 63, 210, 0.25); }
  #title { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); font-family: 'Monoton', cursive; font-size: clamp(28px, 5vw, 52px); color: #ffd23f; text-shadow: 0 0 8px #ff3fd2, 0 0 24px #ff3fd2; letter-spacing: 0.08em; pointer-events: none; transition: opacity 1s; white-space: nowrap; }
  #hud { top: 16px; left: 16px; padding: 10px 14px; font-size: 12px; display: grid; gap: 4px; min-width: 170px; }
  #hud b { font-size: 20px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  #hud .k { opacity: 0.65; font-size: 10px; line-height: 1.6; margin-top: 4px; }
  #bar { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 6px 8px; display: flex; gap: 6px; }
  #bar button { font: inherit; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: var(--ink); background: rgba(255, 63, 210, 0.12); border: 1px solid rgba(255, 63, 210, 0.4); padding: 7px 11px; border-radius: 8px; cursor: pointer; }
  #bar button.on { background: var(--pink); color: #1a0020; box-shadow: 0 0 14px var(--pink); }
  #pop { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 800; color: #ffd23f; text-shadow: 0 0 12px #ff3fd2; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 0, 12, 0.35); cursor: pointer; }
  #start div { padding: 16px 26px; border: 2px solid var(--cyan); border-radius: 12px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); box-shadow: 0 0 22px rgba(51, 240, 255, 0.4); font-weight: 800; letter-spacing: 0.2em; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div id="title">NEON DRIVE</div>
<div id="hud" class="card">
  <div>SPEED <b id="spd">0</b> km/h</div>
  <div>DIST <b id="dist">0.0</b> km</div>
  <div>SCORE <b id="score">0</b></div>
  <div class="k">A / D or ← → steer · W / S throttle<br />near-misses score big</div>
</div>
<div id="bar" class="card"><button id="music" class="on">♫ MUSIC</button><button id="crt" class="on">CRT</button><button id="cam">CAMERA</button><button id="auto">AUTOPILOT</button></div>
<div id="pop"></div>
<div id="start"><div>CLICK TO DRIVE</div></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// Scene > Renderer, camera, post chain (bloom, then CRT on the final image)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = new THREE.Color(0x2a0a40);
scene.fog = new THREE.Fog(FOG, 120, 520);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 2000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.45, 0.55));
composer.addPass(new OutputPass());
const crt = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uTime: { value: 0 }, uOn: { value: 1 }, uShake: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uTime, uOn, uShake; varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec2 c = uv - 0.5;
      // chromatic split grows toward the edges and on impacts
      float ab = (0.0016 + dot(c,c) * 0.006) * uOn + uShake * 0.01;
      vec3 col = vec3(texture2D(tDiffuse, uv + c * ab * 2.).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - c * ab * 2.).b);
      float scan = 0.5 + 0.5 * sin(uv.y * uRes.y * 1.4 + uTime * 6.);
      col *= mix(1., 0.86 + 0.14 * scan, uOn);
      col *= mix(1., 1. - dot(c, c) * 1.1, uOn);
      col += uShake * vec3(0.6, 0.1, 0.5) * 0.4;
      gl_FragColor = vec4(col, 1.);
    }`,
});
composer.addPass(crt);

// Sky > Gradient dome with stars
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 vD;
    float h(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453); }
    void main(){
      float y = vD.y;
      vec3 col = mix(vec3(0.55,0.12,0.38), vec3(0.12,0.03,0.24), smoothstep(-0.02, 0.22, y));
      col = mix(col, vec3(0.02,0.0,0.07), smoothstep(0.2, 0.7, y));
      vec3 q = floor(vD * 260.);
      float s = step(0.9965, h(q)) * smoothstep(0.05, 0.4, y);
      col += vec3(1.) * s * (0.6 + 0.4 * h(q + 1.));
      gl_FragColor = vec4(col, 1.);
    }`,
})));

// Sky > Sun: gradient disc sliced by widening stripes toward the horizon
const sunMesh = new THREE.Mesh(new THREE.CircleGeometry(150, 64), new THREE.ShaderMaterial({
  transparent: true, fog: false, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv;
    void main(){
      vec3 col = mix(vec3(1.0,0.12,0.6), vec3(1.0,0.86,0.25), smoothstep(0.45, 0.95, vUv.y));
      float y = vUv.y;
      float band = fract(y * 14. + uTime * 0.25);
      float w = smoothstep(0.8, 0.45, y) * 0.6;
      float cut = step(band, w);
      gl_FragColor = vec4(col * 0.85, 1. - cut);
    }`,
}));
sunMesh.position.set(0, 70, -900);
scene.add(sunMesh);
const sunGlow = new THREE.Mesh(new THREE.CircleGeometry(300, 48), new THREE.ShaderMaterial({
  transparent: true, fog: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec2 vUv; void main(){ float d = length(vUv - 0.5) * 2.; gl_FragColor = vec4(vec3(1.0,0.25,0.6) * pow(max(1. - d, 0.), 2.5) * 0.22, 1.); }`,
}));
sunGlow.position.set(0, 70, -905);
scene.add(sunGlow);

// World > Grid terrain: one static mesh, heights + lines scroll in the shader by distance
const terrU = { uOff: { value: 0 }, uTime: { value: 0 }, fogColor: { value: FOG }, fogNear: { value: 120 }, fogFar: { value: 520 } };
const terr = new THREE.Mesh(new THREE.PlaneGeometry(700, 700, 220, 220).rotateX(-Math.PI / 2).translate(0, 0, -330), new THREE.ShaderMaterial({
  uniforms: terrU, fog: true, extensions: { derivatives: true },
  vertexShader: `uniform float uOff; varying vec2 vG; varying float vH; varying float vFogDepth;
    float hsh(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(hsh(i), hsh(i+vec2(1,0)), f.x), mix(hsh(i+vec2(0,1)), hsh(i+vec2(1,1)), f.x), f.y); }
    void main(){
      vec3 p = position;
      vec2 g = vec2(p.x, p.z - uOff);
      float side = smoothstep(14., 70., abs(p.x));
      float m = (n2(g * 0.025) * 0.6 + n2(g * 0.06) * 0.3 + n2(g * 0.14) * 0.1);
      p.y = side * m * m * 120. * smoothstep(0., 140., abs(p.x));
      vG = g; vH = p.y;
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      vFogDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `uniform vec3 fogColor; uniform float fogNear, fogFar; varying vec2 vG; varying float vH; varying float vFogDepth;
    void main(){
      vec2 cell = vG / 6.;
      vec2 gd = abs(fract(cell - 0.5) - 0.5) / fwidth(cell);
      float line = 1. - min(min(gd.x, gd.y), 1.);
      vec3 base = vec3(0.05, 0.0, 0.1);
      vec3 neon = mix(vec3(1.0, 0.2, 0.85), vec3(0.2, 0.95, 1.0), smoothstep(5., 50., vH));
      vec3 col = base + neon * line * 1.6;
      float f = smoothstep(fogNear, fogFar, vFogDepth);
      gl_FragColor = vec4(mix(col, fogColor, f), 1.);
    }`,
}));
scene.add(terr);

// World > Road: dark strip with glowing edges + dashes, scrolling
const roadU = { uOff: { value: 0 }, fogColor: { value: FOG }, fogNear: { value: 120 }, fogFar: { value: 520 } };
const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 700).rotateX(-Math.PI / 2).translate(0, 0.05, -330), new THREE.ShaderMaterial({
  uniforms: roadU,
  vertexShader: `varying vec2 vP; varying float vD; void main(){ vP = position.xz; vec4 mv = modelViewMatrix * vec4(position,1.); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float uOff; uniform vec3 fogColor; uniform float fogNear, fogFar; varying vec2 vP; varying float vD;
    void main(){
      float x = vP.x, z = vP.y - uOff;
      vec3 col = vec3(0.03, 0.01, 0.06);
      float edge = smoothstep(0.25, 0.0, abs(abs(x) - 6.1));
      col += vec3(1.0, 0.25, 0.85) * edge * 2.;
      float lane = smoothstep(0.16, 0.0, abs(abs(x) - 2.05)) * step(0.5, fract(z / 9.));
      col += vec3(0.3, 0.95, 1.0) * lane * 1.4;
      col += vec3(0.25, 0.05, 0.3) * (0.5 + 0.5 * sin(z * 0.5)) * 0.06;
      gl_FragColor = vec4(mix(col, fogColor, smoothstep(fogNear, fogFar, vD)), 1.);
    }`,
}));
scene.add(road);

// World > Palms: instanced silhouettes recycled along both shoulders
const PALMS = 60, SP = 22;
const palmMat = new THREE.MeshBasicMaterial({ color: 0x0c0218 });
const trunkGeo = (() => {
  const pts = [];
  for (let i = 0; i <= 10; i++) pts.push(new THREE.Vector3(Math.sin(i / 10 * 1.2) * 1.2, i * 1.1, 0));
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.22, 6);
})();
const frondGeo = (() => {
  const parts = [];
  for (let k = 0; k < 7; k++) {
    const g = new THREE.ConeGeometry(0.5, 5, 4, 1).rotateX(Math.PI / 2).translate(0, 0, 2.5).scale(1, 0.2, 1);
    g.rotateX(0.5); g.rotateY((k / 7) * Math.PI * 2);
    g.translate(Math.sin(1.2) * 1.2, 11, 0);
    parts.push(g);
  }
  const pos = [], idx = [];
  let off = 0;
  for (const g of parts) { const ng = g.index ? g : g; pos.push(...ng.attributes.position.array); for (const v of ng.index.array) idx.push(v + off); off += ng.attributes.position.count; }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setIndex(idx);
  return out;
})();
const trunks = new THREE.InstancedMesh(trunkGeo, palmMat, PALMS), fronds = new THREE.InstancedMesh(frondGeo, palmMat, PALMS);
trunks.frustumCulled = fronds.frustumCulled = false;
scene.add(trunks, fronds);
const palms = Array.from({ length: PALMS }, (_, i) => ({ side: i % 2 ? 1 : -1, z: -Math.floor(i / 2) * SP * 2 - (i % 2) * SP, s: 0.8 + Math.random() * 0.4, r: Math.random() * 6 }));
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _v = new THREE.Vector3(), _sv = new THREE.Vector3();

// Cars > Model: wedge coupe from an extruded side profile, neon edge lines, light bars
function makeCar(body, edge, tail = 0xff2040) {
  const g = new THREE.Group();
  const prof = new THREE.Shape();
  [[0, 0.32], [0, 0.95], [1.3, 1.02], [1.9, 1.38], [3.0, 1.36], [3.7, 0.9], [5.2, 0.62], [5.3, 0.32]].forEach(([z, y], i) => (i ? prof.lineTo(z, y) : prof.moveTo(z, y)));
  prof.closePath();
  const geo = new THREE.ExtrudeGeometry(prof, { depth: 2.0, bevelEnabled: false });
  geo.translate(-2.65, 0, -1.0);
  geo.rotateY(Math.PI / 2);
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: body, metalness: 0.6, roughness: 0.35 }));
  g.add(mesh);
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color: edge }));
  g.add(lines);
  const tl = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.16, 0.05), new THREE.MeshBasicMaterial({ color: tail }));
  tl.position.set(0, 0.8, 2.66);
  tl.material.color.multiplyScalar(3);
  g.add(tl);
  const hl = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.08, 0.05), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xd8f6ff).multiplyScalar(2) }));
  hl.position.set(0, 0.5, -2.66);
  g.add(hl);
  for (const [x, z] of [[-1.0, -1.7], [1.0, -1.7], [-1.0, 1.6], [1.0, 1.6]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.3, 14).rotateZ(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    w.position.set(x, 0.34, z);
    g.add(w);
  }
  scene.add(g);
  return g;
}
const player = makeCar(0x1a1030, 0x33f0ff, 0xff2a8a);
const headBeam = new THREE.SpotLight(0xd8f0ff, 60, 70, 0.4, 0.6, 1.2);
headBeam.position.set(0, 0.8, -2.5);
headBeam.target.position.set(0, 0, -30);
player.add(headBeam, headBeam.target);
scene.add(new THREE.HemisphereLight(0xff60d0, 0x200030, 0.9));

// Cars > Traffic: same-direction cars in three lanes, recycled ahead
const LANES = [-4.1, 0, 4.1];
const traffic = Array.from({ length: 7 }, (_, i) => {
  const c = makeCar([0x301040, 0x102040, 0x401020][i % 3], [0xff3fd2, 0xffd23f, 0x7dff6a][i % 3]);
  return { mesh: c, lane: i % 3, z: -80 - i * 55, v: 22 + Math.random() * 10, passed: false };
});

// Game > State
const st = { x: 0, vx: 0, speed: 0, target: 38, dist: 0, score: 0, crashT: 0, spin: 0, started: false, auto: false, camMode: 0 };
const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', (e) => (keys[e.code] = false));
const pop = document.getElementById('pop');
let popT = 0;
function popText(t) { pop.textContent = t; pop.style.opacity = 1; popT = 1.1; }
document.getElementById('start').onclick = () => {
  document.getElementById('start').remove();
  st.started = true;
  setTimeout(() => (document.getElementById('title').style.opacity = 0), 2500);
  startMusic();
};
document.getElementById('crt').onclick = (e) => { const on = crt.uniforms.uOn.value < 0.5; crt.uniforms.uOn.value = on ? 1 : 0; e.currentTarget.classList.toggle('on', on); };
document.getElementById('cam').onclick = () => (st.camMode = (st.camMode + 1) % 3);
document.getElementById('auto').onclick = (e) => { st.auto = !st.auto; e.currentTarget.classList.toggle('on', st.auto); };
document.getElementById('music').onclick = (e) => { const on = !musicOn; musicOn = on; if (master) master.gain.value = on ? 0.5 : 0; e.currentTarget.classList.toggle('on', on); if (on) startMusic(); };

// Audio > Synthwave: 96 bpm, Am F C G, bass 8ths, arp 16ths through a delay, pad, kick/snare/hat
let actx, master, delayIn, musicOn = true, nextT = 0, step16 = 0;
const BPM = 96, S16 = 60 / BPM / 4;
const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
let noiseBuf;
function startMusic() {
  if (actx) return;
  actx = new AudioContext();
  master = actx.createGain(); master.gain.value = musicOn ? 0.5 : 0;
  const comp = actx.createDynamicsCompressor();
  master.connect(comp).connect(actx.destination);
  delayIn = actx.createGain(); delayIn.gain.value = 0.35;
  const dl = actx.createDelay(1); dl.delayTime.value = S16 * 3;
  const fb = actx.createGain(); fb.gain.value = 0.38;
  delayIn.connect(dl); dl.connect(fb).connect(dl); dl.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  nextT = actx.currentTime + 0.1;
  setInterval(schedule, 25);
}
function voice(type, f, t, len, vol, cutoff, dest = master, detune = 0) {
  const o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
  o.type = type; o.frequency.value = f; o.detune.value = detune;
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(cutoff, t); lp.frequency.exponentialRampToValueAtTime(Math.max(cutoff * 0.25, 80), t + len);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(lp).connect(g).connect(dest);
  o.start(t); o.stop(t + len + 0.05);
  return g;
}
function noise(t, len, vol, type, f) {
  const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + len);
}
function schedule() {
  while (nextT < actx.currentTime + 0.12) {
    const t = nextT, s = step16 % 16, bar = Math.floor(step16 / 16) % 4, ch = CHORDS[bar];
    if (s % 2 === 0) voice('sawtooth', hz(ch[0] - 24), t, S16 * 1.8, 0.22, 700);
    voice('square', hz(ch[s % 3] + 12 + (s % 8 >= 6 ? 12 : 0)), t, S16 * 0.9, 0.05, 2600, delayIn);
    if (s === 0) for (const n of ch) { voice('sawtooth', hz(n), t, S16 * 16, 0.035, 1400, master, -8); voice('sawtooth', hz(n), t, S16 * 16, 0.035, 1400, master, 8); }
    if (s % 4 === 0) { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g).connect(master); o.start(t); o.stop(t + 0.3); }
    if (s === 4 || s === 12) noise(t, 0.22, 0.35, 'bandpass', 1800);
    if (s % 2 === 1) noise(t, 0.04, 0.08, 'highpass', 7000);
    step16++;
    nextT += S16;
  }
}
function crashSound() {
  if (!actx) return;
  noise(actx.currentTime, 0.6, 0.5, 'lowpass', 900);
}

// Run engine: speed/steer, scroll world, traffic + near misses, camera, HUD
const clock = new THREE.Clock();
const camGoal = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (st.started) {
    let steer = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    if (keys.KeyW || keys.ArrowUp) st.target = Math.min(st.target + 22 * dt, 75);
    if (keys.KeyS || keys.ArrowDown) st.target = Math.max(st.target - 30 * dt, 18);
    if (st.auto) {
      // autopilot: pick the lane whose next car is farthest away
      let best = st.x, room = -1;
      for (const L of LANES) { let near = 999; for (const c of traffic) if (c.z < 0 && Math.abs(LANES[c.lane] - L) < 1) near = Math.min(near, -c.z); if (near > room + 8) { room = near; best = L; } }
      steer = THREE.MathUtils.clamp((best - st.x) * 0.6, -1, 1);
    }
    st.vx += (steer * 14 - st.vx) * (1 - Math.exp(-dt * 6));
    if (st.crashT > 0) { st.crashT -= dt; st.speed += (12 - st.speed) * dt * 3; st.spin *= 0.94; }
    else st.speed += (st.target - st.speed) * (1 - Math.exp(-dt * 0.8));
    st.x = THREE.MathUtils.clamp(st.x + st.vx * dt, -5.2, 5.2);
    st.dist += st.speed * dt;
    st.score += st.speed * dt * 0.1;
  }
  const off = st.dist;
  terrU.uOff.value = off; roadU.uOff.value = off; terrU.uTime.value = t;
  sunMesh.material.uniforms.uTime.value = t;
  // palms
  palms.forEach((p, i) => {
    let z = ((p.z + off) % (SP * PALMS)) ;
    if (z > 20) z -= SP * PALMS;
    _q.setFromAxisAngle(_v.set(0, 1, 0), p.side > 0 ? Math.PI + p.r * 0.1 : p.r * 0.1);
    _m.compose(_v.set(p.side * 10.5, 0, z), _q, _sv.setScalar(p.s));
    trunks.setMatrixAt(i, _m); fronds.setMatrixAt(i, _m);
  });
  trunks.instanceMatrix.needsUpdate = fronds.instanceMatrix.needsUpdate = true;
  // traffic
  for (const c of traffic) {
    c.z += (st.speed - c.v) * dt;
    const cx = LANES[c.lane];
    c.mesh.position.set(cx, 0, c.z);
    if (st.crashT <= 0 && Math.abs(c.z) < 4.6 && Math.abs(cx - st.x) < 1.9) {
      st.crashT = 1.6; st.spin = (Math.random() < 0.5 ? -1 : 1) * 0.9; st.score = Math.max(0, st.score - 300);
      popText('CRASH!'); crashSound(); crt.uniforms.uShake.value = 1;
      c.z -= 12;
    }
    if (!c.passed && c.z > 3) { c.passed = true; if (Math.abs(cx - st.x) < 3.0 && st.crashT <= 0) { st.score += 150; popText('NEAR MISS +150'); } }
    if (c.z > 30) { c.z = -260 - Math.random() * 200; c.lane = Math.floor(Math.random() * 3); c.v = 20 + Math.random() * 14; c.passed = false; }
  }
  // player car
  player.position.set(st.x, 0, 0);
  player.rotation.set(0, -st.vx * 0.02 + st.spin * Math.sin(t * 20), -st.vx * 0.012);
  // camera
  if (st.camMode === 0) camGoal.set(st.x * 0.6, 3.1, 9.5);
  else if (st.camMode === 1) camGoal.set(st.x, 1.25, -0.4);
  else camGoal.set(st.x + 9, 2.2, 3);
  camera.position.lerp(camGoal, st.camMode === 1 ? 1 : 1 - Math.exp(-dt * 5));
  if (st.camMode === 2) camera.lookAt(st.x, 0.8, -4); else camera.lookAt(st.x * 0.6, 1.2, -40);
  player.visible = st.camMode !== 1;
  camera.fov = 62 + Math.max(st.speed - 30, 0) * 0.35;
  camera.updateProjectionMatrix();
  crt.uniforms.uTime.value = t;
  crt.uniforms.uShake.value *= 0.92;
  if (popT > 0) { popT -= dt; if (popT <= 0) pop.style.opacity = 0; }
  document.getElementById('spd').textContent = Math.round(st.speed * 3.6);
  document.getElementById('dist').textContent = (st.dist / 1000).toFixed(1);
  document.getElementById('score').textContent = Math.round(st.score);
  composer.render();
  requestAnimationFrame(loop);
}
camera.position.set(0, 3.1, 9.5);
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  crt.uniforms.uRes.value.set(innerWidth, innerHeight);
});
</script>
</body>
</html>
