function buildPens(list) {

    rail(g, -w, -d, -GATE_W / 2, -d, colMat); rail(g, GATE_W / 2, -d, w, -d, colMat);

    const bot = world.players.size >= 14 ? [...world.players.values()].filter((q) => q.bot).sort((a, b) => a.score - b.score)[0] : null;
    const np = addPlayer(p.id, p.nick, p.color, false);

    let dh = p.face - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 14);
    const u = g.userData, sp = Math.min(Math.hypot(p.vx, p.vz) / SPEED, 1), ph = time * 16 + p.id;
    u.body.position.y = Math.abs(Math.sin(ph)) * sp * 0.12;
    u.legs.forEach((l, i) => (l.rotation.x = Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * sp * 0.8));
    u.tail.rotation.y = Math.sin(time * 18 + p.id) * 0.6;
    u.head.rotation.x = p.barkT > 0 ? -0.4 : 0;
  }
  world.sheep.forEach((s, i) => {
    let g = sheep3d[i];
    if (!g) { g = sheep3d[i] = makeSheep(); g.position.set(s.x, 0, s.z); }
    const u = g.userData;
    g.visible = !s.dead;
    if (s.gold !== u.gold) { u.gold = s.gold; for (const m of u.wool) m.material = s.gold ? goldMat : woolMat; }
    if (s.dead) return;
    const a = hostSim ? 1 : 1 - Math.exp(-dt * 12);
    if (Math.hypot(s.x - g.position.x, s.z - g.position.z) > 6) g.position.set(s.x, 0, s.z);
    const dx = (s.x - g.position.x) * a, dz = (s.z - g.position.z) * a;
    g.position.x += dx; g.position.z += dz;
    const sp = Math.hypot(dx, dz) / Math.max(dt, 1e-3);
    if (sp > 0.3) { u.h = Math.atan2(dx, dz); }
    let dh = u.h - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 8);
    const k = Math.min(sp / S_MAX, 1), ph = time * 14 + i;
    u.body.position.y = Math.abs(Math.sin(ph)) * k * 0.2;
    u.legs.forEach((l, j) => (l.rotation.x = Math.sin(ph + (j % 2 ? Math.PI : 0)) * k * 0.7));
  });
  for (let i = world.sheep.length; i < sheep3d.length; i++) sheep3d[i].visible = false;
  for (const r of rings) {
    if (r.userData.t >= 1) continue;
    r.userData.t += dt / 0.5;
    r.scale.setScalar(1 + r.userData.t * (BARK_R - 1));
    r.material.opacity = 0.8 * (1 - r.userData.t);
  }
  for (let i = 0; i < PUFF; i++) {
    if (puffLife[i] <= 0) continue;
    puffLife[i] -= dt; puffVel[i * 3 + 1] -= 9 * dt;
    for (let k = 0; k < 3; k++) puffPos[i * 3 + k] += puffVel[i * 3 + k] * dt;
    if (puffLife[i] <= 0) puffPos[i * 3 + 1] = -99;
  }
  puffGeo.attributes.position.needsUpdate = true;
  hud(dt);
  // camera: whole meadow in view, nudged toward own dog
  const me = world.players.get(lobby.room?.me), mg = me && players3d.get(me.id);
  const fx = mg ? mg.position.x * 0.4 : 0, fz = mg ? mg.position.z * 0.4 : 0;
  const fit = Math.max(1, 1.25 / camera.aspect);
  camPos.lerp(_v.set(fx, 35 * fit, fz + 24 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 2), 1 - Math.exp(-dt * 3));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
