// Pens > one colored pen per dog around the edge, gaps in the ring fence at each gate, sign with owner + count
const woodMat = new THREE.MeshStandardMaterial({ color: 0xc89a62, roughness: 0.9 });

let pens = [], penKey = '';

  for (const y of [0.45, 0.95]) { const r = new THREE.Mesh(railGeo, mat); r.scale.x = l; r.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); r.rotation.y = -Math.atan2(z1 - z0, x1 - x0); r.castShadow = true; group.add(r); }

}

function buildPens(list) {

    g.rotation.y = a;
    const colMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(PEN_W, PEN_D).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.45, roughness: 1 }));
    floor.position.y = 0.02; floor.receiveShadow = true;
    g.add(floor);
    const w = PEN_W / 2, d = PEN_D / 2;

    rail(g, -w, -d, -GATE_W / 2, -d, colMat); rail(g, GATE_W / 2, -d, w, -d, colMat);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 3.6, 6), woodMat); pole.position.set(w, 1.8, d);
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.75), new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide })); flag.position.set(w - 0.62, 3.2, d);

  });

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepDog(p, dt); sim.events = keep; },
  live: () => true,
  seed: (p) => { p.lastBark = p.barkSeq = 0; },
  angle: 'face',
});
function applySnap(s) {
  serverMatch.onSnapshot(s);
  names.read(s);
  Object.assign(world, { phase: s.ph, t: s.t, left: s.lf, winner: s.win });
  const seen = new Set();
  for (const [id, x, z, vx, vz, face, fl, score, pen] of s.P) {
    seen.add(id);
    if (!world.players.has(id) && !names.name(id)) continue;
    const p = world.players.get(id) ?? sim.addPlayer(id, ...names.name(id), !!(fl & 1));
    Object.assign(p, { x, z, vx, vz, face, barkT: fl & 2 ? 0.1 : 0, score, pen });
    if (id === lobby.room.me) pred.correct(p);
  }
  for (const id of [...world.players.keys()]) if (!seen.has(id)) sim.removePlayer(id);
  const n = s.S.length / 3;
  while (world.sheep.length < n) world.sheep.push({ x: 0, z: 0, vx: 0, vz: 0, dead: 0, gold: false });
  world.sheep.length = n;
  for (let i = 0; i < n; i++) Object.assign(world.sheep[i], { x: s.S[i * 3], z: s.S[i * 3 + 1], gold: !!(s.S[i * 3 + 2] & 1), dead: s.S[i * 3 + 2] & 2 ? 1 : 0 });
  playEvents(s.ev ?? []);
  snapAt = pacing.arrived();
}
function playEvents(evs) {
  const me = lobby.room?.me, match = world.mode === 'match';
  for (const e of evs) {
    const p = world.players.get(e[1]);
    if (e[0] === 'b' && p) { barkRing(p.x, p.z, p.color); if (match) sfx.woof(e[1] === me); }
    else if (e[0] === 'p') { burst(e[2], 0.8, e[3], e[4] ? 26 : 14, 3); if (match) sfx.pen(e[1] === me, e[4]); if (e[1] === me && match) flash(e[4] ? '<small>golden fleece!</small>✨ +3' : '<small>penned</small>🐑 +1', 0.9); }
    else if (e[0] === 'c' && match) sfx.beep(e[1] === 0);
    else if (e[0] === 'w' && p) { if (match) sfx.win(); flash(`<small>${e[1] === me ? 'top dog!' : 'top dog'}</small>🏆 ${esc(p.nick)}`, 4); }
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Input > keyboard + phone joystick + BARK button
const keys = trackKeys(), local = { x: 0, z: 0, barkSeq: 0 };
addEventListener('keydown', (e) => {
  if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) local.barkSeq++;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
const pad = createTouchPad({ buttons: [{ id: 'bark', label: 'BARK', color: 'rgba(184, 242, 106, 0.7)' }], onStart: gameAudio.unlock });
pad.onPress('bark', () => local.barkSeq++);
function readInput() {
  local.x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + pad.x;
  local.z = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) - pad.y;
}

// HUD > match clock, own count, standings, banner
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t, len = 1.8) { big(t); flashT = len; }
let hudT = 0;
const mmss = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;
function hud(dt) {
  flashT -= dt;
  if (world.mode !== 'match') { if (flashT <= 0) big(''); return; }
  const me = world.players.get(lobby.room?.me);
  if (world.phase === 'count') big(`<small>herd sheep into your pen</small>${Math.max(1, Math.ceil(world.t))}`);
  else if (world.phase === 'final') { const top = world.players.get(world.winner); big(`<small>final · back to lobby in ${Math.max(0, Math.ceil(world.t))}s</small>${top ? `🏆 ${esc(top.nick)}` : 'Draw!'}`); }
  else if (flashT <= 0) big('');
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  document.getElementById('clock').innerHTML = `${mmss(world.left)}<small> left</small>`;
  document.getElementById('mine').textContent = `${me ? `you: ${me.score} sheep · ` : ''}first to ${WIN_N} · ✨ = 3`;
  const r = [...world.players.values()].sort((a, b) => b.score - a.score);
  document.getElementById('board').innerHTML = r.map((p, i) => `<div class="row ${p.id === lobby.room?.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:${p.color}"></i><span>${esc(p.nick)}</span><em>🐑${p.score}</em></div>`).join('');
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my dog and streams input to the server
let acc = 0;
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    for (acc += dt; acc >= STEP; acc -= STEP) sim.step();
    playEvents(sim.events); sim.events = [];
    return;
  }
  const room = lobby.room;
  if (!room) return;
  pred.tick(world.players.get(room.me), { mx: local.x, mz: local.z }, dt, STEP);
  if (world.phase === 'play') world.left -= dt;
  serverMatch.tickInput(() => ({ x: +local.x.toFixed(2), z: +local.z.toFixed(2), b: local.barkSeq }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 46, 30), camLook = new THREE.Vector3(), _v = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  // pens: rebuild when the seat list changes (guests learn it from snapshots)
  const plist = [...world.players.values()].sort((a, b) => a.pen - b.pen);
  const key = plist.map((p) => `${p.id}:${p.pen}`).join(',');
  if (key !== penKey) { penKey = key; buildPens(plist); }
  for (const pen of pens) {
    const owner = world.players.get(pen.id);
    if (owner && owner.score !== pen.shown) {
      pen.shown = owner.score;
      const c = penSign(owner.nick, owner.color, owner.score);
      pen.canvas.getContext('2d').clearRect(0, 0, 256, 96); pen.canvas.getContext('2d').drawImage(c, 0, 0); pen.tex.needsUpdate = true;
    }
    pen.flag.rotation.y = Math.sin(time * 3 + pen.a * 5) * 0.3;
  }
  for (const [id, g] of players3d) if (!world.players.has(id)) { scene.remove(g); players3d.delete(id); }
  for (const p of world.players.values()) {
    let g = players3d.get(p.id);
    if (!g) { g = makeDog(p); players3d.set(p.id, g); g.position.set(p.x, 0, p.z); }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + v.vx * va, tz = v.z + v.vz * va, a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(16));
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 8) g.position.set(tx, 0, tz);
    g.position.x += (tx - g.position.x) * a; g.position.z += (tz - g.position.z) * a;
    let dh = v.face - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 14);
    const u = g.userData, sp = Math.min(Math.hypot(p.vx, p.vz) / SPEED, 1), ph = time * 16 + p.id;
    u.body.position.y = Math.abs(Math.sin(ph)) * sp * 0.12;
    u.legs.forEach((l, i) => (l.rotation.x = Math.sin(ph + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI / 2 : 0)) * sp * 0.8));
    u.tail.rotation.y = Math.sin(time * 18 + p.id) * 0.6;
    u.head.rotation.x = p.barkT > 0 ? -0.4 : 0;
  }
  world.sheep.forEach((s, i) => {
    let g = sheep3d[i];
    if (!g) { g = sheep3d[i] = makeSheep(); g.position.set(s.x, 0, s.z); }
    const u = g.userData;
    g.visible = !s.dead;
    if (s.gold !== u.gold) { u.gold = s.gold; for (const m of u.wool) m.material = s.gold ? goldMat : woolMat; }
    if (s.dead) return;
    const a = hostSim ? 1 : 1 - Math.exp(-dt * pacing.rate(12));
    if (Math.hypot(s.x - g.position.x, s.z - g.position.z) > 6) g.position.set(s.x, 0, s.z);
    const dx = (s.x - g.position.x) * a, dz = (s.z - g.position.z) * a;
    g.position.x += dx; g.position.z += dz;
    const sp = Math.hypot(dx, dz) / Math.max(dt, 1e-3);
    if (sp > 0.3) { u.h = Math.atan2(dx, dz); }
    let dh = u.h - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 8);
    const k = Math.min(sp / S_MAX, 1), ph = time * 14 + i;
    u.body.position.y = Math.abs(Math.sin(ph)) * k * 0.2;
    u.legs.forEach((l, j) => (l.rotation.x = Math.sin(ph + (j % 2 ? Math.PI : 0)) * k * 0.7));
  });
  for (let i = world.sheep.length; i < sheep3d.length; i++) sheep3d[i].visible = false;
  for (const r of rings) {
    if (r.userData.t >= 1) continue;
    r.userData.t += dt / 0.5;
    r.scale.setScalar(1 + r.userData.t * (BARK_R - 1));
    r.material.opacity = 0.8 * (1 - r.userData.t);
  }
  for (let i = 0; i < PUFF; i++) {
    if (puffLife[i] <= 0) continue;
    puffLife[i] -= dt; puffVel[i * 3 + 1] -= 9 * dt;
    for (let k = 0; k < 3; k++) puffPos[i * 3 + k] += puffVel[i * 3 + k] * dt;
    if (puffLife[i] <= 0) puffPos[i * 3 + 1] = -99;
  }
  puffGeo.attributes.position.needsUpdate = true;
  hud(dt);
  // camera: whole meadow in view, nudged toward own dog
  const me = world.players.get(lobby.room?.me), mg = me && players3d.get(me.id);
  const fx = mg ? mg.position.x * 0.4 : 0, fz = mg ? mg.position.z * 0.4 : 0;
  const fit = Math.max(1, 1.25 / camera.aspect);
  camPos.lerp(_v.set(fx, 35 * fit, fz + 24 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 2), 1 - Math.exp(-dt * 3));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
sim.startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
