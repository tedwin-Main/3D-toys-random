<title>Chair Scramble</title>
<style>

  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  #dash { bottom: 18px; right: 18px; width: 86px; height: 86px; border-radius: 50%; display: none; place-items: center; font-weight: 900; font-size: 15px; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.35); display: none; }
  #stick div { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); }
  @media (pointer: coarse) { #stick { display: block; } #hint { display: none; } }

// Chairs > wooden chair with colored cushion, pops up from the floor
const woodMat = new THREE.MeshStandardMaterial({ color: 0xc58b52, roughness: 0.6 });

function makeChair(i) {

  const cushion = new THREE.Mesh(new RoundedBoxGeometry(1.05, 0.14, 1.05, 2, 0.06), new THREE.MeshStandardMaterial({ color: CUSHIONS[i % CUSHIONS.length], roughness: 0.6, emissive: CUSHIONS[i % CUSHIONS.length], emissiveIntensity: 0.25 })); cushion.position.y = 0.88;

const chairs3d = [];

// Players > jelly bean dancer in player color, googly eyes, name tag; ghosts when out

  const g = c.getContext('2d');

const beanGeo = new THREE.CapsuleGeometry(0.5, 0.7, 6, 16), eyeW = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }), eyeB = new THREE.MeshBasicMaterial({ color: 0x111111 });
const players3d = new Map();
function makeBean(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.35, transparent: true });
  const bean = new THREE.Mesh(beanGeo, mat); bean.position.y = 0.95; bean.castShadow = true;
  body.add(bean);
  for (const x of [-0.18, 0.18]) {
    const w = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), eyeW); w.position.set(x, 1.35, 0.42);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), eyeB); b.position.set(x, 1.35, 0.55);

// FX > confetti for eliminations + winner
const CONF = 700, confGeo = new THREE.BufferGeometry();
const cPos = new Float32Array(CONF * 3), cCol = new Float32Array(CONF * 3), cVel = new Float32Array(CONF * 3), cLife = new Float32Array(CONF);
for (let i = 0; i < CONF; i++) cPos[i * 3 + 1] = -99;
confGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
confGeo.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
const confetti = new THREE.Points(confGeo, new THREE.PointsMaterial({ size: 0.25, vertexColors: true }));
confetti.frustumCulled = false;
scene.add(confetti);
let cNext = 0;
function burst(x, y, z, n, hexes, speed = 8) {
  const cols = hexes.map((h) => new THREE.Color(h));
  for (let k = 0; k < n; k++) {
    const i = cNext++ % CONF, a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
    cPos.set([x, y, z], i * 3); cVel.set([Math.cos(a) * s, 4 + Math.random() * speed, Math.sin(a) * s], i * 3);
    const c = cols[k % cols.length]; cCol.set([c.r, c.g, c.b], i * 3); cLife[i] = 1.6 + Math.random();
  }
}

// Audio > procedural disco loop (128 BPM), record scratch on stop, sit pop, shove, out buzzer
let actx = null, master = null, noiseBuf;
function audio() {
  if (actx) return;
  actx = new AudioContext();
  master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
addEventListener('pointerdown', audio, { once: true });
addEventListener('keydown', audio, { once: true });
function tone(f0, f1, len, vol, type = 'sine', when = 0) {
  if (!actx) return;
  const t = when || actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);

function noise(len, vol, f0, f1, type = 'lowpass', when = 0) {

  const t = when || actx.currentTime, s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + len);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);

}
const BPM = 128, EIGHTH = 60 / BPM / 2;
const PROG = [[48, 55, 60, 64, 67], [45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62]];
const mtof = (m) => 440 * 2 ** ((m - 69) / 12);

function musicStart(seed) { if (!actx) return; music.on = true; music.next = actx.currentTime + 0.05; music.step = 0; music.seed = seed; }
function musicStop() {

  if (music.on && actx) { noise(0.35, 0.25, 3000, 200, 'bandpass'); tone(600, 80, 0.35, 0.08, 'sawtooth'); }
  music.on = false;
}
function musicPump() {
  if (!music.on || !actx) return;
  while (music.next < actx.currentTime + 0.2) {
    const s = music.step, t = music.next, chord = PROG[Math.floor(s / 16) % 4], v = music.vol;
    if (s % 2 === 0) { tone(mtof(chord[0] - 12), mtof(chord[0] - 12) * 0.98, EIGHTH * 1.6, 0.16 * v, 'triangle', t); }
    if (s % 4 === 0) { tone(150, 45, 0.18, 0.35 * v, 'sine', t); }
    if (s % 4 === 2) noise(0.06, 0.08 * v, 9000, 6000, 'highpass', t);
    if (s % 8 === 4) noise(0.14, 0.12 * v, 2500, 900, 'bandpass', t);

    if (r > 0.3) tone(mtof(chord[1 + Math.floor(r * 4)] + 12), mtof(chord[1 + Math.floor(r * 4)] + 12), EIGHTH * 0.9, 0.05 * v, 'square', t);

const sfx = {
  sit() { tone(520, 1040, 0.12, 0.12, 'triangle'); },
  shove() { noise(0.12, 0.12, 1200, 300); },
  bump() { tone(180, 90, 0.08, 0.08, 'square'); },
  out() { tone(220, 110, 0.6, 0.12, 'sawtooth'); tone(233, 116, 0.6, 0.1, 'sawtooth'); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.3, 0.1, 'triangle', actx ? actx.currentTime + i * 0.12 : 0)); },

// Game > World: rules live in chairs-sim.js; attract runs it here, a match mirrors the relay server's snapshots
const sim = createChairsSim();
const world = sim.world;
const rng = Math.random, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const alive = () => [...world.players.values()].filter((p) => !p.out);

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'chair-scramble', title: 'Chair Scramble', emoji: '🪑', accent: '#ff3ea5',
  blurb: 'Musical chairs on a disco floor. Dance while the music plays; when it stops, chairs pop up anywhere. Grab one, shove anyone in your way. One fewer chair every round.',
  maxBots: 13, defaultBots: 5, minPlayers: 2,
  note: 'Up to 14 dancers per room (humans + bots). Late joiners watch as ghosts until the next match.',
  onJoin(room) {

    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the match; every page (lobby host too) plays as a guest
  onStart({ bots }) {
    sim.clearPlayers();

    ['status', 'board'].forEach((id) => (document.getElementById(id).style.display = 'block'));
    document.getElementById('top').style.display = 'flex';
    document.getElementById('dash').style.display = 'grid';

    serverMatch.start({ bots });

  onLobby() {

const serverMatch = createServerMatchClient(lobby);

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {

  if (d.g === 'done') serverMatch.finish();

// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();

const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepPlayer(p, dt); sim.events = keep; },
  live: (p) => p.seat < 0,
  seed: () => {},
  angle: 'face',

function applySnap(s) {
  serverMatch.onSnapshot(s);

  Object.assign(world, { phase: s.ph, t: s.t, round: s.rd, winner: s.wn });
  // chairs ride only when they change
  if (s.C) world.chairs = s.C.map(([x, z, h, by]) => ({ x, z, h, by: by || null }));
  const seen = new Set();
  for (const [id, x, z, vx, vz, face, seat, fl, dashCd, place] of s.P) {
    seen.add(id);

let shake = 0, beatStart = 0;
function playEvents(evs) {

    if (e[0] === 'm') { music.vol = match ? 1 : 0.35; musicStart(e[1] * 7.31); beatStart = performance.now(); if (match) flash(`<small>round ${e[1]}</small>💃 DANCE`, 1.2); }
    else if (e[0] === 'x') { musicStop(); shake = 0.25; if (match) flash('<small>the music stopped!</small>SIT!', 1.1); }
    else if (e[0] === 's') { if (match) sfx.sit(); const c = world.chairs[e[2]]; if (c) burst(c.x, 1, c.z, 12, ['#ffffff', world.players.get(e[1])?.color ?? '#fff'], 3); }
    else if (e[0] === 'd') { if (match) sfx.shove(); }
    else if (e[0] === 'b') { if (match) sfx.bump(); }
    else if (e[0] === 'o') {
      const p = world.players.get(e[1]);

      if (match) { sfx.out(); flash(`<small>${e[1] === me ? 'no chair for you' : 'eliminated'}</small>${e[1] === me ? '😵 OUT' : `${esc(p?.nick ?? '')} is out`}`, 2.2); }

      const p = world.players.get(e[1]);

stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
stick.addEventListener('pointerup', () => { stickId = null; sx = sz = 0; knob.style.transform = ''; });
function moveStick(e) {
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dz = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  const l = Math.hypot(dx, dz); if (l > 1) { dx /= l; dz /= l; }
  sx = dx; sz = dz; knob.style.transform = `translate(${dx * 40}px, ${dz * 40}px)`;
}
const local = { mx: 0, mz: 0 };
function readInput() {
  local.mx = clamp((keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + sx, -1, 1);
  local.mz = clamp((keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + sz, -1, 1);
}

// HUD > status line, alive board, shove cooldown, banner
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0, hudT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t, len = 1.6) { big(t); flashT = len; }
function hud(dt) {
  flashT -= dt;
  if (world.mode !== 'match') { if (flashT <= 0) big(''); return; }
  const meId = lobby.room?.me, me = world.players.get(meId);
  if (world.phase === 'count') big(`<small>get ready</small>${Math.max(1, Math.ceil(world.t))}`);
  else if (world.phase === 'final') {
    const w = world.players.get(world.winner);
    big(`<small>back to lobby in ${Math.max(0, Math.ceil(world.t))}s</small>${w ? `👑 <span style="color:${w.color}">${esc(w.nick)}</span>` : 'No winner'}`);
  } else if (flashT <= 0) big('');
  const cd = me?.dashCd ?? 0;
  dashEl.style.background = cd > 0 ? `conic-gradient(#ff3ea5 ${(1 - cd / DASH_CD) * 360}deg, rgba(20,10,34,0.66) 0)` : '#ff3ea5';
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.15;
  const al = alive().length, free = world.chairs.filter((c) => !c.by).length;
  const st = world.phase === 'music' ? `🎵 Round ${world.round} · ${al} dancers · ${Math.max(1, al - 1)} chair${al - 1 === 1 ? '' : 's'} coming` : world.phase === 'scramble' ? `🪑 ${free} free chair${free === 1 ? '' : 's'} · ${Math.max(0, Math.ceil(world.t))}s` : world.phase === 'out' ? `Round ${world.round} done` : world.phase === 'final' ? 'Match over' : 'Starting';
  document.getElementById('status').textContent = me?.out && world.phase !== 'final' ? `👻 spectating · ${st}` : st;
  const ps = [...world.players.values()].sort((a, b) => (a.out - b.out) || (a.out ? a.place - b.place : 0));
  document.getElementById('board').innerHTML = ps.map((p) => `<div class="row ${p.id === meId ? 'me' : ''} ${p.out ? 'out' : ''}"><i style="background:${p.color}"></i><span>${esc(p.nick)}</span>${p.seat >= 0 ? '🪑' : p.id === world.winner ? '👑' : p.out && p.place ? `#${p.place}` : ''}</div>`).join('');
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my dancer and streams input to the server
let acc = 0;
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    for (acc += dt; acc >= STEP; acc -= STEP) sim.step();
    playEvents(sim.events); sim.events = [];
    return;
  }
  const room = lobby.room;
  if (!room) return;
  pred.tick(world.players.get(room.me), { mx: local.mx, mz: local.mz, dash: 0 }, dt, STEP);
  serverMatch.tickInput(() => ({ mx: +local.mx.toFixed(2), mz: +local.mz.toFixed(2), dq: dashSeq }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 30, 30), camLook = new THREE.Vector3(), _v = new THREE.Vector3(), _c = new THREE.Color(), _m4 = new THREE.Matrix4();
const TILE_COLS = [0xff3ea5, 0x3ec8ff, 0xffd23f, 0x2ee59d, 0xa970ff].map((h) => new THREE.Color(h));
let lastBeat = -1;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim(), age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  const meId = lobby.room?.me, dancing = world.phase === 'music';
  musicPump();
  const beatF = ((performance.now() - beatStart) / 1000) * (BPM / 60), beat = Math.floor(beatF), pulse = dancing ? Math.exp(-(beatF % 1) * 5) : 0;
  // floor: beat-synced color flips while dancing, red alarm in the scramble
  if (dancing && beat !== lastBeat) {
    lastBeat = beat;
    for (let i = 0; i < tilePos.length; i++) tiles.setColorAt(i, rng() < 0.45 ? TILE_COLS[(i * 7 + beat) % TILE_COLS.length] : _c.set(0x2a1d40));
    tiles.instanceColor.needsUpdate = true;
  } else if (!dancing && lastBeat !== -1) {
    lastBeat = -1;
    for (let i = 0; i < tilePos.length; i++) tiles.setColorAt(i, _c.set(world.phase === 'scramble' ? 0x5a1830 : 0x332244));
    tiles.instanceColor.needsUpdate = true;
  }
  tiles.material.emissiveIntensity = dancing ? 0.03 + pulse * 0.1 : 0.02;
  discoBall.rotation.y += dt * (dancing ? 1.2 : 0.2);
  spots.forEach((s, i) => { const a = time * (0.5 + i * 0.17) + i * 2.1; s.target.position.set(Math.cos(a) * 8, 0, Math.sin(a * 1.3) * 8); s.intensity = dancing ? 260 : 90; });
  speakers.forEach((g) => g.userData.cones.forEach((c) => c.scale.setScalar(1 + pulse * 0.12)));
  edgeGlow.material.color.set(world.phase === 'scramble' ? 0xff4040 : 0xff3ea5);
  // chairs: spring up from under the floor
  while (chairs3d.length < world.chairs.length) chairs3d.push(makeChair(chairs3d.length));
  chairs3d.forEach((c, i) => {
    const data = world.chairs[i];
    const up = !!data;
    if (up && !c.g.visible) { c.g.visible = true; c.y = -1.8; c.vy = 0; }
    if (!up) { c.g.visible = false; return; }
    c.vy += ((0 - c.y) * 220 - c.vy * 14) * dt; c.y += c.vy * dt;
    c.g.position.set(data.x, c.y, data.z); c.g.rotation.y = data.h;
  });
  for (const p of world.players.values()) {
    let g = players3d.get(p.id);
    if (!g) { g = makeBean(p); players3d.set(p.id, g); g.position.set(p.x, 0, p.z); }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + (p.seat < 0 ? v.vx * va : 0), tz = v.z + (p.seat < 0 ? v.vz * va : 0), a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(16));
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 5) g.position.set(tx, 0, tz);
    g.position.x += (tx - g.position.x) * a; g.position.z += (tz - g.position.z) * a;
    const seatC = p.seat >= 0 ? world.chairs[p.seat] : null;
    const targetY = p.out ? 1.2 + Math.sin(time * 2 + p.id) * 0.2 : seatC ? 0.55 : 0;
    g.position.y += (targetY - g.position.y) * Math.min(1, dt * 10);
    const face = seatC ? seatC.h : v.face;
    let dh = face - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 14);
    const u = g.userData;
    const bounce = dancing && !p.out ? pulse : 0;
    u.body.scale.set(1 + bounce * 0.12, 1 - bounce * 0.15 + (p.dashT > 0 ? -0.1 : 0), 1 + bounce * 0.12);
    u.body.rotation.z = dancing && !p.out ? Math.sin(beatF * Math.PI + p.id) * 0.18 : 0;
    u.body.rotation.x = p.dashT > 0 ? 0.35 : 0;
    u.mat.opacity = p.out ? 0.35 : 1;
    u.tag.visible = p.id !== meId;
  }
  for (let i = 0; i < CONF; i++) {
    if (cLife[i] <= 0) continue;
    cLife[i] -= dt; cVel[i * 3 + 1] -= 14 * dt;
    for (let k = 0; k < 3; k++) cPos[i * 3 + k] += cVel[i * 3 + k] * dt;
    if (cPos[i * 3 + 1] < 0.05) { cPos[i * 3 + 1] = 0.05; cVel[i * 3] *= 0.7; cVel[i * 3 + 2] *= 0.7; cVel[i * 3 + 1] = 0; }
    if (cLife[i] <= 0) cPos[i * 3 + 1] = -99;
  }
  confGeo.attributes.position.needsUpdate = true; confGeo.attributes.color.needsUpdate = true;
  hud(dt);
  // camera: whole floor fits; drifts a little toward own bean
  const me = world.players.get(meId), mg = me && players3d.get(me.id);
  const fit = Math.max(1, 1.25 / Math.max(camera.aspect, 0.5));
  const fx = mg && world.mode === 'match' ? mg.position.x * 0.35 : Math.sin(time * 0.1) * 3, fz = mg && world.mode === 'match' ? mg.position.z * 0.35 : 0;
  camPos.lerp(_v.set(fx, 24 * fit, fz + 19 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 0.5), 1 - Math.exp(-dt * 4));
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
sim.startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
