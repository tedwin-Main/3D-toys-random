<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Vault Breakers</title>
<style>
  #log { left: 14px; bottom: 14px; padding: 8px 10px; display: none; font-size: 12.5px; max-height: 46vh; overflow: auto; min-width: 230px; }
  #log .row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #log .row .who { width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gem { display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset -2px -3px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.35); vertical-align: middle; }
  .fb { display: inline-grid; grid-template-columns: repeat(2, 7px); gap: 2px; margin-left: 4px; }
  .fb i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.15); }
  .fb i.x { background: #ffd23f; } .fb i.n { background: #f2f4fa; }
  #dock .slots { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
  #dock .slots button { width: 48px; height: 48px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.35); background: transparent; cursor: pointer; padding: 0; }
  #dock .slots button.f { border: 0; }
  #dock .pal button { width: 44px; height: 44px; border-radius: 50%; padding: 0; box-shadow: inset -3px -4px 0 rgba(0,0,0,0.25), inset 3px 3px 0 rgba(255,255,255,0.35), 0 3px 0 rgba(0,0,0,0.3); }
  @media (max-width: 700px) { #log { bottom: auto; top: 70px; max-height: 30vh; min-width: 0; width: 200px; font-size: 11px; } }
</style>
</head>
<body>
<div id="log" class="card" data-hud></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createTableGame } from '../common/table-game.js';
import { hudShell, createStage, createPawns, ringSpots, esc, badgeTex, badge, pickOne } from '../common/table-stage.js';
import { createGameAudio } from '../common/game-audio.js';

const hud = hudShell({ accent: '#ffd23f', bg: '#11141c', hint: 'A hidden 4-gem code locks the vault. Take turns guessing; every guess and its feedback is shown to everyone. <b>Gold</b> peg = right gem, right spot. <b>White</b> = right gem, wrong spot. Crack it on your turn to score.' });

// Rules > six gems, code of four, repeats allowed
const GEMS = [['Ruby', '#ff4f6d'], ['Topaz', '#ffb02e'], ['Emerald', '#3ddc84'], ['Sapphire', '#3f8cff'], ['Amethyst', '#b06cff'], ['Pearl', '#f2efe6']];
const LEN = 4, ALL = [];
for (let i = 0; i < 6 ** LEN; i++) ALL.push([0, 1, 2, 3].map((k) => Math.floor(i / 6 ** k) % 6));
function score(code, guess) {
  let x = 0; const cc = [0, 0, 0, 0, 0, 0], gc = [0, 0, 0, 0, 0, 0];
  for (let i = 0; i < LEN; i++) { if (code[i] === guess[i]) x++; else { cc[code[i]]++; gc[guess[i]]++; } }
  let n = 0; for (let k = 0; k < 6; k++) n += Math.min(cc[k], gc[k]);
  return [x, n];
}
const consistent = (hist) => ALL.filter((c) => hist.every((h) => { const [x, n] = score(c, h.g); return x === h.x && n === h.n; }));

// Scene > vault wall with a round door, gem pegboard on the floor
const { renderer, scene, camera, hemi } = createStage({ bg: 0x11141c, fog: [20, 60] });
hemi.intensity = 1.3;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x23262e, roughness: 0.85 }));
floor.receiveShadow = true;
scene.add(floor);
const wall = new THREE.Mesh(new THREE.BoxGeometry(24, 12, 1), new THREE.MeshStandardMaterial({ color: 0x59606e, roughness: 0.7 }));
wall.position.set(0, 6, -6);
scene.add(wall);
const gold = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.3, 40).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0x6a4a00, metalness: 0.9, roughness: 0.25 }));
gold.position.set(0, 4.2, -5.6);
scene.add(gold);
const hinge = new THREE.Group();
hinge.position.set(-3, 4.2, -5.2);
scene.add(hinge);
const door = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.6, 48).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xb8c0cf, metalness: 0.35, roughness: 0.35 }));
door.position.x = 3; door.castShadow = true;
hinge.add(door);
const dials = [];
for (let i = 0; i < LEN; i++) {
  const d = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.25, 24).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2a2e38, metalness: 0.6, roughness: 0.35 }));
  d.position.set(3 + (i - 1.5) * 1.15, 0, 0.42);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), new THREE.MeshStandardMaterial({ color: 0x555b66, metalness: 0.4, roughness: 0.3, emissive: 0x000000 }));
  knob.position.set(3 + (i - 1.5) * 1.15, 0, 0.6);
  hinge.add(d, knob);
  dials.push(knob);
}
const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.1, 10, 30), new THREE.MeshStandardMaterial({ color: 0x6b7280, metalness: 0.8 }));
wheel.position.set(3, -1.6, 0.4);
hinge.add(wheel);
// peg board: one row per recent guess
const board = new THREE.Group();
board.position.set(0, 0.02, -1.6);
board.scale.setScalar(1.35);
scene.add(board);
const gemMats = GEMS.map(([, c]) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.2, metalness: 0.1, emissive: c, emissiveIntensity: 0.15 }));
const gemGeo = new THREE.OctahedronGeometry(0.22, 0), fbGeo = new THREE.SphereGeometry(0.08, 10, 8);
const fbMat = { x: new THREE.MeshStandardMaterial({ color: 0xffd23f, emissive: 0x6a4a00 }), n: new THREE.MeshStandardMaterial({ color: 0xf2f4fa }), o: new THREE.MeshStandardMaterial({ color: 0x3a3f4a }) };
let boardKey = '';
function buildBoard(S) {
  const rows = S.hist.slice(-8), key = S.rd + ':' + S.hist.length;
  if (key === boardKey) return;
  boardKey = key;
  board.clear();
  rows.forEach((h, r) => {
    const z = (r - rows.length + 1) * 0.62, p = S.P.find((q) => q.id === h.id);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: p?.color ?? '#888', roughness: 0.6 }));
    plate.position.set(0, 0.04, z); plate.receiveShadow = true;
    board.add(plate);
    h.g.forEach((g, i) => { const m = new THREE.Mesh(gemGeo, gemMats[g]); m.position.set(-1.6 + i * 0.75, 0.3, z); m.castShadow = true; board.add(m); });
    for (let k = 0; k < 4; k++) { const m = new THREE.Mesh(fbGeo, k < h.x ? fbMat.x : k < h.x + h.n ? fbMat.n : fbMat.o); m.position.set(1.55 + (k % 2) * 0.22, 0.15, z - 0.1 + Math.floor(k / 2) * 0.22); board.add(m); }
  });
}
const pawns = createPawns(scene);
const turnTex = badgeTex('dot', '#ffd23f'), starTex = badgeTex('star', '#ffd23f');

// Audio > dial clicks, feedback pings, vault opening
const { tone, noise } = createGameAudio();
const sfx = {
  click() { noise(0.03, 0.06, 3000, 1500, 'bandpass'); },
  fb(x, n) { for (let i = 0; i < x; i++) tone(988, 988, 0.12, 0.06, 'triangle', i * 0.1); for (let i = 0; i < n; i++) tone(660, 660, 0.1, 0.04, 'sine', (x + i) * 0.1); if (!x && !n) tone(220, 180, 0.2, 0.05, 'sine'); },
  open() { noise(1.2, 0.08, 300, 80); [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.3, 0.07, 'triangle', 0.4 + i * 0.12)); },
  turn(me) { if (me) tone(880, 1320, 0.15, 0.08, 'triangle'); },
  tick() { tone(1500, 1500, 0.02, 0.03, 'square'); },
};

// Game > phases: intro, turn (one player guesses), show (feedback), cracked, final
const T = { intro: 3, show: 2.2, cracked: 5.5, final: 12 };
const BOT_NAMES = ['Tumbler', 'Keyhole', 'Combo', 'Latch', 'Bolt', 'Cipher', 'Picklock', 'Hinge', 'Ledger', 'Safecrack', 'Pin', 'Lever', 'Sprocket', 'Deadbolt'];
function newPlayer(id, nick, color, bot) { return { id, nick, color, bot, score: 0, cracks: 0, skill: 0.45 + Math.random() * 0.45 }; }
function newMatch(settings, P) { return { ph: 'intro', tt: T.intro, rd: 0, rounds: settings.rounds ?? 4, clockT: settings.clock ?? 15, turn: 0, cur: null, hist: [], last: null, crack: null, P }; }
function startRound(S) {
  S.rd++;
  S._code = pickOne(ALL);
  Object.assign(S, { hist: [], last: null, crack: null, turn: (S.rd - 1) % S.P.length });
  startTurn(S, S.turn);
}
function startTurn(S, i) {
  if (!S.P.length) return;
  S.turn = ((i % S.P.length) + S.P.length) % S.P.length;
  S.cur = S.P[S.turn].id;
  S._botAt = 1.5 + Math.random() * 2.5;
  Object.assign(S, { ph: 'turn', tt: S.clockT });
}
function guess(S, id, g) {
  const p = S.P.find((q) => q.id === id);
  if (!p || S.ph !== 'turn' || S.cur !== id || !Array.isArray(g) || g.length !== LEN || !g.every((v) => Number.isInteger(v) && v >= 0 && v < 6)) return;
  const [x, n] = score(S._code, g);
  S.hist.push({ id, g: [...g], x, n });
  S.last = { id, x, n };
  if (x === LEN) {
    const pts = Math.max(3, 8 - Math.floor(S.hist.length / 3));
    p.score += pts; p.cracks++;
    Object.assign(S, { ph: 'cracked', tt: T.cracked, crack: { id, pts, code: S._code } });
  } else Object.assign(S, { ph: 'show', tt: T.show });
}
// bots: strong ones pick any code that fits every clue so far, weaker ones only read the last few clues
function botGuess(S, p) {
  const hist = Math.random() < p.skill ? S.hist : S.hist.slice(-2);
  const pool = consistent(hist);
  return pickOne(pool.length ? pool : ALL);
}

function tick(S, dt) {
  S.tt -= dt;
  if (S.ph === 'intro' && S.tt <= 0) startRound(S);
  else if (S.ph === 'turn') {
    const p = S.P.find((q) => q.id === S.cur);
    if (!p) return startTurn(S, S.turn);
    if (p.bot && S.clockT - S.tt >= S._botAt) guess(S, p.id, botGuess(S, p));
    else if (S.tt <= 0) guess(S, p.id, pickOne(ALL));
  } else if (S.ph === 'show' && S.tt <= 0) startTurn(S, S.turn + 1);
  else if (S.ph === 'cracked' && S.tt <= 0) {
    if (S.rd < S.rounds) startRound(S);
    else if (S.mode === 'attract') { S.rd = 0; for (const p of S.P) p.score = 0; startRound(S); }
    else Object.assign(S, { ph: 'final', tt: T.final });
  } else if (S.ph === 'final' && S.tt <= 0 && game.isHost) game.backToLobby();
}
function action(S, from, a) { if (a.t === 'guess') guess(S, from, a.g); }
// promoted host: the code left with the old host, so pick a new one that fits every clue already shown
function promote(S) {
  if (!S.hist) return;
  S._code = pickOne(consistent(S.hist).length ? consistent(S.hist) : ALL);
  if (S.ph === 'turn') S.tt = Math.max(S.tt, 6);
}
function left(S, ids) { if (S.ph === 'turn' && ids.includes(S.cur)) startTurn(S, S.turn); }
function attract() {
  const P = [];
  for (let i = 0; i < 6; i++) P.push(newPlayer(-1 - i, BOT_NAMES[i], ['#9b5de5', '#00bbf9', '#00f5d4', '#f15bb5', '#fee440', '#8ac926'][i], true));
  const S = newMatch({ rounds: 3, clock: 8 }, P);
  S.tt = 1;
  return S;
}

// View
let doorOpen = 0;
function change(prev, cur) {
  if (prev?.ph !== cur.ph || prev?.cur !== cur.cur) {
    if (cur.ph === 'turn') { sfx.turn(cur.cur === game.me); if (cur.cur === game.me) draft = draft.length ? draft : []; dockKey = ''; }
    if (cur.ph === 'show' && cur.last) sfx.fb(cur.last.x, cur.last.n);
    if (cur.ph === 'cracked') sfx.open();
  }
  if (prev?.rd !== cur.rd) draft = [];
  renderLog(cur);
}
function renderLog(S) {
  const el = document.getElementById('log');
  el.innerHTML = `<div style="font-weight:800;margin-bottom:4px">Clues · vault ${S.rd}</div>` + (S.hist.length ? '' : '<div style="opacity:.6">No guesses yet</div>') + S.hist.slice(-12).map((h) => {
    const p = S.P.find((q) => q.id === h.id);
    return `<div class="row"><span class="who" style="color:${p?.color ?? '#fff'}">${esc(p?.nick ?? '?')}</span>${h.g.map((g) => `<span class="gem" style="background:${GEMS[g][1]}"></span>`).join('')}<span class="fb">${[0, 1, 2, 3].map((k) => `<i class="${k < h.x ? 'x' : k < h.x + h.n ? 'n' : ''}"></i>`).join('')}</span></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

// Input > tap gems to fill the four slots, tap a slot to clear it, submit (keys 1-6, Backspace, Enter)
let draft = [], dockKey = '';
function renderDock(S) {
  const myTurn = S.mode === 'match' && S.ph === 'turn' && S.cur === game.me, dock = hud.dock;
  const key = JSON.stringify([myTurn, draft]);
  if (key === dockKey) return;
  dockKey = key;
  dock.style.display = myTurn ? 'block' : 'none';
  if (!myTurn) return;
  dock.innerHTML = `<div class="slots">${[0, 1, 2, 3].map((i) => `<button data-s="${i}" class="${draft[i] != null ? 'f' : ''}" style="${draft[i] != null ? `background:${GEMS[draft[i]][1]}` : ''}" aria-label="slot ${i + 1}"></button>`).join('')}</div>
    <div class="btns pal">${GEMS.map(([n, c], i) => `<button data-g="${i}" title="${n}" style="background:${c}"></button>`).join('')}</div>
    <div class="btns" style="margin-top:8px"><button data-clear>Clear</button><button data-go class="on" ${draft.length === LEN ? '' : 'disabled'}>Try the code</button></div><div class="s" id="dockS"></div>`;
  dock.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => addGem(+b.dataset.g)));
  dock.querySelectorAll('[data-s]').forEach((b) => (b.onclick = () => { draft.splice(+b.dataset.s, 1); dockKey = ''; }));
  dock.querySelector('[data-clear]').onclick = () => { draft = []; dockKey = ''; };
  dock.querySelector('[data-go]').onclick = submit;
}
function addGem(g) { if (draft.length < LEN) { draft.push(g); sfx.click(); dockKey = ''; } }
function submit() { if (draft.length === LEN && game.S.cur === game.me && game.S.ph === 'turn') { game.act({ t: 'guess', g: draft }); draft = []; dockKey = ''; } }
addEventListener('keydown', (e) => {
  if (/^[1-6]$/.test(e.key)) addGem(+e.key - 1);
  else if (e.key === 'Backspace') { draft.pop(); dockKey = ''; }
  else if (e.key === 'Enter') submit();
});

// HUD
let hudT = 0, lastClock = 0;
function hudFrame(S, dt) {
  const me = game.mine(), match = S.mode === 'match', clock = Math.ceil(Math.max(0, S.tt));
  hud.flashing(dt);
  const cur = S.P.find((p) => p.id === S.cur);
  if (match) {
    if (S.ph === 'intro') hud.big(`<small>${S.rounds} vaults · 4 gems · 6 colors</small>Vault Breakers`);
    else if (S.ph === 'turn') hud.big(S.cur === game.me ? `<small>${clock}s</small>Your turn` : `<small>${clock}s</small>${esc(cur?.nick ?? '')}`);
    else if (S.ph === 'show' && S.last) hud.big(`<small>${S.last.x} right spot · ${S.last.n} wrong spot</small>${S.last.x === 0 && S.last.n === 0 ? 'Nothing' : 'Clue'}`);
    else if (S.ph === 'cracked' && S.crack) { const w = S.P.find((p) => p.id === S.crack.id); hud.big(`<small>cracked in ${S.hist.length} guesses · +${S.crack.pts}</small>${esc(w?.nick ?? '')}`); }
    else if (S.ph === 'final') { const w = [...S.P].sort((a, c) => c.score - a.score)[0]; hud.big(`<small>${w?.score ?? 0} points</small>${esc(w?.nick ?? '')} wins`); }
    else hud.big('');
  } else hud.big('');
  renderDock(S);
  const ds = document.getElementById('dockS');
  if (ds) { ds.textContent = `${clock}s left · ${consistentCount(S)} codes still fit the clues`; if (clock !== lastClock && clock <= 3) sfx.tick(); }
  lastClock = clock;
  hudT -= dt;
  if (hudT > 0 || !match) return;
  hudT = 0.2;
  hud.info(S.ph === 'final' ? 'Final' : `Vault ${Math.max(1, S.rd)} of ${S.rounds}`, `${S.hist.length} guesses so far${me ? ` · score <b style="color:var(--accent)">${me.score}</b>` : ''}`);
  hud.board([...S.P].sort((a, c) => c.score - a.score).map((p) => ({ p, tag: p.id === S.cur && S.ph === 'turn' ? '<span class="mk dot"></span>' : '', right: `${p.score}${p.cracks ? ` <small>${p.cracks} cracked</small>` : ''}` })), game.me);
}
let ccKey = '', ccVal = 1296;
function consistentCount(S) { const k = S.rd + ':' + S.hist.length; if (k !== ccKey) { ccKey = k; ccVal = consistent(S.hist).length; } return ccVal; }

const game = createTableGame({
  lobby: {
    game: 'vault-breakers', title: 'Vault Breakers', emoji: '🔐', accent: '#ffd23f',
    blurb: 'Code-breaking for 1-14. Take turns guessing a hidden 4-gem code; every guess and its clue pegs are shown to everyone, so each turn you deduce from the whole table. Crack it on your turn to score.',
    defaultBots: 4, minPlayers: 1,
    note: 'Up to 14 players (humans + bots). Fewer guesses before the crack = more points. Keys 1-6 pick gems, Enter tries the code.',
    settings: [
      { key: 'rounds', label: 'Vaults', options: [[3, '3'], [4, '4'], [6, '6']], value: 4 },
      { key: 'clock', label: 'Turn clock', options: [[10, '10 s'], [15, '15 s'], [25, '25 s']], value: 15 },
    ],
  },
  botNames: BOT_NAMES, newPlayer, newMatch, attract, tick, action, promote, left, change,
});

// Run engine > render: door swings open on a crack, dials glow as the clue count rises
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 7, 10), look = new THREE.Vector3(0, 1.8, -2.5);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime, S = game.S;
  buildBoard(S);
  doorOpen += ((S.ph === 'cracked' ? 1 : 0) - doorOpen) * Math.min(1, dt * 2.5);
  hinge.rotation.y = -doorOpen * 1.7;
  wheel.rotation.z = S.ph === 'turn' ? time * 0.6 : wheel.rotation.z;
  const last = S.hist.at(-1);
  dials.forEach((d, i) => { d.material.emissive.set(last && i < last.x ? 0xffd23f : 0x000000); d.material.emissiveIntensity = 0.6; });
  pawns.prune(S.P);
  const spots = ringSpots(S.P.length, { r: 7.5, arc: Math.PI * 0.9, center: Math.PI / 2 });
  S.P.forEach((p, i) => {
    const g = pawns.get(p), sp = spots[i], active = S.cur === p.id && (S.ph === 'turn' || S.ph === 'show');
    g.position.set(sp.x * (active ? 0.8 : 1), 0, sp.z * (active ? 0.8 : 1) + 0.5);
    g.rotation.y = sp.face;
    g.userData.body.position.y = S.ph === 'cracked' && S.crack?.id === p.id ? Math.abs(Math.sin(time * 7)) * 0.4 : active ? Math.sin(time * 4) * 0.05 + 0.05 : 0;
    const slot = g.userData.slot, want = S.ph === 'cracked' && S.crack?.id === p.id ? starTex : active ? turnTex : null;
    if (slot.userData.t !== want) { slot.clear(); slot.userData.t = want; if (want) slot.add(badge(want, 0.45)); }
  });
  hudFrame(S, dt);
  const fit = Math.max(1, 1.35 / camera.aspect);
  camPos.lerp(new THREE.Vector3(0, 7 * fit, 10 * fit), 1 - Math.exp(-dt * 3));
  camera.position.copy(camPos);
  camera.lookAt(look);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
game.start();
loop();
</script>
</body>
</html>
