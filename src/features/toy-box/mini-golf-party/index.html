<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Putt Party</title>
<style>
  :root { --ink: #fff; --card: rgba(14, 22, 34, 0.66); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; user-select: none; }
  #info { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #info .h { font-size: 22px; font-weight: 900; }
  #info .h small { font-size: 14px; font-weight: 700; opacity: 0.75; margin-left: 6px; }
  #info .m { font-size: 13px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  #info .m b { color: #ffd23f; font-size: 16px; }
  #board { top: 62px; right: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 170px; }
  #board .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #board .row b { width: 16px; opacity: 0.6; }
  #board .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .row span { flex: 1; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row em { font-style: normal; font-variant-numeric: tabular-nums; opacity: 0.85; min-width: 54px; text-align: right; }
  #board .row.me span { color: #ffd23f; font-weight: 800; }
  #big { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(30px, 7vw, 72px); font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.28); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.32em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.85; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  #card { top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 18px; display: none; max-width: calc(100vw - 32px); overflow-x: auto; }
  #card h2 { margin: 0 0 10px; font-size: 20px; }
  #card table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  #card th, #card td { padding: 3px 7px; text-align: center; }
  #card th { opacity: 0.6; font-weight: 700; }
  #card td.n { text-align: left; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #card td.t { font-weight: 900; color: #ffd23f; }
  #card .bd { color: #5ee07a; font-weight: 800; }
  #card .bg { color: #ff8a8a; }
  #card .foot { opacity: 0.6; font-size: 12px; margin-top: 8px; }
  #card { max-height: calc(100dvh - 32px); overflow-y: auto; touch-action: pan-x pan-y; }
  /* touch camera: zoom out, zoom in, follow own ball (wheel / F on desktop) */
  #camBtns { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); padding: 6px; display: none; gap: 6px; }
  #camBtns button { font: inherit; font-size: 18px; font-weight: 900; color: inherit; background: rgba(255, 255, 255, 0.14); border: 0; border-radius: 10px; min-width: 44px; height: 44px; padding: 0 10px; cursor: pointer; }
  #camBtns button.on { background: #ffd23f; color: #1b2433; }
  @media (pointer: coarse) { #hint { display: none; } }
  @media (hover: hover) and (pointer: fine) { #camBtns { display: none !important; } }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createLobby } from '../common/room-lobby.js';
import { startTicker } from '../common/room-client.js';
import { createNameSync } from '../common/snapshot-names.js';
import { createSnapPacing } from '../common/snap-pacing.js';
import { createGameAudio } from '../common/game-audio.js';
import { keyId } from '../common/key-state.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { HOLES, T, R, SLOPE, solid, clamp, millAngle, tileAt, parseHole } from './golf-course.js';
import { createGolfSim, STEP, totalStrokes as score } from './mini-golf-sim.js';

// Scene > Renderer, camera, sky, lights, sea far below the floating holes
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8dcff);
scene.fog = new THREE.Fog(0xa8dcff, 70, 190);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x6a8a5a, 1.5));
const sun = new THREE.DirectionalLight(0xfff2de, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(800, 800).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4cb8f0, roughness: 0.4 }));
sea.position.y = -9;
scene.add(sea);

// Textures > felt noise, slope chevrons, water ripples
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const feltTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { const v = 215 + Math.random() * 40; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * w, Math.random() * h, 1, 2); } });
const arrowTex = canvasTex(64, 64, (g, w, h) => { g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 7; g.lineCap = 'round'; for (const y of [18, 50]) { g.beginPath(); g.moveTo(14, y + 10); g.lineTo(32, y - 6); g.lineTo(50, y + 10); g.stroke(); } });
const waterTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#2f8fe8'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2; for (let i = 0; i < 14; i++) { const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.arc(x, y, 6 + Math.random() * 10, 0.2, 1.4); g.stroke(); } });

// Holes > meshes: floating island tiles, walls, slopes, water, bumpers, windmills, cup + flag
const holeGroup = new THREE.Group();
scene.add(holeGroup);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const shared = {
  floor: new THREE.MeshStandardMaterial({ map: feltTex, roughness: 0.95 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
  dirt: new THREE.MeshStandardMaterial({ color: 0x8a5a3c, roughness: 1 }),
  arrow: new THREE.MeshBasicMaterial({ map: arrowTex, transparent: true, depthWrite: false }),
  water: new THREE.MeshStandardMaterial({ map: waterTex, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.92 }),
};
let H = null;
let holeMeshes = { bumpers: [], mills: [], flag: null };
function setHole(i) {
  if (H && H.i === i) return;
  H = parseHole(i);
  for (const c of [...holeGroup.children]) { holeGroup.remove(c); c.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  const floors = [], walls = [], bases = [], arrows = [], waters = [];
  const near = (c, r) => { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const ch = tileAt(H, c + dc, r + dr); if (!solid(ch)) return true; } return false; };
  for (let r = 0; r < H.rows; r++) for (let c = 0; c < H.cols; c++) {
    const ch = H.grid[r][c], x = c * T + T / 2, z = r * T + T / 2;
    if (ch === ' ') continue;
    if (ch === '#') { if (near(c, r)) { walls.push([x, z, c, r]); bases.push([x, z]); } continue; }
    bases.push([x, z]);
    if (ch === '~') { waters.push([x, z]); continue; }
    floors.push([x, z, ch, (c + r) % 2]);
    if (SLOPE[ch]) arrows.push([x, z, ch]);
  }
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
  const fl = new THREE.InstancedMesh(box(T, 0.4, T), shared.floor, floors.length);
  floors.forEach(([x, z, ch, alt], k) => {
    fl.setMatrixAt(k, m.makeTranslation(x, -0.2, z));
    fl.setColorAt(k, col.set(ch === ':' ? (alt ? 0xead39a : 0xe2c986) : SLOPE[ch] ? (alt ? 0x3c9f57 : 0x379a52) : alt ? 0x49b85a : 0x41ad52));
  });
  fl.receiveShadow = true;
  const wl = new THREE.InstancedMesh(new RoundedBoxGeometry(T, 0.55, T, 2, 0.09), shared.wall, walls.length);
  walls.forEach(([x, z, c, r], k) => { wl.setMatrixAt(k, m.makeTranslation(x, 0.275 - 0.12, z)); wl.setColorAt(k, col.setHSL(0.07 + ((c * 7 + r * 3) % 5) * 0.006, 0.55, 0.5 + ((c + r) % 2) * 0.05)); });
  wl.castShadow = wl.receiveShadow = true;
  const bs = new THREE.InstancedMesh(box(T, 2.2, T), shared.dirt, bases.length);
  bases.forEach(([x, z], k) => bs.setMatrixAt(k, m.makeTranslation(x, -1.5, z)));
  bs.receiveShadow = true;
  holeGroup.add(fl, wl, bs);
  if (arrows.length) {
    const ar = new THREE.InstancedMesh(new THREE.PlaneGeometry(T * 0.9, T * 0.9).rotateX(-Math.PI / 2), shared.arrow, arrows.length);
    const rot = { '^': 0, v: Math.PI, '>': -Math.PI / 2, '<': Math.PI / 2 };
    arrows.forEach(([x, z, ch], k) => ar.setMatrixAt(k, m.compose(new THREE.Vector3(x, 0.012, z), q.setFromAxisAngle(up, rot[ch]), one)));
    holeGroup.add(ar);
  }
  if (waters.length) {
    const wt = new THREE.InstancedMesh(new THREE.PlaneGeometry(T, T).rotateX(-Math.PI / 2), shared.water, waters.length);
    waters.forEach(([x, z], k) => wt.setMatrixAt(k, m.makeTranslation(x, -0.14, z)));
    wt.receiveShadow = true;
    holeGroup.add(wt);
  }
  holeMeshes.bumpers = H.bumpers.map((o) => {
    const g = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.5, 24), new THREE.MeshStandardMaterial({ color: 0xff4d6d, roughness: 0.35, emissive: 0xff2050, emissiveIntensity: 0 }));
    post.position.y = 0.25;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 24), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    cap.position.y = 0.53;
    post.castShadow = true;
    g.add(post, cap); g.position.set(o.x, 0, o.z);
    holeGroup.add(g);
    return g;
  });
  holeMeshes.mills = H.mills.map((o) => {
    const g = new THREE.Group(), blades = new THREE.Group();
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.7, 20), new THREE.MeshStandardMaterial({ color: 0x334155 }));
    hub.position.y = 0.35;
    const bladeMat = [new THREE.MeshStandardMaterial({ color: 0xffffff }), new THREE.MeshStandardMaterial({ color: 0xff5a5f })];
    for (const k of [0, 1]) for (const s of [-1, 1]) {
      const bl = new THREE.Mesh(box(0.24, 0.32, 2.4), bladeMat[(k + (s > 0 ? 1 : 0)) % 2]);
      bl.position.set(0, 0.22, 0); bl.geometry.translate(0, 0, s * 1.3);
      bl.rotation.y = k * Math.PI / 2; bl.castShadow = true;
      blades.add(bl);
    }
    g.add(hub, blades); g.position.set(o.x, 0, o.z); g.userData.blades = blades;
    holeGroup.add(g);
    return g;
  });
  const cup = new THREE.Mesh(new THREE.CircleGeometry(0.3, 28).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x0b1410 }));
  cup.position.set(H.cup.x, 0.004, H.cup.z);
  const rim = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.36, 28).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  rim.position.copy(cup.position);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.4, 8), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
  pole.position.set(H.cup.x, 1.2, H.cup.z); pole.castShadow = true;
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55).translate(0.45, 0, 0), new THREE.MeshStandardMaterial({ color: 0xff3b5c, side: THREE.DoubleSide }));
  flag.position.set(H.cup.x, 2.1, H.cup.z); flag.castShadow = true;
  holeGroup.add(cup, rim, pole, flag);
  holeMeshes.flag = flag;
  const w = H.cols * T, d = H.rows * T;
  Object.assign(sun.shadow.camera, { left: -w * 0.8, right: w * 0.8, top: d * 0.9, bottom: -d * 0.9, near: 1, far: 120 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(w / 2 + 14, 40, d / 2 + 10); sun.target.position.set(w / 2, 0, d / 2);
}

// Balls > meshes: ball, small name tag, own-ball ring
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(14,22,34,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(1.7, 0.42, 1); s.position.y = 0.75; s.renderOrder = 5;
  return s;
}
const ballGeo = new THREE.SphereGeometry(R, 24, 16);
const balls3d = new Map();
function makeBall(b) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: b.color, roughness: 0.28 }));
  ball.castShadow = true;
  const tag = nameTag(b.nick, b.color);
  g.add(ball, tag);
  g.userData = { ball, tag, y: R };
  scene.add(g);
  return g;
}
const myRing = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.04, 8, 32).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
myRing.visible = false;
scene.add(myRing);
// whose turn: colored ring under the active ball
const turnRing = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.62, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, depthWrite: false }));
turnRing.visible = false;
scene.add(turnRing);
const aimArrow = new THREE.Group();
const aimMat = new THREE.MeshBasicMaterial({ color: 0x5ee07a, transparent: true, opacity: 0.9, depthWrite: false });
const shaft = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 1).translate(0, 0.5, 0).rotateX(-Math.PI / 2), aimMat);
const head = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.5, 3).rotateX(-Math.PI / 2), aimMat);
aimArrow.add(shaft, head);
aimArrow.visible = false;
scene.add(aimArrow);

// FX > confetti burst from the cup
const CONF = 400;
const confGeo = new THREE.BufferGeometry();
const confPos = new Float32Array(CONF * 3), confCol = new Float32Array(CONF * 3), confVel = new Float32Array(CONF * 3), confLife = new Float32Array(CONF);
confGeo.setAttribute('position', new THREE.BufferAttribute(confPos, 3));
confGeo.setAttribute('color', new THREE.BufferAttribute(confCol, 3));
const confetti = new THREE.Points(confGeo, new THREE.PointsMaterial({ size: 0.16, vertexColors: true }));
confetti.frustumCulled = false;
scene.add(confetti);
let confNext = 0;
function burst(x, z, color, n = 60) {
  const c = new THREE.Color(color), w = new THREE.Color(0xffffff);
  for (let k = 0; k < n; k++) {
    const i = confNext++ % CONF, a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
    confPos.set([x, 0.3, z], i * 3);
    confVel.set([Math.cos(a) * s, 4 + Math.random() * 4, Math.sin(a) * s], i * 3);
    const cc = Math.random() < 0.3 ? w : c;
    confCol.set([cc.r, cc.g, cc.b], i * 3);
    confLife[i] = 1.6;
  }
}
for (let i = 0; i < CONF; i++) confPos[i * 3 + 1] = -99;

// Audio > putt tick, wall clack, cup jingle, splash, bumper boing
const gameAudio = createGameAudio();
const { tone, noise } = gameAudio;
const sfx = {
  putt(v) { noise(0.06, 0.25 * v, 4000, 1500, 'bandpass'); tone(1300, 900, 0.05, 0.08 * v, 'triangle'); },
  wall(v) { tone(320, 180, 0.07, 0.07 * v, 'triangle'); },
  click() { tone(2200, 1800, 0.03, 0.05, 'square'); },
  bump() { tone(180, 520, 0.18, 0.12, 'sine'); },
  splash() { noise(0.6, 0.3, 1500, 200); },
  cup(me) { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, f, 0.14, me ? 0.1 : 0.04, 'square'), i * 70)); },
  turn() { tone(660, 660, 0.1, 0.07, 'triangle'); tone(990, 990, 0.14, 0.07, 'triangle', 0.11); },
};

// Game > World: rules run in mini-golf-sim.js; this page steps it for the attract show and draws the relay server's match
const sim = createGolfSim();
const world = sim.world;
const parSoFar = (b) => b.scores.reduce((s, v, i) => s + (v != null ? HOLES[i].par : 0), 0);

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'mini-golf', title: 'Putt Party', emoji: '⛳', accent: '#5ee07a',
  blurb: 'Take turns: putts rotate around the group in honor order. Knock rivals around, dodge water and windmills. 6 holes, lowest total wins.',
  maxBots: 13, defaultBots: 3, minPlayers: 2,
  note: 'Up to 14 golfers per room (humans + bots). Drag back to aim on phone or mouse. Fewer golfers = quicker rounds.',
  settings: [{ key: 'clock', label: 'Shot clock', options: [[15, '15 s'], [20, '20 s'], [30, '30 s']], value: 20 }],
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the match; every page (lobby host too) watches it and sends only its own putts
  onStart({ bots, settings }) {
    sim.clearPlayers();
    Object.assign(world, { mode: 'match', phase: 'intro', turn: null, rolling: false, clock: settings.clock ?? 20 });
    ['info', 'board'].forEach((id) => (document.getElementById(id).style.display = 'block'));
    ['top', 'camBtns'].forEach((id) => (document.getElementById(id).style.display = 'flex'));
    syncTop();
    serverMatch.start({ bots, settings });
  },
  onLobby() {
    serverMatch.stop();
    ['info', 'board', 'top', 'card', 'camBtns'].forEach((id) => (document.getElementById(id).style.display = 'none'));
    big('');
    sim.startAttract();
  },
});
const serverMatch = createServerMatchClient(lobby);
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();

// Multiplayer > Net: everything in a match comes from the relay server
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
function applySnap(s) {
  serverMatch.onSnapshot(s);
  names.read(s);
  Object.assign(world, { phase: s.ph, t: s.t, hole: s.hole, ht: s.ht, turn: s.tn ?? null, tt: s.tt ?? 0, rolling: !!s.rl });
  const seen = new Set();
  for (const [id, x, z, vx, vz, fl, strokes] of s.B) {
    seen.add(id);
    if (!world.balls.has(id) && !names.name(id)) continue;
    const b = world.balls.get(id) ?? sim.addPlayer(id, ...names.name(id), !!(fl & 1));
    Object.assign(b, { x, z, vx, vz, strokes, holed: !!(fl & 2), done: !!(fl & 4), teed: !!(fl & 8) });
  }
  for (const id of [...world.balls.keys()]) if (!seen.has(id)) sim.removePlayer(id);
  // scorecard, tee order and shot clock ride only when they change
  if (s.sc) for (const [id, sc] of s.sc) { const b = world.balls.get(id); if (b) b.scores = sc.map((v) => (v == null ? undefined : v)); }
  if (s.od) world.order = s.od.filter((id) => world.balls.has(id));
  if (s.ck) world.clock = s.ck;
  setHole(world.hole);
  playEvents(s.ev ?? []);
  snapAt = pacing.arrived();
}
function playEvents(evs) {
  const me = lobby.room?.me;
  for (const e of evs) {
    const b = world.balls.get(e[1]);
    if (e[0] === 'k') sfx.putt(e[1] === me ? 1 : 0.35);
    else if (e[0] === 'w') sfx.wall(e[2] * (e[1] === me ? 1 : 0.5));
    else if (e[0] === 'x') sfx.click();
    else if (e[0] === 'b') { sfx.bump(); const g = holeMeshes.bumpers[e[2]]; if (g) g.userData.pulse = 1; }
    else if (e[0] === 's') { sfx.splash(); burst(e[2], e[3], '#7fd0ff', 30); if (e[1] === me) flash('Splash! +1'); }
    else if (e[0] === 'c' && b) {
      sfx.cup(e[1] === me);
      burst(H.cup.x, H.cup.z, b.color, e[2] === 1 ? 140 : 60);
      if (e[1] === me) flash(e[2] === 1 ? 'HOLE IN ONE!' : label(e[2] - H.par));
      else if (e[2] === 1) flash(`<small>${esc(b.nick)}</small>HOLE IN ONE!`);
    } else if (e[0] === 'm' && e[1] === me) flash('<small>stroke limit</small>Picked up');
    else if (e[0] === 't' && e[1] === me) { sfx.turn(); flash('Your turn!'); }
    else if (e[0] === 'o' && e[1] === me) flash('<small>shot clock · putt played for you</small>+1 stroke');
  }
}
const label = (d) => ({ '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', 0: 'Par' }[d] ?? (d === 1 ? 'Bogey' : d === 2 ? 'Double bogey' : `+${d}`));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rel = (n) => (n === 0 ? 'E' : n > 0 ? `+${n}` : `${n}`);

// Input > drag-back slingshot aim on any pointer, wheel / pinch / buttons zoom, F / button follow
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function groundAt(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const p = new THREE.Vector3(); return ray.ray.intersectPlane(ground, p) ? p : null; }
const myBall = () => world.balls.get(lobby.room?.me);
function canAim() { const b = myBall(); return world.mode === 'match' && world.phase === 'play' && b && !b.done && world.turn === b.id && !world.rolling; }
// shot seq starts at a random spot so a reloaded page never repeats the last one the server saw
let aim = null, shotSeq = Math.floor(Math.random() * 1e6), zoom = 1, follow = false;
const setZoom = (z) => { zoom = clamp(z, 0.35, 1.25); };
const followBtn = document.getElementById('followBtn');
function setFollow(on) { follow = on; followBtn.classList.toggle('on', on); }
document.getElementById('zoomIn').onclick = () => setZoom(zoom * 0.8);
document.getElementById('zoomOut').onclick = () => setZoom(zoom * 1.25);
followBtn.onclick = () => setFollow(!follow);
// two-finger pinch zooms; a second finger cancels any aim in progress
const touches = new Map();
let pinch = null;
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
function trackTouch(e) { if (e.pointerType === 'touch') touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); }
function dropTouch(e) { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; }
renderer.domElement.addEventListener('pointerdown', (e) => {
  trackTouch(e);
  if (touches.size === 2) { aim = null; pinch = { d0: Math.max(1, spread()), z0: zoom }; }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!touches.has(e.pointerId)) return;
  trackTouch(e);
  if (pinch) setZoom((pinch.z0 * pinch.d0) / Math.max(1, spread()));
});
for (const ev of ['pointerup', 'pointercancel']) renderer.domElement.addEventListener(ev, dropTouch);
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || pinch || !canAim()) return;
  const g = groundAt(e);
  if (!g) return;
  aim = { id: e.pointerId, g0: g, a: 0, p: 0 };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!aim || e.pointerId !== aim.id) return;
  const g = groundAt(e);
  if (!g) return;
  const dx = aim.g0.x - g.x, dz = aim.g0.z - g.z;
  aim.a = Math.atan2(dx, dz); aim.p = clamp(Math.hypot(dx, dz) / 7, 0, 1);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!aim || e.pointerId !== aim.id) return;
  const { a, p } = aim;
  aim = null;
  if (p < 0.04 || !canAim()) return;
  serverMatch.sendAction({ shot: [+a.toFixed(4), +p.toFixed(3)], q: ++shotSeq });
});
renderer.domElement.addEventListener('pointercancel', () => (aim = null));
addEventListener('keydown', (e) => { if (e.code === 'Escape') aim = null; if (keyId(e) === 'KeyF' && !e.repeat) setFollow(!follow); });
addEventListener('wheel', (e) => setZoom(zoom * (e.deltaY > 0 ? 1.1 : 0.9)), { passive: true });

// HUD > hole info, leaderboard, banner, scorecard
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t) { big(t); flashT = 1.6; }
let hudT = 0;
function hud(dt) {
  if (world.mode !== 'match' || !H) return;
  flashT -= dt;
  if (world.phase === 'intro') big(`<small>Hole ${world.hole + 1} of ${HOLES.length} · Par ${H.par}</small>${esc(H.name)}`);
  else if (flashT <= 0) big('');
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  const me = myBall(), up = world.balls.get(world.turn);
  document.getElementById('holeName').innerHTML = `Hole ${world.hole + 1}/${HOLES.length}<small>${esc(H.name)} · Par ${H.par}</small>`;
  // turn line: who is putting + shot clock
  const clock = Math.max(0, Math.ceil(world.tt));
  const turnLine = world.phase !== 'play' ? '' : !up ? 'next up…' : world.rolling ? `${esc(up.nick)} putted` : up.id === me?.id ? `<b>Your turn</b> · ${clock}s` : `${esc(up.nick)} to putt${up.bot ? '' : ` · ${clock}s`}`;
  document.getElementById('holeMeta').innerHTML = (me ? `Strokes <b>${me.strokes}</b> · total ${score(me)} (${rel(score(me) - parSoFar(me))})<br>` : '') + turnLine;
  const r = [...world.balls.values()].sort((a, c) => score(a) - parSoFar(a) - (score(c) - parSoFar(c)) || a.strokes - c.strokes);
  document.getElementById('board').innerHTML = r.map((b, i) => `<div class="row ${b.id === lobby.room?.me ? 'me' : ''}"><b>${b.id === world.turn ? '▶' : i + 1}</b><i style="background:${b.color}"></i><span>${esc(b.nick)}</span><em>${rel(score(b) - parSoFar(b))} · ${b.holed ? '✓' : b.done ? '✗' : b.strokes}</em></div>`).join('');
  const card = document.getElementById('card');
  if (world.phase === 'score' || world.phase === 'final') {
    const rows = [...world.balls.values()].sort((a, c) => score(a) - score(c));
    const head = `<tr><th></th>${HOLES.map((h, i) => `<th>${i + 1}</th>`).join('')}<th>Tot</th></tr><tr><th>Par</th>${HOLES.map((h) => `<th>${h.par}</th>`).join('')}<th>${HOLES.reduce((s, h) => s + h.par, 0)}</th></tr>`;
    const body = rows.map((b) => `<tr><td class="n" style="color:${b.color}">${esc(b.nick)}</td>${HOLES.map((h, i) => { const v = b.scores[i]; return `<td class="${v == null ? '' : v < h.par ? 'bd' : v > h.par ? 'bg' : ''}">${v ?? '·'}</td>`; }).join('')}<td class="t">${score(b)}</td></tr>`).join('');
    const title = world.phase === 'final' ? `🏆 ${esc(rows[0]?.nick ?? '')} wins!` : `⛳ After hole ${world.hole + 1}`;
    const foot = world.phase === 'final' ? `back to lobby in ${Math.max(0, Math.ceil(world.t))}s` : `next hole in ${Math.max(0, Math.ceil(world.t))}s`;
    card.innerHTML = `<h2>${title}</h2><table>${head}${body}</table><div class="foot">${foot}</div>`;
    card.style.display = 'block';
  } else card.style.display = 'none';
}

// Run engine > attract show steps the sim here; a match is stepped on the relay server
const isHostSim = () => world.mode === 'attract';
let acc = 0;
function simTick(dt) {
  if (!isHostSim()) return;
  for (acc += Math.min(dt, 0.25); acc >= STEP; acc -= STEP) sim.step();
  setHole(world.hole);
  playEvents(sim.events); sim.events = [];
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(10, 30, 40), camLook = new THREE.Vector3(10, 0, 8), _v = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.1));
  const me = lobby.room?.me;
  for (const [id, g] of balls3d) if (!world.balls.has(id)) { scene.remove(g); balls3d.delete(id); }
  for (const b of world.balls.values()) {
    let g = balls3d.get(b.id);
    if (!g) { g = makeBall(b); balls3d.set(b.id, g); g.position.set(b.x, R, b.z); }
    const tx = b.x + b.vx * age, tz = b.z + b.vz * age, a = hostSim ? 1 : 1 - Math.exp(-dt * pacing.rate(18));
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 3) g.position.set(tx, g.position.y, tz);
    const px = g.position.x, pz = g.position.z;
    g.position.x += (tx - px) * a; g.position.z += (tz - pz) * a;
    // roll the ball by distance travelled
    const mx = g.position.x - px, mz = g.position.z - pz, ml = Math.hypot(mx, mz);
    if (ml > 1e-5) g.userData.ball.rotateOnWorldAxis(_v.set(mz / ml, 0, -mx / ml), ml / R);
    const u = g.userData;
    u.y += ((b.holed ? -0.5 : R) - u.y) * (1 - Math.exp(-dt * (b.holed ? 6 : 20)));
    g.position.y = u.y;
    u.ball.visible = u.y > -0.4;
    u.tag.visible = !b.holed && (b.id === me || world.balls.size <= 6 || zoom < 0.7);
  }
  const mine = world.balls.get(me), mineG = balls3d.get(me);
  const ready = canAim();
  myRing.visible = !!(mineG && world.mode === 'match' && !mine.holed);
  if (myRing.visible) { myRing.position.set(mineG.position.x, 0.02, mineG.position.z); const s = ready ? 1 + Math.sin(time * 6) * 0.12 : 0.8; myRing.scale.set(s, s, s); myRing.material.color.set(ready ? 0xffffff : 0x8899aa); }
  const upB = world.balls.get(world.turn), upG = balls3d.get(world.turn);
  turnRing.visible = !!(upG && world.phase === 'play' && !world.rolling && !upB.done);
  if (turnRing.visible) { turnRing.position.set(upG.position.x, 0.015, upG.position.z); const s = 1 + Math.sin(time * 4) * 0.1; turnRing.scale.set(s, s, s); turnRing.material.color.set(upB.color); }
  aimArrow.visible = !!(aim && ready && aim.p > 0.02 && mineG);
  if (aimArrow.visible) {
    aimArrow.position.set(mineG.position.x, 0.03, mineG.position.z);
    aimArrow.rotation.y = aim.a + Math.PI;
    const len = 0.6 + aim.p * 4.4;
    shaft.scale.set(1, 1, len); head.position.set(0, 0, -(len + 0.2));
    aimMat.color.setHSL(0.33 - aim.p * 0.33, 0.85, 0.55);
  }
  if (H) {
    holeMeshes.mills.forEach((g) => (g.userData.blades.rotation.y = millAngle(world.ht + age)));
    holeMeshes.bumpers.forEach((g) => { const p = g.userData.pulse ?? 0; g.userData.pulse = Math.max(0, p - dt * 4); const s = 1 + p * 0.25; g.scale.set(s, 1, s); g.children[0].material.emissiveIntensity = p * 1.2; });
    if (holeMeshes.flag) holeMeshes.flag.rotation.y = Math.sin(time * 2.6) * 0.35 + 0.4;
  }
  arrowTex.offset.y -= dt * 0.9;
  waterTex.offset.x += dt * 0.05; waterTex.offset.y += dt * 0.03;
  for (let i = 0; i < CONF; i++) {
    if (confLife[i] <= 0) continue;
    confLife[i] -= dt; confVel[i * 3 + 1] -= 12 * dt;
    for (let k = 0; k < 3; k++) confPos[i * 3 + k] += confVel[i * 3 + k] * dt;
    if (confLife[i] <= 0) confPos[i * 3 + 1] = -99;
  }
  confGeo.attributes.position.needsUpdate = true; confGeo.attributes.color.needsUpdate = true;
  hud(dt);
  // camera: frame the whole hole; zoom/follow slides focus toward own ball
  if (H) {
    const w = H.cols * T, d = H.rows * T, fov = THREE.MathUtils.degToRad(camera.fov);
    const need = Math.max(d * 1.05, (w * 1.05) / camera.aspect) / (2 * Math.tan(fov / 2));
    let fx = w / 2, fz = d / 2 + 0.6, dist = need * 1.05 * zoom;
    const k = follow ? 1 : clamp((1 - zoom) / 0.6, 0, 1);
    if (mineG && world.mode === 'match' && k > 0) { fx += (mineG.position.x - fx) * k; fz += (mineG.position.z - fz) * k; if (follow) dist = Math.min(dist, need * 0.55); }
    const pitch = 0.95;
    camPos.lerp(_v.set(fx, Math.sin(pitch) * dist, fz + Math.cos(pitch) * dist), 1 - Math.exp(-dt * 4));
    camLook.lerp(_v.set(fx, 0, fz), 1 - Math.exp(-dt * 4));
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
sim.startAttract();
setHole(world.hole);
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
