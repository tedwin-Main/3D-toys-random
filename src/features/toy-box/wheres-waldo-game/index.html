<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Waldo Hunt</title>
<style>
  :root { --bg: #0c0e13; --panel: #151922; --line: #262c38; --ink: #e8e6e0; --dim: #99a0ad; --accent: #d6263c; --good: #4fbf7a; --warn: #ffd34d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; font-size: 14px; padding: 9px 14px; background: #1d222d; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #3a4252; }
  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #game { display: grid; grid-template-columns: 1fr 280px; grid-template-rows: auto 1fr; height: 100vh; }
  .hud { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; }
  .hud-left, .hud-right { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); background: transparent; line-height: 1.4; }
  .pill.map { background: #3a2f22; color: #e8d9b8; border-color: #5a4a33; }
  .pill.code { color: var(--warn); letter-spacing: 0.15em; font-weight: 700; }
  button.pill { cursor: pointer; }
  .clock { display: inline-flex; align-items: center; line-height: 0; }
  .score { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #1d222d; white-space: nowrap; }
  .score.me { outline: 1px solid var(--dim); }
  .score.found { color: var(--good); }
  .score.hiding { color: var(--warn); }
  .score.gone { opacity: 0.4; text-decoration: line-through; }
  .scene-wrap { position: relative; overflow: hidden; min-height: 0; }
  #scene { display: block; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }
  .cursor-cool { position: absolute; transform: translate(14px, 14px); pointer-events: none; z-index: 5; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-variant-numeric: tabular-nums; background: rgba(176, 53, 60, 0.92); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); display: none; }
  .minimap { position: absolute; right: 10px; bottom: 10px; width: 140px; height: 100px; background: #1a1d25; border: 1px solid var(--line); border-radius: 6px; display: none; }
  .minimap canvas { width: 140px; height: 100px; display: block; border-radius: 5px; }
  .minimap-view { position: absolute; border: 1px solid var(--warn); background: rgba(255, 211, 77, 0.12); pointer-events: none; }
  .mid { position: absolute; inset: 0; display: none; place-items: center; font-size: 22px; font-weight: 700; color: var(--dim); text-align: center; padding: 20px; }
  .side { padding: 14px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
  .target-card { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .target-card canvas { width: 70px; height: 110px; background: #e6dcc6; border-radius: 8px; flex: none; }
  .target-card strong { font-size: 14px; }
  .target-card p { margin: 4px 0 0; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.5; margin: 10px 0; }
  .round-end { margin-top: 12px; padding: 12px; border: 1px solid var(--warn); border-radius: 8px; display: none; }
  .round-end p { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  .round-end small { display: block; color: var(--dim); margin-bottom: 10px; }
  .feed { list-style: none; padding: 0; margin: 14px 0 0; }
  .feed li { font-size: 12px; color: var(--dim); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .error { color: var(--accent); font-size: 13px; min-height: 18px; }
  .final { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8, 10, 18, 0.6); backdrop-filter: blur(4px); z-index: 40; padding: 16px; }
  .final-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .final-card h1 { margin: 0 0 8px; font-size: 26px; }
  .standings { list-style: none; counter-reset: s; padding: 0; margin: 0 0 16px; }
  .standings li { counter-increment: s; display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .standings li::before { content: counter(s) "."; color: var(--dim); margin-right: 10px; }
  .standings li span { flex: 1; }
  .standings li.win { color: var(--warn); font-weight: 700; }
  .final-btns { display: flex; gap: 8px; }
  .final-btns .primary { flex: 1; }
  @media (max-width: 900px) {
    #game { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .side { border-left: none; border-top: 1px solid var(--line); max-height: 34vh; }
  }
</style>
</head>
<body>
<div id="game">
  <header class="hud">
    <div class="hud-left">
      <span class="pill code" id="code"></span>
      <span class="pill" id="roundPill"></span>
      <span class="pill" id="modePill"></span>
      <span class="pill map" id="mapPill"></span>
      <span class="clock" id="clock"></span>
      <button class="pill" id="mute"></button>
      <button class="pill" id="lobbyBtn">Lobby</button>
    </div>
    <div class="hud-right" id="scores"></div>
  </header>
  <div class="scene-wrap" id="wrap">
    <canvas id="scene"></canvas>
    <div class="cursor-cool" id="cool"></div>
    <div class="minimap" id="mini"><canvas id="miniCanvas"></canvas><div class="minimap-view" id="miniView"></div></div>
    <div class="mid" id="mid"></div>
  </div>
  <aside class="side">
    <div class="target-card"><canvas id="card"></canvas><div><strong>Waldo</strong><p id="cardText"></p></div></div>
    <p class="hint" id="hint"></p>
    <div class="round-end" id="roundEnd"><p id="reason"></p><small id="nextIn"></small><button class="primary" id="nextBtn">Next round</button></div>
    <ul class="feed" id="feed"></ul>
    <p class="error" id="err"></p>
  </aside>
</div>
<div class="final" id="final"><div class="final-card"><h1>Final</h1><ol class="standings" id="standings"></ol><div class="final-btns" id="finalBtns"><button id="toLobby">Lobby</button><button class="primary" id="again">Play again</button></div><p class="hint" id="finalWait">Waiting for the host…</p></div></div>

<script type="module">
import { createLobby } from '../common/room-lobby.js';
import { SERVER_PEER } from '../common/relay-wire.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { makeRng, WORLD_W, WORLD_H, VIEW_W, VIEW_H, SPRITE_W, SPRITE_H, clampCamera, SKIN, HAIR, INK, WALDO, THEME_IDS, THEMES, getTheme, makeTargetLook, generateScene, stampTarget } from './waldo-scene.js';
import { ROUND_MS, WRONG_GRACE, validatePlacement } from './waldo-rounds.js';

// Core > draw-sprites: procedural people, props, ground, night wash
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const f = (c) => Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt));
  return `rgb(${f(r)}, ${f(g)}, ${f(b)})`;
}
function capsule(ctx, x, y, w, h) {
  const r = Math.min(w, h) / 2;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
function fillInk(ctx, fill, lw = 1.1) {
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = lw;
  ctx.stroke();
}
function ink(ctx, lw = 1) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = lw;
  ctx.stroke();
}
function rect(ctx, x, y, w, h, r = 2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}
const groundPatterns = new Map ();
function getGroundPattern(ctx, themeId) {
  const cached = groundPatterns.get(themeId);
  if (cached !== undefined) return cached;
  const theme = getTheme(themeId);
  const tile = document.createElement('canvas');
  tile.width = 200;
  tile.height = 200;
  const t = tile.getContext('2d');
  if (!t) return null;
  t.fillStyle = theme.ground.base;
  t.fillRect(0, 0, 200, 200);
  const grain = makeRng(20260104 + themeId.length * 7717);
  if (theme.ground.style === 'paving') {
    t.strokeStyle = theme.ground.line;
    t.globalAlpha = 0.35;
    t.lineWidth = 1;
    for (let i = 0; i <= 200; i += 50) {
      t.beginPath();
      t.moveTo(i + 0.5, 0);
      t.lineTo(i + 0.5, 200);
      t.moveTo(0, i + 0.5);
      t.lineTo(200, i + 0.5);
      t.stroke();
    }
    t.globalAlpha = 1;
    t.globalAlpha = 0.3;
    t.fillStyle = theme.ground.patch;
    for (let i = 0; i < 4; i++) {
      t.fillRect(Math.floor(grain() * 4) * 50 + 1, Math.floor(grain() * 4) * 50 + 1, 48, 48);
    }
    t.globalAlpha = 1;
  } else if (theme.ground.style === 'field') {
    t.globalAlpha = 0.45;
    t.fillStyle = theme.ground.patch;
    for (let i = 0; i < 30; i++) {
      t.beginPath();
      t.ellipse(grain() * 200, grain() * 200, 6 + grain() * 12, 4 + grain() * 8, grain() * 3, 0, Math.PI * 2);
      t.fill();
    }
    t.globalAlpha = 1;
    t.strokeStyle = theme.ground.line;
    t.globalAlpha = 0.3;
    t.lineWidth = 1;
    for (let i = 0; i < 260; i++) {
      const x = grain() * 200;
      const y = grain() * 200;
      t.beginPath();
      t.moveTo(x, y);
      t.lineTo(x + (grain() - 0.5) * 3, y - 3 - grain() * 3);
      t.stroke();
    }
    t.globalAlpha = 1;
  } else {
    t.fillStyle = theme.ground.patch;
    for (let i = 0; i < 10; i++) {
      t.beginPath();
      t.ellipse(grain() * 200, grain() * 200, 16 + grain() * 30, 8 + grain() * 14, grain() * 3, 0, Math.PI * 2);
      t.fill();
    }
    t.strokeStyle = theme.ground.line;
    t.globalAlpha = 0.5;
    t.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const x = grain() * 200;
      const y = grain() * 200;
      t.beginPath();
      t.ellipse(x, y, 10 + grain() * 22, 4 + grain() * 8, 0, 0, Math.PI * 2);
      t.stroke();
    }
    t.globalAlpha = 1;
  }
  for (let i = 0; i < 1800; i++) {
    const a = 0.03 + grain() * 0.05;
    t.fillStyle = grain() < 0.35 ? `rgba(255,255,255,${a})` : `rgba(30,24,16,${a})`;
    t.beginPath();
    t.arc(grain() * 200, grain() * 200, 0.5 + grain() * 0.8, 0, Math.PI * 2);
    t.fill();
  }
  const pattern = ctx.createPattern(tile, 'repeat');
  groundPatterns.set(themeId, pattern);
  return pattern;
}
function drawNightWash(
  ctx,
  lamps,
  vx, vy, vw, vh
) {
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(40, 44, 78, 0.42)';
  ctx.fillRect(vx, vy, vw, vh);
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const l of lamps) {
    if (l.x < vx - l.r || l.x > vx + vw + l.r || l.y < vy - l.r || l.y > vy + vh + l.r) continue;
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    g.addColorStop(0, 'rgba(255, 196, 110, 0.34)');
    g.addColorStop(0.5, 'rgba(255, 170, 80, 0.12)');
    g.addColorStop(1, 'rgba(255, 160, 70, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(l.x, l.y, l.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
function lampOf(pr) {
  if (pr.kind === 'nightStall') return { x: pr.x + pr.w / 2, y: pr.y + pr.h * 0.3, r: 150 };
  if (pr.kind === 'satay') return { x: pr.x + pr.w / 2, y: pr.y + pr.h * 0.4, r: 95 };
  if (pr.kind === 'lamppost') return { x: pr.x + pr.w / 2, y: pr.y + 8, r: 100 };
  if (pr.kind === 'stringlights') return { x: pr.x + pr.w / 2, y: pr.y + pr.h * 0.4, r: 110 };
  if (pr.kind === 'fruitcart') return { x: pr.x + pr.w / 2, y: pr.y + pr.h * 0.25, r: 80 };
  return null;
}
function drawRoad(ctx, r, themeId) {
  const theme = getTheme(themeId);
  ctx.save();
  if (r.kind === 'water') {
    ctx.fillStyle = theme.night ? '#2a3450' : '#6f93a8';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.4;
    for (let i = 0; i < 26; i++) {
      const y = r.y + ((i * 37) % r.h);
      const x = r.x + ((i * 211) % (r.w - 60));
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 14, y - 4, x + 30, y);
      ctx.stroke();
    }
    ctx.strokeStyle = '#7a6a44';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(r.x, r.y);
    ctx.lineTo(r.x + r.w, r.y);
    ctx.moveTo(r.x, r.y + r.h);
    ctx.lineTo(r.x + r.w, r.y + r.h);
    ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.fillStyle = theme.road.fill;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  const horizontal = r.w > r.h;
  if (r.kind === 'road') {
    ctx.strokeStyle = theme.road.edge;
    ctx.lineWidth = 4;
    ctx.beginPath();
    if (horizontal) {
      ctx.moveTo(r.x, r.y + 2);
      ctx.lineTo(r.x + r.w, r.y + 2);
      ctx.moveTo(r.x, r.y + r.h - 2);
      ctx.lineTo(r.x + r.w, r.y + r.h - 2);
    } else {
      ctx.moveTo(r.x + 2, r.y);
      ctx.lineTo(r.x + 2, r.y + r.h);
      ctx.moveTo(r.x + r.w - 2, r.y);
      ctx.lineTo(r.x + r.w - 2, r.y + r.h);
    }
    ctx.stroke();
    ctx.strokeStyle = '#d8c25a';
    ctx.lineWidth = 3;
    ctx.setLineDash([26, 22]);
    ctx.beginPath();
    if (horizontal) {
      ctx.moveTo(r.x, r.y + r.h / 2);
      ctx.lineTo(r.x + r.w, r.y + r.h / 2);
    } else {
      ctx.moveTo(r.x + r.w / 2, r.y);
      ctx.lineTo(r.x + r.w / 2, r.y + r.h);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (r.kind === 'path') {
    ctx.strokeStyle = theme.road.edge;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    if (horizontal) {
      for (const edge of [r.y, r.y + r.h]) {
        ctx.moveTo(r.x, edge);
        for (let x = r.x; x < r.x + r.w; x += 70) ctx.quadraticCurveTo(x + 35, edge + ((x / 70) % 2 ? 4 : -4), x + 70, edge);
      }
    } else {
      for (const edge of [r.x, r.x + r.w]) {
        ctx.moveTo(edge, r.y);
        for (let y = r.y; y < r.y + r.h; y += 70) ctx.quadraticCurveTo(edge + ((y / 70) % 2 ? 4 : -4), y + 35, edge, y + 70);
      }
    }
    ctx.stroke();
  } else {
    ctx.strokeStyle = theme.road.edge;
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
  }
  ctx.restore();
}
function contactShadow(ctx, pr) {
  ctx.fillStyle = 'rgba(45, 36, 24, 0.16)';
  ctx.beginPath();
  ctx.ellipse(pr.x + pr.w / 2, pr.y + pr.h - 2, pr.w * 0.46, Math.max(3, pr.h * 0.09), 0, 0, Math.PI * 2);
  ctx.fill();
}
function drawOccupant(ctx, cx, baseY, scale, seed) {
  const rng = makeRng(Math.floor(Math.abs(seed) * 7919) + 13);
  if (rng() < 0.42) return; // plenty of windows stay empty, or it reads as a doll's house
  const shirts = ['#2f6f9f', '#c9452f', '#3c8f5a', '#c9a227', '#8f5ea8', '#e2622b', '#2f9f8f'];
  const skin = SKIN[Math.floor(rng() * SKIN.length)];
  const hair = HAIR[Math.floor(rng() * HAIR.length)];
  const shirt = shirts[Math.floor(rng() * shirts.length)];
  const r = 3.4 * scale;
  ctx.beginPath();
  ctx.ellipse(cx, baseY, r * 1.5, r * 1.15, 0, Math.PI, Math.PI * 2);
  fillInk(ctx, shirt, 0.8);
  ctx.beginPath();
  ctx.arc(cx, baseY - r * 1.5, r, 0, Math.PI * 2);
  fillInk(ctx, skin, 0.8);
  ctx.beginPath();
  ctx.arc(cx, baseY - r * 1.62, r * 0.98, Math.PI * 1.08, Math.PI * 1.92);
  fillInk(ctx, hair, 0.7);
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(cx - r * 0.34, baseY - r * 1.45, r * 0.14, 0, Math.PI * 2);
  ctx.arc(cx + r * 0.34, baseY - r * 1.45, r * 0.14, 0, Math.PI * 2);
  ctx.fill();
}
function drawProp(ctx, pr, occupants = false) {
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  contactShadow(ctx, pr);
  const cx = pr.x + pr.w / 2;
  switch (pr.kind) {
    case 'shoplot': {
      const roofH = pr.h * 0.2;
      const bodyY = pr.y + roofH;
      rect(ctx, pr.x, bodyY, pr.w, pr.h - roofH, 2);
      fillInk(ctx, pr.tint, 1.3);
      const shutters = 3;
      const sw = pr.w / (shutters + 1);
      for (let i = 0; i < shutters; i++) {
        const x = pr.x + sw * 0.5 + i * sw;
        const winY = bodyY + pr.h * 0.1;
        const winH = pr.h * 0.26;
        rect(ctx, x, winY, sw * 0.62, winH, 1.5);
        fillInk(ctx, shade(pr.tint, -0.45), 1);
        ctx.save();
        rect(ctx, x, winY, sw * 0.62, winH, 1.5);
        ctx.clip();
        if (occupants) drawOccupant(ctx, x + sw * 0.31, winY + winH * 0.95, 1.1, pr.x + x + i * 31);
        ctx.restore();
        ctx.beginPath();
        for (let l = 1; l < 4; l++) {
          ctx.moveTo(x, winY + (winH / 4) * l);
          ctx.lineTo(x + sw * 0.62, winY + (winH / 4) * l);
        }
        ink(ctx, 0.7);
      }
      const archY = bodyY + pr.h * 0.46;
      const archH = pr.h - roofH - pr.h * 0.46;
      for (let i = 0; i < shutters; i++) {
        const x = pr.x + sw * 0.5 + i * sw;
        const aw = sw * 0.62;
        ctx.beginPath();
        ctx.moveTo(x, archY + archH);
        ctx.lineTo(x, archY + aw / 2);
        ctx.arc(x + aw / 2, archY + aw / 2, aw / 2, Math.PI, 0);
        ctx.lineTo(x + aw, archY + archH);
        ctx.closePath();
        fillInk(ctx, shade(pr.tint, -0.55), 1);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, archY, aw, archH);
        ctx.clip();
        if (occupants) drawOccupant(ctx, x + aw / 2, archY + archH - 1, 1.5, pr.y + x + i * 57);
        ctx.restore();
      }
      ctx.beginPath();
      ctx.moveTo(pr.x - 5, pr.y + roofH);
      ctx.lineTo(pr.x + 10, pr.y);
      ctx.lineTo(pr.x + pr.w - 10, pr.y);
      ctx.lineTo(pr.x + pr.w + 5, pr.y + roofH);
      ctx.closePath();
      fillInk(ctx, '#a8502f', 1.3);
      ctx.beginPath();
      for (let i = 1; i < 8; i++) {
        const fx = pr.x + (pr.w / 8) * i;
        ctx.moveTo(fx - 4, pr.y + roofH);
        ctx.lineTo(fx, pr.y);
      }
      ink(ctx, 0.7);
      break;
    }
    case 'tower': {
      rect(ctx, pr.x, pr.y, pr.w * 0.82, pr.h, 2);
      fillInk(ctx, pr.tint, 1.3);
      rect(ctx, pr.x + pr.w * 0.82, pr.y + pr.h * 0.05, pr.w * 0.18, pr.h * 0.95, 2);
      fillInk(ctx, shade(pr.tint, -0.3), 1.2);
      ctx.fillStyle = shade(pr.tint, -0.5);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 4; c++) {
          if ((r * 4 + c) % 5 === 0) continue; // a few lit/empty panes break the grid
          ctx.fillRect(pr.x + 7 + c * (pr.w * 0.17), pr.y + 10 + r * (pr.h * 0.095), pr.w * 0.12, pr.h * 0.055);
        }
      }
      ctx.beginPath();
      ctx.moveTo(cx - 6, pr.y);
      ctx.lineTo(cx - 6, pr.y - 16);
      ink(ctx, 1.2);
      break;
    }
    case 'cone': {
      ctx.beginPath();
      ctx.moveTo(cx, pr.y);
      ctx.lineTo(pr.x + pr.w * 0.9, pr.y + pr.h * 0.82);
      ctx.lineTo(pr.x + pr.w * 0.1, pr.y + pr.h * 0.82);

// Core > play-sound: WebAudio oscillator sfx, mute toggle
let audioCtx = null;
let master = null;
let sfxGain = null;
const MUTE_KEY = 'waldo_muted';
function isMuted() {
  try {
    return localStorage.getItem(MUTE_KEY) === '1';
  } catch {
    return false;
  }
}
function setMuted(muted) {
  try {
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
  } catch {
  }
  if (master) master.gain.value = muted ? 0 : 1;
}
function getCtx() {
  if (!audioCtx) {
    const Ctor = window.AudioContext || (window).webkitAudioContext;
    audioCtx = new Ctor();
    master = audioCtx.createGain();
    master.gain.value = isMuted() ? 0 : 1;
    master.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.55;
    sfxGain.connect(master);
  }
  return audioCtx;
}
function unlockAudio() {
  const c = getCtx();
  if (c.state === 'suspended') c.resume();
}
function tone(
  freq,
  start,
  dur,
  opts = {}
) {
  const dest = sfxGain;
  if (!audioCtx || !dest) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = opts.type ?? 'sine';
  osc.frequency.setValueAtTime(freq, start);
  if (opts.glideTo) osc.frequency.exponentialRampToValueAtTime(opts.glideTo, start + dur);
  const peak = opts.gain ?? 0.3;
  const attack = opts.attack ?? 0.01;
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(peak, start + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(g);
  g.connect(dest);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}
const sfx = {
  click() {
    const c = getCtx();
    tone(520, c.currentTime, 0.05, { type: 'triangle', gain: 0.18 });
  },
  correct() {
    const c = getCtx();
    const t = c.currentTime;
    tone(660, t, 0.1, { type: 'triangle', gain: 0.35 });
    tone(880, t + 0.08, 0.16, { type: 'triangle', gain: 0.35 });
    tone(1180, t + 0.16, 0.22, { type: 'triangle', gain: 0.3 });
  },
  wrong() {
    const c = getCtx();
    tone(180, c.currentTime, 0.22, { type: 'sawtooth', gain: 0.25, glideTo: 90 });
  },
  error() {
    const c = getCtx();
    tone(140, c.currentTime, 0.12, { type: 'square', gain: 0.2 });
  },
  tick(urgent = false) {
    const c = getCtx();
    tone(urgent ? 1000 : 760, c.currentTime, 0.06, { type: 'sine', gain: urgent ? 0.3 : 0.15 });
  },
  roundStart() {
    const c = getCtx();
    const t = c.currentTime;
    [523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * 0.07, 0.18, { type: 'triangle', gain: 0.3 }));
  },
  roundEnd(reason = 'time') {
    const c = getCtx();
    const t = c.currentTime;
    if (reason === 'voided') {
      tone(200, t, 0.3, { type: 'sawtooth', gain: 0.2, glideTo: 120 });
      return;
    }
    const notes = reason === 'win' ? [784, 988, 1174, 1568] : [784, 659, 523];
    notes.forEach((f, i) => tone(f, t + i * 0.1, 0.3, { type: 'triangle', gain: 0.3 }));
  }
};

  reveal: null, reason: null, feed: [], cooldownUntil: 0, freeLeft: WRONG_GRACE, nextAt: 0, final: false, lastTick: -1,
};
const me = () => lobby.room?.me;
const myView = () => ui.view?.players.find((p) => p.id === me());
const panning = () => ui.inMatch && ui.view?.panning !== false;

// Net: the relay server runs the rounds (waldo-rounds.js); every tab, lobby host too, sends its clicks and hide spot and renders the round messages
const toServer = (data) => lobby.room?.send(data, { to: SERVER_PEER });
function onData(d, from) {
  if (!d || d._lobby) return;
  if (d.g === 'm' && serverMatch.fromServer(from)) onMsg(d.m);
}
const act = (t, x, y) => toServer({ g: 'c', t, x, y });

// Game > messages: every tab (host too) renders from these
function onMsg(m) {
  if (!ui.inMatch) return;
  switch (m.t) {
    case 'view':
      ui.view = m.v;
      if (m.v.phase === 'roundEnd') ui.nextAt = Date.now() + m.v.nextIn;
      break;
    case 'error':
      sfx.error();
      toast(m.text);
      break;
    case 'placePrompt':
      Object.assign(ui, { place: { seed: m.seed, theme: m.theme, decoyRatio: m.decoy, density: m.density }, round: null, waitingFor: null, reveal: null, reason: null, final: false });
      setScene(generateScene(ui.place, false));
      break;
    case 'waiting':
      Object.assign(ui, { waitingFor: m.nick, place: null, round: null, reveal: null, reason: null, final: false });
      setScene(null);
      break;
    case 'roundStart': {
      // hello catch-up can repeat the round already on screen: keep its feed + cooldown
      if (ui.round?.seed === m.seed && ui.round.n === m.round) break;
      sfx.roundStart();
      const params = { seed: m.seed, theme: m.theme, decoyRatio: m.decoy, density: m.density };
      const base = generateScene(params, m.targetAt === null);
      Object.assign(ui, { round: { ...params, endsAt: Date.now() + m.endsIn, n: m.round }, place: null, waitingFor: null, reveal: null, reason: null, cooldownUntil: 0, freeLeft: WRONG_GRACE, feed: [], final: false, lastTick: -1 });
      setScene(m.targetAt ? stampTarget(base, m.targetAt.x, m.targetAt.y) : base);
      break;
    }
    case 'found':
      sfx[m.id === me() ? 'correct' : 'click']();
      ui.feed = [`${m.nick} found Waldo (+${m.score}) ${m.n}/${m.of}`, ...ui.feed].slice(0, 6);
      break;
    case 'wrong':
      sfx.wrong();
      ui.cooldownUntil = Date.now() + m.cooldownMs;
      ui.freeLeft = m.freeLeft;
      break;
    case 'roundEnd':
      sfx.roundEnd(m.reason === 'voided' ? 'voided' : m.reason === 'allFound' ? 'win' : 'time');
      ui.reveal = m.target;
      ui.reason = m.reason === 'voided' ? 'Round voided — the hider or host dropped.' : m.reason === 'allFound' ? 'Everyone found him.' : 'Time!';
      ui.place = null;
      ui.waitingFor = null;
      if (ui.round) ui.round.endsAt = Date.now();
      break;
    case 'gameEnd':
      ui.final = true;
      ui.round = null;
      break;
  }
  renderSide();
}

// Game > Scene: swap crowd, recenter camera, repaint minimap + target card
const cam = { x: (WORLD_W - VIEW_W) / 2, y: (WORLD_H - VIEW_H) / 2 };
function setScene(sc) {
  ui.scene = sc;
  Object.assign(cam, { x: (WORLD_W - VIEW_W) / 2, y: (WORLD_H - VIEW_H) / 2 });
  if (sc) paintMini(sc);
  drawCard(sc?.look ?? WALDO);
}
// Game > Scene > minimap: dot per person + prop blocks; never shows target
function paintMini(sc) {
  const mini = $('miniCanvas'), c = mini.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio || 1);
  mini.width = 140 * dpr;
  mini.height = 100 * dpr;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#1a1d25';
  c.fillRect(0, 0, 140, 100);
  const sx = 140 / WORLD_W, sy = 100 / WORLD_H;
  c.fillStyle = 'rgba(120,130,150,0.45)';
  for (const pr of sc.props) c.fillRect(pr.x * sx, pr.y * sy, Math.max(1, pr.w * sx), Math.max(1, pr.h * sy));
  c.fillStyle = 'rgba(232,230,224,0.75)';
  for (const p of sc.people) if (!p.isTarget) c.fillRect(p.x * sx, p.y * sy, 1.2, 1.2);
}
// Side > Target card: this round's Waldo outfit + plain description
function drawCard(look) {
  const card = $('card'), c = card.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio || 1);
  card.width = 70 * dpr;
  card.height = 110 * dpr;
  const base = { x: 35, y: 55, skin: WALDO.skin, hair: WALDO.hair, torsoA: '#000', torsoB: '#000', legs: WALDO.legs, hat: 'none', hatA: '#000', hatB: '#000', accessory: 'none', flip: false, isTarget: false };
  c.setTransform(dpr * 1.7, 0, 0, dpr * 1.7, 0, 8 * dpr);
  drawPerson(c, makeTargetLook(base, look), 21, 28);
  $('cardText').textContent = `${look.name} stripes, matching ${HAT_WORDS[look.hat] ?? 'hat'}, ${ACC_WORDS[look.accessory] ?? 'no extras'}. Lookalikes copy one — never both.`;
}

// Game > Scene > canvas: letterboxed fixed view when panning, whole world otherwise
const cv = $('scene'), g = cv.getContext('2d'), wrap = $('wrap');
const viewSize = () => (panning() ? [VIEW_W, VIEW_H] : [WORLD_W, WORLD_H]);
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.floor(wrap.clientWidth * dpr);
  cv.height = Math.floor(wrap.clientHeight * dpr);
  cv.style.width = `${wrap.clientWidth}px`;
  cv.style.height = `${wrap.clientHeight}px`;
}
new ResizeObserver(resize).observe(wrap);
resize();
function toWorld(cx, cy) {
  const rect = cv.getBoundingClientRect(), [vw, vh] = viewSize();
  const scale = Math.min(rect.width / vw, rect.height / vh);
  const vx = (cx - rect.left - (rect.width - vw * scale) / 2) / scale;
  const vy = (cy - rect.top - (rect.height - vh * scale) / 2) / scale;
  if (vx < 0 || vy < 0 || vx > vw || vy > vh) return null;
  return panning() ? { x: cam.x + vx, y: cam.y + vy } : { x: vx, y: vy };
}
let last = performance.now(), hudAt = 0, cursor = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const pan = panning(), [vw, vh] = viewSize(), sc = ui.scene;
  if (!pan) Object.assign(cam, { x: 0, y: 0 });
  else {
    const dx = (keys.has('arrowright') || keys.has('d')) - (keys.has('arrowleft') || keys.has('a'));
    const dy = (keys.has('arrowdown') || keys.has('s')) - (keys.has('arrowup') || keys.has('w'));
    if (dx || dy) Object.assign(cam, clampCamera(cam.x + dx * KEY_PAN_SPEED * dt, cam.y + dy * KEY_PAN_SPEED * dt));
  }
  const dpr = cv.width / Math.max(1, wrap.clientWidth), cssW = cv.width / dpr, cssH = cv.height / dpr;
  const scale = Math.min(cssW / vw, cssH / vh), offX = (cssW - vw * scale) / 2, offY = (cssH - vh * scale) / 2;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0d0f14';
  g.fillRect(0, 0, cssW, cssH);
  if (sc) {
    g.save();
    g.translate(offX, offY);
    g.beginPath();
    g.rect(0, 0, vw * scale, vh * scale);
    g.clip();
    g.scale(scale, scale);
    g.translate(-cam.x, -cam.y);
    const theme = getTheme(sc.theme);
    g.fillStyle = theme.ground.base;
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    const pattern = getGroundPattern(g, sc.theme);
    if (pattern) { g.fillStyle = pattern; g.fillRect(0, 0, WORLD_W, WORLD_H); }
    // vignette: world gets a centre, edges feel like edges
    const vg = g.createRadialGradient(WORLD_W / 2, WORLD_H / 2, Math.min(WORLD_W, WORLD_H) * 0.25, WORLD_W / 2, WORLD_H / 2, Math.max(WORLD_W, WORLD_H) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, theme.night ? 'rgba(10,8,20,0.3)' : 'rgba(60,46,28,0.16)');
    g.fillStyle = vg;
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    const x0 = cam.x - 80, x1 = cam.x + vw + 80, y0 = cam.y - 120, y1 = cam.y + vh + 120;
    const occupants = ui.inMatch && ui.view?.difficulty === 'hard';
    for (const r of sc.roads) if (!(r.x + r.w < x0 || r.x > x1 || r.y + r.h < y0 || r.y > y1)) drawRoad(g, r, sc.theme);
    for (const pr of sc.props) if (!(pr.x + pr.w < x0 || pr.x > x1 || pr.y + pr.h < y0 || pr.y > y1)) drawProp(g, pr, occupants);
    for (const p of sc.people) {
      if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
      if (ui.place && p.isTarget) continue;
      drawPerson(g, p, p.x, p.y);
    }
    // hider ghost: same makeTargetLook as card + final stamp, so all three match
    if (ui.place && cursor && sc.people[0]) {
      g.globalAlpha = 0.75;
      drawPerson(g, makeTargetLook(sc.people[0], sc.look), cursor.x, cursor.y);
      g.globalAlpha = 1;
    }
    // night: darken after crowd so people + props tint together, warm pools under bulbs
    if (theme.night) drawNightWash(g, sc.props.map(lampOf).filter(Boolean), cam.x, cam.y, vw, vh);
    if (ui.reveal) {
      g.strokeStyle = '#ffd34d';
      g.lineWidth = 3;
      g.beginPath();
      g.arc(ui.reveal.x, ui.reveal.y, 36, 0, Math.PI * 2);
      g.stroke();
    }
    g.restore();
  }
  if (now - hudAt > 100) { hudAt = now; tickHud(); }
  requestAnimationFrame(frame);
}

// Game > Scene > input: drag / WASD / arrows pan, short press picks
const keys = new Set();
const drag = { active: false, moved: 0, lastX: 0, lastY: 0 };
let pointer = null;
addEventListener('keydown', (e) => {
  if (!ui.inMatch || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  keys.add(e.key.toLowerCase());
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', (e) => {
  Object.assign(drag, { active: true, moved: 0, lastX: e.clientX, lastY: e.clientY });
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  cursor = toWorld(e.clientX, e.clientY);
  const box = wrap.getBoundingClientRect();
  pointer = { x: e.clientX - box.left, y: e.clientY - box.top };
  if (!panning() || !drag.active) return;
  const dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  Object.assign(drag, { lastX: e.clientX, lastY: e.clientY });
  const rect = cv.getBoundingClientRect(), [vw, vh] = viewSize();
  const scale = Math.min(rect.width / vw, rect.height / vh);
  Object.assign(cam, clampCamera(cam.x - dx / scale, cam.y - dy / scale));
});
cv.addEventListener('pointerleave', () => { cursor = null; pointer = null; });
cv.addEventListener('pointerup', (e) => {
  const wasDrag = drag.moved > DRAG_SLOP;
  drag.active = false;
  if (wasDrag || !canPick()) return;
  const w = toWorld(e.clientX, e.clientY);
  if (w) pickAt(Math.round(w.x), Math.round(w.y));
});
function canPick() {
  if (!ui.inMatch) return false;
  if (ui.place) return true;
  const mine = myView();
  return !!ui.round && !ui.reveal && ui.view?.phase === 'playing' && !mine?.hiding && !mine?.found && ui.cooldownUntil <= Date.now();
}
function pickAt(x, y) {
  sfx.click();
  if (ui.place && ui.scene) {
    // check locally first so a bad spot answers instantly
    const check = validatePlacement(ui.scene, x, y, { w: WORLD_W, h: WORLD_H });
    if (!check.ok) { sfx.error(); toast(check.reason ?? 'Invalid spot.'); return; }
    act('place', x, y);
    return;
  }
  act('click', x, y);
}

// HUD > round clock: wedge = time left, hand = backwards second hand
function clockSvg(remaining) {
  const S = 30, R = 15, F = 13, left = Math.max(0, Math.min(1, remaining / ROUND_MS)), sec = remaining / 1000;
  const urgent = remaining < 15000, col = urgent ? 'var(--warn)' : 'var(--dim)';
  const pt = (t, r) => { const a = t * Math.PI * 2 - Math.PI / 2; return [R + Math.cos(a) * r, R + Math.sin(a) * r]; };
  const [ex, ey] = pt(left, F - 2);
  const wedge = left >= 0.999 ? `M ${R} ${R - (F - 2)} A ${F - 2} ${F - 2} 0 1 1 ${R - 0.01} ${R - (F - 2)} Z` : `M ${R} ${R} L ${R} ${R - (F - 2)} A ${F - 2} ${F - 2} 0 ${left > 0.5 ? 1 : 0} 1 ${ex} ${ey} Z`;
  const [hx, hy] = pt((sec % 60) / 60, F - 3.5);
  const ticks = [0, 0.25, 0.5, 0.75].map((t) => { const [a, b] = pt(t, F - 1.5), [c, d] = pt(t, F - 3.5); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="1"/>`; }).join('');
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="timer" aria-label="${sec.toFixed(0)} seconds left"><circle cx="${R}" cy="${R}" r="${F}" fill="rgba(255,255,255,0.04)" stroke="${col}" stroke-width="1.2"/><path d="${wedge}" fill="${urgent ? 'rgba(224,96,72,0.35)' : 'rgba(220,214,196,0.18)'}"/>${ticks}<line x1="${R}" y1="${R}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="1.4" stroke-linecap="round"/><circle cx="${R}" cy="${R}" r="1.4" fill="${col}"/></svg>`;
}
// HUD > 10 Hz: clock, countdown ticks, cooldown pill, minimap rect, next-round countdown
function tickHud() {
  const now = Date.now();
  const r = ui.round, live = r && !ui.reveal;
  $('clock').innerHTML = r ? clockSvg(Math.max(0, r.endsAt - now)) : '';
  if (live) {
    const left = Math.ceil(Math.max(0, r.endsAt - now) / 1000);
    if (left <= 10 && left >= 1 && left !== ui.lastTick) { ui.lastTick = left; sfx.tick(left <= 3); }
  }
  const cool = $('cool'), cooling = ui.cooldownUntil > now;
  cool.style.display = cooling && pointer ? 'block' : 'none';
  if (cooling && pointer) { cool.style.left = `${pointer.x}px`; cool.style.top = `${pointer.y}px`; cool.textContent = `${((ui.cooldownUntil - now) / 1000).toFixed(1)}s`; }
  const showMini = panning() && !!ui.scene;
  $('mini').style.display = showMini ? 'block' : 'none';
  if (showMini) Object.assign($('miniView').style, { left: `${(cam.x / WORLD_W) * 100}%`, top: `${(cam.y / WORLD_H) * 100}%`, width: `${(VIEW_W / WORLD_W) * 100}%`, height: `${(VIEW_H / WORLD_H) * 100}%` });
  if (ui.reason) $('nextIn').textContent = ui.view?.phase === 'roundEnd' ? `Next in ${Math.ceil(Math.max(0, ui.nextAt - now) / 1000)}s` : '';
  cv.style.cursor = ui.place ? 'crosshair' : canPick() ? 'pointer' : '';
}

// Side + HUD > render: pills, scores, hint, round end, feed, final standings
function renderSide() {
  const v = ui.view, mine = myView(), host = !!lobby.room?.isHost;
  const inMatch = ui.inMatch;
  $('code').textContent = lobby.room?.code ?? '';
  $('code').style.display = inMatch ? '' : 'none';
  $('roundPill').style.display = $('modePill').style.display = inMatch && v ? '' : 'none';
  if (v) {
    $('roundPill').textContent = `Round ${Math.min(v.round, v.totalRounds)}/${v.totalRounds}`;
    $('modePill').textContent = v.mode === 'race' ? 'Race' : 'Hide & seek';
  }
  const theme = ui.round?.theme ?? ui.place?.theme ?? (inMatch ? null : ui.scene?.theme);
  $('mapPill').style.display = theme ? '' : 'none';
  if (theme) $('mapPill').textContent = getTheme(theme).name;
  $('lobbyBtn').style.display = inMatch && host ? '' : 'none';
  $('scores').innerHTML = inMatch && v ? v.players.map((p) => `<span class="score${p.found ? ' found' : ''}${p.hiding ? ' hiding' : ''}${p.connected ? '' : ' gone'}${p.id === me() ? ' me' : ''}">${esc(p.nick)} ${p.score}${p.hiding ? ' 🙈' : ''}${p.found ? ' ✓' : ''}</span>`).join('') : '';
  let hint = 'Spot Waldo in a seeded crowd of lookalikes. Create or join a room to play.';
  if (inMatch) {
    if (ui.place) hint = 'You are the hider. Click a spot in the crowd. Edges, empty ground and behind-scenery spots are rejected — and you score nothing if nobody finds you.';
    else if (ui.waitingFor) hint = `${ui.waitingFor} is hiding Waldo…`;
    else if (!ui.round) hint = 'Joining the round…';
    else if (ui.reveal || ui.reason) hint = ui.reveal ? 'Waldo is ringed in yellow.' : '';
    else if (mine?.hiding) hint = 'Sit tight. You score more the longer they take.';
    else if (mine?.found) hint = 'Found. Waiting for the rest.';
    else hint = `${panning() ? 'Drag or use WASD / arrows to pan. ' : 'Whole map is on screen. '}First ${WRONG_GRACE} wrong clicks are free (${ui.freeLeft} left); after that each costs 2 seconds.`;
  }
  $('hint').textContent = hint;
  const mid = $('mid');
  const midText = inMatch && !ui.scene && !ui.final ? (ui.waitingFor ? `${ui.waitingFor} is hiding Waldo…` : 'Loading round…') : '';
  mid.textContent = midText;
  mid.style.display = midText ? 'grid' : 'none';
  $('roundEnd').style.display = inMatch && ui.reason && !ui.final ? 'block' : 'none';
  $('reason').textContent = ui.reason ?? '';
  $('nextBtn').style.display = host ? '' : 'none';
  $('nextBtn').textContent = v && v.round >= v.totalRounds ? 'Final results' : 'Next round';
  $('feed').innerHTML = inMatch ? ui.feed.map((l) => `<li>${esc(l)}</li>`).join('') : '';
  $('final').style.display = inMatch && ui.final ? 'grid' : 'none';
  if (ui.final && v) {
    $('standings').innerHTML = v.players.map((p, i) => `<li class="${i === 0 ? 'win' : ''}"><span>${esc(p.nick)}</span><b>${p.score}</b></li>`).join('');
    $('finalBtns').style.display = host ? 'flex' : 'none';
    $('finalWait').style.display = host ? 'none' : '';
  }
}
let toastT = 0;
function toast(text) {
  $('err').textContent = text;
  clearTimeout(toastT);
  toastT = setTimeout(() => ($('err').textContent = ''), 3000);
}

// HUD > buttons: mute, lobby, next round, final screen
const syncMute = () => ($('mute').textContent = isMuted() ? '🔇' : '🔊');
$('mute').onclick = () => { setMuted(!isMuted()); syncMute(); };
$('lobbyBtn').onclick = () => lobby.backToLobby();
$('nextBtn').onclick = () => { if (lobby.room?.isHost) toServer({ g: 'next' }); };
$('again').onclick = () => lobby.restart();
$('toLobby').onclick = () => lobby.backToLobby();
// browsers keep audio locked until first gesture
addEventListener('pointerdown', () => unlockAudio(), { once: true });

// Game > attract: random demo crowd behind lobby overlay
function attract() {
  Object.assign(ui, { inMatch: false, view: null, round: null, place: null, waitingFor: null, reveal: null, reason: null, feed: [], final: false });
  setScene(generateScene({ seed: 1 + Math.floor(Math.random() * 1e9), theme: THEME_IDS[Math.floor(Math.random() * THEME_IDS.length)], decoyRatio: 0.15, density: 480 }, true));
  renderSide();
}

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'waldo-hunt', title: 'Waldo Hunt', emoji: '🔎', accent: '#e8413c',
  blurb: 'Where’s Waldo, online. Race the room to spot him in a seeded crowd of lookalikes, or take turns hiding him for everyone else.',
  maxBots: 13, defaultBots: 0, minPlayers: 1,
  note: 'Up to 14 per room (humans + bots). Race: best of 5, decoys ramp each round. Hide & seek: everyone hides once; a bot fills in if you are alone.',
  settings: [
    { key: 'mode', label: 'Mode', options: [['race', 'Race (best of 5)'], ['hide', 'Hide & seek']], value: 'race' },
    { key: 'difficulty', label: 'Difficulty', options: [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']], value: 'normal' },
    { key: 'map', label: 'Map', options: [['random', 'Tour (new map each round)'], ...THEME_IDS.map((id) => [id, THEMES[id].name])], value: 'random' },
    { key: 'panning', label: 'View', options: [['on', 'Pan a big world'], ['off', 'Whole map on screen']], value: 'on' },
  ],
  onJoin(room) {
    room.on('data', onData);
    room.on('host', renderSide);
  },
  onStart({ bots, settings }) {
    Object.assign(ui, { inMatch: true, view: null, round: null, place: null, waitingFor: null, reveal: null, reason: null, feed: [], final: false });
    setScene(null);
    renderSide();
    serverMatch.start({ bots, settings });
    // a late joiner or a tab that starts after the round began gets the current round replayed
    toServer({ g: 'hello' });
  },
  onLobby() { serverMatch.stop(); attract(); },
});
const serverMatch = createServerMatchClient(lobby);

syncMute();
attract();
requestAnimationFrame(frame);
</script>
</body>
</html>
