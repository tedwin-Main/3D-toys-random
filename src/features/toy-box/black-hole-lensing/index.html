<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Hole</title>
<style>
  :root { --ink: #f2ece4; --card: rgba(10, 8, 6, 0.55); --accent: #ffb054; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; user-select: none; }
  #intro { top: 16px; left: 16px; padding: 12px 16px; max-width: 290px; }
  #intro h1 { margin: 0 0 4px; font-size: 17px; letter-spacing: 0.02em; }
  #intro p { margin: 0; font-size: 12.5px; line-height: 1.55; opacity: 0.72; }
  #panel { top: 16px; right: 16px; width: 230px; padding: 12px 14px; display: grid; gap: 9px; }
  #panel h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.5; }
  #panel label { font-size: 12px; display: grid; gap: 2px; opacity: 0.9; }
  #panel input { width: 100%; accent-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #panel button { font: inherit; font-size: 12px; font-weight: 600; color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 0; padding: 7px 6px; border-radius: 9px; cursor: pointer; }
  #panel button:hover { background: rgba(255, 255, 255, 0.14); }
  #panel button.on { background: var(--accent); color: #1a0f04; }
  @media (max-width: 640px) { #intro { display: none; } #panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; } }
</style>
</head>
<body>
<div id="intro" class="card"><h1>Black Hole</h1><p>Every pixel is a light ray bent by Schwarzschild gravity. The far side of the accretion disk is lensed over the top, a thin photon ring hugs the shadow, and the approaching side glows hotter from Doppler beaming. Drag to orbit, scroll to fall in.</p></div>
<div id="panel" class="card">
  <h3>Look</h3>
  <div class="row"><button id="p-film" class="on">Film</button><button id="p-real">Realistic</button></div>
  <div class="row"><button id="v-edge">Edge-on</button><button id="v-top">Top-down</button></div>
  <h3>Physics</h3>
  <div class="row"><button id="t-lens" class="on">Lensing</button><button id="t-dop">Doppler</button></div>
  <label>Disk heat <input id="temp" type="range" min="0" max="100" value="45" /></label>
  <label>Disk brightness <input id="bright" type="range" min="0" max="100" value="55" /></label>
  <label>Disk size <input id="outer" type="range" min="0" max="100" value="45" /></label>
  <label>Spin speed <input id="spin" type="range" min="0" max="100" value="35" /></label>
  <div class="row"><button id="auto" class="on">Auto-orbit</button><button id="quality">Quality: Hi</button></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
/**
 * FILE: 3d-toys/black-hole-lensing/index.html
 * PURPOSE: full-screen raymarched Schwarzschild black hole: bent photon paths, volumetric-ish accretion disk with Doppler + gravitational shift, star field, bloom
 * UI: Black Hole page
 * USED BY: 3d-toys/index.html (iframe viewer)
 * KEY EXPORTS: none (standalone page)
 */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Scene > Renderer: one full-screen triangle pair, everything happens in the fragment shader
let pixelRatio = Math.min(devicePixelRatio, 1.5);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const U = {
  uRes: { value: new THREE.Vector2() },
  uTime: { value: 0 },
  uCamPos: { value: new THREE.Vector3() },
  uRight: { value: new THREE.Vector3() }, uUp: { value: new THREE.Vector3() }, uFwd: { value: new THREE.Vector3() },
  uFov: { value: 0.75 },
  uLens: { value: 1 }, uDoppler: { value: 0 },
  uTemp: { value: 1 }, uBright: { value: 1 }, uOuter: { value: 13 },
  uFilm: { value: 1 },
};
const mat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: /* glsl */ `
    precision highp float;
    uniform vec2 uRes; uniform float uTime, uFov, uLens, uDoppler, uTemp, uBright, uOuter, uFilm;
    uniform vec3 uCamPos, uRight, uUp, uFwd;

    float hash31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
    float hash21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
    float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(hash21(i), hash21(i+vec2(1,0)), f.x), mix(hash21(i+vec2(0,1)), hash21(i+vec2(1,1)), f.x), f.y); }
    float fbm(vec2 p){ float s = 0., a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }
    float vnoise3(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      float n000 = hash31(i), n100 = hash31(i+vec3(1,0,0)), n010 = hash31(i+vec3(0,1,0)), n110 = hash31(i+vec3(1,1,0));
      float n001 = hash31(i+vec3(0,0,1)), n101 = hash31(i+vec3(1,0,1)), n011 = hash31(i+vec3(0,1,1)), n111 = hash31(i+vec3(1,1,1));
      return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y), mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z); }

    // blackbody-ish ramp: deep red, orange, white, faint blue at the very hot end
    vec3 heat(float t){
      vec3 c = vec3(smoothstep(0.05, 0.55, t), smoothstep(0.3, 1.05, t), smoothstep(0.6, 1.7, t));
      c.r *= 1. - 0.2 * smoothstep(1.6, 3., t);
      return c * (0.15 + t * t);
    }

    vec3 stars(vec3 d){
      vec3 col = vec3(0.);
      for (int L = 0; L < 3; L++){
        float sc = 90. + float(L) * 110.;
        vec3 q = d * sc, id = floor(q), f = fract(q) - 0.5;
        float h = hash31(id + float(L) * 7.);
        if (h > 0.985){
          vec3 off = vec3(hash31(id + 1.3), hash31(id + 2.7), hash31(id + 4.1)) - 0.5;
          float dd = length(f - off * 0.6);
          float b = smoothstep(0.12, 0.0, dd) * (h - 0.985) / 0.015;
          vec3 tint = mix(vec3(1., 0.8, 0.6), vec3(0.7, 0.85, 1.), hash31(id + 9.));
          col += tint * b * 1.6;
        }
      }
      float neb = pow(vnoise3(d * 2.5) * 0.6 + vnoise3(d * 6.) * 0.4, 3.);
      col += vec3(0.25, 0.12, 0.35) * neb * 0.35 + vec3(0.05, 0.1, 0.2) * pow(vnoise3(d * 1.3 + 3.), 2.) * 0.3;
      return col;
    }

    // disk hit at point p (in plane y=0); dir = photon travel direction from camera
    vec4 disk(vec3 p, vec3 dir){
      float r = length(p.xz);
      float rin = 3.0;
      if (r < rin * 0.92 || r > uOuter) return vec4(0.);
      float ang = atan(p.z, p.x);
      // Keplerian differential rotation shears the turbulence into spiral streaks
      float a2 = ang - uTime * pow(r, -1.5) * 3.;
      vec2 q = vec2(cos(a2), sin(a2)) * r;
      float n = fbm(q * 0.9 + vec2(r * 0.6)) * 0.65 + fbm(q * 2.6) * 0.35;
      float rings = 0.86 + 0.14 * sin(r * 5. + n * 9.);
      float dens = smoothstep(rin * 0.92, rin * 1.2, r) * smoothstep(uOuter, uOuter * 0.55, r) * (0.35 + 0.9 * n) * rings;
      // Novikov-Thorne-ish falloff
      float T = uTemp * pow(r / rin, -0.75) * pow(max(1. - sqrt(rin / r), 0.02), 0.25) * 2.2;
      vec3 vdir = normalize(vec3(-p.z, 0., p.x));
      float beta = min(sqrt(0.5 / max(r - 1., 0.3)), 0.75);
      float cosT = dot(vdir, -normalize(dir));
      float D = 1. / (inversesqrt(1. - beta * beta) * (1. - beta * cosT));
      float g = sqrt(max(1. - 1. / r, 0.01));
      float shift = mix(1., D * g, uDoppler);
      float I = pow(shift, mix(0., 4., uDoppler));
      vec3 c = heat(T * shift) * I * uBright * 2.4;
      // film look: warmer, flatter, no beaming asymmetry
      c = mix(c, heat(T * 0.9) * vec3(1.0, 0.82, 0.62) * uBright * 2.6, uFilm);
      float a = clamp(dens * 1.15, 0., 0.97);
      return vec4(c * dens * 0.32, a);
    }

    void main(){
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      vec3 dir = normalize(uFwd + (uRight * uv.x + uUp * uv.y) * uFov);
      vec3 pos = uCamPos;
      vec3 hv = cross(pos, dir);
      float h2 = dot(hv, hv);
      vec3 col = vec3(0.);
      float tr = 1.;
      bool captured = false;
      for (int i = 0; i < 360; i++){
        float r = length(pos);
        if (r < 1.0){ captured = true; break; }
        float dt = clamp(0.07 * (r - 0.9) * (r - 0.9), 0.012, 1.4);
        // null geodesic in Schwarzschild (rs = 1): a = -1.5 h^2 x / r^5
        vec3 acc = -1.5 * h2 * pos / pow(r, 5.) * uLens;
        vec3 v2 = dir + acc * dt;
        vec3 np = pos + v2 * dt;
        if (pos.y * np.y < 0.){
          float t = pos.y / (pos.y - np.y);
          vec4 d = disk(mix(pos, np, t), v2);
          col += tr * d.rgb;
          tr *= 1. - d.a;
          if (tr < 0.02) break;
        }
        pos = np; dir = normalize(v2);
        if (r > 80. && dot(pos, dir) > 0.) break;
      }
      if (!captured) col += tr * stars(dir);
      // faint lensed glow around the shadow edge
      gl_FragColor = vec4(col, 1.);
    }`,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.55, 0.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Camera > Orbit: yaw/pitch/distance driven by drag + wheel, eased
const orbit = { yaw: 0.6, pitch: 0.12, dist: 28, tYaw: 0.6, tPitch: 0.12, tDist: 28, auto: true };
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!drag) return;
  orbit.tYaw -= (e.clientX - drag[0]) * 0.005;
  orbit.tPitch = THREE.MathUtils.clamp(orbit.tPitch + (e.clientY - drag[1]) * 0.004, -1.45, 1.45);
  drag = [e.clientX, e.clientY];
});
addEventListener('pointerup', () => (drag = null));
renderer.domElement.addEventListener('wheel', (e) => { e.preventDefault(); orbit.tDist = THREE.MathUtils.clamp(orbit.tDist * Math.exp(e.deltaY * 0.001), 5, 70); }, { passive: false });

// HUD > Panel wiring
const $ = (id) => document.getElementById(id);
function toggle(id, on) { $(id).classList.toggle('on', on); }
let lens = 1, dop = 0, film = 1;
$('p-film').onclick = () => { film = 1; dop = 0; toggle('p-film', true); toggle('p-real', false); toggle('t-dop', false); };
$('p-real').onclick = () => { film = 0; dop = 1; toggle('p-film', false); toggle('p-real', true); toggle('t-dop', true); };
$('t-lens').onclick = () => { lens = lens ? 0 : 1; toggle('t-lens', !!lens); };
$('t-dop').onclick = () => { dop = dop ? 0 : 1; if (dop) { film = 0; toggle('p-film', false); toggle('p-real', true); } toggle('t-dop', !!dop); };
$('v-edge').onclick = () => { orbit.tPitch = 0.03; orbit.tDist = 26; };
$('v-top').onclick = () => { orbit.tPitch = 1.35; orbit.tDist = 30; };
$('auto').onclick = () => { orbit.auto = !orbit.auto; toggle('auto', orbit.auto); };
$('quality').onclick = (e) => {
  const hi = pixelRatio > 0.8;
  pixelRatio = hi ? 0.6 : Math.min(devicePixelRatio, 1.5);
  e.currentTarget.textContent = `Quality: ${hi ? 'Lo' : 'Hi'}`;
  renderer.setPixelRatio(pixelRatio);
  composer.setPixelRatio(pixelRatio);
  resize();
};
const sl = (id) => Number($(id).value) / 100;

// Run engine: ease camera, push uniforms, render through bloom
const clock = new THREE.Clock();
const lensEase = { v: 1 }, dopEase = { v: 0 }, filmEase = { v: 1 };
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (orbit.auto && !drag) orbit.tYaw += dt * 0.05;
  const k = 1 - Math.exp(-dt * 4);
  orbit.yaw += (orbit.tYaw - orbit.yaw) * k;
  orbit.pitch += (orbit.tPitch - orbit.pitch) * k;
  orbit.dist += (orbit.tDist - orbit.dist) * k;
  const cp = Math.cos(orbit.pitch);
  const pos = new THREE.Vector3(Math.sin(orbit.yaw) * cp, Math.sin(orbit.pitch), Math.cos(orbit.yaw) * cp).multiplyScalar(orbit.dist);
  const fwd = pos.clone().negate().normalize();
  const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd);
  // slight roll like the film shot
  const roll = 0.1 * (1 - Math.abs(orbit.pitch));
  right.applyAxisAngle(fwd, roll); up.applyAxisAngle(fwd, roll);
  U.uCamPos.value.copy(pos); U.uFwd.value.copy(fwd); U.uRight.value.copy(right); U.uUp.value.copy(up);
  lensEase.v += (lens - lensEase.v) * k; dopEase.v += (dop - dopEase.v) * k; filmEase.v += (film - filmEase.v) * k;
  U.uLens.value = lensEase.v; U.uDoppler.value = dopEase.v; U.uFilm.value = filmEase.v;
  U.uTemp.value = 0.45 + sl('temp') * 1.3;
  U.uBright.value = 0.25 + sl('bright') * 1.6;
  U.uOuter.value = 7 + sl('outer') * 16;
  U.uTime.value += dt * (0.1 + sl('spin') * 3);
  composer.render();
  requestAnimationFrame(loop);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  U.uRes.value.set(innerWidth * pixelRatio, innerHeight * pixelRatio);
}
addEventListener('resize', resize);
resize();
loop();
</script>
</body>
</html>
