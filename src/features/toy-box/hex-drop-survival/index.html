<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Hex Drop</title>
<style>
  :root { --ink: #fff; --card: rgba(24, 14, 44, 0.62); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1450; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; user-select: none; }
  #info { top: 14px; left: 14px; padding: 10px 14px; display: none; }
  #info .a { font-size: 30px; font-weight: 900; line-height: 1; color: #ffd23f; }
  #info .a small { font-size: 15px; color: #fff; opacity: 0.75; }
  #info .m { font-size: 13px; margin-top: 4px; opacity: 0.9; }
  #board { top: 62px; right: 14px; padding: 8px 10px; font-size: 12.5px; display: none; min-width: 170px; }
  #board .row { display: flex; gap: 6px; align-items: center; padding: 1px 0; }
  #board .row b { width: 16px; opacity: 0.6; }
  #board .row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #board .row span { flex: 1; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row em { font-style: normal; font-variant-numeric: tabular-nums; min-width: 46px; text-align: right; opacity: 0.85; }
  #board .row.out span { opacity: 0.45; text-decoration: line-through; }
  #board .row.me span { color: #ffd23f; font-weight: 800; }
  #big { position: fixed; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(32px, 8vw, 80px); font-weight: 900; text-shadow: 0 4px 0 rgba(0, 0, 0, 0.3); pointer-events: none; text-align: center; white-space: nowrap; }
  #big small { display: block; font-size: 0.3em; font-weight: 700; }
  #hint { bottom: 14px; left: 14px; padding: 8px 12px; font-size: 12.5px; opacity: 0.85; }
  #top { top: 14px; right: 14px; padding: 6px; display: none; gap: 6px; align-items: center; font-size: 13px; }
  #top b { padding: 0 6px; letter-spacing: 0.15em; color: #ffd23f; }
  #top button { font: inherit; font-weight: 700; color: inherit; background: rgba(255, 255, 255, 0.12); border: 0; padding: 6px 10px; border-radius: 9px; cursor: pointer; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.35); display: none; }
  #stick div { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); }
  #jumpBtn { position: fixed; right: 28px; bottom: 34px; width: 92px; height: 92px; border-radius: 50%; border: 0; background: rgba(255, 210, 63, 0.85); color: #2a1450; font: 900 18px ui-rounded, system-ui; display: none; }
  @media (pointer: coarse) { #stick, #jumpBtn { display: block; } #hint { display: none; } }
</style>
</head>
<body>
<div id="info" class="card"><div class="a" id="alive"></div><div class="m" id="round"></div></div>
<div id="board" class="card"></div>
<div id="big"></div>
<div id="hint" class="card"><b>WASD / arrows</b> run · <b>Space</b> jump · tiles drop a moment after you step on them, so keep moving</div>
<div id="top" class="card"><span>Room</span><b id="code"></b><button id="lobbyBtn">Lobby</button></div>
<div id="stick"><div></div></div>
<button id="jumpBtn">JUMP</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { createLobby } from '../common/room-lobby.js';
import { startTicker } from '../common/room-client.js';
import { createServerMatchClient } from '../common/server-run/server-match-client.js';
import { createHexSim, STEP, S, LAYERS, PER_FLOOR, OUT_Y, FALL_DELAY, ROUNDS, SPEED, GRAV } from './hex-sim.js';
import { createNameSync } from '../common/snapshot-names.js';
import { createSnapPacing } from '../common/snap-pacing.js';
import { createPrediction } from '../common/own-prediction.js';
import { createGameAudio } from '../common/game-audio.js';
import { trackKeys } from '../common/key-state.js';

// Scene > Renderer, camera, gradient sky dome, glow void below
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3a1a66, 40, 110);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 top = vec3(0.32,0.55,1.0), mid = vec3(0.98,0.55,0.78), low = vec3(0.16,0.06,0.32); vec3 c = h > 0. ? mix(mid, top, smoothstep(0.,0.6,h)) : mix(mid, low, smoothstep(0.,0.35,-h)); gl_FragColor = vec4(c,1.); }`,
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xffe6ff, 0x3a1a66, 1.3));
const sun = new THREE.DirectionalLight(0xfff0f6, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 120 });
sun.position.set(18, 50, 14);
scene.add(sun);
const voidGlow = new THREE.Mesh(new THREE.CircleGeometry(90, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xff5ab4, transparent: true, opacity: 0.35, fog: false }));
voidGlow.position.y = -40;
scene.add(voidGlow);

// Arena > hex layers: pointy-top axial grid, 169 tiles per floor
// tile state + rules live in hex-sim.js; this page draws them. Attract runs the sim here, a match mirrors the relay server's snapshots
const sim = createHexSim({ onTilesReset: () => redrawTiles() });
const world = sim.world, tiles = sim.tiles, animTiles = sim.animTiles;
const LAYER_COLORS = [[0xff7ac6, 0xff9fd6], [0x46d6ff, 0x86e6ff], [0xffd23f, 0xffe27a]];
// one mesh per floor so floors above the camera focus can fade out of the way
const hexGeo = new THREE.CylinderGeometry(S * 0.95, S * 0.9, 0.55, 6);
const tileMeshes = LAYERS.map(() => {
  const m = new THREE.InstancedMesh(hexGeo, new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.05, transparent: true }), PER_FLOOR);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  return m;
});
const flagUpdate = () => tileMeshes.forEach((m) => { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; });
const _m = new THREE.Matrix4(), _c = new THREE.Color(), _w = new THREE.Color(0xffffff), _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
function baseColor(t) { return _c.set(LAYER_COLORS[t.L][(t.q + 2 * t.r + 300) % 3 === 0 ? 1 : 0]); }
function drawTile(i, time = 0) {
  const t = tiles[i];
  const mesh = tileMeshes[t.L], k0 = i - t.L * PER_FLOOR;
  if (t.state === 2 && t.drop < -14) { _m.makeScale(0, 0, 0); mesh.setMatrixAt(k0, _m); return; }
  const shake = t.state === 1 ? (1 - t.t / FALL_DELAY) * 0.09 : 0;
  _m.makeTranslation(t.x + Math.sin(time * 70 + i) * shake, t.y - 0.275 + t.drop, t.z + Math.cos(time * 60 + i) * shake);
  mesh.setMatrixAt(k0, _m);
  const k = t.state === 0 ? 0 : t.state === 1 ? 0.25 + 0.65 * (1 - t.t / FALL_DELAY) : 0.9;
  mesh.setColorAt(k0, baseColor(t).lerp(_w, k));
}
// every tile redrawn when the sim resets the floors (new round, keyframe resync)
function redrawTiles() {
  tiles.forEach((_, i) => drawTile(i));
  flagUpdate();
}
redrawTiles();

// Players > bean model: capsule body, eyes, name tag
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(24,14,44,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(2.4, 0.6, 1); s.position.y = 2.2; s.renderOrder = 5;
  return s;
}
const bodyGeo = new THREE.CapsuleGeometry(0.45, 0.55, 6, 16).translate(0, 0.73, 0);
const eyeGeo = new THREE.SphereGeometry(0.13, 12, 10), pupilGeo = new THREE.SphereGeometry(0.065, 10, 8);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }), pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const players3d = new Map();
function makeBean(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const mesh = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.45 }));
  mesh.castShadow = true;
  body.add(mesh);
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(eyeGeo, eyeMat); e.position.set(s * 0.17, 1.0, 0.36);
    const pu = new THREE.Mesh(pupilGeo, pupilMat); pu.position.set(s * 0.17, 1.0, 0.47);
    body.add(e, pu);
  }
  const tag = nameTag(p.nick, p.color);
  g.add(body, tag);
  g.userData = { body, tag };
  scene.add(g);
  return g;
}

// Audio > jump boop, out whistle, countdown, win fanfare
const gameAudio = createGameAudio({ noiseSeconds: 0 });
const { tone } = gameAudio;
const sfx = {
  jump(v) { tone(300, 620, 0.14, 0.09 * v, 'triangle'); },
  land(v) { tone(140, 90, 0.07, 0.07 * v, 'sine'); },
  out(me) { tone(900, 120, 0.9, me ? 0.14 : 0.05, 'sine'); },
  beep(hi) { tone(hi ? 880 : 440, hi ? 880 : 440, hi ? 0.45 : 0.16, 0.11, 'square'); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.2, 0.1, 'square', i * 0.11)); },
};

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'hex-drop', title: 'Hex Drop', emoji: '🟣', accent: '#ff7ac6',
  blurb: 'Three floors of hex tiles. Every tile you touch drops a moment later. Keep running, jump the gaps, be the last bean standing.',
  maxBots: 13, defaultBots: 5, minPlayers: 2,
  note: 'Up to 14 beans per room (humans + bots). 3 rounds, points for outlasting others.',
  onJoin(room) {
    document.getElementById('code').textContent = room.code;
    room.on('data', onData);
    room.on('host', syncTop);
  },
  // the relay server runs the match; every page (lobby host too) plays as a guest
  onStart({ bots }) {
    sim.clearPlayers();
    Object.assign(world, { mode: 'match', round: 1, phase: 'count', t: 3.5 });
    sim.resetTiles();
    syncTop();
    serverMatch.start({ bots });
  },
  onLobby() {
    serverMatch.stop();
    ['info', 'board', 'top'].forEach((id) => (document.getElementById(id).style.display = 'none'));
    big('');
    sim.startAttract();
  },
});
function syncTop() { document.getElementById('lobbyBtn').style.display = lobby.room?.isHost ? '' : 'none'; }
document.getElementById('lobbyBtn').onclick = () => lobby.backToLobby();
const serverMatch = createServerMatchClient(lobby);

// Multiplayer > Net: everything in a match comes from the relay server (bean rows, triggered tiles, tile keyframes)
function onData(d, from) {
  if (!d || d._lobby || !serverMatch.fromServer(from) || world.mode !== 'match') return;
  if (d.g === 'done') serverMatch.finish();
  else if (d.g === 's') applySnap(d);
}
// Cloud Sync > nick + color ride in a name table, not every row
const names = createNameSync();
// Multiplayer > Guest snapshot pacing: smoothing softens when snapshots arrive unevenly
const pacing = createSnapPacing();
let snapAt = 0;
// Multiplayer > Guest prediction: own player moves on local input at once; events swapped out so it never queues host fx
const pred = createPrediction({
  step: (p, dt) => { const keep = sim.events; sim.events = []; sim.stepPlayer(p, dt); sim.events = keep; },
  live: (p) => p.alive,
  seed: (p) => { p.lastJump = local.jumpSeq; p.ghost = true; },
  pos: ['x', 'z', 'y'], vel: ['vx', 'vz', 'vy'], angle: 'face',
});
function applySnap(s) {
  serverMatch.onSnapshot(s);
  names.read(s);
  Object.assign(world, { phase: s.ph, t: s.t, round: s.rd, outCount: s.oc, winner: s.win });
  const seen = new Set();
  for (const [id, x, y, z, vx, vy, vz, face, fl] of s.P) {
    seen.add(id);
    if (!world.players.has(id) && !names.name(id)) continue;
    const p = world.players.get(id) ?? sim.addPlayer(id, ...names.name(id), !!(fl & 1));
    Object.assign(p, { x, y, z, vx, vy, vz, face, alive: !!(fl & 2), ground: !!(fl & 4) });
    if (id === lobby.room.me) pred.correct(p);
  }
  for (const id of [...world.players.keys()]) if (!seen.has(id)) sim.removePlayer(id);
  // scores ride only when they change
  for (const [id, pts, wins, place] of s.S ?? []) { const p = world.players.get(id); if (p) Object.assign(p, { pts, wins, place }); }
  for (const i of s.tr ?? []) sim.triggerTile(i);
  if (s.K) {
    let reset = false;
    for (let i = 0; i < tiles.length; i++) {
      const st = +s.K[i], t = tiles[i];
      if (st === t.state) continue;
      if (st === 0) { reset = true; break; }
      if (st === 1 && t.state === 0) sim.triggerTile(i);
      else if (st === 2 && t.state !== 2) { t.state = 2; t.vy = 0; animTiles.add(i); }
    }
    if (reset) { sim.resetTiles(); for (let i = 0; i < tiles.length; i++) { const st = +s.K[i]; if (st === 1) sim.triggerTile(i); else if (st === 2) { tiles[i].state = 2; tiles[i].drop = -15; drawTile(i); } } }
  }
  playEvents(s.ev ?? []);
  snapAt = pacing.arrived();
}
function playEvents(evs) {
  const me = lobby.room?.me;
  for (const e of evs) {
    const p = world.players.get(e[1]);
    if (e[0] === 'j') sfx.jump(e[1] === me ? 1 : 0.3);
    else if (e[0] === 'l' && e[1] === me) sfx.land(1);
    else if (e[0] === 'o') { sfx.out(e[1] === me); if (e[1] === me && world.mode === 'match') flash(`<small>you dropped out</small>${ord(e[2])} place`); }
    else if (e[0] === 'c') { if (world.mode === 'match') { sfx.beep(e[1] === 0); if (e[1] === 0) flash('GO!', 0.8); } }
    else if (e[0] === 'w' && p) { if (world.mode === 'match') sfx.win(); flash(`<small>${e[1] === me ? 'you survived!' : 'last bean standing'}</small>👑 ${esc(p.nick)}`, 4); }
  }
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ord = (n) => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');

// Input > keyboard, touch stick, jump button
const keys = trackKeys(), local = { x: 0, z: 0, jumpSeq: 0 };
addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) local.jumpSeq++;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
const stick = document.getElementById('stick'), knob = stick.firstElementChild;
let stickId = null, sx = 0, sz = 0;
stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
stick.addEventListener('pointerup', () => { stickId = null; sx = sz = 0; knob.style.transform = ''; });
function moveStick(e) {
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dz = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  const l = Math.hypot(dx, dz); if (l > 1) { dx /= l; dz /= l; }
  sx = dx; sz = dz; knob.style.transform = `translate(${dx * 40}px, ${dz * 40}px)`;
}
document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); local.jumpSeq++; });
function readInput() {
  local.x = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + sx;
  local.z = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0) + sz;
}

// HUD > alive counter, standings, banner
const bigEl = document.getElementById('big');
let bigText = '', flashT = 0;
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
function flash(t, len = 1.8) { big(t); flashT = len; }
let hudT = 0;
function hud(dt) {
  if (world.mode !== 'match') { if (flashT > 0) { flashT -= dt; if (flashT <= 0) big(''); } return; }
  flashT -= dt;
  const me = world.players.get(lobby.room?.me);
  if (world.phase === 'count') big(`<small>Round ${world.round} of ${ROUNDS}</small>${Math.max(1, Math.ceil(world.t))}`);
  else if (world.phase === 'final') {
    const top = [...world.players.values()].sort((a, b) => b.pts - a.pts)[0];
    big(`<small>final · back to lobby in ${Math.max(0, Math.ceil(world.t))}s</small>🏆 ${esc(top?.nick ?? '')}`);
  } else if (flashT <= 0) big(world.phase === 'play' && me && !me.alive ? '<small>spectating</small>' : '');
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  const ps = [...world.players.values()], alive = ps.filter((p) => p.alive).length;
  document.getElementById('alive').innerHTML = `${alive}<small> / ${ps.length} alive</small>`;
  document.getElementById('round').textContent = `Round ${world.round} of ${ROUNDS}${me ? ` · you: ${me.pts} pts` : ''}`;
  const r = ps.sort((a, b) => b.pts - a.pts || b.alive - a.alive);
  document.getElementById('board').innerHTML = r.map((p, i) => `<div class="row ${p.alive ? '' : 'out'} ${p.id === lobby.room?.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:${p.color}"></i><span>${esc(p.nick)}</span><em>${'👑'.repeat(p.wins)} ${p.pts}</em></div>`).join('');
}

// Run engine > sim tick (worker): attract steps the local sim; a match predicts my bean, animates tiles and streams input to the server
let acc = 0;
const isHostSim = () => world.mode === 'attract';
function simTick(dt) {
  readInput();
  if (isHostSim()) {
    for (acc += dt; acc >= STEP; acc -= STEP) sim.step();
    playEvents(sim.events); sim.events = [];
    sim.dropTriggers();
    return;
  }
  sim.stepTiles(dt);
  const room = lobby.room;
  if (!room) return;
  pred.tick(world.players.get(room.me), { mx: local.x, mz: local.z, jumpSeq: local.jumpSeq }, dt, STEP);
  serverMatch.tickInput(() => ({ x: +local.x.toFixed(2), z: +local.z.toFixed(2), j: local.jumpSeq }));
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 30, 30), camLook = new THREE.Vector3();
let specIdx = 0, specT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, pacing.cap(0.12));
  for (const [id, g] of players3d) if (!world.players.has(id)) { scene.remove(g); players3d.delete(id); }
  for (const p of world.players.values()) {
    let g = players3d.get(p.id);
    if (!g) { g = makeBean(p); players3d.set(p.id, g); g.position.set(p.x, p.y, p.z); }
    const v = (!hostSim && p.id === lobby.room?.me && pred.state) || p, va = v === p ? age : 0;
    const tx = v.x + v.vx * va, ty = v.ground ? v.y : v.y + v.vy * va - 0.5 * GRAV * va * va, tz = v.z + v.vz * va;
    const a = hostSim || v !== p ? 1 : 1 - Math.exp(-dt * pacing.rate(16));
    if (g.position.distanceTo(_v.set(tx, ty, tz)) > 6) g.position.set(tx, ty, tz);
    g.position.x += (tx - g.position.x) * a; g.position.y += (ty - g.position.y) * a; g.position.z += (tz - g.position.z) * a;
    let dh = v.face - g.rotation.y; dh = Math.atan2(Math.sin(dh), Math.cos(dh));
    g.rotation.y += dh * Math.min(1, dt * 14);
    // squash on the ground, stretch in the air, waddle when running
    const u = g.userData, sp = Math.hypot(p.vx, p.vz);
    const st = p.ground ? 1 - Math.min(sp / SPEED, 1) * 0.05 * (1 + Math.sin(time * 18)) : 1 + clamp(Math.abs(p.vy) * 0.015, 0, 0.15);
    u.body.scale.set(1 / Math.sqrt(st), st, 1 / Math.sqrt(st));
    u.body.rotation.z = p.ground ? Math.sin(time * 14 + p.id) * Math.min(sp / SPEED, 1) * 0.12 : 0;
    g.visible = p.alive || p.y > OUT_Y - 4;
  }
  if (animTiles.size) {
    for (const i of animTiles) drawTile(i, time);
    flagUpdate();
  }
  voidGlow.material.opacity = 0.3 + Math.sin(time * 1.5) * 0.06;
  hud(dt);
  // camera: chase own bean; when out (or attract), drift between survivors
  const me = world.players.get(lobby.room?.me);
  let focus = me && me.alive && world.mode === 'match' ? players3d.get(me.id) : null;
  if (!focus) {
    const alive = [...world.players.values()].filter((p) => p.alive);
    specT -= dt;
    if (specT <= 0) { specT = 5; specIdx++; }
    const f = alive.length ? alive[specIdx % alive.length] : null;
    focus = f ? players3d.get(f.id) : null;
  }
  const fx = focus ? focus.position.x * 0.7 : 0, fy = focus ? focus.position.y : 0, fz = focus ? focus.position.z * 0.7 : 0;
  camPos.lerp(_v.set(fx, fy + 15, fz + 15), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, fy, fz - 1), 1 - Math.exp(-dt * 4));
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  tileMeshes.forEach((m, L) => { const above = LAYERS[L] > camLook.y + 2; m.material.opacity += ((above ? 0.18 : 1) - m.material.opacity) * Math.min(1, dt * 5); m.material.depthWrite = !above; m.castShadow = !above; });
  sun.position.set(camLook.x + 18, camLook.y + 50, camLook.z + 14); sun.target.position.copy(camLook); sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
sim.startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
