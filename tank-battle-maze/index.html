  .stick { position: fixed; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.35); display: none; }

  #stickL { left: 24px; } #stickR { right: 24px; bottom: 190px; }
  @media (pointer: coarse) { .stick { display: block; } #hint { display: none; } #mini { bottom: auto; top: 70px; } }

<script type="module">

// Scene > Renderer, camera, lights
const renderer = new THREE.WebGLRenderer({ antialias: true });

const scene = new THREE.Scene();

// Arena > Seeded maze: backtracker carve, then knock out extra walls for loops
const W = 15, H = 11, CELL = 7, TH = 0.9, WALL_H = 2.2;
const HALF_W = (W * CELL) / 2, HALF_H = (H * CELL) / 2;
function mulberry(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let maze = null;
function genMaze(seed) {

  const hW = Array.from({ length: H + 1 }, () => Array(W).fill(true));

  const stack = [[Math.floor(r() * W), Math.floor(r() * H)]];

    const [x, y] = stack[stack.length - 1];
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < W && ny < H && !seen[ny][nx]; });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(r() * opts.length)];
    if (dx === 1) vW[y][x + 1] = false; if (dx === -1) vW[y][x] = false; if (dy === 1) hW[y + 1][x] = false; if (dy === -1) hW[y][x] = false;

    stack.push([x + dx, y + dy]);

  for (let y = 0; y < H; y++) for (let x = 1; x < W; x++) if (vW[y][x] && r() < 0.42) vW[y][x] = false;
  // merge runs of edges into long wall boxes
  const boxes = [];
  for (let y = 0; y <= H; y++) { let s = -1; for (let x = 0; x <= W; x++) { const on = x < W && hW[y][x]; if (on && s < 0) s = x; if (!on && s >= 0) { boxes.push({ minx: s * CELL - HALF_W - TH / 2, maxx: x * CELL - HALF_W + TH / 2, minz: y * CELL - HALF_H - TH / 2, maxz: y * CELL - HALF_H + TH / 2 }); s = -1; } } }
  for (let x = 0; x <= W; x++) { let s = -1; for (let y = 0; y <= H; y++) { const on = y < H && vW[y][x]; if (on && s < 0) s = y; if (!on && s >= 0) { boxes.push({ minx: x * CELL - HALF_W - TH / 2, maxx: x * CELL - HALF_W + TH / 2, minz: s * CELL - HALF_H - TH / 2, maxz: y * CELL - HALF_H + TH / 2 }); s = -1; } } }

}
const cellCenter = (cx, cy) => [cx * CELL - HALF_W + CELL / 2, cy * CELL - HALF_H + CELL / 2];
const cellOf = (x, z) => [THREE.MathUtils.clamp(Math.floor((x + HALF_W) / CELL), 0, W - 1), THREE.MathUtils.clamp(Math.floor((z + HALF_H) / CELL), 0, H - 1)];

// Arena > Meshes: grass ground, instanced walls with painted caps
const groundTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#7fa860'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${40 + Math.random() * 60},${90 + Math.random() * 70},${30 + Math.random() * 30},0.35)`; g.fillRect(Math.random() * 256, Math.random() * 256, 2, 4); }
  g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.repeat.set(W, H); return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(W * CELL, H * CELL).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 }));
ground.receiveShadow = true;
scene.add(ground);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(600, 600).rotateX(-Math.PI / 2).translate(0, -0.02, 0), new THREE.MeshStandardMaterial({ color: 0x5f7f46, roughness: 1 }));
outer.receiveShadow = true;
scene.add(outer);
let wallMesh = null, capMesh = null;
function buildWalls() {
  if (wallMesh) { scene.remove(wallMesh, capMesh); wallMesh.dispose(); capMesh.dispose(); }
  const n = maze.boxes.length;
  wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xc8b48a, roughness: 0.85 }), n);
  capMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0xe0664a, roughness: 0.6 }), n);
  wallMesh.castShadow = wallMesh.receiveShadow = capMesh.castShadow = true;
  const m = new THREE.Matrix4();
  maze.boxes.forEach((b, i) => {
    const sx = b.maxx - b.minx, sz = b.maxz - b.minz, cx = (b.minx + b.maxx) / 2, cz = (b.minz + b.maxz) / 2;
    m.compose(new THREE.Vector3(cx, WALL_H / 2, cz), new THREE.Quaternion(), new THREE.Vector3(sx, WALL_H, sz)); wallMesh.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(cx, WALL_H + 0.12, cz), new THREE.Quaternion(), new THREE.Vector3(sx + 0.15, 0.24, sz + 0.15)); capMesh.setMatrixAt(i, m);
  });
  scene.add(wallMesh, capMesh);
  drawMiniBase();
}
// Arena > Scenery: trees ring outside walls
const treeGeo = new THREE.ConeGeometry(2.2, 6, 7).translate(0, 4.2, 0), trunkGeo = new THREE.CylinderGeometry(0.35, 0.45, 1.6, 6).translate(0, 0.8, 0);
for (let i = 0; i < 70; i++) {
  const a = Math.random() * Math.PI * 2, rx = HALF_W + 6 + Math.random() * 30, rz = HALF_H + 6 + Math.random() * 30;
  const x = Math.cos(a) * rx, z = Math.sin(a) * rz;
  const t = new THREE.Mesh(treeGeo, new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.3 + Math.random() * 0.06, 0.45, 0.28 + Math.random() * 0.1), flatShading: true }));
  const tr = new THREE.Mesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6b4a2f }));
  t.position.set(x, 0, z); tr.position.set(x, 0, z); t.scale.setScalar(0.8 + Math.random() * 0.6); t.castShadow = true;
  scene.add(t, tr);
}

// Tanks > Model: rounded hull, scrolling treads, dome turret + barrel, name tag
const treadTex = (() => { const c = document.createElement('canvas'); c.width = 16; c.height = 64; const g = c.getContext('2d'); g.fillStyle = '#2b2b2b'; g.fillRect(0, 0, 16, 64); g.fillStyle = '#4a4a4a'; for (let i = 0; i < 8; i++) g.fillRect(0, i * 8, 16, 4); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; })();
const hullGeo = new RoundedBoxGeometry(1.7, 0.7, 2.4, 3, 0.18);
const treadGeo = new THREE.BoxGeometry(0.5, 0.6, 2.7);
const domeGeo = new THREE.SphereGeometry(0.62, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2);
const barrelGeo = new THREE.CylinderGeometry(0.13, 0.15, 1.6, 10).rotateX(Math.PI / 2).translate(0, 0, 0.95);
function nameTag(nick, color) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 28px ui-rounded, system-ui, sans-serif';
  const w = Math.min(240, g.measureText(nick).width + 30);
  g.fillStyle = 'rgba(16,22,18,0.72)'; g.beginPath(); g.roundRect(128 - w / 2, 10, w, 44, 22); g.fill();
  g.fillStyle = color; g.beginPath(); g.arc(128 - w / 2 + 19, 32, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(nick, 136, 33, 200);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthWrite: false, transparent: true }));
  s.scale.set(4, 1, 1); s.position.y = 2.9; s.renderOrder = 5;
  return s;
}
function makeTank(p) {
  const g = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.5, metalness: 0.2 });
  const hull = new THREE.Mesh(hullGeo, paint); hull.position.y = 0.75; hull.castShadow = true;
  const tm = new THREE.MeshStandardMaterial({ map: treadTex.clone(), roughness: 0.9 });
  tm.map.needsUpdate = true;
  const tl = new THREE.Mesh(treadGeo, tm), tr = new THREE.Mesh(treadGeo, tm);
  tl.position.set(-0.95, 0.4, 0); tr.position.set(0.95, 0.4, 0); tl.castShadow = tr.castShadow = true;
  const turret = new THREE.Group(); turret.position.y = 1.1;
  const dome = new THREE.Mesh(domeGeo, paint); dome.castShadow = true;
  const barrel = new THREE.Mesh(barrelGeo, new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4, metalness: 0.5 })); barrel.position.y = 0.25; barrel.castShadow = true;
  turret.add(dome, barrel);
  const shield = new THREE.Mesh(new THREE.SphereGeometry(1.9, 24, 14), new THREE.MeshBasicMaterial({ color: 0x7fe3ff, transparent: true, opacity: 0.22, depthWrite: false }));

  const body = new THREE.Group(); body.add(hull, tl, tr);
  g.add(body, turret, shield, nameTag(p.nick, p.color));

  scene.add(g);

}

// Shells + crates > Meshes (pooled)
const shellGeo = new THREE.SphereGeometry(0.28, 10, 8), shellMat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffa640, emissiveIntensity: 0.6, metalness: 0.6 });
const shellPool = [];
function shellMesh(i) { while (shellPool.length <= i) { const m = new THREE.Mesh(shellGeo, shellMat); m.castShadow = true; scene.add(m); shellPool.push(m); } return shellPool[i]; }
const CRATE = { triple: { color: 0xff8a3d, label: 'TRIPLE SHOT' }, shield: { color: 0x58c9ff, label: 'SHIELD' }, speed: { color: 0x7be05a, label: 'SPEED' } };
const crateMeshes = new Map();
function crateMesh(c) {
  let m = crateMeshes.get(c.id);
  if (!m) {
    m = new THREE.Group();
    const box = new THREE.Mesh(new RoundedBoxGeometry(1.3, 1.3, 1.3, 2, 0.15), new THREE.MeshStandardMaterial({ color: CRATE[c.type].color, emissive: CRATE[c.type].color, emissiveIntensity: 0.35 }));

    m.add(box); scene.add(m); crateMeshes.set(c.id, m);

// FX > particles (smoke, sparks), scorch decals
const fxGeo = new THREE.SphereGeometry(0.3, 8, 6);
const fx = [];

}

    f.mesh.position.addScaledVector(f.v, dt);

    const k = Math.max(f.life / f.max, 0);
    f.mesh.scale.setScalar(f.s * (1.6 - k));
    f.mesh.material.opacity = k * 0.9;
    if (f.life <= 0) f.mesh.visible = false;

const scorchMat = new THREE.MeshBasicMaterial({ color: 0x1a1a14, transparent: true, opacity: 0.5, depthWrite: false });
const scorches = [];
function scorch(x, z) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(1.8, 20).rotateX(-Math.PI / 2), scorchMat.clone());
  m.position.set(x, 0.03, z); m.userData.t = 12; scene.add(m); scorches.push(m);

}
function boom(x, z, color) {
  for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 8; puff(x, 1, z, Math.cos(a) * s, 3 + Math.random() * 6, Math.sin(a) * s, i % 3 ? 0xffb347 : color, 0.6 + Math.random() * 0.4, 1.2, 9); }

}

// Audio > fire thump, explosion, ricochet ping, pickup chime

// Game > Phases: countdown, timed deathmatch, results

    if (world.t <= 0 || (top && top.kills >= KILL_CAP)) { world.phase = 'end'; world.t = 7; world.winner = top?.id ?? null; world.shells = []; }

// Multiplayer > Lobby: maze seed travels in the start packet so every client builds the same walls
const lobby = createLobby({

  blurb: 'Free-for-all tanks in a fresh maze each match. Shells ricochet up to 3 times, crates give triple shot, shield or speed. Most kills in 3 minutes wins.',
  maxBots: 13, defaultBots: 5, minPlayers: 2,
  note: 'Up to 14 tanks per room (humans + bots). Phones: left stick drives, right stick aims + fires.',
  onJoin(room) {

    for (let i = 0; i < bots; i++) addTank(-1 - i, `${BOT_NAMES[i]} 🤖`, BOT_COLORS[i], true);

  for (const p of [...world.tanks.values()]) if (!p.bot && !ids.has(p.id)) removeTank(p.id);
  for (const p of players) if (!world.tanks.has(p.id)) {

    if (world.tanks.size >= 14) { const bot = [...world.tanks.values()].filter((q) => q.bot).pop(); if (bot) removeTank(bot.id); }

const remoteIn = new Map();

}

    T: [...world.tanks.values()].map((p) => [p.id, f2(p.x), f2(p.z), f2(p.ang), f2(p.tur), (p.alive ? 1 : 0) | (p.shield ? 2 : 0) | (p.inv > 0 ? 4 : 0) | (p.bot ? 8 : 0), p.kills, p.deaths, p.nick, p.color, Math.ceil(p.triple), Math.ceil(p.speed), f2(p.moved ?? 0), f2(p.respawn)]),

  const seen = new Set();

    const [id, x, z, ang, tur, fl, kills, deaths, nick, color, triple, speed, moved, respawn] = a;
    seen.add(id);

    else if (e[0] === 'p') { if (e[1] === lobby.room?.me) sfx.pickup(); const p = world.tanks.get(e[1]); if (p) for (let i = 0; i < 10; i++) puff(p.x, 1.5, p.z, (rng() - 0.5) * 6, 3 + rng() * 3, (rng() - 0.5) * 6, CRATE[e[2]].color, 0.6, 0.6, 6); }
    else if (e[0] === 's') { const p = world.tanks.get(e[1]); if (p) { sfx.bounce(p.x, p.z); boomLite(p); } }

        const div = document.createElement('div');
        div.innerHTML = k && k !== v ? `<b style="color:${k.color}">${esc(k.nick)}</b> 💥 <b style="color:${v.color}">${esc(v.nick)}</b>` : `<b style="color:${v.color}">${esc(v.nick)}</b> 🙃 own shell`;

function boomLite(p) { for (let i = 0; i < 14; i++) { const a = rng() * Math.PI * 2; puff(p.x + Math.cos(a) * 1.8, 1, p.z + Math.sin(a) * 1.8, Math.cos(a) * 3, 1, Math.sin(a) * 3, 0x7fe3ff, 0.5, 0.6); } }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Input > keyboard + mouse aim (ground raycast) + twin touch sticks
const keys = {};
const local = { t: 0, r: 0, aim: 0, fireSeq: 0, aimSet: false };
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space' && !e.repeat) local.fireSeq++;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => (keys[e.code] = false));
const mouse = new THREE.Vector2(), ray = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.2), hit = new THREE.Vector3();
let mouseActive = false;
renderer.domElement.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); mouseActive = true; } });
renderer.domElement.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse' && e.button === 0) local.fireSeq++; });
function makeStick(el, onMove, onEnd) {
  const knob = el.firstElementChild;
  let id = null;
  const move = (e) => {
    const r = el.getBoundingClientRect();
    let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dz = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const l = Math.hypot(dx, dz); if (l > 1) { dx /= l; dz /= l; }
    knob.style.transform = `translate(${dx * 40}px, ${dz * 40}px)`;
    onMove(dx, dz);
  };
  el.addEventListener('pointerdown', (e) => { id = e.pointerId; el.setPointerCapture(id); move(e); });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  el.addEventListener('pointerup', () => { id = null; knob.style.transform = ''; onEnd(); });
}
let stickL = null, stickR = null, autoFireT = 0;
makeStick(document.getElementById('stickL'), (x, z) => (stickL = [x, z]), () => (stickL = null));
makeStick(document.getElementById('stickR'), (x, z) => (stickR = [x, z]), () => (stickR = null));
function readInput(dt) {
  const me = lobby.room && world.tanks.get(lobby.room.me);
  local.t = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  local.r = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0);
  if (stickL && me) {
    // stick = desired heading in screen space (camera looks down -z), tank turns toward it
    const mag = Math.hypot(...stickL);
    if (mag > 0.2) {
      let d = Math.atan2(stickL[0], stickL[1]) - me.ang; d = Math.atan2(Math.sin(d), Math.cos(d));
      if (Math.abs(d) > 2.3) { d = Math.atan2(Math.sin(d + Math.PI), Math.cos(d + Math.PI)); local.t = -mag; } else local.t = Math.cos(d) > 0.3 ? mag : 0.15;
      local.r = THREE.MathUtils.clamp(d * 2.5, -1, 1);
    }
  }
  if (!me) return;
  if (stickR && Math.hypot(...stickR) > 0.3) {
    local.aim = Math.atan2(stickR[0], stickR[1]);
    autoFireT -= dt;
    if (autoFireT <= 0) { autoFireT = 0.5; local.fireSeq++; }
  } else if (mouseActive) {
    ray.setFromCamera(mouse, camera);
    if (ray.ray.intersectPlane(groundPlane, hit)) local.aim = Math.atan2(hit.x - me.x, hit.z - me.z);
  } else local.aim = me.ang;
}

// HUD > scoreboard, clock, banner, power-up chip, minimap
const bigEl = document.getElementById('big');
let bigText = '';
function big(html) { if (html !== bigText) { bigText = html; bigEl.innerHTML = html; } }
let hudT = 0;
function hud(dt) {
  if (world.mode !== 'match') return;
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.15;
  const ps = [...world.tanks.values()].sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  document.getElementById('board').innerHTML = `<div class="hd"><span>Kills · first to ${KILL_CAP}</span><span>K / D</span></div>` + ps.map((p) => `<div class="row ${p.alive ? '' : 'dead'}"><i style="background:${p.color}"></i><span class="n">${esc(p.nick)}${p.id === lobby.room?.me ? ' (you)' : ''}</span><span class="k">${p.kills}</span><span class="d">${p.deaths}</span></div>`).join('');
  const m = Math.max(0, world.phase === 'play' ? world.t : MATCH_TIME);
  document.getElementById('clock').textContent = `${Math.floor(m / 60)}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
  const me = world.tanks.get(lobby.room?.me);
  if (world.phase === 'count') big(`${Math.max(1, Math.ceil(world.t))}<small>get ready</small>`);
  else if (world.phase === 'play') big(me && !me.alive ? `<small>respawning in ${Math.max(0, me.respawn).toFixed(1)}s</small>` : world.t > MATCH_TIME - 1 ? 'FIGHT!' : '');
  else if (world.phase === 'end') { const w = world.tanks.get(world.winner); big(w ? `🏆 ${esc(w.nick)}<small>${w.kills} kills</small>` : 'Match over'); }
  const pw = document.getElementById('pw');
  const chips = me ? [me.triple > 0 && `🔥 Triple ${Math.ceil(me.triple)}s`, me.speed > 0 && `⚡ Speed ${Math.ceil(me.speed)}s`, me.shield && '🛡 Shield'].filter(Boolean) : [];
  pw.style.display = chips.length ? 'block' : 'none';
  pw.textContent = chips.join('   ');
}
const mini = document.getElementById('mini'), mg = mini.getContext('2d');
let miniBase = null;
function drawMiniBase() {
  const c = document.createElement('canvas'); c.width = mini.width; c.height = mini.height;
  const g = c.getContext('2d'), sx = mini.width / (W * CELL), sz = mini.height / (H * CELL);
  g.fillStyle = 'rgba(127,168,96,0.5)'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#e8dcc0';
  for (const b of maze.boxes) g.fillRect((b.minx + HALF_W) * sx, (b.minz + HALF_H) * sz, Math.max(1.5, (b.maxx - b.minx) * sx), Math.max(1.5, (b.maxz - b.minz) * sz));
  miniBase = c;
}
function drawMini() {
  const sx = mini.width / (W * CELL), sz = mini.height / (H * CELL);
  mg.clearRect(0, 0, mini.width, mini.height);
  if (miniBase) mg.drawImage(miniBase, 0, 0);
  for (const c of world.crates) { mg.fillStyle = '#' + CRATE[c.type].color.toString(16).padStart(6, '0'); mg.fillRect((c.x + HALF_W) * sx - 2, (c.z + HALF_H) * sz - 2, 4, 4); }
  for (const p of world.tanks.values()) {
    if (!p.alive) continue;
    const me = p.id === lobby.room?.me;
    mg.fillStyle = p.color; mg.beginPath(); mg.arc((p.x + HALF_W) * sx, (p.z + HALF_H) * sz, me ? 4.5 : 3, 0, Math.PI * 2); mg.fill();
    if (me) { mg.strokeStyle = '#fff'; mg.lineWidth = 1.5; mg.stroke(); }
  }
}

// Run engine > sim tick (worker, survives background tabs)
let acc = 0, sendT = 0;
const isHostSim = () => world.mode === 'attract' || !!lobby.room?.isHost;
function simTick(dt) {
  readInput(dt);
  const room = lobby.room;
  if (isHostSim()) {
    const me = room && world.tanks.get(room.me);
    if (me && world.mode === 'match') Object.assign(me, { inT: local.t, inR: local.r, aim: local.aim, fireSeq: local.fireSeq });
    for (const [id, inp] of remoteIn) { const p = world.tanks.get(id); if (p) Object.assign(p, { inT: inp.t, inR: inp.r, aim: inp.a, fireSeq: inp.f }); }
    acc += dt;
    while (acc >= STEP) {
      for (const p of world.tanks.values()) if (p.bot && p.alive) botThink(p, STEP);
      physics(STEP);
      phases(STEP);
      acc -= STEP;
    }
    if (world.mode === 'match' && room) {
      sendT -= dt;
      if (sendT <= 0) { sendT = 0.05; room.send(snapshot()); playEvents(events); events = []; }
    } else { playEvents(events); events = []; }
  } else if (world.mode === 'match' && room) {
    sendT -= dt;
    if (sendT <= 0) { sendT = 0.05; room.send({ g: 'i', t: f2(local.t), r: f2(local.r), a: f2(local.aim), f: local.fireSeq }); }
  }
}
startTicker(60, simTick);

// Run engine > render loop: tanks, shells, crates, fx, follow camera
const clock = new THREE.Clock();
let shake = 0;
const camPos = new THREE.Vector3(0, 90, 60), camLook = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, 0.12);
  const myId = lobby.room?.me;
  for (const p of world.tanks.values()) {
    let t = tanks3d.get(p.id);
    if (!t) { t = makeTank(p); tanks3d.set(p.id, t); t.position.set(p.x, 0, p.z); }
    t.visible = p.alive;
    const k = hostSim ? 1 : 1 - Math.exp(-dt * 16);
    const sp = (p.moved ?? 0) * 9;
    const tx = p.x + (hostSim ? 0 : Math.sin(p.ang) * sp * age), tz = p.z + (hostSim ? 0 : Math.cos(p.ang) * sp * age);
    if (t.position.distanceTo(new THREE.Vector3(tx, 0, tz)) > 6) t.position.set(tx, 0, tz);
    t.position.x += (tx - t.position.x) * k; t.position.z += (tz - t.position.z) * k;
    let da = p.ang - t.userData.body.rotation.y; da = Math.atan2(Math.sin(da), Math.cos(da));
    t.userData.body.rotation.y += da * Math.min(1, dt * 14);
    // own turret follows local aim instantly so aiming feels lag-free
    const tur = p.id === myId && world.mode === 'match' ? local.aim : p.tur;
    let dt2 = tur - t.userData.turret.rotation.y; dt2 = Math.atan2(Math.sin(dt2), Math.cos(dt2));
    t.userData.turret.rotation.y += dt2 * Math.min(1, dt * 18);
    t.userData.recoil = Math.max(0, t.userData.recoil - dt * 5);
    t.userData.barrel.position.z = -t.userData.recoil * 0.35;
    t.userData.tm.map.offset.y -= (p.moved ?? 0) * dt * 3;
    t.userData.shield.visible = p.shield;
    // spawn invulnerability blink
    t.userData.body.visible = !(p.inv > 0 && Math.floor(time * 12) % 2);
    if (p.alive && Math.abs(p.moved ?? 0) > 0.1 && rng() < 0.15) puff(t.position.x - Math.sin(p.ang) * 1.4, 0.3, t.position.z - Math.cos(p.ang) * 1.4, 0, 0.6, 0, 0xb9a77f, 0.7, 0.7);
  }
  world.shells.forEach((s, i) => { const m = shellMesh(i); m.visible = true; m.position.set(s.x + s.vx * age, 1.3, s.z + s.vz * age); });
  for (let i = world.shells.length; i < shellPool.length; i++) shellPool[i].visible = false;
  const live = new Set(world.crates.map((c) => c.id));
  for (const [id, m] of crateMeshes) if (!live.has(id)) { scene.remove(m); crateMeshes.delete(id); }
  for (const c of world.crates) { const m = crateMesh(c); m.position.set(c.x, 1.1 + Math.sin(time * 3 + c.id) * 0.2, c.z); m.rotation.y = time * 1.5; }
  for (const s of scorches) { s.userData.t -= dt; s.material.opacity = Math.max(0, Math.min(0.5, s.userData.t / 6)); }
  updateFx(dt);
  hud(dt);
  drawMini();
  // camera: follow own tank, else overview that fits the whole maze
  const me = world.tanks.get(myId);
  const fit = Math.max(1, 1.5 / camera.aspect);
  if (world.mode === 'match' && me && (me.alive || world.phase !== 'end')) {
    const tp = tanks3d.get(myId)?.position ?? new THREE.Vector3(me.x, 0, me.z);
    camLook.lerp(new THREE.Vector3(tp.x, 0, tp.z), 1 - Math.exp(-dt * 6));
    camPos.lerp(new THREE.Vector3(tp.x, 29 * fit, tp.z + 16 * fit), 1 - Math.exp(-dt * 4));
  } else {
    camLook.lerp(new THREE.Vector3(0, 0, 4), 1 - Math.exp(-dt * 2));
    camPos.lerp(new THREE.Vector3(0, 100 * fit, 52 * fit), 1 - Math.exp(-dt * 2));
  }
  focus.copy(camLook);
  shake = Math.max(0, shake - dt * 1.5);
  camera.position.copy(camPos).add(new THREE.Vector3((rng() - 0.5) * shake, (rng() - 0.5) * shake, (rng() - 0.5) * shake));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
