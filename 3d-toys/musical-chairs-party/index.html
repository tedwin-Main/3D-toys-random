<style>

const players3d = new Map();
function makeBean(p) {
  const g = new THREE.Group(), body = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.35, transparent: true });

// FX > confetti for eliminations + winner
const CONF = 700, confGeo = new THREE.BufferGeometry();
const cPos = new Float32Array(CONF * 3), cCol = new Float32Array(CONF * 3), cVel = new Float32Array(CONF * 3), cLife = new Float32Array(CONF);

let cNext = 0;

// Audio > procedural disco loop (128 BPM), record scratch on stop, sit pop, shove, out buzzer
let actx = null, master = null, noiseBuf;
function audio() {
  if (actx) return;
  actx = new AudioContext();
  master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);

}

addEventListener('keydown', audio, { once: true });

const BPM = 128, EIGHTH = 60 / BPM / 2;

  music.on = false;
}

  while (music.next < actx.currentTime + 0.2) {
    const s = music.step, t = music.next, chord = PROG[Math.floor(s / 16) % 4], v = music.vol;

// Game > World
const BOT_NAMES = ['Boogie', 'Disco', 'Funky', 'Groove', 'Shimmy', 'Twist', 'Hustle', 'Moonwalk', 'Salsa', 'Tango', 'Waltz', 'Robot', 'Cha-Cha', 'Mambo'];
const BOT_COLORS = ['#ff5d73', '#3fa7ff', '#ffb000', '#2ec27e', '#a970ff', '#ff7b2f', '#00c2c7', '#ff5fbf', '#8bc34a', '#5c6bc0', '#e0b04a', '#26a69a', '#7ae7ff', '#c0ca33'];

  confGeo.attributes.position.needsUpdate = true; confGeo.attributes.color.needsUpdate = true;
  hud(dt);
  // camera: whole floor fits; drifts a little toward own bean
  const me = world.players.get(meId), mg = me && players3d.get(me.id);
  const fit = Math.max(1, 1.25 / Math.max(camera.aspect, 0.5));
  const fx = mg && world.mode === 'match' ? mg.position.x * 0.35 : Math.sin(time * 0.1) * 3, fz = mg && world.mode === 'match' ? mg.position.z * 0.35 : 0;
  camPos.lerp(_v.set(fx, 24 * fit, fz + 19 * fit), 1 - Math.exp(-dt * 3));
  camLook.lerp(_v.set(fx, 0, fz + 0.5), 1 - Math.exp(-dt * 4));
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
