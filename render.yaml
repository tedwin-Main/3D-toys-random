# Render Blueprint for the whole toy box (static toys + room relay).
# Keep ONE instance: multiplayer rooms live in server memory,
# so a second replica would split players across servers that cannot see each other.
# Free web services sleep after 15 min idle; the first visit cold-starts (~30-60 s).
services:
  - type: web
    name: 3d-toys-random
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
