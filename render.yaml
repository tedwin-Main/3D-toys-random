# Render Blueprint for the whole repo: Render Studio at /, 3D Toy Box at /3d-toys/, room relay at /3d-toys/rooms.
# One Node server (src/features/studio-server/start-server.js) serves both folders.
# Keep ONE instance: multiplayer rooms live in server memory,
# so a second replica would split players across servers that cannot see each other.
# Free web services sleep after 15 min idle; the first visit cold-starts (~30-60 s).
services:
  - type: web
    name: 3d-toys-random
    runtime: node
    plan: free
    # players in Malaysia (VPN off): Singapore relay ~10 ms away
    region: singapore
    branch: main
    # one root package + lockfile installs everything
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
