<style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }

<script type="module">
/**
 * FILE: 3d-toys/mini-golf-party/index.html
 * PURPOSE: online mini golf for up to 12: everyone putts the same hole at once, balls collide, 6 floating-island holes (bumpers, windmills, slopes, water, sand); host-authoritative physics
 * UI: Putt Party page (lobby overlay, hole HUD, live leaderboard, scorecard, drag-to-putt aim)
 * USED BY: 3d-toys/index.html (iframe viewer)
 * KEY EXPORTS: none (standalone page)
 */
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { createLobby } from '../components/room-lobby.js';
import { startTicker } from '../components/room-client.js';

// Scene > Renderer, camera, sky, lights, sea far below the floating holes
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8dcff);
scene.fog = new THREE.Fog(0xa8dcff, 70, 190);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x6a8a5a, 1.5));
const sun = new THREE.DirectionalLight(0xfff2de, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(800, 800).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x4cb8f0, roughness: 0.4 }));
sea.position.y = -9;
scene.add(sea);

// Textures > felt noise, slope chevrons, water ripples
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const feltTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { const v = 215 + Math.random() * 40; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(Math.random() * w, Math.random() * h, 1, 2); } });
const arrowTex = canvasTex(64, 64, (g, w, h) => { g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 7; g.lineCap = 'round'; for (const y of [18, 50]) { g.beginPath(); g.moveTo(14, y + 10); g.lineTo(32, y - 6); g.lineTo(50, y + 10); g.stroke(); } });
const waterTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#2f8fe8'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 2; for (let i = 0; i < 14; i++) { const x = Math.random() * w, y = Math.random() * h; g.beginPath(); g.arc(x, y, 6 + Math.random() * 10, 0.2, 1.4); g.stroke(); } });

// Holes > map data: '#' wall, '.' felt, 'S' tee, 'H' cup, 'O' bumper, 'X' windmill, '~' water, ':' sand, '^v<>' slope
const HOLES = [
  { name: 'First Putt', par: 2, map: [
    '##########',
    '#SSS.....#',
    '#SSS.....#',
    '######...#',
    '     #...#',
    '     #...#',
    '     #.H.#',
    '     #####',
  ] },
  { name: 'Pinball', par: 3, map: [
    '#############',
    '#SSS........#',
    '#SSS..O..O..#',
    '#...........#',
    '#..O..O..O..#',
    '#...........#',
    '#.....O..O..#',
    '#...........#',
    '#.........H.#',
    '#############',
  ] },
  { name: 'Windmill Gap', par: 3, map: [
    '###############',
    '#SS.....#.....#',
    '#SS.....#.....#',
    '#SS...........#',
    '#SS.....X.....#',
    '#SS...........#',
    '#SS.....#.....#',
    '#SS.....#...H.#',
    '###############',
  ] },
  { name: 'Slip n Slide', par: 3, map: [
    '##############',
    '#SSS.........#',
    '#SSS.........#',
    '#######..vv###',
    '      #~.vv~#',
    '      #~..>>#',
    '      #~~..H#',
    '      #######',
  ] },
  { name: 'Sand Snake', par: 4, map: [
    '###########',
    '#SSS......#',
    '#SSS......#',
    '#######...#',
    '#...:::...#',
    '#...:::...#',
    '#...#######',
    '#...O.....#',
    '#.......H.#',
    '###########',
  ] },
  { name: 'Grand Finale', par: 4, map: [
    '################',
    '#SSS...~~~.....#',
    '#SSS...~~~..O..#',
    '#......~~~.....#',
    '#.....>>>>.....#',
    '####.......#####',
    '   #...X...#',
    '   #.......#',
    '####.......#####',
    '#....:::.....H.#',
    '################',
  ] },
];
const T = 2, R = 0.2, SUB = 1 / 120, MAX_STROKES = 8, HOLE_TIME = 75;
const SLOPE = { '^': [0, -1], v: [0, 1], '>': [1, 0], '<': [-1, 0] };
const solid = (ch) => ch === '#' || ch === ' ';
let H = null;
const tileAt = (c, r) => (r < 0 || r >= H.rows || c < 0 || c >= H.cols ? ' ' : H.grid[r][c]);
function parseHole(i) {
  const src = HOLES[i], cols = Math.max(...src.map.map((r) => r.length));
  const grid = src.map.map((r) => r.padEnd(cols, ' '));
  const h = { i, name: src.name, par: src.par, cols, rows: grid.length, grid, starts: [], bumpers: [], mills: [], cup: null };
  grid.forEach((row, r) => [...row].forEach((ch, c) => {
    const p = { x: c * T + T / 2, z: r * T + T / 2 };
    if (ch === 'S') h.starts.push(p);
    else if (ch === 'H') h.cup = p;
    else if (ch === 'O') h.bumpers.push({ ...p, pulse: 0 });
    else if (ch === 'X') h.mills.push(p);
  }));
  // bot distance field: tile steps to cup, water and walls impassable
  h.field = new Array(cols * h.rows).fill(-1);
  const cc = Math.floor(h.cup.x / T), cr = Math.floor(h.cup.z / T), q = [[cc, cr]];
  h.field[cr * cols + cc] = 0;
  while (q.length) {
    const [c, r] = q.shift(), f = h.field[r * cols + c];
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nr < 0 || nc >= cols || nr >= h.rows) continue;
      const ch = grid[nr][nc];
      if (solid(ch) || ch === '~' || h.field[nr * cols + nc] >= 0) continue;
      h.field[nr * cols + nc] = f + 1;
      q.push([nc, nr]);
    }
  }
  return h;
}

// Run engine > ball physics step (host sim + bot planner): slopes, friction, cup pull, walls, bumpers, windmill blades
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const millAngle = (t) => t * 1.3;
function physStep(b, dt, t) {
  const ch = tileAt(Math.floor(b.x / T), Math.floor(b.z / T)), sl = SLOPE[ch];
  if (sl) { b.vx += sl[0] * 7 * dt; b.vz += sl[1] * 7 * dt; }
  let dxC = H.cup.x - b.x, dzC = H.cup.z - b.z, dC = Math.hypot(dxC, dzC);
  // small gimme funnel around the cup
  if (dC < 0.36 && dC > 1e-3) { b.vx += (dxC / dC) * 1.6 * dt; b.vz += (dzC / dC) * 1.6 * dt; }
  const sand = ch === ':';
  let sp = Math.hypot(b.vx, b.vz);
  if (sp > 0) { const ns = Math.max(0, sp * Math.exp(-(sand ? 2.6 : 0.55) * dt) - (sand ? 4.5 : 0.8) * dt); b.vx *= ns / sp; b.vz *= ns / sp; sp = ns; }
  b.x += b.vx * dt; b.z += b.vz * dt;
  b._wall = 0; b._bump = -1;
  const c0 = Math.floor(b.x / T), r0 = Math.floor(b.z / T);
  for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
    if (!solid(tileAt(c, r))) continue;
    const x0 = c * T, z0 = r * T, px = clamp(b.x, x0, x0 + T), pz = clamp(b.z, z0, z0 + T);
    let nx = b.x - px, nz = b.z - pz, d = Math.hypot(nx, nz), push;
    if (d >= R) continue;
    if (d < 1e-6) {
      // center tunneled inside the block: leave through nearest face
      const o = [[b.x - x0, -1, 0], [x0 + T - b.x, 1, 0], [b.z - z0, 0, -1], [z0 + T - b.z, 0, 1]].sort((a, q) => a[0] - q[0])[0];
      nx = o[1]; nz = o[2]; push = o[0] + R;
    } else { nx /= d; nz /= d; push = R - d; }
    b.x += nx * push; b.z += nz * push;
    const vn = b.vx * nx + b.vz * nz;
    if (vn < 0) { b.vx -= 1.72 * vn * nx; b.vz -= 1.72 * vn * nz; b._wall = Math.max(b._wall, -vn); }
  }
  H.bumpers.forEach((o, k) => {
    const dx = b.x - o.x, dz = b.z - o.z, d = Math.hypot(dx, dz), rr = R + 0.45;
    if (d >= rr || d < 1e-6) return;
    const nx = dx / d, nz = dz / d;
    b.x = o.x + nx * rr; b.z = o.z + nz * rr;
    const vn = b.vx * nx + b.vz * nz;
    // bumpers add energy so they feel springy
    if (vn < 0) { b.vx -= 2 * vn * nx; b.vz -= 2 * vn * nz; b.vx += nx * 2.5; b.vz += nz * 2.5; b._bump = k; }
  });
  for (const m of H.mills) for (const off of [0, Math.PI / 2]) {
    const a = millAngle(t) + off, ux = Math.sin(a), uz = Math.cos(a);
    const s = clamp((b.x - m.x) * ux + (b.z - m.z) * uz, -2.5, 2.5), px = m.x + ux * s, pz = m.z + uz * s;
    const dx = b.x - px, dz = b.z - pz, d = Math.hypot(dx, dz), rr = R + 0.14;
    if (d >= rr || d < 1e-6) continue;
    const nx = dx / d, nz = dz / d;
    b.x = px + nx * rr; b.z = pz + nz * rr;
    // blade surface velocity at contact point
    const bvx = s * 1.3 * Math.cos(a), bvz = -s * 1.3 * Math.sin(a);
    const vn = (b.vx - bvx) * nx + (b.vz - bvz) * nz;
    if (vn < 0) { b.vx -= 1.6 * vn * nx; b.vz -= 1.6 * vn * nz; b._wall = Math.max(b._wall, -vn); }
  }
  if (tileAt(Math.floor(b.x / T), Math.floor(b.z / T)) === '~') return 's';
  dC = Math.hypot(H.cup.x - b.x, H.cup.z - b.z);
  sp = Math.hypot(b.vx, b.vz);
  if (dC < 0.26 && sp < 5.5) return 'c';
  if (sp < 0.07 && !SLOPE[tileAt(Math.floor(b.x / T), Math.floor(b.z / T))] && dC > 0.36) { b.vx = 0; b.vz = 0; }
  return '';
}

// Run engine > bot planner: simulate candidate putts, score rest spot by distance field
function planShot(b, skill) {
  const direct = Math.atan2(H.cup.x - b.x, H.cup.z - b.z);
  const angles = [];
  for (let k = 0; k < 24; k++) angles.push((k / 24) * Math.PI * 2);
  for (const d of [0, 0.03, -0.03, 0.07, -0.07]) angles.push(direct + d);
  const powers = [0.1, 0.2, 0.32, 0.48, 0.66, 0.85, 1];
  const s = { x: 0, z: 0, vx: 0, vz: 0 };
  let best = null, second = null;
  for (const a of angles) for (const p of powers) {
    const spd = 1.5 + p * 13.5;
    Object.assign(s, { x: b.x, z: b.z, vx: Math.sin(a) * spd, vz: Math.cos(a) * spd });
    let score = null;
    for (let i = 0; i < 480; i++) {
      const r = physStep(s, SUB, world.ht + i * SUB);
      if (r === 'c') { score = -100 + p; break; }
      if (r === 's') { score = 999; break; }
      if (s.vx === 0 && s.vz === 0) break;
    }
    if (score === null) {
      const f = H.field[Math.floor(s.z / T) * H.cols + Math.floor(s.x / T)];
      score = (f < 0 ? 500 : f * T) + 0.35 * Math.hypot(H.cup.x - s.x, H.cup.z - s.z);
    }
    const cand = { a, p, score };
    if (!best || score < best.score) { second = best; best = cand; } else if (!second || score < second.score) second = cand;
  }
  const pick = second && rng() > skill ? second : best;
  const g = () => (rng() + rng() + rng() - 1.5) / 1.5;
  return { a: pick.a + g() * 0.05 * (1.3 - skill), p: clamp(pick.p * (1 + g() * 0.08 * (1.3 - skill)), 0.05, 1) };
}

// Holes > meshes: floating island tiles, walls, slopes, water, bumpers, windmills, cup + flag
const holeGroup = new THREE.Group();
scene.add(holeGroup);
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const shared = {
  floor: new THREE.MeshStandardMaterial({ map: feltTex, roughness: 0.95 }),
  wall: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }),
  dirt: new THREE.MeshStandardMaterial({ color: 0x8a5a3c, roughness: 1 }),
  arrow: new THREE.MeshBasicMaterial({ map: arrowTex, transparent: true, depthWrite: false }),
  water: new THREE.MeshStandardMaterial({ map: waterTex, roughness: 0.15, metalness: 0.1, transparent: true, opacity: 0.92 }),
};
let holeMeshes = { bumpers: [], mills: [], flag: null };
function setHole(i) {
  if (H && H.i === i) return;
  H = parseHole(i);
  for (const c of [...holeGroup.children]) { holeGroup.remove(c); c.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  const floors = [], walls = [], bases = [], arrows = [], waters = [];
  const near = (c, r) => { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const ch = tileAt(c + dc, r + dr); if (!solid(ch)) return true; } return false; };
  for (let r = 0; r < H.rows; r++) for (let c = 0; c < H.cols; c++) {
    const ch = H.grid[r][c], x = c * T + T / 2, z = r * T + T / 2;
    if (ch === ' ') continue;
    if (ch === '#') { if (near(c, r)) { walls.push([x, z, c, r]); bases.push([x, z]); } continue; }
    bases.push([x, z]);
    if (ch === '~') { waters.push([x, z]); continue; }
    floors.push([x, z, ch, (c + r) % 2]);
    if (SLOPE[ch]) arrows.push([x, z, ch]);
  }
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
  const fl = new THREE.InstancedMesh(box(T, 0.4, T), shared.floor, floors.length);
  floors.forEach(([x, z, ch, alt], k) => {
    fl.setMatrixAt(k, m.makeTranslation(x, -0.2, z));
    fl.setColorAt(k, col.set(ch === ':' ? (alt ? 0xead39a : 0xe2c986) : SLOPE[ch] ? (alt ? 0x3c9f57 : 0x379a52) : alt ? 0x49b85a : 0x41ad52));
  });
  fl.receiveShadow = true;
  const wl = new THREE.InstancedMesh(new RoundedBoxGeometry(T, 0.55, T, 2, 0.09), shared.wall, walls.length);
  walls.forEach(([x, z, c, r], k) => { wl.setMatrixAt(k, m.makeTranslation(x, 0.275 - 0.12, z)); wl.setColorAt(k, col.setHSL(0.07 + ((c * 7 + r * 3) % 5) * 0.006, 0.55, 0.5 + ((c + r) % 2) * 0.05)); });
  wl.castShadow = wl.receiveShadow = true;
  const bs = new THREE.InstancedMesh(box(T, 2.2, T), shared.dirt, bases.length);
  bases.forEach(([x, z], k) => bs.setMatrixAt(k, m.makeTranslation(x, -1.5, z)));
  bs.receiveShadow = true;
  holeGroup.add(fl, wl, bs);
  if (arrows.length) {
    const ar = new THREE.InstancedMesh(new THREE.PlaneGeometry(T * 0.9, T * 0.9).rotateX(-Math.PI / 2), shared.arrow, arrows.length);
    const rot = { '^': 0, v: Math.PI, '>': -Math.PI / 2, '<': Math.PI / 2 };
    arrows.forEach(([x, z, ch], k) => ar.setMatrixAt(k, m.compose(new THREE.Vector3(x, 0.012, z), q.setFromAxisAngle(up, rot[ch]), one)));
    holeGroup.add(ar);
  }
  if (waters.length) {
    const wt = new THREE.InstancedMesh(new THREE.PlaneGeometry(T, T).rotateX(-Math.PI / 2), shared.water, waters.length);
    waters.forEach(([x, z], k) => wt.setMatrixAt(k, m.makeTranslation(x, -0.14, z)));
    wt.receiveShadow = true;
    holeGroup.add(wt);
  }
  holeMeshes.bumpers = H.bumpers.map((o) => {
    const g = new THREE.Group();
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.5, 0.5, 24), new THREE.MeshStandardMaterial({ color: 0xff4d6d, roughness: 0.35, emissive: 0xff2050, emissiveIntensity: 0 }));
    post.position.y = 0.25;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.1, 24), new THREE.MeshStandardMaterial({ color: 0xffffff }));
    cap.position.y = 0.53;
    post.castShadow = true;
    g.add(post, cap); g.position.set(o.x, 0, o.z);
    holeGroup.add(g);
    return g;
  });
  holeMeshes.mills = H.mills.map((o) => {
    const g = new THREE.Group(), blades = new THREE.Group();
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.7, 20), new THREE.MeshStandardMaterial({ color: 0x334155 }));
    hub.position.y = 0.35;

  if (world.phase === 'intro') big(`<small>Hole ${world.hole + 1} of ${HOLES.length} · Par ${H.par}</small>${esc(H.name)}`);
  else if (flashT <= 0) big(world.phase === 'play' && myBall()?.done ? '<small>waiting for the others</small>' : '');
  hudT -= dt;
  if (hudT > 0) return;
  hudT = 0.2;
  const me = myBall();
  document.getElementById('holeName').innerHTML = `Hole ${world.hole + 1}/${HOLES.length}<small>${esc(H.name)} · Par ${H.par}</small>`;
  const tl = world.phase === 'play' ? Math.max(0, Math.ceil(world.t)) : HOLE_TIME;
  document.getElementById('holeMeta').innerHTML = me ? `Strokes <b>${me.strokes}</b> · total ${score(me)} (${rel(score(me) - parSoFar(me))}) · ${tl}s left` : `${tl}s left`;
  const r = [...world.balls.values()].sort((a, c) => score(a) - parSoFar(a) - (score(c) - parSoFar(c)) || a.strokes - c.strokes);
  document.getElementById('board').innerHTML = r.map((b, i) => `<div class="row ${b.id === lobby.room?.me ? 'me' : ''}"><b>${i + 1}</b><i style="background:${b.color}"></i><span>${esc(b.nick)}</span><em>${rel(score(b) - parSoFar(b))} · ${b.holed ? '✓' : b.done ? '✗' : b.strokes}</em></div>`).join('');
  const card = document.getElementById('card');
  if (world.phase === 'score' || world.phase === 'final') {
    const rows = [...world.balls.values()].sort((a, c) => score(a) - score(c));
    const head = `<tr><th></th>${HOLES.map((h, i) => `<th>${i + 1}</th>`).join('')}<th>Tot</th></tr><tr><th>Par</th>${HOLES.map((h) => `<th>${h.par}</th>`).join('')}<th>${HOLES.reduce((s, h) => s + h.par, 0)}</th></tr>`;
    const body = rows.map((b) => `<tr><td class="n" style="color:${b.color}">${esc(b.nick)}</td>${HOLES.map((h, i) => { const v = b.scores[i]; return `<td class="${v == null ? '' : v < h.par ? 'bd' : v > h.par ? 'bg' : ''}">${v ?? '·'}</td>`; }).join('')}<td class="t">${score(b)}</td></tr>`).join('');
    const title = world.phase === 'final' ? `🏆 ${esc(rows[0]?.nick ?? '')} wins!` : `⛳ After hole ${world.hole + 1}`;
    const foot = world.phase === 'final' ? `back to lobby in ${Math.max(0, Math.ceil(world.t))}s` : `next hole in ${Math.max(0, Math.ceil(world.t))}s`;
    card.innerHTML = `<h2>${title}</h2><table>${head}${body}</table><div class="foot">${foot}</div>`;
    card.style.display = 'block';
  } else card.style.display = 'none';
}

// Run engine > sim tick (worker)
let sendT = 0;
const isHostSim = () => world.mode === 'attract' || !!lobby.room?.isHost;
function simTick(dt) {
  const room = lobby.room;
  if (!isHostSim() || !H) return;
  if (world.phase === 'play') { botTurns(dt); simBalls(dt); }
  else if (world.phase === 'intro') world.ht += dt;
  const ph = world.phase;
  phases(dt);
  if (world.mode === 'match' && room) {
    sendT -= dt; cardT -= dt;
    if (sendT <= 0 || ph !== world.phase) {
      sendT = 0.05;
      const withCard = cardT <= 0 || ph !== world.phase;
      if (withCard) cardT = 1;
      room.send(snapshot(withCard));
      playEvents(events); events = [];
    }
  } else { playEvents(events); events = []; }
}
startTicker(60, simTick);

// Run engine > render loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(10, 30, 40), camLook = new THREE.Vector3(10, 0, 8), _v = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  const hostSim = isHostSim();
  const age = hostSim ? 0 : Math.min((performance.now() - snapAt) / 1000, 0.1);
  const me = lobby.room?.me;
  for (const b of world.balls.values()) {
    let g = balls3d.get(b.id);
    if (!g) { g = makeBall(b); balls3d.set(b.id, g); g.position.set(b.x, R, b.z); }
    const tx = b.x + b.vx * age, tz = b.z + b.vz * age, a = hostSim ? 1 : 1 - Math.exp(-dt * 18);
    if (Math.hypot(tx - g.position.x, tz - g.position.z) > 3) g.position.set(tx, g.position.y, tz);
    const px = g.position.x, pz = g.position.z;
    g.position.x += (tx - px) * a; g.position.z += (tz - pz) * a;
    // roll the ball by distance travelled
    const mx = g.position.x - px, mz = g.position.z - pz, ml = Math.hypot(mx, mz);
    if (ml > 1e-5) g.userData.ball.rotateOnWorldAxis(_v.set(mz / ml, 0, -mx / ml), ml / R);
    const u = g.userData;
    u.y += ((b.holed ? -0.5 : R) - u.y) * (1 - Math.exp(-dt * (b.holed ? 6 : 20)));
    g.position.y = u.y;
    u.ball.visible = u.y > -0.4;
    u.tag.visible = !b.holed && (b.id === me || world.balls.size <= 6 || zoom < 0.7);
  }
  const mine = world.balls.get(me), mineG = balls3d.get(me);
  const ready = canAim();
  myRing.visible = !!(mineG && world.mode === 'match' && !mine.holed);
  if (myRing.visible) { myRing.position.set(mineG.position.x, 0.02, mineG.position.z); const s = ready ? 1 + Math.sin(time * 6) * 0.12 : 0.8; myRing.scale.set(s, s, s); myRing.material.color.set(ready ? 0xffffff : 0x8899aa); }
  aimArrow.visible = !!(aim && ready && aim.p > 0.02 && mineG);
  if (aimArrow.visible) {
    aimArrow.position.set(mineG.position.x, 0.03, mineG.position.z);
    aimArrow.rotation.y = aim.a + Math.PI;
    const len = 0.6 + aim.p * 4.4;
    shaft.scale.set(1, 1, len); head.position.set(0, 0, -(len + 0.2));
    aimMat.color.setHSL(0.33 - aim.p * 0.33, 0.85, 0.55);
  }
  if (H) {
    holeMeshes.mills.forEach((g) => (g.userData.blades.rotation.y = millAngle(world.ht + age)));
    holeMeshes.bumpers.forEach((g) => { const p = g.userData.pulse ?? 0; g.userData.pulse = Math.max(0, p - dt * 4); const s = 1 + p * 0.25; g.scale.set(s, 1, s); g.children[0].material.emissiveIntensity = p * 1.2; });
    if (holeMeshes.flag) holeMeshes.flag.rotation.y = Math.sin(time * 2.6) * 0.35 + 0.4;
  }
  arrowTex.offset.y -= dt * 0.9;
  waterTex.offset.x += dt * 0.05; waterTex.offset.y += dt * 0.03;
  for (let i = 0; i < CONF; i++) {
    if (confLife[i] <= 0) continue;
    confLife[i] -= dt; confVel[i * 3 + 1] -= 12 * dt;
    for (let k = 0; k < 3; k++) confPos[i * 3 + k] += confVel[i * 3 + k] * dt;
    if (confLife[i] <= 0) confPos[i * 3 + 1] = -99;
  }
  confGeo.attributes.position.needsUpdate = true; confGeo.attributes.color.needsUpdate = true;
  hud(dt);
  // camera: frame the whole hole; zoom/follow slides focus toward own ball
  if (H) {
    const w = H.cols * T, d = H.rows * T, fov = THREE.MathUtils.degToRad(camera.fov);
    const need = Math.max(d * 1.05, (w * 1.05) / camera.aspect) / (2 * Math.tan(fov / 2));
    let fx = w / 2, fz = d / 2 + 0.6, dist = need * 1.05 * zoom;
    const k = follow ? 1 : clamp((1 - zoom) / 0.6, 0, 1);
    if (mineG && world.mode === 'match' && k > 0) { fx += (mineG.position.x - fx) * k; fz += (mineG.position.z - fz) * k; if (follow) dist = Math.min(dist, need * 0.55); }
    const pitch = 0.95;
    camPos.lerp(_v.set(fx, Math.sin(pitch) * dist, fz + Math.cos(pitch) * dist), 1 - Math.exp(-dt * 4));
    camLook.lerp(_v.set(fx, 0, fz), 1 - Math.exp(-dt * 4));
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
