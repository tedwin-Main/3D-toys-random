// Field > seeded spiral tower: base disc, rising platforms, movers, crown on top

let plats = [], crownPlat = null;
const platGroup = new THREE.Group();
scene.add(platGroup);
const crown = new THREE.Group();
{
  const gold = new THREE.MeshStandardMaterial({ color: 0xffd23f, metalness: 0.9, roughness: 0.25, emissive: 0x7a5200, emissiveIntensity: 0.6 });
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.5, 24, 1, true), gold); band.position.y = 0.25;

function buildTower(seed) {

const platX = (p, t) => p.x + (p.mv ? p.ax * Math.sin(p.sp * t + p.ph) * p.amp : 0);

// Audio > jump boing, stomp, sizzle, crown fanfare, lava rumble

function audio() {

}

    u.squash = Math.max(0, u.squash - dt * 3);
    const air = clamp(p.vy / 14, -1, 1) * 0.15;
    u.body.scale.set(1 + u.squash * 0.4 - air * 0.5, 1 - u.squash * 0.5 + air, 1 + u.squash * 0.4 - air * 0.5);
    g.visible = !p.out || g.position.y > world.lava - 1;
    u.mat.opacity = p.out ? 0.3 : 1;
    u.tag.visible = !own;
  }
  for (let i = 0; i < SP; i++) {
    if (sLife[i] <= 0) continue;
    sLife[i] -= dt; sVel[i * 3 + 1] -= 12 * dt;
    for (let k = 0; k < 3; k++) sPos[i * 3 + k] += sVel[i * 3 + k] * dt;
    if (sLife[i] <= 0) sPos[i * 3 + 1] = -999;
  }
  spGeo.attributes.position.needsUpdate = true; spGeo.attributes.color.needsUpdate = true;
  for (let i = 0; i < EMB; i++) {
    ePos[i * 3 + 1] += dt * (1.5 + (i % 4) * 0.6);
    if (ePos[i * 3 + 1] > lavaY + 30) { ePos[i * 3] = camLook.x + (Math.random() - 0.5) * 50; ePos[i * 3 + 1] = lavaY + Math.random() * 2; ePos[i * 3 + 2] = camLook.z + (Math.random() - 0.5) * 50; }
  }
  embGeo.attributes.position.needsUpdate = true;
  hud(dt);
  // camera: outside the tower behind the jumper, looking in; spectators + attract follow the highest climber
  const me = world.players.get(meId);
  const focus = me && !me.out && world.mode === 'match' ? me : topAlive ?? me ?? [...world.players.values()][0];
  const fg = focus && players3d.get(focus.id);
  if (fg) {
    let want = Math.atan2(fg.position.x, fg.position.z);
    let dy = want - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    camYaw += dy * Math.min(1, dt * 3);
    const dist = 11, h = 5;
    camPos.lerp(_v.set(fg.position.x + Math.sin(camYaw) * dist, fg.position.y + h, fg.position.z + Math.cos(camYaw) * dist), 1 - Math.exp(-dt * 6));
    camLook.lerp(_v.set(fg.position.x - Math.sin(camYaw) * 2, fg.position.y + 1.2, fg.position.z - Math.cos(camYaw) * 2), 1 - Math.exp(-dt * 8));
  }
  sun.position.set(camLook.x + 10, camLook.y + 30, camLook.z + 8); sun.target.position.copy(camLook);
  lavaLight.position.set(camLook.x, lavaY + 4, camLook.z);
  lavaLight.intensity = 220 * clamp(1.4 - (camLook.y - lavaY) / 25, 0.15, 1.4);
  if (rumble) rumble.gain.value = world.mode === 'match' && world.phase === 'play' ? clamp(0.5 - (camLook.y - lavaY) / 30, 0.03, 0.5) * 0.35 : 0;
  shake = Math.max(0, shake - dt);
  camera.position.copy(camPos).add(_v.set((rng() - 0.5) * shake, (rng() - 0.5) * shake, 0));
  camera.lookAt(camLook);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
startAttract();
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
