<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dark Aero Night</title>
<meta name="category" content="aero" />
<meta name="style" content="dark" />
<meta name="order" content="19" />
<meta name="capture" content="3600" />
<meta name="tags" content="three.js, aurora shader, Reflector, UnrealBloom, glass orbs, fireflies, pentatonic bells" />
<meta name="description" content="The night-time side of the Frutiger look ('Dark Aero'): an aurora shader sky full of stars over a still lake that really reflects everything, glowing glass orbs hovering above the water with bloom, fireflies, dark hill silhouettes, and a frosted glass clock widget. Click an orb and it rings a soft pentatonic bell and pulses its light across the lake. Hard because the water is a Reflector with a custom ripple shader inside a bloom post-process chain, and the aurora is layered fbm curtains in a sky-dome shader." />
<meta name="prompt" content="Build a 'Dark Aero' night scene in three.js, one HTML file: an aurora sky-dome shader (layered fbm curtains in green, cyan and violet, plus twinkling stars), a mirror lake using Reflector with a custom ripple shader, hill silhouettes, floating glass orbs with glowing cores and bloom, firefly points, and a frosted-glass clock widget. Clicking an orb rings a pentatonic bell and pulses its glow; add gentle orbit controls and an attract mode that plays the orbs as a slow melody." />
<style>
/**
 * FILE: render-studio/frontend/demos/dark-aero-night.html
 * PURPOSE: dark aero night: aurora dome shader, Reflector lake with ripples, glass orbs with bloom, fireflies, glass clock widget, bell orbs
 * UI: Render Studio > Frutiger Aero > Dark Aero Night
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__night (ring, aurora)
 */
html, body { margin: 0; height: 100%; overflow: hidden; background: #020814; font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif; }
canvas { display: block; }
#widget { position: fixed; right: 24px; top: 24px; width: 210px; padding: 16px 18px; border-radius: 16px; color: #e6fbff; background: linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.04)); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 0 0 1px rgba(160, 230, 255, 0.18), 0 10px 30px rgba(0, 0, 0, 0.5); }
#widget::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 48%; border-radius: 16px 16px 40% 40% / 16px 16px 20px 20px; background: linear-gradient(rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)); pointer-events: none; }
#clk { font-size: 46px; font-weight: 200; letter-spacing: -1px; text-shadow: 0 0 18px rgba(120, 230, 255, 0.7); }
#wd { font-size: 13px; opacity: 0.75; }
#wx { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
#wx i { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset -7px -3px 0 0 #dff6ff; transform: rotate(-20deg); filter: drop-shadow(0 0 6px rgba(200, 240, 255, 0.8)); }
#hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: rgba(200, 240, 255, 0.55); font-size: 13px; white-space: nowrap; }
@media (max-width: 600px) { #widget { right: 12px; top: 12px; width: 160px; padding: 10px 12px; } #clk { font-size: 34px; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="widget"><div id="clk">00:00</div><div id="wd"></div><div id="wx"><i></i><span>Clear night · 12°<br><small>Aurora likely</small></span></div></div>
<div id="hint">tap an orb to ring it</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x041228, 0.012);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 2.2, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0); controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 6; controls.maxDistance = 16; controls.minPolarAngle = 1.2; controls.maxPolarAngle = 1.53; controls.minAzimuthAngle = -0.7; controls.maxAzimuthAngle = 0.7;

// Sky > aurora curtains plus stars on a dome
const NOISE = `
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f); return mix(mix(h21(i), h21(i+vec2(1,0)), f.x), mix(h21(i+vec2(0,1)), h21(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a*vn(p); p *= 2.02; a *= 0.5; } return s; }`;
const sky = new THREE.Mesh(new THREE.SphereGeometry(200, 64, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { time: { value: 0 }, amt: { value: 1 } },
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `
uniform float time; uniform float amt; varying vec3 vD;
${NOISE}
void main(){
  vec3 d = normalize(vD); float el = max(d.y, 0.0);
  vec3 col = mix(vec3(0.03, 0.09, 0.2), vec3(0.0, 0.01, 0.05), pow(el, 0.5));
  float az = atan(d.x, -d.z);
  vec3 au = vec3(0.0);
  for (int k = 0; k < 3; k++) {
    float fk = float(k);
    float band = az * (2.0 + fk) + fbm(vec2(az * 3.0 + fk * 7.0, time * 0.05 + fk)) * 3.0 + time * (0.05 + fk * 0.02);
    float curtain = pow(max(0.5 + 0.5 * sin(band), 0.0), 6.0) * fbm(vec2(az * 14.0 + fk * 3.0, el * 3.0 - time * 0.2));
    float h = smoothstep(0.05, 0.25 + fk * 0.08, el) * (1.0 - smoothstep(0.3 + fk * 0.1, 0.75, el));
    vec3 c = mix(vec3(0.1, 1.0, 0.55), vec3(0.2, 0.75, 1.0), fk * 0.5);
    c = mix(c, vec3(0.7, 0.35, 1.0), smoothstep(0.3, 0.7, el) * 0.8);
    au += c * curtain * h * (1.3 - fk * 0.3);
  }
  col += au * amt * 0.5;
  vec2 sp2 = vec2(az * 140.0, asin(clamp(d.y, -1.0, 1.0)) * 140.0); vec2 sc = floor(sp2); float st = h21(sc);
  float tw = 0.6 + 0.4 * sin(time * 2.0 + st * 60.0);
  float sd = length(fract(sp2) - 0.5 - (vec2(h21(sc + 3.1), h21(sc + 7.7)) - 0.5) * 0.5);
  col += vec3(0.9, 0.95, 1.0) * step(0.985, st) * smoothstep(0.18, 0.0, sd) * tw * smoothstep(0.02, 0.2, el);
  col += vec3(0.05, 0.25, 0.35) * pow(1.0 - el, 8.0) * 0.6;
  gl_FragColor = vec4(col, 1.0);
}`,
}));
scene.add(sky);

// Hills > layered silhouettes
[[60, 0.06, 0x031424, -70], [45, 0.09, 0x020c18, -50]].forEach(([w, a, c, z], k) => {
  const pts = []; for (let i = 0; i <= 80; i++) { const x = (i / 80 - 0.5) * w * 4; pts.push(new THREE.Vector2(x, 2 + Math.sin(i * 0.3 + k) * w * a + Math.sin(i * 0.11 + k * 2) * w * a * 1.4)); }
  pts.push(new THREE.Vector2(w * 2, -1), new THREE.Vector2(-w * 2, -1));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), new THREE.MeshBasicMaterial({ color: c, fog: false })); m.position.z = z; scene.add(m);
});

// Lake > Reflector with ripple and darkening shader
const lake = new Reflector(new THREE.PlaneGeometry(400, 400), {
  textureWidth: Math.floor(innerWidth * 0.75), textureHeight: Math.floor(innerHeight * 0.75), clipBias: 0.003,
  shader: {
    uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, time: { value: 0 } },
    vertexShader: `
uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vW;
#include <common>
#include <logdepthbuf_pars_vertex>
void main(){ vUv = textureMatrix * vec4(position, 1.0); vW = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
#include <logdepthbuf_vertex>
}`,
    fragmentShader: `
uniform vec3 color; uniform sampler2D tDiffuse; uniform float time; varying vec4 vUv; varying vec3 vW;
#include <logdepthbuf_pars_fragment>
void main(){
#include <logdepthbuf_fragment>
  vec2 w = vW.xz;
  vec2 rip = vec2(sin(w.x * 1.7 + time * 1.3) + sin(w.y * 2.3 - time * 0.9), cos(w.y * 1.9 + time * 1.1) + sin(w.x * 2.9 + time)) * 0.006;
  vec4 uv = vUv; uv.xy += rip * 0.5 * uv.w;
  vec3 base = texture2DProj(tDiffuse, uv).rgb;
  float dist = length(w - cameraPosition.xz);
  vec3 col = base * color * (0.85 - smoothstep(10.0, 120.0, dist) * 0.3) + vec3(0.0, 0.02, 0.05);
  gl_FragColor = vec4(col, 1.0);
#include <tonemapping_fragment>
#include <colorspace_fragment>
}`,
  },
});
lake.material.uniforms.color.value = new THREE.Color(0x9fc8e0);
lake.rotation.x = -Math.PI / 2; scene.add(lake);

// Orbs > glass shells with glowing cores and point lights
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
const HUES = [0.47, 0.52, 0.56, 0.6, 0.72, 0.8, 0.36];
const orbs = [];
const shellG = new THREE.SphereGeometry(0.62, 48, 32), coreG = new THREE.SphereGeometry(0.2, 24, 16);
PENTA.forEach((f, i) => {
  const g = new THREE.Group(), col = new THREE.Color().setHSL(HUES[i], 0.9, 0.6);
  const shell = new THREE.Mesh(shellG, new THREE.MeshPhysicalMaterial({ color: 0xbfefff, roughness: 0.05, metalness: 0, transmission: 0, transparent: true, opacity: 0.22, clearcoat: 1, iridescence: 0.8, iridescenceIOR: 1.4, emissive: col, emissiveIntensity: 0.15, depthWrite: false }));
  const core = new THREE.Mesh(coreG, new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(2.2) }));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.66, 32, 20), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { c: { value: col }, k: { value: 0.6 } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(max(1.0 - abs(dot(vN, vV)), 0.0), 2.5); gl_FragColor = vec4(c * f * k * 2.0, 1.0); }',
  }));
  const light = new THREE.PointLight(col, 3, 9, 2);
  g.add(shell, core, halo, light);
  const a = (i / (PENTA.length - 1) - 0.5) * 2;
  g.position.set(a * 6.2, 1.6 + Math.abs(a) * 0.6 + (i % 2) * 1.2, -Math.abs(a) * 3 + (i % 2 ? -1.5 : 0.8));
  g.userData = { i, base: g.position.y, pulse: 0, core, halo, light, shell };
  scene.add(g); orbs.push(g);
});
scene.add(new THREE.AmbientLight(0x223355, 0.6));

// Fireflies > additive points with drift
const NF = 160, fp = new Float32Array(NF * 3), fs = [];
for (let i = 0; i < NF; i++) { fs.push({ x: (Math.random() - 0.5) * 30, y: 0.3 + Math.random() * 4, z: (Math.random() - 0.5) * 20 - 3, p: Math.random() * 6.28, s: 0.3 + Math.random() * 0.6 }); }
const fGeo = new THREE.BufferGeometry(); fGeo.setAttribute('position', new THREE.BufferAttribute(fp, 3));
const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, 'rgba(255,255,220,1)'); g.addColorStop(0.3, 'rgba(220,255,150,0.6)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c); })();
const flies = new THREE.Points(fGeo, new THREE.PointsMaterial({ size: 0.22, map: dot, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xd8ff8a }));
scene.add(flies);

// Post > bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.7); composer.addPass(bloom);
composer.addPass(new OutputPass());
function fit() { camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 72 : 50; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); }
fit(); addEventListener('resize', fit);

// Bells > soft sine partials with long tail
let ac = null;
function bell(f) {
  try { ac = ac || new AudioContext(); } catch { return; }
  const t = ac.currentTime, out = ac.createGain(); out.gain.value = 0.12; out.connect(ac.destination);
  [[1, 1, 3], [2.76, 0.35, 1.6], [5.4, 0.15, 0.8], [0.5, 0.3, 2.5]].forEach(([m, v, d]) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f * m; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(out); o.start(t); o.stop(t + d + 0.05); });
}
function ring(i, sound = true) { const o = orbs[i % orbs.length]; o.userData.pulse = 1; if (sound && ac) bell(PENTA[o.userData.i]); }
const ray = new THREE.Raycaster(), mp = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  mp.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mp, camera);
  const h = ray.intersectObjects(orbs.map((o) => o.userData.shell), false)[0];
  if (h) { const o = orbs.find((g) => g.userData.shell === h.object); o.userData.pulse = 1; bell(PENTA[o.userData.i]); }
});

// Loop > float, pulse, flies, aurora, attract melody
const MEL = [0, 2, 4, 3, 1, 5, 4, 6, 2, 0];
let lastInput = -1e9, aT = 0, aI = 0, lastMin = -1;
['pointerdown', 'wheel'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true, passive: true }));
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  sky.material.uniforms.time.value = t; lake.material.uniforms.time.value = t;
  orbs.forEach((o) => {
    const u = o.userData; u.pulse = Math.max(0, u.pulse - dt * 0.8);
    o.position.y = u.base + Math.sin(t * 0.8 + u.i * 1.3) * 0.18; o.rotation.y = t * 0.2 + u.i;
    const p = u.pulse * u.pulse; o.scale.setScalar(1 + p * 0.18);
    u.light.intensity = 3 + p * 30; u.halo.material.uniforms.k.value = 0.6 + p * 2.5; u.core.scale.setScalar(1 + p * 1.2);
  });
  fs.forEach((f, i) => { f.p += dt * f.s; fp[i * 3] = f.x + Math.sin(f.p) * 0.8; fp[i * 3 + 1] = f.y + Math.sin(f.p * 1.7) * 0.3; fp[i * 3 + 2] = f.z + Math.cos(f.p * 0.9) * 0.8; });
  fGeo.attributes.position.needsUpdate = true; flies.material.opacity = 0.7 + Math.sin(t * 3) * 0.3;
  if (performance.now() - lastInput > 6000) { aT += dt; if (aT > 0.9) { aT = 0; ring(MEL[aI++ % MEL.length]); } controls.autoRotate = true; controls.autoRotateSpeed = 0.35; } else controls.autoRotate = false;
  const d = new Date(); if (d.getMinutes() !== lastMin) { lastMin = d.getMinutes(); document.getElementById('clk').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); document.getElementById('wd').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' }); }
  controls.update(); composer.render();
});
window.__night = { ring: (i) => ring(i), aurora: (v) => (sky.material.uniforms.amt.value = v) };
</script>
</body>
</html>
