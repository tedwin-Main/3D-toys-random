renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; down = null;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  let best = null, bd = 1e9; for (const sp of SPECIES) { const d = ray.ray.distanceSqToPoint(sp.target); if (d < bd) { bd = d; best = sp; } }
  const pt = new THREE.Vector3(); ray.ray.closestPointToPoint(best.target, pt); scatter(pt);
});

let last = performance.now(), nextAuto = 6;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; clockT += dt; uTime.value = clockT;
  if (now - lastInput > 10000) { controls.autoRotate = true; if (clockT > nextAuto) { nextAuto = clockT + 9; scatter(); } }
  boids(dt, clockT);
  // turtle
  turtleA += dt * 0.09; const tr = 9; turtle.position.set(Math.cos(turtleA) * tr, 6.5 + Math.sin(turtleA * 2) * 0.8, Math.sin(turtleA) * tr * 0.7);
  turtle.lookAt(Math.cos(turtleA + 0.05) * tr, 6.5 + Math.sin((turtleA + 0.05) * 2) * 0.8, Math.sin(turtleA + 0.05) * tr * 0.7); turtle.rotateZ(0.18);
  const fl = Math.sin(clockT * 1.6); flippers.forEach((f, i) => (f.rotation.z = (i % 2 ? -1 : 1) * fl * (i < 2 ? 0.55 : 0.25)));
  // bubbles
  bub.forEach((b, i) => { if (b.p.y > 14) { b.p.y = -50; b.next = clockT + rr(0, 4); } if (b.p.y < -10 && i < 90 && clockT > b.next) spawnBubble(b);
    if (b.p.y > -10) { b.p.y += b.v * dt; b.p.x += Math.sin(clockT * 3 + b.ph) * 0.01; b.r *= 1 + dt * 0.04; }
    dummy.position.copy(b.p); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(b.r); dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix); });
  bubbles.instanceMatrix.needsUpdate = true;
  // snow + rays
  for (let i = 0; i < NS; i++) { let y = sp[i * 3 + 1] - dt * 0.15; if (y < 0) y = 16; sp[i * 3 + 1] = y; sp[i * 3] += Math.sin(clockT * 0.3 + i) * dt * 0.05; }
  sg.attributes.position.needsUpdate = true;
  rays.forEach((r) => { r.rotation.set(0, Math.atan2(camera.position.x - r.position.x, camera.position.z - r.position.z), r.userData.tilt + Math.sin(clockT * 0.3 + r.userData.ph) * 0.05); });
  controls.update(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

window.__reef = { scatter: () => scatter(), fish: () => fish.length, turtle: () => turtle.position.toArray().map((v) => +v.toFixed(2)) };
