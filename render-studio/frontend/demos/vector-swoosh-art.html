<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vector Swoosh Art</title>
<meta name="category" content="aero" />
<meta name="style" content="vectorheart" />
<meta name="order" content="24" />
<meta name="capture" content="2600" />
<meta name="tags" content="2007 vector wallpaper, seeded generator, bezier ribbons, halftone, canvas export" />
<meta name="description" content="A generator for the 2007 'vector art' desktop wallpaper: flowing bezier swooshes with fine white pinstripe edges, halftone dot fields, concentric rings, four-point sparkles, flower and butterfly silhouettes and curling vines over a glowing gradient. Every layout comes from one seed: Shuffle picks a new one with a cross-fade, palette chips recolour the same layout, and Download saves a PNG. Hard because everything is seeded and layered with blend modes, so a seed always rebuilds the same piece, and the swooshes keep breathing while the sparkles twinkle." />
<meta name="prompt" content="Build a 2007-style vector wallpaper generator in one HTML canvas page: seeded random layouts of flowing bezier swoosh bands with fine white parallel stroke lines, halftone dot fields, concentric rings, four-point sparkles, flower and butterfly silhouettes and spiral vines over a radial gradient. Add palette chips that recolour the same seed, a Shuffle button with cross-fade, a PNG download, gentle animation (breathing swooshes, twinkling sparkles) and an attract mode." />
<style>
/**
 * FILE: render-studio/frontend/demos/vector-swoosh-art.html
 * PURPOSE: 2007 vector wallpaper generator: seeded swooshes, halftone, rings, sparkles, flowers, butterflies, palette chips, PNG export
 * UI: Render Studio > Frutiger Aero > Vector Swoosh Art
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__swoosh (shuffle, palette, seed)
 */
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 26px; background: rgba(255, 255, 255, 0.18); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 6px 20px rgba(0, 0, 0, 0.25); }
#ui button { font: inherit; font-size: 14px; font-weight: 700; color: #fff; border: 0; border-radius: 18px; padding: 8px 18px; cursor: pointer; background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.12) 50%, rgba(255, 255, 255, 0.05) 51%, rgba(255, 255, 255, 0.22)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
.chip { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.8); }
.chip.on { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px rgba(255, 255, 255, 0.6), 0 0 10px #fff; }
#seed { color: rgba(255, 255, 255, 0.8); font-size: 12px; min-width: 60px; text-align: center; }
@media (max-width: 520px) { #seed { display: none; } #ui { gap: 6px; padding: 6px 8px; } #ui button { padding: 7px 12px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"><button id="shuf">Shuffle</button><span id="chips"></span><span id="seed"></span><button id="dl">Download</button></div>
<script>
const $ = (s) => document.querySelector(s);
const cv = $('#cv'), x = cv.getContext('2d');
const PAL = [
  { n: 'Lagoon', bg: ['#b8f5e6', '#1fb3a8', '#05445e'], a: ['#ffffff', '#c9ff7a', '#5fe0ff', '#ffe066'] },
  { n: 'Ultraviolet', bg: ['#f6c8ff', '#8a4fd6', '#1b0b4a'], a: ['#ffffff', '#ff8ad8', '#7ad6ff', '#fff27a'] },
  { n: 'Sunset', bg: ['#fff1b8', '#ff7a3d', '#8a1446'], a: ['#ffffff', '#ffe066', '#ff4f8a', '#ffd0a8'] },
  { n: 'Spring', bg: ['#f2ffd8', '#6cc94a', '#1c5e1a'], a: ['#ffffff', '#ffe066', '#a8ff8a', '#ff9ad0'] },
  { n: 'Ice', bg: ['#e8f7ff', '#4aa8f5', '#0b2f6b'], a: ['#ffffff', '#bfe6ff', '#9ffff0', '#d8c8ff'] },
];
let pal = 0, seed = 2007, prevSnap = null, fade = 0;
const chips = $('#chips');
chips.style.display = 'flex'; chips.style.gap = '6px';
PAL.forEach((p, i) => { const c = document.createElement('span'); c.className = 'chip'; c.title = p.n; c.style.background = `linear-gradient(135deg, ${p.bg[0]}, ${p.bg[1]} 50%, ${p.bg[2]})`; c.onclick = () => palette(i); chips.append(c); });

// Seeded rng > mulberry32
function rng(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// Layout > built once per seed, drawn every frame
let L = null;
function build() {
  const r = rng(seed), R = (a, b) => a + r() * (b - a);
  L = {
    glow: [R(0.2, 0.8), R(0.2, 0.6)],
    sw: Array.from({ length: 4 + Math.floor(r() * 3) }, () => ({ y: R(0.15, 0.85), a: R(0.08, 0.25), f: R(0.6, 1.6), ph: R(0, 6), w: R(0.04, 0.16), c: Math.floor(R(0, 4)), lines: 3 + Math.floor(R(0, 6)), sp: R(0.15, 0.4) })),
    dots: Array.from({ length: 2 }, () => ({ x: R(0.05, 0.85), y: R(0.05, 0.75), w: R(0.15, 0.3), h: R(0.1, 0.25), s: R(10, 16), c: Math.floor(R(0, 4)) })),
    rings: Array.from({ length: 3 + Math.floor(r() * 3) }, () => ({ x: R(0, 1), y: R(0, 1), r: R(0.04, 0.16), n: 2 + Math.floor(R(0, 5)), c: Math.floor(R(0, 4)) })),
    spark: Array.from({ length: 30 }, () => ({ x: R(0, 1), y: R(0, 1), s: R(3, 14), ph: R(0, 6) })),
    flow: Array.from({ length: 4 + Math.floor(r() * 4) }, () => ({ x: R(0, 1), y: R(0.4, 1), s: R(0.03, 0.08), rot: R(0, 6), c: Math.floor(R(0, 4)), p: 5 + Math.floor(R(0, 3)) })),
    bfly: Array.from({ length: 3 + Math.floor(r() * 3) }, () => ({ x: R(0.05, 0.95), y: R(0.05, 0.6), s: R(0.025, 0.06), rot: R(-0.6, 0.6), c: Math.floor(R(0, 4)), ph: R(0, 6) })),
    vines: Array.from({ length: 3 }, () => ({ x: R(0, 1), y: R(0.5, 1), s: R(0.06, 0.14), dir: r() < 0.5 ? -1 : 1, c: Math.floor(R(0, 4)) })),
  };
  $('#seed').textContent = '#' + seed;
}
function size() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; }
size(); addEventListener('resize', size);
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

function draw(t) {
  const W = cv.width, H = cv.height, P = PAL[pal], M = Math.min(W, H), A = P.a;
  x.globalCompositeOperation = 'source-over';
  const g = x.createRadialGradient(W * L.glow[0], H * L.glow[1], 0, W * L.glow[0], H * L.glow[1], Math.hypot(W, H) * 0.8); g.addColorStop(0, P.bg[0]); g.addColorStop(0.35, P.bg[1]); g.addColorStop(1, P.bg[2]); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // Halftone > dots shrink across the field
  L.dots.forEach((d) => { const sp = d.s * (W / 1280) * 1.4; x.fillStyle = hexA(A[d.c], 0.35); for (let px = 0; px < d.w * W; px += sp) for (let py = 0; py < d.h * H; py += sp) { const k = 1 - Math.hypot(px / (d.w * W), py / (d.h * H)) / 1.2; if (k <= 0) continue; x.beginPath(); x.arc(d.x * W + px, d.y * H + py, sp * 0.42 * k, 0, 7); x.fill(); } });
  // Rings > concentric outlines
  L.rings.forEach((rg) => { x.strokeStyle = hexA(A[rg.c], 0.45); for (let k = 0; k < rg.n; k++) { x.lineWidth = Math.max(1, M * 0.004 * (k + 1)); x.beginPath(); x.arc(rg.x * W, rg.y * H, rg.r * M * (1 + k * 0.35), 0, 7); x.stroke(); } });
  // Swooshes > filled band plus parallel pinstripes
  x.globalCompositeOperation = 'screen';
  L.sw.forEach((s, i) => {
    const yAt = (u, o) => H * (s.y + Math.sin(u * Math.PI * s.f + s.ph + t * s.sp) * s.a + o * s.w * (0.4 + 0.6 * Math.sin(u * Math.PI)));
    x.beginPath(); for (let u = 0; u <= 1.001; u += 0.02) x.lineTo(u * W, yAt(u, -0.5)); for (let u = 1; u >= -0.001; u -= 0.02) x.lineTo(u * W, yAt(u, 0.5)); x.closePath();
    const lg = x.createLinearGradient(0, 0, W, 0); lg.addColorStop(0, hexA(A[s.c], 0)); lg.addColorStop(0.5, hexA(A[s.c], 0.35)); lg.addColorStop(1, hexA(A[s.c], 0.05)); x.fillStyle = lg; x.fill();
    x.lineWidth = Math.max(1, M * 0.0016);
    for (let k = 0; k < s.lines; k++) { const o = -0.5 + k / Math.max(1, s.lines - 1); x.strokeStyle = `rgba(255,255,255,${0.15 + 0.35 * (1 - Math.abs(o))})`; x.beginPath(); for (let u = 0; u <= 1.001; u += 0.02) x.lineTo(u * W, yAt(u, o)); x.stroke(); }
  });
  x.globalCompositeOperation = 'source-over';
  // Vines > spiral curls on a stem
  L.vines.forEach((v) => { x.strokeStyle = hexA(A[v.c], 0.7); x.lineWidth = Math.max(1.5, M * 0.004); x.lineCap = 'round'; const cx = v.x * W, cy = v.y * H, S = v.s * M; x.beginPath(); for (let a = 0; a < Math.PI * 5; a += 0.08) { const rr = S * (1 - a / (Math.PI * 5)); x.lineTo(cx + Math.cos(a * v.dir) * rr, cy + Math.sin(a * v.dir) * rr); } x.stroke(); x.beginPath(); x.moveTo(cx + S, cy); x.quadraticCurveTo(cx + S * 1.6, cy + S * 1.5, cx + S * 0.6 * v.dir, cy + S * 3); x.stroke(); });
  // Flowers > petal rosettes
  L.flow.forEach((f) => { const cx = f.x * W, cy = f.y * H, S = f.s * M; x.save(); x.translate(cx, cy); x.rotate(f.rot + t * 0.05); x.fillStyle = hexA(A[f.c], 0.85); for (let k = 0; k < f.p; k++) { x.rotate((Math.PI * 2) / f.p); x.beginPath(); x.ellipse(0, -S * 0.55, S * 0.28, S * 0.55, 0, 0, 7); x.fill(); } x.fillStyle = hexA(P.bg[1], 0.9); x.beginPath(); x.arc(0, 0, S * 0.22, 0, 7); x.fill(); x.restore(); });
  // Butterflies > wing flap via scaleX
  L.bfly.forEach((b) => { const cx = b.x * W, cy = b.y * H, S = b.s * M; x.save(); x.translate(cx, cy + Math.sin(t + b.ph) * S * 0.2); x.rotate(b.rot); x.fillStyle = hexA(A[b.c], 0.9); const fl = 0.55 + 0.45 * Math.abs(Math.sin(t * 3 + b.ph)); [-1, 1].forEach((sd) => { x.save(); x.scale(sd * fl, 1); x.beginPath(); x.moveTo(0, 0); x.bezierCurveTo(S * 0.6, -S * 1.1, S * 1.3, -S * 0.6, S * 0.9, 0); x.bezierCurveTo(S * 1.2, S * 0.5, S * 0.5, S * 0.9, 0, S * 0.2); x.fill(); x.restore(); }); x.fillRect(-S * 0.04, -S * 0.3, S * 0.08, S * 0.7); x.restore(); });
  // Sparkles > four-point stars twinkle
  x.globalCompositeOperation = 'lighter';
  L.spark.forEach((s) => { const k = 0.5 + 0.5 * Math.sin(t * 2.2 + s.ph), S = s.s * (W / 1280) * 1.6 * k; if (S < 0.5) return; x.fillStyle = `rgba(255,255,255,${0.5 + k * 0.5})`; x.beginPath(); const cx = s.x * W, cy = s.y * H; x.moveTo(cx, cy - S * 2); x.quadraticCurveTo(cx, cy, cx + S * 2, cy); x.quadraticCurveTo(cx, cy, cx, cy + S * 2); x.quadraticCurveTo(cx, cy, cx - S * 2, cy); x.quadraticCurveTo(cx, cy, cx, cy - S * 2); x.fill(); });
  x.globalCompositeOperation = 'source-over';
  if (prevSnap && fade > 0) { x.globalAlpha = fade; x.drawImage(prevSnap, 0, 0, W, H); x.globalAlpha = 1; }
}

// Actions > shuffle with crossfade, palette, download
function snap() { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.getContext('2d').drawImage(cv, 0, 0); prevSnap = c; fade = 1; }
function shuffle(s) { snap(); seed = s ?? Math.floor(Math.random() * 99999); build(); }
function palette(i) { snap(); pal = i; document.querySelectorAll('.chip').forEach((c, k) => c.classList.toggle('on', k === i)); }
$('#shuf').onclick = () => shuffle();
$('#dl').onclick = () => cv.toBlob((b) => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `vector-swoosh-${seed}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); shuffle(); } if (/^[1-5]$/.test(e.key)) palette(+e.key - 1); });

let lastInput = -1e9, aT = 0, last = performance.now();
['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true }));
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  fade = Math.max(0, fade - dt * 1.5);
  draw(now / 1000);
  if (now - lastInput > 8000) { aT += dt; if (aT > 6) { aT = 0; if (Math.random() < 0.5) palette((pal + 1) % PAL.length); else shuffle(); } }
  requestAnimationFrame(frame);
}
build(); palette(0); fade = 0; requestAnimationFrame(frame);
window.__swoosh = { shuffle, palette, seed: () => seed };
</script>
</body>
</html>
