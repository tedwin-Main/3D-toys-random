<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glass Media Player</title>
<meta name="category" content="aero" />
<meta name="style" content="core" />
<meta name="order" content="8" />
<meta name="capture" content="4200" />
<meta name="tags" content="2006 media player, canvas visualizer, WebAudio, AnalyserNode, feedback effect" />
<meta name="description" content="A glossy black-glass media player from the mid-2000s, with no logos. It has a glowing round play orb, a gel seek bar, a playlist pane with procedural album art, and three classic visualizers: Ambience (a canvas feedback swirl), Bars with mirror reflections and falling peak caps, and a polar Scope. The music is an original synthesized chill-out loop (pad chords, arpeggio, sub bass, kick and hats) scheduled in WebAudio and read back through an AnalyserNode. Hard because the swirl re-draws its own last frame zoomed and rotated every tick, so the colours have to stay bright without washing out to white." />
<meta name="prompt" content="Build a 2006-style glossy media player in one HTML file with no images and no real logos: black glass frame with blue glow, a big round play orb, gel seek and volume bars, a playlist with procedural album art. Synthesize an original chill electronic loop in WebAudio (pads, arpeggio, bass, kick, hats), feed it through an AnalyserNode and draw three visualizers on canvas: a feedback 'ambience' swirl, mirrored bars with peak caps, and a polar oscilloscope. Add an attract mode that animates without audio." />
<style>
/**
 * FILE: render-studio/frontend/demos/media-player-visualizer.html
 * PURPOSE: 2006 glossy media player: play orb, seek/volume gel bars, playlist art, 3 canvas visualizers fed by a synthesized WebAudio loop
 * UI: Render Studio > Frutiger Aero > Glass Media Player
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__player (play, mode, next)
 */
:root { --glow: #3fb6ff; --font: "Segoe UI", Tahoma, "Helvetica Neue", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 12px var(--font); color: #d8e6f2; user-select: none; -webkit-user-select: none; }
body { background: radial-gradient(ellipse at 50% 120%, #0d4a7a, transparent 60%), linear-gradient(#020812, #08203a); display: grid; place-items: center; }
#app { width: min(960px, calc(100vw - 24px)); height: min(600px, calc(100vh - 24px)); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(#2a2f38, #0c0f14 40px, #05070a); box-shadow: 0 0 0 1px #000, inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(63, 182, 255, 0.15); }

/* Top > glossy tab strip */
.top { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 10px; position: relative; background: linear-gradient(#4a525e, #1c2129 50%, #0d1015 51%, #1e252e); border-bottom: 1px solid #000; }
.top::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.04)); pointer-events: none; }
.tab { padding: 6px 14px; border-radius: 4px; font-size: 13px; color: #c9d6e2; cursor: pointer; }
.tab.on { color: #fff; background: linear-gradient(rgba(120, 200, 255, 0.35), rgba(30, 110, 200, 0.35)); box-shadow: inset 0 0 0 1px rgba(160, 220, 255, 0.5), 0 0 10px rgba(63, 182, 255, 0.4); text-shadow: 0 0 6px var(--glow); }
.brand { margin-left: auto; font-size: 11px; color: #7f93a6; letter-spacing: 1px; }

/* Middle > visualizer + playlist */
.mid { flex: 1; display: flex; min-height: 0; }
#vis { flex: 1; min-width: 0; display: block; width: 100%; height: 100%; background: #000; }
.side { width: 250px; flex: none; display: flex; flex-direction: column; background: linear-gradient(90deg, #0c1118, #121924); border-left: 1px solid #000; box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.08); }
.art { margin: 14px auto 8px; width: 150px; height: 150px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 6px 16px rgba(0, 0, 0, 0.8); -webkit-box-reflect: below 4px linear-gradient(transparent 60%, rgba(255, 255, 255, 0.25)); }
.meta { text-align: center; padding: 18px 10px 8px; }
.meta b { display: block; font-size: 14px; color: #fff; }
.meta span { color: #8fa6bb; }
.plist { flex: 1; overflow: auto; border-top: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }
.plist div { display: flex; justify-content: space-between; padding: 5px 12px; color: #b9c8d6; cursor: pointer; }
.plist div:hover { background: rgba(63, 182, 255, 0.12); }
.plist div.on { color: #fff; background: linear-gradient(rgba(63, 182, 255, 0.35), rgba(20, 90, 170, 0.35)); text-shadow: 0 0 6px var(--glow); }
.vmodes { display: flex; gap: 4px; padding: 8px; border-top: 1px solid #000; }
.vmodes span { flex: 1; text-align: center; padding: 4px 0; border-radius: 3px; background: rgba(255, 255, 255, 0.06); cursor: pointer; font-size: 11px; }
.vmodes span.on { background: rgba(63, 182, 255, 0.35); color: #fff; box-shadow: 0 0 8px rgba(63, 182, 255, 0.4); }

/* Bottom > transport: seek, play orb, volume */
.bot { height: 96px; flex: none; position: relative; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: linear-gradient(#262c35, #0b0e12 50%, #000 51%, #10151c); border-top: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15); }
.seek { position: absolute; left: 0; right: 0; top: 0; height: 7px; background: #05080c; cursor: pointer; box-shadow: inset 0 1px 2px #000; }
.seek i { display: block; height: 100%; width: 0; background: linear-gradient(#bfe8ff, #3fb6ff 50%, #1677c9 51%, #6fd0ff); box-shadow: 0 0 8px var(--glow); }
.time { font: 12px monospace; color: #8fa6bb; width: 92px; }
.ctl { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
.sb { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: #cfe3f5; background: radial-gradient(circle at 50% 25%, #59626e, #1b2027 60%, #07090c); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 0 0 1px #000; }
.sb svg { width: 13px; height: 13px; }
#orb { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; position: relative; color: #fff; background: radial-gradient(circle at 50% 85%, #9fe3ff, #1f8fe0 45%, #0a3b78 75%, #031a38); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), 0 0 0 2px #000, 0 0 22px rgba(63, 182, 255, 0.6); transition: box-shadow 0.2s, transform 0.1s; }
#orb::before { content: ''; position: absolute; left: 10px; right: 10px; top: 4px; height: 28px; border-radius: 50%; background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.05)); }
#orb svg { width: 26px; height: 26px; position: relative; filter: drop-shadow(0 0 4px #9fe3ff); }
#orb:hover { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5), 0 0 0 2px #000, 0 0 34px rgba(100, 210, 255, 0.95); }
#orb:active { transform: scale(0.96); }
.vol { width: 120px; display: flex; align-items: center; gap: 8px; color: #8fa6bb; }
.vol input { flex: 1; min-width: 0; width: 80px; accent-color: var(--glow); }

@media (max-width: 700px) {
  #app { height: calc(100vh - 16px); width: calc(100vw - 16px); }
  .mid { flex-direction: column; }
  .side { width: auto; height: 190px; flex-direction: row; flex-wrap: wrap; }
  .art { width: 80px; height: 80px; margin: 10px; -webkit-box-reflect: unset; }
  .meta { flex: 1; text-align: left; padding: 18px 6px 0 0; }
  .plist { display: none; }
  .vmodes { width: 100%; }
  .vol, .brand { display: none; }
  .time { width: 70px; font-size: 11px; }
  .tab:nth-child(n+3) { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="tab on">Now Playing</span><span class="tab">Library</span><span class="tab">Rip</span><span class="tab">Burn</span><span class="tab">Sync</span><span class="brand">GLASS PLAYER</span></div>
  <div class="mid">
    <canvas id="vis"></canvas>
    <div class="side">
      <canvas class="art" id="art" width="300" height="300"></canvas>
      <div class="meta"><b id="mt"></b><span id="ma"></span></div>
      <div class="plist" id="plist"></div>
      <div class="vmodes" id="vmodes"><span data-m="swirl" class="on">Ambience</span><span data-m="bars">Bars</span><span data-m="scope">Scope</span></div>
    </div>
  </div>
  <div class="bot">
    <div class="seek" id="seek"><i id="seekI"></i></div>
    <div class="time" id="time">0:00 / 0:00</div>
    <div class="ctl">
      <span class="sb" id="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></span>
      <div id="orb" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" id="orbI"><path d="M7 4v16l13-8z"/></svg></div>
      <span class="sb" id="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></span>
    </div>
    <div class="vol">🔈<input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" /></div>
  </div>
</div>
<script>
const $ = (s) => document.querySelector(s);

// Tracks > original synth loops: key root, chord set, tempo, palette hue
const TRACKS = [
  { title: 'Glass Horizon', artist: 'Synth Demo', root: 50, bpm: 96, hue: 200, prog: [[0, 4, 7, 11], [9, 12, 16, 19], [5, 9, 12, 16], [7, 11, 14, 17]] },
  { title: 'Aqua Drift', artist: 'Synth Demo', root: 53, bpm: 88, hue: 170, prog: [[0, 3, 7, 10], [5, 8, 12, 15], [8, 12, 15, 19], [7, 10, 14, 17]] },
  { title: 'Bubble Garden', artist: 'Synth Demo', root: 48, bpm: 104, hue: 110, prog: [[0, 4, 7, 9], [5, 9, 12, 14], [2, 5, 9, 12], [7, 11, 14, 16]] },
  { title: 'Aurora Tape', artist: 'Synth Demo', root: 45, bpm: 80, hue: 280, prog: [[0, 3, 7, 10], [8, 12, 15, 19], [3, 7, 10, 14], [10, 14, 17, 21]] },
];
const LEN = 64; // seconds per track loop
let ti = 0;

// Album art > procedural sky orb per track
function paintArt() {
  const c = $('#art'), x = c.getContext('2d'), t = TRACKS[ti], w = 300;
  const g = x.createLinearGradient(0, 0, 0, w); g.addColorStop(0, `hsl(${t.hue},80%,22%)`); g.addColorStop(1, `hsl(${t.hue + 40},85%,60%)`);
  x.fillStyle = g; x.fillRect(0, 0, w, w);
  for (let i = 0; i < 40; i++) { x.fillStyle = `hsla(${t.hue + i * 4},90%,75%,${0.05 + (i % 5) * 0.03})`; x.beginPath(); x.arc((i * 73) % w, (i * 151) % w, 6 + (i % 7) * 9, 0, 7); x.fill(); }
  const og = x.createRadialGradient(130, 120, 10, 150, 150, 90); og.addColorStop(0, '#fff'); og.addColorStop(0.3, `hsl(${t.hue},90%,75%)`); og.addColorStop(1, `hsla(${t.hue},90%,40%,0)`);
  x.fillStyle = og; x.beginPath(); x.arc(150, 150, 90, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.9)'; x.font = '600 22px "Segoe UI", sans-serif'; x.textAlign = 'center'; x.fillText(t.title, 150, 275);
}
function renderMeta() {
  const t = TRACKS[ti];
  $('#mt').textContent = t.title; $('#ma').textContent = t.artist;
  $('#plist').innerHTML = TRACKS.map((k, i) => `<div data-i="${i}" class="${i === ti ? 'on' : ''}"><span>${k.title}</span><span>1:04</span></div>`).join('');
  paintArt();
}
$('#plist').onclick = (e) => { const r = e.target.closest('[data-i]'); if (r) setTrack(+r.dataset.i); };

// Audio > scheduler: pads, arpeggio, sub bass, kick, hats into master > analyser
let ac = null, master, analyser, freq, wave, playing = false, startAt = 0, nextStep = 0, stepN = 0, paused = 0;
const hz = (m) => 440 * 2 ** ((m - 69) / 12);
function initAudio() {
  ac = new AudioContext();
  master = ac.createGain(); master.gain.value = +$('#vol').value * 0.6;
  analyser = ac.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.78;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp).connect(analyser).connect(ac.destination);
  freq = new Uint8Array(analyser.frequencyBinCount); wave = new Uint8Array(analyser.fftSize);
}
function env(node, t, a, peak, d) { node.gain.setValueAtTime(0.0001, t); node.gain.exponentialRampToValueAtTime(peak, t + a); node.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function voice(type, f, t, a, peak, d, cut = 4000) {
  const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(); o.type = type; o.frequency.value = f; lp.frequency.value = cut;
  env(g, t, a, peak, d); o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + a + d + 0.05);
}
function kick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); env(g, t, 0.003, 0.9, 0.3); o.connect(g).connect(master); o.start(t); o.stop(t + 0.35); }
let noiseBuf = null;
function hat(t, v) {
  if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.1, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 7000; env(g, t, 0.002, v, 0.05);
  s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t + 0.08);
}
function schedule() {
  const tr = TRACKS[ti], s16 = 60 / tr.bpm / 4;
  while (nextStep < ac.currentTime + 0.2) {
    const t = nextStep, bar = Math.floor(stepN / 16), st = stepN % 16, ch = tr.prog[bar % 4];
    if (st === 0) ch.forEach((n) => { voice('sawtooth', hz(tr.root + 12 + n), t, 0.4, 0.035, s16 * 16, 1400); voice('triangle', hz(tr.root + 12 + n) * 1.004, t, 0.5, 0.03, s16 * 16, 2000); });
    if (st % 2 === 0) voice('square', hz(tr.root + 24 + ch[(st / 2) % 4] + (st > 7 ? 12 : 0)), t, 0.005, 0.03, s16 * 1.6, 2600);
    if (st % 4 === 0) kick(t);
    if (st % 4 === 2) voice('sine', hz(tr.root - 12 + ch[0]), t, 0.01, 0.22, s16 * 3);
    if (st % 2 === 1) hat(t, st % 4 === 3 ? 0.12 : 0.05);
    nextStep += s16; stepN++;
  }
}
function play() {
  if (!ac) initAudio();
  if (ac.state === 'suspended') ac.resume();
  playing = !playing;
  if (playing) { startAt = ac.currentTime - paused; nextStep = ac.currentTime + 0.05; }
  else paused = ac.currentTime - startAt;
  $('#orbI').innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 4v16l13-8z"/>';
}
function setTrack(i) { ti = (i + TRACKS.length) % TRACKS.length; paused = 0; stepN = 0; if (ac) { startAt = ac.currentTime; nextStep = ac.currentTime + 0.05; } renderMeta(); }
$('#orb').onclick = play;
$('#next').onclick = () => setTrack(ti + 1); $('#prev').onclick = () => setTrack(ti - 1);
$('#vol').oninput = (e) => { if (master) master.gain.value = +e.target.value * 0.6; };
$('#seek').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); const p = (e.clientX - r.left) / r.width; if (ac) { startAt = ac.currentTime - p * LEN; paused = p * LEN; } };

// Fake spectrum > beat-synced shapes so the visualizer moves before any audio
const BINS = 128, fake = new Uint8Array(BINS), fakeWave = new Uint8Array(256);
function fakeData(t) {
  const beat = (t * TRACKS[ti].bpm / 60) % 1, kickE = Math.exp(-beat * 6);
  for (let i = 0; i < BINS; i++) { const f = i / BINS; fake[i] = Math.min(255, 255 * (kickE * Math.exp(-f * 9) * 0.9 + 0.35 * Math.exp(-f * 2.5) * (0.6 + 0.4 * Math.sin(t * 3 + i * 0.3)) + 0.12 * Math.abs(Math.sin(t * 7 + i * 1.7)) * (1 - f))); }
  for (let i = 0; i < 256; i++) fakeWave[i] = 128 + 60 * Math.sin(i / 256 * Math.PI * 6 + t * 5) * (0.5 + kickE * 0.5) + 25 * Math.sin(i / 256 * Math.PI * 22 - t * 9);
}

// Visualizers > swirl feedback / mirrored bars / polar scope
const cv = $('#vis'), cx = cv.getContext('2d');
let W = 0, H = 0, mode = 'swirl';
function size() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = cv.width = Math.max(2, r.width * d); H = cv.height = Math.max(2, r.height * d); cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); }
addEventListener('resize', size);
const peaks = new Float32Array(48);
function drawSwirl(f, w, t, hue) {
  // feedback: last frame zoomed + rotated, darkened a touch so trails decay
  cx.save(); cx.globalAlpha = 0.93; cx.translate(W / 2, H / 2); cx.rotate(0.012 + f[4] / 255 * 0.02); cx.scale(1.025, 1.025); cx.translate(-W / 2, -H / 2); cx.drawImage(cv, 0, 0); cx.restore();
  cx.fillStyle = 'rgba(0,0,0,0.08)'; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  const R = Math.min(W, H) * 0.18, n = 6;
  for (let k = 0; k < n; k++) {
    cx.beginPath();
    for (let i = 0; i <= 64; i++) {
      const a = (i / 64) * Math.PI * 2, v = f[(i * 2 + k * 7) % 96] / 255;
      const r = R * (0.6 + v * 0.9) + Math.sin(a * 3 + t * 2 + k) * R * 0.15;
      const x = W / 2 + Math.cos(a + t * 0.4 * (k % 2 ? 1 : -1)) * r, y = H / 2 + Math.sin(a + t * 0.4 * (k % 2 ? 1 : -1)) * r;
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.strokeStyle = `hsla(${hue + k * 28 + t * 20},95%,62%,0.55)`; cx.lineWidth = 2 + (f[k * 3] / 255) * 4; cx.stroke();
  }
  const bass = f[2] / 255;
  const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, R * (0.4 + bass));
  g.addColorStop(0, `hsla(${hue + 40},100%,80%,${0.35 * bass})`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'source-over';
}
function drawBars(f, w, t, hue) {
  const bg = cx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#020812'); bg.addColorStop(1, '#06223d'); cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
  const n = 48, gap = W / n, base = H * 0.68;
  for (let i = 0; i < n; i++) {
    const v = f[Math.floor((i / n) ** 1.6 * 110)] / 255, h = v * H * 0.6, x = i * gap + gap * 0.12, bw = gap * 0.76;
    peaks[i] = Math.max(peaks[i] - H * 0.006, h);
    const g = cx.createLinearGradient(0, base - h, 0, base); g.addColorStop(0, `hsl(${hue + i * 2},95%,75%)`); g.addColorStop(1, `hsl(${hue + 30 + i * 2},90%,35%)`);
    cx.fillStyle = g; cx.fillRect(x, base - h, bw, h);
    cx.fillStyle = 'rgba(255,255,255,0.35)'; cx.fillRect(x, base - h, bw * 0.4, h);
    cx.fillStyle = '#fff'; cx.fillRect(x, base - peaks[i] - 4, bw, 3);
    // mirror reflection below the floor line
    cx.globalAlpha = 0.22; cx.fillStyle = g; cx.fillRect(x, base + 2, bw, h * 0.5); cx.globalAlpha = 1;
  }
  cx.fillStyle = 'rgba(160,220,255,0.4)'; cx.fillRect(0, base, W, 1);
}
function drawScope(f, w, t, hue) {
  cx.fillStyle = 'rgba(0,4,10,0.25)'; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  const R = Math.min(W, H) * 0.26, n = w.length;
  for (let ring = 0; ring < 3; ring++) {
    cx.beginPath();
    for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2 + t * 0.3 * (ring + 1), v = (w[i % n] - 128) / 128; const r = R * (0.7 + ring * 0.25) + v * R * 0.5; const x = W / 2 + Math.cos(a) * r, y = H / 2 + Math.sin(a) * r; i ? cx.lineTo(x, y) : cx.moveTo(x, y); }
    cx.strokeStyle = `hsla(${hue + ring * 50},100%,65%,0.7)`; cx.lineWidth = 2; cx.shadowColor = `hsl(${hue + ring * 50},100%,60%)`; cx.shadowBlur = 16; cx.stroke();
  }
  cx.shadowBlur = 0; cx.globalCompositeOperation = 'source-over';
}
const DRAW = { swirl: drawSwirl, bars: drawBars, scope: drawScope };
function setMode(m) { mode = m; document.querySelectorAll('#vmodes span').forEach((s) => s.classList.toggle('on', s.dataset.m === m)); cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H); }
$('#vmodes').onclick = (e) => { const s = e.target.closest('[data-m]'); if (s) setMode(s.dataset.m); };
cv.onclick = () => setMode({ swirl: 'bars', bars: 'scope', scope: 'swirl' }[mode]);

// Run engine > read analyser (or fake), draw, tick seek bar
let lastInput = -1e9, modeT = 0;
['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, (e) => { if (e.isTrusted) lastInput = performance.now(); }, { capture: true }));
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; const t = now / 1000;
  let f, w, pos;
  if (playing) {
    schedule();
    analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); f = freq; w = wave.subarray(0, 512);
    pos = ac.currentTime - startAt;
    if (pos > LEN) setTrack(ti + 1);
  } else { fakeData(t); f = fake; w = fakeWave; pos = playing ? 0 : (paused || (t % LEN)); }
  DRAW[mode](f, w, t, TRACKS[ti].hue);
  $('#seekI').style.width = (pos / LEN) * 100 + '%';
  $('#time').textContent = `${fmt(pos)} / ${fmt(LEN)}`;
  // attract: rotate visualizer every 7 s while idle
  if (now - lastInput > 9000) { modeT += dt; if (modeT > 7) { modeT = 0; setMode({ swirl: 'bars', bars: 'scope', scope: 'swirl' }[mode]); } }
  requestAnimationFrame(frame);
}
renderMeta(); size();
requestAnimationFrame(frame);
window.__player = { play, mode: setMode, next: () => setTrack(ti + 1), state: () => ({ playing, mode, track: TRACKS[ti].title }) };
</script>
