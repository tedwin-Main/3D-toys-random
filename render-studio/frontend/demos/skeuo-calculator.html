<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desk Calculator</title>
<meta name="category" content="apps" />
<meta name="order" content="5" />
<meta name="capture" content="4000" />
<meta name="tags" content="skeuomorphism, CSS materials, seven-segment display, WebAudio clicks" />
<meta name="description" content="A skeuomorphic desk calculator built from CSS alone: a brushed-aluminium body with bevelled edges, a recessed LCD with real seven-segment digits drawn as SVG polygons (unlit segments ghosted like a real panel), a solar strip, and chunky keys that press down with layered shadows and a synthesized click. It behaves like a classic desk calculator: chained operations, constant repeat on =, percent, square root, sign change, memory keys and an error state, all from mouse, touch or keyboard. Tests material rendering and exact state-machine logic." />
<meta name="prompt" content="Make a realistic skeuomorphic calculator in a single HTML file using only HTML, CSS and JavaScript, no images. Give it a brushed metal body, a recessed LCD showing seven-segment digits with faint unlit segments, a solar panel, and keys that physically press down with a click sound. It must work like a real desk calculator with chained operations, repeat on equals, percent, square root, plus/minus, memory keys and keyboard input, and show an error state on divide by zero." />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body { display: grid; place-items: center; background: radial-gradient(ellipse at 50% 35%, #6b5a48, #2b231c 70%), #2b231c; }
  /* desk: wood grain from stacked repeating gradients */
  body::before { content: ""; position: fixed; inset: 0; background: repeating-linear-gradient(92deg, rgba(0, 0, 0, 0.08) 0 2px, transparent 2px 9px), repeating-linear-gradient(88deg, rgba(255, 220, 170, 0.05) 0 1px, transparent 1px 23px); pointer-events: none; }
  .title { position: fixed; left: 20px; top: 18px; color: #f2e6d8; text-shadow: 0 1px 2px #000; }
  .title h1 { margin: 0; font-size: 20px; }
  .title p { margin: 4px 0 0; font-size: 12.5px; opacity: 0.7; }
  .calc { --s: 1; position: relative; width: 340px; padding: 22px 22px 26px; border-radius: 26px 26px 34px 34px; transform: scale(var(--s)); transform-origin: center;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, rgba(0, 0, 0, 0.03) 1px 2px, transparent 2px 3px), linear-gradient(170deg, #e9ebee 0%, #c3c7cd 45%, #a9aeb6 100%);
    box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.9), inset 0 -3px 2px rgba(0, 0, 0, 0.25), inset 2px 0 1px rgba(255, 255, 255, 0.4), inset -2px 0 1px rgba(0, 0, 0, 0.15), 0 2px 0 #7d828a, 0 6px 0 #5f646c, 0 30px 50px rgba(0, 0, 0, 0.55), 0 10px 18px rgba(0, 0, 0, 0.35); }
  .brand { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font: 700 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.22em; color: #5a5f68; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7); }
  .brand small { font-weight: 500; letter-spacing: 0.08em; font-size: 9.5px; }
  .solar { width: 110px; height: 26px; border-radius: 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; background: #2a1d17; box-shadow: inset 0 2px 3px #000, 0 1px 0 rgba(255, 255, 255, 0.8); }
  .solar i { background: linear-gradient(160deg, #6b3a2a, #3a1f17 60%, #52301f); border-radius: 1px; }
  .bezel { margin: 10px 0 18px; padding: 10px; border-radius: 10px; background: linear-gradient(180deg, #3a3e45, #23262b); box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.8); }
  .lcd { position: relative; height: 86px; border-radius: 4px; padding: 8px 10px 8px; overflow: hidden;
    background: linear-gradient(180deg, #a9b39a 0%, #bcc7ab 40%, #b3be9f 100%); box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(0, 0, 0, 0.3); }
  .lcd::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255, 255, 255, 0.22) 0 30%, transparent 31%); pointer-events: none; }
  .ann { display: flex; gap: 10px; font: 700 10px ui-monospace, Menlo, monospace; height: 12px; }
  .ann span { color: rgba(30, 38, 26, 0.08); }
  .ann span.on { color: #1e261a; }
  #digits { display: flex; justify-content: flex-end; gap: 1px; margin-top: 4px; filter: drop-shadow(1.5px 2px 0 rgba(30, 38, 26, 0.18)); }
  #digits svg { width: 26px; height: 48px; overflow: visible; }
  .seg { fill: rgba(30, 38, 26, 0.07); }
  .seg.on { fill: #1d2419; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px; }
  .key { position: relative; height: 50px; border: 0; border-radius: 11px; cursor: pointer; font: 700 18px ui-rounded, system-ui, sans-serif; color: #2c3037; outline: none; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #fbfbfc, #dfe2e6); box-shadow: inset 0 1px 0 #fff, inset 0 -2px 1px rgba(0, 0, 0, 0.12), 0 1px 0 #9ca1a8, 0 4px 0 #8d9299, 0 6px 8px rgba(0, 0, 0, 0.35); transition: transform 0.05s, box-shadow 0.05s; top: 0; }
  .key.dark { color: #f1f2f4; background: linear-gradient(180deg, #5a5f68, #3a3e45); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), inset 0 -2px 1px rgba(0, 0, 0, 0.3), 0 1px 0 #26292d, 0 4px 0 #1c1e21, 0 6px 8px rgba(0, 0, 0, 0.4); }
  .key.op { color: #fff; background: linear-gradient(180deg, #f39a4d, #d9711f); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), inset 0 -2px 1px rgba(0, 0, 0, 0.2), 0 1px 0 #a65314, 0 4px 0 #8f470f, 0 6px 8px rgba(0, 0, 0, 0.4); }
  .key.red { color: #fff; background: linear-gradient(180deg, #e8574d, #be3127); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -2px 1px rgba(0, 0, 0, 0.2), 0 1px 0 #8b211a, 0 4px 0 #781c16, 0 6px 8px rgba(0, 0, 0, 0.4); }
  .key.tall { grid-row: span 2; height: auto; }
  .key small { font-size: 12px; }
  .key.down { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 1px rgba(0, 0, 0, 0.15), 0 0 0 #8d9299, 0 1px 0 #6f747b, 0 2px 3px rgba(0, 0, 0, 0.35); }
  .screw { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fafafa, #8b9097); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); }
  .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 4px; height: 1.5px; background: rgba(0, 0, 0, 0.4); transform: rotate(35deg); }
  .hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); color: #e6d6c3; opacity: 0.6; font-size: 12px; white-space: nowrap; }
  @media (max-width: 600px) { .title { display: none; } .hint { display: none; } }
</style>
</head>
<body>
<div class="title"><h1>Desk Calculator</h1><p>CSS-only materials · seven-segment LCD</p></div>
<div class="calc" id="calc">
  <i class="screw" style="left:10px;top:10px"></i><i class="screw" style="right:10px;top:10px"></i>
  <div class="brand"><div>MERIDIAN<br><small>SD-1200 · 12 DIGITS</small></div><div class="solar"><i></i><i></i><i></i><i></i></div></div>
  <div class="bezel"><div class="lcd"><div class="ann"><span id="a-m">M</span><span id="a-e">E</span><span id="a-neg">−</span><span id="a-op"></span></div><div id="digits"></div></div></div>
  <div class="keys" id="keys"></div>
</div>
<div class="hint">keyboard works: digits · + − × ÷ · Enter · Esc · Backspace</div>
<script>
/**
 * FILE: render-studio/frontend/demos/skeuo-calculator.html
 * PURPOSE: Skeuomorphic desk calculator: CSS-only metal/keys, SVG seven-segment LCD, classic chained-op state machine with constant repeat and memory
 * UI: Render Studio > Apps & UI > Desk Calculator
 * USED BY: frontend/index.html viewer iframe, backend/capture-demos.js
 * KEY EXPORTS: window.__calc (test hook: press, display)
 */
const $ = (id) => document.getElementById(id);
const DIGITS = 12;

// LCD > seven segments: polygons a-g in a 26x48 box, plus a decimal dot
const SEG = {
  a: '4,1 22,1 19,5 7,5', b: '23,2 23,22 19,20 19,6', c: '23,26 23,46 19,42 19,28', d: '4,47 22,47 19,43 7,43',
  e: '3,26 7,28 7,42 3,46', f: '3,2 7,6 7,20 3,22', g: '4,24 7,22 19,22 22,24 19,26 7,26',
};
const MAP = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', E: 'afged', r: 'eg', o: 'cdeg', ' ': '' };
const cells = [];
for (let i = 0; i < DIGITS; i++) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 26 48');
  s.innerHTML = Object.entries(SEG).map(([k, p]) => `<polygon class="seg" data-s="${k}" points="${p}" transform="skewX(-6) translate(4 0)"/>`).join('') + '<circle class="seg" data-s="dp" cx="26" cy="45" r="2"/>';
  $('digits').appendChild(s);
  cells.push(s);
}
function paintLCD(text) {
  // text like "-123.45": split into glyph + dot flags, right-aligned
  const glyphs = [];
  for (const ch of text) { if (ch === '.') { if (glyphs.length) glyphs.at(-1).dp = true; else glyphs.push({ c: '0', dp: true }); } else glyphs.push({ c: ch, dp: false }); }
  while (glyphs.length < DIGITS) glyphs.unshift({ c: ' ', dp: false });
  cells.forEach((svg, i) => {
    const gph = glyphs[i], on = MAP[gph.c] ?? '';
    svg.querySelectorAll('.seg').forEach((p) => p.classList.toggle('on', p.dataset.s === 'dp' ? gph.dp : on.includes(p.dataset.s)));
  });
}

// Calc > state machine: classic desk behaviour (immediate execution, = repeats last op)
const st = { entry: '0', acc: null, op: null, fresh: true, lastOp: null, lastArg: null, mem: 0, err: false };
const fmtNum = (n) => {
  if (!Number.isFinite(n)) return null;
  if (Math.abs(n) >= 10 ** DIGITS) return null;
  // fit into 12 digits: drop decimals first, then round
  let s = n.toPrecision(DIGITS);
  if (s.includes('e')) s = Number(s).toFixed(DIGITS - 1);
  if (s.includes('.')) s = s.replace(/\.?0+$/, '');
  const digits = s.replace(/[-.]/g, '').length;
  if (digits > DIGITS) s = Number(s).toFixed(Math.max(0, DIGITS - (s.split('.')[0].replace('-', '').length))).replace(/\.?0+$/, '');
  return s === '-0' ? '0' : s;
};
const apply = (a, op, b) => (op === '+' ? a + b : op === '−' ? a - b : op === '×' ? a * b : b === 0 ? NaN : a / b);
function setEntry(n) { const s = fmtNum(n); if (s === null) { st.err = true; st.entry = 'Error'; } else st.entry = s; }
function press(k) {
  if (st.err && k !== 'AC') return render();
  const cur = () => Number(st.entry);
  if (/^[0-9]$/.test(k)) {
    if (st.fresh) { st.entry = k; st.fresh = false; }
    else if (st.entry.replace(/[-.]/g, '').length < DIGITS) st.entry = st.entry === '0' ? k : st.entry + k;
  } else if (k === '.') {
    if (st.fresh) { st.entry = '0.'; st.fresh = false; } else if (!st.entry.includes('.')) st.entry += '.';
  } else if (k === 'AC') { Object.assign(st, { entry: '0', acc: null, op: null, fresh: true, lastOp: null, lastArg: null, err: false }); }
  else if (k === 'C') { st.entry = '0'; st.fresh = true; }
  else if (k === '⌫') { if (!st.fresh) { st.entry = st.entry.length > 1 && st.entry !== '-0' ? st.entry.slice(0, -1) : '0'; if (st.entry === '-') st.entry = '0'; } }
  else if (k === '±') { st.entry = st.entry.startsWith('-') ? st.entry.slice(1) : st.entry === '0' ? '0' : '-' + st.entry; }
  else if (k === 'x²') { setEntry(cur() * cur()); st.fresh = true; }
  else if (k === '√') { if (cur() < 0) { st.err = true; st.entry = 'Error'; } else { setEntry(Math.sqrt(cur())); st.fresh = true; } }
  else if (k === '%') {
    // desk-calculator percent: a + b% means a + a*b/100; a × b% means a*b/100
    const b = cur();
    setEntry(st.op && st.acc !== null ? (st.op === '+' || st.op === '−' ? (st.acc * b) / 100 : b / 100) : b / 100);
    st.fresh = true;
  } else if (['+', '−', '×', '÷'].includes(k)) {
    if (st.op && !st.fresh) { setEntry(apply(st.acc, st.op, cur())); }
    st.acc = cur(); st.op = k; st.fresh = true; st.lastOp = null;
  } else if (k === '=') {
    if (st.op) { st.lastOp = st.op; st.lastArg = cur(); setEntry(apply(st.acc, st.op, st.lastArg)); st.op = null; st.acc = null; }
    else if (st.lastOp) setEntry(apply(cur(), st.lastOp, st.lastArg));
    st.fresh = true;
  } else if (k === 'MC') st.mem = 0;
  else if (k === 'MR') { st.entry = fmtNum(st.mem); st.fresh = true; }
  else if (k === 'M+') { st.mem += cur(); st.fresh = true; }
  else if (k === 'M−') { st.mem -= cur(); st.fresh = true; }
  render();
}
function render() {
  if (st.err) { paintLCD('Err'); $('a-e').classList.add('on'); }
  else { paintLCD(st.entry.replace('-', '')); $('a-e').classList.remove('on'); }
  $('a-m').classList.toggle('on', st.mem !== 0);
  $('a-neg').classList.toggle('on', !st.err && st.entry.startsWith('-'));
  $('a-op').textContent = st.op || '';
  $('a-op').classList.toggle('on', !!st.op);
}
// Calc > keypad: 5 cols; + and = span rows 5-6, grid auto-flow fills the rest
const LAYOUT = [
  ['MC', 'dark'], ['MR', 'dark'], ['M−', 'dark'], ['M+', 'dark'], ['AC', 'red'],
  ['√', 'dark'], ['x²', 'dark'], ['±', 'dark'], ['⌫', 'dark'], ['C', 'red'],
  ['7'], ['8'], ['9'], ['×', 'op'], ['÷', 'op'],
  ['4'], ['5'], ['6'], ['−', 'op'], ['%', 'dark'],
  ['1'], ['2'], ['3'], ['+', 'op tall'], ['=', 'op tall'],
  ['0'], ['00'], ['.'],
];
const btn = {};
$('keys').innerHTML = LAYOUT.map(([k, c]) => `<button class="key ${c || ''}" data-k="${k}">${k.length > 2 ? `<small>${k}</small>` : k}</button>`).join('');
$('keys').querySelectorAll('.key').forEach((b) => (btn[b.dataset.k] = b));

// Calc > click sound: short filtered noise burst plus a low thump
let ac = null;
function click() {
  try {
    ac ||= new AudioContext();
    const n = ac.createBufferSource(), buf = ac.createBuffer(1, 1200, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / 90);
    n.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 1.2;
    const gn = ac.createGain(); gn.gain.value = 0.35;
    n.connect(f).connect(gn).connect(ac.destination); n.start();
  } catch { /* audio blocked until a user gesture */ }
}
function hit(k, sound = true) {
  const b = btn[k]; if (!b) return;
  b.classList.add('down'); setTimeout(() => b.classList.remove('down'), 110);
  if (sound) click();
  if (k === '00') { press('0'); press('0'); } else press(k);
}
$('keys').addEventListener('pointerdown', (e) => { const b = e.target.closest('.key'); if (!b) return; e.preventDefault(); userAct(); hit(b.dataset.k); });
const KEYMAP = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', Enter: '=', '=': '=', Escape: 'AC', Backspace: '⌫', Delete: 'C', '.': '.', ',': '.', '%': '%', r: '√', n: '±' };
addEventListener('keydown', (e) => { const k = /^[0-9]$/.test(e.key) ? e.key : KEYMAP[e.key]; if (k) { e.preventDefault(); userAct(); hit(k); } });

// Fit: scale the body to the viewport so phones see the whole calculator
function fit() { const s = Math.min(1.25, (innerWidth - 24) / 340, (innerHeight - 30) / 560); $('calc').style.setProperty('--s', s.toFixed(3)); }
addEventListener('resize', fit); fit();

// Idle demo: types a few sums with visible key presses, silent
let lastInput = -1e9, demoId = 0, runningId = -1;
function userAct() { lastInput = performance.now(); demoId++; }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const SCRIPTS = [['AC', '1', '2', '3', '4', '×', '5', '6', '=', '+', '7', '8', '9', '=', '='], ['AC', '2', '÷', '3', '=', '×', '1', '0', '0', '='], ['AC', '1', '4', '4', '√', 'M+', '2', '5', '√', 'M+', 'MR'], ['AC', '8', '0', '+', '1', '5', '%', '='], ['AC', '7', '÷', '0', '=']];
async function demo() {
  const id = ++demoId;
  runningId = id;
  for (let s = 0; ; s = (s + 1) % SCRIPTS.length) {
    for (const k of SCRIPTS[s]) { await wait(280); if (id !== demoId) return; hit(k, false); }
    await wait(1600); if (id !== demoId) return;
  }
}
setInterval(() => { if (performance.now() - lastInput > 12000 && runningId !== demoId) { lastInput = performance.now(); demo(); } }, 1000);
render();
demo();
window.__calc = { press: (keys) => { userAct(); keys.forEach((k) => (k === '00' ? (press('0'), press('0')) : press(k))); return st.err ? 'Error' : st.entry; }, display: () => (st.err ? 'Error' : st.entry), stopDemo: userAct };
</script>
</body>
</html>
