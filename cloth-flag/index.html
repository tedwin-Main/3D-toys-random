<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Windy Flag</title>
<style>
  :root { --ink: #16202c; --card: rgba(255, 255, 255, 0.78); --accent: #e0483e; --line: rgba(20, 30, 50, 0.1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc8f0; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 16px; user-select: none; box-shadow: 0 8px 30px rgba(30, 60, 100, 0.15); }
  #intro { top: 16px; left: 16px; padding: 12px 16px; max-width: 270px; }
  #intro h1 { margin: 0 0 4px; font-size: 17px; }
  #intro p { margin: 0; font-size: 12.5px; line-height: 1.55; opacity: 0.75; }
  #panel { top: 16px; right: 16px; width: 248px; padding: 12px 14px; display: grid; gap: 10px; max-height: calc(100% - 32px); overflow: auto; }
  #panel h3 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.55; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  #panel button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: rgba(20, 30, 50, 0.06); border: 0; padding: 7px 9px; border-radius: 10px; cursor: pointer; }
  #panel button:hover { background: rgba(20, 30, 50, 0.12); }
  #panel button.on { background: var(--accent); color: #fff; }
  #panel .flagchip { font-size: 18px; padding: 4px 7px; }
  #panel label { font-size: 12px; display: grid; gap: 2px; }
  #panel label b { font-weight: 700; }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15); padding: 0 !important; }
  .swatch.on { box-shadow: 0 0 0 2px var(--ink); }
  #paint { display: none; }
  body.painting #paint { display: grid; gap: 6px; }
  @media (max-width: 640px) { #intro { display: none; } #panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 46%; } }
</style>
</head>
<body class="">
<div id="intro" class="card"><h1>Windy Flag</h1><p>Real-time cloth on a flagpole. Grab and yank the fabric, slice it apart with scissors, or paint on it while it flaps. Cut the rope and watch it blow away.</p></div>
<div id="panel" class="card">
  <h3>Flag</h3>
  <div class="row" id="designs"></div>
  <h3>Wind</h3>
  <label><span>Speed <b id="kt">16 kt</b></span><input id="wind" type="range" min="0" max="100" value="45" /></label>
  <label>Direction<input id="dir" type="range" min="-80" max="80" value="0" /></label>
  <div class="row"><button id="gusts" class="on">Gusts</button></div>
  <h3>Hands</h3>
  <div class="seg"><button data-mode="grab" class="on">✋ Grab</button><button data-mode="tear">✂️ Tear</button><button data-mode="paint">🖌 Paint</button></div>
  <div id="paint">
    <div class="row" id="swatches"></div>
    <label>Brush<input id="brush" type="range" min="4" max="60" value="18" /></label>
  </div>
  <h3>Pole</h3>
  <div class="row"><button id="half">Half-mast</button><button id="cut">Cut rope</button><button id="repair">Repair</button></div>
</div>

<script type="importmap">

<script type="module">
/**

import * as THREE from 'three';

// Scene > Renderer + camera

// Scene > Sky: gradient dome with sun glow
const sunDir = new THREE.Vector3(-0.5, 0.75, 0.45).normalize();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uSun: { value: sunDir } },

  fragmentShader: `uniform vec3 uSun; varying vec3 vD;

// Scene > Lights: sun with tight shadow box around the pole
scene.add(new THREE.HemisphereLight(0xdbeaff, 0x5c7a3a, 1.1));

sun.position.copy(sunDir).multiplyScalar(40).add(new THREE.Vector3(3, 0, 0));

// Scene > Ground: flat lawn near the pole, rolling hills further out
const groundH = (x, z) => {
  const r = Math.hypot(x, z), k = THREE.MathUtils.smoothstep(r, 18, 70);
  return k * (Math.sin(x * 0.045) * 4 + Math.cos(z * 0.06 + 1) * 3 + Math.sin((x + z) * 0.02) * 5 + 3);
};
{
  const g = new THREE.PlaneGeometry(600, 600, 160, 160);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));

  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x6fa548, roughness: 1 }));
  ground.receiveShadow = true;

}

// Scene > Grass: instanced blades bending with the same wind as the flag
const grassU = { uTime: { value: 0 }, uWind: { value: new THREE.Vector2() } };
{
  const blade = new THREE.PlaneGeometry(0.09, 0.6, 1, 3);
  blade.translate(0, 0.3, 0);
  const bp = blade.attributes.position;
  for (let i = 0; i < bp.count; i++) bp.setX(i, bp.getX(i) * (1 - bp.getY(i) / 0.62));
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.9, side: THREE.DoubleSide });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, grassU);
    sh.vertexShader = 'uniform float uTime; uniform vec2 uWind;\n' + sh.vertexShader.replace('#include <project_vertex>', `
      vec4 mvPosition = instanceMatrix * vec4(transformed, 1.0);
      float hh = position.y / 0.6;
      float s = 0.55 + 0.45 * sin(uTime * 2.6 + mvPosition.x * 0.45 - mvPosition.z * 0.3);
      mvPosition.xz += uWind * hh * hh * s * 0.032;
      mvPosition.y -= length(uWind) * hh * hh * s * 0.006;

      gl_Position = projectionMatrix * mvPosition;`);

    const r = 1.2 + Math.sqrt(Math.random()) * 34, a = Math.random() * Math.PI * 2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI);
    const s = 0.6 + Math.random() * 0.9;
    m.compose(new THREE.Vector3(x, groundH(x, z), z), q, new THREE.Vector3(s, s, s));
    grass.setMatrixAt(i, m);
    grass.setColorAt(i, c.setHSL(0.24 + Math.random() * 0.06, 0.5, 0.3 + Math.random() * 0.15));
  }
  grass.frustumCulled = false;
  scene.add(grass);
}

// Scene > Clouds: chunky low-poly puffs drifting downwind
const clouds = [];
{
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true, emissive: 0xb8c8dc, emissiveIntensity: 0.35 });
  for (let i = 0; i < 12; i++) {
    const g = new THREE.Group();
    for (let k = 0; k < 6; k++) {
      const s = 3 + Math.random() * 4;
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(s, 1), mat);
      b.position.set((k - 2.5) * 3.5 + Math.random() * 2, Math.random() * 2, Math.random() * 3);
      b.scale.y = 0.6;
      g.add(b);
    }
    g.position.set(-200 + Math.random() * 400, 60 + Math.random() * 35, -120 - Math.random() * 160);
    scene.add(g);
    clouds.push(g);
  }
}

// Scene > Pole: white mast, gold finial, concrete footing, halyard
const POLE_R = 0.09, POLE_H = 10.4;
{
  const white = new THREE.MeshStandardMaterial({ color: 0xf4f4f0, metalness: 0.3, roughness: 0.35 });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(POLE_R * 0.8, POLE_R * 1.15, POLE_H, 20), white);
  pole.position.y = POLE_H / 2;
  pole.castShadow = true;
  scene.add(pole);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 0.45, roughness: 0.3, emissive: 0x6a4200, emissiveIntensity: 0.4 }));
  ball.position.y = POLE_H + 0.18;
  ball.castShadow = true;
  scene.add(ball);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.3, 24), new THREE.MeshStandardMaterial({ color: 0xb8b4ac, roughness: 0.9 }));
  foot.position.y = 0.15;
  foot.castShadow = foot.receiveShadow = true;
  scene.add(foot);
}
const rope = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0x6a6258 }));
scene.add(rope);

// Cloth > Grid: particles, constraint lists, triangles (tearing hides tris whose edges died)
const NX = 46, NY = 30, FW = 6, FH = 4, DX = FW / (NX - 1), DY = FH / (NY - 1), N = NX * NY;
const id = (i, j) => j * NX + i;
const pos = new Float32Array(N * 3), prev = new Float32Array(N * 3), acc = new Float32Array(N * 3), inv = new Float32Array(N);
const cA = [], cB = [], cType = [], cDeps = [];
const addC = (a, b, t, deps = null) => (cA.push(a), cB.push(b), cType.push(t), cDeps.push(deps), cA.length - 1);
const Hc = [], Vc = [], Dc = [];
for (let j = 0; j < NY; j++) for (let i = 0; i < NX - 1; i++) Hc[id(i, j)] = addC(id(i, j), id(i + 1, j), 0);
for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX; i++) Vc[id(i, j)] = addC(id(i, j), id(i, j + 1), 0);
const tris = [];
for (let j = 0; j < NY - 1; j++) for (let i = 0; i < NX - 1; i++) {
  const a = id(i, j), b = id(i + 1, j), c = id(i, j + 1), d = id(i + 1, j + 1);
  const D = (Dc[a] = addC(b, c, 1));
  addC(a, d, 2, [Hc[a], Vc[a], Vc[b], Hc[c], D]);
  tris.push({ v: [a, c, b], deps: [Hc[a], Vc[a], D] }, { v: [b, c, d], deps: [Vc[b], Hc[c], D] });
}
// bend springs skip one particle; die with either edge they span so torn halves separate
for (let j = 0; j < NY; j++) for (let i = 0; i < NX - 2; i++) addC(id(i, j), id(i + 2, j), 3, [Hc[id(i, j)], Hc[id(i + 1, j)]]);
for (let j = 0; j < NY - 2; j++) for (let i = 0; i < NX; i++) addC(id(i, j), id(i, j + 2), 3, [Vc[id(i, j)], Vc[id(i, j + 1)]]);
const NC = cA.length;
const CA = Int32Array.from(cA), CB = Int32Array.from(cB), CT = Uint8Array.from(cType), REST = new Float32Array(NC), alive = new Uint8Array(NC);
const STIFF = [1, 1, 0.5, 0.22];

// Cloth > Mesh: shared position buffer, dynamic index
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
const uv = new Float32Array(N * 2);
for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) { uv[id(i, j) * 2] = i / (NX - 1); uv[id(i, j) * 2 + 1] = 1 - j / (NY - 1); }
geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
const indexArr = new Uint32Array(tris.length * 3);
geo.setIndex(new THREE.BufferAttribute(indexArr, 1).setUsage(THREE.DynamicDrawUsage));
let liveTris = [];
function rebuildIndex() {
  liveTris = [];
  let k = 0;
  for (const t of tris) {
    if (!alive[t.deps[0]] || !alive[t.deps[1]] || !alive[t.deps[2]]) continue;
    liveTris.push(t);
    indexArr[k++] = t.v[0]; indexArr[k++] = t.v[1]; indexArr[k++] = t.v[2];
  }
  geo.index.needsUpdate = true;
  geo.setDrawRange(0, k);
}
function refreshDerived() {
  for (let c = 0; c < NC; c++) { const d = cDeps[c]; if (d && alive[c] && d.some((x) => !alive[x])) alive[c] = 0; }
  rebuildIndex();
}

// Cloth > Texture: canvas flag designs, painted on directly
const TW = 1024, TH = 683;
const tcan = document.createElement('canvas');
tcan.width = TW; tcan.height = TH;
const tg = tcan.getContext('2d');
const tex = new THREE.CanvasTexture(tcan);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
const clothMat = new THREE.MeshStandardMaterial({ map: tex, side: THREE.DoubleSide, roughness: 0.82, shadowSide: THREE.DoubleSide });
const cloth = new THREE.Mesh(geo, clothMat);
cloth.castShadow = true;
cloth.frustumCulled = false;
scene.add(cloth);

const DESIGNS = {
  '☠️': () => {
    tg.fillStyle = '#111'; tg.fillRect(0, 0, TW, TH);
    tg.save(); tg.translate(TW / 2, TH / 2 - 30); tg.fillStyle = '#f4f1e8';
    for (const s of [1, -1]) { tg.save(); tg.rotate(s * 0.62); tg.fillRect(-250, 150 - 22, 500, 44); for (const x of [-250, 250]) for (const y of [-20, 20]) { tg.beginPath(); tg.arc(x, 150 + y, 30, 0, 7); tg.fill(); } tg.restore(); }
    tg.beginPath(); tg.ellipse(0, -20, 135, 125, 0, 0, 7); tg.fill();
    tg.fillRect(-70, 70, 140, 80);
    tg.fillStyle = '#111';
    for (const x of [-52, 52]) { tg.beginPath(); tg.ellipse(x, -15, 38, 44, 0, 0, 7); tg.fill(); }
    tg.beginPath(); tg.moveTo(0, 35); tg.lineTo(-18, 70); tg.lineTo(18, 70); tg.fill();
    for (let k = -2; k <= 2; k++) tg.fillRect(k * 26 - 3, 108, 6, 42);
    tg.restore();
  },
  '🌈': () => { ['#e8413c', '#f39a2b', '#f6d443', '#4fb35b', '#3c7fd6', '#7a4cc2'].forEach((c, i) => { tg.fillStyle = c; tg.fillRect(0, (i * TH) / 6, TW, TH / 6 + 1); }); },
  '🏁': () => { const n = 12, s = TW / n; for (let y = 0; y < Math.ceil(TH / s); y++) for (let x = 0; x < n; x++) { tg.fillStyle = (x + y) % 2 ? '#111' : '#f6f6f6'; tg.fillRect(x * s, y * s, s, s); } },
  '☀️': () => {
    tg.fillStyle = '#1f56b0'; tg.fillRect(0, 0, TW, TH);
    tg.save(); tg.translate(TW * 0.5, TH * 0.42); tg.fillStyle = '#ffcc33';
    for (let k = 0; k < 16; k++) { tg.rotate(Math.PI / 8); tg.beginPath(); tg.moveTo(-18, -120); tg.lineTo(0, -200); tg.lineTo(18, -120); tg.fill(); }
    tg.beginPath(); tg.arc(0, 0, 110, 0, 7); tg.fill(); tg.restore();
    tg.strokeStyle = '#fff'; tg.lineWidth = 22;
    for (let r = 0; r < 3; r++) { tg.beginPath(); for (let x = 0; x <= TW; x += 8) tg.lineTo(x, TH * 0.74 + r * 52 + Math.sin(x * 0.02) * 14); tg.stroke(); }
  },
  '🟥': () => { tg.fillStyle = '#f2d02c'; tg.fillRect(0, 0, TW, TH); tg.fillStyle = '#d6332b'; tg.beginPath(); tg.moveTo(0, 0); tg.lineTo(TW, 0); tg.lineTo(0, TH); tg.fill(); },
  '⬜': () => { tg.fillStyle = '#f7f5ef'; tg.fillRect(0, 0, TW, TH); tg.fillStyle = 'rgba(0,0,0,0.12)'; tg.font = '600 64px ui-rounded, system-ui'; tg.textAlign = 'center'; tg.fillText('paint me 🖌', TW / 2, TH / 2 + 20); },
};
function drawDesign(k) {
  DESIGNS[k]();
  // hem: darker stitched band along the hoist edge
  tg.fillStyle = 'rgba(0,0,0,0.18)'; tg.fillRect(0, 0, 26, TH);
  tex.needsUpdate = true;
  document.querySelectorAll('.flagchip').forEach((b) => b.classList.toggle('on', b.textContent === k));
}

// Cloth > Reset: lay the flag out flat from the hoist, everything whole
let hoistY = 9.9, hoistTarget = 9.9, roped = true;
function resetCloth() {
  for (let j = 0; j < NY; j++) for (let i = 0; i < NX; i++) {
    const p = id(i, j) * 3;
    pos[p] = POLE_R + 0.03 + i * DX; pos[p + 1] = hoistY - j * DY; pos[p + 2] = (Math.random() - 0.5) * 0.02;
    prev[p] = pos[p]; prev[p + 1] = pos[p + 1]; prev[p + 2] = pos[p + 2];
  }
  for (let c = 0; c < NC; c++) {
    const a = CA[c] * 3, b = CB[c] * 3;
    REST[c] = Math.hypot(pos[a] - pos[b], pos[a + 1] - pos[b + 1], pos[a + 2] - pos[b + 2]);
    alive[c] = 1;
  }
  roped = true;
  setPins();
  rebuildIndex();
}
function setPins() {
  for (let n = 0; n < N; n++) inv[n] = 1;
  if (roped) for (let j = 0; j < NY; j++) inv[id(0, j)] = 0;
  if (grabbed >= 0) inv[grabbed] = 0;
}

// Cloth > Physics: aero force per live triangle, verlet, constraint relaxation, collisions
const G = -9.8;
let windSpeed = 8, windDir = 0, gusts = true, simT = 0, tearOnStretch = false, tornDirty = false;
const windVec = new THREE.Vector3();
let grabbed = -1;
const grabTarget = new THREE.Vector3();
function gust(t, x) {
  if (!gusts) return 1;
  return 1 + 0.45 * Math.sin(0.55 * t - 0.35 * x) + 0.3 * Math.sin(1.7 * t + 1.3 - 0.8 * x) + 0.15 * Math.sin(3.3 * t - 1.6 * x);
}
function physicsStep(h) {
  simT += h;
  acc.fill(0);
  for (let n = 0; n < N; n++) acc[n * 3 + 1] = G;
  const K = 0.55, KT = 0.03, ih = 1 / h;
  for (const t of liveTris) {
    const a = t.v[0] * 3, b = t.v[1] * 3, c = t.v[2] * 3;
    const e1x = pos[b] - pos[a], e1y = pos[b + 1] - pos[a + 1], e1z = pos[b + 2] - pos[a + 2];
    const e2x = pos[c] - pos[a], e2y = pos[c + 1] - pos[a + 1], e2z = pos[c + 2] - pos[a + 2];
    let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;

    const cx = (pos[a] + pos[b] + pos[c]) / 3, cy = (pos[a + 1] + pos[b + 1] + pos[c + 1]) / 3;
    const g = gust(simT, cx);
    // travelling side-to-side eddies make the flutter look alive
    const wx = windVec.x * g, wy = windVec.length() * 0.08 * Math.sin(1.9 * simT - 1.2 * cx + cy), wz = windVec.z * g + windVec.length() * 0.14 * Math.sin(2.4 * simT - 1.5 * cx + 0.7 * cy);
    const vx = (pos[a] - prev[a] + pos[b] - prev[b] + pos[c] - prev[c]) * ih / 3;
    const vy = (pos[a + 1] - prev[a + 1] + pos[b + 1] - prev[b + 1] + pos[c + 1] - prev[c + 1]) * ih / 3;
    const vz = (pos[a + 2] - prev[a + 2] + pos[b + 2] - prev[b + 2] + pos[c + 2] - prev[c + 2]) * ih / 3;
    const rx = wx - vx, ry = wy - vy, rz = wz - vz;
    const dn = nx * rx + ny * ry + nz * rz;
    const fx = K * dn * nx + KT * (rx - dn * nx), fy = K * dn * ny + KT * (ry - dn * ny), fz = K * dn * nz + KT * (rz - dn * nz);
    for (const v of t.v) { acc[v * 3] += fx; acc[v * 3 + 1] += fy; acc[v * 3 + 2] += fz; }
  }
  const damp = 0.996;
  for (let n = 0; n < N; n++) {
    if (inv[n] === 0) continue;
    const p = n * 3;
    for (let k = 0; k < 3; k++) {
      const v = (pos[p + k] - prev[p + k]) * damp;
      prev[p + k] = pos[p + k];
      pos[p + k] += v + acc[p + k] * h * h;
    }
  }
  // pinned hoist column + grabbed particle move kinematically
  if (roped) for (let j = 0; j < NY; j++) {
    const p = id(0, j) * 3;
    pos[p] = prev[p] = POLE_R + 0.03; pos[p + 1] = prev[p + 1] = hoistY - j * DY; pos[p + 2] = prev[p + 2] = 0;
  }
  if (grabbed >= 0) { const p = grabbed * 3; pos[p] = grabTarget.x; pos[p + 1] = grabTarget.y; pos[p + 2] = grabTarget.z; prev.set(pos.subarray(p, p + 3), p); }
  const ITER = 10;
  for (let it = 0; it < ITER; it++) {
    const last = it === ITER - 1;
    for (let c = 0; c < NC; c++) {
      if (!alive[c]) continue;
      const a = CA[c], b = CB[c], wa = inv[a], wb = inv[b], ws = wa + wb;
      if (ws === 0) continue;
      const pa = a * 3, pb = b * 3;
      const dx = pos[pb] - pos[pa], dy = pos[pb + 1] - pos[pa + 1], dz = pos[pb + 2] - pos[pa + 2];
      const d = Math.hypot(dx, dy, dz) + 1e-9;
      if (last && tearOnStretch && CT[c] < 2 && d > REST[c] * 2.4) { alive[c] = 0; tornDirty = true; continue; }
      const s = ((d - REST[c]) / d / ws) * STIFF[CT[c]];
      pos[pa] += dx * s * wa; pos[pa + 1] += dy * s * wa; pos[pa + 2] += dz * s * wa;
      pos[pb] -= dx * s * wb; pos[pb + 1] -= dy * s * wb; pos[pb + 2] -= dz * s * wb;
    }
  }
  for (let n = 0; n < N; n++) {
    if (inv[n] === 0) continue;
    const p = n * 3;
    const floor = groundH(pos[p], pos[p + 2]) + 0.03;
    if (pos[p + 1] < floor) {
      pos[p + 1] = floor;
      // grass grips fabric lying on the lawn
      prev[p] += (pos[p] - prev[p]) * 0.6; prev[p + 2] += (pos[p + 2] - prev[p + 2]) * 0.6;
    }
    const r = Math.hypot(pos[p], pos[p + 2]), minR = POLE_R + 0.04;
    if (r < minR && pos[p + 1] < POLE_H) { const k = minR / (r + 1e-6); pos[p] *= k; pos[p + 2] *= k; }
  }
  if (tornDirty) { tornDirty = false; refreshDerived(); }
}

// Interaction > Grab / Tear / Paint
const dragPlane = new THREE.Plane();
let lastUV = null, lastXY = [0, 0];
function setRay(e) { ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); }
function hitCloth(e) { setRay(e); geo.computeBoundingSphere(); return ray.intersectObject(cloth)[0]; }
function tearAt(p) {
  const r2 = 0.2 * 0.2;
  let any = false;
  for (let c = 0; c < NC; c++) {
    if (!alive[c] || CT[c] > 2) continue;
    const a = CA[c] * 3, b = CB[c] * 3;
    const mx = (pos[a] + pos[b]) / 2 - p.x, my = (pos[a + 1] + pos[b + 1]) / 2 - p.y, mz = (pos[a + 2] + pos[b + 2]) / 2 - p.z;
    if (mx * mx + my * my + mz * mz < r2) { alive[c] = 0; any = true; }
  }
  if (any) { refreshDerived(); snip(); }
}
function paintAt(u, v) {
  const x = u * TW, y = (1 - v) * TH, r = Number(document.getElementById('brush').value);
  tg.strokeStyle = tg.fillStyle = paintColor;
  tg.lineCap = 'round'; tg.lineWidth = r * 2;
  tg.beginPath();
  if (lastUV) { tg.moveTo(lastUV[0], lastUV[1]); tg.lineTo(x, y); tg.stroke(); } else { tg.arc(x, y, r, 0, 7); tg.fill(); }
  lastUV = [x, y];
  tex.needsUpdate = true;
}
function onDown(e) {
  if (e.button !== 0) return;
  startAudio();
  const h = hitCloth(e);
  if (!h) return;
  controls.enabled = false;
  renderer.domElement.setPointerCapture(e.pointerId);
  if (mode === 'grab') {
    let best = -1, bd = Infinity;
    for (const k of [h.face.a, h.face.b, h.face.c]) { const d = h.point.distanceToSquared(new THREE.Vector3().fromArray(pos, k * 3)); if (d < bd) { bd = d; best = k; } }
    grabbed = best;
    grabTarget.fromArray(pos, best * 3);
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()).negate(), grabTarget);
    setPins();
    action = 'grab';
  } else if (mode === 'tear') { tearAt(h.point); lastXY = [e.clientX, e.clientY]; action = 'tear'; }
  else { lastUV = null; paintAt(h.uv.x, h.uv.y); action = 'paint'; }
}
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!action) { renderer.domElement.style.cursor = hitCloth(e) ? (mode === 'grab' ? 'grab' : 'crosshair') : 'default'; return; }
  setRay(e);
  if (action === 'grab') { ray.ray.intersectPlane(dragPlane, grabTarget); renderer.domElement.style.cursor = 'grabbing'; }
  else if (action === 'tear') {
    // sample along the stroke so fast swipes cut a continuous slit, not dotted holes
    const [x0, y0] = lastXY, n = Math.max(1, Math.ceil(Math.hypot(e.clientX - x0, e.clientY - y0) / 6));
    for (let k = 1; k <= n; k++) { const h = hitCloth({ clientX: x0 + ((e.clientX - x0) * k) / n, clientY: y0 + ((e.clientY - y0) * k) / n }); if (h) tearAt(h.point); }
    lastXY = [e.clientX, e.clientY];
  }
  else { const h = hitCloth(e); if (h) paintAt(h.uv.x, h.uv.y); else lastUV = null; }
});
addEventListener('pointerup', () => {
  if (action === 'grab') { grabbed = -1; setPins(); }
  action = null;
  lastUV = null;
  controls.enabled = true;
});

// Audio > Wind + flap: filtered noise, gain follows wind and cloth motion
let actx, windGain, windFilter, flapGain;
function startAudio() {
  if (actx) return;
  actx = new AudioContext();
  const buf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const mk = (type, f, q) => { const s = actx.createBufferSource(); s.buffer = buf; s.loop = true; const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = actx.createGain(); g.gain.value = 0; s.connect(fl).connect(g).connect(actx.destination); s.start(); return [fl, g]; };
  [windFilter, windGain] = mk('bandpass', 400, 0.6);
  [, flapGain] = mk('highpass', 1800, 0.5);
}
let snipT = 0;
function snip() {
  if (!actx || performance.now() - snipT < 60) return;
  snipT = performance.now();
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(2600, t); o.frequency.exponentialRampToValueAtTime(900, t + 0.05);
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.07);
}

// HUD > Panel: designs, wind, modes, paint, pole actions
const designsEl = document.getElementById('designs');
for (const k of Object.keys(DESIGNS)) {
  const b = document.createElement('button');
  b.className = 'flagchip'; b.textContent = k;
  b.onclick = () => drawDesign(k);
  designsEl.append(b);
}
let paintColor = '#e0483e';
const swEl = document.getElementById('swatches');
['#e0483e', '#f39a2b', '#f6d443', '#4fb35b', '#3c7fd6', '#7a4cc2', '#111111', '#ffffff'].forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (i === 0 ? ' on' : ''); b.style.background = c;
  b.onclick = () => { paintColor = c; swEl.querySelectorAll('.swatch').forEach((x) => x.classList.toggle('on', x === b)); };
  swEl.append(b);
});
const windEl = document.getElementById('wind');
function readWind() {
  windSpeed = (windEl.value / 100) ** 1.3 * 22;
  windDir = (document.getElementById('dir').value * Math.PI) / 180;
  document.getElementById('kt').textContent = `${Math.round(windSpeed * 1.94)} kt`;
}
windEl.oninput = readWind;
document.getElementById('dir').oninput = readWind;
document.getElementById('gusts').onclick = (e) => { gusts = !gusts; e.currentTarget.classList.toggle('on', gusts); };
document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => {
  mode = b.dataset.mode;
  tearOnStretch = mode === 'tear';
  document.querySelectorAll('[data-mode]').forEach((x) => x.classList.toggle('on', x === b));
  document.body.classList.toggle('painting', mode === 'paint');
}));
document.getElementById('half').onclick = (e) => { const half = hoistTarget > 8; hoistTarget = half ? 7.0 : 9.9; e.currentTarget.classList.toggle('on', half); };
document.getElementById('cut').onclick = () => { roped = false; setPins(); };
document.getElementById('repair').onclick = () => { hoistY = hoistTarget; resetCloth(); };
readWind();
drawDesign('☠️');
resetCloth();

// Run engine: fixed 1/120 substeps, hoist easing, rope, grass + cloud wind, audio levels
const clock = new THREE.Clock();
let accum = 0;
const H = 1 / 120;
function loop() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  windVec.set(Math.cos(windDir), 0, Math.sin(windDir)).multiplyScalar(windSpeed);
  hoistY += (hoistTarget - hoistY) * (1 - Math.exp(-dt * 1.2));
  accum += dt;
  let steps = 0;
  while (accum >= H && steps < 4) { physicsStep(H); accum -= H; steps++; }
  if (steps === 4) accum = 0;
  geo.attributes.position.needsUpdate = true;
  geo.computeVertexNormals();
  // Pole > Halyard: pulley down to the flag corners, then to the cleat
  const rp = rope.geometry.attributes.position;
  if (roped) {
    rp.setXYZ(0, POLE_R + 0.03, POLE_H - 0.05, 0.03); rp.setXYZ(1, POLE_R + 0.03, hoistY, 0.03);
    rp.setXYZ(2, POLE_R + 0.03, hoistY - FH, 0.03); rp.setXYZ(3, POLE_R + 0.02, 1.2, 0.03);
  } else {
    rp.setXYZ(0, POLE_R + 0.03, POLE_H - 0.05, 0.03); rp.setXYZ(1, POLE_R + 0.06, POLE_H - 0.9, 0.06);
    rp.setXYZ(2, POLE_R + 0.03, 1.4, 0.03); rp.setXYZ(3, POLE_R + 0.02, 1.2, 0.03);
  }
  rp.needsUpdate = true;
  const g = gust(simT, 0);
  grassU.uTime.value = simT;
  grassU.uWind.value.set(windVec.x * g, windVec.z * g);
  for (const c of clouds) { c.position.x += windVec.x * 0.25 * dt; c.position.z += windVec.z * 0.25 * dt; if (c.position.x > 220) c.position.x = -220; }
  if (actx) {
    let mv = 0;
    for (let n = 0; n < N; n += 7) { const p = n * 3; mv += Math.abs(pos[p + 2] - prev[p + 2]) + Math.abs(pos[p + 1] - prev[p + 1]); }
    mv /= N / 7;
    windGain.gain.value = Math.min(0.015 + windSpeed * 0.006 * g, 0.22);
    windFilter.frequency.value = 280 + windSpeed * 22 * g;
    flapGain.gain.value = Math.min(mv * 2.2, 0.12);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
