<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Waldo Hunt</title>
<style>
  :root { --bg: #0c0e13; --panel: #151922; --line: #262c38; --ink: #e8e6e0; --dim: #99a0ad; --accent: #d6263c; --good: #4fbf7a; --warn: #ffd34d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; font-size: 14px; padding: 9px 14px; background: #1d222d; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }

  button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  #game { display: grid; grid-template-columns: 1fr 280px; grid-template-rows: auto 1fr; height: 100vh; }
  .hud { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 46px; }
  .hud-left, .hud-right { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); background: transparent; line-height: 1.4; }
  .pill.map { background: #3a2f22; color: #e8d9b8; border-color: #5a4a33; }
  .pill.code { color: var(--warn); letter-spacing: 0.15em; font-weight: 700; }
  button.pill { cursor: pointer; }
  .clock { display: inline-flex; align-items: center; line-height: 0; }
  .score { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #1d222d; white-space: nowrap; }
  .score.me { outline: 1px solid var(--dim); }
  .score.found { color: var(--good); }
  .score.hiding { color: var(--warn); }
  .score.gone { opacity: 0.4; text-decoration: line-through; }
  .scene-wrap { position: relative; overflow: hidden; min-height: 0; }
  #scene { display: block; cursor: grab; touch-action: none; }
  #scene:active { cursor: grabbing; }
  .cursor-cool { position: absolute; transform: translate(14px, 14px); pointer-events: none; z-index: 5; padding: 3px 9px; border-radius: 99px; font-size: 13px; font-variant-numeric: tabular-nums; background: rgba(176, 53, 60, 0.92); color: #fff; border: 1px solid rgba(255, 255, 255, 0.35); display: none; }
  .minimap { position: absolute; right: 10px; bottom: 10px; width: 140px; height: 100px; background: #1a1d25; border: 1px solid var(--line); border-radius: 6px; display: none; }
  .minimap canvas { width: 140px; height: 100px; display: block; border-radius: 5px; }
  .minimap-view { position: absolute; border: 1px solid var(--warn); background: rgba(255, 211, 77, 0.12); pointer-events: none; }
  .mid { position: absolute; inset: 0; display: none; place-items: center; font-size: 22px; font-weight: 700; color: var(--dim); text-align: center; padding: 20px; }
  .side { padding: 14px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; }
  .target-card { display: flex; gap: 10px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .target-card canvas { width: 70px; height: 110px; background: #e6dcc6; border-radius: 8px; flex: none; }
  .target-card strong { font-size: 14px; }
  .target-card p { margin: 4px 0 0; font-size: 12px; color: var(--dim); line-height: 1.45; }
  .hint { color: var(--dim); font-size: 13px; line-height: 1.5; margin: 10px 0; }
  .round-end { margin-top: 12px; padding: 12px; border: 1px solid var(--warn); border-radius: 8px; display: none; }
  .round-end p { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  .round-end small { display: block; color: var(--dim); margin-bottom: 10px; }
  .feed { list-style: none; padding: 0; margin: 14px 0 0; }
  .feed li { font-size: 12px; color: var(--dim); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .error { color: var(--accent); font-size: 13px; min-height: 18px; }
  .final { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8, 10, 18, 0.6); backdrop-filter: blur(4px); z-index: 40; padding: 16px; }
  .final-card { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  .final-card h1 { margin: 0 0 8px; font-size: 26px; }
  .standings { list-style: none; counter-reset: s; padding: 0; margin: 0 0 16px; }
  .standings li { counter-increment: s; display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .standings li::before { content: counter(s) "."; color: var(--dim); margin-right: 10px; }
  .standings li span { flex: 1; }
  .standings li.win { color: var(--warn); font-weight: 700; }
  .final-btns { display: flex; gap: 8px; }
  .final-btns .primary { flex: 1; }
  @media (max-width: 900px) {
    #game { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .side { border-left: none; border-top: 1px solid var(--line); max-height: 34vh; }

// Core > seeded-random: seeded PRNG (mulberry32), same crowd on every client
function makeRng(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;

    t = Math.imul(t ^ (t >>> 15), t | 1);

  };

// Core > crowd-scene: seeded crowd, roads, props, decoys, Waldo stamp
function layoutMap(rng, theme) {
  const L = theme.layout;
  const roads = [];
  const props = [];
  const vxs = [];
  for (let i = 0; i < L.cols; i++) {
    const slot = WORLD_W / (L.cols + 1);
    vxs.push(slot * (i + 1) + randRange(rng, -slot * 0.16, slot * 0.16));
  }
  const hys = [];
  for (let i = 0; i < L.rows; i++) {
    const slot = WORLD_H / (L.rows + 1);
    hys.push(slot * (i + 1) + randRange(rng, -slot * 0.14, slot * 0.14));
  }
  for (const x of vxs) roads.push({ x: x - L.roadW / 2, y: 0, w: L.roadW, h: WORLD_H, kind: L.roadKind });
  for (const y of hys) roads.push({ x: 0, y: y - L.roadW / 2, w: WORLD_W, h: L.roadW, kind: L.roadKind });
  let waterY = -1;
  if (L.water) {
    waterY = randRange(rng, WORLD_H * 0.6, WORLD_H * 0.82);
    roads.push({ x: 0, y: waterY, w: WORLD_W, h: 118, kind: 'water' });
    for (let x = 120; x < WORLD_W - 120; x += randRange(rng, 280, 460)) {
      const spec = specFor(theme, 'sampan');
      if (spec.kind !== 'sampan') break;
      props.push({ kind: 'sampan', x, y: waterY + randRange(rng, 8, 60), w: spec.w, h: spec.h, tint: pick(rng, spec.tints) });
    }
  }
  const onRoad = (x, y, w, h, pad = 0) =>
    roads.some((r) => x + w > r.x - pad && x < r.x + r.w + pad && y + h > r.y - pad && y < r.y + r.h + pad);
  for (const y of hys) {
    for (const side of [-1, 1]) {
      let x = randRange(rng, 20, 140);
      while (x < WORLD_W - 140) {
        const kind = pick(rng, L.terrace);
        const spec = specFor(theme, kind);
        const py = side < 0 ? y - L.roadW / 2 - spec.h - randRange(rng, 6, 18) : y + L.roadW / 2 + randRange(rng, 6, 18);
        const blocked = vxs.some((vx) => x + spec.w > vx - L.roadW && x < vx + L.roadW);

// Game > constants: timings, bots, card words

// Host > state: authoritative round machine, lives only in host tab (port of old server Lobby class)

}

// Host > net out: to one seat, or everyone (own tab handled locally)

}

// Host > rounds: race builds crowd with Waldo; hide waits for hider's spot
function beginRound() {
  const seed = 1 + Math.floor(Math.random() * (2 ** 31 - 2));

  const decoy = decoyRatioFor(H.difficulty, H.roundIndex), density = densityFor(H.difficulty, H.roundIndex);

  const params = { seed, theme, decoyRatio: decoy, density };

    if (validatePlacement(H.scene, x, y, { w: WORLD_W, h: WORLD_H }).ok) {

  switch (m.t) {

      break;
    case 'error':
      sfx.error();

    case 'placePrompt':

  card.height = 110 * dpr;
  const base = { x: 35, y: 55, skin: WALDO.skin, hair: WALDO.hair, torsoA: '#000', torsoB: '#000', legs: WALDO.legs, hat: 'none', hatA: '#000', hatB: '#000', accessory: 'none', flip: false, isTarget: false };
  c.setTransform(dpr * 1.7, 0, 0, dpr * 1.7, 0, 8 * dpr);
  drawPerson(c, makeTargetLook(base, look), 21, 28);
  $('cardText').textContent = `${look.name} stripes, matching ${HAT_WORDS[look.hat] ?? 'hat'}, ${ACC_WORDS[look.accessory] ?? 'no extras'}. Lookalikes copy one — never both.`;
}

// Game > Scene > canvas: letterboxed fixed view when panning, whole world otherwise
const cv = $('scene'), g = cv.getContext('2d'), wrap = $('wrap');
const viewSize = () => (panning() ? [VIEW_W, VIEW_H] : [WORLD_W, WORLD_H]);
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.floor(wrap.clientWidth * dpr);
  cv.height = Math.floor(wrap.clientHeight * dpr);
  cv.style.width = `${wrap.clientWidth}px`;
  cv.style.height = `${wrap.clientHeight}px`;
}
new ResizeObserver(resize).observe(wrap);
resize();
function toWorld(cx, cy) {
  const rect = cv.getBoundingClientRect(), [vw, vh] = viewSize();
  const scale = Math.min(rect.width / vw, rect.height / vh);
  const vx = (cx - rect.left - (rect.width - vw * scale) / 2) / scale;
  const vy = (cy - rect.top - (rect.height - vh * scale) / 2) / scale;
  if (vx < 0 || vy < 0 || vx > vw || vy > vh) return null;
  return panning() ? { x: cam.x + vx, y: cam.y + vy } : { x: vx, y: vy };
}
let last = performance.now(), hudAt = 0, cursor = null;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const pan = panning(), [vw, vh] = viewSize(), sc = ui.scene;
  if (!pan) Object.assign(cam, { x: 0, y: 0 });
  else {
    const dx = (keys.has('arrowright') || keys.has('d')) - (keys.has('arrowleft') || keys.has('a'));
    const dy = (keys.has('arrowdown') || keys.has('s')) - (keys.has('arrowup') || keys.has('w'));
    if (dx || dy) Object.assign(cam, clampCamera(cam.x + dx * KEY_PAN_SPEED * dt, cam.y + dy * KEY_PAN_SPEED * dt));
  }
  const dpr = cv.width / Math.max(1, wrap.clientWidth), cssW = cv.width / dpr, cssH = cv.height / dpr;
  const scale = Math.min(cssW / vw, cssH / vh), offX = (cssW - vw * scale) / 2, offY = (cssH - vh * scale) / 2;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0d0f14';
  g.fillRect(0, 0, cssW, cssH);
  if (sc) {
    g.save();
    g.translate(offX, offY);
    g.beginPath();
    g.rect(0, 0, vw * scale, vh * scale);
    g.clip();
    g.scale(scale, scale);
    g.translate(-cam.x, -cam.y);
    const theme = getTheme(sc.theme);
    g.fillStyle = theme.ground.base;
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    const pattern = getGroundPattern(g, sc.theme);
    if (pattern) { g.fillStyle = pattern; g.fillRect(0, 0, WORLD_W, WORLD_H); }
    // vignette: world gets a centre, edges feel like edges
    const vg = g.createRadialGradient(WORLD_W / 2, WORLD_H / 2, Math.min(WORLD_W, WORLD_H) * 0.25, WORLD_W / 2, WORLD_H / 2, Math.max(WORLD_W, WORLD_H) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, theme.night ? 'rgba(10,8,20,0.3)' : 'rgba(60,46,28,0.16)');
    g.fillStyle = vg;
    g.fillRect(0, 0, WORLD_W, WORLD_H);
    const x0 = cam.x - 80, x1 = cam.x + vw + 80, y0 = cam.y - 120, y1 = cam.y + vh + 120;
    const occupants = ui.inMatch && ui.view?.difficulty === 'hard';
    for (const r of sc.roads) if (!(r.x + r.w < x0 || r.x > x1 || r.y + r.h < y0 || r.y > y1)) drawRoad(g, r, sc.theme);
    for (const pr of sc.props) if (!(pr.x + pr.w < x0 || pr.x > x1 || pr.y + pr.h < y0 || pr.y > y1)) drawProp(g, pr, occupants);
    for (const p of sc.people) {
      if (p.x < x0 || p.x > x1 || p.y < y0 || p.y > y1) continue;
      if (ui.place && p.isTarget) continue;
      drawPerson(g, p, p.x, p.y);
    }
    // hider ghost: same makeTargetLook as card + final stamp, so all three match
    if (ui.place && cursor && sc.people[0]) {
      g.globalAlpha = 0.75;
      drawPerson(g, makeTargetLook(sc.people[0], sc.look), cursor.x, cursor.y);
      g.globalAlpha = 1;
    }
    // night: darken after crowd so people + props tint together, warm pools under bulbs
    if (theme.night) drawNightWash(g, sc.props.map(lampOf).filter(Boolean), cam.x, cam.y, vw, vh);
    if (ui.reveal) {
      g.strokeStyle = '#ffd34d';
      g.lineWidth = 3;
      g.beginPath();
      g.arc(ui.reveal.x, ui.reveal.y, 36, 0, Math.PI * 2);
      g.stroke();
    }
    g.restore();
  }
  if (now - hudAt > 100) { hudAt = now; tickHud(); }
  requestAnimationFrame(frame);
}

// Game > Scene > input: drag / WASD / arrows pan, short press picks
const keys = new Set();
const drag = { active: false, moved: 0, lastX: 0, lastY: 0 };
let pointer = null;
addEventListener('keydown', (e) => {
  if (!ui.inMatch || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  keys.add(e.key.toLowerCase());
});
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', (e) => {
  Object.assign(drag, { active: true, moved: 0, lastX: e.clientX, lastY: e.clientY });
  cv.setPointerCapture?.(e.pointerId);
});
cv.addEventListener('pointermove', (e) => {
  cursor = toWorld(e.clientX, e.clientY);
  const box = wrap.getBoundingClientRect();
  pointer = { x: e.clientX - box.left, y: e.clientY - box.top };
  if (!panning() || !drag.active) return;
  const dx = e.clientX - drag.lastX, dy = e.clientY - drag.lastY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  Object.assign(drag, { lastX: e.clientX, lastY: e.clientY });
  const rect = cv.getBoundingClientRect(), [vw, vh] = viewSize();
  const scale = Math.min(rect.width / vw, rect.height / vh);
  Object.assign(cam, clampCamera(cam.x - dx / scale, cam.y - dy / scale));
});
cv.addEventListener('pointerleave', () => { cursor = null; pointer = null; });
cv.addEventListener('pointerup', (e) => {
  const wasDrag = drag.moved > DRAG_SLOP;
  drag.active = false;
  if (wasDrag || !canPick()) return;
  const w = toWorld(e.clientX, e.clientY);
  if (w) pickAt(Math.round(w.x), Math.round(w.y));
});
function canPick() {
  if (!ui.inMatch) return false;
  if (ui.place) return true;
  const mine = myView();
  return !!ui.round && !ui.reveal && ui.view?.phase === 'playing' && !mine?.hiding && !mine?.found && ui.cooldownUntil <= Date.now();
}
function pickAt(x, y) {
  sfx.click();
  if (ui.place && ui.scene) {
    // check locally first so a bad spot answers instantly
    const check = validatePlacement(ui.scene, x, y, { w: WORLD_W, h: WORLD_H });
    if (!check.ok) { sfx.error(); toast(check.reason ?? 'Invalid spot.'); return; }
    act('place', x, y);
    return;
  }
  act('click', x, y);
}

// HUD > round clock: wedge = time left, hand = backwards second hand
function clockSvg(remaining) {
  const S = 30, R = 15, F = 13, left = Math.max(0, Math.min(1, remaining / ROUND_MS)), sec = remaining / 1000;
  const urgent = remaining < 15000, col = urgent ? 'var(--warn)' : 'var(--dim)';
  const pt = (t, r) => { const a = t * Math.PI * 2 - Math.PI / 2; return [R + Math.cos(a) * r, R + Math.sin(a) * r]; };
  const [ex, ey] = pt(left, F - 2);
  const wedge = left >= 0.999 ? `M ${R} ${R - (F - 2)} A ${F - 2} ${F - 2} 0 1 1 ${R - 0.01} ${R - (F - 2)} Z` : `M ${R} ${R} L ${R} ${R - (F - 2)} A ${F - 2} ${F - 2} 0 ${left > 0.5 ? 1 : 0} 1 ${ex} ${ey} Z`;
  const [hx, hy] = pt((sec % 60) / 60, F - 3.5);
  const ticks = [0, 0.25, 0.5, 0.75].map((t) => { const [a, b] = pt(t, F - 1.5), [c, d] = pt(t, F - 3.5); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${col}" stroke-width="1"/>`; }).join('');
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="timer" aria-label="${sec.toFixed(0)} seconds left"><circle cx="${R}" cy="${R}" r="${F}" fill="rgba(255,255,255,0.04)" stroke="${col}" stroke-width="1.2"/><path d="${wedge}" fill="${urgent ? 'rgba(224,96,72,0.35)' : 'rgba(220,214,196,0.18)'}"/>${ticks}<line x1="${R}" y1="${R}" x2="${hx}" y2="${hy}" stroke="${col}" stroke-width="1.4" stroke-linecap="round"/><circle cx="${R}" cy="${R}" r="1.4" fill="${col}"/></svg>`;
}
// HUD > 10 Hz: clock, countdown ticks, cooldown pill, minimap rect, next-round countdown
function tickHud() {
  const now = Date.now();
  const r = ui.round, live = r && !ui.reveal;
  $('clock').innerHTML = r ? clockSvg(Math.max(0, r.endsAt - now)) : '';
  if (live) {
    const left = Math.ceil(Math.max(0, r.endsAt - now) / 1000);
    if (left <= 10 && left >= 1 && left !== ui.lastTick) { ui.lastTick = left; sfx.tick(left <= 3); }
  }
  const cool = $('cool'), cooling = ui.cooldownUntil > now;
  cool.style.display = cooling && pointer ? 'block' : 'none';
  if (cooling && pointer) { cool.style.left = `${pointer.x}px`; cool.style.top = `${pointer.y}px`; cool.textContent = `${((ui.cooldownUntil - now) / 1000).toFixed(1)}s`; }
  const showMini = panning() && !!ui.scene;
  $('mini').style.display = showMini ? 'block' : 'none';
  if (showMini) Object.assign($('miniView').style, { left: `${(cam.x / WORLD_W) * 100}%`, top: `${(cam.y / WORLD_H) * 100}%`, width: `${(VIEW_W / WORLD_W) * 100}%`, height: `${(VIEW_H / WORLD_H) * 100}%` });
  if (ui.reason) $('nextIn').textContent = ui.view?.phase === 'roundEnd' ? `Next in ${Math.ceil(Math.max(0, ui.nextAt - now) / 1000)}s` : '';
  cv.style.cursor = ui.place ? 'crosshair' : canPick() ? 'pointer' : '';
}

// Side + HUD > render: pills, scores, hint, round end, feed, final standings
function renderSide() {
  const v = ui.view, mine = myView(), host = !!lobby.room?.isHost;
  const inMatch = ui.inMatch;
  $('code').textContent = lobby.room?.code ?? '';
  $('code').style.display = inMatch ? '' : 'none';
  $('roundPill').style.display = $('modePill').style.display = inMatch && v ? '' : 'none';
  if (v) {
    $('roundPill').textContent = `Round ${Math.min(v.round, v.totalRounds)}/${v.totalRounds}`;
    $('modePill').textContent = v.mode === 'race' ? 'Race' : 'Hide & seek';
  }
  const theme = ui.round?.theme ?? ui.place?.theme ?? (inMatch ? null : ui.scene?.theme);
  $('mapPill').style.display = theme ? '' : 'none';
  if (theme) $('mapPill').textContent = getTheme(theme).name;
  $('lobbyBtn').style.display = inMatch && host ? '' : 'none';
  $('scores').innerHTML = inMatch && v ? v.players.map((p) => `<span class="score${p.found ? ' found' : ''}${p.hiding ? ' hiding' : ''}${p.connected ? '' : ' gone'}${p.id === me() ? ' me' : ''}">${esc(p.nick)} ${p.score}${p.hiding ? ' 🙈' : ''}${p.found ? ' ✓' : ''}</span>`).join('') : '';
  let hint = 'Spot Waldo in a seeded crowd of lookalikes. Create or join a room to play.';
  if (inMatch) {
    if (ui.place) hint = 'You are the hider. Click a spot in the crowd. Edges, empty ground and behind-scenery spots are rejected — and you score nothing if nobody finds you.';
    else if (ui.waitingFor) hint = `${ui.waitingFor} is hiding Waldo…`;
    else if (!ui.round) hint = 'Joining the round…';
    else if (ui.reveal || ui.reason) hint = ui.reveal ? 'Waldo is ringed in yellow.' : '';
    else if (mine?.hiding) hint = 'Sit tight. You score more the longer they take.';
    else if (mine?.found) hint = 'Found. Waiting for the rest.';
    else hint = `${panning() ? 'Drag or use WASD / arrows to pan. ' : 'Whole map is on screen. '}First ${WRONG_GRACE} wrong clicks are free (${ui.freeLeft} left); after that each costs 2 seconds.`;
  }
  $('hint').textContent = hint;
  const mid = $('mid');
  const midText = inMatch && !ui.scene && !ui.final ? (ui.waitingFor ? `${ui.waitingFor} is hiding Waldo…` : 'Loading round…') : '';
  mid.textContent = midText;
  mid.style.display = midText ? 'grid' : 'none';
  $('roundEnd').style.display = inMatch && ui.reason && !ui.final ? 'block' : 'none';
  $('reason').textContent = ui.reason ?? '';
  $('nextBtn').style.display = host ? '' : 'none';
  $('nextBtn').textContent = v && v.round >= v.totalRounds ? 'Final results' : 'Next round';
  $('feed').innerHTML = inMatch ? ui.feed.map((l) => `<li>${esc(l)}</li>`).join('') : '';
  $('final').style.display = inMatch && ui.final ? 'grid' : 'none';
  if (ui.final && v) {
    $('standings').innerHTML = v.players.map((p, i) => `<li class="${i === 0 ? 'win' : ''}"><span>${esc(p.nick)}</span><b>${p.score}</b></li>`).join('');
    $('finalBtns').style.display = host ? 'flex' : 'none';
    $('finalWait').style.display = host ? 'none' : '';
  }
}
let toastT = 0;
function toast(text) {
  $('err').textContent = text;
  clearTimeout(toastT);
  toastT = setTimeout(() => ($('err').textContent = ''), 3000);
}

// HUD > buttons: mute, lobby, next round, final screen
const syncMute = () => ($('mute').textContent = isMuted() ? '🔇' : '🔊');
$('mute').onclick = () => { setMuted(!isMuted()); syncMute(); };
$('lobbyBtn').onclick = () => lobby.backToLobby();
$('nextBtn').onclick = () => { if (lobby.room?.isHost) hostNext(); };
$('again').onclick = () => lobby.restart();
$('toLobby').onclick = () => lobby.backToLobby();
// browsers keep audio locked until first gesture
addEventListener('pointerdown', () => unlockAudio(), { once: true });

// Game > attract: random demo crowd behind lobby overlay
function attract() {
  Object.assign(ui, { inMatch: false, view: null, round: null, place: null, waitingFor: null, reveal: null, reason: null, feed: [], final: false });
  H = null;
  setScene(generateScene({ seed: 1 + Math.floor(Math.random() * 1e9), theme: THEME_IDS[Math.floor(Math.random() * THEME_IDS.length)], decoyRatio: 0.15, density: 480 }, true));
  renderSide();
}

// Multiplayer > Lobby
const lobby = createLobby({
  game: 'waldo-hunt', title: 'Waldo Hunt', emoji: '🔎', accent: '#e8413c',
  blurb: 'Where’s Waldo, online. Race the room to spot him in a seeded crowd of lookalikes, or take turns hiding him for everyone else.',
  maxBots: 13, defaultBots: 0, minPlayers: 1,
  note: 'Up to 14 per room (humans + bots). Race: best of 5, decoys ramp each round. Hide & seek: everyone hides once; a bot fills in if you are alone.',
  settings: [
    { key: 'mode', label: 'Mode', options: [['race', 'Race (best of 5)'], ['hide', 'Hide & seek']], value: 'race' },
    { key: 'difficulty', label: 'Difficulty', options: [['easy', 'Easy'], ['normal', 'Normal'], ['hard', 'Hard']], value: 'normal' },
    { key: 'map', label: 'Map', options: [['random', 'Tour (new map each round)'], ...THEME_IDS.map((id) => [id, THEMES[id].name])], value: 'random' },
    { key: 'panning', label: 'View', options: [['on', 'Pan a big world'], ['off', 'Whole map on screen']], value: 'on' },
  ],
  onJoin(room) {
    room.on('data', onData);
    room.on('roster', onRoster);
    room.on('host', (isHost) => { if (isHost && ui.inMatch && !H) hostAdopt(); renderSide(); });
  },
  onStart({ bots, isHost, settings }) {
    Object.assign(ui, { inMatch: true, view: null, round: null, place: null, waitingFor: null, reveal: null, reason: null, feed: [], final: false });
    H = null;
    setScene(null);
    renderSide();
    if (isHost) hostInit(settings, bots);
  },
  onLobby() { attract(); },
});

syncMute();
attract();
requestAnimationFrame(frame);
</script>
</body>
