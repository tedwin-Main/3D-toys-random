<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lava Lamp</title>
<style>
  :root { --ink: #f3ece6; --card: rgba(16, 10, 18, 0.6); --accent: #ff6a3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0710; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 14px; user-select: none; }
  #intro { top: 16px; left: 16px; padding: 12px 16px; max-width: 270px; }
  #intro h1 { margin: 0 0 4px; font-size: 17px; }
  #intro p { margin: 0; font-size: 12.5px; line-height: 1.55; opacity: 0.75; }
  #panel { top: 16px; right: 16px; padding: 12px 14px; width: 220px; display: grid; gap: 10px; }
  #panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .chip.on { border-color: #fff; }
  #panel label { font-size: 12px; display: grid; gap: 3px; opacity: 0.85; }
  #panel input { width: 100%; accent-color: var(--accent); }
  #panel button.act { flex: 1; font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink); background: rgba(255, 255, 255, 0.08); border: 0; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  #panel button.act:hover { background: rgba(255, 255, 255, 0.16); }
  #panel button.act.on { background: var(--accent); color: #1a0d08; }
  @media (max-width: 640px) { #intro { display: none; } #panel { top: auto; bottom: 16px; right: 16px; left: 16px; width: auto; } }
</style>
</head>
<body>
<div id="intro" class="card"><h1>Lava Lamp</h1><p>Raymarched wax blobs heated from below: they swell, rise, cool at the top and sink back into the pool. Click the glass to tap it. Try a cold start and watch it wake up.</p></div>
<div id="panel" class="card">
  <div class="row" id="chips"></div>
  <label>Heat <input id="heat" type="range" min="0" max="150" value="100" /></label>
  <label>Wax blobs <input id="count" type="range" min="3" max="12" value="8" /></label>
  <label>Flow speed <input id="speed" type="range" min="0" max="100" value="50" /></label>
  <div class="row"><button class="act on" id="power">Power</button><button class="act" id="cold">Cold start</button><button class="act" id="lights">Room light</button></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
/**
 * FILE: RANDOM_dump/3d-toys/lava-lamp/index.html
 * PURPOSE: lava lamp with raymarched metaball wax in a lathe bottle, CPU heat/buoyancy blob sim, color presets
 * UI: Lava Lamp page
 * USED BY: 3d-toys/index.html (iframe viewer)
 * KEY EXPORTS: none (standalone page)
 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Scene > Renderer + camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0710);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(1.2, 3.6, 10.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.0, 0);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.53;
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.6, 0.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// Lamp > Shape: bottle radius profile, shared by lathe mesh, shader and blob walls
const H = 4.0, BASE_Y = 1.0;
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const bottleR = (y) => 0.5 + 0.14 * smooth(0, 0.9, y) - 0.26 * smooth(0.9, H, y);

// Presets > Colors: wax + liquid pairs
const PRESETS = [
  { name: 'Classic', wax: 0xff3c12, liquid: 0xffa21a },
  { name: 'Cosmic', wax: 0xff3fa4, liquid: 0x4a1fb0 },
  { name: 'Ocean', wax: 0xe9f7ff, liquid: 0x0b58c8 },
  { name: 'Toxic', wax: 0x9dff2a, liquid: 0x0b5a40 },
  { name: 'Sunset', wax: 0xffcf33, liquid: 0xc0183a },
];

// Room > Wall + desk: dark backdrop the lamp light washes over
const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2230, roughness: 0.95 });
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), wallMat);
wall.position.set(0, 8, -3.5);
wall.receiveShadow = true;
scene.add(wall);
const desk = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, 7), new THREE.MeshStandardMaterial({ color: 0x2b1a12, roughness: 0.4 }));
desk.position.set(0, -0.15, 0);
desk.receiveShadow = true;
scene.add(desk);
const roomLight = new THREE.HemisphereLight(0xc8c0ff, 0x221510, 0.0);
scene.add(roomLight);
const lampLight = new THREE.PointLight(0xff6a2a, 14, 14, 1.5);
lampLight.position.set(0, 3.0, 0.2);
lampLight.castShadow = true;
lampLight.shadow.mapSize.set(1024, 1024);
scene.add(lampLight);

// Room > Props: book stack + mug so the light has something to land on
{
  const bookCols = [0x6b2a2a, 0x2a4a6b, 0xb08a3a, 0x3a5a3a];
  let y = 0;
  bookCols.forEach((c, i) => {
    const h = 0.18 + (i % 2) * 0.06;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.8 - i * 0.12, h, 1.25), new THREE.MeshStandardMaterial({ color: c, roughness: 0.7 }));
    b.position.set(-2.6 + i * 0.04, y + h / 2, 0.4);
    b.rotation.y = 0.2 + (i % 2 ? 0.08 : -0.06);
    b.castShadow = b.receiveShadow = true;
    scene.add(b);
    y += h;
  });
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.29, 0.7, 32, 1, true), new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: 0.35, side: THREE.DoubleSide }));
  mug.position.set(2.3, 0.35, 0.9);
  mug.castShadow = true;
  scene.add(mug);
  const mugBottom = new THREE.Mesh(new THREE.CircleGeometry(0.29, 32), mug.material);
  mugBottom.rotation.x = -Math.PI / 2;
  mugBottom.position.set(2.3, 0.02, 0.9);
  scene.add(mugBottom);
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.045, 10, 24, Math.PI * 1.2), mug.material);
  handle.position.set(2.66, 0.36, 0.9);
  handle.rotation.z = -Math.PI * 0.6;
  scene.add(handle);
}

// Lamp > Metal base + cap: lathe profiles, brushed chrome
const metal = new THREE.MeshStandardMaterial({ color: 0x8c8c96, metalness: 1, roughness: 0.38, envMapIntensity: 0.5 });
{
  const basePts = [[0, 0], [0.98, 0], [0.98, 0.05], [0.9, 0.12], [0.62, BASE_Y - 0.04], [0.54, BASE_Y], [0, BASE_Y]].map(([x, y]) => new THREE.Vector2(x, y));
  const base = new THREE.Mesh(new THREE.LatheGeometry(basePts, 72), metal);
  base.castShadow = true;
  scene.add(base);
  const capY = BASE_Y + H;
  const capPts = [[0, capY], [0.42, capY], [0.4, capY + 0.08], [0.16, capY + 0.95], [0.1, capY + 1.0], [0, capY + 1.0]].map(([x, y]) => new THREE.Vector2(x, y));
  const cap = new THREE.Mesh(new THREE.LatheGeometry(capPts, 72), metal);
  cap.castShadow = true;
  scene.add(cap);
}
// Lamp > Vents: glowing slits in the base show the bulb
const ventMat = new THREE.MeshBasicMaterial({ color: 0xffb070 });
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.02), ventMat);
  const r = 0.83;
  v.position.set(Math.cos(a) * r, 0.36, Math.sin(a) * r);
  v.lookAt(0, 0.36, 0);
  v.rotation.x += 0.33;
  scene.add(v);
}

// Lamp > Wax blobs: CPU heat + buoyancy sim
const MAXB = 12;
const blobs = [];
function makeBlob(cold) {
  const r = 0.17 + Math.random() * 0.15;
  const y = cold ? 0.25 + Math.random() * 0.15 : 0.4 + Math.random() * (H - 1.2);
  // cold wax spreads across the pool floor so every blob sits near the coil
  const a = Math.random() * Math.PI * 2, rad = (cold ? 0.5 + Math.random() * 0.5 : Math.random() * 0.6) * (bottleR(y) - r);
  return { p: new THREE.Vector3(Math.cos(a) * rad, y, Math.sin(a) * rad), v: new THREE.Vector3(), r, T: cold ? 0 : Math.random(), k: 0.75 + Math.random() * 0.5, seed: Math.random() * 100 };
}
let blobCount = 8;
for (let i = 0; i < MAXB; i++) blobs.push(makeBlob(false));
let heat = 1, heatTarget = 1, power = true, glow = 1;
function simStep(dt, t) {
  for (let i = 0; i < blobCount; i++) {
    const b = blobs[i];
    // heater coil sits under the pool: warmth falls off fast with height above it
    b.T += dt * heat * 0.2 * b.k * (1.25 - b.T) * Math.exp(-Math.max(b.p.y - b.r - 0.25, 0) / 0.3);
    b.T -= dt * 0.045 * (b.T - 0.1) * (0.35 + (b.p.y / H) * 1.6);
    const ay = (b.T - 0.5) * 0.9;
    b.v.y += ay * dt;
    b.v.x += Math.sin(t * 0.3 + b.seed) * 0.05 * dt;
    b.v.z += Math.cos(t * 0.27 + b.seed * 1.3) * 0.05 * dt;
    b.v.multiplyScalar(Math.exp(-1.6 * dt));
    b.p.addScaledVector(b.v, dt);
    const floor = 0.22 + b.r * 0.2, ceil = H - b.r * 0.85;
    if (b.p.y < floor) { b.p.y = floor; b.v.y = Math.max(b.v.y, 0); }
    if (b.p.y > ceil) { b.p.y = ceil; b.v.y = Math.min(b.v.y, 0); }
    const lim = Math.max(bottleR(b.p.y) - b.r * 0.6, 0.02), d = Math.hypot(b.p.x, b.p.z);
    if (d > lim) { b.p.x *= lim / d; b.p.z *= lim / d; b.v.x *= -0.3; b.v.z *= -0.3; }
  }
  // soft repulsion so blobs kiss and merge visually instead of stacking into one lump
  for (let i = 0; i < blobCount; i++) for (let j = i + 1; j < blobCount; j++) {
    const a = blobs[i], b = blobs[j];
    const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z, d = Math.hypot(dx, dy, dz) + 1e-5, min = (a.r + b.r) * 0.75;
    if (d < min) {
      const f = ((min - d) / d) * 0.5 * Math.min(dt * 4, 1);
      a.p.x -= dx * f; a.p.y -= dy * f; a.p.z -= dz * f;
      b.p.x += dx * f; b.p.y += dy * f; b.p.z += dz * f;
      // touching blobs share heat a little
      const dT = (b.T - a.T) * dt * 0.3;
      a.T += dT; b.T -= dT;
    }
  }
}

// Lamp > Bottle shader: raymarch wax SDF inside the lathe surface, liquid absorption, glass fresnel
const bottlePts = [];
for (let i = 0; i <= 64; i++) { const y = (i / 64) * H; bottlePts.push(new THREE.Vector2(bottleR(y), y)); }
const uniforms = {
  uBlobs: { value: Array.from({ length: MAXB }, () => new THREE.Vector4()) },
  uCount: { value: blobCount },
  uTime: { value: 0 },
  uWax: { value: new THREE.Color() },
  uLiquid: { value: new THREE.Color() },
  uGlow: { value: 1 },
  uBase: { value: new THREE.Vector3(0, BASE_Y, 0) },
};
const bottleMat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */ `
    varying vec3 vObj; varying vec3 vNW; varying vec3 vW;
    void main() {
      vObj = position;
      vec4 w = modelMatrix * vec4(position, 1.0);
      vW = w.xyz;
      vNW = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: /* glsl */ `
    #define MAXB ${MAXB}
    uniform vec4 uBlobs[MAXB]; uniform int uCount; uniform float uTime, uGlow;
    uniform vec3 uWax, uLiquid, uBase;
    varying vec3 vObj; varying vec3 vNW; varying vec3 vW;
    float sm(float a, float b, float x) { return smoothstep(a, b, x); }
    float R(float y) { return 0.5 + 0.14 * sm(0.0, 0.9, y) - 0.26 * sm(0.9, ${H.toFixed(1)}, y); }
    float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
    float map(vec3 p) {
      float d = p.y - (0.3 + 0.045 * sin(p.x * 7.0 + uTime * 0.6) * sin(p.z * 6.0 - uTime * 0.45));
      for (int i = 0; i < MAXB; i++) {
        if (i >= uCount) break;
        vec4 b = uBlobs[i];
        // squash vertically a touch: hot wax rises as a teardrop, not a ball
        vec3 q = p - b.xyz; q.y *= 0.88;
        d = smin(d, length(q) - b.w, 0.3);
      }
      return max(d, length(p.xz) - R(p.y) + 0.012);
    }
    vec3 nrm(vec3 p) {
      vec2 e = vec2(0.004, 0.0);
      return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx)));
    }
    vec3 liquidAt(float y) { return uLiquid * (0.08 + uGlow * (0.22 + 0.85 * exp(-y * 0.55))); }
    void main() {
      vec3 ro = vObj, rd = normalize(vW - cameraPosition);
      float t = 0.004; bool hit = false; vec3 p = ro;
      for (int i = 0; i < 96; i++) {
        p = ro + rd * t;
        if (p.y < -0.01 || p.y > ${(H + 0.01).toFixed(2)} || length(p.xz) > R(p.y) + 0.02) break;
        float d = map(p);
        if (d < 0.0015) { hit = true; break; }
        t += max(d * 0.85, 0.006);
      }
      vec3 col;
      vec3 bulb = vec3(0.0, -0.35, 0.0);
      if (hit) {
        vec3 n = nrm(p);
        vec3 L = normalize(bulb - p);
        float heatGlow = exp(-p.y * 0.65);
        float diff = max(dot(n, L), 0.0);
        float rim = pow(1.0 - abs(dot(n, -rd)), 2.0);
        // wax lit through from below + fake subsurface rim
        col = uWax * (0.05 + uGlow * (0.18 + 1.1 * diff * heatGlow + 0.45 * heatGlow + 0.55 * rim));
        col += uGlow * vec3(1.0, 0.9, 0.8) * pow(max(dot(reflect(rd, n), L), 0.0), 18.0) * 0.25;
        col = mix(col, liquidAt(p.y), 1.0 - exp(-t * 0.55));
      } else {
        float ym = (ro.y + p.y) * 0.5;
        col = liquidAt(ym) * (0.55 + 0.45 * min(t, 1.3));
      }
      // glass: fresnel sheen + a window-shaped highlight
      vec3 V = normalize(cameraPosition - vW);
      float fr = pow(1.0 - abs(dot(vNW, V)), 3.0);
      col += vec3(0.85, 0.9, 1.0) * fr * 0.28;
      vec3 rf = reflect(-V, vNW);
      col += vec3(1.0) * sm(0.965, 0.995, dot(rf, normalize(vec3(-0.55, 0.45, 0.7)))) * 0.55;
      col += vec3(1.0) * sm(0.985, 0.998, dot(rf, normalize(vec3(0.7, 0.2, 0.68)))) * 0.25;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const bottle = new THREE.Mesh(new THREE.LatheGeometry(bottlePts, 96), bottleMat);
bottle.position.y = BASE_Y;
scene.add(bottle);

// Interaction > Tap: click the glass, wax wobbles
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObject(bottle)[0];
  if (!h) return;
  const local = h.point.clone().sub(bottle.position);
  for (let i = 0; i < blobCount; i++) {
    const b = blobs[i], d = b.p.distanceTo(local);
    const push = b.p.clone().sub(local).setY(0).normalize().multiplyScalar(0.5 / (1 + d * 2));
    b.v.add(push);
    b.v.y += (Math.random() - 0.4) * 0.15;
  }
  tink();
});
let actx;
function tink() {
  actx ??= new AudioContext();
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = 1900 + Math.random() * 200;
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + 0.36);
}

// HUD > Panel: presets, sliders, power, cold start, room light
const chips = document.getElementById('chips');
let preset = 0;
function applyPreset(i) {
  preset = i;
  uniforms.uWax.value.setHex(PRESETS[i].wax);
  uniforms.uLiquid.value.setHex(PRESETS[i].liquid);
  lampLight.color.setHex(PRESETS[i].wax).lerp(new THREE.Color(PRESETS[i].liquid), 0.45);
  wallMat.color.setHex(0x2a2230);
  chips.querySelectorAll('.chip').forEach((c, j) => c.classList.toggle('on', j === i));
}
PRESETS.forEach((p, i) => {
  const c = document.createElement('button');
  c.className = 'chip';
  c.title = p.name;
  c.style.background = `radial-gradient(circle at 40% 40%, #${p.wax.toString(16).padStart(6, '0')} 0 38%, #${p.liquid.toString(16).padStart(6, '0')} 42%)`;
  c.onclick = () => applyPreset(i);
  chips.appendChild(c);
});
applyPreset(0);
let speed = 1.6;
document.getElementById('heat').oninput = (e) => (heatTarget = e.target.value / 100);
document.getElementById('count').oninput = (e) => {
  const n = Number(e.target.value);
  for (let i = blobCount; i < n; i++) blobs[i] = Object.assign(makeBlob(true), { T: 0.4 });
  blobCount = n;
};
document.getElementById('speed').oninput = (e) => (speed = 0.4 * 2 ** (e.target.value / 25));
document.getElementById('power').onclick = (e) => { power = !power; e.currentTarget.classList.toggle('on', power); };
document.getElementById('cold').onclick = () => {
  for (let i = 0; i < MAXB; i++) blobs[i] = makeBlob(true);
  heat = 0;
  if (!power) { power = true; document.getElementById('power').classList.add('on'); }
};
let roomOn = false;
document.getElementById('lights').onclick = (e) => { roomOn = !roomOn; e.currentTarget.classList.toggle('on', roomOn); };

// Run engine: sim substeps, heat/glow easing, flicker, uniforms
const clock = new THREE.Clock();
let simT = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const sdt = dt * speed;
  // bulb takes ~25 s to reach full heat, like the real thing
  heat += ((power ? heatTarget : 0) - heat) * (1 - Math.exp(-sdt / 25));
  glow += ((power ? 1 : 0) - glow) * (1 - Math.exp(-dt * 4));
  for (let s = 0; s < 3; s++) { simT += sdt / 3; simStep(sdt / 3, simT); }
  for (let i = 0; i < MAXB; i++) uniforms.uBlobs.value[i].set(blobs[i].p.x, blobs[i].p.y, blobs[i].p.z, blobs[i].r * (0.85 + 0.25 * Math.min(Math.max(blobs[i].T, 0), 1.2)));
  uniforms.uCount.value = blobCount;
  uniforms.uTime.value = simT;
  uniforms.uGlow.value = glow;
  const flick = 1 + Math.sin(simT * 2.3) * 0.03 + Math.sin(simT * 7.1) * 0.015;
  lampLight.intensity = 14 * glow * flick;
  ventMat.color.setRGB(1 * glow + 0.05, 0.69 * glow + 0.05, 0.44 * glow + 0.05);
  roomLight.intensity += ((roomOn ? 0.9 : 0.04) - roomLight.intensity) * (1 - Math.exp(-dt * 5));
  controls.update();
  composer.render();
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
