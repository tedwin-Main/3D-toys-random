<!doctype html>
<html lang="en">
<head>

<style>
  :root { --ink: #1b2230; --card: rgba(255, 255, 255, 0.84); }
  * { box-sizing: border-box; }

  .card { position: fixed; background: var(--card); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); user-select: none; padding: 12px 16px; }
  #intro { top: 16px; left: 16px; max-width: 290px; }

  #intro p { margin: 0; font-size: 12.5px; line-height: 1.6; opacity: 0.8; }

  <h1>Tiny Planet</h1>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump<br>Click land to plant a tree · <kbd>V</kbd> orbit view · <kbd>T</kbd> fast time<br>Walk to the dark side: villages light up at night.</p>
</div>
<div id="hud" class="card"><div class="big" id="sky">☀️ Day</div><div class="small"><span id="trees">0</span> trees planted · <span id="speed">time ×1</span></div></div>

<div id="touch"><button data-key="a">◀</button><button data-key="w">▲</button><button data-key="d">▶</button><button data-key=" ">⤒</button></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
/**
 * FILE: RANDOM_dump/3d-toys/tiny-planet-world/index.html
 * PURPOSE: walkable low-poly mini planet: villages, windmill, lighthouse, boats, birds, day/night cycle, tree planting
 * UI: Tiny Planet page
 * USED BY: 3d-toys/index.html (iframe viewer)
 * KEY EXPORTS: none (standalone page)
 */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Scene > Renderer: canvas + camera + orbit controls
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 500);
camera.position.set(0, 0, 32);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false;
controls.enableDamping = true;
controls.minDistance = 14;
controls.maxDistance = 60;

const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const UPV = V(0, 1, 0);
const rand = (a, b) => a + Math.random() * (b - a);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, flatShading: true, ...o });

// Scene > Lights: sun + moon orbit planet, ambient fill
const R = 10;
const hemi = new THREE.HemisphereLight(0xdff3ff, 0x40506a, 0.6);
const sun = new THREE.DirectionalLight(0xfff0d6, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 20, far: 80 });
sun.shadow.bias = -0.0008;
const moonLight = new THREE.DirectionalLight(0x8fa8ff, 0.35);
scene.add(hemi, sun, moonLight);
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(3, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe08a }));
const moonBall = new THREE.Mesh(new THREE.SphereGeometry(1.6, 20, 12), new THREE.MeshBasicMaterial({ color: 0xe8ecff }));
scene.add(sunBall, moonBall);

// Scene > Stars: far point shell, fades in at night
const stars = new THREE.Points(
  new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array.from({ length: 2400 * 3 }, () => 0), 3)),
  new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, sizeAttenuation: true, transparent: true, depthWrite: false })
);
{
  const a = stars.geometry.attributes.position.array;
  for (let i = 0; i < a.length; i += 3) {
    const d = V(rand(-1, 1), rand(-1, 1), rand(-1, 1)).normalize().multiplyScalar(rand(180, 260));
    a[i] = d.x; a[i + 1] = d.y; a[i + 2] = d.z;
  }
}
scene.add(stars);

// World > Terrain field: seeded sine-fbm on unit sphere, sea level from percentile
const T = { seed: [0, 0, 0], sea: 0, landMax: 1, oceanMin: -1 };
function noise3(x, y, z) {
  return (Math.sin(x * 1.7 + Math.sin(z * 1.3)) * Math.sin(y * 1.9 + Math.sin(x * 1.1)) + Math.sin(z * 2.3 + Math.sin(y * 1.7)) * 0.6) / 1.6;
}
function rawElevation(d) {
  const [a, b, c] = T.seed;
  let e = 0, amp = 1, f = 1.3;
  for (let i = 0; i < 5; i++) {
    e += amp * noise3(d.x * f + a + i * 7.1, d.y * f + b - i * 3.3, d.z * f + c + i * 1.9);
    amp *= 0.5; f *= 2.05;
  }
  return e;
}
// >0 land normalized 0..1, <0 ocean normalized -1..0
function landHeight(d) {
  const e = rawElevation(d) - T.sea;
  return e >= 0 ? e / T.landMax : e / T.oceanMin;
}
function surfaceRadius(d) {
  const h = landHeight(d);
  return h >= 0 ? R + 0.08 + Math.pow(h, 1.35) * 2.6 : R - 0.05 + h * 1.6;
}
function randomDir() {
  const d = V();
  do d.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)); while (d.lengthSq() > 1 || d.lengthSq() < 0.01);
  return d.normalize();
}
function findDir(min, max, tries = 400) {
  for (let i = 0; i < tries; i++) { const d = randomDir(), h = landHeight(d); if (h >= min && h <= max) return d; }
  return null;
}

// World > Shared parts: geometry + materials reused by every build
const G = {
  trunk: new THREE.CylinderGeometry(0.05, 0.08, 0.4, 5).translate(0, 0.2, 0),
  pine: new THREE.ConeGeometry(0.28, 0.75, 6).translate(0, 0.7, 0),
  round: new THREE.IcosahedronGeometry(0.3, 0).translate(0, 0.62, 0),
  rock: new THREE.DodecahedronGeometry(0.18, 0),
  cloud: new THREE.IcosahedronGeometry(0.6, 1),
};
const M = {
  trunk: mat(0x7a5236), pine: mat(0x2f7d4a), round: mat(0x5aa84a), rock: mat(0x8b8b86), cloud: mat(0xffffff, { roughness: 1 }),
  white: mat(0xf4efe6), red: mat(0xd94f3d), dark: mat(0x3a2a20), glass: mat(0xfff4c2, { emissive: 0xffd36b, emissiveIntensity: 1.5 }),
  hull: mat(0x8a5a35), sail: mat(0xfffaf0, { side: THREE.DoubleSide }), bird: mat(0x2b2f3a, { side: THREE.DoubleSide }),
};
const ROOF_COLORS = [0xd94f3d, 0x3d6fd9, 0x8a5a35, 0x2f8f6a, 0xe0a030];
const WALL_COLORS = [0xf4efe6, 0xffe0c7, 0xf7d7e0, 0xdfeaf7];

// World > Placement: stand object on surface with local up = planet normal
function placeOn(obj, d, spin = rand(0, Math.PI * 2), sink = 0.04) {
  obj.position.copy(d).multiplyScalar(surfaceRadius(d) - sink);
  obj.quaternion.setFromUnitVectors(UPV, d);
  obj.rotateY(spin);
  return obj;
}
function makeTree(kind = Math.random() < 0.5 ? 'pine' : 'round') {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(G.trunk, M.trunk);
  const top = new THREE.Mesh(G[kind], M[kind]);
  if (kind === 'round') top.material = mat(new THREE.Color().setHSL(rand(0.22, 0.32), 0.5, rand(0.38, 0.5)));
  trunk.castShadow = top.castShadow = true;
  g.add(trunk, top);
  g.scale.setScalar(rand(0.8, 1.3));
  return g;
}

// World > Builder: planet mesh, ocean, props; rebuilt on "New world"
let world = null;
const live = { houses: [], smoke: [], blades: [], beams: [], boats: [], birds: [], clouds: null, grow: [], ocean: null, oceanBase: null, planet: null };
function buildWorld() {
  if (world) {
    scene.remove(world);
    world.traverse((o) => { if (o.geometry && !Object.values(G).includes(o.geometry)) o.geometry.dispose(); });
  }
  world = new THREE.Group();
  scene.add(world);
  Object.assign(live, { houses: [], smoke: [], blades: [], beams: [], boats: [], birds: [], grow: [] });

  T.seed = [rand(-50, 50), rand(-50, 50), rand(-50, 50)];
  const samples = Array.from({ length: 3000 }, () => rawElevation(randomDir())).sort((a, b) => a - b);
  T.sea = samples[Math.floor(samples.length * 0.42)];
  T.landMax = samples[samples.length - 1] - T.sea;
  T.oceanMin = T.sea - samples[0];

  // World > Planet: displaced icosphere, faceted vertex colors by height
  const geo = new THREE.IcosahedronGeometry(1, 34);
  const pos = geo.attributes.position, colors = new Float32Array(pos.count * 3), d = V(), c = new THREE.Color();
  const C = { deep: new THREE.Color(0xc9b27a), sand: new THREE.Color(0xf1e2a4), grass: new THREE.Color(0x86c95b), forest: new THREE.Color(0x4f9a45), rock: new THREE.Color(0x8f8577), snow: new THREE.Color(0xffffff) };
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    pos.setXYZ(i, ...d.clone().multiplyScalar(surfaceRadius(d)).toArray());
  }
  for (let f = 0; f < pos.count; f += 3) {
    d.set(0, 0, 0);
    for (let k = 0; k < 3; k++) d.add(V().fromBufferAttribute(pos, f + k));
    const h = landHeight(d.normalize()), j = rand(-0.03, 0.03);
    if (h < 0) c.copy(C.deep).multiplyScalar(1 + h * 0.4);
    else if (h < 0.03) c.copy(C.sand);
    else if (h < 0.45) c.copy(C.grass).lerp(C.forest, (h - 0.05) / 0.4);
    else if (h < 0.72) c.copy(C.rock);
    else c.copy(C.snow);
    c.offsetHSL(0, 0, j);
    for (let k = 0; k < 3; k++) colors.set([c.r, c.g, c.b], (f + k) * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const planet = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  planet.receiveShadow = planet.castShadow = true;
  world.add(planet);
  live.planet = planet;

  // World > Ocean: translucent shell with JS-driven ripples
  const og = new THREE.IcosahedronGeometry(R, 14);
  live.oceanBase = og.attributes.position.array.slice();
  live.ocean = new THREE.Mesh(og, new THREE.MeshStandardMaterial({ color: 0x3aa0e0, transparent: true, opacity: 0.78, roughness: 0.15, metalness: 0.1, flatShading: true }));
  live.ocean.receiveShadow = true;
  world.add(live.ocean);

  // World > Flora + rocks
  for (let i = 0; i < 170; i++) { const dd = findDir(0.06, 0.6); if (dd) world.add(placeOn(makeTree(landHeight(dd) > 0.3 ? 'pine' : undefined), dd)); }
  for (let i = 0; i < 50; i++) {
    const dd = findDir(0.03, 0.9); if (!dd) continue;
    const r = placeOn(new THREE.Mesh(G.rock, M.rock), dd, rand(0, 6), 0.02);
    r.scale.set(rand(0.6, 1.6), rand(0.5, 1.2), rand(0.6, 1.6)); r.castShadow = true;
    world.add(r);
  }

  // World > Villages: clusters of houses with glowing windows + chimney smoke
  for (let v = 0; v < 4; v++) {
    const center = findDir(0.08, 0.32); if (!center) continue;
    for (let k = 0; k < 4; k++) {
      const dd = center.clone().add(randomDir().multiplyScalar(0.09)).normalize();
      if (landHeight(dd) < 0.06 || landHeight(dd) > 0.5) continue;
      world.add(makeHouse(dd));
    }
  }

  // World > Landmarks: windmill on hill, lighthouse on coast
  const hill = findDir(0.32, 0.5);
  if (hill) world.add(makeWindmill(hill));
  const coast = findDir(0.02, 0.07, 2000);
  if (coast) world.add(makeLighthouse(coast));

  // World > Boats: sail around ocean, turn away from land
  for (let i = 0; i < 5; i++) {
    const dd = findDir(-1, -0.12); if (!dd) continue;
    const boat = makeBoat();
    const fwd = V().crossVectors(dd, randomDir()).normalize();
    live.boats.push({ obj: boat, up: dd, fwd, speed: rand(0.5, 0.9), bob: rand(0, 6) });
    world.add(boat);
  }

  // World > Birds: flocks circling at altitude
  for (let i = 0; i < 9; i++) {
    const bird = makeBird();
    const axis = randomDir();
    live.birds.push({ obj: bird, axis, start: V().crossVectors(axis, randomDir()).normalize(), angle: rand(0, 6), speed: rand(0.25, 0.45), r: rand(13, 14.5), flap: rand(0, 6) });
    world.add(bird);
  }

  // World > Clouds: puffs on a slowly turning shell
  live.clouds = new THREE.Group();
  for (let i = 0; i < 16; i++) {
    const cg = new THREE.Group();
    for (let j = 0; j < 4; j++) {
      const m = new THREE.Mesh(G.cloud, M.cloud);
      m.position.set(j * 0.7 - 1, rand(-0.15, 0.2), rand(-0.3, 0.3));
      m.scale.setScalar(rand(0.6, 1.1)); m.castShadow = true;
      cg.add(m);
    }
    const dd = randomDir();
    cg.position.copy(dd).multiplyScalar(rand(14.2, 15.5));
    cg.quaternion.setFromUnitVectors(UPV, dd);
    cg.scale.y = 0.7;
    live.clouds.add(cg);
  }
  live.clouds.userData.axis = randomDir();
  world.add(live.clouds);

  const start = findDir(0.1, 0.35) || V(0, 1, 0);
  player.up.copy(start);
  player.fwd.crossVectors(start, randomDir()).normalize();
  player.y = 0; player.vy = 0;
  planted = 0;
  document.getElementById('trees').textContent = 0;
}

function makeHouse(d) {
  const g = new THREE.Group();
  const wall = mat(WALL_COLORS[(Math.random() * 4) | 0]);
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.55), wall);
  body.position.y = 0.25;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.38, 4), mat(ROOF_COLORS[(Math.random() * ROOF_COLORS.length) | 0]));
  roof.position.y = 0.69; roof.rotation.y = Math.PI / 4;
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.24, 0.02), M.dark);
  door.position.set(0, 0.12, 0.28);
  const windowMat = new THREE.MeshStandardMaterial({ color: 0x334, emissive: 0xffc861, emissiveIntensity: 0 });
  for (const [x, z, ry] of [[0.18, 0.281, 0], [-0.18, 0.281, 0], [0.301, 0, Math.PI / 2], [-0.301, 0, Math.PI / 2]]) {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.12), windowMat);
    w.position.set(x, 0.3, z); w.rotation.y = ry;
    if (x === -0.301) w.rotation.y = -Math.PI / 2;
    g.add(w);
  }
  const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.25, 0.09), M.red);
  chimney.position.set(0.15, 0.78, -0.1);
  body.castShadow = roof.castShadow = true;
  g.add(body, roof, door, chimney);
  placeOn(g, d, rand(0, Math.PI * 2), 0.03);
  g.scale.setScalar(rand(0.85, 1.15));
  live.houses.push({ obj: g, up: d.clone(), windowMat });
  for (let k = 0; k < 4; k++) {
    const puff = new THREE.Mesh(G.cloud, new THREE.MeshStandardMaterial({ color: 0xdddddd, transparent: true, opacity: 0.6, flatShading: true }));
    puff.scale.setScalar(0.08);
    g.add(puff);
    live.smoke.push({ puff, t: k / 4, origin: V(0.15, 0.95, -0.1) });
  }
  return g;
}
function makeWindmill(d) {
  const g = new THREE.Group();
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.32, 1.4, 8), M.white);
  tower.position.y = 0.7;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.35, 8), M.red);
  cap.position.y = 1.55;
  const hub = new THREE.Group();
  hub.position.set(0, 1.35, 0.26);
  for (let i = 0; i < 4; i++) {
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.75, 0.02), mat(0xf6f0e0));
    blade.position.y = 0.4;
    const arm = new THREE.Group();
    arm.rotation.z = (i * Math.PI) / 2;
    arm.add(blade);
    hub.add(arm);
  }
  tower.castShadow = cap.castShadow = true;
  hub.traverse((o) => (o.castShadow = true));
  g.add(tower, cap, hub);
  live.blades.push(hub);
  return placeOn(g, d);
}
function makeLighthouse(d) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.2 - i * 0.02, 0.22 - i * 0.02, 0.4, 10), i % 2 ? M.white : M.red);
    seg.position.y = 0.2 + i * 0.4; seg.castShadow = true;
    g.add(seg);
  }
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.22, 10), M.glass);
  lamp.position.y = 1.72;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.22, 10), M.red);
  roof.position.y = 1.94;
  g.add(lamp, roof);
  const beam = new THREE.Group();
  beam.position.y = 1.72;
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(0.9, 7, 20, 1, true).translate(0, -3.5, 0).rotateZ(Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0xfff2b0, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
  );
  beam.add(cone);
  g.add(beam);
  live.beams.push({ beam, cone, up: d.clone() });
  return placeOn(g, d);
}
function makeBoat() {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.12, 0.16, 4, 1).rotateY(Math.PI / 4), M.hull);
  hull.scale.set(0.6, 1, 1.6);
  hull.position.y = 0.06;
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.6, 4), M.dark);
  mast.position.y = 0.4;
  const sailShape = new THREE.Shape([new THREE.Vector2(0, 0), new THREE.Vector2(0, 0.5), new THREE.Vector2(0.32, 0)]);
  const sail = new THREE.Mesh(new THREE.ShapeGeometry(sailShape), M.sail);
  sail.rotation.y = -Math.PI / 2; sail.position.set(0, 0.17, 0.02);
  hull.castShadow = sail.castShadow = true;
  g.add(hull, mast, sail);
  return g;
}
function makeBird() {
  const g = new THREE.Group();
  const wingGeo = new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0.1, 0, 0, -0.1, 0.35, 0, -0.05], 3));
  wingGeo.computeVertexNormals();
  const l = new THREE.Mesh(wingGeo, M.bird), r = new THREE.Mesh(wingGeo, M.bird);
  r.scale.x = -1;
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.25, 4).rotateX(Math.PI / 2), M.bird);
  g.add(l, r, body);
  g.userData.wings = [l, r];
  return g;
}

// Player > Model: little explorer with backpack + lantern
const player = { up: V(0, 1, 0), fwd: V(0, 0, 1), y: 0, vy: 0, walk: 0 };
const hero = new THREE.Group();
scene.add(hero);
const heroParts = {};
{
  const s = 0.75;
  const pants = mat(0x2d3e6b), jacket = mat(0xf08a24), skin = mat(0xf1c7a1), hat = mat(0x2f7d4a), pack = mat(0x7a5236);
  const legGeo = new THREE.BoxGeometry(0.08, 0.2, 0.09).translate(0, -0.1, 0);
  heroParts.legs = [-1, 1].map((k) => { const m = new THREE.Mesh(legGeo, pants); m.position.set(k * 0.06, 0.2, 0); hero.add(m); return m; });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.16, 3, 8), jacket);
  body.position.y = 0.36;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 10), skin);
  head.position.y = 0.6;
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.02, 14), hat);
  brim.position.y = 0.67;
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 0.1, 10), hat);
  crown.position.y = 0.72;
  const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.2, 0.1), pack);
  backpack.position.set(0, 0.4, -0.13);
  for (const k of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.015, 6, 6), M.dark);
    eye.position.set(k * 0.04, 0.62, 0.1);
    hero.add(eye);
  }
  const armGeo = new THREE.BoxGeometry(0.06, 0.2, 0.06).translate(0, -0.1, 0);
  heroParts.arms = [-1, 1].map((k) => { const m = new THREE.Mesh(armGeo, jacket); m.position.set(k * 0.16, 0.46, 0); hero.add(m); return m; });
  const lantern = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.06), mat(0xffd36b, { emissive: 0xffb84a, emissiveIntensity: 0 }));
  lantern.position.set(0, -0.24, 0);
  heroParts.arms[1].add(lantern);
  heroParts.lantern = lantern;
  heroParts.light = new THREE.PointLight(0xffc06b, 0, 5, 1.5);
  lantern.add(heroParts.light);
  hero.add(body, head, brim, crown, backpack);
  hero.traverse((o) => (o.castShadow = true));
  hero.scale.setScalar(s);
}

// Input > Keyboard + touch + buttons
const keys = {};
let followCam = true, timeScale = 1, planted = 0;
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ') { e.preventDefault(); jump(); }
  if (k === 'v') toggleView();
  if (k === 't') toggleTime();
});
addEventListener('keyup', (e) => (keys[e.key.toLowerCase()] = false));
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; if (k === ' ') jump(); });
  for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => (keys[k] = false));
}
function jump() { if (player.y <= 0.001) { player.vy = 3.4; blip(520, 0.12, 900); } }
function toggleView() {
  followCam = !followCam;
  controls.enabled = !followCam;
  if (!followCam) { camera.up.set(0, 1, 0); controls.target.set(0, 0, 0); camera.position.copy(player.up).multiplyScalar(30).add(player.fwd.clone().multiplyScalar(-8)); }
}
function toggleTime() {
  timeScale = timeScale === 1 ? 12 : 1;
  document.getElementById('speed').textContent = `time ×${timeScale}`;
}
document.getElementById('regen').onclick = () => { buildWorld(); blip(330, 0.3, 660); };
document.getElementById('timeBtn').onclick = toggleTime;
document.getElementById('viewBtn').onclick = toggleView;

// Effects > Audio: tiny blips for jump / plant
let actx;
function blip(f, dur, to) {
  actx ??= new AudioContext();
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}

// World > Click: plant growing tree on land under cursor
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', (e) => {
  // ignore drags so orbit view doesn't plant trees
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(live.planet, false)[0];
  if (!hit) return;
  const d = hit.point.clone().normalize();
  if (landHeight(d) < 0.02) { blip(200, 0.2, 120); return; }
  const tree = placeOn(makeTree(), d);
  const target = tree.scale.x;
  tree.scale.setScalar(0.001);
  world.add(tree);
  live.grow.push({ obj: tree, t: 0, target });
  planted++;
  document.getElementById('trees').textContent = planted;
  blip(440, 0.18, 880);
});

// Run engine: walk player across sphere surface
const _axis = V(), _q = new THREE.Quaternion(), _m = new THREE.Matrix4(), _right = V(), _cand = V(), _candF = V();
function updatePlayer(dt) {
  const down = (...ks) => ks.some((k) => keys[k]);
  const turn = (down('a', 'arrowleft') ? 1 : 0) - (down('d', 'arrowright') ? 1 : 0);
  const move = (down('w', 'arrowup') ? 1 : 0) - (down('s', 'arrowdown') ? 1 : 0);
  const speed = keys.shift ? 3.2 : 1.6;
  player.fwd.applyAxisAngle(player.up, turn * dt * 2.6);
  if (move) {
    _axis.crossVectors(player.up, player.fwd).normalize();
    const ang = (move * speed * dt) / R;
    _cand.copy(player.up).applyAxisAngle(_axis, ang);
    _candF.copy(player.fwd).applyAxisAngle(_axis, ang);
    // shoreline blocks walking into ocean
    if (landHeight(_cand) > 0.01) { player.up.copy(_cand); player.fwd.copy(_candF); }
    player.walk += dt * speed * 6;
  } else player.walk *= 0.85;
  player.fwd.addScaledVector(player.up, -player.fwd.dot(player.up)).normalize();
  player.vy -= 9 * dt;
  player.y = Math.max(0, player.y + player.vy * dt);
  if (player.y === 0) player.vy = Math.max(player.vy, 0);

  hero.position.copy(player.up).multiplyScalar(surfaceRadius(player.up) - 0.02 + player.y);
  _right.crossVectors(player.up, player.fwd);
  _m.makeBasis(_right, player.up, player.fwd);
  hero.quaternion.setFromRotationMatrix(_m);
  const swing = Math.sin(player.walk) * (move ? 0.7 : 0.1);
  heroParts.legs[0].rotation.x = swing; heroParts.legs[1].rotation.x = -swing;
  heroParts.arms[0].rotation.x = -swing * 0.8; heroParts.arms[1].rotation.x = swing * 0.5;
}

// Run engine: camera follows behind player, up vector = planet normal
const camGoal = V(), lookGoal = V(), lookCur = V();
function updateCamera(dt) {
  if (!followCam) { controls.update(); return; }
  camGoal.copy(hero.position).addScaledVector(player.up, 3.2).addScaledVector(player.fwd, -5);
  camera.position.lerp(camGoal, 1 - Math.exp(-dt * 3));
  camera.up.lerp(player.up, 1 - Math.exp(-dt * 4)).normalize();
  lookGoal.copy(hero.position).addScaledVector(player.up, 0.6).addScaledVector(player.fwd, 1.2);
  lookCur.lerp(lookGoal, 1 - Math.exp(-dt * 6));
  camera.lookAt(lookCur);
}

// Run engine: sun orbit, sky color from local sun elevation
let sunAngle = 0.6;
const sunDir = V(), skyCol = new THREE.Color(), C_DAY = new THREE.Color(0x9fd8ff), C_DUSK = new THREE.Color(0xff9a6b), C_NIGHT = new THREE.Color(0x0b1030);
function updateSky(dt) {
  sunAngle += dt * 0.05 * timeScale;
  sunDir.set(Math.cos(sunAngle), 0.35, Math.sin(sunAngle)).normalize();
  sun.position.copy(sunDir).multiplyScalar(50);
  moonLight.position.copy(sunDir).multiplyScalar(-50);
  sunBall.position.copy(sunDir).multiplyScalar(120);
  moonBall.position.copy(sunDir).multiplyScalar(-110);
  const ref = followCam ? player.up : V().copy(camera.position).normalize();
  const e = sunDir.dot(ref);
  if (e > 0.25) skyCol.copy(C_DAY);
  else if (e > 0) skyCol.copy(C_DUSK).lerp(C_DAY, e / 0.25);
  else skyCol.copy(C_DUSK).lerp(C_NIGHT, Math.min(-e / 0.25, 1));
  scene.background = skyCol;
  stars.material.opacity = THREE.MathUtils.clamp(-e * 3 + 0.1, 0, 1);
  hemi.intensity = 0.35 + Math.max(e, 0) * 0.6;
  const night = THREE.MathUtils.clamp(-e * 4 + 0.4, 0, 1);
  heroParts.light.intensity = night * 6;
  heroParts.lantern.material.emissiveIntensity = night * 2;
  document.getElementById('sky').textContent = e > 0.2 ? '☀️ Day' : e > -0.05 ? '🌇 Dusk' : '🌙 Night';
}

// Run engine: animate villages, landmarks, boats, birds, clouds, ocean, growing trees
function updateWorld(dt, t) {
  for (const h of live.houses) h.windowMat.emissiveIntensity = THREE.MathUtils.clamp(-sunDir.dot(h.up) * 5 + 0.3, 0, 2);
  for (const s of live.smoke) {
    s.t = (s.t + dt * 0.35) % 1;
    s.puff.position.copy(s.origin).add(V(Math.sin(s.t * 6) * 0.04, s.t * 0.9, 0));
    s.puff.scale.setScalar(0.05 + s.t * 0.14);
    s.puff.material.opacity = 0.6 * (1 - s.t);
  }
  for (const b of live.blades) b.rotation.z += dt * 1.6;
  for (const l of live.beams) {
    l.beam.rotation.y += dt * 1.4;
    l.cone.material.opacity = THREE.MathUtils.clamp(-sunDir.dot(l.up) * 0.5 + 0.03, 0, 0.16);
  }
  for (const b of live.boats) {
    const axis = V().crossVectors(b.up, b.fwd).normalize();
    const ang = (b.speed * dt) / R;
    const nu = b.up.clone().applyAxisAngle(axis, ang);
    if (landHeight(nu) > -0.06) b.fwd.applyAxisAngle(b.up, dt * 2.2);
    else { b.up.copy(nu); b.fwd.applyAxisAngle(axis, ang); }
    b.fwd.addScaledVector(b.up, -b.fwd.dot(b.up)).normalize();
    b.obj.position.copy(b.up).multiplyScalar(R + Math.sin(t * 2 + b.bob) * 0.03);
    _m.makeBasis(V().crossVectors(b.up, b.fwd), b.up, b.fwd);
    b.obj.quaternion.setFromRotationMatrix(_m);
    b.obj.rotateZ(Math.sin(t * 1.7 + b.bob) * 0.08);
  }
  for (const b of live.birds) {
    b.angle += dt * b.speed;
    const p = b.start.clone().applyAxisAngle(b.axis, b.angle);
    const ahead = b.start.clone().applyAxisAngle(b.axis, b.angle + 0.05);
    b.obj.position.copy(p).multiplyScalar(b.r);
    b.obj.up.copy(p);
    b.obj.lookAt(ahead.multiplyScalar(b.r));
    const f = Math.sin(t * 9 + b.flap) * 0.6;
    b.obj.userData.wings[0].rotation.z = f; b.obj.userData.wings[1].rotation.z = -f;
  }
  if (live.clouds) live.clouds.rotateOnAxis(live.clouds.userData.axis, dt * 0.02);
  const a = live.ocean.geometry.attributes.position.array, base = live.oceanBase;
  for (let i = 0; i < a.length; i += 3) {
    const x = base[i], y = base[i + 1], z = base[i + 2];
    const w = 1 + Math.sin(x * 1.3 + t * 1.5) * Math.cos(z * 1.1 + t) * 0.004 + Math.sin(y * 2 + t * 2) * 0.002;
    a[i] = x * w; a[i + 1] = y * w; a[i + 2] = z * w;
  }
  live.ocean.geometry.attributes.position.needsUpdate = true;
  live.ocean.geometry.computeVertexNormals();
  for (let i = live.grow.length - 1; i >= 0; i--) {
    const g = live.grow[i];
    g.t = Math.min(g.t + dt * 1.6, 1);
    // ease-out-back for springy pop
    const k = 1 + 2.2 * Math.pow(g.t - 1, 3) + 1.2 * Math.pow(g.t - 1, 2);
    g.obj.scale.setScalar(Math.max(g.target * k, 0.001));
    if (g.t >= 1) live.grow.splice(i, 1);
  }
}

// Run engine: main loop
buildWorld();
const clock = new THREE.Clock();
lookCur.copy(player.up).multiplyScalar(R);
camera.position.copy(player.up).multiplyScalar(R + 12);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updatePlayer(dt);
  updateCamera(dt);
  updateSky(dt);
  updateWorld(dt, t);
  // shadow box tracks player so nearby shadows stay crisp
  sun.target.position.copy(hero.position);
  sun.position.add(hero.position);
  sun.target.updateMatrixWorld();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
